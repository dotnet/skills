name: msbuild
description: Evaluates the dotnet/msbuild entry across build failures, performance, authoring, and routing boundaries
type: capability
defaults:
  timeout: 6m
  runs: 3
stimuli:
  - name: Diagnose a failed build from its only surviving artifact
    tags:
      capability: artifact-only-root-cause
      risk: high
      journey: diagnose-build-failure
    prompt: |
      The CI checkout is gone; failure.binlog is the only artifact available.
      Explain why this build failed and the smallest repair the repository owner
      should make. Do not search other checkouts or claim to have rebuilt the project.
    environment:
      files:
        - src: fixtures/missing-schema/Build.proj
          dest: Build.proj
      commands:
        - dotnet msbuild Build.proj -t:Build -p:Configuration=Release -p:SchemaFile=schemas/prod.json -bl:failure.binlog > capture.log 2>&1 || exit 0
        - >-
          node -e "const fs=require('fs'); const log=fs.statSync('failure.binlog');
          if (log.isFile() === false || log.size === 0) throw new Error('Expected a nonempty failure.binlog');
          if (fs.readFileSync('capture.log','utf8').includes('SCHEMA1001') === false) throw new Error('Expected build failure SCHEMA1001');
          fs.unlinkSync('Build.proj'); fs.unlinkSync('capture.log');"
    graders:
      - type: output-contains
        config:
          substring: SCHEMA1001
      - type: prompt
    rubric:
      - Identified the missing schemas/prod.json input reported by ValidateSchema in the Release build.
      - Proposed restoring the required schema or correcting the configured schema path, rather than disabling validation.
      - Distinguished the failed recorded build from any successful log inspection command.
      - Stated that a repair and rebuild could not be performed without the original checkout, without searching unrelated paths.

  - name: Capture a failing invocation without repairing it
    tags:
      capability: capture-without-repair
      risk: high
      journey: capture-build-evidence
    prompt: |
      Capture a binary log for this exact failing command and tell me the artifact
      path and original exit code:
      dotnet msbuild Build.proj -t:Build -p:Configuration=Release -p:SchemaFile=schemas/prod.json
      Do not fix or investigate the failure yet, change the project, or clean anything.
    environment:
      files:
        - src: fixtures/missing-schema/Build.proj
          dest: Build.proj
    graders:
      - type: file-exists
        config:
          path: "**/*.binlog"
      - type: file-not-exists
        config:
          path: schemas/prod.json
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              const { createHash } = require('node:crypto');
              const { spawnSync } = require('node:child_process');
              const project = fs.readFileSync('Build.proj', 'utf8').replace(/\r\n/g, '\n');
              if (createHash('sha256').update(project).digest('hex') !==
                  '48bb2afa1aaece1ad91e8f92f748354ccbbf6bcfbcf962844b12147afe77628e') {
                throw new Error('Build.proj was changed instead of only capturing the failure');
              }
              const logs = fs.readdirSync('.', { recursive: true }).filter(file =>
                file.toLowerCase().endsWith('.binlog') && fs.statSync(file).isFile() &&
                fs.statSync(file).size > 0);
              if (logs.length === 0) throw new Error('No nonempty captured binlog found');
              const capturedFailure = logs.some(file => {
                const replay = spawnSync('dotnet',
                  ['msbuild', path.resolve(file), '-nologo', '-v:diag', '-tl:off'],
                  { encoding: 'utf8', timeout: 30000, maxBuffer: 8 * 1024 * 1024 });
                if (replay.error) throw replay.error;
                if (replay.status !== 0) {
                  console.error('Cannot replay ' + file + ': ' + replay.stderr);
                  return false;
                }
                const recorded = replay.stdout + replay.stderr;
                return recorded.includes('(Build target(s))') && recorded.includes('ValidateSchema') &&
                  recorded.split(/\r?\n/).some(line => line.includes('Build.proj') &&
                    /error SCHEMA1001: Required schema 'schemas\/prod\.json' is missing for configuration 'Release'\./.test(line));
              });
              if (!capturedFailure) {
                throw new Error('No binlog records the original Build.proj SCHEMA1001 failure, schema, and Release configuration');
              }
          expected_exit_code: 0
          timeout: 2m
      - type: file-contains
        config:
          path: Build.proj
          value: Code="SCHEMA1001"
      - type: prompt
    rubric:
      - Captured a nonempty binary log while preserving the target, Release configuration, schema property, and working directory.
      - Reported a real artifact path and the nonzero exit code of the original build.
      - Left the project and missing-input condition unchanged and stopped after capture rather than diagnosing or repairing it.

  - name: Separate dependency waits from expensive compilation
    tags:
      capability: dependency-wait-attribution
      risk: high
      journey: diagnose-build-performance
    prompt: |
      A successful parallel .NET solution build took 12 seconds. Its recorded
      summary lists ResolveProjectReferences at 21 seconds across parent projects,
      while one dependency's Csc took 9 seconds. The timeline shows parents
      waiting for that dependency. Should we remove project references or turn
      off parallelism? Explain what the evidence supports and what to measure next.
      This is an advisory question; no checkout is available.
    graders:
      - type: prompt
    rubric:
      - Explained that overlapping cumulative dependency waits can exceed elapsed time and do not establish exclusive task cost or CPU utilization.
      - Followed the observed dependency compilation as a candidate bottleneck and identified missing compiler or analyzer detail.
      - Did not recommend removing required references or disabling parallelism merely because the parent target has the largest total.
      - Proposed comparing equivalent successful builds and preserving their required outputs before claiming an improvement.

  - name: Reject an unsupported build speedup claim
    tags:
      capability: comparable-build-measurements
      risk: medium
      journey: diagnose-build-performance
    prompt: |
      We changed an MSBuild setting and want to claim it cut build time in half.
      Before: dotnet build -t:Rebuild, 40 seconds, including restore.
      After: dotnet build --no-restore, 20 seconds, no source changes.
      Both succeeded. Is the claim justified? Give a minimal measurement plan;
      don't change settings, purge caches, or stop shared build servers.
    graders:
      - type: prompt
    rubric:
      - Rejected the claimed speedup because forced work, restore policy, and input state differ between the measurements.
      - Isolated the old versus new setting values while keeping invocation, restore policy, input state, configuration, and instrumentation equivalent, rather than measuring restore versus no-restore.
      - Scoped the conclusion to the measured workload and accounted for variation without inventing the unspecified setting or requiring every build scenario to be measured.
      - Avoided destructive cache clearing or shared-server shutdown as a generic prerequisite.

  - name: Assess a supported workload-specific build improvement
    tags:
      capability: supported-performance-claim
      risk: medium
      journey: review-measured-improvement
    prompt: |
      We compared the old and new values of one build setting using the same
      command, SDK, machine, configuration, source revision, restore policy,
      and recorded input edit. We alternated the setting values and restored
      the same starting output state for each successful run. The required
      outputs matched. Times were 40, 41, 39 seconds before and 20, 21, 19
      seconds after. Can we report about a 50 percent build-time reduction?
      Assess these measurements and their limits; no checkout is available.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: msbuild-supported-measurement
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              Yes, for this measured workload: median elapsed time fell from
              40 to 20 seconds, a 50 percent reduction. The matched conditions
              and outputs support attributing the observed difference to the
              setting under comparison. Three runs per setting do not establish the
              same benefit for other workloads, hosts, or cache states.
    graders:
      - type: prompt
    rubric:
      - Recognized that the supplied controls and matching outputs support an observed improvement for this workload.
      - Calculated an approximately 50 percent elapsed-time reduction without presenting it as a universal guarantee.
      - Acknowledged the small sample and limited deployment scope without rejecting the evidence merely because no checkout or additional build scenarios were supplied.
      - Answered the advisory question without claiming new measurements or requiring destructive cache or server operations.

  - name: Repair stale generation after input membership changes
    tags:
      capability: input-membership-invalidation
      risk: high
      journey: repair-incremental-build
    prompt: |
      project/Build.proj combines every Specs/*.json into obj/catalog.txt.
      Editing an existing spec works, but deleting a spec or adding a file
      with an older timestamp leaves stale entries in the catalog. Repair the
      build wiring and verify the result, including a second unchanged build.
      Keep Generator.targets and the spec files unchanged. The output must
      contain every remaining spec's content, including when none remain;
      don't force generation on every build.
    agent_environment:
      files:
        - src: fixtures/incremental
          dest: project
        - &sdk-policy
          src: ../../../global.json
          dest: global.json
    grading_environment:
      files:
        - &contract-checker
          src: graders/check-contracts.mjs
          dest: .eval/check-contracts.mjs
        - &contract-inputs
          src: graders/fixture-inputs.json
          dest: .eval/inputs.json
    golden_patch:
      path: references/incremental-membership.patch
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: msbuild-incremental-membership
        agent: { name: reference, version: "1.0.0", model_name: curated }
        notes: Curated expected steps; golden_patch and run-command independently replay the edit and verification.
        steps:
          - step_id: 1
            source: agent
            message: Track input membership without dropping the original input timestamps.
            tool_calls:
              - tool_call_id: fix-membership
                function_name: edit
                arguments:
                  path: project/Build.proj
                  old_str: '  <Target Name="GenerateCatalog" Inputs="@(Specs)" Outputs="obj\catalog.txt">'
                  new_str: |
                    <Target Name="TrackCatalogInputs">
                      <MakeDir Directories="obj" />
                      <WriteLinesToFile File="obj\catalog.inputs" Lines="@(Specs)"
                                        Overwrite="true" WriteOnlyWhenDifferent="true" />
                    </Target>
                    <Target Name="GenerateCatalog" DependsOnTargets="TrackCatalogInputs"
                            Inputs="@(Specs);obj\catalog.inputs" Outputs="obj\catalog.txt">
            observation:
              results:
                - source_call_id: fix-membership
                  content: Build.proj updated; generator and spec files unchanged.
          - step_id: 2
            source: agent
            message: Build twice and verify the initial output and unchanged skip.
            tool_calls:
              - tool_call_id: verify-membership
                function_name: powershell
                arguments:
                  command: |
                    $ErrorActionPreference = 'Stop'
                    dotnet msbuild project\Build.proj -t:Build -nologo -v:quiet
                    if ($LASTEXITCODE -ne 0) { throw 'Initial build failed' }
                    $expected = @(Get-ChildItem project\Specs -Filter *.json | Get-Content | Sort-Object)
                    $actual = @(Get-Content project\obj\catalog.txt | Sort-Object)
                    if (Compare-Object $expected $actual) { throw 'Catalog content differs' }
                    $count = @(Get-Content project\obj\generator-runs.txt).Count
                    $stamp = (Get-Item project\obj\catalog.txt).LastWriteTimeUtc
                    dotnet msbuild project\Build.proj -t:Build -nologo -v:quiet
                    if ($LASTEXITCODE -ne 0) { throw 'Unchanged build failed' }
                    if (@(Get-Content project\obj\generator-runs.txt).Count -ne $count) { throw 'Generator ran again' }
                    if ((Get-Item project\obj\catalog.txt).LastWriteTimeUtc -ne $stamp) { throw 'Catalog was rewritten' }
            observation:
              results:
                - source_call_id: verify-membership
                  content: "Exit code 0; catalog content matched and the second build preserved its timestamp and execution count."
          - step_id: 3
            source: agent
            message: |
              Updated only Build.proj. A deleted spec is no longer in @(Specs),
              so timestamp checks never see it; an older added spec supplies
              no timestamp newer than the existing output. The membership
              file records the full list and changes when either case alters
              that list, invalidating the catalog. Retaining @(Specs) in
              Inputs still catches content edits. WriteOnlyWhenDifferent
              leaves the membership timestamp stable on unchanged builds.

              Built twice: the initial catalog matched the spec contents,
              and the second unchanged build preserved the execution count
              and output timestamp. Deletion, older-file addition, missing
              output, and empty input are additional verification cases,
              not measurements claimed here. No elapsed-time improvement
              was measured.
    graders:
      - type: run-command
        config:
          command: node
          args: [.eval/check-contracts.mjs, incremental]
          expected_exit_code: 0
          timeout: 2m
      - type: prompt
    rubric:
      - Explained why timestamp checks on the current item list do not remember removed inputs or necessarily detect older added inputs.
      - Repaired input membership and content-change invalidation without altering the generator or its inputs.
      - Explained how the repair preserves complete output after deletion, older-file addition, missing output, and an empty input set while retaining unchanged-build skips; the executable grader checks those outcomes.
      - Distinguished checks actually run from proposed verification and did not claim unmeasured elapsed-time savings.

  - name: Preserve a new hook when an optional predecessor is absent
    tags:
      capability: optional-hook-composition
      risk: high
      journey: review-build-authoring
    prompt: |
      Fix project/Build.proj, which imports a hook like this:
      <Import Project="$(BeforeHook)" Condition="Exists('$(BeforeHook)')" />
      BeforeHook is set to "optional.targets;required.targets". The first file
      is absent on fresh clones; required.targets exists and must always load.
      The required hook doesn't load on those clones. Preserve optional-before-
      required ordering when optional.targets is present, and fail if the
      required file is missing. Leave required.targets and the optional hook
      definition in optional.targets.example unchanged. An aggregation file
      is fine if needed.
    agent_environment:
      files:
        - src: fixtures/hooks
          dest: project
        - *sdk-policy
    grading_environment:
      files:
        - *contract-checker
        - *contract-inputs
    golden_patch:
      path: references/hook-composition.patch
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: msbuild-hook-composition
        agent: { name: reference, version: "1.0.0", model_name: curated }
        notes: Curated expected steps; golden_patch and run-command independently replay the edit and verification.
        steps:
          - step_id: 1
            source: agent
            message: Replace the whole-list guard with distinct optional and required imports.
            tool_calls:
              - tool_call_id: fix-hooks
                function_name: edit
                arguments:
                  path: project/Build.proj
                  old_str: '  <Import Project="$(BeforeHook)" Condition="Exists(''$(BeforeHook)'')" />'
                  new_str: |
                    <Import Project="optional.targets" Condition="Exists('optional.targets')" />
                    <Import Project="required.targets" />
            observation:
              results:
                - source_call_id: fix-hooks
                  content: Build.proj updated; hook definitions unchanged.
          - step_id: 2
            source: agent
            message: Exercise all optional/required presence combinations and hook ordering.
            tool_calls:
              - tool_call_id: verify-hooks
                function_name: powershell
                arguments:
                  command: |
                    $ErrorActionPreference = 'Stop'
                    $matrix = Join-Path ([IO.Path]::GetTempPath()) ('hook-check-' + [guid]::NewGuid())
                    New-Item -ItemType Directory -Path $matrix | Out-Null
                    Copy-Item -LiteralPath global.json -Destination (Join-Path $matrix global.json)
                    try {
                      foreach ($optional in @($false, $true)) {
                        foreach ($required in @($true, $false)) {
                          $copy = Join-Path $matrix "$optional-$required"
                          Copy-Item -LiteralPath project -Destination $copy -Recurse
                          if ($optional) { Copy-Item -LiteralPath (Join-Path $copy optional.targets.example) -Destination (Join-Path $copy optional.targets) }
                          if (-not $required) { Remove-Item -LiteralPath (Join-Path $copy required.targets) }
                          $order = dotnet msbuild (Join-Path $copy Build.proj) -t:Build -getProperty:HookOrder -nologo -v:quiet
                          if ($required) {
                            if ($LASTEXITCODE -ne 0) { throw 'Valid hook configuration failed' }
                            $expected = if ($optional) { 'optional;required;' } else { 'required;' }
                            if ($order -ne $expected) { throw 'Wrong hook order' }
                          } elseif ($LASTEXITCODE -eq 0) { throw 'Missing required hook succeeded' }
                        }
                      }
                    } finally { Remove-Item -LiteralPath $matrix -Recurse -Force }
            observation:
              results:
                - source_call_id: verify-hooks
                  content: "Exit code 0; all four hook contract combinations completed."
          - step_id: 3
            source: agent
            message: |
              The condition on the combined path suppressed the required
              hook when the optional hook was absent. Each import now has
              its own contract: the optional hook runs first when present,
              and a missing required hook fails rather than silently skips.
              Builds in temporary copies passed all four combinations: required alone,
              optional then required, and explicit failure with either
              optional state when required.targets is absent. Hook files
              were left unchanged; semicolon-separated imports themselves
              are not categorically invalid.
    graders:
      - type: run-command
        config:
          command: node
          args: [.eval/check-contracts.mjs, hooks]
          expected_exit_code: 0
          timeout: 2m
      - type: prompt
    rubric:
      - Identified that the condition on the whole list can suppress the valid required import when the optional path is missing.
      - Proposed separate imports or an aggregation file with an individual guard only for the optional import.
      - Preserved optional-before-required ordering and an explicit failure when the required file is missing.
      - Covered both present and absent optional-file cases without claiming all semicolon-separated MSBuild imports are invalid.

  - name: Review framework conditions without breaking valid F sharp items
    tags:
      capability: evaluation-order-and-source-order
      risk: high
      journey: review-build-authoring
    prompt: |
      Review these build-file fragments, not the application code.
      Directory.Build.props contains:
      <PropertyGroup Condition="'$(TargetFramework)' == 'net8.0'">
        <DefineConstants>$(DefineConstants);FEATURE</DefineConstants>
      </PropertyGroup>
      <ItemGroup Condition="'$(TargetFramework)' == 'net8.0'">
        <PackageReference Include="Example.BuildAssets" Version="1.2.3" />
      </ItemGroup>
      A single-targeted App.fsproj sets TargetFramework to net8.0 in its body
      and explicitly lists Compile items in this order: Model.fsi, Model.fs,
      Program.fs. Which changes are actually needed? Keep package versions
      and compilation behavior intact.
    graders:
      - type: prompt
    rubric:
      - Identified the early property assignment as too early to observe the framework set in the project body and moved it after that assignment.
      - Recognized that item conditions evaluate after properties and did not treat the early PackageReference condition as the same timing defect.
      - Preserved the explicit F sharp source order and the adjacent signature and implementation pair.
      - Kept existing constants and package versions rather than turning the review into a broader migration.

  - name: Leave a valid packed import contract unchanged
    tags:
      capability: packed-import-contract
      risk: high
      journey: review-build-authoring
    prompt: |
      Please review this NuGet build import before I add an Exists guard.
      In the package, build/net8.0/Example.props imports
      ../../buildTransitive/net8.0/Example.props without a condition.
      The source tree only has buildTransitive/common/Example.props.
      An imported Packaging.props sets NuspecFile to
      ../../eng/packaging/Example.nuspec and NuspecBasePath to the project
      directory. There is no nuspec in the project directory or its immediate
      parent. The configured nuspec maps that source file to
      buildTransitive/net8.0/Example.props, and the produced nupkg contains it.
      The files are under project/ and the package is in project/feed/.
      Is a guard or directory reorganization needed? No changes are requested.
    agent_environment:
      files:
        - src: fixtures/packed-import
          dest: project
        - *sdk-policy
    grading_environment:
      files:
        - *contract-checker
        - *contract-inputs
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: msbuild-valid-packed-import
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              No changes are needed. The configured nuspec supplies the
              required buildTransitive/net8.0/Example.props in the package;
              the import is resolved from the packed build/net8.0 location,
              not from the source layout. Guarding it would hide a broken
              package instead of preserving the required contract.
    graders:
      - type: run-command
        config:
          command: node
          args: [.eval/check-contracts.mjs, packed-import]
          expected_exit_code: 0
          timeout: 2m
      - type: prompt
    rubric:
      - Followed the configured NuspecFile outside the project and its parent, accounted for NuspecBasePath, and resolved the import against the packed layout.
      - Recognized the required file is supplied by the package contract and left the valid import unchanged.
      - Explained that an existence guard could hide a broken package if that required file were omitted later.
      - Did not propose unrelated package upgrades or source-tree restructuring.

  - name: Keep runtime CPU profiling out of build diagnosis
    tags:
      expect_activation: "false"
      capability: runtime-profiling-boundary
      risk: medium
      journey: route-runtime-diagnostics
    prompt: |
      Our ASP.NET Core service builds successfully but consumes one CPU core
      at 100 percent while handling requests. What runtime evidence should I
      collect first? Don't change any build settings or install tools yet.
    graders:
      - type: prompt
    rubric:
      - Recognized this as runtime CPU investigation and suggested suitable runtime counters or profiling evidence.
      - Did not run a build-performance workflow, request an MSBuild binlog, modify build settings, or install tools.

  - name: Keep failing assertions out of build troubleshooting
    tags:
      expect_activation: "false"
      capability: assertion-failure-boundary
      risk: medium
      journey: route-test-failure
    prompt: |
      dotnet test built the solution successfully. One xUnit assertion failed:
      expected invoice.Total to be 12.50, actual 12.49. How should I investigate
      the rounding behavior without changing the project or test framework?
    graders:
      - type: prompt
    rubric:
      - Focused on rounding rules, decimal calculations, and the assertion rather than classifying this as a build failure.
      - Did not collect build logs, change project files, or migrate the test framework.

  - name: Keep a C sharp rename out of build authoring
    tags:
      expect_activation: "false"
      capability: source-refactoring-boundary
      risk: medium
      journey: route-source-refactoring
    prompt: |
      I need to rename a public C# method CalculateTotal to CalculateInvoiceTotal
      across a solution. What's a safe refactoring and compatibility plan?
      The projects already build; don't edit any build files.
    graders:
      - type: prompt
    rubric:
      - Recommended semantic reference updates and considered source or binary compatibility for external callers.
      - Did not turn the source refactoring into an MSBuild review, binlog capture, or project cleanup.

  - name: Keep SDK installation separate from build analysis
    tags:
      expect_activation: "false"
      capability: sdk-installation-boundary
      risk: medium
      journey: route-sdk-installation
    prompt: |
      I only want to install the .NET SDK selected by global.json on this
      machine. The file requests version 10.0.100 with rollForward set to
      latestPatch. What should I check and install? Don't build or modify the repo.
    graders:
      - type: prompt
    rubric:
      - Focused on discovering installed SDKs and installing a compatible version under the stated selection policy.
      - Did not rewrite global.json, collect a binlog, or start a build troubleshooting workflow.

  - name: Keep framework migration separate from build cleanup
    tags:
      expect_activation: "false"
      capability: framework-migration-boundary
      risk: medium
      journey: route-framework-migration
    prompt: |
      Plan an upgrade of a working ASP.NET Core app from .NET 8 to .NET 10,
      including framework and API compatibility risks. Don't edit files yet.
    graders:
      - type: prompt
    rubric:
      - Treated this as framework and API migration, including compatibility checks and application testing.
      - Did not replace the requested migration plan with MSBuild anti-pattern cleanup or build-performance experiments.

  - name: Keep legacy project conversion with the migration workflow
    tags:
      expect_activation: "false"
      capability: project-system-migration-boundary
      risk: medium
      journey: route-project-migration
    prompt: |
      I have a working non-SDK-style .NET Framework csproj using packages.config.
      I want a plan to migrate it to SDK style while retaining its framework
      and package behavior. Don't perform the migration or run builds yet.
    graders:
      - type: prompt
    rubric:
      - Recognized a project-system migration and considered packages.config assets, imports, and compatibility.
      - Did not apply generic XML cleanup, silently change frameworks or package versions, or start a build investigation.

  - name: Keep an npm failure outside MSBuild
    tags:
      expect_activation: "false"
      capability: non-msbuild-boundary
      risk: medium
      journey: route-non-msbuild-failure
    prompt: |
      npm run build fails in a Vite TypeScript application with TS2307:
      Cannot find module '@app/config'. There are no .NET projects.
      What should I inspect first?
    graders:
      - type: prompt
    rubric:
      - Focused on TypeScript module resolution, alias configuration, and file or package availability.
      - Did not suggest dotnet commands, MSBuild binary logs, or changes to nonexistent project files.
