name: csharp-expert
description: Evaluates implementation correctness and C# language and API semantics
type: capability
defaults:
  timeout: 10m
  runs: 1
stimuli:
  - name: Propagate cancellation into asynchronous work
    prompt: '`Worker.ObserveCancellationAsync` is supposed to stop promptly when its cancellation token
      is

      canceled, but the executable currently reports a failure. Fix the implementation without

      changing the validation code or weakening its timing requirement. Build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/async-cancellation
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: cancellation-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The asynchronous operation passes cancellation into the operation that is actually waiting
      - Cancellation ends the operation promptly and is surfaced as cancellation rather than success
      - The project builds and the executable prints cancellation-ok
  - name: Handle nullable lookup results explicitly
    prompt: '`UserDirectory.GetDisplayNameLength` crashes when the requested user is absent. Make the

      nullable contract honest and return zero for a missing user while preserving the existing

      result for a found user. Do not suppress nullable analysis. Build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/nullable-flow
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: nullable-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The implementation handles the possibly missing lookup result before dereferencing it
      - The fix preserves nullable annotations and does not use the null-forgiving operator to hide the risk
      - The project builds and the executable prints nullable-ok
  - name: Preserve ownership of a caller supplied stream
    prompt: '`HeaderReader.ReadFirstLine` should read the header without taking ownership of the stream

      supplied by its caller. The caller must still be able to use that stream afterward, while any

      wrapper created by the method is still cleaned up correctly. Fix it, then build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/stream-ownership
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: ownership-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The method disposes its reader without closing the caller-owned stream
      - The caller can continue reading from and writing to the stream after the method returns
      - The project builds and the executable prints ownership-ok
  - name: Give identifier objects value equality
    prompt: 'Two `Coordinate` instances with the same X and Y values represent the same identifier, but

      collection lookup currently treats them as different. Implement appropriate value semantics

      without changing the validation code. Build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/value-equality
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: equality-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - Equal coordinate values compare equal and produce compatible hash codes
      - Hash-based collection lookup succeeds for a distinct instance with the same values
      - The project builds and the executable prints equality-ok
  - name: Enforce a TryParse style port contract
    prompt: '`PortNumber.TryParse` is intended to accept decimal TCP port numbers from 1 through 65535.

      Invalid, missing, negative, and out-of-range input must return false and leave the out value at

      zero. Correct the API implementation without changing its signature or the validation code,

      then build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/api-contract
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: api-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The API accepts every valid port boundary and rejects invalid or out-of-range input
      - Failure consistently resets the out value to zero
      - The project builds and the executable prints api-ok
  - name: Make concurrent increments atomic
    prompt: '`AsyncCounter.IncrementAsync` loses updates when many operations run concurrently. Make the

      counter thread-safe while keeping the asynchronous method and its public surface intact.

      Do not serialize the validation code. Build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/concurrent-counter
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: concurrency-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - Concurrent increments cannot overwrite one another
      - The final count exactly matches the number of completed increment operations
      - The project builds and the executable prints concurrency-ok
  - name: Remove hot path allocations from word counting
    prompt: '`WordCounter.CountAsciiWords` is on a hot path. It must keep its current results for empty,

      repeated-space, and ordinary ASCII input while allocating no managed memory per call after

      warmup. Replace the allocation-heavy implementation without changing the validation thresholds.

      Build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/allocation-hot-path
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: allocation-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The word count remains correct for the supplied edge cases
      - The counting operation avoids temporary arrays, substrings, or enumerable allocations
      - The project builds and the executable stays within the allocation limit and prints allocation-ok
  - name: Leave an already correct cancellation implementation unchanged
    prompt: 'Review `LineReader.ReadNonEmptyLinesAsync`. It should return every non-empty line in order
      and

      observe cancellation through its asynchronous reads. Make changes only if the implementation

      is incorrect, then build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/already-correct
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: already-correct
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The agent recognizes that normal reads and cancellation already satisfy the requested behavior
      - The implementation is left byte-for-byte unchanged rather than rewritten without a defect
      - The project builds and the executable prints already-correct
  - name: Repair code within the configured language version
    prompt: 'The Profile property is intended to trim assigned names, but this project does not compile.

      Fix the implementation while preserving the project''s SDK, target framework, and language

      settings. Build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/language-version
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: language-version-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The property trims assigned values and the supplied executable succeeds
      - The implementation compiles under the language version already configured by the project
      - The project settings remain unchanged rather than being raised to accommodate the original syntax
  - name: Reject invalid values without hiding type evidence
    prompt: '`CodeReader.Read` should accept only string values, trim them, and return uppercase text.

      Null and non-string values must throw `ArgumentException` naming `value`. Fix the method

      without weakening compiler diagnostics or changing the validation code, then build and run it.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/error-evidence
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: error-evidence-ok
          timeout: 2m
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          timeout: 1m
      - type: exit-success
      - type: prompt
    rubric:
      - Valid strings are normalized and invalid values produce the required argument error
      - The implementation checks the runtime value before using string operations
      - Compiler and runtime evidence remain visible instead of being bypassed by an assertion, broad conversion,
        suppression, or catch-all handler
  - name: Correct percentage arithmetic without adding architecture
    prompt: '`OrderTotalCalculator.ApplyDiscount` subtracts the percentage as a currency amount instead
      of

      applying it as a percentage. Fix that calculation while keeping its public surface intact.

      Build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/focused-bug-fix
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: focused-fix-ok
          timeout: 2m
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('ICAkdGV4dCA9IFtJTy5GaWxlXTo6UmVhZEFsbFRleHQoIkltcGxlbWVudGF0aW9uLmNzIikKICBpZiAoJHRleHQgLW1hdGNoICJcYihpbnRlcmZhY2V8RmFjdG9yeXxTdHJhdGVneXxQcm92aWRlcnxSZXBvc2l0b3J5KVxiIikgeyBleGl0IDEgfQogIGV4aXQgMA=='))).Invoke()"
          expected_exit_code: 0
          timeout: 1m
      - type: exit-success
      - type: prompt
    rubric:
      - Percentage discounts produce the correct totals for the supplied cases
      - The existing calculator API remains intact
      - The fix does not add interfaces, patterns, or other abstraction without a demonstrated boundary or variation
  - name: Keep deferred file results valid after return
    prompt: '`LineFile.ReadNonEmpty` returns the expected type, but enumerating its result fails after the

      method has returned. Fix the lifetime bug without leaking file handles, then build and run the

      project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/lazy-disposal
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: lazy-disposal-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The returned sequence can be enumerated successfully after ReadNonEmpty returns
      - The result contains the non-empty lines in their original order
      - File resources have a valid, bounded lifetime rather than being disposed before deferred work or left
        open indefinitely
  - name: Leave a simple asynchronous API in its safe form
    prompt: 'Review `GreetingStore.GetGreetingAsync` for correctness and maintainability. It serves a

      low-volume configuration path and has no reported latency or allocation issue. Make changes

      only if needed, then build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/simple-safe-code
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: simple-safe-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The existing API is recognized as correct for its stated use
      - The source remains byte-for-byte unchanged rather than acquiring lifetime-sensitive or low-level machinery
        without a demonstrated need
      - The project builds and the executable prints simple-safe-ok
  - name: Evaluate a proposed optimization with runtime evidence
    prompt: 'A proposed rewrite replaces `SumLoop` with `SumSorted`, and the author says it should be

      faster because the body is shorter. Evaluate that claim using this project and recommend

      whether the rewrite should be adopted. Do not change the implementation.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/performance-review
        dest: .
    constraints:
      expect_tools:
      - bash
      reject_tools:
      - edit
      - create
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: performance-verifier-ok
          timeout: 2m
      - type: output-matches
        config:
          pattern: (?i)(slower|regression|not faster|do not adopt|do not recommend|not an improvement|avoid (the )?(rewrite|candidate)|keep (SumLoop|the loop)|reject)
      - type: output-matches
        config:
          pattern: (?i)(loop-ms|candidate-ms|ratio|milliseconds|measured|measurement)
      - type: exit-success
      - type: prompt
    rubric:
      - The response reports measured performance from the supplied representative benchmark rather than inferring it from source inspection
      - The response reports concrete observed timing evidence
      - The slower candidate is not recommended as a performance improvement
      - The implementation remains unchanged
  - name: Validate behavior on every supported target
    prompt: '`PlatformName.Current` is expected to report the runtime family selected by each target in

      this project, but one supported target reports the wrong value. Fix the implementation and

      verify the behavior on all configured target frameworks.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/multi-target-validation
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: multi-target-verifier-ok
          timeout: 3m
      - type: exit-success
      - type: prompt
    rubric:
      - Each configured target reports its own expected runtime family
      - Both target-specific executions are validated rather than relying on one green default command
      - The target framework list remains unchanged
  - name: Keep an invoice bug fix structurally focused
    prompt: '`InvoiceCalculator.DoStuff` applies a 20% reduction, but the business rule is a 10% reduction.

      Correct that defect without changing the method''s API or unrelated calculation structure.

      Build and run the project.

      '
    environment:
      files:
      - src: global.json
        dest: global.json
      - src: fixtures/bug-fix-boundary
        dest: .
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -Command "[ScriptBlock]::Create([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))).Invoke()"
          expected_exit_code: 0
          stdout_matches: bug-boundary-ok
          timeout: 2m
      - type: exit-success
      - type: prompt
    rubric:
      - The invoice total reflects the requested 10% reduction
      - The existing class and method names, signature, loop, and surrounding structure remain unchanged
      - The bug fix does not perform a rename, extraction, or modernization; the existing structure stays unchanged
  - name: Stay dormant for a behavior-preserving rename
    prompt: |
      Rename `OrderProcessor.ProcessOrderAsync` to `SubmitOrderAsync` across the
      solution. Update every call site and test, preserve the public method's
      behavior and signature apart from its name, then build and run the tests.
    expect_activation: false
    graders:
      - type: exit-success
      - type: prompt
    rubric:
      - Treats the request as a behavior-preserving C# refactoring rather than language or bug-fix work
      - Preserves behavior while propagating the symbol rename through references and tests
      - Uses binding-aware rename and build/test validation appropriate for csharp-refactoring
      - Did not apply the csharp-expert skill to the neighboring refactoring request
