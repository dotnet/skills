name: csharp-expert-coexistence
description: Evaluates routing when dotnet/skills marketplace specialists are already installed
type: capability
# Graders are shared by the target-only skilled arm and the full plugin arm. Verify installed-skill
# activation and absence of installation advice from the plugin trajectory, not a shared output guard.
defaults:
  timeout: 5m
  runs: 1
stimuli:
  - name: Invoke installed Blazor component guidance
    tags:
      capability: installed-routing
      solution: blazor
      risk: medium
      journey: create
    prompt: |
      Build a reusable editor component with parameters, a RenderFragment content slot, and an event
      callback to the parent.
    environment:
      files:
        - src: fixtures/blazor-components
          dest: .
    graders:
      - type: file-contains
        config:
          path: Components/Editor.razor
          value: '[Parameter]'
      - type: file-contains
        config:
          path: Components/Editor.razor
          value: RenderFragment
      - type: file-contains
        config:
          path: Components/Editor.razor
          value: EventCallback
      - type: run-command
        config:
          command: dotnet build
          expected_exit_code: 0
          timeout: 3m
      - type: exit-success
      - type: prompt
    rubric:
      - Completed the Blazor component task without making specialist installation a prerequisite
      - Grounded the response in the existing Razor component project

  - name: Invoke installed MAUI binding guidance
    tags:
      capability: installed-routing
      solution: maui
      risk: medium
      journey: repair
    prompt: |
      The page does not update when its view-model property changes. Fix the binding and
      notification behavior.
    environment:
      files:
        - src: fixtures/maui-binding
          dest: .
    graders:
      - type: exit-success
      - type: prompt
    rubric:
      - Completed the MAUI binding repair without making specialist installation a prerequisite
      - Recognized the MAUI project and XAML binding evidence

  - name: Invoke installed EF Core optimization guidance
    tags:
      capability: installed-routing
      solution: ef-core
      risk: high
      journey: optimize
    prompt: |
      Loading orders and their lines issues many database queries. Reduce the database work without
      changing the returned shape.
    environment:
      files:
        - src: fixtures/ef-orders
          dest: .
    graders:
      - type: exit-success
      - type: prompt
    rubric:
      - Completed the EF Core optimization without making specialist installation a prerequisite
      - Identified the repeated related-entity loading as the database concern

  - name: Invoke installed test migration guidance
    tags:
      capability: installed-routing
      solution: test
      risk: high
      journey: migrate
    prompt: |
      Convert an NUnit test project to MSTest while preserving parameterized cases and lifecycle
      hooks. Run the migrated tests.
    environment:
      files:
        - src: fixtures/nunit-migration
          dest: .
    graders:
      - type: file-not-contains
        config:
          path: "**/*.cs"
          value: NUnit
      - type: file-not-contains
        config:
          path: "**/*.csproj"
          value: NUnit
      - type: file-contains
        config:
          path: "**/*.cs"
          value: '[TestInitialize]'
      - type: file-contains
        config:
          path: "**/*.cs"
          value: '[TestCleanup]'
      - type: file-contains
        config:
          path: "**/*.cs"
          value: '[DataRow(2, 3, 6)]'
      - type: file-contains
        config:
          path: "**/*.cs"
          value: '[DataRow(-1, 1, 1)]'
      - type: run-command
        config:
          command: dotnet test
          expected_exit_code: 0
          stdout_matches: '(?i)Passed:\s+3\b'
          timeout: 3m
      - type: exit-success
      - type: prompt
    rubric:
      - Completed the NUnit-to-MSTest migration without making specialist installation a prerequisite
      - Preserved the requested test semantics and ran the migrated tests successfully

  - name: Invoke installed runtime diagnostics guidance
    tags:
      capability: installed-routing
      solution: runtime
      risk: high
      journey: diagnose
    prompt: |
      A deployed .NET service has periodic CPU spikes and allocation growth, but there is no known
      hot method yet. Collect evidence and identify the cause.
    graders:
      - type: exit-success
      - type: prompt
    rubric:
      - Provided runtime diagnostics guidance without making specialist installation a prerequisite
      - Started with evidence collection instead of speculative code optimization

  - name: Invoke installed file based CSharp guidance
    tags:
      capability: installed-routing
      solution: file-based
      risk: low
      journey: create
    prompt: |
      Create a one-file C# utility that calls an HTTP endpoint and prints selected JSON fields. Do
      not create a project.
    graders:
      - type: exit-success
      - type: prompt
    rubric:
      - Completed the file-based C# task without making specialist installation a prerequisite
      - Respected the no-project constraint

  - name: Invoke installed ASP.NET Core API guidance
    tags:
      capability: installed-routing
      solution: aspnetcore
      risk: medium
      journey: create
    prompt: |
      Add an endpoint that accepts a multipart file upload, validates the size, and streams it
      rather than buffering the whole file.
    environment:
      files:
        - src: fixtures/aspnet-minimal
          dest: .
    graders:
      - type: exit-success
      - type: prompt
    rubric:
      - Completed the ASP.NET Core endpoint task without making specialist installation a prerequisite
      - Grounded the response in the existing minimal API project

  - name: Invoke installed framework upgrade guidance
    tags:
      capability: installed-routing
      solution: dotnet
      risk: high
      journey: migrate
    prompt: |
      Upgrade a solution from net8.0 to net9.0 and handle compatibility changes across its projects.
    graders:
      - type: exit-success
      - type: prompt
    rubric:
      - Addressed the .NET 8 to .NET 9 migration without making specialist installation a prerequisite
      - Treated compatibility work as a framework upgrade rather than generic project editing
