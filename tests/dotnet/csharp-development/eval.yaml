scenarios:
  - name: "Production code review"
    prompt: |
      A caller passes a stream into this method, then tries to read from the same
      stream afterward and gets an ObjectDisposedException. Review the method for
      that bug plus any async/error-handling problems, and suggest a focused fix:
      `public async void Import(Stream stream, string? name) { using var reader =
      new StreamReader(stream); try { var text = reader.ReadToEndAsync().Result;
      if (name == null) return; _cache.Save(name, text); } catch (Exception) { } }`
    assertions:
      - type: output_matches
        pattern: "(async void|StreamReader|ObjectDisposedException|ReadToEndAsync|exception|Task)"
      - type: exit_success
    rubric:
      - "Returns an awaitable method and avoids blocking on asynchronous work"
      - "Keeps the supplied stream usable after the import completes"
      - "Reports invalid input or failures explicitly instead of silently doing nothing"
      - "Keeps the fix local and proportionate to the method"
    timeout: 120
