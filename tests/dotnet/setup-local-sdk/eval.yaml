  - name: Refuse a workload that no manifest of the band defines
    prompt: >-
      I have the 12.0.1xx daily SDK (12.0.100-alpha.1.26509.101) in ./.dotnet, the dotnet12 feed
      is in NuGet.config and the installer is in manifests update mode. ./.dotnet/dotnet workload
      install ios android maui installs ios and android from the 12.0.100-alpha.1 band, but maui
      comes out as 11.0.0-rc.1.25470.5/11.0.100-rc.1. I searched the dotnet12 feed and nuget.org:
      the only Microsoft.NET.Sdk.Maui.Manifest-* packages are for 11.0.100-rc.1 and 11.0.100-rc.2,
      none for 12.0.100-alpha.1. How do I get the .NET 12 maui workload?
    tags:
      capability: refuse-workload-absent-from-band
      risk: wrong-band-reported-as-right
      journey: try-prerelease
    constraints:
      reject_tools:
        - bash
        - powershell
        - web_fetch
    graders:
      - type: output-matches
        config:
          pattern: '(no (maui )?manifest|not (yet )?(available|published|exist)|does not (yet )?(exist|ship|publish)|has not (yet )?(moved|shipped|published|been published)|cannot (get|come|be installed)|there is no)'
      - type: output-matches
        config:
          pattern: '(bundled|fell back|fallback|older band|previous band)'
      - type: output-matches
        config:
          pattern: '(without (the )?maui|ios and android|android and ios|skip(ping)? maui|omit(ting)? maui|leave maui out|drop(ping)? maui|keep (the )?(ios|android))'
      - type: prompt
    rubric:
      - The agent concluded that no maui manifest exists for the 12.0.100-alpha.1 band
      - The agent explained that the 11.0 workload is a bundled-manifest fallback
      - The agent told the user to install only workloads that exist for the band and to check for later publication
