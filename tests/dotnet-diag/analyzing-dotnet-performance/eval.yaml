  - name: Stay dormant for algorithmic complexity design
    prompt: |
      Our route planner uses a naive recursive search over a dense graph and
      becomes unusable at 200 nodes. We need help choosing an algorithm with
      better asymptotic complexity before we tune allocations.
    expect_activation: false
    tags:
      capability: dormancy-algorithm-design
      risk: routing
      journey: choose-graph-algorithm
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "analyzing-performance-dormancy-algorithm"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Start with the route problem's constraints and choose an algorithmic model before micro-optimizing .NET API usage. For nonnegative edge weights, compare Dijkstra with an appropriate priority queue; for heuristic point-to-point routing, consider A* with an admissible heuristic. If the task is a combinatorial traveling-salesperson variant, exact search remains exponential and may require approximation or bounded dynamic programming. Measure node and edge counts, required optimality, and update frequency.
    graders:
      - type: output-matches
        config:
          pattern: '(?i)(Dijkstra|A\*|traveling.sales|dynamic programming)'
      - type: output-matches
        config:
          pattern: '(?i)(asymptotic|complexity|exponential|algorithm)'
      - type: output-not-matches
        config:
          pattern: '(?i)(FrozenDictionary|GeneratedRegex|StringComparison\.Ordinal)'
      - type: prompt
    rubric:
      - Addressed algorithm choice and asymptotic behavior before implementation micro-optimizations
      - Requested the constraints needed to choose among graph algorithms
      - Did not substitute an API anti-pattern scan for algorithm design
      - Stayed dormant instead of activating the .NET API performance scan

  - name: Stay dormant for cold startup configuration code
    prompt: |
      This console tool reads a 20-line JSON settings file once at startup and
      then spends hours processing data. A reviewer wants us to replace the
      simple LINQ used during settings validation. Is that worth doing?
    expect_activation: false
    tags:
      capability: dormancy-non-hot-path
      risk: routing
      journey: avoid-premature-optimization
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "analyzing-performance-dormancy-startup"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Probably not. The validation runs once over 20 lines and is outside the hours-long processing hot path, so replacing readable LINQ is unlikely to affect user-visible performance. Keep the clear implementation unless profiling shows startup is a requirement or validation appears in a measured trace. Spend effort on the sustained processing phase first.
    graders:
      - type: output-matches
