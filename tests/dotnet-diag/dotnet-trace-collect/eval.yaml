name: dotnet-trace-collect
description: Evaluates the dotnet-diag/dotnet-trace-collect skill
type: capability
tags:
  executionShard: medium
defaults:
  timeout: 6m
  runs: 1
stimuli:
  - name: Collect CPU evidence from a .NET 8 Kubernetes workload
    prompt: |
      A .NET 8 API in a Linux Kubernetes pod has sustained high CPU. I can
      exec into the pod, and the diagnostics utility is already available.
      Give the exact 30-second collection and copy-out commands. Do not run
      commands or change files.
    tags: { capability: kubernetes-console-cpu-collection, risk: medium, journey: capture-production-cpu-evidence }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-kubernetes-net8-cpu"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Run `dotnet-trace collect -p <PID> --duration 00:00:00:30 -o /tmp/cpu.nettrace`, then `kubectl cp <pod>:/tmp/cpu.nettrace ./cpu.nettrace`. Use the ordinary managed collector because this is .NET 8. Record UTC times, image tag, PID, and the command with the artifact. I did not execute anything.
    graders:
      - type: output-matches
        config: { pattern: '(?i)dotnet-trace\s+collect\s+-p\s+<PID>\s+--duration\s+00:00:00:30\s+-o\s+/tmp/cpu\.nettrace' }
      - type: output-matches
        config: { pattern: '(?i)kubectl\s+cp(?:\s+-n\s+\S+)?\s+(?:<namespace>/)?<pod>:/tmp/cpu\.nettrace\s+\.[\\/]cpu\.nettrace' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?(?:sudo\s+)?dotnet-trace\s+collect-linux\b' }
      - type: exit-success
      - type: prompt
    rubric:
      - Selects a collector compatible with .NET 8 and in-pod access
      - Gives bounded collection and artifact-copy commands with an explicit output path
      - Preserves useful handoff metadata without performing production actions
    constraints: { reject_tools: [bash, edit, create] }

  - name: Collect native CPU stacks on .NET 10 Linux
    prompt: |
      A .NET 10 service runs on Linux kernel 6.8. I have root access and need
      native and kernel stacks for 30 seconds. Give one exact command that
      writes /var/tmp/native-cpu.nettrace. Do not execute it.
    tags: { capability: linux-net10-native-stack-collection, risk: high, journey: capture-native-cpu-evidence }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-linux-net10-native"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Use `sudo dotnet-trace collect-linux --duration 00:00:00:30 -o /var/tmp/native-cpu.nettrace`. .NET 10, kernel 6.8, and root meet the richer collector prerequisites; it captures native stacks and kernel events. Confirm free space and retain runtime, kernel, UTC window, and command metadata. I did not execute it.
    graders:
      - type: output-matches
        config: { pattern: '(?is)(?:sudo\s+)?dotnet-trace\s+collect-linux(?=[^\r\n]*--duration\s+00:00:00:30)(?=[^\r\n]*(?:-o|--output)\s+/var/tmp/native-cpu\.nettrace)[^\r\n]*' }
      - type: output-matches
        config: { pattern: '(?i)(native|kernel).*(stack|event)' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?dotnet-trace\s+collect\s+-p\b' }
      - type: exit-success
      - type: prompt
    rubric:
      - Selects the richer Linux collector only after all prerequisites are met
      - Gives the requested bounded command and deterministic output path
      - Includes storage and handoff safeguards without execution
    constraints: { reject_tools: [bash, edit, create] }

  - name: Capture slow ASP.NET Core requests on Windows
    prompt: |
      A .NET 8 ASP.NET Core service on Windows has slow requests under load.
      I have administrator access. Give the exact collection command that
      preserves thread waits and request events with a circular buffer. Do not run it.
    tags: { capability: windows-thread-time-request-collection, risk: high, journey: capture-slow-request-evidence }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-windows-slow-requests"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              From an elevated shell use `PerfView /ThreadTime collect /BufferSizeMB:1024 /CircularMB:2048 /Providers:*Microsoft.AspNetCore.Hosting,*Microsoft-AspNetCore-Server-Kestrel`. Stop after reproducing the slow requests. Thread-time data shows waits and blocks; the providers add request lifecycle events. Do not guess an automatic stop condition. I did not execute anything.
    graders:
      - type: output-matches
        config: { pattern: '(?is)PerfView(?:\.exe)?(?=[^\r\n]*/ThreadTime)(?=[^\r\n]*\bcollect\b)(?=[^\r\n]*/BufferSizeMB:1024)(?=[^\r\n]*/CircularMB:2048)[^\r\n]*' }
      - type: output-matches
        config: { pattern: '(?i)Microsoft\.AspNetCore\.Hosting.*Microsoft-AspNetCore-Server-Kestrel' }
      - type: output-not-matches
        config: { pattern: '(?i)/StopOn(?:PerfCounter|GCEvent|Exception)' }
      - type: exit-success
      - type: prompt
    rubric:
      - Chooses Windows thread-time collection with adequate circular buffers
      - Includes ASP.NET Core request lifecycle providers
      - Avoids inventing an unsafe stop condition
    constraints: { reject_tools: [bash, edit, create] }

  - name: Capture excessive GC on .NET 8 Linux
    prompt: |
      A .NET 8 Linux service pauses frequently during garbage collection.
      PID 7312 is the target. Give one exact 45-second command that writes
      gc.nettrace and captures GC behavior. Do not execute it.
    tags: { capability: linux-gc-trace-collection, risk: medium, journey: capture-gc-pause-evidence }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-linux-net8-gc"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Use `dotnet-trace collect -p 7312 --profile gc-verbose --duration 00:00:00:45 -o gc.nettrace`. GC event data measures collections, pauses, and allocations; a memory snapshot alone cannot provide that timeline. I did not execute it.
    graders:
      - type: output-matches
        config: { pattern: '(?is)dotnet-trace\s+collect(?=[^\r\n]*(?:-p|--process-id)\s+7312)(?=[^\r\n]*--profile\s+gc-verbose)(?=[^\r\n]*--duration\s+00:00:00:45)(?=[^\r\n]*(?:-o|--output)\s+gc\.nettrace)[^\r\n]*' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?dotnet-dump\s+collect\b' }
      - type: exit-success
      - type: prompt
    rubric:
      - Selects time-based GC event collection rather than a memory snapshot
      - Uses the requested PID, duration, profile, and output path
      - Explains what evidence the artifact provides
    constraints: { reject_tools: [bash, edit, create] }

  - name: Plan evidence for gradual memory growth
    prompt: |
      A .NET 8 Linux service grows from 2 GB to 8 GB over several hours. I
      need evidence that shows which objects grow and when allocations occur.
      Give collection guidance only; do not run commands.
    tags: { capability: memory-growth-artifact-plan, risk: high, journey: plan-memory-leak-evidence }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-memory-growth-plan"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Collect two full memory dumps, one near 2 GB and one after substantial growth, through the modern .NET dump-collection workflow. During growth use `dotnet-trace collect -p <PID> --profile gc-verbose -o allocations.nettrace`. Preserve timestamps and build identity to correlate the artifacts. I did not execute anything.
    graders:
      - type: output-matches
        config: { pattern: '(?i)two\s+(?:(?:full|memory|heap|process)\s+)*dumps' }
      - type: output-matches
        config: { pattern: '(?is)dotnet-trace\s+collect(?=[^\r\n]*(?:-p|--process-id)\s+<PID>)(?=[^\r\n]*--profile\s+gc-verbose)[^\r\n]*(?:(?:-o|--output)\s+allocations\.nettrace|--duration\s+\S+)' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?dotnet-dump\s+collect\b' }
      - type: exit-success
      - type: prompt
    rubric:
      - Plans time-separated memory snapshots for retained-object comparison
      - Adds allocation and GC timeline evidence during growth
      - Keeps dump capture in the appropriate collection workflow
    constraints: { reject_tools: [bash, edit, create] }

  - name: State the .NET Framework high-CPU privilege limit
    prompt: |
      A .NET Framework 4.8 Windows service has high CPU, but I cannot get
      administrator rights. What diagnostic collection is actually possible?
      Do not run anything or suggest changing the service.
    tags: { capability: framework-no-admin-limit, risk: high, journey: avoid-unsupported-high-cpu-collection }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-framework-no-admin"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              There is no supported trace collection for this high-CPU case without administrator access. PerfView is the applicable .NET Framework CPU collector, and ETW collection requires elevation. Obtain an approved elevated session or reproduce where an administrator can collect. Dumps can help hangs or memory growth but do not replace CPU trace evidence.
    graders:
      - type: output-matches
        config: { pattern: '(?is)(?:no\s+(?:supported\s+)?trace|can(?:not|''t)\s+be\s+traced|no\s+alternative\s+trace\s+tool).{0,160}(?:without\s+(?:administrator|admin)|requires?\s+(?:administrator|admin|elevation))|without\s+(?:administrator|admin).{0,160}(?:no\s+(?:supported\s+)?trace|can(?:not|''t)\s+be\s+traced)' }
      - type: output-matches
        config: { pattern: '(?i)PerfView.*(?:administrator|admin|elevat)' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?(?:PerfView\s+collect|dotnet-trace\s+collect)\b' }
      - type: exit-success
      - type: prompt
    rubric:
      - States the real privilege limitation instead of an incompatible fallback
      - Identifies the approved prerequisite for CPU collection
      - Does not misrepresent a dump as equivalent CPU evidence
    constraints: { reject_tools: [bash, edit, create] }

  - name: Configure a symptom-triggered circular CPU capture
    prompt: |
      A Windows service has a CPU spike every few hours. Collection should stop
      when total processor use exceeds 80 percent and retain only recent
      history. Give the exact PerfView command. Do not execute it.
    tags: { capability: perfview-symptom-trigger, risk: high, journey: capture-intermittent-cpu-spike }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-perfview-cpu-trigger"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Use `PerfView collect /StopOnPerfCounter:"Processor:% Processor Time:_Total>80" /BufferSizeMB:2048 /CircularMB:4096`. The trigger fires on the spike, so recent lead-up remains in the circular buffer. Confirm disk space and use an approved elevated shell. I did not execute it.
    graders:
      - type: output-matches
        config: { pattern: '(?is)PerfView(?:\.exe)?(?=[^\r\n]*\bcollect\b)(?=[^\r\n]*/StopOnPerfCounter:"Processor:% Processor Time:_Total>80")(?=[^\r\n]*/CircularMB:\d+)[^\r\n]*' }
      - type: output-matches
        config: { pattern: '(?is)(?:(spike|symptom).*(circular|rolling|recent|lead-up)|(circular|rolling|recent|lead-up).*(spike|symptom))' }
      - type: output-not-matches
        config: { pattern: '(?i)(recovery|<\s*80).*StopOnPerfCounter' }
      - type: exit-success
      - type: prompt
    rubric:
      - Stops on the symptom rather than recovery
      - Uses a finite circular buffer for intermittent collection
      - Notes privilege and storage prerequisites
    constraints: { reject_tools: [bash, edit, create] }

  - name: Capture Linux HTTP timeout evidence
    prompt: |
      A .NET 8 Linux API intermittently times out while calling external
      services. PID 8120 is the target. Give one command that captures thread
      time plus HTTP, DNS, TLS, and socket events to network.nettrace. Do not run it.
    tags: { capability: networking-provider-collection, risk: high, journey: capture-http-timeout-evidence }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-linux-networking"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Use `dotnet-trace collect -p 8120 --profile dotnet-common,dotnet-sampled-thread-time --providers System.Net.Http,System.Net.NameResolution,System.Net.Security,System.Net.Sockets -o network.nettrace`. The explicit profile preserves runtime and thread-time data when custom providers are supplied. I did not execute it.
    graders:
      - type: output-matches
        config: { pattern: '(?i)dotnet-trace\s+collect\s+-p\s+8120\s+--profile\s+dotnet-common,dotnet-sampled-thread-time' }
      - type: output-matches
        config: { pattern: 'System\.Net\.Http,System\.Net\.NameResolution,System\.Net\.Security,System\.Net\.Sockets' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?dotnet-trace\s+collect\s+-p\s+8120\s+--providers\b' }
      - type: exit-success
      - type: prompt
    rubric:
      - Preserves thread-time and runtime profiles with custom providers
      - Includes all requested networking provider families
      - Produces a deterministic artifact path without execution
    constraints: { reject_tools: [bash, edit, create] }

  - name: Capture startup assembly binding failure
    prompt: |
      A .NET 8 Linux process exits during startup with
      ReflectionTypeLoadException before PID attachment. The executable is
      ./PluginHost. Give the exact launch-and-collect command. Do not run it.
    tags: { capability: assembly-loader-launch-collection, risk: medium, journey: capture-startup-binding-evidence }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-assembly-loader-launch"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Use `dotnet-trace collect --clrevents assemblyloader -- ./PluginHost`. This launch form captures loader and binder events from process start and avoids the PID attach race. I did not execute it.
    graders:
      - type: output-matches
        config: { pattern: '(?i)dotnet-trace\s+collect\s+--clrevents\s+assemblyloader\s+--\s+\./PluginHost' }
      - type: output-matches
        config: { pattern: '(?i)(launch|process start|attach race)' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?dotnet-trace\s+collect.*\s-p\s+<PID>' }
      - type: exit-success
      - type: prompt
    rubric:
      - Uses launch-time collection because the process exits before attachment
      - Enables loader events with the executable after the separator
      - Explains the avoided race without execution
    constraints: { reject_tools: [bash, edit, create] }

  - name: Stay dormant for an existing trace analysis request
    prompt: |
      I already have checkout.nettrace from yesterday. Inspect it and tell me
      which methods consumed the most CPU. Do not change files.
    expect_activation: false
    tags: { capability: dormancy-trace-analysis, risk: routing, journey: redirect-existing-artifact-analysis }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-dormancy-analysis"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is analysis of an existing artifact, not collection. Open checkout.nettrace in PerfView on Windows or Speedscope for a portable CPU view, then inspect CPU stacks and inclusive samples. I will not start another collection or claim findings without reading the artifact.
    graders:
      - type: output-matches
        config: { pattern: '(?is)(?:(existing artifact|analysis).*(PerfView|Speedscope)|(?:provide|share|exact)\s+(?:the\s+)?(?:full\s+)?path.*checkout\.nettrace)' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?(?:sudo\s+)?dotnet-trace\s+collect' }
      - type: exit-success
      - type: prompt
    rubric:
      - Recognizes artifact analysis and redirects appropriately
      - Does not start or recommend a new capture
      - The target collection workflow stayed dormant
    constraints: { reject_tools: [bash, edit, create] }

  - name: Stay dormant for crash dump capture
    prompt: |
      A modern .NET service is deadlocked and I need a full process dump from
      PID 4400 on Linux. Give safe capture steps only; do not run them.
    expect_activation: false
    tags: { capability: dormancy-dump-collection, risk: routing, journey: redirect-dump-capture }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-dormancy-dump-capture"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              This needs the modern .NET crash-dump collection workflow, including destination checks, a full dump for PID 4400, and reporting the resulting path. It does not need performance event collection. I will not run commands or analyze the dump.
    graders:
      - type: output-matches
        config: { pattern: '(?is)(?:(?:dump collection|crash-dump collection|full process dump|dotnet-dump\s+collect).*(?:PID\s*)?4400|(?:PID\s*)?4400.*(?:dump collection|full process dump|dotnet-dump\s+collect))' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?(?:sudo\s+)?dotnet-trace\s+collect' }
      - type: exit-success
      - type: prompt
    rubric:
      - Routes to process-dump collection without substituting tracing
      - Preserves the advisory and collection-only boundary
      - The target collection workflow stayed dormant
    constraints: { reject_tools: [bash, edit, create] }

  - name: Stay dormant for source performance review
    prompt: |
      Review this C# caching implementation for allocation hot spots and
      algorithmic mistakes. I want source findings, not production collection.
      Do not edit anything.
    expect_activation: false
    tags: { capability: dormancy-source-analysis, risk: routing, journey: redirect-source-performance-review }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-dormancy-source-review"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              This calls for a read-only source review. Inspect ownership, eviction, repeated allocations, complexity, and concurrency, then report supported findings. Production collection is not needed.
    graders:
      - type: output-matches
        config: { pattern: '(?is)(?:(source review|inspect).*(allocation|complexity|concurrency)|(?:share|provide|paste).*(?:file|code|implementation).*(?:review|analy))' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?(?:PerfView|dotnet-trace|perfcollect)\b' }
      - type: exit-success
      - type: prompt
    rubric:
      - Recognizes a source-analysis task and focuses on code evidence
      - Does not introduce production collection commands
      - The target collection workflow stayed dormant
    constraints: { reject_tools: [bash, edit, create] }

  - name: Stay dormant for development benchmarking
    prompt: |
      Compare two JSON serializers in a local .NET 9 project. Design a
      repeatable microbenchmark with warmup, payload sizes, and memory
      measurements. Do not run it or edit files.
    expect_activation: false
    tags: { capability: dormancy-benchmarking, risk: routing, journey: redirect-development-benchmark }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "trace-dormancy-benchmark"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Use BenchmarkDotNet with two serializer methods, parameterized payload sizes, standard warmup and measurement iterations, and MemoryDiagnoser. Keep setup outside measured methods and consume results. This is development benchmarking, not production collection.
    graders:
      - type: output-matches
        config: { pattern: '(?is)BenchmarkDotNet.*(MemoryDiagnoser|memory)' }
      - type: output-matches
        config: { pattern: '(?is)(?:(parameter|payload).*(warmup|measurement)|(warmup|measurement).*(parameter|payload))' }
      - type: output-not-matches
        config: { pattern: '(?im)^\s*(?:[$>]\s*)?(?:PerfView|dotnet-trace|perfcollect)\b' }
      - type: exit-success
      - type: prompt
    rubric:
      - Selects a repeatable development benchmark with allocation evidence
      - Does not redirect the task into production tracing
      - The target collection workflow stayed dormant
    constraints: { reject_tools: [bash, edit, create] }