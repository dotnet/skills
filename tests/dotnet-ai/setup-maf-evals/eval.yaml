name: setup-maf-evals
required_skills:
  - setup-maf-evals

scenarios:
  - name: scaffold-evals-tests-project-fresh
    timeout: 600
    prompt: |
      Set up evals for the agentic app at ./fixture. Wire telemetry,
      quality, and compare modes. Skip Safety, Aspire panel, and CI workflow.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
              <Project Path="MyApp.Coach/MyApp.Coach.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.AppHost/AppHost.cs
          content: |
            var builder = DistributedApplication.CreateBuilder(args);
            builder.AddAzureOpenAIChatClient("chat", "gpt-4o-mini");
            builder.Build().Run();
        - path: fixture/MyApp.Coach/MyApp.Coach.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
    assertions:
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/MyApp.Evals.Tests.csproj
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/.config/dotnet-tools.json
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/Reporting/ReportingConfig.cs
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/Wire/AgentChatClientFactory.cs
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/Quality/QualityTests.cs
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/Quality/golden.json
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/Telemetry/TelemetryTests.cs
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/Compare/CompareTests.cs
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/MyApp.Evals.Tests.csproj
        value: "Microsoft.Extensions.AI.Evaluation.Reporting"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/MyApp.Evals.Tests.csproj
        value: "Microsoft.Extensions.AI.Evaluation.NLP"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/MyApp.Evals.Tests.csproj
        value: "MSTest"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/.config/dotnet-tools.json
        value: "microsoft.extensions.ai.evaluation.console"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Reporting/ReportingConfig.cs
        value: "DiskBasedReportingConfiguration"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Quality/QualityTests.cs
        value: "BLEUEvaluator"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Quality/golden.json
        value: "reference_response"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Quality/golden.json
        value: "schema_version"
      - type: file_contains
        path: fixture/.gitignore
        value: ".copilot/perf-reports/evals/"
      - type: file_contains
        path: fixture/.gitignore
        value: "_store/"

  - name: scaffold-with-safety-tier
    timeout: 600
    prompt: |
      Add an evaluation harness for the agentic app at ./fixture, including safety evaluators.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.AppHost/AppHost.cs
          content: |
            var builder = DistributedApplication.CreateBuilder(args);
            builder.AddAzureOpenAIChatClient("chat", "gpt-4o-mini");
    assertions:
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/Safety/SafetyTests.cs
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Safety/SafetyTests.cs
        value: "ContentHarmEvaluator"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Safety/SafetyTests.cs
        value: "Assert.Inconclusive"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/MyApp.Evals.Tests.csproj
        value: "Microsoft.Extensions.AI.Evaluation.Safety"

  - name: scaffold-with-ci-workflow
    timeout: 480
    prompt: |
      Add evals for the agentic app at ./fixture, and include a GitHub Actions workflow that runs them on every PR.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.AppHost/AppHost.cs
          content: "var b = DistributedApplication.CreateBuilder(args); b.AddAzureOpenAIChatClient(\"chat\", \"gpt-4o-mini\");"
    assertions:
      - type: file_exists
        path: fixture/.github/workflows/evals.yml
      - type: file_contains
        path: fixture/.github/workflows/evals.yml
        value: "aieval report"
      - type: file_contains
        path: fixture/.github/workflows/evals.yml
        value: "upload-artifact"

  - name: ichatclient-detection-azure-openai
    timeout: 480
    prompt: |
      Add evaluation coverage for the agentic app at ./fixture.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.AppHost/AppHost.cs
          content: |
            var builder = DistributedApplication.CreateBuilder(args);
            builder.AddAzureOpenAIChatClient("chat", "gpt-4o-mini");
    assertions:
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/Wire/AgentChatClientFactory.cs
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Wire/AgentChatClientFactory.cs
        value: "AddAzureOpenAIChatClient"
      - type: output_contains
        value: "AppHost.cs"

  - name: ichatclient-detection-missing-emits-stub
    timeout: 480
    prompt: |
      Add an evaluation harness for the agentic app at ./fixture.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.AppHost/AppHost.cs
          content: "var b = DistributedApplication.CreateBuilder(args); b.Build().Run();"
    assertions:
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Wire/AgentChatClientFactory.cs
        value: "NotImplementedException"
      - type: output_contains
        value: "no registration found"

  - name: skip-when-no-app-host
    timeout: 480
    prompt: |
      Add evaluation coverage for the .NET project at ./fixture.
    setup:
      files:
        - path: fixture/PlainApi/PlainApi.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk.Web"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
    assertions:
      - type: output_contains
        value: "agentic"

  - name: update-mode-preserves-user-data
    timeout: 480
    prompt: |
      Refresh the evaluation harness for the agentic app at ./fixture. A MyApp.Evals.Tests project
      already exists with a custom rubric and golden.json. Do not overwrite either.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
              <Project Path="MyApp.Evals.Tests/MyApp.Evals.Tests.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.Evals.Tests/MyApp.Evals.Tests.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.Evals.Tests/Quality/rubric.md
          content: |
            # Custom rubric — DO NOT OVERWRITE
            - my_trait: ...
        - path: fixture/MyApp.Evals.Tests/Quality/golden.json
          content: |
            [{"id": "custom", "user_message": "preserve me", "expected_traits": ["unique"]}]
    assertions:
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Quality/rubric.md
        value: "DO NOT OVERWRITE"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Quality/golden.json
        value: "preserve me"

  - name: tier-banner-surfaces-in-chat-output
    timeout: 480
    prompt: |
      Add an evaluation harness for the agentic app at ./fixture.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.AppHost/AppHost.cs
          content: "var b = DistributedApplication.CreateBuilder(args); b.AddAzureOpenAIChatClient(\"chat\", \"gpt-4o-mini\");"
    assertions:
      - type: output_contains
        value: "EVAL_USE_REAL_AGENT"
      - type: output_contains
        value: "EVAL_USE_REAL_JUDGE"
      - type: output_contains
        value: "EVAL_USE_FOUNDRY_SAFETY"

  - name: scaffold-emits-metrics-glossary
    timeout: 480
    prompt: |
      Set up evals for the agentic app at ./fixture.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.AppHost/AppHost.cs
          content: "var b = DistributedApplication.CreateBuilder(args); b.AddAzureOpenAIChatClient(\"chat\", \"gpt-4o-mini\");"
    assertions:
      - type: file_exists
        path: fixture/MyApp.Evals.Tests/Reporting/MetricsGlossary.cs
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Reporting/MetricsGlossary.cs
        value: "metrics-glossary.md"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Reporting/AievalReport.cs
        value: "[AssemblyCleanup]"
      - type: output_contains
        value: "metrics-glossary.md"

  - name: factory-emits-friendly-secrets-diagnostic
    timeout: 480
    prompt: |
      Add evaluation coverage for the agentic app at ./fixture.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.AppHost/AppHost.cs
          content: |
            var builder = DistributedApplication.CreateBuilder(args);
            builder.AddAzureChatCompletionsClient("chat").AddChatClient("chat");
    assertions:
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Wire/AgentChatClientFactory.cs
        value: "dotnet user-secrets"
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Wire/AgentChatClientFactory.cs
        value: "ConnectionStrings"

  - name: factory-loads-user-secrets-explicitly
    timeout: 600
    prompt: |
      Set up an evaluation harness for the agentic app at ./fixture.
    setup:
      files:
        - path: fixture/MyApp.slnx
          content: |
            <Solution>
              <Project Path="MyApp.AppHost/MyApp.AppHost.csproj" />
            </Solution>
        - path: fixture/MyApp.AppHost/MyApp.AppHost.csproj
          content: |
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
        - path: fixture/MyApp.AppHost/AppHost.cs
          content: |
            var builder = DistributedApplication.CreateBuilder(args);
            builder.AddAzureChatCompletionsClient("chat").AddChatClient("chat");
    assertions:
      # Without explicit AddUserSecrets, dotnet test never reads the user-secrets store
      # because the entry assembly is testhost.exe, not the test project.
      - type: file_contains
        path: fixture/MyApp.Evals.Tests/Wire/AgentChatClientFactory.cs
        value: "AddUserSecrets"

  - name: pitfalls-doc-warns-reasoning-models-reject-max-tokens
    timeout: 180
    reject_tools: ["bash"]
    prompt: |
      I'm adding an evaluation harness to my .NET agentic app, and the agent under test
      uses a reasoning model (o1-style). What do I need to know about the
      max_tokens / MaxOutputTokens parameter so the evals don't silently break?
    assertions:
      # Assert on the agent's answer, not on out-of-sandbox repo files.
      - type: output_contains
        value: "max_completion_tokens"
      - type: output_matches
        pattern: "(?i)reasoning model"

  - name: pitfalls-doc-warns-stylistic-agents-fail-completeness
    timeout: 180
    reject_tools: ["bash"]
    prompt: |
      I'm setting up evals for my .NET agentic app. It mostly produces stylistic prose
      with no factual claims — which quality evaluators will systematically fail it, and
      how should I account for that?
    assertions:
      # Assert on the agent's answer, not on out-of-sandbox repo files.
      - type: output_contains
        value: "CompletenessEvaluator"
      - type: output_matches
        pattern: "(?i)(equivalence|rubric|drop)"

  - name: compare-mode-is-opt-in-not-default
    timeout: 180
    reject_tools: ["bash"]
    prompt: |
      I'm adding an evaluation harness to my .NET agentic app. Is compare mode
      (A/B model matrix) on by default, or is it opt-in?
    assertions:
      # Assert on the agent's answer, not on out-of-sandbox repo files.
      - type: output_matches
        pattern: "(?i)opt[- ]?in"

