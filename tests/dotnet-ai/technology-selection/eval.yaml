name: technology-selection
description: Evaluates the dotnet-ai/technology-selection skill
type: capability
tags:
  executionShard: heavy
defaults:
  timeout: 6m
  runs: 3
environment:
  commands:
    - >-
      git init -q && git config maintenance.auto false && git config gc.auto 0 &&
      git -c user.email=eval@example.com -c user.name=eval add -A &&
      git -c user.email=eval@example.com -c user.name=eval commit -qm baseline &&
      git tag eval-baseline
stimuli:
  - name: Select ML.NET for multiclass ticket classification
    prompt: >-
      Review TicketClassifier and recommend the implementation approach for
      predicting Billing, Technical, or General from the ticket CSV. Include a
      reproducible training and evaluation plan plus the safe ASP.NET Core
      serving pattern. Do not edit the project yet.
    tags:
      capability: ml-net-multiclass-selection
      risk: wrong-model-or-unsafe-serving
      journey: design-tabular-classifier
    environment:
      files:
        - { src: ./fixtures/ml-net-classification-on-tabular-data/TicketClassifier, dest: TicketClassifier }
        - { src: ./fixtures/ml-net-classification-on-tabular-data/TicketClassifier, dest: .expected/TicketClassifier }
        - { src: ./fixtures/verify-identical.mjs, dest: verify-identical.mjs }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "technology-selection-mlnet-multiclass"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: >-
              Use ML.NET (`Microsoft.ML`) for this structured multiclass
              problem, but the supplied six-row CSV is too small for a credible
              train/test estimate. Require more representative labeled data
              before reporting performance. With adequate data, create
              `MLContext(seed: 42)`, use `TrainTestSplit`, evaluate a held-out
              set with MicroAccuracy, MacroAccuracy, and LogLoss, and serve
              through `PredictionEnginePool<TInput,TOutput>`.
    graders:
      - type: output-matches
        config: { pattern: "(?i)(ML\\.?NET|Microsoft\\.ML)" }
      - type: output-matches
        config: { pattern: "(?i)(MLContext\\s*\\(\\s*seed|fixed seed|reproducible seed)" }
      - type: output-matches
        config: { pattern: "(?i)(TrainTestSplit|held[- ]out|test set)" }
      - type: output-matches
        config: { pattern: "(?i)(too (small|few)|insufficient.*(data|validation|evidence)|more (representative )?(labeled )?data|cannot.*credible)" }
      - type: output-matches
        config: { pattern: "(?i)PredictionEnginePool" }
      - type: run-command
        config:
          command: node
          args: [verify-identical.mjs, TicketClassifier, .expected/TicketClassifier]
          expected_exit_code: 0
          stdout_matches: "^PASS:"
      - type: run-command
        config:
          command: >-
            node -e "const {spawnSync}=require('child_process');
            const d=spawnSync('git',['diff','--quiet','eval-baseline','--','.']);
            const s=spawnSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'});
            if(d.status!==0||s.status!==0||s.stdout.trim())process.exit(1)"
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Selected ML.NET instead of a generative model for structured multiclass prediction
      - Recognized that the six-row fixture cannot support credible performance evidence
      - Proposed repeatable evaluation on unseen data with metrics that reveal multiclass error
      - Produced a serving design that remains safe under concurrent ASP.NET Core requests
      - Kept the project unchanged because the user requested a recommendation first
    constraints: { reject_tools: [bash, powershell, edit, create] }

  - name: Select MEAI for a single-response summarization endpoint
    prompt: >-
      Review DocSummary and propose the .NET architecture for a document
      summarization endpoint. Each request is one document in and one summary
      out, with no tools or multi-step workflow. Include reliability, model,
      and secret-handling decisions. Do not edit the project.
    tags:
      capability: meai-single-response-selection
      risk: unnecessary-orchestration-or-secret-leak
      journey: design-llm-endpoint
    environment:
      files:
        - { src: ./fixtures/llm-integration-with-meai-abstraction/DocSummary, dest: DocSummary }
        - { src: ./fixtures/llm-integration-with-meai-abstraction/DocSummary, dest: .expected/DocSummary }
        - { src: ./fixtures/verify-identical.mjs, dest: verify-identical.mjs }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "technology-selection-meai-summary"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: >-
              Use Microsoft.Extensions.AI with an injected `IChatClient`; this
              bounded prompt-response endpoint does not need an agent loop.
              Register through `AddChatClient`, set Temperature and
              MaxOutputTokens, add retry, timeout, and cancellation, pin a
              dated model, and load credentials from secure configuration.
    graders:
      - type: output-matches
        config: { pattern: "(?i)(Microsoft\\.Extensions\\.AI|IChatClient)" }
      - type: output-matches
        config: { pattern: "(?i)AddChatClient" }
      - type: output-matches
        config: { pattern: "(?i)(Temperature.*MaxOutputTokens|MaxOutputTokens.*Temperature)" }
      - type: output-matches
        config: { pattern: "(?i)retry" }
      - type: output-matches
        config: { pattern: "(?i)timeout" }
      - type: output-matches
        config: { pattern: "(?i)cancellation" }
      - type: output-not-matches
        config: { pattern: "(?i)(sk-[a-z0-9]|apiKey\\s*=)" }
      - type: run-command
        config:
          command: node
          args: [verify-identical.mjs, DocSummary, .expected/DocSummary]
          expected_exit_code: 0
          stdout_matches: "^PASS:"
      - type: run-command
        config:
          command: >-
            node -e "const {spawnSync}=require('child_process');
            const d=spawnSync('git',['diff','--quiet','eval-baseline','--','.']);
            const s=spawnSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'});
            if(d.status!==0||s.status!==0||s.stdout.trim())process.exit(1)"
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Selected an abstraction appropriate for one bounded prompt-response workflow
      - Kept provider-specific code behind dependency injection
      - Bounded generation and failure behavior, prevented secret exposure, and avoided silent model drift
      - Did not introduce agent orchestration where the request has no tools or iterative work
    constraints: { reject_tools: [bash, powershell, edit, create] }

  - name: Reject an LLM for structured churn prediction
    prompt: >-
      The product request says to use GPT to flag likely churn from Age,
      Income, Region, and PurchaseHistory in customers.csv. Review
      ChurnPredictor and recommend the technology and validation approach you
      would approve. Do not change the files.
    tags:
      capability: reject-llm-for-tabular-prediction
      risk: nondeterministic-high-cost-classifier
      journey: review-ai-technology-request
    environment:
      files:
        - { src: ./fixtures/reject-llm-for-tabular-classification/ChurnPredictor, dest: ChurnPredictor }
        - { src: ./fixtures/reject-llm-for-tabular-classification/ChurnPredictor, dest: .expected/ChurnPredictor }
        - { src: ./fixtures/verify-identical.mjs, dest: verify-identical.mjs }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "technology-selection-reject-llm"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: >-
              Do not use GPT for this tabular prediction. Use ML.NET binary
              classification with Churned as the label, but the supplied
              five-row CSV is insufficient for credible validation. Collect
              representative labeled data first. Then use a fixed seed, a
              training/test split, and held-out AUC and F1. This remains
              reproducible, local, and avoids per-request model cost.
    graders:
      - type: output-matches
        config: { pattern: "(?i)(ML\\.?NET|Microsoft\\.ML)" }
      - type: output-matches
        config: { pattern: "(?i)((do not|would not|reject).*(GPT|LLM)|(GPT|LLM).*(wrong fit|unnecessary|not appropriate))" }
      - type: output-matches
        config: { pattern: "(?i)(AUC|F1|precision|recall)" }
      - type: output-matches
        config: { pattern: "(?i)(too (small|few)|insufficient.*(data|validation|evidence)|more (representative )?(labeled )?data|cannot.*credible)" }
      - type: run-command
        config:
          command: node
          args: [verify-identical.mjs, ChurnPredictor, .expected/ChurnPredictor]
          expected_exit_code: 0
          stdout_matches: "^PASS:"
      - type: run-command
        config:
          command: >-
            node -e "const {spawnSync}=require('child_process');
            const d=spawnSync('git',['diff','--quiet','eval-baseline','--','.']);
            const s=spawnSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'});
            if(d.status!==0||s.status!==0||s.stdout.trim())process.exit(1)"
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Overrode the requested GPT choice because this is standard tabular classification
      - Recognized that the five-row fixture cannot support credible performance evidence
      - Proposed binary classification over the supplied features and label
      - Proposed validation that can estimate unseen-data performance despite the fixture's data limitations
      - Explained the decision using reproducibility, latency, or cost
    constraints: { reject_tools: [bash, powershell, edit, create] }

  - name: Select Agent Framework for a bounded tool-using workflow
    prompt: >-
      Review ResearchAgent and propose the architecture for an assistant that
      searches the web, records notes, and summarizes the findings. The workflow
      may call either tool several times. Cover loop control, observability, and
      cost containment. Do not edit the project.
    tags:
      capability: agent-framework-tool-orchestration
      risk: runaway-hand-rolled-agent-loop
      journey: design-tool-using-agent
    environment:
      files:
        - { src: ./fixtures/agentic-workflow-with-guardrails/ResearchAgent, dest: ResearchAgent }
        - { src: ./fixtures/agentic-workflow-with-guardrails/ResearchAgent, dest: .expected/ResearchAgent }
        - { src: ./fixtures/verify-identical.mjs, dest: verify-identical.mjs }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "technology-selection-agent-framework"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              `Program.cs` is only a placeholder, so add one bounded orchestration layer rather than a raw chat loop:

              1. Register the provider as an `IChatClient` through Microsoft.Extensions.AI, then construct one Microsoft Agent Framework (`Microsoft.Agents.AI`) agent.
              2. Expose WebSearch and TakeNote as described functions with typed inputs and outputs. The agent sequence is search -> evaluate results -> record useful notes -> repeat only when needed -> summarize the accumulated notes.
              3. Set `MaximumIterations`, a total token or cost budget, a wall-clock timeout, and request cancellation. Stop with a partial-results status when a limit is reached.
              4. Log the run ID, selected tool, duration, result count, token usage, and stop reason. Do not log raw queries, notes, or document text when they may be sensitive.
              5. Keep one agent unless a measured requirement needs specialization; this workflow does not justify a multi-agent topology.
    graders:
      - type: output-matches
        config: { pattern: "(?i)(Microsoft\\.Agents\\.AI|Agent Framework)" }
      - type: output-matches
        config: { pattern: "(?i)(Microsoft\\.Extensions\\.AI|IChatClient)" }
      - type: output-matches
        config: { pattern: "(?i)MaximumIterations" }
      - type: output-matches
        config: { pattern: "(?i)(token budget|cost budget|cost ceiling)" }
      - type: run-command
        config:
          command: node
          args: [verify-identical.mjs, ResearchAgent, .expected/ResearchAgent]
          expected_exit_code: 0
          stdout_matches: "^PASS:"
      - type: run-command
        config:
          command: >-
            node -e "const {spawnSync}=require('child_process');
            const d=spawnSync('git',['diff','--quiet','eval-baseline','--','.']);
            const s=spawnSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'});
            if(d.status!==0||s.status!==0||s.stdout.trim())process.exit(1)"
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Selected orchestration because the workflow has iterative tool calls
      - Kept orchestration decoupled from provider-specific business logic
      - Bounded iterations and total consumption and required safe observability
      - Produced a workflow that cannot continue indefinitely or bypass its stop conditions
    constraints: { reject_tools: [bash, powershell, edit, create] }

  - name: Decompose a PDF RAG chatbot with PostgreSQL and Blazor
    prompt: >-
      Review HelpChatbot and give me the architecture plan for a customer-help
      chatbot over the PDF files in Docs. Keep PostgreSQL for storage, a normal
      file folder for documents, and Blazor for the UI. Stop after the plan and
      do not edit or scaffold anything.
    tags:
      capability: rag-decomposition-with-user-constraints
      risk: invented-infrastructure-or-package
      journey: plan-document-chatbot
    environment:
      files:
        - { src: ./fixtures/natural-language-scenario-decomposition-rag-chatbot/HelpChatbot, dest: HelpChatbot }
        - { src: ./fixtures/natural-language-scenario-decomposition-rag-chatbot/HelpChatbot, dest: .expected/HelpChatbot }
        - { src: ./fixtures/verify-identical.mjs, dest: verify-identical.mjs }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "technology-selection-rag-postgres"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: >-
              Ingestion reads PDFs from the folder, semantically chunks them,
              generates embeddings through IEmbeddingGenerator, and stores
              vectors plus source metadata through Microsoft.Extensions.VectorData
              and pgvector. Query filters by a minimum similarity score and
              sends grounded chunks to IChatClient with citations. Keep Blazor
              as the UI.
    graders:
      - type: output-matches
        config: { pattern: "(?i)(IEmbeddingGenerator|Microsoft\\.Extensions\\.AI)" }
      - type: output-matches
        config: { pattern: "(?i)(Microsoft\\.Extensions\\.VectorData|pgvector)" }
      - type: output-matches
        config: { pattern: "(?i)((semantic|paragraph).*(chunk|split)|(chunk|split).*(semantic|paragraph))" }
      - type: output-matches
        config: { pattern: "(?i)Blazor" }
      - type: run-command
        config:
          command: node
          args: [verify-identical.mjs, HelpChatbot, .expected/HelpChatbot]
          expected_exit_code: 0
          stdout_matches: "^PASS:"
      - type: run-command
        config:
          command: >-
            node -e "const {spawnSync}=require('child_process');
            const d=spawnSync('git',['diff','--quiet','eval-baseline','--','.']);
            const s=spawnSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'});
            if(d.status!==0||s.status!==0||s.stdout.trim())process.exit(1)"
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Decomposed ingestion, vector retrieval, grounded generation, and UI
      - Preserved PostgreSQL, the document folder, and Blazor
      - Produced relevant, attributable grounded answers without inventing replacement infrastructure
      - Produced only a plan and made no workspace changes
    constraints: { reject_tools: [bash, powershell, edit, create] }

  - name: Plan incremental RAG indexing without stale vectors
    prompt: >-
      Review ProductQA and design the ingestion and query pipeline for the
      markdown files in Docs. The folder changes weekly: documents are added,
      edited, renamed, and deleted. I only want a plan, not code or project
      edits. Explain how the index avoids stale vectors, repeated embedding
      work, duplicate context, and irrelevant retrieval.
    tags:
      capability: incremental-rag-index-reconciliation
      risk: stale-duplicate-or-wasteful-rag
      journey: design-changing-document-index
    environment:
      files:
        - { src: ./fixtures/rag-pipeline-with-vector-search/ProductQA, dest: ProductQA }
        - { src: ./fixtures/rag-pipeline-with-vector-search/ProductQA, dest: .expected/ProductQA }
        - { src: ./fixtures/verify-identical.mjs, dest: verify-identical.mjs }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "technology-selection-rag-incremental"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Use two explicit pipelines:

              **Ingestion:** maintain a manifest with stable source identity, current path, normalized-content hash, chunk hashes, and index generation. Parse headings and paragraphs into semantic chunks. Use hashes as embedding-cache keys, not as the sole document identity, so duplicate files remain distinct. A rename with unchanged content updates path metadata without re-embedding; changed chunks are re-embedded, and deleted sources remove orphan vectors. Build a complete new generation and switch it atomically.

              **Query:** embed the question once, retrieve a bounded top-k set, deduplicate duplicate context, and discard hits below a configured minimum similarity score. Build the `IChatClient` prompt only from the surviving chunks and require source IDs in the response. If no hit clears the threshold, return a no-grounded-answer result rather than asking the model to guess.

              Persisted chunk hashes form the embedding cache and invalidation key, so unchanged content is never re-embedded. Return document and section citations with each answer. This is an architecture-only request; no project files need to change.
    graders:
      - type: output-matches
        config: { pattern: "(?i)((semantic|paragraph).*(chunk|split)|(chunk|split).*(semantic|paragraph))" }
      - type: output-matches
        config: { pattern: "(?i)(minimum similarity|similarity threshold|score threshold)" }
      - type: output-matches
        config: { pattern: "(?i)((cache|persist).*(embedding)|(embedding).*(cache|persist))" }
      - type: output-matches
        config: { pattern: "(?i)(source attribution|citation|source identifiers?)" }
      - type: output-matches
        config: { pattern: "(?i)(delete|removed|reconcile|tombstone|stale vector)" }
      - type: output-matches
        config: { pattern: "(?i)(hash|content fingerprint|checksum)" }
      - type: output-matches
        config: { pattern: "(?i)(stable source|source identity|document identity)" }
      - type: output-matches
        config: { pattern: "(?i)(rename).*(without|avoid|not).*(re-?embed)|(update.*path metadata)" }
      - type: output-matches
        config: { pattern: "(?i)(atomic|generation switch|snapshot switch)" }
      - type: output-matches
        config: { pattern: "(?i)(deduplicat|duplicate context)" }
      - type: run-command
        config:
          command: node
          args: [verify-identical.mjs, ProductQA, .expected/ProductQA]
          expected_exit_code: 0
          stdout_matches: "^PASS:"
      - type: run-command
        config:
          command: >-
            node -e "const {spawnSync}=require('child_process');
            const d=spawnSync('git',['diff','--quiet','eval-baseline','--','.']);
            const s=spawnSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'});
            if(d.status!==0||s.status!==0||s.stdout.trim())process.exit(1)"
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Covered both ingestion and query-time retrieval
      - Preserved document meaning during ingestion and excluded irrelevant context at query time
      - Reconciled added, changed, renamed, and deleted documents without leaving stale vectors
      - Reused unchanged embeddings and prevented duplicate retrieved context
      - Preserved source metadata for citations
      - Honored the plan-only request without modifying the project
    constraints: { reject_tools: [bash, powershell, edit, create] }

  - name: Select ONNX Runtime for an existing model artifact
    prompt: >-
      Review ModelHost. The vision team already supplies a versioned
      classifier.onnx file and preprocessing contract; this service only needs
      low-latency production inference. Recommend the .NET integration and
      lifecycle safeguards. Do not edit the project.
    tags:
      capability: onnx-production-inference-selection
      risk: per-request-model-load-or-contract-drift
      journey: integrate-pretrained-model
    environment:
      files:
        - { src: ./fixtures/onnx-inference/ModelHost, dest: ModelHost }
        - { src: ./fixtures/onnx-inference/ModelHost, dest: .expected/ModelHost }
        - { src: ./fixtures/verify-identical.mjs, dest: verify-identical.mjs }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "technology-selection-onnx"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: >-
              Use Microsoft.ML.OnnxRuntime. Validate input and output names,
              types, and dimensions at startup, including `pixels` shaped
              `[1,3,224,224]` and `probabilities` shaped `[1,12]`. Register and
              warm one InferenceSession through DI, bound input and batch
              sizes, dispose native-backed results, and pin the model artifact
              version with its preprocessing contract.
    graders:
      - type: output-matches
        config: { pattern: "(?i)(Microsoft\\.ML\\.OnnxRuntime|ONNX Runtime)" }
      - type: output-matches
        config: { pattern: "(?i)InferenceSession" }
      - type: output-matches
        config: { pattern: "(?i)((input|output).*(name|type|dimension|shape)|(name|type|dimension|shape).*(input|output))" }
      - type: output-matches
        config: { pattern: "(?i)((single|singleton|reuse|one).*(session)|(session).*(single|singleton|reuse|one))" }
      - type: output-matches
        config: { pattern: "(?i)pixels" }
      - type: output-matches
        config: { pattern: "(?i)probabilities" }
      - type: output-matches
        config: { pattern: "(?i)224" }
      - type: output-matches
        config: { pattern: "(?i)(dispose|using).*(result|native)|(result|native).*(dispose|using)" }
      - type: output-matches
        config: { pattern: "(?i)(bound|limit).*(input|batch)|(input|batch).*(bound|limit)" }
      - type: output-matches
        config: { pattern: "(?i)(artifact|model).*(version|pin)|(version|pin).*(artifact|model)" }
      - type: run-command
        config:
          command: node
          args: [verify-identical.mjs, ModelHost, .expected/ModelHost]
          expected_exit_code: 0
          stdout_matches: "^PASS:"
      - type: run-command
        config:
          command: >-
            node -e "const {spawnSync}=require('child_process');
            const d=spawnSync('git',['diff','--quiet','eval-baseline','--','.']);
            const s=spawnSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8'});
            if(d.status!==0||s.status!==0||s.stdout.trim())process.exit(1)"
          expected_exit_code: 0
      - type: exit-success
      - type: prompt
    rubric:
      - Selected ONNX Runtime because the model is already trained and exported
      - Detected model-contract incompatibility before traffic and avoided repeated model-load overhead
      - Addressed native-resource disposal, bounded inputs, and artifact versioning
      - Did not propose training a replacement model inside the service
    constraints: { reject_tools: [bash, powershell, edit, create] }

  - name: Select OllamaSharp for an offline field assistant
    prompt: >-
      Review FieldAssistant. It must summarize maintenance notes on laptops that
      may be disconnected for weeks, and policy forbids sending notes to a cloud
      service. Recommend the .NET client architecture and local runtime
      safeguards. Do not edit the project.
    tags:
      capability: offline-llm-selection
      risk: privacy-breach-or-unbounded-local-load
      journey: design-air-gapped-assistant
    environment:
      files:
        - { src: ./fixtures/offline-llm/FieldAssistant, dest: FieldAssistant }
        - { src: ./fixtures/offline-llm/FieldAssistant, dest: .expected/FieldAssistant }
        - { src: ./fixtures/verify-identical.mjs, dest: verify-identical.mjs }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "technology-selection-ollama"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: >-
              Use OllamaSharp behind Microsoft.Extensions.AI and IChatClient.
              Configure the endpoint and model outside code, verify the model is
              installed before serving, and set prompt, output-token, timeout,
              cancellation, memory, and concurrency limits. Measure latency and
              memory on the target 16 GB laptops. Because policy forbids cloud
              transmission, fail cleanly when the local model is unavailable;
              do not add a cloud fallback.
    graders:
      - type: output-matches
        config: { pattern: "(?i)OllamaSharp" }
      - type: output-matches
        config: { pattern: "(?i)(Microsoft\\.Extensions\\.AI|IChatClient)" }
      - type: output-matches
        config: { pattern: "(?i)((verify|check).*(model).*(installed|present|available))" }
      - type: output-matches
        config: { pattern: "(?i)(timeout|cancellation|memory|concurrency|token)" }
      - type: output-matches
        config: { pattern: "(?i)(16\\s*GB|target (laptop|hardware))" }
      - type: output-matches
        config: { pattern: "(?i)(fail|unavailable|not installed).*(model)|(model).*(fail|unavailable|not installed)" }
      - type: output-matches
        config: { pattern: "(?i)(no cloud|do not.*cloud|without.*cloud|cloud fallback.*(not|never))" }
      - type: run-command
