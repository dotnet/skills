    environment:
      files:
        - { src: ./fixtures/already-correct-meai/CorrectSummary, dest: CorrectSummary }
        - { src: ./fixtures/already-correct-meai/CorrectSummary, dest: .expected/CorrectSummary }
        - { src: ./fixtures/verify-identical.mjs, dest: verify-identical.mjs }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "technology-selection-noop"
