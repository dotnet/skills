name: select-agent-models
required_skills:
  - select-agent-models

scenarios:
  - name: recommend-mode-three-agent-app
    prompt: |
      Run select-agent-models on the project at ./fixture in recommend mode.
      Do not edit any files; produce only the recommendation file.
    setup:
      files:
        - path: fixture/MyApp.AppHost/Program.cs
          content: |
            var builder = DistributedApplication.CreateBuilder(args);
            var openai = builder.AddConnectionString("openai");
            builder.AddProject<Projects.MyApp_Router>("router").WithReference(openai);
            builder.AddProject<Projects.MyApp_Planner>("planner").WithReference(openai);
            builder.AddProject<Projects.MyApp_Worker>("worker").WithReference(openai);
            builder.Build().Run();
        - path: fixture/MyApp.Router/Program.cs
          content: |
            // role: router — picks the next agent based on user intent
            builder.Services.AddSingleton<IChatClient>(sp =>
                new ChatClient(model: "gpt-4o", apiKey: "..."));
        - path: fixture/MyApp.Planner/Program.cs
          content: |
            // role: planner — decomposes the user task
            builder.Services.AddSingleton<IChatClient>(sp =>
                new ChatClient(model: "gpt-4o-mini", apiKey: "..."));
        - path: fixture/MyApp.Worker/Program.cs
          content: |
            // role: worker — runs the task steps
            builder.Services.AddSingleton<IChatClient>(sp =>
                new ChatClient(model: "gpt-4o", apiKey: "..."));
    assertions:
      - type: file_exists
        path: fixture/.copilot/perf-reports/latest-model-plan.md
      - type: file_contains
        path: fixture/.copilot/perf-reports/latest-model-plan.md
        text: "## Per-agent recommendations"
      - type: file_contains
        path: fixture/.copilot/perf-reports/latest-model-plan.md
        text: "router"
      - type: file_contains
        path: fixture/.copilot/perf-reports/latest-model-plan.md
        text: "planner"
      - type: file_contains
        path: fixture/.copilot/perf-reports/latest-model-plan.md
        text: "worker"

  - name: recommend-flags-single-model-defaulting
    prompt: |
      Run select-agent-models on the project at ./fixture in recommend mode.
    setup:
      files:
        - path: fixture/AllSame.AppHost/Program.cs
          content: |
            var builder = DistributedApplication.CreateBuilder(args);
            builder.AddProject<Projects.A>("a"); builder.AddProject<Projects.B>("b");
            builder.AddProject<Projects.C>("c");
            builder.Build().Run();
        - path: fixture/AllSame.AppHost/appsettings.json
          content: |
            { "a-model": "gpt-4o-mini", "b-model": "gpt-4o-mini", "c-model": "gpt-4o-mini" }
    assertions:
      - type: file_exists
        path: fixture/.copilot/perf-reports/latest-model-plan.md
      - type: output_contains
        text: "single"

  - name: aborts-on-single-agent
    prompt: |
      Run select-agent-models on the project at ./fixture in recommend mode.
    setup:
      files:
        - path: fixture/Solo.AppHost/Program.cs
          content: |
            var builder = DistributedApplication.CreateBuilder(args);
            builder.AddProject<Projects.OnlyOne>("only");
            builder.Build().Run();
    assertions:
      - type: output_contains
        text: "single-agent"

  - name: apply-mode-requires-confirmation
    prompt: |
      Run select-agent-models on the project at ./fixture in apply mode.
      Do NOT confirm the diff — respond "no" if asked.
    setup:
      files:
        - path: fixture/MyApp.AppHost/appsettings.json
          content: |
            { "router-model": "gpt-4o", "planner-model": "gpt-4o-mini", "worker-model": "gpt-4o" }
        - path: fixture/MyApp.AppHost/Program.cs
          content: |
            var builder = DistributedApplication.CreateBuilder(args);
            builder.AddProject<Projects.Router>("router");
            builder.AddProject<Projects.Planner>("planner");
            builder.AddProject<Projects.Worker>("worker");
            builder.Build().Run();
    assertions:
      - type: file_contains
        path: fixture/MyApp.AppHost/appsettings.json
        text: "gpt-4o"
      - type: output_contains
        text: "diff"
