name: optimizing-ef-core-queries
description: Evaluates the dotnet-data/optimizing-ef-core-queries skill
type: capability
config:
  timeout: 20m
# Each performance stimulus stages the shared EF Core + BenchmarkDotNet harness in
# tests/dotnet-data/optimizing-ef-core-queries/fixtures. The agent edits one
# Scenarios/<Scenario>.cs file; the matching, never-edited Benchmarks/<Scenario>Benchmark.cs
# compares the agent's version against the preserved slow baseline over the shared
# model, DbContext and BenchmarkConfig, and prints a machine-readable
# "RESULT ... improved=True" line only when the rewrite returns the SAME data (an
# equivalence guard enforces correctness) and is at least 10% faster than the
# baseline — i.e. the optimized mean is <= 90% of the baseline mean, per the
# ImprovementThreshold in Shared/ResultReporter.cs.
#
# Every performance scenario is chosen so the obvious fix a strong model reaches
# for without the skill (AsNoTracking, a projection, or "add an index") does NOT
# clear the 10% bar — only the skill's non-obvious technique (compile the hot
# query; make the predicate sargable) does. The scenario comments and prompts
# describe the symptom only; they do not name the fix.
stimuli:
  - name: Speed up a hot primary-key lookup called on every request
    prompt: |
      This is a self-contained EF Core 10 + SQLite benchmark project. A product lookup sits on a
      very hot path — it is called hundreds of times per request against one warmed-up, reused
      DbContext — and it is slower than such a simple query should be.

      The code is in `HotLookupSolution.Lookup` (`Scenarios/HotLookup.cs`). Improve the EF Core
      data-access path perf while returning the SAME result without changing the method name,
      signature, or results. The query is already a minimal primary-key lookup projected to a small
      DTO, so the usual read-only tweaks will not move it — look deeper.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *HotLookupBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Scenarios
          dest: Scenarios
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *HotLookupBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - "Recognizes the cost is EF Core re-translating the same LINQ query on every call over a reused context, not the SQL itself"
      - "Rules out the obvious read-only tweaks (AsNoTracking, projection) as no-ops here because the query is already a minimal, non-tracked projection"
      - "Compiles the query once with EF.CompileQuery/EF.CompileAsyncQuery and reuses the delegate on every call"
      - "The rewritten HotLookupSolution.Lookup returns the same ProductListItem as the original"
      - "The HotLookupBenchmark reports improved=True (a real, measured speed-up over the baseline)"

  - name: Speed up a hot per-customer aggregate summary
    prompt: |
      This is a self-contained EF Core 10 + SQLite benchmark project. A per-customer order summary
      sits on a very hot path — it is called hundreds of times against one warmed-up, reused
      DbContext — and it is slow in aggregate.

      The code is in `HotAggregateSolution.Summary` (`Scenarios/HotAggregate.cs`). Improve the
      EF Core data-access path perf while returning the SAME record without changing the method
      name, signature, or results. The query already aggregates server-side and projects a small
      record, and the result is never change-tracked, so the usual read-only tweaks will not move
      it — look deeper.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *HotAggregateBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Scenarios
          dest: Scenarios
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *HotAggregateBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - "Recognizes the cost is EF Core re-translating the same aggregate LINQ query (with its Count/Sum subqueries) on every call over a reused context"
      - "Rules out AsNoTracking and further projection as no-ops here because the result is already a small, non-tracked record"
      - "Compiles the query once with EF.CompileQuery/EF.CompileAsyncQuery and reuses the delegate on every call"
      - "The rewritten HotAggregateSolution.Summary returns the same CustomerOrderSummary as the original"
      - "The HotAggregateBenchmark reports improved=True (a real, measured speed-up over the baseline)"

  - name: Fix a yearly-audit query that scans an already-indexed column
    prompt: |
      This is a self-contained EF Core 10 + SQLite benchmark project. A query that lists audit-log
      ids written in a given year is slow: it scans the whole table even though `AuditLog.CreatedAt`
      is already indexed (the benchmark builds the database with that index in place).

      The code is in `SargableDateSolution.Run` (`Scenarios/SargableDate.cs`). Improve the EF Core
      data-access path perf while returning the SAME ids without changing the method name,
      signature, or results. The index already exists, so adding another one will not help — make
      the query able to use the index that is already there.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *SargableDateBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Scenarios
          dest: Scenarios
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *SargableDateBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - "Identifies the predicate as non-sargable: wrapping CreatedAt in a function (.Year) forces a per-row computation the index cannot satisfy, so the table scans"
      - "Recognizes that adding another index is a no-op because the column is already indexed and the function is what blocks the seek"
      - "Rewrites the filter to keep CreatedAt bare, using a half-open date range so the existing index can seek"
      - "The rewritten SargableDateSolution.Run returns the same ids as the original"
      - "The SargableDateBenchmark reports improved=True (a real, measured speed-up over the baseline)"

  - name: Fix a per-day orders query that scans an already-indexed column
    prompt: |
      This is a self-contained EF Core 10 + SQLite benchmark project. A query that lists order ids
      placed on a given day is slow: it scans every row even though `Order.CreatedAt` is already
      indexed (the benchmark builds the database with that index in place).

      The code is in `SargableDaySolution.Run` (`Scenarios/SargableDay.cs`). Improve the EF Core
      data-access path perf while returning the SAME ids without changing the method name,
      signature, or results. The index already exists, so adding another one will not help — make
      the query able to use the index that is already there.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *SargableDayBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Scenarios
          dest: Scenarios
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *SargableDayBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - "Identifies the predicate as non-sargable: truncating CreatedAt with .Date forces a per-row computation the index cannot satisfy, so the table scans"
      - "Recognizes that adding another index is a no-op because the column is already indexed and the truncation is what blocks the seek"
      - "Rewrites the filter to keep CreatedAt bare, using a half-open day range [day, day+1) so the existing index can seek"
      - "The rewritten SargableDaySolution.Run returns the same ids as the original"
      - "The SargableDayBenchmark reports improved=True (a real, measured speed-up over the baseline)"

  - name: Stay dormant for a Dapper database-side tuning question
    prompt: |
      I am using Dapper (not EF Core) with hand-written SQL. This query against a schema owned by
      our DBA is slow:

      ```csharp
      var rows = connection.Query<Order>(
          "SELECT * FROM Orders WHERE CustomerId = @id ORDER BY CreatedAt DESC", new { id });
      ```

      How can I speed this up on the database side?
    expect_activation: false
    graders:
      - type: output-matches
        config:
          pattern: (Dapper|index|execution plan|SQL)
      - type: exit-success
      - type: prompt
    rubric:
      - "Answers the Dapper/database-side question directly (e.g. indexing CustomerId/CreatedAt, checking the execution plan, selecting only needed columns, parameterization) without pivoting to EF Core"
      - "Does not recommend EF Core-specific APIs such as AsNoTracking, Include, AsSplitQuery, EF.CompileQuery, or a DbContext"
      - "Recognizes this is outside an EF Core query-optimization scope since the code uses Dapper and the schema is DBA-managed"
