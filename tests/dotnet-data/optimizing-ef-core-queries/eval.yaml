  - name: Review saved order search implementation
    prompt: |
      Review this application's EF Core implementation of saved order searches. The application
      uses EF Core 10 with SQL Server. Users combine the supported filters with their own values;
      the same search layouts are used throughout the day across many tenants and customer codes.
      The UI needs both the first page and the exact matching total. Support activity feeds also
      use the same layouts frequently across many customer codes.

      Recommend source-supported performance or correctness improvements that preserve the
      search results and endpoint contracts. Include locations, likely impact, and remedies,
      distinguishing nearby sound paths. Use source-browsing tools only; do not edit files or run
      shell commands, code, tests, builds, benchmarks, or analyzers.
    tags:
      capability: dynamic-query-review
      risk: medium
      journey: saved-search-rollout
    environment:
      files:
        - src: fixtures/saved-search
          dest: .
        - *validator-program
        - *validator-project
        - *validator-fixtures
      commands:
        - dotnet run --project .eval-harness/fixture-validation/ReviewFixtures.csproj -- --case saved-search
        - *remove-validator-harness
      commandTimeout: 6m
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-review-saved-search"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              OrderSearchRepository.SearchAsync reaches OrderFilterCompiler.Build, where Expression.Constant embeds each request value into the tree; represent changing values through typed captured expressions so one filter layout can reuse a parameterized shape. GetCustomerActivityAsync reaches OrderQueryPolicies.CustomerActivity and forces each customer code into server SQL, so use normal captured parameterization or an evidenced override when plan reuse matters. Making the compiler static, caching per value, or compiling each changing tree does not fix the shape. GetCustomerHistoryAsync uses captured values, GetArchiveAsync uses a fixed structural literal, and GetImportedPageAsync deliberately forces a parameter; keep those distinctions and preserve the exact CountAsync plus bounded page contract. This is source evidence only; cache rates, SQL plans, and speedups were not measured.
    graders:
      - type: tool-calls
        config:
          disallowed: [bash, powershell, edit, create]
      - type: exit-success
      - type: prompt
    rubric:
      - Identifies that OrderFilterCompiler embeds each user's filter value as an expression constant, producing value-dependent EF query shapes and potentially different SQL instead of reusable value parameters
      - Recommends parameter-representing expressions or another translatable query builder that keeps a given filter layout stable while changing its values
      - Does not claim that making the compiler static, caching a delegate per user value, or compiling each newly built expression eliminates the value-dependent query-shape problem
      - Recognizes GetCustomerHistoryAsync's captured arguments and GetArchiveAsync's fixed structural constant as distinct from the dynamic per-request literals
      - Traces GetCustomerActivityAsync through OrderQueryPolicies and identifies that its forced customer-code literal can create distinct server SQL and reduce plan reuse across the stated high-volume workload
      - Recommends ordinary captured-value parameterization or an appropriate parameter override without claiming that EF.Constant necessarily defeats EF Core 10's own query-translation cache
      - Recognizes GetImportedPageAsync's forced parameter and GetArchiveAsync's fixed literal as deliberate SQL-shape choices, not automatically faster or defective without plan/workload evidence
      - Preserves the UI's actual matching count rather than substituting an existence test, and recognizes the bounded scalar page projection without inventing tracking overhead
      - Distinguishes the source-proven construction pattern from an observed cache-hit rate or measured speedup

  - name: Review statement export implementation
    prompt: |
      Review this application's EF Core statement-export data access before a finance rollout.
      It uses EF Core 10 with SQL Server. Accounts can have thousands of invoices and uploaded
      compliance documents of several megabytes. The payment file format expects one account
      entry per account ID, with invoice rows referring to that entry. Export consumers do not
      modify returned entities, and portfolio reads require a single-statement view. Collection
      reminders include lifetime amounts but list only unpaid invoice IDs.

      The module also posts received payments plus signed reconciliation adjustments. The
      account balance and posting receipt must commit together, and the caller's optimistic
      revision contract must remain intact when payments compete for the same account.

      Find performance and correctness improvements supported by the supplied repository,
      service, and model. Preserve the exported information, provide locations and remedies, and
      distinguish paths that do not need changes. Use source-browsing tools only; do not edit
      files or run shell commands, code, tests, builds, benchmarks, or analyzers.
    tags:
      capability: result-graph-review
      risk: high
      journey: finance-export-rollout
    environment:
      files:
        - src: fixtures/statement-export
          dest: .
        - *validator-program
        - *validator-project
        - *validator-fixtures
      commands:
        - dotnet run --project .eval-harness/fixture-validation/ReviewFixtures.csproj -- --case statement-export
        - *remove-validator-harness
      commandTimeout: 6m
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-review-statement-export"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Prioritize posting correctness: StatementPostingService.PostAsync loads a tracked account, StatementPostingRepository.RecordPaymentAsync updates the database immediately, then tracked arithmetic plus CommitAsync can overwrite that payment; the update also omits the revision predicate and the receipt saves separately. Use one coherent tracked save or a synchronized set-based transaction with token predicate, affected-row handling, refreshed state, and atomic receipt persistence. In exports, GetPortfolioAsync joins a wide compliance document through invoices although StatementExportService needs scalars; project narrowly while retaining the required single-statement view. GetCardsAsync tracks the StatementAccount inside InvoiceCard. GetPaymentRunAsync uses plain no-tracking, so the reference-keyed writer can duplicate one account ID; use identity resolution or key-based DTO processing. BuildReminderAsync tracks history before a filtered Include, allowing fixup to add paid invoices; use a detached projection or independent read context. GetTotalsAsync and standalone FlagAccountsAsync are sound. These are source findings; no production SQL, plans, concurrency run, or timing was observed.
    graders:
      - type: tool-calls
        config:
          disallowed: [bash, powershell, edit, create]
      - type: exit-success
      - type: prompt
    rubric:
      - Identifies that GetPortfolioAsync joins a wide account row to many invoices even with only one collection Include, while the service needs only scalar account fields and aggregates
      - Recommends a narrow database projection with invoice aggregates or equivalent selective queries, preserving all PortfolioRow values without fetching the compliance document
      - Preserves GetPortfolioAsync's deliberately selected single-statement consistency when reducing payload rather than treating AsSingleQuery as a missing mode selection
      - Identifies that GetCardsAsync still materializes and tracks StatementAccount entities inside InvoiceCard records, despite projecting the invoice itself
      - Recommends scalar account fields or detached reads for the proven read-only cards path, and does not claim that every record projection automatically avoids tracking
      - Connects GetPaymentRunAsync's plain no-tracking reference Include to distinct account instances and the writer's reference-keyed dictionary, which can emit duplicate entries for one account ID
      - Recommends per-query identity resolution or a key-based writer and narrow projection that preserves a single account entry, explaining that identity deduplication alone does not remove repeated SQL payload
      - Recognizes GetTotalsAsync's server-side scalar aggregation as sound and does not require AsNoTracking or AsSplitQuery merely because it returns records
      - Traces BuildReminderAsync's earlier tracking history query into the later filtered Include, explaining how paid invoices can enter UnpaidInvoiceIds through navigation fixup
      - Recommends a detached projection, suitable no-tracking read, or independent read context that preserves the lifetime amount and unpaid subset rather than clearing pending write state
      - Identifies that RecordPaymentAsync changes the database without refreshing the tracked account, so the subsequent adjustment and CommitAsync can overwrite the payment even within one sequential request
      - Recommends a coherent tracked save or synchronized set-based path that preserves payment plus adjustment, the returned balance, and the posting receipt
      - Explains that the preliminary revision comparison does not protect RecordPaymentAsync's unconditional update and preserves token enforcement or an equivalent revision predicate with affected-row handling
      - Identifies the separate immediate-write and receipt-save commit boundaries, requiring one atomic save unit or an explicit shared transaction without claiming a transaction alone refreshes the tracked account
      - Recognizes FlagAccountsAsync's standalone set-based marker update as distinct from mixing tracked balance arithmetic with immediate writes

  - name: Review a slow catalog search repository
    prompt: |
      The product search in DapperRepository.cs slows down as the catalog grows. It runs on SQL
      Server and must keep the existing arbitrary substring matching behavior. Review the supplied
      data access and recommend the smallest safe performance improvement.
    expect_activation: false
    tags:
      capability: boundary-non-ef-data-access
      risk: routing
      journey: redirect-dapper-query
    environment:
      files:
        - src: dormancy/DapperRepository.cs
          dest: DapperRepository.cs
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-query-dormancy-dapper"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Keep Dapper. A leading-wildcard LIKE cannot seek a normal name index. If product behavior permits prefix matching, change the pattern to @term + '%' and verify the plan uses the index. If true arbitrary substring search is required, do not claim prefix matching or SQL Server full-text prefix search is equivalent; preserve the contract and evaluate a provider-specific substring structure such as a fragment/ngram table or a search service. Do not introduce DbContext or EF Core APIs.
    graders:
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const crypto = require("crypto");
              const fs = require("fs");
              const data = fs.readFileSync("DapperRepository.cs", "utf8").replace(/\r\n/g, "\n");
              const actual = crypto.createHash("sha256").update(data).digest("hex");
              process.exit(actual === "1865e1b25fffd331cf279011ccee4432f30d646175bfc279f391319a76dbee6a" ? 0 : 1);
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: (Dapper|SQL)
      - type: output-matches
        config:
          pattern: (prefix|full[- ]text|wildcard|LIKE)
      - type: output-not-matches
        config:
          pattern: (AsNoTracking|AsSplitQuery|Include\()
      - type: prompt
    rubric:
      - Recognized that the EF Core-specific guidance does not apply to a Dapper repository
      - Kept the Dapper data-access stack and did not introduce EF Core
      - Explained that a leading wildcard prevents a normal index seek
      - Preserved arbitrary substring semantics unless the user accepts prefix matching
      - Did not present SQL Server full-text prefix matching as an exact replacement for arbitrary infix substring search
