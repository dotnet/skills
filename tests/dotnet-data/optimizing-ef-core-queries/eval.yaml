name: optimizing-ef-core-queries
description: Evaluates the dotnet-data/optimizing-ef-core-queries skill
type: capability
config:
  timeout: 20m
# The skill is exercised with an open-ended code-review "audit" scenario rather than a
# benchmark harness. The stimulus stages a single self-contained service class whose
# entity model and DbContext are visible in the same file, and asks the agent to review
# it and explain what is slow and how to fix each problem. That one service deliberately
# packs one instance of most of the anti-patterns the skill addresses — an N+1 with
# in-memory aggregation, a buried non-sargable date predicate, a Cartesian Include
# explosion, a count-everything existence check, a non-sargable text filter, deep offset
# paging, an unindexed hot filter, a read-only query that still tracks, full-entity loads
# where a projection would do, an unanchored substring search, a minimal query on an
# extremely hot path, a row-by-row update loop, and an in-memory count. The scenario is
# graded on the completeness of the review (the prompt/rubric judge), so the skill earns
# preference when its systematic coverage catches the subtler issues that an unaided
# review tends to miss. A single negative scenario checks the skill stays dormant on a
# Dapper, database-side tuning question that is outside its EF Core scope.
stimuli:
  - name: Stay dormant for a Dapper database-side tuning question
    prompt: |
      I am using Dapper (not EF Core) with hand-written SQL. This query against a schema owned by
      our DBA is slow:

      ```csharp
      var rows = connection.Query<Order>(
          "SELECT * FROM Orders WHERE CustomerId = @id ORDER BY CreatedAt DESC", new { id });
      ```

      How can I speed this up on the database side?
    expect_activation: false
    graders:
      - type: output-matches
        config:
          pattern: (Dapper|index|execution plan|SQL)
      - type: exit-success
      - type: prompt
    rubric:
      - "Answers the Dapper/database-side question directly (e.g. indexing, query plan, selecting only needed columns, parameterization) without pivoting to EF Core"
      - "Does not recommend EF Core-specific APIs such as AsNoTracking, Include, AsSplitQuery, or a DbContext"
      - "Recognizes this is outside an EF Core query-optimization scope since the code uses Dapper and the schema is DBA-managed"
  - name: Audit a back-office operations service riddled with query problems
    prompt: |
      Our internal back-office service has gotten slow in production: the ops-dashboard tiles, the
      order and product lookups, and the nightly maintenance jobs have all degraded as the tables
      grew into the millions of rows. The code is in `SalesOperationsService.cs` (the entity model
      and DbContext are in the same file so you can see the columns and relationships). Review the
      service and tell me what is making it slow and how you would fix each problem.
    environment:
      files:
        - src: audit-fixtures/SalesOperationsService.cs
          dest: SalesOperationsService.cs
    graders:
      - type: output-matches
        config:
          pattern: (N\+1|per[- ]customer|round[- ]trip|Cartesian|offset|projection|index|scan|SaveChanges)
      - type: exit-success
      - type: prompt
    rubric:
      - "Identifies GetCustomerSales as issuing a separate orders query for every customer (an N+1) and recommends collapsing it into a single set-based query"
      - "Recognizes that GetCustomerSales computes each customer's order count and total in memory after loading the rows, and that those aggregates should be computed by the database"
      - "Identifies that GetCustomerSales filters orders by the year of a date column, wrapping the column in a function that prevents an index seek, and recommends a sargable date-range comparison instead"
      - "Flags GetCustomerDetail as loading two independent related collections in one query, causing a Cartesian row explosion, and recommends splitting it into separate queries"
      - "Notes that HasOrders uses a count-everything existence check where a short-circuiting existence test would be cheaper"
      - "Identifies that SearchOrdersByTotalPrefix filters on the text form of a numeric column, which cannot be evaluated in the database and forces a full in-memory scan"
      - "Recognizes that GetOrderPage relies on a large row offset that scans and discards skipped rows, and suggests a seek/keyset approach for deep pages"
      - "Recognizes that GetPendingOrders filters and sorts on a column with no supporting index and recommends adding an index to back the frequent query"
      - "Notes that GetUnpaidInvoices returns entities for a read-only export while still tracking them, and recommends running it without change tracking"
      - "Identifies that ListActiveProducts loads full Product entities — including the wide Description and Image columns — and only projects to a few fields in memory afterward, and recommends projecting to those fields in the database so the wide columns are never read"
      - "Flags the substring SearchProducts as an unanchored match that cannot use an index on the product name"
      - "Recognizes that GetProductForCard is a minimal query on an extremely hot path where the remaining cost is EF Core re-translating the same query on every call, and recommends eliminating that repeated per-call translation cost while returning identical results"
      - "Identifies that ApplyCategoryDiscount saves changes once per product inside the loop, issuing a round-trip per row, and recommends a single set-based update"
      - "Recognizes that CountActiveProducts loads the entire product table into memory before counting, and that the count should be performed by the database"
    timeout: 300
