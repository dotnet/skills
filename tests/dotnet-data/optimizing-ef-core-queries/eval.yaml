name: optimizing-ef-core-queries
description: Evaluates the dotnet-data/optimizing-ef-core-queries skill
type: capability
config:
  timeout: 15m
# Each performance stimulus stages the shared EF Core + BenchmarkDotNet harness in
# tests/dotnet-data/optimizing-ef-core-queries/fixtures. The agent edits one
# Solutions/<Scenario>.cs file; the matching, never-edited Benchmarks/<Scenario>Benchmark.cs
# compares the agent's version against the preserved slow baseline over the shared
# model, DbContext and BenchmarkConfig, and prints a machine-readable
# "RESULT ... improved=True" line only when the rewrite returns the SAME data (an
# equivalence guard enforces correctness) and is meaningfully faster. The primary
# grader runs that benchmark, so each case is scored on a real, measured speed-up.
stimuli:
  - name: Eliminate an N+1 caused by per-item related-data access
    prompt: |
      This is a self-contained EF Core 8 + SQLite benchmark project. `NPlusOneSolution.Run`
      in `Solutions/NPlusOne.cs` builds one summary per customer, but profiling shows it
      issues a separate SQL query for every customer's orders — one query for the customers
      plus one more per customer. Rewrite that method so it returns the SAME summaries with
      far fewer round-trips, without changing its name, signature, or results.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *NPlusOneBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Solutions
          dest: Solutions
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *NPlusOneBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - Identifies the N+1 pattern — one extra query per customer to load Orders inside the loop
      - Collapses it to a single query, either eager-loading with Include or projecting the aggregates with Select
      - The rewritten NPlusOneSolution.Run returns the same summaries as the original
      - The NPlusOneBenchmark reports improved=True (a real, measured speed-up over the baseline)

  - name: Project only the needed columns instead of loading full entities
    prompt: |
      This is a self-contained EF Core 8 + SQLite benchmark project. `ProjectionSolution.Run`
      in `Solutions/Projection.cs` returns a small ProductListItem (Id, Name, Price) for each
      product in a category, but it first materializes whole Product entities — dragging along
      the large Description and Thumbnail columns the result never uses. Change it so the
      database returns only the columns the result needs, without changing the method name,
      signature, or results.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *ProjectionBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Solutions
          dest: Solutions
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *ProjectionBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - Projects in the query with Select so EF Core emits a SELECT for only Id, Name, and Price
      - Runs the projection server-side (before ToList) rather than trimming columns in memory afterward
      - Avoids loading the large Description and Thumbnail columns, cutting IO and memory per row
      - The ProjectionBenchmark reports improved=True (a real, measured speed-up over the baseline)

  - name: Use AsNoTracking for a read-only reporting query
    prompt: |
      This is a self-contained EF Core 8 + SQLite benchmark project. `NoTrackingSolution.Run`
      in `Solutions/NoTracking.cs` reads every invoice for a year into a read-only list, but
      EF Core still sets up change tracking for all the materialized entities even though
      nothing is ever modified. Make the query avoid that wasted per-entity tracking work,
      without changing the method name, signature, or results.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *NoTrackingBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Solutions
          dest: Solutions
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *NoTrackingBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - Adds AsNoTracking() because the results are read-only
      - Explains change tracking wastes CPU and memory building snapshots that are never used here
      - The rewritten NoTrackingSolution.Run returns the same rows as the original
      - The NoTrackingBenchmark reports improved=True (a real, measured speed-up over the baseline)

  - name: Split a query with multiple collection Includes to avoid Cartesian explosion
    prompt: |
      This is a self-contained EF Core 8 + SQLite benchmark project. `SplitQuerySolution.Run`
      in `Solutions/SplitQuery.cs` eager-loads two unrelated collections (Posts and
      Contributors) for each blog in one query. Because the collections are independent, the
      single SQL join multiplies their rows together — returning Posts x Contributors rows per
      blog. Make EF Core fetch the collections without that row multiplication, without
      changing the method name, signature, or results.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *SplitQueryBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Solutions
          dest: Solutions
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *SplitQueryBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - Identifies the Cartesian explosion from joining two collection navigations (Posts x Contributors) in one query
      - Uses AsSplitQuery() so each collection is loaded in its own SQL statement
      - The rewritten SplitQuerySolution.Run returns the same data as the original
      - The SplitQueryBenchmark reports improved=True (a real, measured speed-up over the baseline)

  - name: Switch deep offset pagination to keyset pagination
    prompt: |
      This is a self-contained EF Core 8 + SQLite benchmark project. `KeysetPaginationSolution.Run`
      in `Solutions/KeysetPagination.cs` returns the page of orders that follows afterId (the Id
      of the last row on the previous page), ordered by Id. It reaches that page by skipping
      rows, so the database still scans and discards everything before the page and deep pages
      get progressively slower. Return the SAME page without that growing skip cost, without
      changing the method name, signature, or results.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *KeysetPaginationBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Solutions
          dest: Solutions
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *KeysetPaginationBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - Explains offset pagination (Skip/Take) degrades as the offset grows because skipped rows are still scanned
      - Uses keyset (seek) pagination that filters by the last key seen (WHERE Id > afterId) with OrderBy plus Take and no Skip
      - The rewritten KeysetPaginationSolution.Run returns the same page as the original
      - The KeysetPaginationBenchmark reports improved=True (a real, measured speed-up over the baseline)

  - name: Replace a row-by-row update with a set-based ExecuteUpdate
    prompt: |
      This is a self-contained EF Core 8 + SQLite benchmark project. `BulkUpdateSolution.Run`
      in `Solutions/BulkUpdate.cs` deactivates every order created before a cutoff by loading
      all the matching orders, mutating each one, and calling SaveChanges — issuing an UPDATE
      per row. Perform the same deactivation in a single database operation instead of loading
      and looping. Keep the method name and signature unchanged and still return the number of
      rows affected.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *BulkUpdateBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Solutions
          dest: Solutions
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *BulkUpdateBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - Uses ExecuteUpdate with SetProperty instead of loading entities and looping
      - Explains ExecuteUpdate runs as a single SQL statement that bypasses change tracking
      - The rewritten BulkUpdateSolution.Run deactivates the same rows and returns the same affected count
      - The BulkUpdateBenchmark reports improved=True (a real, measured speed-up over the baseline)

  - name: Add a missing index when EF Core owns the schema
    prompt: |
      This is a self-contained EF Core 8 + SQLite benchmark project that owns its schema
      (code-first). `IndexingBenchmark` filters and orders AuditLog rows by CreatedAt, but
      nothing in the model makes that lookup efficient, so the database scans the whole table.
      Adjust the model in `IndexingSolution.Configure` (`Solutions/Indexing.cs`) so the
      CreatedAt lookup no longer scans every row — in a real app you would then add a migration.
      Leave the method name and signature unchanged.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *IndexingBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Solutions
          dest: Solutions
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *IndexingBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - Identifies the missing index on the filtered/sorted CreatedAt column as the cause of the table scan
      - Adds the index through the EF Core model (HasIndex), recognizing that because EF Core owns the schema this is in scope
      - Notes that a real app applies the change with a migration rather than altering the database by hand
      - The IndexingBenchmark reports improved=True (a real, measured speed-up over the baseline)

  - name: Improve scalability by pooling DbContexts instead of rebuilding them
    prompt: |
      This is a self-contained EF Core 8 + SQLite benchmark project. `ContextPoolingSolution.AcquireContext`
      in `Solutions/ContextPooling.cs` is called once per simulated request and constructs a
      brand-new AppDbContext every time, so each request pays the full context setup cost. Hand
      back a context more cheaply by reusing contexts across requests instead of constructing
      one each call, keeping the method name and signature unchanged and still returning a
      context the caller disposes.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *ContextPoolingBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Solutions
          dest: Solutions
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *ContextPoolingBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - Reuses contexts from a DbContext pool (PooledDbContextFactory / AddDbContextPool) instead of newing one per request
      - Explains pooling cuts per-request context allocation and setup cost
      - The rewritten ContextPoolingSolution.AcquireContext still returns a usable context the caller disposes back to the pool
      - The ContextPoolingBenchmark reports improved=True (a real, measured speed-up over the baseline)

  - name: Stay dormant for a Dapper database-side tuning question
    prompt: |
      I am using Dapper (not EF Core) with hand-written SQL. This query against a schema owned by
      our DBA is slow:

      ```csharp
      var rows = connection.Query<Order>(
          "SELECT * FROM Orders WHERE CustomerId = @id ORDER BY CreatedAt DESC", new { id });
      ```

      How can I speed this up on the database side?
    expect_activation: false
    graders:
      - type: output-matches
        config:
          pattern: (Dapper|index|execution plan|SQL)
      - type: exit-success
      - type: prompt
    rubric:
      - Answers the Dapper/database-side question directly (e.g. indexing, query plan, selecting only needed columns, parameterization) without pivoting to EF Core
      - Does not recommend EF Core-specific APIs such as AsNoTracking, Include, AsSplitQuery, or a DbContext
      - Recognizes this is outside an EF Core query-optimization scope since the code uses Dapper and the schema is DBA-managed
