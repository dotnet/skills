          timeout: 12m
      - type: prompt
    rubric:
      - "Replaces the leading-wildcard Contains (a LIKE '%term%' scan) with an anchored StartsWith so an index can serve the prefix match"
      - "The rewritten LeadingWildcardSolution.Run returns the same ids as the original"
      - "The LeadingWildcardBenchmark reports improved=True (a real, measured speed-up over the baseline)"

  - name: Parameterize a raw SQL query built by string concatenation
    prompt: |
      This is a self-contained EF Core 10 + SQLite benchmark project. `RawSqlSolution.Run`
      in `Scenarios/RawSql.cs` drops to raw SQL to select orders whose Id is above a threshold,
      but it builds the WHERE clause by concatenating the value straight into the command text.
      Keeping the raw-SQL approach, improve that data-access path and return the SAME orders,
      without changing the method name or signature.

      This is not a wall-clock benchmark, so you do not need to run one. Update
      `Scenarios/RawSql.cs`, keep the results the same, and include the rewritten raw SQL in your
      response.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Scenarios
          dest: Scenarios
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: output-matches
        config:
          pattern: 'SELECT \* FROM Orders WHERE Id > (?:\{minId\}|@\w+)'
      - type: prompt
    rubric:
      - "Replaces the FromSqlRaw call that concatenated the value into the command text with a parameterized FromSql/FromSqlInterpolated, closing the injection hole and restoring plan caching"
      - "The rewritten RawSqlSolution.Run returns the same orders as the original raw query"
      - "The response includes parameterized raw SQL, and the rewritten RawSqlSolution.Run returns the same rows as the original raw query"

  - name: Speed up a hot primary-key lookup called on every request
    prompt: |
      This is a self-contained EF Core 10 + SQLite benchmark project. A product lookup sits on a
      very hot path — it is called hundreds of times per request against one warmed-up, reused
      DbContext — and it is slower than such a simple query should be.

      The code is in `HotLookupSolution.Lookup` (`Scenarios/HotLookup.cs`). Improve the EF Core
      data-access path perf while returning the SAME result without changing the method name,
      signature, or results. The query is already a minimal primary-key lookup projected to a small
      DTO, so the usual read-only tweaks will not move it — look deeper. Keep the optimization
      inside EF Core — do not replace the query with hand-written ADO.NET or Dapper.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *HotLookupBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Scenarios
          dest: Scenarios
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *HotLookupBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - "Recognizes the cost is EF Core re-translating the same LINQ query on every call over a reused context, not the SQL itself"
      - "Rules out the obvious read-only tweaks (AsNoTracking, projection) as no-ops here because the query is already a minimal, non-tracked projection"
      - "Makes the hot lookup measurably faster on identical results by removing the repeated per-call query-translation overhead, keeping the work inside EF Core rather than switching to hand-written ADO.NET or Dapper"
      - "The rewritten HotLookupSolution.Lookup returns the same ProductListItem as the original"
      - "The HotLookupBenchmark reports improved=True (a real, measured speed-up over the baseline)"

  - name: Speed up a hot per-customer aggregate summary
    prompt: |
      This is a self-contained EF Core 10 + SQLite benchmark project. A per-customer order summary
