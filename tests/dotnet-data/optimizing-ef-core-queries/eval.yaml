      The code is in `HotAggregateSolution.Summary` (`Scenarios/HotAggregate.cs`). Improve the
      EF Core data-access path perf while returning the SAME record without changing the method
      name, signature, or results. The query already aggregates server-side and projects a small
      record, and the result is never change-tracked, so the usual read-only tweaks will not move
      it — look deeper. Keep the optimization inside EF Core — do not replace the query with
      hand-written ADO.NET or Dapper.

      Shared entities and the DbContext live under `Shared/`. Do not edit the benchmark.
      Verify your change with:

      ```
      dotnet run -c Release -- --filter *HotAggregateBenchmark*
      ```
    environment:
      files:
        - src: fixtures/Shared
          dest: Shared
        - src: fixtures/Scenarios
          dest: Scenarios
        - src: fixtures/Benchmarks
          dest: Benchmarks
        - src: fixtures/OptimizingEfCoreQueries.csproj
          dest: OptimizingEfCoreQueries.csproj
        - src: fixtures/Program.cs
          dest: Program.cs
    graders:
      - type: run-command
        config:
          command: dotnet run -c Release -- --filter *HotAggregateBenchmark*
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 12m
      - type: prompt
    rubric:
      - "Recognizes the cost is EF Core re-translating the same aggregate LINQ query (with its Count/Sum subqueries) on every call over a reused context"
      - "Rules out AsNoTracking and further projection as no-ops here because the result is already a small, non-tracked record"
      - "Makes the hot aggregate measurably faster on identical results by removing the repeated per-call query-translation overhead, keeping the work inside EF Core rather than switching to hand-written ADO.NET or Dapper"
      - "The rewritten HotAggregateSolution.Summary returns the same CustomerOrderSummary as the original"
      - "The HotAggregateBenchmark reports improved=True (a real, measured speed-up over the baseline)"
  - name: Stay dormant for a Dapper database-side tuning question
    prompt: |
      I am using Dapper (not EF Core) with hand-written SQL. This query against a schema owned by
      our DBA is slow:

      ```csharp
      var rows = connection.Query<Order>(
          "SELECT * FROM Orders WHERE CustomerId = @id ORDER BY CreatedAt DESC", new { id });
      ```

      How can I speed this up on the database side?
    expect_activation: false
    graders:
      - type: output-matches
        config:
          pattern: (Dapper|index|execution plan|SQL)
      - type: exit-success
      - type: prompt
    rubric:
      - "Answers the Dapper/database-side question directly (e.g. indexing, query plan, selecting only needed columns, parameterization) without pivoting to EF Core"
      - "Does not recommend EF Core-specific APIs such as AsNoTracking, Include, AsSplitQuery, or a DbContext"
      - "Recognizes this is outside an EF Core query-optimization scope since the code uses Dapper and the schema is DBA-managed"
  - name: Audit a reporting service with several co-occurring query problems
    prompt: |
      Our customer dashboard is timing out under load in production. The queries live in
      `OrderReportingService.cs` (the entity model and DbContext are in the same file so you
      can see the relationships). Review the service and tell me what is making these
      endpoints slow and how you would fix each problem.
    environment:
      files:
        - src: audit-fixtures/OrderReportingService.cs
          dest: OrderReportingService.cs
    graders:
      - type: output-matches
        config:
          pattern: (N\+1|per[- ]customer|per customer|separate quer|round[- ]trip)
      - type: exit-success
      - type: prompt
    rubric:
      - "Identifies GetCustomerSales as issuing a separate orders query for every customer (an N+1) and recommends collapsing it into a single grouped query"
      - "Recognizes that GetCustomerSales computes the per-customer count and total in memory after loading rows, and that those aggregates should be computed by the database"
      - "Flags GetCustomerDetail as loading two independent related collections in one query, causing a Cartesian row explosion, and recommends splitting it into separate queries"
      - "Notes that HasOrders uses a count-everything existence check where a short-circuiting existence test would be cheaper"
      - "Identifies that SearchOrdersByTotalPrefix filters on the text form of a numeric column, which cannot be evaluated in the database and forces a full scan in memory"
      - "Recognizes that GetOrderPage relies on a large row offset that scans and discards skipped rows, and suggests a seek/keyset approach for deep pages"
  - name: Audit a catalog service with several co-occurring query problems
    prompt: |
      Storefront pages and our nightly price job have gotten slow as the product catalog grew
      past a few hundred thousand rows. The code is in `CatalogService.cs` (the entity model and
      DbContext are in the same file). Review the service and tell me what is making it slow and
      how you would fix each problem.
    environment:
      files:
        - src: audit-fixtures/CatalogService.cs
          dest: CatalogService.cs
    graders:
      - type: output-matches
        config:
          pattern: (Contains|LIKE|index|full|entire|SaveChanges|round[- ]trip|project)
      - type: exit-success
      - type: prompt
    rubric:
      - "Identifies that ListActive materializes full Product entities — including the wide Description and Image columns — when only Id, Name, and Price are used, and recommends fetching only those columns"
      - "Recognizes that ListActive applies its projection in memory after loading full rows, so the wide columns are still read from the database"
      - "Flags the substring Search as producing an unanchored match that cannot use an index on the product name"
      - "Identifies that RaisePrices saves changes once per product inside the loop, issuing a round-trip per row, and recommends a single set-based update"
      - "Recognizes that ActiveCount loads the entire product table into memory before counting, and that the count should be performed by the database"
      - "Identifies that UpdatedInYear filters on the year of an indexed date column, wrapping it in a function that prevents an index seek, and recommends a sargable date-range comparison instead"