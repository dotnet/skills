name: optimizing-ef-core-queries
tags:
  executionShard: heavy
description: Evaluates EF Core performance review and benchmarked remediation
type: capability
defaults:
  timeout: 30m
  runs: 1
# Keep the original open-ended remediation scenario as an end-to-end check alongside
# the focused review stimuli below. Its hybrid grading combines review completeness
# with a seeded in-memory SQLite harness that compares the rewritten service against
# preserved original method bodies for equivalent results and at least 10% lower time.
#
# Eleven of the twelve service methods have a result-preserving, signature-stable
# benchmark. GetOrderPage is the exception: replacing page-number offset pagination
# with keyset pagination changes the method contract, so that recommendation remains
# rubric-graded rather than benchmark-graded.
stimuli:
  - name: Audit a back-office operations service riddled with query problems
    prompt: |
      Our internal back-office service uses EF Core and has gotten slow in production: the
      ops-dashboard tiles, order and product lookups, and nightly maintenance jobs have all degraded
      as the tables grew into the millions of rows. The code is in `SalesOperationsService.cs` (the entity model
      and DbContext are in the same file so you can see the columns and relationships).

      Go through the service and make it faster: apply your optimizations directly in
      `SalesOperationsService.cs`, and for each method you change, explain what was slow and why
      your fix helps. Keep the public API and the data model exactly as they are — same namespace,
      class, entity types, records and DbContext, and the same method names, parameters and return
      types (you may add private helpers or fields) — so the rest of the app and its tests keep
      compiling. Every method you change must return the same results as it did before.

      Work through every method: optimize the ones that can be improved, and briefly note any that
      are already efficient.
    tags:
      capability: end-to-end-query-optimization
      risk: high
      journey: back-office-performance-remediation
    environment: &query-environment
      files:
        - src: audit-fixtures/SalesOperationsService.cs
          dest: SalesOperationsService.cs
        - src: benchmark-fixtures
          dest: perf
    graders:
      - &benchmark-harness-integrity
        type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const crypto = require("crypto");
              const fs = require("fs");
              const path = require("path");
              const names = ["Baseline.cs", "Program.cs", "SalesBenchmarks.csproj", "Seed.cs", "Timing.cs"];
              const expected = new Set(names);
              const unexpected = [];
              const walk = directory => {
                for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                  const full = path.join(directory, entry.name);
                  const relative = path.relative("perf", full).replaceAll("\\", "/");
                  if (relative.startsWith("bin/") || relative.startsWith("obj/")) continue;
                  if (entry.isDirectory()) walk(full);
                  else if (!expected.has(relative)) unexpected.push(relative);
                }
              };
              walk("perf");
              if (unexpected.length) {
                throw new Error("Unexpected benchmark files: " + unexpected.join(", "));
              }
              const hash = crypto.createHash("sha256");
              for (const name of names) {
                hash.update(name); hash.update(Buffer.from([0]));
                hash.update(fs.readFileSync(path.join("perf", name))); hash.update(Buffer.from([0]));
              }
              process.exit(hash.digest("hex") === "e7662ebe5a6b8b0dab5c9bd66e234275d74a982d11a4cedda1207fddaa6ab7fc" ? 0 : 1);
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: (N\+1|per[- ]customer|round[- ]trip|Cartesian|keyset|projection|index|scan|memory|SaveChanges)
      - type: exit-success
      - type: prompt
      # Each command isolates one benchmarkable method so a fast rewrite cannot
      # hide a regression or behavior change in another method.
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method GetCustomerSales
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method GetCustomerDetail
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method HasOrders
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method GetUnpaidInvoices
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method ListActiveProducts
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method GetProductForCard
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method ApplyCategoryDiscount
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method CountActiveProducts
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method GetOrdersOverTotal
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method GetPendingOrders
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: run-command
        config:
          command: dotnet run -c Release --project perf -- --method SearchProducts
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
    rubric:
      - "Identifies GetCustomerSales as issuing a separate orders query for every customer (an N+1) and recommends collapsing it into a single set-based query"
      - "Recognizes that GetCustomerSales computes each customer's order count and total in memory after loading the rows, and that those aggregates should be computed by the database"
      - "Identifies that GetCustomerSales filters orders by the year of a date column, wrapping the column in a function that prevents an index seek, and recommends a sargable date-range comparison instead"
      - "Flags GetCustomerDetail as loading two independent related collections in one query, causing a Cartesian row explosion, and recommends splitting it into separate queries"
      - "Notes that HasOrders uses a count-everything existence check where a short-circuiting existence test would be cheaper"
      - "Recognizes that GetOrdersOverTotal pulls every order into memory before filtering by total, and that the filter should run in the database"
      - "Recognizes that GetOrderPage uses offset paging that makes the database walk and discard every row before the requested page, so deep pages get progressively slower, and recommends keyset/seek pagination that continues from the last row already shown"
      - "Recommends adding an index to support the frequent pending-orders status filter and date ordering"
      - "Notes that GetUnpaidInvoices returns entities for a read-only export while still tracking them, and recommends running it without change tracking"
      - "Identifies that ListActiveProducts loads full Product entities — including the wide Description and Image columns — and only projects to a few fields in memory afterward, and recommends projecting to those fields in the database so the wide columns are never read"
      - "Recognizes that SearchProducts materializes full product rows (including the wide description and image columns) before projecting, and should project to the needed fields in the database"
      - "Recognizes that GetProductForCard is a minimal query on an extremely hot path where EF's per-call expression processing and query-cache lookup can still matter despite cached translation, and recommends reducing that overhead while returning identical results"
      - "Identifies that ApplyCategoryDiscount saves changes once per product inside the loop, issuing a round-trip per row, and recommends a single set-based update"
      - "Recognizes that CountActiveProducts loads the entire product table into memory before counting, and that the count should be performed by the database"

  - name: Split independent collection loads without changing results
    prompt: |
      GetCustomerDetail in SalesOperationsService.cs becomes very slow for customers with many
      orders, order lines, and invoices. Optimize only that method, preserve its signature and
      returned graph, and explain the cause. Do not edit anything under perf/.
    tags:
      capability: avoid-cartesian-collection-join
      risk: high
      journey: optimize-customer-detail
    environment: &focused-query-environment
      files:
        - src: audit-fixtures/SalesOperationsService.cs
          dest: SalesOperationsService.cs
        - src: benchmark-fixtures
          dest: perf
      commands:
        - >-
          node -e "const crypto=require('crypto'),fs=require('fs');
          const state=fs.existsSync('optimizing-ef-core-queries/SKILL.md')?'present':'absent';
          const signature=crypto.createHmac('sha256','5f077eb03a9c1cb3528e0236e72b425f992db5b8321ca75dd7afcc6103ecc6f3').update(state).digest('hex');
          fs.writeFileSync('.eval-scope-state',state+':'+signature+'\n')"
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-query-customer-detail"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The independent collection Includes multiply order-line and invoice rows in one result set. Keep the same loaded graph but execute it as split queries so each collection is read separately and parent data is not duplicated across a Cartesian product.
    golden_patch:
      path: references/customer-detail-split.patch
    graders:
      - *benchmark-harness-integrity
      - type: run-command
        config:
          command: node
          args:
            - -e
            - &single-method-scope-script |
              const crypto = require("crypto");
              const fs = require("fs");
              const path = require("path");
              const [method, expected] = process.argv.slice(1);
              const source = fs.readFileSync("SalesOperationsService.cs", "utf8").replace(/\r\n/g, "\n");
              const match = new RegExp("^\\s*public\\s+[^\\r\\n]*\\b" + method + "\\s*\\(", "m").exec(source);
              if (!match) throw new Error("Method not found: " + method);
              const open = source.indexOf("{", match.index);
              if (open < 0) throw new Error("Method body not found: " + method);
              let depth = 0;
              let end = -1;
              for (let i = open; i < source.length; i++) {
                if (source.startsWith("//", i)) {
                  i = source.indexOf("\n", i);
                  if (i < 0) break;
                  continue;
                }
                if (source.startsWith("/*", i)) {
                  i = source.indexOf("*/", i + 2);
                  if (i < 0) throw new Error("Unterminated block comment");
                  i++;
                  continue;
                }
                if (source[i] === "\"") {
                  let quotes = 1;
                  while (source[i + quotes] === "\"") quotes++;
                  if (quotes >= 3) {
                    const delimiter = "\"".repeat(quotes);
                    i = source.indexOf(delimiter, i + quotes);
                    if (i < 0) throw new Error("Unterminated raw string");
                    i += quotes - 1;
                    continue;
                  }
                  const verbatim = (i > 0 && source[i - 1] === "@") ||
                    (i > 1 && source[i - 2] === "@" && source[i - 1] === "$");
                  for (i++; i < source.length; i++) {
                    if (verbatim && source[i] === "\"" && source[i + 1] === "\"") {
                      i++;
                    } else if (!verbatim && source[i] === "\\") {
                      i++;
                    } else if (source[i] === "\"") {
                      break;
                    }
                  }
                  continue;
                }
                if (source[i] === "'") {
                  for (i++; i < source.length; i++) {
                    if (source[i] === "\\") i++;
                    else if (source[i] === "'") break;
                  }
                  continue;
                }
                if (source[i] === "{") depth++;
                else if (source[i] === "}" && --depth === 0) {
                  end = i + 1;
                  break;
                }
              }
              if (end < 0) throw new Error("Method end not found: " + method);
              const masked = source.slice(0, open + 1) + "\n/* requested method body */\n" + source.slice(end - 1);
              const actual = crypto.createHash("sha256").update(masked).digest("hex");
              if (actual !== expected) {
                throw new Error("SalesOperationsService.cs changed outside " + method);
              }
              const expectedFiles = new Set([
                ".eval-scope-state",
                "SalesOperationsService.cs",
                "perf/Baseline.cs",
                "perf/Program.cs",
                "perf/SalesBenchmarks.csproj",
                "perf/Seed.cs",
                "perf/Timing.cs"
              ]);
              const marker = fs.readFileSync(".eval-scope-state", "utf8").trim().split(":");
              if (marker.length !== 2) throw new Error("Invalid scope-state marker");
              const [skillState, markerSignature] = marker;
              const expectedSignature = crypto
                .createHmac("sha256", "5f077eb03a9c1cb3528e0236e72b425f992db5b8321ca75dd7afcc6103ecc6f3")
                .update(skillState)
                .digest("hex");
              if (markerSignature !== expectedSignature) throw new Error("Scope-state marker was modified");
              const skillDirectory = "optimizing-ef-core-queries";
              const skillPath = skillDirectory + "/SKILL.md";
              if (skillState === "present") {
                if (!fs.existsSync(skillDirectory)) throw new Error("Target skill directory was removed");
                if (!fs.existsSync(skillPath)) throw new Error("Target skill file was removed");
                expectedFiles.add(skillPath);
                const skill = fs.readFileSync(skillPath, "utf8").replace(/\r\n/g, "\n");
                const skillHash = crypto.createHash("sha256").update(skill).digest("hex");
                if (skillHash !== "a4c0d87d624f3ac1e291db0e613026815ee3247f5414ece17fd3b45600943ff7") {
                  throw new Error("Target skill file was modified");
                }
              } else if (skillState === "absent") {
                if (fs.existsSync(skillDirectory)) throw new Error("Unexpected target skill directory");
              } else {
                throw new Error("Invalid scope-state marker value");
              }
              const ignoredPrefixes = [".git/", "perf/bin/", "perf/obj/"];
              const unexpected = [];
              const walk = directory => {
                for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                  const full = path.join(directory, entry.name);
                  const relative = path.relative(".", full).replaceAll("\\", "/");
                  if (ignoredPrefixes.some(prefix => relative.startsWith(prefix))) continue;
                  if (entry.isDirectory()) walk(full);
                  else if (!expectedFiles.has(relative)) unexpected.push(relative);
                }
              };
              walk(".");
              if (unexpected.length) throw new Error("Unexpected workspace files: " + unexpected.join(", "));
            - GetCustomerDetail
            - "0193938430a00031e0099adc5ffdfc47125823ed37aaf30ccb67f28c66fa3da7"
      - type: run-command
        config:
          command: dotnet
          args: [run, -c, Release, --project, perf, --, --method, GetCustomerDetail]
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: prompt
    rubric:
      - Prevented Cartesian row multiplication while returning the same customer, orders, lines, and invoices
      - Preserved the public method contract and did not replace eager loading with lazy loading
      - Explained that independent collection joins duplicate rows and parent data

  - name: Keep a hot status queue server-side and identify its missing index
    prompt: |
      GetPendingOrders in SalesOperationsService.cs powers a fulfillment queue that refreshes every
      few seconds and now scans millions of rows. Optimize the method without changing its signature
      or returned rows. The database schema is managed by a DBA rather than EF migrations, so also
      state the supporting index the DBA should review. Do not edit anything under perf/.
    tags:
      capability: server-filter-with-index-recommendation
      risk: high
      journey: optimize-fulfillment-queue
    environment: *focused-query-environment
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-query-pending-orders-index"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Keep the status filter, CreatedAt ordering, and OrderRow projection on IQueryable so SQL returns only pending rows and needed columns. Because the queue repeatedly filters by Status and orders by CreatedAt, ask the DBA to review a composite index with Status first and CreatedAt second, with an appropriate unique tie-breaker or included output columns for the actual provider. The code change removes client materialization; the index is a separate schema fix owned by the DBA.
    golden_patch:
      path: references/pending-orders-server-filter.patch
    graders:
      - *benchmark-harness-integrity
      - type: run-command
        config:
          command: node
          args:
            - -e
            - *single-method-scope-script
            - GetPendingOrders
            - "3ace38295cf8c084d5b615eb532b3e52ee2e44e3e32ec63bc617a018150c1e6c"
      - type: run-command
        config:
          command: dotnet
          args: [run, -c, Release, --project, perf, --, --method, GetPendingOrders]
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: prompt
    rubric:
      - Kept the Status filter, CreatedAt ordering, and OrderRow projection in the database query
      - Preserved the method signature and exact returned rows
      - Recommended a supporting index led by Status and then CreatedAt, while leaving the externally managed schema unchanged
      - Distinguished the query rewrite from the separate DBA-owned index change

  - name: Improve slow category discount maintenance
    prompt: |
      The EF Core method ApplyCategoryDiscount in SalesOperationsService.cs takes minutes for large
      categories. Make this maintenance path faster while preserving the exact final price and
      timestamp values, method signature, and public behavior. Optimize only that method, and do
      not edit anything under perf/.
    tags:
      capability: use-set-based-bulk-update
      risk: high
      journey: optimize-nightly-maintenance
    environment: *focused-query-environment
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-query-bulk-update"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Loading every product and calling SaveChanges inside the loop creates a select plus one update round trip per row. Use ExecuteUpdate with the category predicate and set both Price and UpdatedAt in one SQL UPDATE, preserving the final values without materializing entities.
    golden_patch:
      path: references/category-discount-bulk.patch
    graders:
      - *benchmark-harness-integrity
      - type: run-command
        config:
          command: node
          args:
            - -e
            - *single-method-scope-script
            - ApplyCategoryDiscount
            - "d4f075f06adb0119c6eca5533955b5bd593146275e98d3418807a85c71874a45"
      - type: run-command
        config:
          command: dotnet
          args: [run, -c, Release, --project, perf, --, --method, ApplyCategoryDiscount]
          expected_exit_code: 0
          stdout_contains: improved=True
          timeout: 6m
      - type: prompt
    rubric:
      - Replaced entity materialization and per-row SaveChanges calls with one set-based update
      - Updated both price and timestamp for exactly the selected category
      - Preserved the method signature and final database values

  - name: Review customer directory search
    prompt: |
      Please review this application's EF Core customer-directory and catalog searches before a
      release to larger customers. The application uses EF Core 10 with SQL Server. Search latency
      grows with data volume, and the search modes have existing matching contracts. The same
      module supplies numeric overview tiles and regional comparisons; some overview requests
      fail intermittently.

      Recommend evidenced performance or correctness improvements with locations and tradeoffs,
      preserving those contracts. Use source-browsing tools only; do not edit files or run shell
      commands, code, tests, builds, benchmarks, or analyzers.
    tags:
      capability: predicate-search-review
      risk: medium
      journey: search-latency-review
    environment:
      files:
        - src: fixtures/customer-search
          dest: .
        - &validator-program
          src: fixture-validation/Program.cs
          dest: .eval-harness/fixture-validation/Program.cs
        - &validator-project
          src: fixture-validation/ReviewFixtures.csproj
          dest: .eval-harness/fixture-validation/ReviewFixtures.csproj
        - &validator-fixtures
          src: fixtures
          dest: .eval-harness/fixtures
      commands:
        - dotnet run --project .eval-harness/fixture-validation/ReviewFixtures.csproj -- --case customer-search
        - &remove-validator-harness >-
          node -e "require('fs').rmSync('.eval-harness', { recursive: true, force: true })"
      commandTimeout: 6m
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-review-customer-directory"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Prioritize correctness first: DirectoryOverviewService.GetOverviewAsync starts both repository counts on the one DirectoryDbContext owned by DirectorySession, so overlapping readers can fail; await them sequentially or use separately owned contexts. GetExportOverviewAsync is already safely sequential, and GetRegionComparisonAsync safely owns two sessions. In CustomerSearchRepository, FindByEmailAsync reaches DirectoryMatching.Email, which computes lower-case text instead of using the indexed stored NormalizedEmail; FindPreferredNamesAsync reaches an unsupported StringComparison translation; SearchCatalogAsync requires arbitrary substring semantics, so a prefix rewrite is not equivalent and a provider search design needs explicit contract agreement. The plain prefix, bounded region membership, and normalized-email path are sound. These are source findings only; SQL, plans, indexes, and timing were not executed or observed.
    graders:
      - type: tool-calls
        config:
          disallowed: [bash, powershell, edit, create]
      - type: exit-success
      - type: prompt
    rubric:
      - Connects FindByEmailAsync to DirectoryMatching.Email and the configured stored NormalizedEmail index, recommending that indexed expression value instead of computing LOWER on Email for every lookup
      - Identifies SearchCatalogAsync as arbitrary substring matching despite the indirect predicate and ordinary Name index; any alternate search strategy must retain the required matching semantics or disclose changes such as token-based full-text behavior
      - Identifies the StringComparison overload in FindPreferredNamesAsync as unsupported by the supplied provider and recommends a compatible comparison without suggesting that EF Core 10 silently evaluates the predicate locally
      - Does not misclassify regions.Contains(customer.Region) as string substring search
      - Recognizes that the plain name prefix, bounded region membership, and normalized-email lookup already align with their supplied model indexes and do not need speculative new indexes or compiled queries
      - Avoids asserting that a particular deployed index or generated SQL plan was observed
      - Connects GetOverviewAsync's overlapping reader calls to the single DirectoryDbContext supplied to both repositories by DirectorySession, rather than assuming different repositories own different contexts
      - Recommends sequential operations on the shared context or separately owned contexts, preserving both numeric counts instead of substituting existence checks
      - Recognizes GetExportOverviewAsync as safe sequential use and GetRegionComparisonAsync as safe parallel use of two independently created and disposed sessions

  - name: Review order operations query boundaries
    prompt: |
      The order-operations API shows rising memory use and uneven latency for high-volume tenants.
      Review this application's EF Core services and repositories in the supplied source.
      The dashboard combines several operational tiles; finance also uses the service for its
      ledger. Partner feeds contain tens of thousands of orders, with returned IDs in feed order
      and a receipt for each accepted order. Failed partner imports can restart from the beginning;
      archive imports resume from an externally acknowledged chunk boundary.
      Use source-browsing tools only. Do not edit files or run shell commands, code, tests, builds,
      benchmarks, or analyzers.

      Produce a prioritized review tied to concrete call paths, with safe remediations. Avoid
      duplicate findings for one root cause, and preserve methods whose contracts intentionally
      require every matching row.
    tags:
      capability: materialization-bound-review
      risk: high
      journey: memory-latency-review
    environment:
      files:
        - src: fixtures/shared/CommerceData.cs
          dest: CommerceData.cs
        - src: fixtures/materialization
          dest: .
        - src: fixtures/order-import
          dest: .
        - *validator-program
        - *validator-project
        - *validator-fixtures
      commands:
        - dotnet run --project .eval-harness/fixture-validation/ReviewFixtures.csproj -- --case order-operations
        - *remove-validator-harness
      commandTimeout: 6m
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-review-order-operations"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Highest impact is OrderImportService.ImportPartnerFeedAsync -> ImportJournal.RecordImportedAsync: every row scans the growing tracker and saves immediately, so the final CommitAsync is not one batch and whole-feed retries can replay partial commits. Persist bounded orders and receipts together, keep input-ordered entity references for returned IDs, replace tracker scans with import-owned progress, and add durable replay identity. Next, OrderQueryService.GetLateOrdersAsync and HasBackorderedProductsAsync cross ToList/ToArray before filtering, CountReadyOrdersAsync counts for existence, and GetQueueStatistics enumerates the deferred database sequence three times; keep predicates and a combined numeric aggregate server-side. GetDashboardRowsAsync is unbounded. GetRecentPageAsync, the explicit complete ledger export, the bounded review mutation, and archive chunk ownership are sound counterparts. Validation was source-only; no query counts, SQL, build, or runtime behavior was measured.
    graders:
      - type: tool-calls
        config:
          disallowed: [bash, powershell, edit, create]
      - type: exit-success
      - type: prompt
    rubric:
      - Traces GetLateOrdersAsync into LoadOpenOrderCandidatesAsync and identifies that the cutoff filter and projection happen after ToListAsync
      - Traces HasBackorderedProductsAsync into LoadActiveProductPricesAsync and recommends a query-side AnyAsync predicate instead of materializing the price array
      - Traces HasOrdersToShipAsync into CountReadyOrdersAsync and recommends AnyAsync for the existence check
      - Identifies that GetQueueStatistics enumerates GetQueue's deferred database sequence three times through IEnumerable-based aggregates, loading rows repeatedly instead of computing a combined database summary
      - Recommends a server-side aggregate for the queue statistics while preserving all three numeric outputs, rather than parallelizing queries on the same context or merely caching an unbounded list
      - Identifies GetDashboardRowsAsync as potentially unbounded despite its tenant filter and recommends a stable page, chunk, or explicit limit
      - Does not duplicate the materialize-then-reduce findings as separate unbounded-query findings
      - Recognizes GetRecentPageAsync as bounded and ordered and treats the small status lookup and explicit ledger export according to their stated contracts rather than declaring every ToListAsync defective
      - Preserves ExportLedgerAsync's complete result contract; streaming or chunking is acceptable optional mitigation, not required to invent a defect in the export
      - Identifies that ImportJournal.RecordImportedAsync persists the shared import context per order, so the final CommitAsync does not establish one batched operation
      - Explains that saved orders remain tracked and per-row Entries inspection triggers repeated detection over the growing graph
      - Recommends bounded persistence of orders and receipts together, with progress counters or equivalent removal of repeated tracker scans
      - Preserves receipt progress and returned-ID order by retaining input-ordered entities rather than assuming numerical identity allocation order
      - Addresses partial commits and durable replay handling for whole-feed retries rather than presenting chunking or a final save as sufficient idempotency
      - Recognizes the import's bounded review mutation and archive's explicit chunk saves and owned-context clearing as sound counterparts
      - States that the conclusions are source-based and that no executable validation was performed

  - name: Review order history pagination behavior
    prompt: |
      Review this application's EF Core order-history endpoints and shared query helpers.
      Mobile clients continue from the timestamp and ID of the last displayed order; support staff
      still jump to arbitrary page numbers. Partner backfills can add older orders with newly
      allocated IDs. Users report missing history entries and inconsistent support queue ordering.

      Recommend supported performance and correctness improvements without changing these
      endpoint contracts. Use source-browsing tools only. Do not edit files or run shell commands,
      code, tests, builds, applications, or analyzers.
    tags:
      capability: paging-order-review
      risk: high
      journey: history-query-review
    environment:
      files:
        - src: fixtures/shared/CommerceData.cs
          dest: CommerceData.cs
        - src: fixtures/paging-sorting
          dest: .
        - *validator-program
        - *validator-project
        - *validator-fixtures
      commands:
        - dotnet run --project .eval-harness/fixture-validation/ReviewFixtures.csproj -- --case paging-sorting
        - *remove-validator-harness
      commandTimeout: 6m
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-review-order-history"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              First fix correctness: OrderHistoryService.GetSearchPageAsync reaches HistoryQueryRules.Page before any order, so Skip/Take is nondeterministic. GetNextPageAsync reaches HistoryQueryRules.After, whose independent CreatedAt and Id bounds exclude older backfills with newer IDs; use CreatedAt < cursor time OR equal time with Id < cursor ID, then retain the descending pair. SupportPriority replaces arrival-time ordering instead of adding a tie-breaker, so preserve CreatedAt as primary. GetRecentPageAsync and GetWindowSortedByValue are sound bounded paths. GetJumpPageAsync has deep-offset cost, but keyset is not contract-preserving for required random page numbers. These conclusions are source-only; no SQL plan or latency was observed.
    graders:
      - type: tool-calls
        config:
          disallowed: [bash, powershell, edit, create]
      - type: exit-success
      - type: prompt
    rubric:
      - Identifies GetSearchPageAsync as reaching Page with no deterministic order before Skip and Take
      - Identifies that GetNextPageAsync applies independent bounds to CreatedAt and Id rather than advancing through their combined descending order, which can exclude older backfilled orders with higher IDs
      - Proposes a lexicographic continuation predicate that accepts any earlier timestamp and uses the ID bound only for equal timestamps, preserving the descending sort and last-row cursor
      - Identifies that SupportPriority replaces the arrival-time ordering with value ordering, contrary to the stated queue contract, and recommends preserving arrival time as the primary key
      - Recognizes GetRecentPageAsync's fully ordered bounded query as sound
      - Recognizes GetWindowSortedByValue as selecting an ID-ordered database window before reordering only that bounded window in memory
      - Notes that GetJumpPageAsync can become slower on deep pages but does not present keyset pagination as behavior-preserving because the documented API requires random page-number access
      - Avoids claiming measured latency or an observed execution plan

  - name: Review route planning data access
    prompt: |
      Review this application's EF Core route-planning service before a regional rollout. The
      application uses EF Core 10 with SQL Server. Warehouse-wide departure boards have become
      slower as routes accumulate, while carrier-specific requests remain responsive.

      Find any supported performance or correctness improvements in the supplied service and
      configuration, with locations, impact, and safe next steps. Distinguish evidence from
      deployment assumptions. Use source-browsing tools only; do not edit files or run shell
      commands, code, tests, builds, database commands, or analyzers.
    tags:
      capability: model-query-performance-review
      risk: medium
      journey: migration-review
    environment:
      files:
        - src: fixtures/route-planning
          dest: .
        - *validator-program
        - *validator-project
        - *validator-fixtures
      commands:
        - dotnet run --project .eval-harness/fixture-validation/ReviewFixtures.csproj -- --case route-planning
        - *remove-validator-harness
      commandTimeout: 6m
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "ef-review-route-planning"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              RoutePlanningService.GetWarehouseRoutesAsync filters WarehouseId, ranges and orders by DepartsAt, then Id, but RouteConfigurations starts its explicit route index with unconstrained CarrierId. The relationship convention can still create WarehouseId-CarrierId coverage, so the evidenced gap is the missing date/order prefix, not proof that no warehouse-leading index exists. Validate a WarehouseId-DepartsAt-Id workload index or provider-equivalent before changing schema. GetCarrierRoutesAsync constrains both leading equality columns, and GetUpcomingWindowsAsync matches its configured equality-range-order index; keep them. Model metadata was inspected, but deployed physical indexes, plans, and timing were not.
    graders:
      - type: tool-calls
        config:
          disallowed: [bash, powershell, edit, create]
      - type: exit-success
      - type: prompt
    rubric:
      - Correlates GetWarehouseRoutesAsync's warehouse equality, departure range, and date-ID ordering with the configured index beginning CarrierId, which the query does not constrain
      - Recognizes that EF's foreign-key convention can also supply a WarehouseId-CarrierId index, so the problem is incomplete coverage for the date range and ordering rather than proof of no WarehouseId-leading index
      - Recommends workload validation of a WarehouseId-DepartsAt-Id index or equivalent coverage, explaining the unused CarrierId between the desired equality and range keys
      - Recognizes that GetCarrierRoutesAsync constrains both initial index columns by equality, so their reversed order is not itself a defect for that call path
      - Recognizes GetUpcomingWindowsAsync's configured index as matching its equality, range, and order shape
      - Uses the model-building code as evidence of intended coverage without claiming that production plans or all physical indexes were observed

