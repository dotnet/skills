                .filter(file => !file.startsWith("create-datadriven-aspnetcore/"));
              process.exit(
                source === "d40d2d1e48974e6396fdbff3c8046bea8ce5f424834f1fe7786b09545b581d87"
                && project === "85504278f61edf39ab8321c61f47b8532cdcc0efec2a29f7b4a42086fbe63c93"
                && JSON.stringify(files) === JSON.stringify([
