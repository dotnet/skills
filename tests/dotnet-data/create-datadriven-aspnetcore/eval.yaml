  - name: Add required-parent Minimal API routes and ordered requests
    prompt: |
      In fixtures/minimal-api-parent-fk/ParentChildApi.csproj, add complete Product and Category
      Minimal API CRUD. Product requires Category. Reuse StoreDbContext with SQLite, place mappings
      in ProductEndpoints, add descriptive OpenAPI metadata, create a migration, and add a .http
      workflow that creates a category first and reuses its returned id when creating a product.
      Do not use command-line scaffolding or EnsureCreated.
    tags: { capability: minimal-api-required-parent-flow, risk: high, journey: add-parent-child-api }
    environment:
      files:
        - { src: fixtures/minimal-api-parent-fk, dest: fixtures/minimal-api-parent-fk }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "data-scaffold-parent-child-api"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - { step_id: 1, source: agent, message: "Expected result: complete Category and Product route groups reuse StoreDbContext, include a migration and OpenAPI metadata, and provide an HTTP workflow that creates Category first and uses its returned id." }
    graders:
      - { type: file-contains, config: { path: fixtures/minimal-api-parent-fk/Program.cs, value: StoreDbContext } }
      - { type: file-exists, config: { path: "fixtures/minimal-api-parent-fk/**/*Product*Endpoints*.cs" } }
      - { type: file-exists, config: { path: "fixtures/minimal-api-parent-fk/**/Migrations/*.cs" } }
      - { type: file-exists, config: { path: "fixtures/minimal-api-parent-fk/**/*.http" } }
      - { type: file-contains, config: { path: "fixtures/minimal-api-parent-fk/**/*.cs", value: MapGroup } }
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const fs = require("fs");
              const path = require("path");
              const root = "fixtures/minimal-api-parent-fk";
              function findHttpFiles(directory) {
                return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
                  const full = path.join(directory, entry.name);
                  return entry.isDirectory()
                    ? findHttpFiles(full)
                    : entry.name.endsWith(".http") ? [full] : [];
                });
              }
              const valid = findHttpFiles(root).some(file => {
                const blocks = fs.readFileSync(file, "utf8").split(/^###.*$/m);
                const categoryIndex = blocks.findIndex(
                  block => /^\s*POST\s+\S*\/categories?(?:[/?\s]|$)/im.test(block));
                const productIndex = blocks.findIndex(
                  block => /^\s*POST\s+\S*\/products?(?:[/?\s]|$)/im.test(block));
                if (categoryIndex < 0 || productIndex <= categoryIndex) return false;

                const productBlock = blocks[productIndex];
                const categoryLine = productBlock.match(
                  /["']?categoryId["']?\s*:[^\r\n]+/i)?.[0];
                if (!categoryLine) return false;
                const expressions = [...categoryLine.matchAll(/\{\{([^}]+)\}\}/g)]
                  .map(match => match[1].trim());
                const categoryBlock = blocks[categoryIndex];
                const categoryName = categoryBlock.match(
                  /#\s*@name\s+([A-Za-z_][\w.-]*)/i)?.[1];
                if (categoryName && expressions.some(expression =>
                  expression.toLowerCase().startsWith(
                    categoryName.toLowerCase() + ".response.body"))) return true;

                const setup = blocks.slice(0, productIndex).join("\n");
                const special = "\\^$.*+?()[]{}|";
                function escapeRegex(value) {
                  return [...value]
                    .map(character => special.includes(character) ? "\\" + character : character)
                    .join("");
                }
                return expressions.some(expression => {
                  const variable = expression.match(/^([A-Za-z_][\w.-]*)$/)?.[1];
                  if (!variable) return false;
                  const escaped = escapeRegex(variable);
                  const handlerCapture = new RegExp(
                    "(?:set\\s*\\(\\s*[\"']" + escaped
                    + "[\"'][\\s\\S]*response\\.body|@" + escaped
                    + "\\s*=[^\\r\\n]*response\\.body)",
                    "i").test(categoryBlock);
                  const namedCapture = categoryName && new RegExp(
                    "@" + escaped + "\\s*=\\s*\\{\\{\\s*"
                    + escapeRegex(categoryName) + "\\.response\\.body",
                    "i").test(setup);
                  return handlerCapture || namedCapture;
                });
              });
              process.exit(valid ? 0 : 1);
          expected_exit_code: 0
      - { type: file-not-contains, config: { path: fixtures/minimal-api-parent-fk/Program.cs, value: EnsureCreated } }
      - type: run-command
        config:
          command: dotnet
          args: [build, fixtures/minimal-api-parent-fk/ParentChildApi.csproj, --nologo]
          expected_exit_code: 0
          stdout_matches: (Build succeeded|0 Error)
          timeout: 6m
      - type: prompt
    rubric:
      - Reused StoreDbContext and added complete Category and Product CRUD route groups
      - Added accurate names, tags, descriptions, success responses, and error responses
      - Created a migration and a dependency-ordered request workflow using the real parent id
      - Built successfully without command-line scaffolding or EnsureCreated

  - name: Add Blazor CRUD without breaking interactive render mode
    prompt: |
      Add complete Blazor CRUD components for Employee in fixtures/blazor-crud/BlazorApp.csproj.
      Use a new AppDbContext with SQLite, create a migration, include any required Department flow,
      and add navigation. Preserve the project's existing interactive server configuration and use
      safe initial form models. Do not use command-line scaffolding or EnsureCreated.
    tags: { capability: blazor-crud-render-mode-preservation, risk: high, journey: add-blazor-data-ui }
    environment:
      files:
        - { src: fixtures/blazor-crud, dest: fixtures/blazor-crud }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "data-scaffold-blazor-crud"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - { step_id: 1, source: agent, message: "Expected result: Employee and Department CRUD, AppDbContext with SQLite, a migration, navigation, preserved interactive server chains, safely initialized form models, and a clean build." }
    graders:
      - { type: file-exists, config: { path: "fixtures/blazor-crud/**/*AppDbContext*.cs" } }
      - { type: file-exists, config: { path: "fixtures/blazor-crud/**/Migrations/*.cs" } }
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const fs = require("fs");
              const path = require("path");
              const root = "fixtures/blazor-crud/Components";
              function razorFiles(directory) {
                return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
                  const full = path.join(directory, entry.name);
                  return entry.isDirectory()
                    ? razorFiles(full)
                    : entry.name.endsWith(".razor") ? [full] : [];
                });
              }
              const files = razorFiles(root).map(file => ({
                path: file.replaceAll("\\", "/").toLowerCase(),
                text: fs.readFileSync(file, "utf8").toLowerCase()
              }));
              function completeSurface(entity) {
                const surfaces = files.filter(file => file.path.includes(entity));
                if (surfaces.length === 0) return false;
                const combined = surfaces.map(file => file.path + "\n" + file.text).join("\n");
                return [
                  /(?:index|list|\/employees?"|\/departments?"|foreach|<table)/,
                  /details?/,
                  /(?:create|new)/,
                  /(?:edit|update)/,
                  /(?:delete|remove)/
                ].every(pattern => pattern.test(combined));
              }
              process.exit(
                completeSurface("employee") && completeSurface("department") ? 0 : 1);
          expected_exit_code: 0
      - { type: file-contains, config: { path: fixtures/blazor-crud/Program.cs, value: AddInteractiveServerRenderMode } }
      - { type: file-not-contains, config: { path: "fixtures/blazor-crud/**/*.razor", value: " = null!" } }
      - { type: file-not-contains, config: { path: fixtures/blazor-crud/Program.cs, value: EnsureCreated } }
      - type: run-command
        config:
          command: dotnet
          args: [build, fixtures/blazor-crud/BlazorApp.csproj, --nologo]
          expected_exit_code: 0
          stdout_matches: (Build succeeded|0 Error)
          timeout: 6m
      - type: prompt
    rubric:
      - Added complete Employee and required Department flows with reachable navigation
      - Created and registered AppDbContext with SQLite and generated a migration
      - Preserved interactive server configuration and safely initialized form-bound models
      - Matched existing Blazor conventions and built without command-line scaffolding or EnsureCreated

