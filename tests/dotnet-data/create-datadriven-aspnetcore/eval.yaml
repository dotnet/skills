      - { type: file-exists, config: { path: "fixtures/minimal-api/**/*TodoDbContext*.cs" } }
      - { type: file-exists, config: { path: "fixtures/minimal-api/**/Migrations/*.cs" } }
      - { type: file-exists, config: { path: "fixtures/minimal-api/**/*.http" } }
      - { type: file-contains, config: { path: "fixtures/minimal-api/**/*TodoEndpoints*.cs", value: WithName } }
      - { type: file-contains, config: { path: "fixtures/minimal-api/**/*TodoEndpoints*.cs", value: Produces } }
      - { type: file-not-contains, config: { path: fixtures/minimal-api/Program.cs, value: EnsureCreated } }
      - type: run-command
