  - name: Leave complete Minimal API CRUD unchanged
    prompt: |
      Review CompleteTodoEndpoints.cs for these requirements: list/by-id/create/update/delete
      routes, server-assigned IDs, non-empty title validation, async EF Core calls, correct status
      codes, and useful OpenAPI metadata. Fix only a gap in those requirements. If they are already
      complete, explain why and leave the file unchanged.
    tags: { capability: idempotent-complete-api-review, risk: low, journey: verify-existing-api }
    environment:
      files:
        - { src: fixtures/already-complete/CompleteTodoEndpoints.cs, dest: CompleteTodoEndpoints.cs }
        - { src: fixtures/already-complete/CompleteTodoApi.csproj, dest: CompleteTodoApi.csproj }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "data-scaffold-complete-api-noop"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - { step_id: 1, source: agent, message: "All five CRUD operations, server-assigned IDs, title validation, async EF Core calls, status paths, and OpenAPI names, tags, descriptions, and responses already exist. No edit is needed." }
    graders:
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const crypto = require("crypto");
              const fs = require("fs");
              const data = fs.readFileSync("CompleteTodoEndpoints.cs", "utf8").replace(/\r\n/g, "\n");
              const actual = crypto.createHash("sha256").update(data).digest("hex");
              process.exit(actual === "d40d2d1e48974e6396fdbff3c8046bea8ce5f424834f1fe7786b09545b581d87" ? 0 : 1);
          expected_exit_code: 0
      - type: run-command
        config:
          command: dotnet
          args: [build, CompleteTodoApi.csproj, --nologo]
          expected_exit_code: 0
          stdout_matches: (Build succeeded|0 Error)
          timeout: 4m
      - { type: output-matches, config: { pattern: "(already|complete|no (gap|change|edit)|nothing to fix)" } }
      - type: prompt
    rubric:
      - Recognized that all five CRUD operations, server-assigned IDs, and title validation already exist
      - Recognized that async EF calls, response paths, and endpoint metadata satisfy the request
      - Left the file byte-for-byte unchanged instead of generating duplicate routes or types

  - name: Stay dormant for a non-web class library
    prompt: |
      In fixtures/non-web/Utility.csproj, add a CsvReportWriter with
      WriteRow(TextWriter writer, string title, decimal total). Write one CSV row, quote and escape
      the title, and format the decimal with invariant culture. This is a plain .NET class library
      with no web host or database. Keep the existing ReportWriter unchanged.
    expect_activation: false
    tags: { capability: boundary-non-aspnet-project, risk: routing, journey: redirect-non-web-code-generation }
    environment:
      files:
        - { src: fixtures/non-web, dest: fixtures/non-web }
    golden_patch:
      path: references/add-csv-report-writer.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "data-scaffold-dormancy-class-library"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - { step_id: 1, source: agent, message: "Expected result: a plain CsvReportWriter class with the existing ReportWriter unchanged and no ASP.NET Core, Entity Framework, controller, page, endpoint, or database artifacts." }
    graders:
      - { type: file-contains, config: { path: "fixtures/non-web/**/*.cs", value: CsvReportWriter } }
      - { type: file-not-contains, config: { path: fixtures/non-web/Utility.csproj, value: Microsoft.AspNetCore } }
      - { type: file-not-contains, config: { path: fixtures/non-web/Utility.csproj, value: EntityFrameworkCore } }
      - type: run-command
        config:
          command: dotnet
          args: [run, --project, fixtures/non-web/Verifier/Verifier.csproj, --nologo]
          expected_exit_code: 0
          stdout_contains: CSV-VERIFIED
          timeout: 4m
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const crypto = require("crypto");
              const fs = require("fs");
              function digest(path) {
                const data = fs.readFileSync(path, "utf8").replace(/\r\n/g, "\n");
                return crypto.createHash("sha256").update(data).digest("hex");
              }
              const program = digest("fixtures/non-web/Program.cs");
              const project = digest("fixtures/non-web/Utility.csproj");
              const verifier = digest("fixtures/non-web/Verifier/Program.cs");
              const verifierProject = digest("fixtures/non-web/Verifier/Verifier.csproj");
              process.exit(
                program === "62dcf26c0762a4876649255e87a370d622bb754fe04891d68642e10a303f04d6"
                && project === "b922ca987189c1031e4ccc3285c48e45c7ea3fb563b7a560a587250936416f43"
                && verifier === "e0563ba4560daa58b8681ca5218bc81faad8924fd701d6f781f055e331c9cb6a"
                && verifierProject === "4de9357b55256ab43e871f5b619456ad0b25af8dd7a9cfacbd943ac470a787b4"
                ? 0 : 1);
          expected_exit_code: 0
      - type: prompt
