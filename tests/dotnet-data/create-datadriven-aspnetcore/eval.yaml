      - type: run-command
        config:
          command: node
          args: [validators/validate-generated.mjs, todo-api, fixtures/minimal-api]
          expected_exit_code: 0
      - type: run-command
        config:
          command: dotnet
          args: [build, fixtures/minimal-api/TodoApi.csproj, --nologo]
          expected_exit_code: 0
          stdout_matches: (Build succeeded|0 Error)
          timeout: 6m
      - type: prompt
