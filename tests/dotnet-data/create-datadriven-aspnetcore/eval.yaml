  - name: Reuse an existing MVC DbContext and add parent navigation
    prompt: |
      The project at fixtures/mvc-existing-dbcontext/CatalogMvc.csproj already has CatalogDbContext.
      Add an MVC BooksController with complete views for Book and complete Author CRUD because Book
      requires an Author. Reuse the existing context, add navigation to both resources, create an EF
      Core migration, and do not create a second context, use command-line scaffolding, EnsureCreated,
      or startup seeding.
    tags: { capability: mvc-existing-context-crud, risk: high, journey: extend-existing-mvc-data-ui }
    environment:
      files:
        - { src: fixtures/mvc-existing-dbcontext, dest: fixtures/mvc-existing-dbcontext }
        - { src: validators/validate-generated.mjs, dest: validators/validate-generated.mjs }
    golden_patch:
      path: references/add-mvc-book-author-crud.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "data-scaffold-mvc-existing-context"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: "I will reuse the supplied CatalogDbContext, add complete controllers and views for both entities, then build and verify the migration."
            tool_calls:
              - tool_call_id: inspect-mvc-fixture
                function_name: read_files
                arguments:
                  paths: [CatalogMvc.csproj, Program.cs, Data/CatalogDbContext.cs, Models/Book.cs, Models/Author.cs]
              - tool_call_id: implement-mvc-crud
                function_name: apply_patch
                arguments:
                  patch: |-
                    Representative applied changes:
                    - BooksController Create POST checks ModelState, adds Book, awaits SaveChangesAsync, and reloads `ViewData["AuthorId"] = new SelectList(...)` on validation failure.
                    - BooksController Edit loads by id, validates the bound model, updates the existing Book, awaits SaveChangesAsync, and handles not-found/concurrency paths.
                    - Both controllers implement async Index, Details, Create, Edit, Delete GET, and confirmed Delete POST actions using CatalogDbContext.
                    - Views/Books/Create.cshtml and Edit.cshtml use `<select asp-for="AuthorId" asp-items="ViewBag.AuthorId">`, validation summary, and per-field validation.
                    - Ten Bootstrap views, navigation links, the migration, and the Design package were added without creating another DbContext.
              - tool_call_id: build-mvc-crud
                function_name: run_command
                arguments:
                  command: dotnet build fixtures/mvc-existing-dbcontext/CatalogMvc.csproj --nologo
            observation:
              results:
                - { source_call_id: inspect-mvc-fixture, content: "CatalogDbContext already exposes Authors and Books; Book has required AuthorId and validation attributes." }
                - { source_call_id: implement-mvc-crud, content: "Added two complete controllers, ten views, migration, author SelectList binding, anti-forgery mutation actions, and resource navigation without adding another context." }
                - { source_call_id: build-mvc-crud, content: "Determining projects to restore... CatalogMvc -> bin/Debug/net10.0/CatalogMvc.dll. Build succeeded. 0 Warning(s), 0 Error(s)." }
          - step_id: 2
            source: agent
            message: "Reused CatalogDbContext and built complete Book and Author MVC CRUD with validation, AuthorId selection, navigation, and a migration. I did not add a second context, command-line scaffolding, EnsureCreated, or startup seeding."
    graders:
      - { type: file-exists, config: { path: "fixtures/mvc-existing-dbcontext/**/Controllers/*Book*Controller*.cs" } }
      - { type: file-exists, config: { path: "fixtures/mvc-existing-dbcontext/**/Controllers/*Author*Controller*.cs" } }
      - { type: file-exists, config: { path: "fixtures/mvc-existing-dbcontext/**/Views/Books/*.cshtml" } }
      - { type: file-exists, config: { path: "fixtures/mvc-existing-dbcontext/**/Views/Authors/*.cshtml" } }
      - { type: file-exists, config: { path: "fixtures/mvc-existing-dbcontext/**/Migrations/*.cs" } }
      - { type: file-not-contains, config: { path: fixtures/mvc-existing-dbcontext/Program.cs, value: EnsureCreated } }
      - type: run-command
        config:
          command: node
          args: [validators/validate-generated.mjs, mvc, fixtures/mvc-existing-dbcontext]
          expected_exit_code: 0
      - type: run-command
        config:
          command: dotnet
          args: [build, fixtures/mvc-existing-dbcontext/CatalogMvc.csproj, --nologo]
          expected_exit_code: 0
          stdout_matches: (Build succeeded|0 Error)
          timeout: 6m
      - type: prompt
        config:
          evidence: [trajectory, diff]
    rubric:
      - Reused CatalogDbContext rather than creating a competing data context
      - Added complete Book and Author MVC flows with correct binding, validation, and Author selection
      - Matched the existing UI framework and added navigation to both resources
      - Created a migration and built without EnsureCreated, startup seeding, or command-line scaffolding

  - name: Add Product and Category Minimal API CRUD from an empty database
    prompt: |
      In fixtures/minimal-api-parent-fk/ParentChildApi.csproj, add complete Product and Category
      Minimal API CRUD. Product requires Category. Reuse StoreDbContext with SQLite, place mappings
      in ProductEndpoints, add descriptive OpenAPI metadata, and create a migration. Include an
      executable .http workflow that exercises the end-to-end Product and Category experience
      starting from an empty database. Do not use command-line scaffolding or EnsureCreated.
    tags: { capability: minimal-api-required-parent-flow, risk: high, journey: add-parent-child-api }
    environment:
      files:
        - { src: fixtures/minimal-api-parent-fk, dest: fixtures/minimal-api-parent-fk }
        - { src: validators/validate-generated.mjs, dest: validators/validate-generated.mjs }
    golden_patch:
      path: references/add-parent-child-minimal-api-crud.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "data-scaffold-parent-child-api"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: "I will reuse StoreDbContext, add complete Category and Product route groups, then verify that the HTTP workflow carries the created parent ID into Product creation."
            tool_calls:
              - tool_call_id: inspect-parent-api
                function_name: read_files
                arguments:
                  paths: [ParentChildApi.csproj, Program.cs, Data/StoreDbContext.cs, Models/Product.cs, Models/Category.cs]
              - tool_call_id: implement-parent-api
                function_name: apply_patch
                arguments:
                  patch: "Added migration, ProductEndpoints with Category and Product list/by-id/create/update/delete routes, validation and OpenAPI metadata, endpoint mapping, and a named Category POST whose response id is reused in Product.http."
              - tool_call_id: build-parent-api
                function_name: run_command
                arguments:
                  command: dotnet build fixtures/minimal-api-parent-fk/ParentChildApi.csproj --nologo
            observation:
              results:
                - { source_call_id: inspect-parent-api, content: "StoreDbContext already exposes both DbSets; Product requires CategoryId and both models use validation attributes." }
                - { source_call_id: implement-parent-api, content: "Added ten CRUD routes, migration and metadata; the HTTP file creates Category first and uses createCategory.response.body.$.id for Product.CategoryId." }
                - { source_call_id: build-parent-api, content: "Build succeeded. 0 Error(s)." }
          - step_id: 2
            source: agent
            message: "Implemented and built complete Category and Product Minimal API CRUD using StoreDbContext, a migration, validation and OpenAPI metadata. The executable request workflow creates Category first and reuses its returned ID; no EnsureCreated or command-line scaffolding was used."
    graders:
      - { type: file-contains, config: { path: fixtures/minimal-api-parent-fk/Program.cs, value: StoreDbContext } }
      - { type: file-exists, config: { path: "fixtures/minimal-api-parent-fk/**/*Product*Endpoints*.cs" } }
      - { type: file-exists, config: { path: "fixtures/minimal-api-parent-fk/**/Migrations/*.cs" } }
      - { type: file-exists, config: { path: "fixtures/minimal-api-parent-fk/**/*.http" } }
      - { type: file-contains, config: { path: "fixtures/minimal-api-parent-fk/**/*.cs", value: MapGroup } }
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const fs = require("fs");
              const path = require("path");
              const root = "fixtures/minimal-api-parent-fk";
              function findHttpFiles(directory) {
                return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
                  const full = path.join(directory, entry.name);
                  return entry.isDirectory()
                    ? findHttpFiles(full)
                    : entry.name.endsWith(".http") ? [full] : [];
                });
              }
              const valid = findHttpFiles(root).some(file => {
                const blocks = fs.readFileSync(file, "utf8").split(/^###.*$/m);
                const categoryIndex = blocks.findIndex(
                  block => /^\s*POST\s+\S*\/categor(?:y|ies)(?:[/?\s]|$)/im.test(block));
                const productIndex = blocks.findIndex(
                  block => /^\s*POST\s+\S*\/products?(?:[/?\s]|$)/im.test(block));
                if (categoryIndex < 0 || productIndex <= categoryIndex) return false;

                const productBlock = blocks[productIndex];
                const categoryLine = productBlock.match(
                  /["']?categoryId["']?\s*:[^\r\n]+/i)?.[0];
                if (!categoryLine) return false;
                const expressions = [...categoryLine.matchAll(/\{\{([^}]+)\}\}/g)]
                  .map(match => match[1].trim());
                const categoryBlock = blocks[categoryIndex];
                const categoryName = categoryBlock.match(
                  /#\s*@name\s+([A-Za-z_][\w.-]*)/i)?.[1];
                const special = "\\^$.*+?()[]{}|";
                function escapeRegex(value) {
                  return [...value]
                    .map(character => special.includes(character) ? "\\" + character : character)
                    .join("");
                }
                const responseIdSuffix = "\\.response\\.body(?:\\.\\$)?\\.id";
                if (categoryName) {
                  const namedResponseId = new RegExp(
                    "^" + escapeRegex(categoryName) + responseIdSuffix + "$", "i");
                  if (expressions.some(expression => namedResponseId.test(expression))) return true;
                }

                const setup = blocks.slice(0, productIndex).join("\n");
                return expressions.some(expression => {
                  const variable = expression.match(/^([A-Za-z_][\w.-]*)$/)?.[1];
                  if (!variable) return false;
                  const escaped = escapeRegex(variable);
                  const handlerCapture = new RegExp(
                    "(?:set\\s*\\(\\s*[\"']" + escaped
                    + "[\"'][\\s\\S]*response\\.body(?:\\.\\$)?\\.id|@" + escaped
                    + "\\s*=[^\\r\\n]*response\\.body(?:\\.\\$)?\\.id)",
                    "i").test(categoryBlock);
                  const namedCapture = categoryName && new RegExp(
                    "@" + escaped + "\\s*=\\s*\\{\\{\\s*"
                    + escapeRegex(categoryName) + responseIdSuffix + "\\s*\\}\\}",
                    "i").test(setup);
                  return handlerCapture || namedCapture;
                });
              });
              process.exit(valid ? 0 : 1);
          expected_exit_code: 0
      - { type: file-not-contains, config: { path: fixtures/minimal-api-parent-fk/Program.cs, value: EnsureCreated } }
      - type: run-command
        config:
          command: node
          args: [validators/validate-generated.mjs, parent-api, fixtures/minimal-api-parent-fk]
          expected_exit_code: 0
      - type: run-command
        config:
          command: dotnet
          args: [build, fixtures/minimal-api-parent-fk/ParentChildApi.csproj, --nologo]
          expected_exit_code: 0
          stdout_matches: (Build succeeded|0 Error)
          timeout: 6m
      - type: prompt
        config:
          evidence: [trajectory, diff]
    rubric:
      - Reused StoreDbContext and added complete Category and Product CRUD route groups
      - Added accurate names, tags, descriptions, success responses, and error responses
      - Created a migration and a dependency-ordered request workflow using the real parent id
      - Built successfully without command-line scaffolding or EnsureCreated

