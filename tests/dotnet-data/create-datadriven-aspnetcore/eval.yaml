name: create-datadriven-aspnetcore
tags:
  executionShard: heavy
description: Evaluates the dotnet-data/create-datadriven-aspnetcore skill
type: capability
defaults:
  timeout: 10m
  runs: 1
stimuli:
  - name: Add Razor Pages CRUD for a child and required parent
    prompt: |
      In fixtures/razor-pages-crud/MyApp.csproj, add complete Razor Pages CRUD for Product.
      Product has a required Category foreign key, so users must also be able to create and manage
      categories before products. Use a new AppDbContext with SQLite, create an EF Core migration,
      and do not use command-line scaffolding, EnsureCreated, or startup seeding.
    tags: { capability: razor-pages-parent-child-crud, risk: high, journey: add-razor-pages-crud }
    environment:
      files:
        - { src: fixtures/razor-pages-crud, dest: fixtures/razor-pages-crud }
        - { src: validators/validate-generated.mjs, dest: validators/validate-generated.mjs }
    golden_patch:
      path: references/add-razor-pages-crud.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "data-scaffold-razor-crud"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: "I will inspect the models and layout, add the EF data layer and complete parent-child page flows, then build the project."
            tool_calls:
              - tool_call_id: inspect-razor-fixture
                function_name: read_files
                arguments:
                  paths: [MyApp.csproj, Program.cs, Models/Product.cs, Models/Category.cs, Pages/Shared/_Layout.cshtml]
              - tool_call_id: implement-razor-crud
                function_name: apply_patch
                arguments:
                  patch: "Added AppDbContext, SQLite/Design packages and registration, migration, Product and Category Index/Details/Create/Edit/Delete pages with PageModel handlers, validation and CategoryId selection, and layout navigation."
              - tool_call_id: build-razor-crud
                function_name: run_command
                arguments:
                  command: dotnet build fixtures/razor-pages-crud/MyApp.csproj --nologo
            observation:
              results:
                - { source_call_id: inspect-razor-fixture, content: "Product requires CategoryId; both models use DataAnnotations; the app uses Razor Pages and Bootstrap layout navigation." }
                - { source_call_id: implement-razor-crud, content: "Added 29 files/edits covering context, migration, ten page pairs, category selection, validation, and navigation." }
                - { source_call_id: build-razor-crud, content: "Build succeeded. 0 Warning(s), 0 Error(s)." }
          - step_id: 2
            source: agent
            message: "Implemented and built complete Product and Category Razor Pages CRUD with one SQLite AppDbContext, a migration, validation-aware forms, CategoryId selection, and navigation. I did not use command-line scaffolding, EnsureCreated, or startup seeding."
    graders:
      - { type: file-exists, config: { path: "fixtures/razor-pages-crud/**/*AppDbContext*.cs" } }
      - { type: file-exists, config: { path: "fixtures/razor-pages-crud/**/Migrations/*.cs" } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Products/Index.cshtml } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Products/Details.cshtml } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Products/Create.cshtml } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Products/Edit.cshtml } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Products/Delete.cshtml } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Categories/Index.cshtml } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Categories/Details.cshtml } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Categories/Create.cshtml } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Categories/Edit.cshtml } }
      - { type: file-exists, config: { path: fixtures/razor-pages-crud/Pages/Categories/Delete.cshtml } }
      - { type: file-not-contains, config: { path: fixtures/razor-pages-crud/Program.cs, value: EnsureCreated } }
      - type: run-command
        config:
          command: node
          args: [validators/validate-generated.mjs, razor-pages, fixtures/razor-pages-crud]
          expected_exit_code: 0
      - &build-razor
        type: run-command
        config:
          command: dotnet
          args: [build, fixtures/razor-pages-crud/MyApp.csproj, --nologo]
          expected_exit_code: 0
          stdout_matches: (Build succeeded|0 Error)
          timeout: 6m
      - type: prompt
        config:
          evidence: [trajectory, diff]
    rubric:
      - Added list, details, create, edit, and delete flows for both Product and required parent Category
      - Created and registered one AppDbContext for SQLite and generated a migration
      - Added navigation so a user can create Category records before Product records
      - Preserved model validation and avoided EnsureCreated, startup seeding, and command-line scaffolding

  - name: Add Minimal API CRUD with executable requests and OpenAPI
