    environment:
      files:
        - { src: fixtures/minimal-api, dest: fixtures/minimal-api }
        - { src: validators/validate-generated.mjs, dest: validators/validate-generated.mjs }
    golden_patch:
      path: references/add-todo-minimal-api-crud.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "data-scaffold-minimal-api"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: "I will inspect the Todo model and host, add the data layer and endpoint group, then validate the request workflow and build."
