                  if (entry.isDirectory()) result.push(...stagedFiles(full, base));
                  else if (entry.isFile()) result.push(path.relative(base, full).replaceAll("\\", "/"));
                }
                return result.sort();
              }
              const fixtureRoot = "CompleteTodoApi";
              const source = digest(path.join(fixtureRoot, "CompleteTodoEndpoints.cs"));
              const project = digest(path.join(fixtureRoot, "CompleteTodoApi.csproj"));
