      Do not use command-line scaffolding or EnsureCreated.
    tags: { capability: minimal-api-openapi-crud, risk: high, journey: add-minimal-api-crud }
    environment:
      files:
        - { src: fixtures/minimal-api, dest: fixtures/minimal-api }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "data-scaffold-minimal-api"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - { step_id: 1, source: agent, message: "Expected result: all TodoItem CRUD routes, TodoDbContext with SQLite, a migration, ordered HTTP requests, unique OpenAPI names, tags, descriptions, and responses, and a clean build." }
