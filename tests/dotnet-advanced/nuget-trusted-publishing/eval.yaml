            message: |-
              This is a private Azure Artifacts feed, so keep the nuget.org publishing flow dormant. Use GitHub OIDC with a Microsoft Entra application or managed identity: add a federated credential whose subject matches this repository's branch or GitHub environment, add that service principal to the Azure DevOps organization, and grant it the feed's `Feed Publisher (Contributor)` role. In the workflow, grant `id-token: write`, sign in with `azure/login`, request an Azure DevOps access token for resource `499b84ac-1321-427f-aa17-267ca6975798`, and pass that short-lived token to a temporary NuGet source for `pkgs.dev.azure.com` before `dotnet nuget push`. Validate the exact federation subject and feed permission with the Azure administrators; do not create credentials or external resources from this review. The repository remains unchanged.
    environment:
