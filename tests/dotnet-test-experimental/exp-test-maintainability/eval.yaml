scenarios:
  - name: "Selectively recommend changes in mixed-quality test suite"
    prompt: |
      Can you assess the maintainability of these two test classes and tell me
      what's worth improving and what's fine as-is?

      ```csharp
      // File 1: UserServiceTests.cs
      using Microsoft.VisualStudio.TestTools.UnitTesting;

      namespace App.Tests;

      [TestClass]
      public sealed class UserServiceTests
      {
          [TestMethod]
          public void CreateUser_ValidInput_ReturnsUser()
          {
              var db = new InMemoryDb();
              var emailSvc = new FakeEmailService();
              var logger = new FakeLogger();
              var config = new ServiceConfig { MaxUsers = 100, RequireEmailVerification = true };
              var service = new UserService(db, emailSvc, logger, config);

              var user = service.Create("alice@example.com", "Alice");

              Assert.IsNotNull(user);
              Assert.AreEqual("alice@example.com", user.Email);
          }

          [TestMethod]
          public void CreateUser_DuplicateEmail_Throws()
          {
              var db = new InMemoryDb();
              var emailSvc = new FakeEmailService();
              var logger = new FakeLogger();
              var config = new ServiceConfig { MaxUsers = 100, RequireEmailVerification = true };
              var service = new UserService(db, emailSvc, logger, config);
              service.Create("alice@example.com", "Alice");

              Assert.ThrowsException<DuplicateEmailException>(
                  () => service.Create("alice@example.com", "Bob"));
          }

          [TestMethod]
          public void CreateUser_MaxUsersReached_Throws()
          {
              var db = new InMemoryDb();
              var emailSvc = new FakeEmailService();
              var logger = new FakeLogger();
              var config = new ServiceConfig { MaxUsers = 100, RequireEmailVerification = true };
              var service = new UserService(db, emailSvc, logger, config);
              for (int i = 0; i < 100; i++)
                  service.Create($"user{i}@example.com", $"User{i}");

              Assert.ThrowsException<CapacityExceededException>(
                  () => service.Create("overflow@example.com", "Overflow"));
          }

          [TestMethod]
          public void DeleteUser_ExistingUser_RemovesAndNotifies()
          {
              var db = new InMemoryDb();
              var emailSvc = new FakeEmailService();
              var logger = new FakeLogger();
              var config = new ServiceConfig { MaxUsers = 100, RequireEmailVerification = true };
              var service = new UserService(db, emailSvc, logger, config);
              var user = service.Create("alice@example.com", "Alice");

              service.Delete(user.Id);

              Assert.IsNull(db.FindById(user.Id));
              Assert.AreEqual(1, emailSvc.SentCount);
          }

          [TestMethod]
          public void UpdateUser_ChangesName()
          {
              var db = new InMemoryDb();
              var emailSvc = new FakeEmailService();
              var logger = new FakeLogger();
              var config = new ServiceConfig { MaxUsers = 100, RequireEmailVerification = true };
              var service = new UserService(db, emailSvc, logger, config);
              var user = service.Create("alice@example.com", "Alice");

              service.UpdateName(user.Id, "Alicia");

              Assert.AreEqual("Alicia", db.FindById(user.Id).Name);
          }
      }
      ```

      ```csharp
      // File 2: PermissionCheckerTests.cs
      using Microsoft.VisualStudio.TestTools.UnitTesting;

      namespace App.Tests;

      [TestClass]
      public sealed class PermissionCheckerTests
      {
          private static PermissionChecker CreateChecker(params string[] roles)
          {
              return new PermissionChecker(new FakeRoleProvider(roles));
          }

          [TestMethod]
          [DataRow("admin", true, DisplayName = "Admin can access dashboard")]
          [DataRow("editor", true, DisplayName = "Editor can access dashboard")]
          [DataRow("viewer", false, DisplayName = "Viewer cannot access dashboard")]
          [DataRow("guest", false, DisplayName = "Guest cannot access dashboard")]
          public void CanAccessDashboard_ChecksRolePermission(string role, bool expected)
          {
              var checker = CreateChecker(role);

              Assert.AreEqual(expected, checker.CanAccess("dashboard"));
          }

          [TestMethod]
          public void CanAccessAdmin_RequiresAdminRole()
          {
              var checker = CreateChecker("admin");
              Assert.IsTrue(checker.CanAccess("admin-panel"));
          }

          [TestMethod]
          public void CanAccessAdmin_NonAdmin_Denied()
          {
              var checker = CreateChecker("editor");
              Assert.IsFalse(checker.CanAccess("admin-panel"));
          }

          [TestMethod]
          public void MultipleRoles_HighestPrivilegeWins()
          {
              var checker = CreateChecker("viewer", "admin");
              Assert.IsTrue(checker.CanAccess("admin-panel"));
          }
      }
      ```
    assertions:
      - type: "output_matches"
        pattern: "(duplicat|repeat|setup|boilerplate|factory|helper|extract)"
      - type: "output_matches"
        pattern: "(good|well|clean|already|no.*(change|issue)|fine)"
      - type: "exit_success"
    rubric:
      - "Identified that UserServiceTests has a 5-line setup block duplicated across all 5 tests and recommended extracting a helper or using TestInitialize"
      - "Recognized that PermissionCheckerTests is already well-maintained with a helper method and data-driven patterns, and does NOT need significant changes"
      - "Showed concrete refactored code for UserServiceTests"
      - "Did not recommend unnecessary changes to PermissionCheckerTests (e.g., did not suggest consolidating the two admin-panel tests into DataRow when they test different things)"
      - "Correctly prioritized: UserServiceTests needs work, PermissionCheckerTests is fine as-is"
    timeout: 120

  - name: "Recommend data-driven patterns with display names for unclear parameters"
    prompt: |
      I need to add more test cases for our validation logic but each new case needs a whole new method.
      Can you suggest a better structure?

      ```csharp
      using Microsoft.VisualStudio.TestTools.UnitTesting;

      namespace Validation.Tests;

      [TestClass]
      public sealed class InputValidatorTests
      {
          [TestMethod]
          public void Validate_EmptyString_ReturnsFalse()
          {
              var validator = new InputValidator();
              var result = validator.Validate("");
              Assert.IsFalse(result.IsValid);
              Assert.AreEqual("Input cannot be empty", result.ErrorMessage);
          }

          [TestMethod]
          public void Validate_TooShort_ReturnsFalse()
          {
              var validator = new InputValidator();
              var result = validator.Validate("ab");
              Assert.IsFalse(result.IsValid);
              Assert.AreEqual("Input must be at least 3 characters", result.ErrorMessage);
          }

          [TestMethod]
          public void Validate_TooLong_ReturnsFalse()
          {
              var validator = new InputValidator();
              var result = validator.Validate(new string('x', 256));
              Assert.IsFalse(result.IsValid);
              Assert.AreEqual("Input must not exceed 255 characters", result.ErrorMessage);
          }

          [TestMethod]
          public void Validate_ContainsSpecialChars_ReturnsFalse()
          {
              var validator = new InputValidator();
              var result = validator.Validate("hello<script>");
              Assert.IsFalse(result.IsValid);
              Assert.AreEqual("Input contains invalid characters", result.ErrorMessage);
          }

          [TestMethod]
          public void Validate_ValidInput_ReturnsTrue()
          {
              var validator = new InputValidator();
              var result = validator.Validate("hello-world");
              Assert.IsTrue(result.IsValid);
              Assert.IsNull(result.ErrorMessage);
          }

          [TestMethod]
          public void Validate_MinLength_ReturnsTrue()
          {
              var validator = new InputValidator();
              var result = validator.Validate("abc");
              Assert.IsTrue(result.IsValid);
              Assert.IsNull(result.ErrorMessage);
          }

          [TestMethod]
          public void Validate_MaxLength_ReturnsTrue()
          {
              var validator = new InputValidator();
              var result = validator.Validate(new string('a', 255));
              Assert.IsTrue(result.IsValid);
              Assert.IsNull(result.ErrorMessage);
          }

          [TestMethod]
          public void Validate_Null_ReturnsFalse()
          {
              var validator = new InputValidator();
              var result = validator.Validate(null);
              Assert.IsFalse(result.IsValid);
              Assert.AreEqual("Input cannot be empty", result.ErrorMessage);
          }

          [TestMethod]
          public void Validate_WhitespaceOnly_ReturnsFalse()
          {
              var validator = new InputValidator();
              var result = validator.Validate("   ");
              Assert.IsFalse(result.IsValid);
              Assert.AreEqual("Input cannot be empty", result.ErrorMessage);
          }
      }
      ```
    assertions:
      - type: "output_matches"
        pattern: "(DataRow|InlineData|TestCase|data.driven|parameteriz)"
      - type: "output_matches"
        pattern: "(DisplayName|display.name)"
      - type: "exit_success"
    rubric:
      - "Identified that the invalid-input tests can be consolidated into a parameterized test with DataRow"
      - "Identified that the valid-input tests can similarly be consolidated"
      - "Recommended using DisplayName parameters to label each test case clearly, especially for non-obvious inputs like boundary lengths"
      - "Showed concrete refactored code with descriptive display names"
      - "Acknowledged that the tests are otherwise well-structured (focused, clear assertions, proper naming)"
    timeout: 120

  - name: "Recognize well-maintained tests that need minimal changes"
    prompt: |
      Can you review these tests for maintainability? I want to make sure they'll be easy
      to update as the codebase evolves.

      ```csharp
      using Microsoft.VisualStudio.TestTools.UnitTesting;

      namespace Auth.Tests;

      [TestClass]
      public sealed class TokenServiceTests
      {
          [TestMethod]
          [DataRow("user@example.com", "admin", DisplayName = "Admin user gets full-access token")]
          [DataRow("viewer@example.com", "viewer", DisplayName = "Viewer gets read-only token")]
          [DataRow("api@example.com", "service", DisplayName = "Service account gets API token")]
          public void GenerateToken_ValidUser_ReturnsTokenWithCorrectRole(string email, string role)
          {
              var service = CreateTokenService();

              var token = service.GenerateToken(email, role);

              Assert.IsNotNull(token);
              Assert.AreEqual(role, token.Role);
              Assert.IsTrue(token.ExpiresAt > DateTime.UtcNow);
          }

          [TestMethod]
          public void GenerateToken_ExpiredCredentials_ThrowsAuthException()
          {
              var service = CreateTokenService(clockOffset: TimeSpan.FromDays(-1));

              Assert.ThrowsException<AuthenticationException>(
                  () => service.GenerateToken("user@example.com", "admin"));
          }

          [TestMethod]
          public void RevokeToken_ValidToken_MarksRevoked()
          {
              var service = CreateTokenService();
              var token = service.GenerateToken("user@example.com", "admin");

              service.RevokeToken(token.Id);

              Assert.IsTrue(service.IsRevoked(token.Id));
          }

          [TestMethod]
          public void RevokeToken_AlreadyRevoked_IsIdempotent()
          {
              var service = CreateTokenService();
              var token = service.GenerateToken("user@example.com", "admin");
              service.RevokeToken(token.Id);

              service.RevokeToken(token.Id); // second call

              Assert.IsTrue(service.IsRevoked(token.Id));
          }

          private static TokenService CreateTokenService(TimeSpan? clockOffset = null)
          {
              var clock = clockOffset.HasValue
                  ? new FakeClock(DateTimeOffset.UtcNow + clockOffset.Value)
                  : new FakeClock(DateTimeOffset.UtcNow);
              return new TokenService(clock, new InMemoryTokenStore());
          }
      }
      ```
    assertions:
      - type: "output_matches"
        pattern: "(well.maintained|good shape|clean|solid|maintainable|easy to maintain|no.*(major|significant))"
      - type: "output_not_contains"
        value: "builder pattern"
      - type: "exit_success"
    rubric:
      - "Recognized that these tests are already well-maintained and need no major refactoring"
      - "Acknowledged the existing helper method (CreateTokenService) as a good pattern"
      - "Acknowledged the use of DataRow with descriptive DisplayName values"
      - "Did not recommend unnecessary abstractions like a builder pattern for simple test setup"
      - "If any suggestions were made, they were minor and clearly labeled as optional polish"
    timeout: 120

  - name: "Identify oversized test among well-sized tests without over-recommending"
    prompt: |
      Can you review these tests for maintainability? I want to know what's
      worth refactoring and what I should leave alone.

      ```csharp
      using Microsoft.VisualStudio.TestTools.UnitTesting;

      namespace Billing.Tests;

      [TestClass]
      public sealed class InvoiceServiceTests
      {
          [TestMethod]
          public void CreateInvoice_SingleItem_ReturnsCorrectTotal()
          {
              var service = new InvoiceService(new FakeTaxCalculator(0.1m));

              var invoice = service.CreateInvoice("C-001",
                  new[] { new LineItem("Widget", 100m, 2) });

              Assert.AreEqual(220m, invoice.Total);
          }

          [TestMethod]
          public void CreateInvoice_NoItems_ThrowsArgumentException()
          {
              var service = new InvoiceService(new FakeTaxCalculator(0.1m));

              Assert.ThrowsException<ArgumentException>(
                  () => service.CreateInvoice("C-001", Array.Empty<LineItem>()));
          }

          [TestMethod]
          [DataRow(0.0, 100.0, DisplayName = "Zero tax")]
          [DataRow(0.1, 110.0, DisplayName = "10% tax")]
          [DataRow(0.25, 125.0, DisplayName = "25% tax")]
          public void CreateInvoice_TaxRates_AppliedCorrectly(double taxRate, double expectedTotal)
          {
              var service = new InvoiceService(new FakeTaxCalculator((decimal)taxRate));

              var invoice = service.CreateInvoice("C-001",
                  new[] { new LineItem("Widget", 100m, 1) });

              Assert.AreEqual((decimal)expectedTotal, invoice.Total);
          }

          [TestMethod]
          public void GenerateAndSendMonthlyInvoiceBatch_FullWorkflow()
          {
              // Setup customers
              var db = new InMemoryCustomerDb();
              db.Add(new Customer("C-001", "Alice Corp", "alice@corp.com", "Enterprise", true));
              db.Add(new Customer("C-002", "Bob LLC", "bob@llc.com", "Starter", true));
              db.Add(new Customer("C-003", "Charlie Inc", "charlie@inc.com", "Enterprise", false));

              // Setup usage records
              var usageDb = new InMemoryUsageDb();
              usageDb.Add(new UsageRecord("C-001", "API Calls", 10000, 0.01m));
              usageDb.Add(new UsageRecord("C-001", "Storage GB", 500, 0.10m));
              usageDb.Add(new UsageRecord("C-001", "Bandwidth GB", 200, 0.05m));
              usageDb.Add(new UsageRecord("C-002", "API Calls", 5000, 0.02m));
              usageDb.Add(new UsageRecord("C-002", "Storage GB", 100, 0.10m));

              // Setup services
              var taxCalc = new FakeTaxCalculator(0.08m);
              var emailSender = new FakeEmailSender();
              var pdfGenerator = new FakePdfGenerator();
              var discountEngine = new FakeDiscountEngine();
              discountEngine.AddDiscount("Enterprise", 0.15m);
              var auditLog = new FakeAuditLog();
              var service = new InvoiceService(taxCalc);
              var batchProcessor = new InvoiceBatchProcessor(
                  service, db, usageDb, emailSender, pdfGenerator, discountEngine, auditLog);

              // Execute
              var results = batchProcessor.ProcessMonthlyBatch(2025, 3);

              // Verify batch results
              Assert.AreEqual(2, results.ProcessedCount);
              Assert.AreEqual(0, results.ErrorCount);
              Assert.AreEqual(1, results.SkippedCount);

              // Verify Alice (Enterprise with discount)
              var aliceInvoice = results.Invoices.First(i => i.CustomerId == "C-001");
              Assert.AreEqual(3, aliceInvoice.LineItems.Count);
              Assert.IsTrue(aliceInvoice.DiscountApplied);
              Assert.AreEqual(0.15m, aliceInvoice.DiscountRate);
              var expectedAliceSubtotal = 10000 * 0.01m + 500 * 0.10m + 200 * 0.05m;
              var expectedAliceAfterDiscount = expectedAliceSubtotal * (1 - 0.15m);
              var expectedAliceTotal = expectedAliceAfterDiscount * 1.08m;
              Assert.AreEqual(expectedAliceTotal, aliceInvoice.Total);

              // Verify Bob (Starter, no discount)
              var bobInvoice = results.Invoices.First(i => i.CustomerId == "C-002");
              Assert.AreEqual(2, bobInvoice.LineItems.Count);
              Assert.IsFalse(bobInvoice.DiscountApplied);
              var expectedBobSubtotal = 5000 * 0.02m + 100 * 0.10m;
              var expectedBobTotal = expectedBobSubtotal * 1.08m;
              Assert.AreEqual(expectedBobTotal, bobInvoice.Total);

              // Verify Charlie skipped (inactive)
              Assert.IsFalse(results.Invoices.Any(i => i.CustomerId == "C-003"));

              // Verify emails sent
              Assert.AreEqual(2, emailSender.SentEmails.Count);
              Assert.IsTrue(emailSender.SentEmails.Any(e => e.To == "alice@corp.com"));
              Assert.IsTrue(emailSender.SentEmails.Any(e => e.To == "bob@llc.com"));

              // Verify PDFs generated
              Assert.AreEqual(2, pdfGenerator.GeneratedPdfs.Count);

              // Verify audit log
              Assert.AreEqual(2, auditLog.Entries.Count);
              Assert.IsTrue(auditLog.Entries.All(e => e.Action == "InvoiceGenerated"));
          }
      }
      ```
    assertions:
      - type: "output_matches"
        pattern: "(too (large|long|big)|oversized|multi.?concern|split|break.*(up|apart|into)|mega|god)"
      - type: "output_matches"
        pattern: "(fine|good|clean|well|no.*(change|issue)|leave|already|maintainable)"
