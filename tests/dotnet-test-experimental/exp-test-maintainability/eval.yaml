    rubric:
      - "Identified that GenerateAndSendMonthlyInvoiceBatch_FullWorkflow is too large and tests multiple concerns (batch processing, discounts, invoicing, email, PDF, audit)"
      - "Recognized that the first three tests (SingleItem, NoItems, TaxRates) are well-structured and do NOT need changes"
      - "Recommended splitting the oversized test into focused tests while leaving the good tests alone"
      - "Recommended extracting a helper for the complex setup in the oversized test"
      - "Did not recommend changes to the already-good DataRow parameterized test or the simple focused tests"
    timeout: 120
