name: migrate-vstest-to-mtp
description: Evaluates the dotnet-test-migration/migrate-vstest-to-mtp skill
type: capability
defaults:
  timeout: 8m
stimuli:
  - name: Leave a healthy already-native MTP project dormant and unchanged
    tags: {capability: already-native-boundary, risk: unnecessary-runner-rewrite, journey: inspect-healthy-runner, expect_activation: "false"}
    prompt: |
      Our .NET 10 tests already run successfully on Microsoft.Testing.Platform.
      Check the supplied configuration and tell me whether runner changes are
      needed. There is no failing behavior to fix. Leave everything unchanged
      if the setup is already correct, and only inspect files: do not execute
      shell commands, restore packages, build or run tests.
    environment:
      files:
        - src: ../fixtures/current-native
          dest: .
        - src: ../graders/migration_evidence.py
          dest: .eval/migration_evidence.py
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: native-mtp-dormancy
        agent: {name: reference, version: "1.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              The project already enables MSTest's MTP runner, and global.json
              selects native Microsoft.Testing.Platform. No runner change is
              needed. I left all files unchanged and did not execute commands.
    graders:
      - type: tool-calls
        config:
          disallowed:
            - bash
            - powershell
            - execute
            - shell
            - run_shell_command
            - local_shell
            - run_in_terminal
            - run_command
            - terminal
            - task
            - agent
            - edit
            - create
            - apply_patch
            - '(?i)(?:^|[.:])(?:bash|powershell|execute|shell|run_shell_command|local_shell|run_in_terminal|run_command|terminal|task|agent)$'
      - type: run-command
        config:
          command: >-
            python -c "import hashlib,pathlib,sys;p=pathlib.Path('.eval/migration_evidence.py');data=p.read_bytes();assert hashlib.sha256(data.replace(b'\r\n',b'\n')).hexdigest()=='5d406aa064f92dfb0f2c861f178f42e91b067ecfe7c3f30cf5ea335e578d026a','Evaluator code changed';sys.argv=[str(p),*sys.argv[1:]];exec(compile(data,str(p),'exec'),{'__name__':'__main__','__file__':str(p)})" preserve --root . --workspace
            --file 862e32d03af85bcbe5e5ef4501063db618c1e2c0f2bebdfd9c9e6fa1f75db39e:CurrentTests.csproj
            --file ebc2d4f2471e3df021d5ca812092c9a79c6a8dbef69b4037a35f2009f43b99e4:CurrentTests.cs
            --file bb8bde5a1a7b9f418d206c2c9614697507eb02d640f83414d6ba435ad549d91c:global.json
            --file a900b417f9cc64204d58a8c2f798febf446509e3ab583211d2e96112bc11dadb:notes.txt
            --file 5d406aa064f92dfb0f2c861f178f42e91b067ecfe7c3f30cf5ea335e578d026a:.eval/migration_evidence.py
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config: {pattern: '(?i)already|unchanged|no (?:runner )?(?:change|migration).*(?:needed|required)'}
      - type: prompt
    rubric:
      - Recognizes the healthy native configuration as outside a VSTest-to-MTP migration and does not activate migration work.
      - Preserves the complete workspace file set and bytes, including unrelated files and the staged verifier.
      - Does not claim execution or propose an unnecessary compatibility bridge, package change or runner rewrite.

  - name: Migrate MSTest project from VSTest to Microsoft.Testing.Platform
    tags: {capability: mstest-runner, risk: partial-enablement, journey: plan-platform-migration}
    prompt: |
      I have a solution with 3 MSTest 3.8.0 test projects that currently run on VSTest.
      I want to switch all of them to Microsoft.Testing.Platform. We're on .NET 8 SDK
      and use `dotnet test --logger trx` in CI. What changes do I need to make to each
      project and to the CI command? I want properties set consistently across all projects.
    environment:
      files:
        - src: ./fixtures/mstest-vstest/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/mstest-vstest/CalculatorTests.cs
          dest: CalculatorTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (EnableMSTestRunner|MSTest\.Sdk)
      - type: output-matches
        config:
          pattern: (OutputType|Exe)
      - type: output-matches
        config:
          pattern: (Directory\.Build\.props|centralize|shared)
      - type: prompt
    rubric:
      - Adds <EnableMSTestRunner>true</EnableMSTestRunner> to Directory.Build.props (not per-project)
      - Mentions <OutputType>Exe</OutputType> must be set explicitly on test projects (EnableMSTestRunner does NOT
        auto-set it)
      - Configures dotnet test integration (TestingPlatformDotnetTestSupport in Directory.Build.props or global.json)
      - Explains that --logger trx must change to --report-trx and requires Microsoft.Testing.Extensions.TrxReport
        package
      - Mentions the -- separator requirement on .NET 8 for MTP arguments
      - Does not suggest upgrading MSTest version (3.2.0+ is sufficient, 3.8.0 qualifies)
  - name: Migrate NUnit project from VSTest to Microsoft.Testing.Platform
    tags: {capability: nunit-runner, risk: incompatible-adapter, journey: plan-platform-migration}
    prompt: |
      My NUnit test project uses NUnit3TestAdapter 4.6.0 and Microsoft.NET.Test.Sdk
      on VSTest. I want to migrate to Microsoft.Testing.Platform. What do I need to change?
    environment:
      files:
        - src: ./fixtures/nunit-vstest/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/nunit-vstest/CalculatorTests.cs
          dest: CalculatorTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (EnableNUnitRunner|NUnit.*runner)
      - type: output-matches
        config:
          pattern: (NUnit3TestAdapter|5\.0\.0|adapter.*5)
      - type: output-matches
        config:
          pattern: (OutputType|Exe)
      - type: prompt
    rubric:
      - Identifies that NUnit3TestAdapter must be upgraded to 5.0.0 or later for MTP support
      - Adds <EnableNUnitRunner>true</EnableNUnitRunner>
      - Adds <OutputType>Exe</OutputType>
      - Mentions configuring dotnet test integration
      - Recommends using Directory.Build.props for MTP properties
  - name: Migrate xUnit.net v2 project from VSTest to Microsoft.Testing.Platform
    tags: {capability: xunit-v2-runner, risk: unrequested-framework-upgrade, journey: plan-platform-migration}
    prompt: |
      My xUnit.net project uses xunit 2.9.3 with xunit.runner.visualstudio on VSTest.
      I want to switch to Microsoft.Testing.Platform. What should I do?
    environment:
      files:
        - src: ./fixtures/xunit-vstest/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/xunit-vstest/CalculatorTests.cs
          dest: CalculatorTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (YTest\.MTP\.XUnit2|MTP.*xunit)
      - type: output-matches
        config:
          pattern: (PackageReference|package)
      - type: prompt
    rubric:
      - Recommends adding the YTest.MTP.XUnit2 package to enable MTP support for xUnit.net v2
      - Does NOT require upgrading to xunit.v3 — YTest.MTP.XUnit2 works with xUnit.net v2
      - Mentions that VSTest --filter syntax is preserved with YTest.MTP.XUnit2 (no filter migration needed)
      - Mentions configuring dotnet test integration (TestingPlatformDotnetTestSupport or global.json)
      - Optionally mentions that xunit.runner.visualstudio and Microsoft.NET.Test.Sdk can be removed once VSTest compat
        is no longer needed
  - name: Update Azure DevOps pipeline from VSTest task to MTP
    tags: {capability: pipeline-migration, risk: missing-ci-artifacts, journey: update-ci}
    prompt: |
      Our CI pipeline uses the VSTest@3 task to run MSTest tests. We're migrating
      to Microsoft.Testing.Platform. We also produce TRX reports and collect code
      coverage. How do we update the pipeline?
    environment:
      files:
        - src: ./fixtures/mstest-ci-pipeline/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/mstest-ci-pipeline/ServiceTests.cs
          dest: ServiceTests.cs
        - src: ./fixtures/mstest-ci-pipeline/azure-pipelines.yml
          dest: azure-pipelines.yml
    graders:
      - type: output-matches
        config:
          pattern: (DotNetCoreCLI|dotnet test)
      - type: output-matches
        config:
          pattern: (VSTest@3|replace|remove)
      - type: output-matches
        config:
          pattern: (report-trx|TrxReport)
      - type: prompt
    rubric:
      - Identifies that VSTest@3 task must be replaced with DotNetCoreCLI@2 task
      - Shows the updated pipeline YAML using DotNetCoreCLI@2 with command 'test'
      - Translates --logger trx to --report-trx and mentions Microsoft.Testing.Extensions.TrxReport package
      - Translates code coverage collection to --coverage and mentions CodeCoverage extension package
      - Explains the -- separator needed for MTP arguments on .NET 9 and earlier
  - name: Migrate MSTest.Sdk project that explicitly uses VSTest
    tags: {capability: sdk-runner-opt-in, risk: redundant-configuration, journey: plan-platform-migration}
    prompt: |
      My project uses MSTest.Sdk/3.8.0 with <UseVSTest>true</UseVSTest>. I want
      to switch to Microsoft.Testing.Platform. What do I need to change?
    environment:
      files:
        - src: ./fixtures/mstest-sdk-vstest/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/mstest-sdk-vstest/AppTests.cs
          dest: AppTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (UseVSTest|remove|delete)
      - type: output-matches
        config:
          pattern: (MSTest\.Sdk|MTP.*default)
      - type: prompt
    rubric:
      - Identifies that MSTest.Sdk uses MTP by default and UseVSTest opts out of it
      - Recommends removing <UseVSTest>true</UseVSTest> to enable MTP
      - Notes that MSTest.Sdk automatically sets EnableMSTestRunner and OutputType Exe — no additional properties needed
      - Mentions configuring dotnet test integration (TestingPlatformDotnetTestSupport or global.json)
  - name: Translate dotnet test VSTest arguments to MTP equivalents
    tags: {capability: command-translation, risk: missing-reporting-extensions, journey: update-ci-command}
    prompt: >
      Our CI runs `dotnet test --filter "Category=Integration" --logger trx --collect "Code Coverage;Format=cobertura"
      --blame-crash --blame-hang --blame-hang-timeout 5m`.

      We're switching to Microsoft.Testing.Platform on .NET 8. What should the

      new command look like?
    environment:
      files:
        - src: ./fixtures/mstest-vstest/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/mstest-vstest/CalculatorTests.cs
          dest: CalculatorTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (report-trx|--report-trx)
      - type: output-matches
        config:
          pattern: (--coverage|CodeCoverage)
      - type: output-matches
        config:
          pattern: (crashdump|--crashdump)
      - type: output-matches
        config:
          pattern: (hangdump|--hangdump)
      - type: prompt
    rubric:
      - Translates --logger trx to --report-trx
      - Translates --collect "Code Coverage;Format=cobertura" to --coverage --coverage-output-format cobertura
      - Translates --blame-crash to --crashdump
      - Translates --blame-hang to --hangdump
      - Translates --blame-hang-timeout 5m to --hangdump-timeout 5m
      - Mentions the -- separator needed on .NET 8 (pre-.NET 10)
      - Lists the required NuGet extension packages (TrxReport, CrashDump, HangDump, CodeCoverage)
  - name: Handle exit code 8 when migrating from VSTest to MTP
    tags: {capability: intentional-empty-run, risk: false-ci-failure, journey: diagnose-empty-configuration}
    prompt: |
      We're migrating our test projects from VSTest to Microsoft.Testing.Platform.
      After enabling MTP, our CI pipeline fails with exit code 8 even though no
      tests actually failed. Some test assemblies use conditional compilation, so
      certain configurations legitimately discover zero tests. With VSTest this
      succeeded. How do I handle this MTP behavioral difference?
    environment:
      files:
        - src: ./fixtures/handle-exit-code-8-when-migrating-from-vstest-to-mtp/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/handle-exit-code-8-when-migrating-from-vstest-to-mtp/ConditionalTests.cs
          dest: ConditionalTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (exit.?code.?8|ignore-exit-code|zero.?test)
      - type: prompt
    rubric:
      - Explains that MTP fails with exit code 8 when zero tests are discovered (unlike VSTest which succeeds)
      - Recommends --ignore-exit-code 8 as a command-line option
      - Shows how to set it via TestingPlatformCommandLineArguments MSBuild property
      - Mentions TESTINGPLATFORM_EXITCODE_IGNORE environment variable as an alternative
  - name: Configure dotnet test MTP mode on .NET 10 SDK
    tags: {capability: native-sdk-mode, risk: wrong-argument-routing, journey: configure-sdk-runner}
    prompt: |
      We're on .NET 10 SDK and migrating to Microsoft.Testing.Platform. I read
      that .NET 10 has native MTP support in dotnet test. How do I set it up?
      Do I still need TestingPlatformDotnetTestSupport?
    environment:
      files:
        - src: ./fixtures/configure-dotnet-test-mtp-mode-on-net-10-sdk/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/configure-dotnet-test-mtp-mode-on-net-10-sdk/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: (global\.json|test.*runner)
      - type: output-matches
        config:
          pattern: (Microsoft\.Testing\.Platform|MTP)
      - type: prompt
    rubric:
      - Shows how to add the test.runner section to global.json
      - Explains that TestingPlatformDotnetTestSupport is no longer needed on .NET 10 with native MTP mode
      - Explains that the -- separator is no longer needed in .NET 10 native MTP mode
      - Recommends using the native MTP mode for .NET 10+ instead of the VSTest bridge
  - name: Migrate xUnit.net VSTest filter syntax to MTP
    tags: {capability: xunit-filter, risk: wrong-test-selection, journey: translate-filter}
    prompt: |
      My CI uses `dotnet test --filter "FullyQualifiedName~IntegrationTests&Category=Smoke"` 
      with xUnit.net v2. I'm upgrading to xunit.v3 with MTP. The --filter no longer
      works the same way. How do I translate the filter?
    environment:
      files:
        - src: ./fixtures/migrate-xunit-net-vstest-filter-syntax-to-mtp/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/migrate-xunit-net-vstest-filter-syntax-to-mtp/IntegrationTests.cs
          dest: IntegrationTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (filter-class|filter-trait|filter-method|filter-query)
      - type: prompt
    rubric:
      - Explains that VSTest --filter syntax is not supported for xUnit.net v3 on MTP
      - Translates FullyQualifiedName~IntegrationTests to --filter-class *IntegrationTests* (with wildcards for
        substring match) or --filter-query with path-segment syntax
      - Translates Category=Smoke to --filter-trait "Category=Smoke"
      - Mentions --filter-query uses path-segment syntax (/<assembly>/<namespace>/<class>/<method>[trait=value])
      - References xUnit.net query filter language documentation or provides the link
  - name: Set OutputType=Exe only for test projects in Directory.Build.props
    tags: {capability: effective-properties, risk: production-runner-pollution, journey: centralize-configuration}
    prompt: |
      I'm migrating my MSTest projects from VSTest to Microsoft.Testing.Platform.
      My repo has a single Directory.Build.props at the root that is imported by
      both production projects (e.g. `MyApp.csproj`) and test projects (e.g.
      `MyApp.Tests.csproj`). I want to set `<OutputType>Exe</OutputType>` and the
      MTP runner properties centrally, but I obviously don't want to turn my
      library projects into executables. How do I write the condition in
      Directory.Build.props so it only applies to the test projects?
    environment:
      files:
        - src: ./fixtures/mstest-vstest/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/mstest-vstest/CalculatorTests.cs
          dest: CalculatorTests.cs
    graders:
      - type: output-contains
        config:
          substring: MSBuildProjectName
      - type: output-not-matches
        config:
          pattern: Condition\s*=\s*(['"]).*\$\(IsTestProject\).*\1
      - type: prompt
    rubric:
      - Recommends a condition based on a property available when Directory.Build.props is evaluated, such as
        MSBuildProjectName
      - Provides a concrete example condition (e.g., $(MSBuildProjectName.EndsWith('.Tests'))) that targets only test
        projects by name
      - Does NOT recommend Condition="'$(IsTestProject)' == 'true'" for properties set in Directory.Build.props
      - Explains why an IsTestProject-based condition does not work in Directory.Build.props (the property is not yet
        defined at that point in evaluation)
  - name: Full VSTest to MTP migration plan for MSTest solution
    tags: {capability: solution-plan, risk: incomplete-rollout, journey: plan-platform-migration}
    prompt: |
      I have a solution with 5 MSTest test projects all using VSTest (MSTest.TestFramework 3.8.0,
      MSTest.TestAdapter 3.8.0, Microsoft.NET.Test.Sdk 17.13.0). We use Azure DevOps
      with the VSTest@3 task, TRX reporting, and code coverage. We're on .NET 8 SDK.
      I want a complete migration plan to Microsoft.Testing.Platform.
    environment:
      files:
        - src: ./fixtures/mstest-vstest/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/mstest-vstest/CalculatorTests.cs
          dest: CalculatorTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (EnableMSTestRunner|MSTest.*runner)
      - type: output-matches
        config:
          pattern: (OutputType|Exe)
      - type: output-matches
        config:
          pattern: (Directory\.Build\.props|centralize)
      - type: output-matches
        config:
          pattern: (DotNetCoreCLI|VSTest@3|pipeline)
      - type: output-matches
        config:
          pattern: (TrxReport|report-trx)
      - type: prompt
    rubric:
      - Recommends creating or updating Directory.Build.props with OutputType, EnableMSTestRunner, and
        TestingPlatformDotnetTestSupport
      - Explains the properties should be set centrally, not per-project
      - Covers replacing VSTest@3 task with DotNetCoreCLI@2
      - Covers TRX reporting migration (--report-trx and TrxReport NuGet package)
      - Covers code coverage migration (--coverage and CodeCoverage NuGet package)
      - Mentions the -- separator requirement on .NET 8
      - Includes verification steps (build, test, compare counts, check CI artifacts)
      - Mentions possibility of exit code 8 for zero-test assemblies

  - name: Deliver native MTP migration with fresh reports from both projects
    tags: {capability: native-solution-execution, risk: dropped-module-or-report, journey: deliver-platform-migration}
    prompt: |
      Migrate both test projects in Suite.slnx to Microsoft.Testing.Platform
      using the native .NET 10 test runner. Apply the changes and run the
      solution with TRX reporting. Keep the framework versions, production
      library, all test cases and skip reasons unchanged.
    environment:
      files: &solution_files
        - src: fixtures/executable-solution
          dest: .
        - src: ../graders/global-vstest.json
          dest: global.json
        - src: ../graders/migration_evidence.py
          dest: .eval/migration_evidence.py
    golden_patch:
      path: goldens/native.patch
    graders:
      - type: run-command
        config:
          command: >-
            python -c "import hashlib,pathlib,sys;p=pathlib.Path('.eval/migration_evidence.py');data=p.read_bytes();assert hashlib.sha256(data.replace(b'\r\n',b'\n')).hexdigest()=='5d406aa064f92dfb0f2c861f178f42e91b067ecfe7c3f30cf5ea335e578d026a','Evaluator code changed';sys.argv=[str(p),*sys.argv[1:]];exec(compile(data,str(p),'exec'),{'__name__':'__main__','__file__':str(p)})" run --project Alpha.Tests/Alpha.Tests.csproj --solution Suite.slnx
            --runner native --mstest-major 4 --report-count 2 --expect alpha-positive=Passed
            --mstest-version 4.4.1 --production-project Library/Library.csproj
            --package-project Beta.Tests/Beta.Tests.csproj
            --compile-source Alpha.Tests/Alpha.Tests.csproj=Alpha.Tests/AdditionTests.cs
            --compile-source Beta.Tests/Beta.Tests.csproj=Beta.Tests/BoundaryTests.cs
            --compile-source Library/Library.csproj=Library/Arithmetic.cs
            --expect alpha-negative=Passed --expect BetaZero=Passed --expect BetaDeferred=NotExecuted
            --skip-reason "BetaDeferred=Requires tracked service TEST-84"
            --unchanged-file 2f8a08e82b141477af710f08bab1ee8d87231aaff9a78a151e67074be50d0c78:Library/Arithmetic.cs
            --unchanged-file 8d654c44b7bebb6b31a9f2f606927f45b5072193adc4eef8cce3f3cf3b278df3:Library/Library.csproj
            --unchanged-file 30a13ee040dab198e8f828f506e830b620ce289ef9d5b24aae4d2cd3822e3d43:Alpha.Tests/AdditionTests.cs
            --unchanged-file 2e2de8b4bda10afae6b01e15e8dd5e6d98c9871c6a71d10a6dc647190d55a108:Beta.Tests/BoundaryTests.cs
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Both test projects execute on native MTP and produce independently parseable fresh TRX reports.
      - Parameterized identities, skipped cases and reasons are preserved without changing production behavior.
      - Effective MTP configuration applies only to test projects and the original package versions are preserved.

  - name: Keep the explicit SDK 10 compatibility bridge while enabling MTP
    tags: {capability: sdk10-bridge-execution, risk: silently-changing-runner-mode, journey: preserve-ci-contract}
    prompt: |
      Enable Microsoft.Testing.Platform in both test projects in Suite.slnx.
      These projects use MSTest 3.8.0. Our .NET 10 CI must keep dotnet test in VSTest compatibility mode for now;
      do not select the native runner in global.json. Apply the changes and
      run both projects with TRX reports through that bridge. Keep the library,
      framework versions, test cases and skip reasons unchanged.
    environment:
      files:
        - src: fixtures/executable-solution
          dest: .
        - src: fixtures/bridge-project.csproj
          dest: Alpha.Tests/Alpha.Tests.csproj
        - src: fixtures/bridge-project.csproj
          dest: Beta.Tests/Beta.Tests.csproj
        - src: ../graders/global-vstest.json
          dest: global.json
        - src: ../graders/migration_evidence.py
          dest: .eval/migration_evidence.py
    golden_patch:
      path: goldens/bridge.patch
    graders:
      - type: run-command
        config:
          command: >-
            python -c "import hashlib,pathlib,sys;p=pathlib.Path('.eval/migration_evidence.py');data=p.read_bytes();assert hashlib.sha256(data.replace(b'\r\n',b'\n')).hexdigest()=='5d406aa064f92dfb0f2c861f178f42e91b067ecfe7c3f30cf5ea335e578d026a','Evaluator code changed';sys.argv=[str(p),*sys.argv[1:]];exec(compile(data,str(p),'exec'),{'__name__':'__main__','__file__':str(p)})" run --project Alpha.Tests/Alpha.Tests.csproj --solution Suite.slnx
            --runner bridge --mstest-major 3 --report-count 2 --expect alpha-positive=Passed
            --mstest-version 3.8.0 --production-project Library/Library.csproj
            --package-project Beta.Tests/Beta.Tests.csproj
            --compile-source Alpha.Tests/Alpha.Tests.csproj=Alpha.Tests/AdditionTests.cs
            --compile-source Beta.Tests/Beta.Tests.csproj=Beta.Tests/BoundaryTests.cs
            --compile-source Library/Library.csproj=Library/Arithmetic.cs
            --expect alpha-negative=Passed --expect BetaZero=Passed --expect BetaDeferred=NotExecuted
            --unchanged-file 2e2de8b4bda10afae6b01e15e8dd5e6d98c9871c6a71d10a6dc647190d55a108:Beta.Tests/BoundaryTests.cs
            --unchanged-file 30a13ee040dab198e8f828f506e830b620ce289ef9d5b24aae4d2cd3822e3d43:Alpha.Tests/AdditionTests.cs
            --unchanged-file 2f8a08e82b141477af710f08bab1ee8d87231aaff9a78a151e67074be50d0c78:Library/Arithmetic.cs
            --unchanged-file 8d654c44b7bebb6b31a9f2f606927f45b5072193adc4eef8cce3f3cf3b278df3:Library/Library.csproj
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Uses the SDK 10 VSTest compatibility bridge rather than silently choosing native MTP.
      - Both modules execute with complete case-set parity and fresh TRX artifacts using the required reporting extension.
      - Production projects are not opted into a test runner.
      - Distinguishes preserved skip metadata from the legacy reporter's missing exported skip reason rather than claiming complete report parity.
