name: plan-ui-change
description: Evaluates the dotnet-blazor/plan-ui-change skill
type: capability
tags:
  executionShard: components
defaults:
  timeout: 20m
  runs: 1
stimuli:
  - name: Project management Kanban board
    tags:
      feature: multi-column-dashboard
      capability: multi-column-dashboard
      risk: medium
      journey: build-complex-ui
    prompt: |
      Build a Blazor page for a project management Kanban board. This is a complex
      multi-section layout. Use these service contracts and add a small stub
      implementation plus DI registration so the generated project builds:

      ```csharp
      public record TaskItem(int Id, string Title, string Assignee, string Priority, DateTime DueDate, string Status);

      public interface ITaskService
      {
          Task<List<TaskItem>> GetAllTasksAsync();
          Task<TaskItem> CreateTaskAsync(string title, string assignee, string priority, DateTime dueDate);
          Task UpdateTaskStatusAsync(int taskId, string newStatus);
      }
      ```

      The page should have:
      - A summary stats bar at the top showing: total task count, count per column (To Do, In Progress, Done),
        and a count of overdue tasks (DueDate < today)
      - A search bar that filters visible tasks by title (client-side filtering)
      - Three columns side by side: "To Do", "In Progress", "Done"
      - Each column header shows the column name and the number of tasks in it
      - Each column displays task cards showing: title, assignee name, a priority badge (High = red,
        Medium = yellow, Low = green CSS class), and the due date formatted as "MMM dd"
      - Each task card has "Move Left" and "Move Right" buttons to move the task to the adjacent column
        (hide the button if there's no column in that direction). Moving a task calls UpdateTaskStatusAsync
      - Each column has an "Add Task" button at the bottom. Clicking it reveals an inline form within that
        column with inputs for title, assignee, priority (dropdown: High/Medium/Low), and due date.
        A "Save" button calls CreateTaskAsync and a "Cancel" button hides the form
      - The page loads all tasks on initialization and handles loading/error states

      Route: `/board`
    environment: &interactive-server-project
      files:
        - src: ../fixtures/global.json
          dest: global.json
      commands:
        - python3 -c "import os, pathlib; root=os.environ.get('XDG_DATA_HOME'); base=pathlib.Path(root) if root else pathlib.Path.home()/'.local'/'share'; marker=base/'NuGet'/'Migrations'/'1'; marker.parent.mkdir(parents=True, exist_ok=True); marker.touch()" && dotnet new blazor --interactivity server --no-https --force
    graders:
      - type: file-contains
        config:
          path: '**/*.razor'
          value: '[Parameter]'
      - type: file-contains
        config:
          path: '**/*.razor'
          value: EventCallback
      - type: file-contains
        config:
          path: '**/*.razor'
          value: ITaskService
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - The board is organized into focused, reusable components — task cards, columns, and the stats bar are separate from the page itself
      - State changes in child components propagate correctly to the parent and other siblings — e.g., moving a task updates the column counts
      - Handles loading and error states with conditional rendering (@if/@else)
  - name: E-commerce product catalog with filters and pagination
    tags:
      feature: filter-grid-pagination
      capability: filter-grid-pagination
      risk: medium
      journey: build-complex-ui
    prompt: |
      Build a Blazor page for browsing a product catalog. Use these service
      contracts and add a small stub implementation plus DI registration so the
      generated project builds:

      ```csharp
      public record Product(int Id, string Name, decimal Price, string Category, double Rating, bool InStock, string ImageUrl);
      public record ProductFilter(List<string>? Categories, decimal? MinPrice, decimal? MaxPrice, bool InStockOnly);
      public record PagedResult<T>(List<T> Items, int TotalCount, int Page, int PageSize);

      public interface IProductService
      {
          Task<PagedResult<Product>> SearchAsync(ProductFilter filter, string sortBy, int page, int pageSize);
          Task<List<string>> GetCategoriesAsync();
      }
      ```

      The page layout should have:
      - A left sidebar (about 25% width) with filter controls:
        - Category checkboxes (loaded from GetCategoriesAsync)
        - Min price and max price number inputs
        - An "In Stock Only" checkbox toggle
        - An "Apply Filters" button that triggers a new search
        - A "Clear Filters" button that resets all filters to defaults
      - A main content area (about 75% width) with:
        - A toolbar row containing: a sort dropdown (options: "Price: Low to High", "Price: High to Low",
          "Name: A-Z", "Rating: Highest"), and a "Showing X–Y of Z products" label
        - A product grid displaying product cards, each showing: a placeholder image div with the product name
          as alt text, the product name, the price formatted as currency, a star rating display (e.g., "★★★★☆"
          for 4/5), an "Out of Stock" badge if not in stock, and an "Add to Cart" button (disabled when out of stock)
        - When a product card is clicked (not the Add to Cart button), the parent should be notified via
          EventCallback so it can navigate to a detail page
        - Pagination controls at the bottom: "Previous" button (disabled on first page), numbered page buttons,
          "Next" button (disabled on last page)
      - The page loads the first page of products and the category list on initialization
      - Handle loading, empty results, and error states

      Route: `/catalog`
    environment: *interactive-server-project
    graders:
      - type: file-contains
        config:
          path: '**/*.razor'
          value: '[Parameter]'
      - type: file-contains
        config:
          path: '**/*.razor'
          value: EventCallback
      - type: file-contains
        config:
          path: '**/*.razor'
          value: IProductService
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - The catalog uses a multi-component architecture — product cards, filter sidebar, and pagination are separate reusable units
      - Child components communicate changes back to the parent via defined interfaces — e.g., filter sidebar notifies the page when filters change, pagination notifies on page change
      - Filtering, sorting, and pagination all work together — changing filters resets to page 1, changing sort re-fetches
      - Handles loading, empty, and error states with conditional rendering
  - name: Release pipeline workspace with staged progress
    tags:
      feature: staged-workflow-layout
      capability: staged-workflow-layout
      risk: medium
      journey: build-complex-ui
    prompt: |
      Build a Blazor page for a software release pipeline workspace. This has
      several distinct visual regions and shared state. Use these service
      contracts and add a small stub implementation plus DI registration so the
      generated project builds:

      ```csharp
      public record ReleaseStage(string Name, string Status, DateTime? CompletedAt, string? Summary);
      public record ReleaseCandidate(int Id, string Version, string Branch, List<ReleaseStage> Stages);
      public record Approval(string Reviewer, string Decision, string? Comment);

      public interface IReleaseService
      {
          Task<ReleaseCandidate> GetCandidateAsync(int id);
          Task RetryStageAsync(int candidateId, string stageName);
          Task ApproveAsync(int candidateId, Approval approval);
          Task DeployAsync(int candidateId, string environment);
      }
      ```

      The page should have:

      **Header and stage indicator:**
      - Version, branch, overall status, and a Build → Test → Approval → Deploy indicator
      - Completed, active, failed, and pending stages have distinct states
      - Clicking a stage selects its detail panel

      **Stage details:**
      - Shows timestamps, summary, and a logs placeholder for the selected stage
      - Failed Build or Test stages expose a Retry action

      **Approval panel:**
      - Lists prior approvals and comments
      - Lets a reviewer approve or reject and updates the shared release status

      **Deployment panel:**
      - Environment cards for Staging and Production
      - Deploy is enabled only after required stages and approval are complete
      - Shows progress and the latest deployment result

      **Activity sidebar:**
      - Timeline of stage changes, approvals, retries, and deployments
      - Every action updates the header, stage indicator, details, and activity timeline consistently

      Route: `/releases/{Id:int}`
    environment: *interactive-server-project
    graders:
      - type: file-contains
        config:
          path: '**/*.razor'
          value: '[Parameter]'
      - type: file-contains
        config:
          path: '**/*.razor'
          value: EventCallback
      - type: file-contains
        config:
          path: '**/*.razor'
          value: IReleaseService
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Decomposes the stage indicator, stage details, approvals, deployment panel, and activity timeline into focused components
      - Keeps the release candidate and selected stage in one coordinating owner so every region reflects the same state
      - Child actions flow back through callbacks and refresh all affected regions after service operations
      - Enforces release ordering in the parent so deployment cannot bypass failed stages or missing approval
  - name: Application settings page with nested tab panels
    tags:
      feature: nested-settings-sections
      capability: nested-settings-sections
      risk: medium
      journey: build-complex-ui
    prompt: |
      Build a Blazor page for an application settings dashboard. This has multiple
      nested sections. Use these service contracts and add a small stub
      implementation plus DI registration so the generated project builds:

      ```csharp
      public record UserProfile(string DisplayName, string Email, string AvatarUrl, string Bio);
      public record NotificationPrefs(bool EmailNotifications, bool PushNotifications, bool WeeklyDigest, List<string> MutedChannels);
      public record SecuritySettings(bool TwoFactorEnabled, DateTime? LastPasswordChange, List<ActiveSession> Sessions);
      public record ActiveSession(string Id, string Device, string Location, DateTime LastActive);
      public record AppearanceSettings(string Theme, string FontSize, string Language, bool CompactMode);

      public interface ISettingsService
      {
          Task<UserProfile> GetProfileAsync();
          Task SaveProfileAsync(UserProfile profile);
          Task<NotificationPrefs> GetNotificationPrefsAsync();
          Task SaveNotificationPrefsAsync(NotificationPrefs prefs);
          Task<SecuritySettings> GetSecuritySettingsAsync();
          Task ChangePasswordAsync(string currentPassword, string newPassword);
          Task RevokeSessionAsync(string sessionId);
          Task<AppearanceSettings> GetAppearanceAsync();
          Task SaveAppearanceAsync(AppearanceSettings settings);
      }
      ```

      The page should have:

      **Left sidebar navigation (vertical tabs):**
      - Four sections: "Profile", "Notifications", "Security", "Appearance"
      - The active section is highlighted
      - Clicking a section loads its content in the main area

      **Profile section:**
      - Editable fields: display name, email, bio (textarea)
      - An avatar preview area with the current URL displayed
      - A "Save Changes" button — shows a success toast/message on save
      - A "Discard Changes" button that reverts to the last saved state

      **Notifications section:**
      - Toggle switches for: email notifications, push notifications, weekly digest
      - A list of channels with checkboxes to mute/unmute each
      - A "Save Preferences" button

      **Security section:**
      - A "Change Password" expandable panel with: current password, new password, confirm password fields and a "Update Password" button
      - Two-factor authentication toggle with status indicator
      - An "Active Sessions" table showing: device, location, last active time, and a "Revoke" button for each session (except the current one)
      - A confirmation dialog before revoking a session

      **Appearance section:**
      - Theme selector: radio buttons for "Light", "Dark", "System"
      - Font size selector: "Small", "Medium", "Large"
      - Language dropdown
      - Compact mode toggle
      - A live preview area that shows how the selected options look
      - A "Save" button

      Route: `/settings`
    environment: *interactive-server-project
    graders:
      - type: file-contains
        config:
          path: '**/*.razor'
          value: '[Parameter]'
      - type: file-contains
        config:
          path: '**/*.razor'
          value: EventCallback
      - type: file-contains
        config:
          path: '**/*.razor'
          value: ISettingsService
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Each settings section (Profile, Notifications, Security, Appearance) is its own component — not all inlined in the page
      - Switching tabs loads the correct section content without a full page reload
      - Handles the save/discard flow with appropriate UI feedback (success message, disabled buttons during save)
  - name: Team chat interface with message threads
    tags:
      feature: multi-panel-chat
      capability: multi-panel-chat
      risk: medium
      journey: build-complex-ui
    prompt: |
      Build a Blazor page for a team messaging app. This is a complex multi-panel
      layout with a sidebar, main area, and collapsible thread panel. Use these
      service contracts and add a small stub implementation plus DI registration
      so the generated project builds:

      ```csharp
      public record Channel(int Id, string Name, string Description, int UnreadCount);
      public record Message(int Id, int ChannelId, string Author, string Content, DateTime SentAt, int? ReplyToId, List<Reaction> Reactions);
      public record Reaction(string Emoji, List<string> Users);
      public record ThreadSummary(int RootMessageId, int ReplyCount, DateTime LastReplyAt);

      public interface IChatService
      {
          Task<List<Channel>> GetChannelsAsync();
          Task<List<Message>> GetMessagesAsync(int channelId, int skip, int take);
          Task<Message> SendMessageAsync(int channelId, string content, int? replyToId);
          Task<List<Message>> GetThreadAsync(int rootMessageId);
          Task AddReactionAsync(int messageId, string emoji);
          Task MarkChannelReadAsync(int channelId);
      }
      ```

      The page layout should have:

      **Left sidebar (channel list, about 20% width):**
      - A list of channels, each showing: channel name (with # prefix), description snippet, and an unread count badge
      - The active channel is highlighted
      - Clicking a channel loads its messages in the main area and marks it as read

      **Main message area (about 55% width, or 80% if no thread is open):**
      - A header showing the current channel name and description
      - A scrollable message list showing messages for the selected channel
      - Each message displays: author name, timestamp (relative — "2 min ago"), message content, and a row of reaction emoji badges (each showing emoji + count)
      - Hovering a message reveals action buttons: "Reply" (opens thread panel), "React" (shows emoji picker with 5-6 common emojis)
      - Messages that are thread starters show a "N replies" link below them
      - A message input area at the bottom: a textarea and a "Send" button
      - Load older messages on scroll-to-top (pagination via skip/take)

      **Right panel (thread view, about 25% width, shown when a thread is open):**
      - Header: "Thread" with the original message quoted and a close button
      - A scrollable list of reply messages in the thread
      - A reply input area at the bottom (textarea + "Reply" button)
      - Closing the thread panel widens the main message area back

      Route: `/chat`
    environment: *interactive-server-project
    graders:
      - type: file-contains
        config:
          path: '**/*.razor'
          value: '[Parameter]'
      - type: file-contains
        config:
          path: '**/*.razor'
          value: EventCallback
      - type: file-contains
        config:
          path: '**/*.razor'
          value: IChatService
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - The chat interface is decomposed into focused components — channel list, message area, thread panel, and message input each have clear responsibilities
      - The message input component is reused in both the main area and thread panel
      - Channel selection, sending messages, and opening threads all work correctly — selecting a channel loads its messages, opening a thread shows replies
  - name: Analytics dashboard with coordinated regions
    tags:
      feature: analytics-dashboard-decomposition
      capability: analytics-dashboard-decomposition
      risk: medium
      journey: build-complex-ui
    prompt: |
      Build an interactive /analytics page for this Blazor app. The page has a
      date-range toolbar, KPI summary cards, a sales-by-region chart placeholder,
      a top-products table with sorting, and a details drawer opened from either
      the chart or table. IAnalyticsService supplies one DashboardSnapshot for
      the selected date range. Refreshing must update every region from the same
      snapshot and show loading and error states. Create the minimal service
      contract, models, stub implementation, and DI registration needed to build.

      Plan the component tree briefly, then implement the page and components.
    environment: *interactive-server-project
    graders:
      - type: file-contains
        config:
          path: '**/*.razor'
          value: '[Parameter]'
      - type: file-contains
        config:
          path: '**/*.razor'
          value: EventCallback
      - type: file-contains
        config:
          path: '**/*.razor'
          value: IAnalyticsService
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Separates toolbar, KPI summary, chart region, product table, and details drawer into focused components
      - Keeps the page as the owner of the selected range and shared snapshot
      - Lets chart and table raise selection events that open one shared details drawer
      - Refreshes all regions consistently from one service result
  - name: Document workspace with outline and inspector
    tags:
      feature: editor-workspace-decomposition
      capability: editor-workspace-decomposition
      risk: medium
      journey: build-complex-ui
    prompt: |
      Build an interactive /documents/{Id:int} workspace. It has a left outline
      tree, a central document editor, and a right properties inspector. Selecting
      an outline node changes the editor and inspector. The editor reports dirty
      state and content changes to the page. Save sends one DocumentDraft through
      IDocumentService, and navigation to another node asks for confirmation when
      edits are unsaved. The inspector can update tags and ownership. Create the
      minimal service contract, models, stub implementation, and DI registration
      needed to build.

      Plan the component tree briefly, then implement the workspace.
    environment: *interactive-server-project
    graders:
      - type: file-contains
        config:
          path: '**/*.razor'
          value: '[Parameter]'
      - type: file-contains
        config:
          path: '**/*.razor'
          value: EventCallback
      - type: file-contains
        config:
          path: '**/*.razor'
          value: IDocumentService
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Decomposes outline, editor, inspector, and unsaved-change confirmation into clear responsibilities
      - Keeps selected node, draft, and dirty state in one coordinating owner
      - Reuses the same save and navigation protocol across child regions
      - Prevents children from independently loading conflicting document copies
  - name: Travel booking results with comparison drawer
    tags:
      feature: search-results-decomposition
      capability: search-results-decomposition
      risk: medium
      journey: build-complex-ui
    prompt: |
      Build an interactive /travel/search page with a search criteria bar,
      filter sidebar, sortable paged result list, selected-trip comparison tray,
      and a details drawer. ITravelService.SearchAsync accepts all criteria,
      filters, sort, and page values. Changing search or filters resets to page 1;
      selecting up to three trips updates the comparison tray; opening details
      does not lose the current results. Create the minimal service contract,
      models, stub implementation, and DI registration needed to build.

      Plan the component tree briefly, then implement it.
    environment: *interactive-server-project
    graders:
      - type: file-contains
        config:
          path: '**/*.razor'
          value: '[Parameter]'
      - type: file-contains
        config:
          path: '**/*.razor'
          value: EventCallback
      - type: file-contains
        config:
          path: '**/*.razor'
          value: ITravelService
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Extracts search criteria, filters, result list, pagination, comparison tray, and details drawer into focused components
      - Keeps query state and result loading in the page rather than duplicating service calls in children
      - Resets paging when criteria change and preserves results when only the details drawer opens
      - Enforces the three-item comparison rule in one state owner
  - name: Stay dormant for one reusable component
    tags:
      feature: routing-boundary
      capability: routing-boundary
      risk: routing
      journey: decline-off-target
    prompt: |
      Write one reusable RatingBadge component. It receives a numeric rating,
      renders filled and empty stars, and raises EventCallback<int> when the user
      selects a new value. No page layout or sibling components are involved.
    expect_activation: false
    graders:
      - type: prompt
    rubric:
      - Implements one focused component directly
      - Does not invent a page decomposition or multi-component architecture for a narrow request
      - Stayed dormant and did not hijack the request with a complex-feature planning workflow
