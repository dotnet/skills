name: fetch-and-send-data
executionShard: app
description: Evaluates the dotnet-blazor/fetch-and-send-data skill
type: capability
defaults:
  timeout: 15m
  runs: 1
stimuli:
  - name: Recipe browser with resilient data loading
    tags:
      feature: parameter-driven-reload
    prompt: |
      I have a Blazor Web App with Interactive Server (per-page).

      I need an interactive /recipes/{CuisineId:int} page that calls a
      backend service to fetch and display recipe data for a given cuisine.
      It also accepts a ?sort= query parameter (newest or popular) that only
      controls display order.

      Create a RecipeService with a GetByCuisineAsync(int cuisineId,
      CancellationToken cancellationToken) method that simulates a slow API
      call (Task.Delay(2000, cancellationToken)) and returns a list of
      recipes (Id, Title, Description, PrepTimeMinutes). Seed data for 3
      cuisines.

      The data fetching should handle the full async lifecycle correctly —
      here are the specific behaviors I need:

      1. If the user picks a different cuisine while the current one is still
         loading, stop loading the current cuisine and start loading the new one.
         Changing only the sort parameter should not trigger a data reload.

      2. The first time the page loads (no data yet), show a loading placeholder.
         When navigating to a different cuisine after data is already on screen,
         keep the existing recipes visible and show a small "Refreshing…" indicator.
         When the new data arrives, swap it in and hide the indicator.

      3. If something goes wrong — timeout, network error, whatever — show
         the user a friendly message and a Retry button so they can try again.
         If it's a timeout specifically, say so. Never show raw exception
         details to the user — log errors properly through ILogger.

      4. If the user navigates away from the page, all ongoing work should stop
         immediately.
    environment: &interactive-server-project
      files:
        - src: ../fixtures/global.json
          dest: global.json
      commands:
        - mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations" && touch "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations/1" && dotnet new blazor --interactivity server --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/Recipes.razor'
      - type: file-contains
        config:
          path: '**/Recipes.razor'
          value: CancellationTokenSource
      - type: file-contains
        config:
          path: '**/Recipes.razor'
          value: IAsyncDisposable
      - type: file-contains
        config:
          path: '**/Recipes.razor'
          value: ILogger
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Uses OnParametersSetAsync (not OnInitializedAsync) because the data depends on a route parameter that changes during navigation — guards with a tracked value to skip reloading when only the sort parameter changes
      - Cancels the previous in-flight request when CuisineId changes by cancelling the existing CancellationTokenSource and creating a new one — the token is captured into a local variable BEFORE the await to avoid races with a replaced CTS
      - On the first load (data is null), shows a loading placeholder. On subsequent loads (data already exists), keeps the existing data visible and shows an additional loading indicator — does NOT clear existing data on subsequent loads
      - Catches external OperationCanceledException using 'when (!cancellationToken.IsCancellationRequested)' — this means a timeout or external cancellation that the component did NOT trigger. Self-initiated cancellation (parameter change, disposal) is NOT caught because ComponentBase silently swallows it
      - Catches general Exception separately for non-cancellation errors — both catch blocks log via ILogger and set a user-facing error string that is a hardcoded generic message, NEVER exception.Message (PII risk)
      - Shows a Retry button when an error is set, wired to the load method so the user can attempt the operation again
      - Implements IAsyncDisposable that cancels and disposes the CancellationTokenSource — does NOT catch OperationCanceledException in DisposeAsync because ComponentBase handles self-cancellation automatically
  - name: Real-time shipment tracker with Auto interactivity
    tags:
      feature: auto-data-abstraction
    prompt: |
      I have a Blazor Web App using Auto interactivity mode (per-page). Pages
      may run on Server first, then switch to WebAssembly.

      I need an interactive /shipments/{TrackingNumber} page that tracks a
      package.

      Create a ShipmentService interface with:
      - GetShipmentAsync(string trackingNumber, CancellationToken ct) — returns
        shipment details (TrackingNumber, Status, Location, EstimatedDelivery,
        and a list of StatusUpdate events with timestamps).

      On the server side, implement a concrete ShipmentService that simulates a
      slow backend (Task.Delay(1500, ct)) and returns fake data. Seed data for
      3 tracking numbers.

      Behaviors I need:

      1. When the page loads, fetch the shipment details and display them. While
         loading, show a loading placeholder with the tracking number.

      2. The component should work correctly regardless of whether it's running
         on Server or WebAssembly — the data access pattern must be the same in
         both environments.

      3. If the user navigates to a different tracking number while data is
         loading, cancel the previous load and start fresh for the new tracking
         number.

      4. If something goes wrong — timeout, network error, anything — show the
         user a friendly message and let them retry. If it's a timeout, say so.
         Don't show raw exception details. Log errors through ILogger.

      5. When the user leaves the page, all pending requests must stop
         immediately.
    environment: &auto-project
      files:
        - src: ../fixtures/global.json
          dest: global.json
      commands:
        - mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations" && touch "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations/1" && dotnet new blazor --interactivity auto --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/*.Client/**/*.razor'
      - type: file-contains
        config:
          path: '**/*.Client/**/Program.cs'
          value: HttpClient
      - type: file-contains
        config:
          path: '**/*.razor'
          value: CancellationTokenSource
      - type: file-contains
        config:
          path: '**/*.razor'
          value: IAsyncDisposable
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Uses OnParametersSetAsync because the route parameter changes during navigation — cancels previous in-flight requests when TrackingNumber changes
      - Handles errors with user-facing messages and a retry mechanism — logs through ILogger and never displays exception.Message
      - Implements IAsyncDisposable that cancels and disposes the CancellationTokenSource — stops all pending requests on disposal
      - The data access pattern works regardless of execution environment — component depends on an abstraction, not a concrete server-only service
  - name: Stream a static SSR report
    tags:
      feature: static-streaming-load
    prompt: |
      In this static SSR Blazor app, add /sales-report. It calls an injected
      SalesReportService.GetAsync(CancellationToken), which takes several seconds,
      then renders totals and rows. The browser should receive the page shell and
      a loading placeholder before the service completes. No interactive render
      mode, retry button, or JavaScript is needed.
      Create a minimal service, result model, and DI registration so the project builds.
    environment:
      files:
        - src: ../fixtures/global.json
          dest: global.json
      commands:
        - mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations" && touch "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations/1" && dotnet new blazor --interactivity none --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/SalesReport.razor'
      - type: file-contains
        config:
          path: '**/SalesReport.razor'
          value: StreamRendering
      - type: file-not-contains
        config:
          path: '**/SalesReport.razor'
          value: '@rendermode'
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Uses streaming SSR so the loading UI reaches the browser before the slow service finishes
      - Loads through a server-side service without adding an unnecessary HttpClient or interactive runtime
      - Renders a complete result once data arrives and keeps the route static
  - name: Use an error boundary for a simple initial load
    tags:
      feature: simple-load-error-boundary
    prompt: |
      Add an interactive /featured-products page that calls
      ProductService.GetFeaturedAsync once when the component starts. Show a
      loading placeholder and then product cards. The application already wraps
      page content in an ErrorBoundary with a friendly failure view. There is no
      retry requirement and no parameter-driven reload. Keep the component
      simple and let unexpected service failures reach the existing boundary.
      Create a minimal ProductService stub, product model, and DI registration.
    environment: *interactive-server-project
    graders:
      - type: file-exists
        config:
          path: '**/FeaturedProducts.razor'
      - type: file-contains
        config:
          path: '**/FeaturedProducts.razor'
          value: OnInitializedAsync
      - type: file-not-contains
        config:
          path: '**/FeaturedProducts.razor'
          value: catch (Exception
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Loads once during initialization because no changing parameter controls the request
      - Uses explicit loading and loaded states
      - Lets unexpected failures reach the existing ErrorBoundary instead of duplicating generic catch logic
      - Does not add retry, cancellation replacement, or parameter guards that the scenario does not need
  - name: Submit an order without duplicate requests
    tags:
      feature: data-submission
    prompt: |
      Add an interactive OrderSummary component with a Place Order button. It
      sends the supplied OrderDraft to OrderClient.CreateAsync and shows the new
      order number. While saving, disable the action and ignore repeated clicks.
      On failure, log the exception, show a safe message, preserve the draft, and
      allow retry. Cancel the request if the component is removed.
      Create minimal order models, an OrderClient stub, and DI registration.
    environment: *interactive-server-project
    graders:
      - type: file-exists
        config:
          path: '**/OrderSummary.razor'
      - type: file-contains
        config:
          path: '**/OrderSummary.razor'
          value: CancellationTokenSource
      - type: file-contains
        config:
          path: '**/OrderSummary.razor'
          value: ILogger
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Prevents duplicate requests in both the UI state and submit handler
      - Passes a cancellation token to the client and cancels owned work on disposal
      - Logs the real exception while showing a hardcoded safe message
      - Preserves the draft and restores a retryable state after failure
  - name: Register a WebAssembly API client
    tags:
      feature: wasm-http-client
    prompt: |
      In this Interactive WebAssembly Blazor Web App, add a typed
      WeatherApiClient for https://weather.example/ and an interactive /forecast
      page that loads a five-day forecast. Register the client in the correct
      Program.cs, pass cancellation through the client, show loading and friendly
      failure states, and do not use server-only services from the component.
    environment:
      files:
        - src: ../fixtures/global.json
          dest: global.json
      commands:
        - mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations" && touch "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations/1" && dotnet new blazor --interactivity webassembly --no-https --force
    graders:
      - type: file-contains
        config:
          path: '**/*.Client/**/Program.cs'
          value: AddHttpClient
      - type: file-exists
        config:
          path: '**/*.Client/**/*orecast*.razor'
      - type: file-contains
        config:
          path: '**/*.Client/**/*.razor'
          value: CancellationTokenSource
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Registers the typed client in the browser host and keeps the component in the Client project
      - Uses HTTP for remote data and avoids DbContext or other server-only dependencies
      - Propagates cancellation and presents explicit loading and safe error states
  - name: Avoid reload for display-only query changes
    tags:
      feature: reload-guard
    prompt: |
      Add an interactive /customers/{CustomerId:int} page with a ?tab= query
      parameter. CustomerService.GetAsync(CustomerId, CancellationToken) should
      run when CustomerId changes, but switching tab among overview, orders, and
      notes must only change which already-loaded panel is shown. Cancel an older
      customer request if navigation changes the id before it finishes.
      Create a minimal CustomerService stub, model, and DI registration.
    environment: *interactive-server-project
    graders:
      - type: file-exists
        config:
          path: '**/Customers.razor'
      - type: file-contains
        config:
          path: '**/Customers.razor'
          value: OnParametersSetAsync
      - type: file-contains
        config:
          path: '**/Customers.razor'
          value: SupplyParameterFromQuery
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Tracks the loaded customer id and skips service calls for query-only tab changes
      - Cancels and replaces in-flight work when the route id changes
      - Keeps loaded customer data while changing the displayed tab
      - Captures the active request token locally so an older completion cannot corrupt current state
  - name: Distinguish timeout from user cancellation
    tags:
      feature: cancellation-classification
    prompt: |
      Add an interactive /audit-log page using AuditClient.GetAsync. It needs a
      Retry button and a specific timeout message, but navigation away or a newer
      reload should cancel silently. Other failures must be logged and shown as a
      generic safe message. The component must never display exception.Message.
      Create a minimal AuditClient stub, result model, and DI registration.
    environment: *interactive-server-project
    graders:
      - type: file-exists
        config:
          path: '**/AuditLog.razor'
      - type: file-contains
        config:
          path: '**/AuditLog.razor'
          value: OperationCanceledException
      - type: file-contains
        config:
          path: '**/AuditLog.razor'
          value: IsCancellationRequested
      - type: run-command
        config:
          command: >-
            python3 -c "from pathlib import Path; import re, sys;
            files=list(Path('.').glob('**/AuditLog.razor'));
            text='\n'.join(p.read_text() for p in files);
            text=re.sub(r'\b\w*[Ll]og\w*\s*\.\s*Log\w*\s*\(.*?\)\s*;', '', text, flags=re.S);
            sys.exit(0 if files and '.Message' not in text else 1)"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Shows the timeout message only for cancellation not requested by the component's active token
      - Lets self-initiated cancellation remain silent during navigation or replacement
      - Logs non-cancellation failures and shows no raw exception details
      - Provides a retry path that starts a fresh request
  - name: Load matching services in both Auto hosts
    tags:
      feature: auto-service-registration
    prompt: |
      In this Interactive Auto app, add an InventoryClient abstraction used by a
      Client-project component. During server execution it may call an injected
      server implementation; after WebAssembly takes over it must call the same
      API contract over HttpClient. Register compatible implementations in both
      Program.cs files and add the API endpoint required by the browser client.
    environment: *auto-project
    graders:
      - type: file-contains
        config:
          path: '**/Program.cs'
          value: InventoryClient
      - type: file-contains
        config:
          path: '**/*.Client/**/Program.cs'
          value: InventoryClient
      - type: file-contains
        config:
          path: '**/*.Client/**/Program.cs'
          value: HttpClient
      - type: run-command
        config:
          command: dotnet build --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Gives the shared component one execution-neutral abstraction
      - Registers a server implementation and an HTTP client implementation under the same contract
      - Exposes the server data through an API used by the browser implementation
      - Keeps server-only types out of the Client project
  - name: Stay dormant for field validation
    tags:
      feature: routing-boundary
    prompt: |
      Add an EditForm where a duplicate email returned by a registration service
      appears beside the Email field and clears when the user edits that field.
      The data service already exists; the problem is form validation behavior.
    expect_activation: false
    graders:
      - type: prompt
    rubric:
      - Implements field-specific form validation without expanding into a general data-loading architecture
      - Keeps entered values and allows correction and resubmission
      - Stayed dormant and did not hijack validation with unrelated API-client or loading-state work
