name: syncfusion-blazor-toolkit-install
description: Evaluates the dotnet-blazor/syncfusion-blazor-toolkit-install skill
type: capability
defaults:
  timeout: 20m

stimuli:
  # ---------------------------------------------------------------------------
  # Install success paths (supported TFM always stated in the prompt)
  # ---------------------------------------------------------------------------
  - name: server-install-success
    tags:
      capability: toolkit-install
      risk: wrong-package-or-host
      journey: install-legacy-server
    prompt: |
      I'm setting up a legacy-style Blazor Server project that targets net8.0 and uses _Host.cshtml.
      I want the free/open-source Syncfusion UI components for Blazor (not the commercial paid package).
      What package and host setup do I need so buttons and inputs work on the page?
    graders:
      - type: output-matches
        config:
          pattern: (?i)Syncfusion\.Blazor\.Toolkit
      - type: output-matches
        config:
          pattern: (?i)using\s+Syncfusion\.Blazor\.Toolkit
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: output-matches
        config:
          pattern: (?i)_Host\.cshtml
      # Affirmative instruction to link Toolkit theme CSS (warnings allowed)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add)\b[^\n]{0,80}fluent\.min\.css'
      # Affirmative install of commercial Syncfusion.Blazor (without .Toolkit)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|wrong|commercial|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?(?:dotnet add package|PackageReference Include=)\s*"?Syncfusion\.Blazor(?!\.Toolkit)\b'
      # Affirmative request to enter a license key for the Toolkit
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|no|without|free|nothing|avoid|unlike)\b|\w+n[''’]t\b|\bcannot\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:enter|provide|paste|add|register)\b[^\n]{0,40}(?:your|a)\b[^\n]{0,20}(?:syncfusion )?license key'
      - type: prompt
    rubric:
      - Installs Syncfusion.Blazor.Toolkit and registers AddSyncfusionBlazorToolkit with the root namespace in scope.
      - Does not instruct linking fluent.min.css (2.0 uses SfThemeRoot + CSS isolation).
      - Does not ask the user to enter a license key for the open-source Toolkit.

  - name: webassembly-install-success
    tags:
      capability: toolkit-install
      risk: wrong-wasm-host
      journey: install-standalone-wasm
    prompt: |
      I'm building a standalone Blazor WebAssembly app that targets net9.0. I want free/open-source
      Syncfusion UI components (not the commercial package). What package and Program/host setup do I need?
    graders:
      - type: output-matches
        config:
          pattern: (?i)Syncfusion\.Blazor\.Toolkit
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: output-matches
        config:
          pattern: (?i)(?:@using\s+Syncfusion\.Blazor\.Toolkit|using\s+Syncfusion\.Blazor\.Toolkit)
      - type: output-matches
        config:
          pattern: (?i)wwwroot[/\\]index\.html|index\.html
      # Affirmative "add @rendermode" only — "do not add @rendermode" must pass
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|without|no need|unnecessary|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:add|put|place|apply)\b[^\n]{0,40}@rendermode'
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add)\b[^\n]{0,80}fluent\.min\.css'
      - type: prompt
    rubric:
      - Installs the Toolkit for standalone WASM; may mention wwwroot/index.html without requiring a Toolkit theme link.
      - Keeps RootComponents.Add for standalone WASM; does not add @rendermode to an already-interactive app.

  - name: split-webapp-registration
    tags:
      capability: split-registration
      risk: server-only-registration
      journey: configure-split-web-app
    prompt: |
      We have a split Blazor Web App targeting net8.0 with Server and Client projects. Both halves need free/open-source Syncfusion UI components. What must be configured on each host so
      prerendered Client pages do not fail?
    graders:
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: output-matches
        config:
          pattern: (?i)(?:@using\s+Syncfusion\.Blazor\.Toolkit|using\s+Syncfusion\.Blazor\.Toolkit)
      - type: output-matches
        config:
          pattern: (?i)(both|server and client|client and server)
      - type: output-matches
        config:
          pattern: (?i)prerender
      # Affirmative "register only on the server" — warnings allowed
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|wrong|mistake|incorrect|instead of|rather than|without)\b|\w+n[''’]t\b|\bcannot\b))(?:(?![.:;!?](?:\s|$))[^\n])*?(?:register (?:it )?only (?:in|on) (?:the )?server|only (?:in|on) the server is (?:enough|sufficient))'
      # Affirmative RootComponents.Add on Client — "do not add RootComponents" must pass
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|without|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?RootComponents\.Add<App>\("#app"\)'
      - type: prompt
    rubric:
      - Registers AddSyncfusionBlazorToolkit on both server and Client; mentions prerendering.
      - Does not add RootComponents.Add to the Web App Client project.

  # ---------------------------------------------------------------------------
  # Theme model (2.0: SfThemeRoot + isolation, no host fluent.min.css)
  # ---------------------------------------------------------------------------
  - name: missing-theme-css-failure
    tags:
      capability: theme-model
      risk: unstyled-components
      journey: diagnose-unstyled-components
    prompt: |
      My net8.0 Blazor Web App already references the open-source Syncfusion Blazor package 2.x
      and services are registered, but components still render with no theme styling. What should I check?
    graders:
      - type: output-matches
        config:
          pattern: (?i)SfThemeRoot
      - type: output-matches
        config:
          pattern: (?i)CSS isolation
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add)\b[^\n]{0,80}fluent\.min\.css'
      - type: prompt
    rubric:
      - Explains 2.0 theming via SfThemeRoot and CSS isolation rather than instructing a fluent.min.css host link.
      - Checks registration, root namespace, and that a Toolkit component (or explicit SfThemeRoot) is in the tree.

  - name: wrong-theme-name-failure
    tags:
      capability: theme-model
      risk: obsolete-theme-link
      journey: remove-1x-stylesheet
    prompt: |
      After upgrading my net8.0 Blazor Web App to Syncfusion open-source components 2.x I still have:
      <link href="_content/Syncfusion.Blazor.Toolkit/themes/bootstrap5.css" rel="stylesheet" />
      Components look wrong. What should I do?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(remove|no longer|not required|unnecessary)
      - type: output-matches
        config:
          pattern: (?i)SfThemeRoot
      - type: output-matches
        config:
          pattern: (?i)CSS isolation
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add|keep|use)\b[^\n]{0,80}(?:fluent\.min\.css|bootstrap5\.css|highcontrast\.min\.css)'
      - type: prompt
    rubric:
      - Directs removal of the obsolete 1.x host theme link; relies on SfThemeRoot + CSS isolation.
      - Does not recommend a replacement fluent.min.css or highcontrast path as the fix.

  - name: wrong-stylesheet-path-failure
    tags:
      capability: theme-model
      risk: obsolete-theme-link
      journey: remove-1x-stylesheet-404
    prompt: |
      On Syncfusion open-source Blazor 2.x my net8.0 app gets 404s for:
      <link href="_content/Syncfusion.Blazor.Toolkit/themes/fluent.css" rel="stylesheet" />
      Should I change the path to styles/fluent.min.css?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(remove|no longer|not required|unnecessary)
      - type: output-matches
        config:
          pattern: (?i)SfThemeRoot
      - type: output-matches
        config:
          pattern: (?i)CSS isolation
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:use|link|add|change|fix)\b[^\n]{0,60}styles/fluent\.min\.css'
      - type: prompt
    rubric:
      - Directs removal of the obsolete host theme link rather than correcting it to styles/fluent.min.css.
      - Points at SfThemeRoot and CSS isolation as the 2.0 model.

  - name: numeric-textbox-unstyled
    tags:
      capability: theme-model
      risk: per-component-css
      journey: diagnose-isolation
    prompt: |
      My net9.0 Blazor Web App has open-source Syncfusion 2.x registered, but a numeric text box
      component renders unstyled. What should I check for theming in 2.x?
    graders:
      - type: output-matches
        config:
          pattern: (?i)SfThemeRoot
      - type: output-matches
        config:
          pattern: (?i)CSS isolation
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add)\b[^\n]{0,60}numerictextbox\.min\.css'
      - type: prompt
    rubric:
      - Does not recommend per-component or fluent.min.css host links.
      - Points at isolation, registration, and SfThemeRoot.

  # ---------------------------------------------------------------------------
  # Render modes
  # ---------------------------------------------------------------------------
  - name: static-ssr-insufficient
    tags:
      capability: render-mode
      risk: static-ssr
      journey: enable-interactivity
    prompt: |
      I created a net8.0 app with `dotnet new blazor -int Server` (no -ai). A button component's
      OnClick does nothing. The page has no @rendermode. What is wrong?
    graders:
      - type: output-matches
        config:
          pattern: (?i)InteractiveServer
      - type: output-matches
        config:
          pattern: (?i)(@rendermode|interactive boundary|per-page)
      - type: output-matches
        config:
          pattern: (?i)(static|SSR|per-page|-ai|all-interactive)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|wrong|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?@rendermode\s+Interactive(?:WebAssembly|Auto)\b'

      - type: prompt
    rubric:
      - Recognizes -int Server is per-page; interactive boundary is page @rendermode or a wrapper component.
      - Does not claim -int Server is global without -ai.

  - name: interactive-auto-success
    tags:
      capability: render-mode
      risk: auto-misdescribed
      journey: configure-auto
    prompt: |
      I created a net10.0 app with dotnet new blazor -int Auto. I want the first visit interactive
      on the server, and later visits to use WebAssembly after the runtime is cached. What host
      and service setup does that template need for open-source Syncfusion UI components?
    graders:
      - type: output-matches
        config:
          pattern: (?i)InteractiveAuto
      - type: output-matches
        config:
          pattern: (?i)AddInteractiveServerComponents
      - type: output-matches
        config:
          pattern: (?i)AddInteractiveWebAssemblyComponents
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: output-matches
        config:
          pattern: (?i)(?:@using\s+Syncfusion\.Blazor\.Toolkit|using\s+Syncfusion\.Blazor\.Toolkit)
      # Affirmative live mid-run switch only
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|only|without|cannot)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:will|does|would)\s+(?:switch|transition)\b[^\n]{0,60}(?:mid-|while running|same component|without reload)'
      - type: prompt
    rubric:
      - Registers both interactive component hosts and Toolkit on server and Client as the Auto template requires.
      - Does not describe Auto as a live runtime switch of a running component.

  # ---------------------------------------------------------------------------
  # Package identity / registration failures
  # ---------------------------------------------------------------------------
  - name: wrong-commercial-package
    tags:
      capability: package-identity
      risk: commercial-package
      journey: replace-wrong-package
    prompt: |
      On a net8.0 hobby project with no other Syncfusion components, I ran
      `dotnet add package Syncfusion.Blazor` and now see AddSyncfusionLicense() and license keys.
      I only want the free/open-source components. Did I install the wrong package, and what should I use instead?
    graders:
      - type: output-matches
        config:
          pattern: (?i)Syncfusion\.Blazor\.Toolkit
      - type: output-matches
        config:
          pattern: (?i)(license key|RegisterLicense|SyncfusionLicenseProvider)
      - type: output-matches
        config:
          pattern: (?i)(?:\b(?:no|not|n[''’]t|without|free)\b[^\n]{0,50}\blicense\b|\blicense\b[^\n]{0,50}\b(?:not|required|unneeded|unnecessary|free)\b)
      # Affirmative "call AddSyncfusionLicense()" — explaining it does not exist must pass
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|no|nonexistent|doesn|wrong|fake)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:call|use|add|invoke)\b[^\n]{0,30}AddSyncfusionLicense\s*\('
      - type: prompt
    rubric:
      - Identifies Syncfusion.Blazor as the wrong package for pure Toolkit use; points to Syncfusion.Blazor.Toolkit.
      - Notes the open-source Toolkit does not require a license key.

  - name: split-app-partial-registration-failure
    tags:
      capability: split-registration
      risk: client-unregistered
      journey: fix-split-registration
    prompt: |
      My net8.0 split Blazor Web App registers the open-source Syncfusion services only in Server Program.cs.
      Server components work; Client components throw. Both halves need those components. What is missing?
    graders:
      - type: output-matches
        config:
          pattern: (?i)Client[\s\S]{0,60}Program\.cs|Program\.cs[\s\S]{0,60}Client
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: output-matches
        config:
          pattern: (?i)(?:@using\s+Syncfusion\.Blazor\.Toolkit|using\s+Syncfusion\.Blazor\.Toolkit)
      - type: output-matches
        config:
          pattern: (?i)(?:keep|still|also|both|remain).{0,40}server|server.{0,40}(?:keep|still|also|both|remain)|both (?:hosts|projects|sides)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|wrong|mistake|incorrect|false)\b|\w+n[''’]t\b|\bcannot\b))(?:(?![.:;!?](?:\s|$))[^\n])*?only (?:the )?server needs'
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|without|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?RootComponents\.Add<App>\("#app"\)'

      - type: prompt
    rubric:
      - Adds the missing Client registration without removing the server registration.
      - Does not add a standalone WebAssembly RootComponents.Add to the Client project.

  - name: missing-registration-http-500
    tags:
      capability: toolkit-install
      risk: missing-registration
      journey: diagnose-http-500
    prompt: |
      My net8.0 Blazor Web App references the open-source Syncfusion Blazor package. Pages that use
      its button component return
      HTTP 500 with: There is no registered service of type
      'Syncfusion.Blazor.Toolkit.SyncfusionBlazorToolkitService'. What is wrong?
    graders:
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: prompt
    rubric:
      - Diagnoses missing AddSyncfusionBlazorToolkit registration, not a package or stylesheet problem.

  - name: component-namespace-resolution
    tags:
      capability: toolkit-install
      risk: namespace-1x
      journey: migrate-namespace
    prompt: |
      After upgrading to Syncfusion open-source Blazor 2.x on net8.0, my pages still have
      @using Syncfusion.Blazor.Toolkit.Buttons and the build fails with CS0234. How do I fix it?
    graders:
      - type: output-matches
        config:
          pattern: (?i)@using\s+Syncfusion\.Blazor\.Toolkit(?![A-Za-z0-9_]|\.[A-Z])
      - type: output-matches
        config:
          pattern: (?i)(single root|namespace consolidation|removed|no longer|2\.0)
      - type: prompt
    rubric:
      - Replaces domain-specific usings with the single root Syncfusion.Blazor.Toolkit namespace.

  # ---------------------------------------------------------------------------
  # Scripts / framework
  # ---------------------------------------------------------------------------
  - name: script-failure-or-js-error
    tags:
      capability: script-loading
      risk: js-error
      journey: diagnose-js-error
    prompt: |
      On net8.0 with open-source Syncfusion Blazor installed and configured, the browser console
      shows Syncfusion-related JavaScript errors and components do not respond to clicks.
      What should I check?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(JavaScript|script|console|network|404|_content)
      - type: output-matches
        config:
          pattern: (?i)(AddSyncfusionBlazorToolkit|registration|static asset|bundled|_content|interactive)
      # Affirmative recommendation of the commercial CDN script. Negation applies only
      # inside the same clause as the verb, so an earlier "does not" cannot hide a
      # later "load the CDN script". Warnings ("use no CDN script", "do not load") pass.
      - type: output-not-matches
        config:
          pattern: '(?i)(?:(?<![\s\S])|(?<=[.!?;])\s*|,\s+(?!(?:or|nor)\b))(?:(?!\b(?:not|never|avoid|without|no|unnecessary|instead of|rather than|no longer|cannot|can not)\b|\w+n[''’]t\b)[^,.;!?])*?\b(?:keep|add|include|retain|use|reference|link|load)\b(?:(?!\b(?:not|never|avoid|without|no|unnecessary|instead of|rather than|no longer|neither|nor|cannot|can not)\b|\w+n[''’]t\b)[^,.;!?]){0,80}?(?:cdn\.syncfusion|CDN script|<script[^>\n]*syncfusion)'
      - type: prompt
    rubric:
      - Looks at registration, interactive boundary, and static web assets — not commercial CDN scripts.

  - name: commercial-script-tags-wrong
    tags:
      capability: script-loading
      risk: commercial-cdn
      journey: remove-cdn-script
    prompt: |
      My net8.0 open-source Syncfusion Blazor app still has this in the host:
      <script src="https://cdn.syncfusion.com/blazor/..."></script>
      Should I keep that commercial CDN script for 2.x?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(remove|do not|don[''']t|unnecessary|bundled|embedded|package)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|without|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:keep|add|include|retain)\b[^\n]{0,40}(?:cdn\.syncfusion|CDN script)'
      - type: prompt
    rubric:
      - Says to remove commercial CDN script tags; Toolkit JS is packaged with the NuGet.

  - name: unsupported-framework-net7
    tags:
      capability: toolkit-install
      risk: unsupported-tfm
      journey: upgrade-before-install
    prompt: |
      My Blazor Server app still targets net7.0 and uses _Host.cshtml. Can I install the
      open-source Syncfusion Blazor 2.x package as-is?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(net8|net9|net10|\.NET 8|\.NET 9|\.NET 10|upgrade)
      - type: output-matches
        config:
          pattern: (?i)(NU1202|no compatible|not support|unsupported|cannot install|do not install|upgrade first)
      - type: prompt
    rubric:
      - Refuses install on net7.0; explains restore incompatibility and recommends upgrading first.

  - name: unknown-framework-check-first
    tags:
      capability: toolkit-install
      risk: unknown-tfm
      journey: read-tfm-first
    prompt: |
      Please set up open-source Syncfusion UI components in my Blazor app. I have not told you
      the target framework yet.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(TargetFramework|target framework|which \.NET|what TFM|check.*framework)
      - type: prompt
    rubric:
      - Asks for or reads the TFM before installing; does not assume net8+.

  # ---------------------------------------------------------------------------
  # Activation continuity: terse legitimate install prompts must end with a concrete answer
  # ---------------------------------------------------------------------------
  - name: terse-install-request-continues-after-load
    tags:
      capability: toolkit-install
      risk: stops-after-skill-load
      journey: terse-install-continuity
    prompt: |
      I have a .NET 9 Blazor Web App (Interactive Server, per-page). Add the open-source Syncfusion Blazor Toolkit to it.
    environment:
      commands:
        - dotnet new blazor -int Server --framework net9.0 --no-https --force
    graders:
      - type: file-contains
        config:
          path: '**/*.csproj'
          value: Syncfusion.Blazor.Toolkit
      - type: file-contains
        config:
          path: '**/Program.cs'
          value: AddSyncfusionBlazorToolkit
      - type: file-contains
        config:
          path: '**/_Imports.razor'
          value: Syncfusion.Blazor.Toolkit
      # Wrong package, host-file and license regressions are rejected deterministically
      - type: file-not-contains
        config:
          path: '**/*.csproj'
          value: 'Include="Syncfusion.Blazor"'
      - type: file-not-contains
        config:
          path: '**/App.razor'
          value: _content/Syncfusion.Blazor.Toolkit
      - type: file-not-contains
        config:
          path: '**/Program.cs'
          value: RegisterLicense
      # Complete-state check over package, version, registration, import and host files
      - &toolkit-complete-state
        type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const fs = require("fs");
              const path = require("path");
              function walk(dir, out = []) {
                for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                  if (["obj", "bin", "node_modules"].includes(e.name) || e.name.startsWith(".")) continue;
                  const p = path.join(dir, e.name);
                  if (e.isDirectory()) walk(p, out);
                  else out.push(p.replace(/\\/g, "/"));
                }
                return out;
              }
              const files = walk(".");
              const errs = [];
              const only = (re, label) => {
                const hit = files.filter((f) => re.test(f));
                if (hit.length !== 1) {
                  errs.push(label + ": expected exactly one file, found " + hit.length);
                  return "";
                }
                return fs.readFileSync(hit[0], "utf8");
              };
              const count = (text, re) => (text.match(re) || []).length;

              const csproj = only(/\.csproj$/, "csproj");
              const refs = [...csproj.matchAll(/<PackageReference\s+Include="([^"]+)"(?:\s+Version="([^"]*)")?/g)];
              const toolkit = refs.filter((r) => r[1] === "Syncfusion.Blazor.Toolkit");
              if (toolkit.length !== 1) errs.push("csproj must reference Syncfusion.Blazor.Toolkit exactly once");
              else {
                const m = /^[\[(]?(\d+)(?:\.(\d+|\*))?(?:\.(\d+|\*))?/.exec(toolkit[0][2] || "");
                const major = m ? +m[1] : -1;
                const minor = m && m[2] !== undefined && m[2] !== "*" ? +m[2] : m && m[2] === "*" ? Infinity : 0;
                const patch = m && m[3] !== undefined && m[3] !== "*" ? +m[3] : m && m[3] === "*" ? Infinity : 0;
                const ok = major > 2 || (major === 2 && (minor > 0 || patch >= 1));
                if (!ok) errs.push("Toolkit version must be 2.0.1 or newer, found " + toolkit[0][2]);
              }
              for (const r of refs) {
                if (/^Syncfusion\./.test(r[1]) && r[1] !== "Syncfusion.Blazor.Toolkit")
                  errs.push("unexpected Syncfusion package: " + r[1]);
              }
              const tfm = process.argv[1];
              if (!csproj.includes("<TargetFramework>" + tfm + "</TargetFramework>")) errs.push("TargetFramework must stay " + tfm);

              const program = only(/(^|\/)Program\.cs$/, "Program.cs");
              if (count(program, /\busing\s+Syncfusion\.Blazor\.Toolkit\s*;/g) !== 1) errs.push("Program.cs needs one 'using Syncfusion.Blazor.Toolkit;'");
              const reg = [...program.matchAll(/AddSyncfusionBlazorToolkit\s*\(\s*\)/g)];
              if (reg.length !== 1) errs.push("Program.cs must call AddSyncfusionBlazorToolkit() exactly once");
              else if (program.indexOf("builder.Build()") < reg[0].index) errs.push("AddSyncfusionBlazorToolkit() must come before builder.Build()");
              for (const keep of ["AddRazorComponents", "AddInteractiveServerComponents", "AddInteractiveServerRenderMode", "UseAntiforgery", "MapStaticAssets", "MapRazorComponents<App>"])
                if (!program.includes(keep)) errs.push("Program.cs lost template wiring: " + keep);
              if (program.includes("RootComponents")) errs.push("Program.cs must not use RootComponents in a Web App");

              const imports = only(/(^|\/)_Imports\.razor$/, "_Imports.razor");
              if (count(imports, /^@using\s+Syncfusion\.Blazor\.Toolkit\s*$/gm) !== 1) errs.push("_Imports.razor needs exactly one '@using Syncfusion.Blazor.Toolkit'");
              if (/Syncfusion\.Blazor\.Toolkit\./.test(imports)) errs.push("_Imports.razor must not use domain-specific Toolkit namespaces");

              const app = only(/(^|\/)App\.razor$/, "App.razor");
              for (const keep of ["<Routes", "<HeadOutlet", "blazor.web.js", 'Assets["app.css"]'])
                if (!app.includes(keep)) errs.push("App.razor lost template wiring: " + keep);

              for (const f of files.filter((f) => /\.(razor|html|cshtml|cs)$/.test(f))) {
                const t = fs.readFileSync(f, "utf8");
                if (/_content\/Syncfusion\.Blazor\.Toolkit\//i.test(t)) errs.push(f + " links Toolkit static assets");
                if (/syncfusion[^"'\n]*\.(min\.)?(js|css)/i.test(t) && /(<link|<script)/i.test(t)) errs.push(f + " adds a Syncfusion stylesheet or script tag");
                if (/RegisterLicense/.test(t)) errs.push(f + " registers a license key");
              }
              for (const f of files.filter((f) => /(^|\/)(App|Routes)\.razor$/.test(f)))
                if (/@rendermode/.test(fs.readFileSync(f, "utf8"))) errs.push(f + " must not set a global render mode for a per-page Web App");

              if (errs.length) {
                console.error(errs.join("\n"));
                process.exit(1);
              }
              console.log("complete install state verified");
            - net9.0
      - type: run-command
        config:
          command: dotnet build --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Completes the installation in the workspace instead of only describing or loading guidance.
      - Registers the Toolkit once in the app's only Program.cs with the matching using directive.
      - Does not add a commercial Syncfusion.Blazor package or a Toolkit theme stylesheet link.
      - Ends with a final message that states what was changed.

  # ---------------------------------------------------------------------------
  # No-op: an already-correct install must be left alone
  # ---------------------------------------------------------------------------
  - name: already-installed-toolkit-left-untouched
    tags:
      capability: toolkit-install
      risk: unnecessary-rewrite
      journey: verify-existing-install
    prompt: |
      I think we already added the open-source Syncfusion Blazor Toolkit to this net9.0 Blazor Web App
      (Interactive Server, per-page). Can you check that the setup is complete and fix whatever is missing?
    environment:
      files:
        - src: ./fixtures/already-installed-server
          dest: .
    graders:
      # Every in-scope file keeps its exact content; nothing is deleted or added
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const fs = require("fs");
              const path = require("path");
              const crypto = require("crypto");
              const expected = {
                "Components/App.razor": "c5664551791799e8308259865c4992852d4c7d87080c027255897b8be3aff00c",
                "Components/Layout/MainLayout.razor": "10a740c4dcf86ba784888e032994db9c3fb7c25fda6d57d2594514a1b6148db1",
                "Components/Pages/Error.razor": "53dcdbdec5e8fb50389f885861f0c7d921c6622a88637af3b627a2809e6549f1",
                "Components/Pages/Home.razor": "a54e09469b1a5b3ff6255b6a81b2148c192efed6e108c96581970795f3ee0850",
                "Components/Routes.razor": "e58e22841fd7a4ec75e92bbd832c97fb0c700b5c7234fc631a0bcb5c099a01a7",
                "Components/_Imports.razor": "279acfb1feb51bfecbd16e2385e1ff0d2c0aba72dec357d2e3df21f78c2175f7",
                "ContosoApp.csproj": "6e67980789d670b09d0f3cc54589879d5339ce6eda967bbfec31a713820d1706",
                "Program.cs": "9887c63c02e88fbfc249de658db392b17a344906ce42c10e4490d66c9ffb14a3",
                "wwwroot/app.css": "b15843b5213d5c3186ac8862b50032838d07c7fbf516235abf4019ec88917b1a"
              };
              function walk(dir, out = []) {
                for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                  if (["obj", "bin", "node_modules"].includes(e.name) || e.name.startsWith(".")) continue;
                  const p = path.join(dir, e.name);
                  if (e.isDirectory()) walk(p, out);
                  else out.push(p.replace(/\\/g, "/").replace(/^\.\//, ""));
                }
                return out;
              }
              const hash = (f) =>
                crypto.createHash("sha256").update(fs.readFileSync(f, "utf8").replace(/\r\n/g, "\n")).digest("hex");
              const errs = [];
              const actual = walk(".");
              for (const [f, h] of Object.entries(expected)) {
                if (!fs.existsSync(f)) errs.push("deleted: " + f);
                else if (hash(f) !== h) errs.push("modified: " + f);
              }
              for (const f of actual) if (!(f in expected)) errs.push("unexpected new file: " + f);
              if (errs.length) {
                console.error(errs.join("\n"));
                process.exit(1);
              }
              console.log("all " + Object.keys(expected).length + " in-scope files unchanged");
      - *toolkit-complete-state
      - type: run-command
        config:
          command: dotnet build --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Confirms that the package, registration, namespace import and host files are already correct, and reports that no change was needed.
      - Makes no edits to any project file, including template files unrelated to the Toolkit.
      - Does not add a second registration, a duplicate import, a theme stylesheet link, or a commercial Syncfusion.Blazor package.

  - name: question-only-install-answer-has-concrete-steps
    tags:
      capability: toolkit-install
      risk: stops-after-skill-load
      journey: question-only-install-continuity
    prompt: |
      What exactly do I need to do to start using the open-source Syncfusion Blazor Toolkit in a
      standalone Blazor WebAssembly app on net8.0? Just tell me, don't change any files.
    graders:
      - type: output-contains
        config:
          substring: Syncfusion.Blazor.Toolkit
      - type: output-contains
        config:
          substring: AddSyncfusionBlazorToolkit
      - type: output-matches
        config:
          pattern: '(?i)@?using\s+Syncfusion\.Blazor\.Toolkit\s*;?'
      - type: prompt
    rubric:
      - Gives concrete package, registration and namespace-import steps in the final answer itself.
      - Keeps the template's existing RootComponents lines untouched.
      - Does not instruct linking a Toolkit theme stylesheet.

