name: syncfusion-blazor-toolkit-install
description: Evaluates the dotnet-blazor/syncfusion-blazor-toolkit-install skill
type: capability
defaults:
  timeout: 20m

stimuli:
  # ---------------------------------------------------------------------------
  # Install success paths (supported TFM always stated in the prompt)
  # ---------------------------------------------------------------------------
  - name: server-install-success
    tags:
      capability: toolkit-install
      risk: wrong-package-or-host
      journey: install-legacy-server
    prompt: |
      I'm setting up a legacy-style Blazor Server project that targets net8.0 and uses _Host.cshtml.
      I want to install the open-source Syncfusion Blazor Toolkit.
      What are the steps I need to follow to get it working?
    graders:
      - type: output-matches
        config:
          pattern: (?i)Syncfusion\.Blazor\.Toolkit
      - type: output-matches
        config:
          pattern: (?i)using\s+Syncfusion\.Blazor\.Toolkit
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: output-matches
        config:
          pattern: (?i)_Host\.cshtml
      # Affirmative instruction to link Toolkit theme CSS (warnings allowed)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add)\b[^\n]{0,80}fluent\.min\.css'
      # Affirmative install of commercial Syncfusion.Blazor (without .Toolkit)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|wrong|commercial|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?(?:dotnet add package|PackageReference Include=)\s*"?Syncfusion\.Blazor(?!\.Toolkit)\b'
      # Affirmative request to enter a license key for the Toolkit
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|no|without|free|nothing|avoid|unlike)\b|\w+n[''’]t\b|\bcannot\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:enter|provide|paste|add|register)\b[^\n]{0,40}(?:your|a)\b[^\n]{0,20}(?:syncfusion )?license key'
      - type: prompt
    rubric:
      - Installs Syncfusion.Blazor.Toolkit and registers AddSyncfusionBlazorToolkit with the root namespace in scope.
      - Does not instruct linking fluent.min.css (2.0 uses SfThemeRoot + CSS isolation).
      - Does not ask the user to enter a license key for the open-source Toolkit.

  - name: webassembly-install-success
    tags:
      capability: toolkit-install
      risk: wrong-wasm-host
      journey: install-standalone-wasm
    prompt: |
      I'm building a standalone Blazor WebAssembly application that targets net9.0 and want to add
      the Syncfusion Blazor Toolkit. Can you guide me through installation and setup?
    graders:
      - type: output-matches
        config:
          pattern: (?i)Syncfusion\.Blazor\.Toolkit
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: output-matches
        config:
          pattern: (?i)wwwroot[/\\]index\.html|index\.html
      - type: output-matches
        config:
          pattern: (?i)RootComponents\.Add<App>\("#app"\)
      # Affirmative "add @rendermode" only — "do not add @rendermode" must pass
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|without|no need|unnecessary|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:add|put|place|apply)\b[^\n]{0,40}@rendermode'
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add)\b[^\n]{0,80}fluent\.min\.css'
      - type: prompt
    rubric:
      - Installs the Toolkit for standalone WASM; may mention wwwroot/index.html without requiring a Toolkit theme link.
      - Keeps RootComponents.Add for standalone WASM; does not add @rendermode to an already-interactive app.

  - name: split-webapp-registration
    tags:
      capability: split-registration
      risk: server-only-registration
      journey: configure-split-web-app
    prompt: |
      We have a split Blazor Web App targeting net8.0 with Server and Client projects. Both Server and
      Client components need to use the Syncfusion Blazor Toolkit. What configuration is required?
    graders:
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: output-matches
        config:
          pattern: (?i)(both|server and client|client and server)
      - type: output-matches
        config:
          pattern: (?i)prerender
      # Affirmative "register only on the server" — warnings allowed
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|wrong|mistake|incorrect|instead of|rather than|without)\b|\w+n[''’]t\b|\bcannot\b))(?:(?![.:;!?](?:\s|$))[^\n])*?(?:register (?:it )?only (?:in|on) (?:the )?server|only (?:in|on) the server is (?:enough|sufficient))'
      # Affirmative RootComponents.Add on Client — "do not add RootComponents" must pass
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|without|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?RootComponents\.Add<App>\("#app"\)'
      - type: prompt
    rubric:
      - Registers AddSyncfusionBlazorToolkit on both server and Client; mentions prerendering.
      - Does not add RootComponents.Add to the Web App Client project.

  # ---------------------------------------------------------------------------
  # Theme model (2.0: SfThemeRoot + isolation, no host fluent.min.css)
  # ---------------------------------------------------------------------------
  - name: missing-theme-css-failure
    tags:
      capability: theme-model
      risk: unstyled-components
      journey: diagnose-unstyled-components
    prompt: |
      My net8.0 Blazor Web App has Syncfusion Blazor Toolkit 2.0 installed and registered, but
      the components render with no theme styling. What should I check?
    graders:
      - type: output-matches
        config:
          pattern: (?i)SfThemeRoot|CSS isolation|AddSyncfusionBlazorToolkit|Syncfusion\.Blazor\.Toolkit
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add)\b[^\n]{0,80}fluent\.min\.css'
      - type: prompt
    rubric:
      - Explains 2.0 theming via SfThemeRoot and CSS isolation rather than instructing a fluent.min.css host link.
      - Checks registration, root namespace, and that a Toolkit component (or explicit SfThemeRoot) is in the tree.

  - name: wrong-theme-name-failure
    tags:
      capability: theme-model
      risk: obsolete-theme-link
      journey: remove-1x-stylesheet
    prompt: |
      After upgrading my net8.0 app to Toolkit 2.0 I still have this link in Components/App.razor:
      <link href="_content/Syncfusion.Blazor.Toolkit/themes/bootstrap5.css" rel="stylesheet" />
      Components look wrong. What should I do?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(remove|SfThemeRoot|no longer|not required|CSS isolation)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add|keep|use)\b[^\n]{0,80}(?:fluent\.min\.css|bootstrap5\.css|highcontrast\.min\.css)'
      - type: prompt
    rubric:
      - Directs removal of the obsolete 1.x host theme link; relies on SfThemeRoot + CSS isolation.
      - Does not recommend a replacement fluent.min.css or highcontrast path as the fix.

  - name: wrong-stylesheet-path-failure
    tags:
      capability: theme-model
      risk: obsolete-theme-link
      journey: remove-1x-stylesheet-404
    prompt: |
      On Toolkit 2.0 my net8.0 app gets 404s for:
      <link href="_content/Syncfusion.Blazor.Toolkit/themes/fluent.css" rel="stylesheet" />
      Should I change the path to styles/fluent.min.css?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(remove|SfThemeRoot|no longer|not required|CSS isolation)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:use|link|add|change|fix)\b[^\n]{0,60}styles/fluent\.min\.css'
      - type: prompt
    rubric:
      - Directs removal of the obsolete host theme link rather than correcting it to styles/fluent.min.css.
      - Points at SfThemeRoot and CSS isolation as the 2.0 model.

  - name: numeric-textbox-unstyled
    tags:
      capability: theme-model
      risk: per-component-css
      journey: diagnose-isolation
    prompt: |
      My net9.0 Blazor Web App has Toolkit 2.0 registered, but SfNumericTextBox renders unstyled.
      What should I check?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(SfThemeRoot|CSS isolation|AddSyncfusionBlazorToolkit|registration|2\.0)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|remove|without|no longer|unnecessary)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:link|add)\b[^\n]{0,60}numerictextbox\.min\.css'
      - type: prompt
    rubric:
      - Does not recommend per-component or fluent.min.css host links.
      - Points at isolation, registration, and SfThemeRoot.

  # ---------------------------------------------------------------------------
  # Render modes
  # ---------------------------------------------------------------------------
  - name: static-ssr-insufficient
    tags:
      capability: render-mode
      risk: static-ssr
      journey: enable-interactivity
    prompt: |
      I created a net8.0 app with `dotnet new blazor -int Server` (no -ai). My SfButton OnClick
      does nothing. The page has no @rendermode. What is wrong?
    graders:
      - type: output-matches
        config:
          pattern: (?i)@rendermode|InteractiveServer|interactive boundary|per-page
      - type: output-matches
        config:
          pattern: (?i)(static|SSR|per-page|-ai|all-interactive)
      - type: prompt
    rubric:
      - Recognizes -int Server is per-page; interactive boundary is page @rendermode or a wrapper component.
      - Does not claim -int Server is global without -ai.

  - name: interactive-auto-success
    tags:
      capability: render-mode
      risk: auto-misdescribed
      journey: configure-auto
    prompt: |
      I created a net10.0 app with dotnet new blazor -int Auto. I want the first visit interactive
      on the server, and later visits to use WebAssembly after the runtime is cached. What setup
      does the template need for the Syncfusion Blazor Toolkit?
    graders:
      - type: output-matches
        config:
          pattern: (?i)InteractiveAuto
      - type: output-matches
        config:
          pattern: (?i)AddInteractiveServerComponents
      - type: output-matches
        config:
          pattern: (?i)AddInteractiveWebAssemblyComponents
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      # Affirmative live mid-run switch only
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|only|without|cannot)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:will|does|would)\s+(?:switch|transition)\b[^\n]{0,60}(?:mid-|while running|same component|without reload)'
      - type: prompt
    rubric:
      - Registers both interactive component hosts and Toolkit on server and Client as the Auto template requires.
      - Does not describe Auto as a live runtime switch of a running component.

  # ---------------------------------------------------------------------------
  # Package identity / registration failures
  # ---------------------------------------------------------------------------
  - name: wrong-commercial-package
    tags:
      capability: package-identity
      risk: commercial-package
      journey: replace-wrong-package
    prompt: |
      On a net8.0 hobby project with no other Syncfusion components, I ran
      `dotnet add package Syncfusion.Blazor` and now see AddSyncfusionLicense() and license keys.
      I need the open-source Toolkit. Did I install the wrong package?
    graders:
      - type: output-matches
        config:
          pattern: (?i)Syncfusion\.Blazor\.Toolkit
      - type: output-matches
        config:
          pattern: (?i)(license key|RegisterLicense|SyncfusionLicenseProvider)
      - type: output-matches
        config:
          pattern: (?i)\b(no|not|n[''’]t|without|free)\b[^\n]{0,50}\blicense
      # Affirmative "call AddSyncfusionLicense()" — explaining it does not exist must pass
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|no|nonexistent|doesn|wrong|fake)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:call|use|add|invoke)\b[^\n]{0,30}AddSyncfusionLicense\s*\('
      - type: prompt
    rubric:
      - Identifies Syncfusion.Blazor as the wrong package for pure Toolkit use; points to Syncfusion.Blazor.Toolkit.
      - Notes the open-source Toolkit does not require a license key.

  - name: split-app-partial-registration-failure
    tags:
      capability: split-registration
      risk: client-unregistered
      journey: fix-split-registration
    prompt: |
      My net8.0 split Blazor Web App registers AddSyncfusionBlazorToolkit() only in Server Program.cs.
      Server components work; Client components throw. Both halves need Toolkit. What is missing?
    graders:
      - type: output-matches
        config:
          pattern: (?i)Client[\s\S]{0,60}Program\.cs|Program\.cs[\s\S]{0,60}Client
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|wrong|mistake|incorrect|false)\b|\w+n[''’]t\b|\bcannot\b))(?:(?![.:;!?](?:\s|$))[^\n])*?only (?:the )?server needs'
      - type: prompt
    rubric:
      - Adds the missing Client registration without removing the server registration.
      - Does not add a standalone WebAssembly RootComponents.Add to the Client project.

  - name: missing-registration-http-500
    tags:
      capability: toolkit-install
      risk: missing-registration
      journey: diagnose-http-500
    prompt: |
      My net8.0 Blazor Web App references Syncfusion.Blazor.Toolkit. Pages that use SfButton return
      HTTP 500 with: There is no registered service of type
      'Syncfusion.Blazor.Toolkit.SyncfusionBlazorToolkitService'. What is wrong?
    graders:
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: prompt
    rubric:
      - Diagnoses missing AddSyncfusionBlazorToolkit registration, not a package or stylesheet problem.

  - name: component-namespace-resolution
    tags:
      capability: toolkit-install
      risk: namespace-1x
      journey: migrate-namespace
    prompt: |
      After upgrading to Toolkit 2.0 on net8.0, my pages still have
      @using Syncfusion.Blazor.Toolkit.Buttons and the build fails with CS0234. How do I fix it?
    graders:
      - type: output-matches
        config:
          pattern: (?i)@using\s+Syncfusion\.Blazor\.Toolkit\b
      - type: output-matches
        config:
          pattern: (?i)(single root|namespace consolidation|removed|no longer|2\.0)
      - type: prompt
    rubric:
      - Replaces domain-specific usings with the single root Syncfusion.Blazor.Toolkit namespace.

  # ---------------------------------------------------------------------------
  # Scripts / framework
  # ---------------------------------------------------------------------------
  - name: script-failure-or-js-error
    tags:
      capability: script-loading
      risk: js-error
      journey: diagnose-js-error
    prompt: |
      On net8.0 with Toolkit installed, the browser console shows Syncfusion-related JavaScript
      errors and components do not respond to clicks. What should I check?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(JavaScript|script|console|network|404|_content)
      - type: output-matches
        config:
          pattern: (?i)AddSyncfusionBlazorToolkit
      - type: prompt
    rubric:
      - Looks at registration, interactive boundary, and static web assets — not commercial CDN scripts.

  - name: commercial-script-tags-wrong
    tags:
      capability: script-loading
      risk: commercial-cdn
      journey: remove-cdn-script
    prompt: |
      My net8.0 Toolkit app still has this in the host:
      <script src="https://cdn.syncfusion.com/blazor/..."></script>
      Should I keep the CDN script for Toolkit 2.0?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(remove|do not|don[''']t|unnecessary|bundled|embedded|package)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|without|instead of|rather than)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:keep|add|include|retain)\b[^\n]{0,40}(?:cdn\.syncfusion|CDN script)'
      - type: prompt
    rubric:
      - Says to remove commercial CDN script tags; Toolkit JS is packaged with the NuGet.

  - name: unsupported-framework-net7
    tags:
      capability: toolkit-install
      risk: unsupported-tfm
      journey: upgrade-before-install
    prompt: |
      My Blazor Server app still targets net7.0 and uses _Host.cshtml. Can I install
      Syncfusion.Blazor.Toolkit 2.0 as-is?
    graders:
      - type: output-matches
        config:
          pattern: (?i)(net8|net9|net10|\.NET 8|\.NET 9|\.NET 10|upgrade)
      - type: output-matches
        config:
          pattern: (?i)(NU1202|no compatible|not support|unsupported|cannot install|do not install|upgrade first)
      - type: prompt
    rubric:
      - Refuses install on net7.0; explains restore incompatibility and recommends upgrading first.

  - name: unknown-framework-check-first
    tags:
      capability: toolkit-install
      risk: unknown-tfm
      journey: read-tfm-first
    prompt: |
      Please install the Syncfusion Blazor Toolkit in my Blazor app. I have not told you the
      target framework yet.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(TargetFramework|target framework|net8|net9|net10|which \.NET|what TFM|check.*framework)
      - type: prompt
    rubric:
      - Asks for or reads the TFM before installing; does not assume net8+.

  # ---------------------------------------------------------------------------
  # Dormancy / out of scope
  # ---------------------------------------------------------------------------
  - name: out-of-scope-component-api
    tags:
      capability: dormancy
      risk: api-hijack
      journey: defer-component-api
    prompt: |
      How do I bind SfGrid columns and handle the RowSelected event with the Syncfusion Blazor Toolkit?
    expect_activation: false
    graders:
      - type: prompt
    rubric:
      - Install skill stays dormant; defers component API to other skills or docs.

  - name: out-of-scope-project-creation
    tags:
      capability: dormancy
      risk: project-creation-hijack
      journey: defer-create-project
    prompt: |
      Create a new Blazor Web App for me and then we can talk about UI libraries later.
    expect_activation: false
    graders:
      - type: prompt
    rubric:
      - Install skill stays dormant for project creation; defers package choices.

  - name: out-of-scope-hybrid-maui
    tags:
      capability: dormancy
      risk: install-skill-hijack
      journey: hybrid-boundary
    prompt: |
      I have a .NET MAUI Blazor Hybrid app that hosts UI in a BlazorWebView. I want open-source
      Syncfusion Blazor Toolkit buttons. Where do I put the stylesheet and how do I wire it up?
    expect_activation: false
    graders:
      # Positive recognition of Hybrid/MAUI boundary
      - type: output-matches
        config:
          pattern: (?i)(MAUI|BlazorWebView|Hybrid|out of scope|outside (this|the) skill)
      # Affirmative Web App host edits only (warnings/negations pass)
      - type: output-not-matches
        config:
          pattern: '(?im)(?:^|(?<=[.:;!?])\s+)(?!(?:(?![.:;!?](?:\s|$))[^\n])*?(?:\b(?:not|never|avoid|without|instead of|rather than|no need|unlike|cannot|skip)\b|\w+n[''’]t\b))(?:(?![.:;!?](?:\s|$))[^\n])*?\b(?:open|edit|add|put|place|update|modify|link)\b(?:(?![.:;!?](?:\s|$))[^\n]){0,60}(?:Components/App\.razor|_Host\.cshtml)'
      # Affirmative standalone WASM root registration as a code instruction line
      - type: output-not-matches
        config:
          pattern: '(?im)^\s*(?:builder\.)?RootComponents\.Add<App>\('
      - type: prompt
    rubric:
      - Recognizes MAUI Blazor Hybrid is outside this skill's host/render-mode guidance.
      - May name Web App files or AddSyncfusionBlazorToolkit when explaining why they do not apply.
      - Does not instruct opening Components/App.razor or _Host.cshtml as the Hybrid setup path.
