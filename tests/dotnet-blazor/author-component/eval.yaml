name: author-component
executionShard: components
description: Evaluates the dotnet-blazor/author-component skill
type: capability
defaults:
  timeout: 6m
  runs: 1
stimuli:
  - name: Author a cancellable local search component
    tags:
      feature: cancellable-component-work
    prompt: |
      Write a Blazor component called ProductSearch that will be used on a catalog browsing page. Here are the service contracts the application already registers in DI:

      ```csharp
      public record Product(int Id, string Name, decimal Price, string ImageUrl);

      public interface IProductSearchIndex
      {
          /// <summary>
          /// Searches an in-memory product index by query string.
          /// Respects the cancellation token — callers should cancel when results are no longer needed.
          /// </summary>
          Task<List<Product>> SearchAsync(string query, CancellationToken ct);
      }
      ```

      The parent page will use the component like this:

      ```razor
      <ProductSearch OnProductSelected="HandleSelection" />
      ```

      The component should:
      - Have a search text input. When the user stops typing for 300ms, search automatically
      - Call IProductSearchIndex.SearchAsync to get results
      - Display each product as a card showing Name, Price, and ImageUrl
      - Notify the parent when a card is clicked so it can navigate to the product detail page
      - Handle all the states the component can be in (fetching, nothing found, failure, etc.)
      - If the user types again while a search is in flight, the old search should be abandoned
      - Clean up properly when the component is removed from the page
    graders:
      - type: output-contains
        config:
          substring: IAsyncDisposable
      - type: output-contains
        config:
          substring: CancellationToken
      - type: output-contains
        config:
          substring: EventCallback
      - type: output-matches
        config:
          pattern: (@if|@else)
      - type: prompt
    rubric:
      - 'Handles all visual states: loading, empty, error, and loaded — no missing branches'
      - Uses EventCallback<Product> for product selection notification to the parent
      - Cancels the previous CancellationTokenSource when a new search starts
      - Implements IAsyncDisposable and cancels/disposes resources in DisposeAsync
      - Uses a private field for mutable state — does not mutate [Parameter] properties
      - Debounces search input with Task.Delay + CancellationTokenSource
  - name: Author a multi-step review workflow with shared state
    tags:
      feature: component-data-flow
    prompt: |
      Author a set of Blazor components for a document review workflow.
      Here are the models and service:

      ```csharp
      public class ReviewDocument
      {
          public int Id { get; set; }
          public string Title { get; set; } = "";
          public string Summary { get; set; } = "";
      }

      public class ReviewDecision
      {
          public bool Approved { get; set; }
          public string Notes { get; set; } = "";
      }

      public interface IReviewPolicy
      {
          Task<bool> CanApproveAsync(int documentId, CancellationToken ct);
      }
      ```

      Write the .razor component code for:
      1. ReviewWorkflow.razor — owns the active step, the document, and the decision.
         When "Complete Review" is clicked, the parent receives the completed decision.
      2. DocumentSummaryStep.razor — displays the document and raises a callback for Next.
      3. ApprovalStep.razor — receives the document and decision. Before enabling approval,
         checks IReviewPolicy.CanApproveAsync. While checking, show a loading indicator.
         If the document parameter changes, cancel the previous check and start a new one.
         It exposes Back and Complete callbacks.

      The workflow must handle disposal correctly — if the component is removed while
      the policy check is running, the pending operation should be cancelled cleanly.
    graders:
      - type: output-contains
        config:
          substring: EventCallback
      - type: output-contains
        config:
          substring: '[Parameter]'
      - type: output-contains
        config:
          substring: CancellationToken
      - type: output-matches
        config:
          pattern: (ReviewWorkflow|DocumentSummaryStep|ApprovalStep)
      - type: prompt
    rubric:
      - Parent (ReviewWorkflow) owns the state and passes data to children via [Parameter]
      - Children communicate back to the parent through EventCallback
      - Steps are separate component files, not inline blocks in the parent
      - ApprovalStep cancels the previous policy check when the document changes
      - Implements IAsyncDisposable and cancels the CTS in DisposeAsync — pending validations are cancelled when navigating away
      - Parameters are public auto-properties with { get; set; }
  - name: Author a generic data table component
    tags:
      feature: generic-template-component
    prompt: |
      Write a generic Blazor component called DataTable that works with any item type.
      The parent should be able to customize how headers and rows are rendered by passing
      in their own templates. Here's an example of how a consumer would use it:

      ```razor
      <DataTable Items="@people" OnRowClick="HandleRowClick">
          <HeaderTemplate>
              <th>Name</th>
              <th>Email</th>
          </HeaderTemplate>
          <RowTemplate>
              <td>@context.Name</td>
              <td>@context.Email</td>
          </RowTemplate>
      </DataTable>
      ```

      When there are no items, it should show a sensible default empty state, but the
      consumer should be able to override that too.
    graders:
      - type: output-contains
        config:
          substring: '@typeparam'
      - type: output-matches
        config:
          pattern: RenderFragment
      - type: output-contains
        config:
          substring: EventCallback
      - type: prompt
    rubric:
      - Uses @typeparam to make the component generic
      - RowTemplate is RenderFragment<TItem> — not RenderFragment or a delegate
      - HeaderTemplate and EmptyTemplate are RenderFragment (non-generic)
      - Uses @key on repeated row elements for efficient diffing in loops
      - Handles the empty state with a default message and an optional override template
      - Uses EventCallback<TItem> for OnRowClick
      - Items parameter is IReadOnlyList<TItem> or List<TItem>
  - name: Author a real-time notification badge component
    tags:
      feature: external-event-lifecycle
    prompt: |
      Write a Blazor component called NotificationBadge. Here are the service contracts:

      ```csharp
      public record Notification(int Id, string Title, DateTime ReceivedAt);

      public interface INotificationService
      {
          event Action<Notification> OnNotificationReceived;
          Task<int> GetUnreadCountAsync();
      }
      ```

      The component should:
      - Show a badge with the current unread count
      - Update the count in real time when OnNotificationReceived fires
      - Also poll GetUnreadCountAsync every 30 seconds as a fallback
      - When clicked, the parent needs to know so it can open a notification panel
      - Clean up everything when the component is removed
    graders:
      - type: output-contains
        config:
          substring: IAsyncDisposable
      - type: output-contains
        config:
          substring: DisposeAsync
      - type: output-contains
        config:
          substring: InvokeAsync
      - type: output-matches
        config:
          pattern: (\+=|OnNotificationReceived)
      - type: prompt
    rubric:
      - Implements IAsyncDisposable and unsubscribes from the event in DisposeAsync
      - Subscribes to the event in OnInitialized and unsubscribes in DisposeAsync with -=
      - Uses InvokeAsync to marshal the event callback onto the Blazor sync context before calling StateHasChanged
      - Cancels CTS in DisposeAsync to stop polling
      - Event handler properly dispatches exceptions to the renderer
      - Polls using Task.Delay in a loop or PeriodicTimer
  - name: Author a sortable list with code-behind pattern
    tags:
      feature: code-behind-parameter-copy
    prompt: |
      Write a Blazor component called SortableList using the code-behind pattern
      (SortableList.razor + SortableList.razor.cs). It should work with any item type.

      Here's an example of how a consumer would use it:

      ```razor
      <SortableList Items="@tasks" OnOrderChanged="HandleReorder">
          <ItemTemplate>
              <span>@context.Title</span>
          </ItemTemplate>
      </SortableList>
      ```

      Each item should have "Move Up" and "Move Down" buttons. After each reorder,
      the parent needs the updated list. The component must not modify the list
      that was passed in — it should work on its own internal copy.
    graders:
      - type: output-contains
        config:
          substring: partial class
      - type: output-contains
        config:
          substring: EventCallback
      - type: output-matches
        config:
          pattern: (private|_items|localItems|internalItems)
      - type: output-matches
        config:
          pattern: RenderFragment
      - type: prompt
    rubric:
      - 'Uses the code-behind pattern: .razor file for markup, .razor.cs for logic with partial class'
      - Does NOT mutate the [Parameter] Items property — copies to a private field
      - Copies Items to a local field in OnParametersSet
      - Uses @key in the loop for efficient diffing
      - Uses EventCallback to notify the parent of reorder
  - name: Synchronize a selectable list with changing parameters
    tags:
      feature: parameter-synchronization
    prompt: |
      Write a reusable Blazor component named SelectableList<TItem>. The parent
      supplies an IReadOnlyList<TItem>, a selected item, and an ItemTemplate.
      Clicking an item notifies the parent through a callback.

      The parent can replace either the item list or selected item after the
      component is already rendered. The component may keep local UI state, but
      it must never mutate the supplied collection or selected parameter. Show
      the complete component and a small usage example.
    graders:
      - type: output-contains
        config:
          substring: OnParametersSet
      - type: output-contains
        config:
          substring: IReadOnlyList
      - type: output-contains
        config:
          substring: EventCallback
      - type: output-matches
        config:
          pattern: RenderFragment
      - type: prompt
    rubric:
      - Keeps parent-owned parameters immutable and synchronizes a private local view when parameters change
      - Uses a typed template for rendering items and a typed callback for selection
      - Handles a replaced item collection and selected value without stale local state
      - Uses stable keys for repeated item elements
  - name: Author a composable tab set
    tags:
      feature: composable-child-content
    prompt: |
      Write a small Blazor TabSet and Tab pair. Consumers should declare tabs as
      child content, each tab supplies a title and arbitrary body content, and the
      TabSet displays one active tab at a time. The first registered tab is active
      by default, clicking another tab changes the active body, and removing a tab
      must not leave the TabSet pointing at a dead child.

      Show both component files and a usage example. Use built-in Blazor APIs only.
    graders:
      - type: output-contains
        config:
          substring: CascadingValue
      - type: output-matches
        config:
          pattern: RenderFragment
      - type: output-contains
        config:
          substring: '[CascadingParameter]'
      - type: output-matches
        config:
          pattern: (Dispose|RemoveTab)
      - type: prompt
    rubric:
      - Composes tabs through child content instead of requiring a separate list model
      - Registers each Tab with its containing TabSet through a cascading parent reference
      - Activates the first tab and changes the rendered body when another tab is selected
      - Removes disposed tabs and selects a valid remaining tab when the active child disappears
  - name: Repair blocking async component code
    tags:
      feature: async-safety-review
    prompt: |
      Review and rewrite this Blazor component so it remains responsive and
      reports asynchronous failures through the renderer. Return the corrected
      component and briefly explain the defects.

      ```razor
      @inject IReportService Reports

      <button @onclick="Generate">Generate</button>
      <p>@status</p>

      @code {
          private string status = "Idle";

          private void Generate()
          {
              Task.Run(() =>
              {
                  var report = Reports.CreateAsync().Result;
                  status = report.Name;
                  StateHasChanged();
              });
          }
      }
      ```
    graders:
      - type: output-matches
        config:
          pattern: async Task
      - type: output-contains
        config:
          substring: await
      - type: prompt
    rubric:
      - Removes blocking and thread-pool escape primitives from the event handler
      - Awaits the service operation on the component synchronization context
      - Relies on the event lifecycle to re-render after completion instead of calling StateHasChanged from a worker thread
      - Leaves exceptions observable by the Blazor renderer or routes them through DispatchExceptionAsync
  - name: Stay dormant for form validation work
    tags:
      feature: routing-boundary
    prompt: |
      Build a Blazor registration form with EditForm, data annotations, inline
      ValidationMessage components, and server-returned field errors that clear
      when the user edits a field.
    expect_activation: false
    graders:
      - type: prompt
    rubric:
      - Solves the form binding and validation request without turning it into general component-architecture work
      - Includes field-specific validation behavior and preserves entered values
      - Stayed dormant and did not hijack the request with unrelated component-authoring guidance
