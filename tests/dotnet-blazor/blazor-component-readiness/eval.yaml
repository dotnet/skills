name: blazor-component-readiness
description: Evaluates evidence-backed local assessment of released Blazor component packages
type: capability
defaults:
  timeout: 20m
  runs: 1
scoring:
  threshold: 1.0
stimuli:
  - name: Give documentation-testing advice without a readiness finding
    prompt: |
      We're discussing follow-up advice for a Blazor component readiness review, but no assessment
      report exists yet. Our public samples already exist. How should we check a few examples for
      accuracy, especially when a Razor attribute can compile without configuring the intended
      component parameter? Explain a bounded approach here, not a new assessment or implementation.
    constraints:
      reject_tools: [execute, bash, Bash, run_shell_command, edit, Edit, Write, write_file, web_search, web_fetch]
    graders:
      - type: file-not-exists
        config:
          path: '**/*.assessment.json'
      - type: file-not-exists
        config:
          path: '**/decision-guidance.md'
      - type: prompt
      - type: exit-success
    rubric:
      - Explains why successful compilation alone may miss an ineffective parameter or promise and suggests checking the specific observable behavior.
      - Uses the exact package and documented context without demanding that every vendor sample be compiled, requiring Copilot use, or inventing a failed readiness criterion.
      - Answers the requested how-to question without creating a report, changing scores, executing examples, installing tools, or claiming an operation ran.

  - name: Give bounded data-transfer advice without profiling
    prompt: |
      As optional follow-up to our Blazor component readiness discussion, help me reason about a
      Server component that serializes its full data set on each selection change. We have source
      showing that send path but no trace, measured payload size, timing, or evidence of a user
      impact yet. No assessment report exists. What can we conclude now and what would help
      determine whether anything should change?
    constraints:
      reject_tools: [execute, bash, Bash, run_shell_command, edit, Edit, Write, write_file, web_search, web_fetch]
    graders:
      - type: file-not-exists
        config:
          path: '**/*.assessment.json'
      - type: file-not-exists
        config:
          path: '**/decision-guidance.md'
      - type: prompt
      - type: exit-success
    rubric:
      - Treats full-data serialization as a potentially intentional pattern, not proof of a defect, excessive cost, or a missing budget.
      - Identifies concrete evidence such as call frequency, actual payload bytes and the affected interaction while explaining the limits of allocation and copying attribution.
      - Gives advice without launching profiling, promising a diagnosis, requiring a broad performance dossier, or creating or changing readiness results.

  - name: Retain excluded deliverables without inventing defects
    prompt: |
      Review fixture/library-only.json and write out/scope.md explaining how the current
      package review should represent scaffolder and AI requirements. We want a traceable
      record, not a smaller checklist. Also explain who owns the removal policy. Do not
      run probes, modify the package or use the network.
    environment:
      files:
        - src: fixtures/conditional-intake/library-only.json
          dest: fixture/library-only.json
    graders:
      - type: file-exists
        config:
          path: out/scope.md
      - type: prompt
      - type: exit-success
    rubric:
      - Both absent deliverable families remain explicitly accounted for with scope-specific not-applicable rationales.
      - Development templates are not treated as a promoted scaffolder against the owner's explicit scope confirmation.
      - Microsoft removal discretion is not rewritten as a partner-owned suspension and restoration process.
      - The response distinguishes missing rows from demonstrated product defects.

  - name: Apply AI requirements from promoted source deliverables
    prompt: |
      Review the fictional cases in fixture/source-manifest.json, including their source,
      package, upstream and change-history evidence. For each case, decide family applicability and assess
      AI-01 through AI-06 from the supplied facts.

      Write `out/ai-decisions.json` with `schema_version: 1` and a `cases` array. Each case needs its
      `id`, `family_applicability`, and a `rows` object keyed by requirement ID. Row fields are
      `status`, `evidence_ids`, `missing_fact`, and `rationale_code`. This is a draft decision
      worksheet: use JSON null for an unassigned status or an unused field. The test-local
      `missing_fact` codes are `new-ai-skill-status`,
      `release-day-and-library-change-maintenance-ownership`, and
      `responsible-ai-review-before-merge`. The rationale codes are
      `confirmed-no-promoted-ai-deliverable` and `confirmed-existing-ai-skill`.

      Worksheet output protocol:
      `family_applicability` is exactly `applicable` or `not applicable`. Assigned row `status`
      values are exactly `verified`, `gap`, `owner evidence required`, or `not applicable`.
      The only unassigned row status is JSON null for `AI-06` when newness is unresolved.
      Keep the listed missing-fact codes in `missing_fact` and rationale codes in `rationale_code`;
      unused code fields are JSON null. Each row's `evidence_ids` retains its applicability basis
      and its own supplied fact/context where required for that row, not a fixed citation count.
      Do not fabricate absent context. Include exactly the qualifying required evidence IDs;
      citation order may vary, but duplicate or extraneous IDs are invalid.
      For allowed nulls, omission is equivalent to JSON null, not the string "null" or prose.
      Keep explanations in the accompanying prose, not in code fields.
      End worksheet output protocol.

      Briefly summarize the evidence and any unresolved context for each case. Stay offline.
    environment:
      files:
        - src: fixtures/terra-residuals/promoted-ai
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
    graders:
      - type: file-exists
        config:
          path: out/ai-decisions.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-ai-applicability --fixture fixture/source-manifest.json --input out/ai-decisions.json
          expected_exit_code: 0
          stdout_matches: VALID AI applicability promotion newness and review timing
      - type: prompt
      - type: exit-success
    rubric:
      - The promoted source-hosted helper makes the AI family applicable even though it is absent from the package and upstream inventory.
      - Row decisions distinguish family promotion from the new-skill condition of AI-06, which requires RAI review before merge.
      - A known-new skill with no supplied review identifies the missing before-merge review evidence; a known-existing skill gets a change-specific N/A for AI-06 only.
      - Missing newness leaves AI-06 applicability unresolved and its draft status unassigned, not guessed new or existing.
      - The complete explicit no-deliverable control remains not applicable for all six rows.

  - name: Respect the integration requirement for an in-scope scaffolder
    prompt: |
      Review fixture/promoted-scaffolder.json and write out/scope.md for the partner.
      Tell them what the supplied manifest establishes, what is still untested and what
      exact artifact could close the integration question. Do not run probes or use the network.
    environment:
      files:
        - src: fixtures/conditional-intake/promoted-scaffolder.json
          dest: fixture/promoted-scaffolder.json
    graders:
      - type: file-exists
        config:
          path: out/scope.md
      - type: prompt
      - type: exit-success
    rubric:
      - The declared promoted scaffolder is in scope and dotnet-new-only integration conflicts with the supplied requirement.
      - The response does not claim accessibility or generated-code correctness from an integration manifest.
      - Closure requires the documented scaffolding integration and contributed artifact rather than merely renaming a template.
      - Absent AI deliverables remain explicitly not applicable rather than omitted or failed.

  - name: Distinguish release intent from package facts
    prompt: |
      Our release workflow says the Blazor control package is signed and publishes an SBOM. Review only
      the supplied workflow text and captured package inventory, then tell me what those materials
      actually establish for a vendor self-assessment. Do not use the network.
    environment:
      files:
        - src: fixtures/artifact-truth
          dest: fixture
    graders:
      - type: output-matches
        config:
          pattern: (?i)(intent|claim).*(does not|cannot|not).*(establish|prove)
      - type: output-matches
        config:
          pattern: (?i)(signature|signed).*(SBOM|software bill)
      - type: exit-success

  - name: Credit bounded release execution records
    prompt: |
      Review fixture/records.json for a fictional package release. It contains policy publications
      and separate release-run, publish-job, dependency-scan, and incident-operation records. Produce
      `out/release-decisions.json` with `schema_version: 1`, `evidence_origin`,
      `operations_executed_now`, the exact `package_sha256`, one entry in a `claims` array for every
      declared claim, and a `limitations` object with Boolean values for
      `all_release_history_established`, `complete_target_authentication_established`, and
      `all_vulnerabilities_closed`, derived from the retained evidence rather than assumed.
      Claim fields are `id`, `status`,
      `evidence_ids`, `scope`, and `remaining_fact`; use JSON null where needed.
      For established facts use these test-local scope codes as appropriate:
      `policy-publication-only`, `single-recorded-release-run`, `declared-dependency-scan-scope`,
      `incident-policy-publication-only`, `single-recorded-incident-exercise`, or
      `target-signature-verification`. Missing execution facts use `release-bound-run-and-job-record`,
      `release-bound-scan-record`, `release-bound-incident-operation-record`, or
      `target-bound-signature-verification` as appropriate.

      Worksheet output protocol:
      `status` is non-null and is exactly `verified` or `not tested`.
      Retain the supported `scope` code and qualifying `evidence_ids` even if the requested
      execution fact remains unresolved; `scope` is JSON null only when there is no qualifying support.
      `remaining_fact` holds only the listed missing-execution code for an unresolved execution fact,
      otherwise JSON null. Publication questions have no missing-execution code, even when not verified.
      Include exactly the qualifying required evidence IDs; citation order may vary, but duplicate
      or extraneous IDs are invalid. For allowed nulls, omission is equivalent to JSON null,
      not the string "null" or prose.
      Keep broader caveats and explanations in the accompanying prose, not in code fields.
      End worksheet output protocol.

      Explain what the retained material establishes for each claim and what remains unresolved.
      These records describe a fictional release; do not perform new operations or use the network.
    environment:
      files:
        - src: fixtures/terra-residuals/release-execution
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
    graders:
      - type: file-exists
        config:
          path: out/release-decisions.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-release-records --fixture fixture/records.json --input out/release-decisions.json
          expected_exit_code: 0
          stdout_matches: VALID release execution bounded facts and limitations
      - type: prompt
      - type: exit-success
    rubric:
      - The release run, publish job, dependency scan, and incident operation are credited as supplied execution facts.
      - Policy publication remains distinct from evidence that an operation occurred.
      - The result stays limited to the recorded release and scan scope and does not claim complete authentication or vulnerability closure.

  - name: Classify three different evidence boundaries
    prompt: |
      Produce a local factual assessment for only the Grid component in the supplied package.
      One implementation fact is contradicted by the source, one formal accessibility fact can
      only come from the owner, and one static-rendering
      check was never run. Keep those three situations distinct, finish the complete report under
      ./out, and verify it without network access.
    environment:
      files:
        - src: fixtures/component
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/revisions/0001/component.validation.json
      - type: file-contains
        config:
          path: out/revisions/0001/component.assessment.json
          value: '"status":"gap"'
      - type: file-contains
        config:
          path: out/revisions/0001/component.assessment.json
          value: '"status":"owner evidence required"'
      - type: file-contains
        config:
          path: out/revisions/0001/component.assessment.json
          value: '"status":"not tested"'
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind component --rows 52
          expected_exit_code: 0
          stdout_matches: VALID component 52
      - type: exit-success

  - name: Apply the four status boundaries precisely
    prompt: |
      Create a targeted row-decision worksheet for a synthetic Blazor package without using the network:

      - The confirmed complete owner-controlled public policy corpus contains no general support
        response commitment.
      - A private pre-release threat model was not supplied, and that row does not require publication.
      - Selection announcements apply, but no screen-reader or live-region probe was run.
      - The owner explicitly confirms that optional telemetry is not offered, and the complete
        component source/runtime inventory exposes no telemetry option or consent surface.

      Classify SUP-03, SEC-01, A11Y-09, and SEC-11 with the exact status and explain the matching
      evidence-state boundary. Do not create a full report.
    graders:
      - type: output-matches
        config:
          pattern: (?is)SUP-03.{0,300}\bgap\b
      - type: output-matches
        config:
          pattern: (?is)SEC-01.{0,300}owner evidence required
      - type: output-matches
        config:
          pattern: (?is)A11Y-09.{0,300}not tested
      - type: output-matches
        config:
          pattern: (?is)SEC-11.{0,300}not applicable
      - type: output-matches
        config:
          pattern: (?is)((complete|confirmed).{0,250}public.{0,250}(absent|missing|contains no)|(absent|missing|contains no).{0,250}public.{0,250}(complete|confirmed))
      - type: output-matches
        config:
          pattern: (?is)(screen-reader|live-region).{0,200}(not run|unrun|missing probe|not tested)
      - type: exit-success

  - name: Separate implementation proof from outcome proxies
    prompt: |
      Perform a targeted source-boundary review for three synthetic component rows. A keyed reorder
      browser operation passed, but no admitted Razor or component/base source shows whether @key is
      used. Separately, exact source implements only IDisposable and synchronously discards the Task
      returned by browser cleanup; the browser handler removes listeners only after that cleanup
      message is processed.

      Classify PERF-02, BEQ-15, and BEQ-16 with exact statuses and evidence-state boundaries.
      Explain why the reorder outcome cannot prove the implementation mechanism. Do not run new
      probes.
    graders:
      - type: output-matches
        config:
          pattern: (?is)PERF-02.{0,300}\bnot tested\b
      - type: output-matches
        config:
          pattern: (?is)(reorder|behavior).{0,200}(does not|cannot).{0,200}(prove|establish).{0,100}@key
      - type: output-matches
        config:
          pattern: (?is)BEQ-15.{0,300}\bgap\b
      - type: output-matches
        config:
          pattern: (?is)BEQ-16.{0,300}\bgap\b
      - type: exit-success

  - name: Enforce release and parameter trust boundaries
    prompt: |
      Classify three targeted rows for a synthetic Blazor package without using the network:

      - CI-07: Pull-request CI is separate, but the release job has OIDC and protected-environment
        privileges from job start. That same job checks out repository source, runs npm install
        scripts and the package build, then authenticates, signs, and publishes.
      - CI-08: The release job signs a nupkg, verifies it, runs another action, then pushes the same
        mutable workspace path. It records no artifact digest and has no immutable artifact handoff
        into a separate privileged publishing stage.
      - BEQ-09: The component normally stores incoming Value in a backing field, but one conditional
        event-handler path executes `this.Value = newValue;` before invoking ValueChanged.
      - PERF-05: Complete source shows a CascadingValue whose value can change and that does not set
        IsFixed. No runtime capture counts descendant renders before or after a representative
        parent update.

      Write the exact statuses as one JSON object at `out/targeted-decisions.json`, mapping each
      requirement ID directly to its status string. Include PERF-05 with the other three IDs. Then
      explain the decisive boundary for each in your response. Do not create a full report.
    graders:
      - type: file-exists
        config:
          path: out/targeted-decisions.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-targeted-decisions --input out/targeted-decisions.json
          expected_exit_code: 0
          stdout_matches: VALID targeted decisions CI-07 CI-08 BEQ-09 PERF-05
      - type: output-matches
        config:
          pattern: (?is)(same job|same-job).{0,250}(build|untrusted).{0,250}(sign|publish|privileg)
      - type: output-matches
        config:
          pattern: (?is)(mutable path|path equality|same path).{0,250}(not|isn.t|does not).{0,200}(immutable|digest|byte)
      - type: output-matches
        config:
          pattern: (?is)(Value|parameter setter|public parameter).{0,250}(assign|mutat)
      - type: output-matches
        config:
          pattern: (?is)PERF-05.{0,300}\bnot tested\b
      - type: output-matches
        config:
          pattern: (?is)(CascadingValue|IsFixed|cascading).{0,250}(risk|applicab).{0,250}(does not|cannot|not enough).{0,200}(prove|establish|demonstrate).{0,100}(rerender|gap)
      - type: exit-success
    environment:
      files:
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py

  - name: Classify published artifact absence and mechanism applicability
    prompt: |
      Classify seven rows for a synthetic released Blazor package without using the network:

      - The confirmed complete exact nupkg inventory and public release-asset inventory contain no
        SPDX or CycloneDX SBOM and no provenance attestation. The complete release workflow builds,
        signs, and publishes the package but performs no SBOM or provenance generation/publication.
        The nupkg contains third-party assets, but no admitted evidence establishes whether every
        asset is represented. Separately, the complete notice map pairs only a subset of those
        assets and omits the admitted dependency inventory.
      - Complete component and inherited-renderer source proves the component only forwards
        consumer-owned ChildContent. It owns no repeated collection, rendered loop, or other
        identity-stability surface where @key could apply.

      Write one JSON object at `out/provenance-decisions.json`, mapping PI-06 through PI-11 and
      PERF-02 directly to exact status strings. Keep missing SBOM bytes distinct from direct
      incomplete asset/notice representation. Explain why a behavior result is unnecessary when
      complete source proves the mechanism has no applicable owned surface. Do not create a full
      report.
    graders:
      - type: file-exists
        config:
          path: out/provenance-decisions.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-provenance-decisions --input out/provenance-decisions.json
          expected_exit_code: 0
          stdout_matches: VALID provenance decisions PI-06 PI-07 PI-08 PI-09 PI-10 PI-11 PERF-02
      - type: output-matches
        config:
          pattern: (?is)(PI-06|PI-07|PI-10|PI-11).{0,350}\bgap\b
      - type: output-matches
        config:
          pattern: (?is)PI-08.{0,300}\bnot tested\b
      - type: output-matches
        config:
          pattern: (?is)PI-09.{0,300}\bgap\b
      - type: output-matches
        config:
          pattern: (?is)PERF-02.{0,300}not applicable
      - type: output-matches
        config:
          pattern: (?is)(no component-owned|owns no).{0,250}(collection|loop|identity).{0,250}(not applicable|no applicable)
      - type: exit-success
    environment:
      files:
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py

  - name: Select only owner-controlled documentation
    prompt: |
      I captured package-owner metadata plus a list of possible pages for our Blazor control. Identify the
      exact documentation set suitable for an offline vendor assessment. Do not browse, and do not
      treat community commentary as official product documentation.
    environment:
      files:
        - src: fixtures/documentation
          dest: fixture
    graders:
      - type: output-contains
        config:
          substring: https://components.example.test/docs/widget
      - type: output-contains
        config:
          substring: https://code.example.test/components/docs-widget/blob/v1.0.0/README.md
      - type: output-not-contains
        config:
          substring: https://community.example.test/widget-review
      - type: exit-success

  - name: Use a bounded internal owner record
    prompt: |
      The package owner supplied an internal accessibility audit alongside the exact Blazor Grid package.
      Assess only the Grid component. Use the audit where it directly applies, label where it came
      from, and create and verify the complete
      local report under ./out. Do not publish or upload anything.
    environment:
      files:
        - src: fixtures/component
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/revisions/0001/component.validation.json
      - type: file-contains
        config:
          path: out/revisions/0001/component.assessment.json
          value: '"status":"verified"'
      - type: file-contains
        config:
          path: out/revisions/0001/component.evidence.json
          value: owner-supplied-internal-evidence
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind component --rows 52
          expected_exit_code: 0
      - type: exit-success

  - name: Assess a package with no public source
    prompt: |
      We ship this Blazor control as binaries and do not publish its source. Produce a bounded
      assessment of only the closed-grid component from the exact local package and captured documentation, writing
      and verifying the complete report under ./out. Do not treat missing source as a failed fetch.
    environment:
      files:
        - src: fixtures/closed
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-contains
        config:
          path: out/input.confirmed.json
          value: '"availability":"closed-source"'
      - type: file-exists
        config:
          path: out/revisions/0001/component.validation.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind component --rows 52
          expected_exit_code: 0
      - type: output-not-matches
        config:
          pattern: (?i)(clone|source repository).*(required|must)
      - type: exit-success

  - name: Produce one complete component record
    prompt: |
      Create the complete factual record for only the Grid component in the supplied package.
      No package assessment has been performed or is requested. Cover the component checks,
      render the local report under ./out,
      and verify the result. No external services are available.
    environment:
      files:
        - src: fixtures/component
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/revisions/0001/component.report.md
      - type: file-exists
        config:
          path: out/revisions/0001/component.validation.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind component --rows 52
          expected_exit_code: 0
          stdout_matches: VALID component 52
      - type: file-contains
        config:
          path: out/revisions/0001/component.assessment.json
          value: '"package_reference":null'
      - type: file-not-exists
        config:
          path: '**/package.assessment.json'
      - type: exit-success

  - name: Bind package and component records
    prompt: |
      Assess the supplied Blazor library package once for package-wide facts and assess only its Grid
      control for component facts. Keep the two records separate, bind the component to the exact
      validated package result, render both under ./out, and verify both. Stay local.
    environment:
      files:
        - src: fixtures/library
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-exists
        config:
          path: out/package-revisions/0001/package.validation.json
      - type: file-exists
        config:
          path: out/grid-revisions/0001/component.validation.json
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/package-revisions/0001 --kind package --rows 60
          expected_exit_code: 0
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/grid-revisions/0001 --kind component --rows 52
          expected_exit_code: 0
      - type: file-contains
        config:
          path: out/grid-revisions/0001/component.assessment.json
          value: '"package_reference":{'
      - type: exit-success

  - name: Preserve supplied candidate identity
    prompt: |
      Evaluate only candidate-grid in the unpublished Blazor package file as the release candidate it is. Preserve
      the exact package identity and bytes, create the complete local assessment under ./out, and
      verify it. Do not substitute a published or rebuilt package.
    environment:
      files:
        - src: fixtures/candidate
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/package.nupkg.b64 fixture/package.nupkg
    graders:
      - type: file-contains
        config:
          path: out/input.confirmed.json
          value: '"acquisition":"release-candidate"'
      - type: file-contains
        config:
          path: out/input.confirmed.json
          value: '"package_id":"candidate.widget"'
      - type: file-contains
        config:
          path: out/input.confirmed.json
          value: '"version":"3.0.0-rc.1"'
      - type: run-command
        config:
          command: python3 fixture/fixture-tool.py verify-revision --revision out/revisions/0001 --kind component --rows 52
          expected_exit_code: 0
      - type: exit-success

  - name: Bind signature evidence to the selected package
    prompt: |
      Inspect the two inert synthetic package archives and fixture/evidence.json. Identify the
      selected target, assess the recorded signature claims for each archive, and compare the
      observed entries.

      Write `out/candidate-binding.json` with `schema_version: 1`, `evidence_origin`,
      `signature_verification_executed_now`, the shared `package_identity`, a `decisions` array with
      an entry for each package role, and an `entry_observations` array. Package
      decisions need `package_role`, `package_sha256`, `status`, `evidence_ids`, and
      `remaining_fact`. Each entry observation needs `entry_path`, a `containers` array containing
      `package_role`, `package_sha256`, and `entry_sha256`, and a `relationship` value of
      `identical-entry-bytes` or `different-entry-bytes`.
      Use the fixture's record origin; an unresolved signature fact uses the test-local code
      `target-bound-signature-verification`. Treat the receipt
      only as supplied synthetic data; do not run or claim a cryptographic verification. Briefly
      summarize the evidence for both archives in your response.
    environment:
      files:
        - src: fixtures/terra-residuals/candidate-binding
          dest: fixture
        - src: fixtures/fixture-tool.py
          dest: fixture/fixture-tool.py
      commands:
        - python3 fixture/fixture-tool.py decode fixture/target.nupkg.b64 fixture/target.nupkg
        - python3 fixture/fixture-tool.py decode fixture/alternate.nupkg.b64 fixture/alternate.nupkg
