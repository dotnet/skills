            - >-
              {"status":"verified","ownership":"internal-state",
              "files":{"SelectionToggle.csproj":"93202fc34fad55c1740d70002685e4cea19cbf0bd45beab98b38ed01eea8fa3b",
              "SelectionStateBase.cs":"0494b2acca29e04e7c21342c87bea995bad2f2cc82e9940c14e51f52547ade0f",
              "SelectionToggle.razor":"a4fa093aabef2a64222435da2734ec50c06b9df3f89c365b0510c42e8a6630ba",
              "SelectionToggle.razor.cs":"1c8e04918e1a7f85b8a88edfe939cf82d32b04b60117b9cefafe460c42076421"},
              "criterion_sha256":"26d779a5f32f266a85bdf5cc21fe8654cc0b46a5e7e98267750e6c608f303291",
              "anchors":[
              {"path":"SelectionToggle.razor.cs","start_line":15,"end_line":15,"text":"            CurrentValue = nextValue;"},
              {"path":"SelectionStateBase.cs","start_line":16,"end_line":16,"text":"    protected bool CurrentValue;"},
              {"path":"SelectionStateBase.cs","start_line":7,"end_line":14,"text":"    [Parameter]\n    public bool Value { get; set; }\n\n    [Parameter]\n    public bool AllowChange { get; set; }\n\n    [Parameter]\n    public EventCallback<bool> ValueChanged { get; set; }"},
              {"path":"SelectionStateBase.cs","start_line":20,"end_line":20,"text":"        CurrentValue = Value;"},
              {"path":"SelectionToggle.razor.cs","start_line":18,"end_line":18,"text":"        await ValueChanged.InvokeAsync(nextValue);"},
              {"path":"SelectionToggle.razor","start_line":2,"end_line":2,"text":"@inherits SelectionStateBase"},
              {"path":"SelectionToggle.razor","start_line":5,"end_line":5,"text":"<button type=\"button\" aria-pressed=\"@CurrentValue\" disabled=\"@(!AllowChange)\" @onclick=\"HandleToggleAsync\">"}]}
    rubric:
      - The internal-state ownership decision is supported by its declaration and update paths, not merely by the absence of a reported defect.
      - All public parameter declarations and owned source paths satisfy the complete source-level requirement; no runtime success is inferred.
