          expected_exit_code: 0
          stdout_matches: VALID candidate binding target-isolated positive-control
      - type: prompt
      - type: exit-success
    rubric:
      - The selected archive is not treated as signature-verified from a receipt bound to the other whole-package digest.
      - The comparison archive receives the bounded positive result supported by its own supplied receipt.
      - Identical DLL bytes preserve both containing package identities while differing signature entries remain distinct.
      - The response does not claim that a real signature verifier ran.

