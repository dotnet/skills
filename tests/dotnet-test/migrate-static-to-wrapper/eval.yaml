name: migrate-static-to-wrapper
executionShard: c
description: Evaluates the dotnet-test/migrate-static-to-wrapper skill
type: capability
# The prior GPT-family run produced 4W/5T/0L: positive but one discordant
# stimulus short of the sign-test floor. This predeclared scenario adds distinct
# local-calendar semantics breadth instead of repeating a UTC migration.
config:
  timeout: 3m
stimuli:
  - name: Migrate DateTime.UtcNow to TimeProvider in a service class
    prompt: >
      I have a CouponService that uses DateTime.UtcNow in several places.
      TimeProvider is already registered in my DI container. Can you replace
      all the DateTime.UtcNow calls with TimeProvider and add the constructor
      parameter?
    environment:
      files:
        - src: ./fixtures/ready-to-migrate
          dest: ReadyToMigrate
    graders:
      - type: file-contains
        config:
          path: "**/CouponService.cs"
          value: TimeProvider
      - type: file-not-contains
        config:
          path: "**/CouponService.cs"
          value: DateTime.UtcNow
      - type: exit-success
      - type: prompt
    rubric:
      - Replaced all DateTime.UtcNow calls in CouponService.cs with TimeProvider calls
      - Added TimeProvider as a constructor parameter to CouponService
      - Stored TimeProvider in a readonly field following the class's existing naming convention
      - Did not change the behavior of any method — only the time source changed
      - Did not modify Program.cs DI registration since TimeProvider was already registered

  - name: Migrate only in scoped files, leaving others untouched
    prompt: >
      I want to migrate DateTime.UtcNow to TimeProvider, but only in
      CouponService.cs for now. Don't touch AuditLogger.cs yet — I'll do that
      in a separate pass. TimeProvider is already in my DI container.
    environment:
      files:
        - src: ./fixtures/ready-to-migrate
          dest: ReadyToMigrate
    graders:
      - type: file-contains
        config:
          path: "**/CouponService.cs"
          value: TimeProvider
      - type: file-contains
        config:
          path: "**/AuditLogger.cs"
          value: DateTime.UtcNow
      - type: exit-success
      - type: prompt
    rubric:
      - Migrated DateTime.UtcNow to TimeProvider in CouponService.cs
      - Left AuditLogger.cs completely untouched with DateTime.UtcNow calls still present
      - Respected the scope boundary the user specified
      - Told the user which file was migrated and which was deliberately left alone, so the remaining work is not
        silently dropped

  - name: Decline migration when wrapper does not exist yet
    prompt: >
      Replace all File.ReadAllText calls in my project with IFileSystem. Just
      do the bulk replacement across all files.
    environment:
      files:
        - src: ./fixtures/decline-no-wrapper/MyProject.csproj
          dest: MyProject/MyProject.csproj
        - src: ./fixtures/decline-no-wrapper/DataLoader.cs
          dest: MyProject/DataLoader.cs
    graders:
      - type: output-matches
        config:
          pattern: (System\.IO\.Abstractions|not.*referenced|prerequisite|authorize|wrapper.*first)
      - type: prompt
    rubric:
      - Identified that System.IO.Abstractions NuGet package is not referenced in the project
      - Did not blindly replace File.ReadAllText with IFileSystem calls that would not compile
      - Stopped before editing because package and registration changes were not authorized, and identified wrapper
        generation/adoption or explicit dependency authorization as the prerequisite

  - name: Preserve DateTimeKind when migrating to TimeProvider
    prompt: >
      Migrate the DateTime.UtcNow calls in CouponService.cs to the TimeProvider that is
      already registered in DI. This is a pure refactor — the values stored on Coupon must
      behave exactly as they do today.
    environment:
      files:
        - src: ./fixtures/ready-to-migrate
          dest: ReadyToMigrate
    graders:
      - type: file-contains
        config:
          path: "**/CouponService.cs"
          value: UtcDateTime
      - type: file-not-contains
        config:
          path: "**/CouponService.cs"
          value: DateTime.UtcNow
      - type: exit-success
      - type: prompt
    rubric:
      - Converted the DateTimeOffset from GetUtcNow() back to DateTime in a way that leaves the stored values with
        the same DateTimeKind they had before (Utc), so no consumer observes a behavior change
      - Did not use the plain .DateTime property, which would silently downgrade the Kind to Unspecified
      - Left CreatedAt and ExpiresAt typed as DateTime instead of widening them to DateTimeOffset
      - Kept the behavior of CreateCoupon, IsValid and TimeUntilExpiry identical apart from the time source
      - Restricted the change to the DateTime.UtcNow call sites the user named, leaving the intentional local-time
        call untouched

  - name: Preserve local calendar semantics when migrating DateTime.Now
    prompt: >
      CouponService.IsRedeemableToday intentionally compares against the local
      calendar day with DateTime.Now. TimeProvider is already registered in DI.
      Migrate only that DateTime.Now read to TimeProvider without changing its
      DateTime type or local DateTimeKind semantics. Leave every DateTime.UtcNow
      call in the file untouched.
    environment:
      files:
        - src: ./fixtures/ready-to-migrate
          dest: ReadyToMigrate
    graders:
      - type: file-contains
        config:
          path: "**/CouponService.cs"
          value: GetLocalNow()
      - type: file-contains
        config:
          path: "**/CouponService.cs"
          value: LocalDateTime
      - type: file-contains
        config:
          path: "**/CouponService.cs"
          value: DateTime.UtcNow
      - type: run-command
        config:
          command: >-
            sh -c 'grep -vE "^[[:space:]]*//" ReadyToMigrate/Services/CouponService.cs
            > .eval-csharp-lines && ! grep -q "DateTime.Now" .eval-csharp-lines'
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "test $(grep -o 'DateTime.UtcNow' ReadyToMigrate/Services/CouponService.cs | wc -l) -eq 4"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build ReadyToMigrate/ReadyToMigrate.csproj
          expected_exit_code: 0
          timeout: 3m
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)(build succeeded|built successfully|0 errors?)
      - type: prompt
    rubric:
      - Replaced only the DateTime.Now read in IsRedeemableToday with TimeProvider
      - Used GetLocalNow().LocalDateTime.Date so the replacement remains a local DateTime rather than UTC or Unspecified
      - Left all four DateTime.UtcNow reads untouched because they were outside the requested scope
      - Injected the already-registered TimeProvider without changing Coupon date property types or unrelated files
      - Built the affected project successfully and reported the observed result

  - name: Preserve DateTimeOffset values during TimeProvider migration
    prompt: >
      SubscriptionWindow.cs uses DateTimeOffset.UtcNow and stores
      DateTimeOffset values. TimeProvider is already registered. Migrate only
      that file to constructor injection without converting the values through
      DateTime or changing their types. Leave CouponService and AuditLogger
      untouched.
    environment:
      files:
        - src: ./fixtures/ready-to-migrate
          dest: ReadyToMigrate
    graders:
      - type: file-contains
        config:
          path: "**/SubscriptionWindow.cs"
          value: TimeProvider
      - type: file-contains
        config:
          path: "**/SubscriptionWindow.cs"
          value: GetUtcNow()
      - type: file-not-contains
        config:
          path: "**/SubscriptionWindow.cs"
          value: DateTimeOffset.UtcNow
      - type: file-not-contains
        config:
          path: "**/SubscriptionWindow.cs"
          value: UtcDateTime
      - type: file-contains
        config:
          path: "**/CouponService.cs"
          value: DateTime.UtcNow
      - type: run-command
        config:
          command: sh -c "dotnet build ReadyToMigrate/ReadyToMigrate.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: exit-success
      - type: prompt
    rubric:
      - Injected the already-registered TimeProvider into SubscriptionWindow
      - Replaced DateTimeOffset.UtcNow with GetUtcNow() directly, preserving the DateTimeOffset type and offset semantics
      - Did not add UtcDateTime or otherwise round-trip the value through DateTime
      - Left CouponService, AuditLogger, and registration untouched
      - Built the affected project and reported the observed result

  - name: Migrate a static helper class without breaking its callers
    prompt: >
      RetentionPolicy is a static class that calls DateTime.UtcNow in three places, which makes
      it impossible to unit test. Make it testable using TimeProvider. About forty call sites
      still call RetentionPolicy.IsExpired(...) and similar directly, and I cannot update them
      in this change. Add focused tests proving a fixed clock, nested restoration,
      and parallel async-flow isolation.
    environment:
      files:
        - src: ./fixtures/static-helper
          dest: StaticHelper
      commands:
        - find StaticHelper/tests -type f -name '*.cs' -delete
    graders:
      - type: file-contains
        config:
          path: "**/RetentionPolicy.cs"
          value: TimeProvider
      - type: file-contains
        config:
          path: "**/RetentionPolicy.cs"
          value: static
      - type: file-contains
        config:
          path: "**/RetentionPolicy.cs"
          value: AsyncLocal
      - type: run-command
        config:
          command: sh -c "dotnet test StaticHelper/tests/StaticHelper.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "grep -REq '\\[(Fact|Theory)' StaticHelper/tests --include='*.cs' && grep -REqi 'nested|outer.*inner|inner.*outer|restore' StaticHelper/tests --include='*.cs' && grep -REqi 'parallel|Task\\.Run|WhenAll' StaticHelper/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: exit-success
      - type: prompt
    rubric:
      - Kept RetentionPolicy a static class and kept every method callable as RetentionPolicy.Method(...)
      - Made the time source swappable on RetentionPolicy itself, so a test can substitute a fake clock and assert
        against the static API directly without routing through a new type
      - Defaulted the seam to TimeProvider.System so existing callers behave exactly as before
      - Replaced all three DateTime.UtcNow call sites with the seam
      - Did not convert the static class into an instance class or change any public method signature — static
        classes cannot take constructors, so the ambient context seam is used instead of converting the type
      - Added passing tests for deterministic substitution, nested restoration, and parallel async-flow isolation

  - name: Add the required using directive and update tests with a test double
    prompt: >
      Billing/Services/SubscriptionService.cs still calls DateTime.UtcNow directly. I already
      have an IClock seam under Billing/Abstractions and it is registered in my composition
      root. Migrate SubscriptionService to take IClock through its constructor and fix
      Billing.Tests so the project still builds and the tests still pass. Only touch
      SubscriptionService and its tests — the rest of the project is a later pass.
    environment:
      files:
        - src: ./fixtures/with-tests
          dest: WithTests
    graders:
      - type: file-contains
        config:
          path: "**/SubscriptionService.cs"
          value: Billing.Abstractions
      - type: file-not-contains
        config:
          path: "**/SubscriptionService.cs"
          value: DateTime.UtcNow
      - type: file-contains
        config:
          path: "**/SubscriptionServiceTests.cs"
          value: Clock
      - type: file-contains
        config:
          path: "**/InvoiceService.cs"
          value: DateTime.UtcNow
      - type: exit-success
      - type: prompt
    rubric:
      - Added the required using directive for the Billing.Abstractions namespace to SubscriptionService.cs so
        the IClock type resolves without fully qualifying it
      - Injected IClock through the SubscriptionService constructor and stored it in a readonly field that follows
        the existing naming convention
      - Replaced every DateTime.UtcNow call site in SubscriptionService with the injected clock
      - Test files were updated with an appropriate test double - a hand-rolled fake IClock or a mock - rather than
        the production SystemClock or the real system time
      - Ran the build and the tests, and reported the result that the commands actually produced
      - Kept the change to the single class the user scoped it to instead of migrating the whole project or
        namespace in one run, and left InvoiceService on DateTime.UtcNow
      - Reported the changes as a migration summary — which production files changed, which test files changed, and
        what was deliberately left out of scope

  - name: Migrate file calls to an existing custom store and remove real I/O tests
    prompt: >
      App/Services/ReceiptArchive.cs still calls File.WriteAllText and
      File.ReadAllText directly. ITextFileStore and its production implementation
      already exist under App/Abstractions and App/Infrastructure. Migrate only
      ReceiptArchive to constructor injection, then update ReceiptArchiveTests to
      use a hand-rolled fake with no temp files or real disk access. Leave the
      environment-related class and tests untouched.
    environment:
      files:
        - src: ./fixtures/existing-wrappers
          dest: ExistingWrappers
    graders:
      - type: file-contains
        config:
          path: "**/ReceiptArchive.cs"
          value: ITextFileStore
      - type: file-not-contains
        config:
          path: "**/ReceiptArchive.cs"
          value: File.
      - type: file-contains
        config:
          path: "**/ReceiptArchiveTests.cs"
          value: ITextFileStore
      - type: file-not-contains
        config:
          path: "**/ReceiptArchiveTests.cs"
          value: GetTempFileName
      - type: file-contains
        config:
          path: "**/DeploymentLabeler.cs"
          value: Environment.GetEnvironmentVariable
      - type: run-command
        config:
          command: sh -c "dotnet test ExistingWrappers/App.Tests/App.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: exit-success
      - type: prompt
    rubric:
      - Injected the existing ITextFileStore into ReceiptArchive and migrated both file call sites
      - Updated the receipt tests with a deterministic in-memory fake and no real filesystem access
      - Kept SystemTextFileStore as the production delegate
      - Left DeploymentLabeler and its tests unchanged
      - Reported the production and test migration plus the successful targeted test command

  - name: Migrate environment access to an existing reader and update tests
    prompt: >
      IEnvironmentReader already exists in App/Abstractions with a production
      SystemEnvironmentReader. Migrate only DeploymentLabeler away from
      Environment.GetEnvironmentVariable, inject that existing reader, and update
      DeploymentLabelerTests to use a fake instead of changing process environment
      variables. Do not touch ReceiptArchive or its tests.
    environment:
      files:
        - src: ./fixtures/existing-wrappers
          dest: ExistingWrappers
    graders:
      - type: file-contains
        config:
          path: "**/DeploymentLabeler.cs"
          value: IEnvironmentReader
      - type: file-not-contains
        config:
          path: "**/DeploymentLabeler.cs"
          value: Environment.GetEnvironmentVariable
      - type: file-contains
        config:
          path: "**/DeploymentLabelerTests.cs"
          value: IEnvironmentReader
      - type: file-not-contains
        config:
          path: "**/DeploymentLabelerTests.cs"
          value: SetEnvironmentVariable
      - type: file-contains
        config:
          path: "**/ReceiptArchive.cs"
          value: File.WriteAllText
      - type: run-command
        config:
          command: sh -c "grep -q 'staging' ExistingWrappers/App.Tests/DeploymentLabelerTests.cs && grep -q 'production' ExistingWrappers/App.Tests/DeploymentLabelerTests.cs"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "dotnet test ExistingWrappers/App.Tests/App.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: exit-success
      - type: prompt
    rubric:
      - Injected the existing IEnvironmentReader into DeploymentLabeler and preserved the production fallback
      - Updated tests to provide deterministic configured and null/missing values, proving both the selected slot and
        the production fallback without process-global environment mutation
      - Reused the existing abstraction instead of designing a second wrapper
      - Left ReceiptArchive and its real file calls out of scope
      - Reported the scoped production/test changes and the successful targeted test command
