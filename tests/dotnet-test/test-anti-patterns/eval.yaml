name: test-anti-patterns
executionShard: c
description: Evaluates the dotnet-test/test-anti-patterns skill
type: capability
defaults:
  timeout: 5m
stimuli:
  - name: Detect mixed severity anti-patterns in repository service tests
    prompt: |
      We just had a prod incident traced back to tests that were passing but
      not actually verifying anything. Audit the test class in
      `UserRepo.Tests/UserRepositoryTests.cs` for .NET test anti-patterns
      (use the production code at `UserRepo/UserRepository.cs` for context).
      I want to know which tests look like they pass but wouldn't actually
      catch a regression.

      Give me a severity-ranked list (Critical / Warning / Info) with each
      finding named (e.g. "swallowed exception", "self-comparing assertion")
      and a concrete code-level fix for each. Do not edit the files — this
      is a read-only review.
    tags:
      capability: severity-rank-anti-patterns
      risk: high
      journey: audit-passing-tests-after-incident
    environment:
      files:
        - src: ./fixtures/mixed-severity/UserRepo.Tests/UserRepo.Tests.csproj
          dest: UserRepo.Tests/UserRepo.Tests.csproj
        - src: ./fixtures/mixed-severity/UserRepo.Tests/UserRepositoryTests.cs
          dest: UserRepo.Tests/UserRepositoryTests.cs
        - src: ./fixtures/mixed-severity/UserRepo/UserRepository.cs
          dest: UserRepo/UserRepository.cs
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "anti-patterns-mixed-severity"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Read-only audit of UserRepo.Tests/UserRepositoryTests.cs. Severity-ranked findings, each tied to a test method with a concrete fix.

              CRITICAL
              1. GetUser_NonExistentId_ReturnsNull — no assertion. It fetches the result but never verifies it, so it does not verify anything and cannot catch a regression. Fix: Assert.IsNull(result).
              2. AddUser_DuplicateId — swallowed exception. It wraps the duplicate add in try/catch and returns without asserting; it also silently passes when no exception is thrown. Fix: Assert.ThrowsException<InvalidOperationException>(() => repo.Add(dup)).
              3. DeleteUser_RemovesUser — self-comparing assertion. It asserts repo.Count equals repo.Count (compares Count to itself), which always passes regardless of whether the delete worked. Fix: assert the count dropped by one and that GetUser returns null for the deleted id.

              WARNING
              4. UpdateUser_ChangesName — negative assertion. It only checks the name is not equal to the old value instead of asserting the expected new value. Fix: Assert.AreEqual("NewName", updated.Name).
              5. AddUser_NullUser — broad Assert.ThrowsException<Exception> instead of the specific ArgumentNullException, so an unrelated failure would still pass. Fix: assert the specific ArgumentNullException.

              INFO
              6. The static HttpClient field is never disposed and appears unused; remove it or manage its lifetime.

              Summary: 3 Critical, 2 Warning, 1 Info. Fix the Critical assertion-free and swallowed-exception tests first. I did not edit any files.
    graders:
      - type: output-matches
        config:
          pattern: (no assertion|missing assertion|never assert|does.?n.?t assert|no.*verif)
      - type: output-matches
        config:
          pattern: (swallow|catch.*return|exception.*silent|pass.*without)
      - type: output-matches
        config:
          pattern: (Assert\.AreEqual.*itself|self.compar|always.pass|compare.*to itself)
      - type: output-matches
        config:
          pattern: (Assert\.ThrowsException.*<Exception>|broad.*exception|specific.*exception)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified that GetUser_NonExistentId_ReturnsNull has no assertion — it checks nothing about the null result
      - Identified that AddUser_DuplicateId catches the exception and returns without ever asserting, and also silently
        passes when NO exception is thrown
      - Identified that DeleteUser compares repo.Count to itself (always passes regardless of whether the delete worked)
      - Identified that UpdateUser uses a negative assertion (not equal to old value) instead of asserting the expected
        new value
      - Identified that AddUser_NullUser uses broad Assert.ThrowsException<Exception> instead of the specific
        ArgumentNullException
      - Identified that the static HttpClient field is never disposed and appears unused
      - Provided concrete fixes for the critical and high severity findings
      - Every finding names a specific location — the test method it applies to — rather than issuing a general
        warning about the suite
      - The severity summary counts match the findings actually enumerated in the report; nothing is counted that
        is not listed, and nothing listed is left out of the counts
      - Recommendations are prioritized by severity, telling the user which findings to fix first
    constraints:
      reject_tools:
        - bash
        - edit
        - create

  - name: Detect flakiness indicators and test coupling
    prompt: |
      I have a test suite that sometimes passes and sometimes fails depending
      on execution order. Audit `FlakyCoupled.Tests/OrderServiceTests.cs` for
      .NET test anti-patterns. Help me figure out why it's order-dependent
      and what else about these tests is fragile, non-deterministic, or
      coupled to implementation details.

      Give me a severity-ranked list (Critical / Warning / Info) with each
      finding named (e.g. "shared static state", "Thread.Sleep flakiness",
      "reflection coupling") and a concrete code-level fix for each. Do not
      edit the files — this is a read-only review.
    tags:
      capability: detect-flakiness-and-coupling
      risk: high
      journey: stabilize-order-dependent-suite
    environment:
      files:
        - src: ./fixtures/flaky-coupled/FlakyCoupled.Tests.csproj
          dest: FlakyCoupled.Tests/FlakyCoupled.Tests.csproj
        - src: ./fixtures/flaky-coupled/OrderServiceTests.cs
          dest: FlakyCoupled.Tests/OrderServiceTests.cs
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "anti-patterns-flaky-coupled"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Read-only audit of FlakyCoupled.Tests/OrderServiceTests.cs. Severity-ranked findings with fixes.

              CRITICAL
              1. Shared static state / ordering dependency — the suite keeps a static shared _processedOrders collection that is never cleared between tests, so Test2 depends on Test1 running first. This is why the suite is order-dependent. Fix: make the state instance-level and reset it in a [TestInitialize] method so each test is isolated.

              WARNING
              2. Thread.Sleep flakiness — ProcessOrder_SetsTimestamp uses Thread.Sleep plus DateTime.Now, which is timing-dependent and flaky under load. Fix: inject a clock (TimeProvider/IClock) and assert against a controlled time instead of sleeping.
              3. Reflection coupling — a test reaches into the private _orders field by reflection, coupling it to an implementation detail. Fix: assert through the public API (e.g. order count or a query method) rather than private internal state.

              INFO
              4. CreateOrder_MultipleItems_Test is too large and mixes several concerns, making failures hard to localize. Split it into focused tests.
              5. Assert.ThrowsException<Exception> is too broad; assert the specific exception type.

              Summary: 1 Critical, 2 Warning, 2 Info. Fix the shared static state first — it is the root of the order dependency. I did not edit any files.
    graders:
      - type: output-matches
        config:
          pattern: (static.*shared|shared.*state|_processedOrders|ordering|order.depend)
      - type: output-matches
        config:
          pattern: (Thread\.Sleep|flak|timing|time.depend)
      - type: output-matches
        config:
          pattern: (reflect|private|internal.*state|implementation.*detail|coupling)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified that Test2 depends on Test1 running first due to shared static state
      - Identified that _processedOrders is never cleared between tests, causing ordering dependency
      - Identified Thread.Sleep and DateTime.Now as flakiness risks in ProcessOrder_SetsTimestamp
      - Identified reflection-based access to private _orders field as implementation coupling
      - Recognized that CreateOrder_MultipleItems_Test is too large and tests multiple concerns
      - Flagged the broad exception type in Assert.ThrowsException<Exception>
    constraints:
      reject_tools:
        - bash
        - edit
        - create

  - name: Detect duplicated tests and magic values
    prompt: |
      My tests feel hard to maintain and there's a lot of repetition. Audit
      `DuplicateMagic.Tests/DiscountServiceTests.cs` for .NET test
      anti-patterns — duplicated test methods, magic values, multi-scenario
      tests — and suggest improvements.

      Give me a severity-ranked list with concrete code-level fixes (e.g.,
      data-driven test refactors). Do not edit the files — this is a
      read-only review.
    tags:
      capability: detect-duplication-and-magic-values
      risk: medium
      journey: consolidate-to-data-driven-tests
    environment:
      files:
        - src: ./fixtures/duplicate-magic/DuplicateMagic.Tests.csproj
          dest: DuplicateMagic.Tests/DuplicateMagic.Tests.csproj
        - src: ./fixtures/duplicate-magic/DiscountServiceTests.cs
          dest: DuplicateMagic.Tests/DiscountServiceTests.cs
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "anti-patterns-duplicate-magic"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Read-only audit of DuplicateMagic.Tests/DiscountServiceTests.cs. Severity-ranked findings with fixes.

              WARNING
              1. Duplicated tests — the six ApplyDiscount tests are near-identical copies that differ only by input and expected output, which is repetitive and hard to maintain. Fix: consolidate them into one data-driven test using [DataRow] (or [DynamicData]) so each tier is a parameterized row.
              2. Magic values — the CalculateShipping tests use unexplained hard-coded numbers (42, 7, 3) with no named meaning. Fix: replace them with named constants or DataRow columns that document what each value represents.

              INFO
              3. TestTaxCalculation packs multiple scenarios into a single test, so a failure does not tell you which scenario broke. Fix: split into one test per scenario, or parameterize.

              What the suite does well: the discount tests use specific expected values and cover the tier boundaries clearly — keep that precision when you refactor to data-driven rows.

              Summary: 2 Warning, 1 Info. I did not edit any files.
    graders:
      - type: output-matches
        config:
          pattern: (duplicat|repetit|data.?driven|DataRow|parameteriz)
      - type: output-matches
        config:
          pattern: (magic|unexplained|42|7|hard.?coded|unclear)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified that the six ApplyDiscount tests are duplicates that should be consolidated into data-driven tests
      - Identified magic numbers in CalculateShipping tests (42, 7, 3) that lack explanation
      - Identified that TestTaxCalculation packs multiple scenarios into a single test, making failures hard to diagnose
      - Suggested using DataRow or DynamicData to parameterize the discount tests
      - Called out at least something the tests do correctly (e.g., specific assertions, clear expected values, good
        coverage of tiers)
    constraints:
      reject_tools:
        - bash
        - edit
        - create

  - name: Recognize well-written tests without inventing false positives
    prompt: |
      I'm worried these tests might have problems. Audit
      `Payments.Tests/PaymentProcessorTests.cs` for .NET test anti-patterns
      using the full anti-pattern catalog (missing assertions, swallowed
      exceptions, always-true/self-comparing assertions, flakiness, magic
      values, duplicate tests, broad exception types, etc.) and tell me
      what (if anything) genuinely needs fixing — be careful not to invent
      issues that aren't really there.

      Give me a severity-ranked list (Critical / Warning / Info / "no
      issues found"). Each finding must be tied to a named anti-pattern
      from the catalog and include a concrete code-level fix. Do not edit
      the files — this is a read-only review.
    tags:
      capability: avoid-false-positives
      risk: medium
      journey: confirm-healthy-suite
    environment:
      files:
        - src: ./fixtures/well-written/Payments.Tests/Payments.Tests.csproj
          dest: Payments.Tests/Payments.Tests.csproj
        - src: ./fixtures/well-written/Payments.Tests/PaymentProcessorTests.cs
          dest: Payments.Tests/PaymentProcessorTests.cs
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "anti-patterns-well-written"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Read-only audit of Payments.Tests/PaymentProcessorTests.cs against the full anti-pattern catalog. These tests are well-written and solid: there are no critical or high-severity anti-patterns, and I will not invent problems that are not there.

              No issues found for:
              - Missing assertions — every test carries a specific, meaningful assertion (status and order id, or a typed exception).
              - Swallowed exceptions — the failure cases use Assert.ThrowsException<ArgumentOutOfRangeException>, not try/catch.
              - Always-true or self-comparing assertions — none; each compares the result to an independent expected value.
              - Flakiness — no Thread.Sleep, no wall-clock time, gateway is a fake.
              - Magic values and duplicate tests — the currency cases are already data-driven with [DataRow].
              - Broad exception types — the thrown exceptions are the specific expected types.

              Positive patterns worth keeping: the sealed test class, injected FakeGateway, specific ArgumentOutOfRangeException assertions, data-driven currency cases, and clear Arrange-Act-Assert structure.

              Severity summary: no Critical, no Warning. If I had to nitpick, the only Info-level suggestion is to also assert the DeclineReason text in ProcessPayment_GatewayDeclines, but that is minor. I did not edit any files.
    graders:
      - type: output-matches
        config:
          pattern: (no (major|significant|critical|serious)|well.?written|good (shape|quality|structure)|clean|looks
            good|solid|few issues|minor)
      # Guards against inventing a false positive on a well-written suite. The
      # earlier form was `output-not-contains: "no assertion"`, which is
      # negation-blind: the CORRECT answer ("no assertion problems", "no
      # assertion-free tests") contains that substring and was penalised. It
      # fired on the skilled arm in a trial the judge passed with "avoided
      # false positives" — i.e. it penalised the arm that discusses assertions
      # in more detail. This matches only accusatory phrasing: a possession
      # verb, then "no assertion(s)", not followed by an absolving noun.
      - type: output-not-matches
        config:
          pattern: (?:[Hh]a(?:s|ve|ving)|[Cc]ontain(?:s|ing)?|[Ii]nclude[sd]?|[Ww]ith)\s+no\s+assertions?(?![-\s]*(?:problems?|issues?|concerns?|gaps?|smells?|anti-?patterns?|violations?|failures?|related|free|specific))
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that these tests are generally well-structured and do not have critical or high-severity anti-patterns
      - Did not invent false positives or flag correct practices as problems
      - Acknowledged positive patterns present in the tests (sealed class, specific exception types, data-driven tests,
        clear AAA structure, proper use of fakes)
      - If any suggestions were made, they were minor and correctly categorized as low severity
    constraints:
      reject_tools:
        - bash
        - edit
        - create

  - name: Detect coverage-touching pattern across a service facade
    prompt: |
      We hit 95% code coverage on this service but keep finding bugs in
      production. Audit `CatalogService.Tests/ProductCatalogTests.cs` for
      .NET test anti-patterns (use `CatalogService/ProductCatalog.cs` for
      production context) — pay special attention to coverage-touching
      patterns where every method is called but nothing is verified.

      Give me a severity-ranked list with concrete code-level fixes. Do not
      edit the files — this is a read-only review.
    tags:
      capability: detect-coverage-touching
      risk: high
      journey: verify-coverage-quality
    environment:
      files:
        - src: ./fixtures/coverage-touching/CatalogService.Tests/CatalogService.Tests.csproj
          dest: CatalogService.Tests/CatalogService.Tests.csproj
        - src: ./fixtures/coverage-touching/CatalogService.Tests/ProductCatalogTests.cs
          dest: CatalogService.Tests/ProductCatalogTests.cs
        - src: ./fixtures/coverage-touching/CatalogService/ProductCatalog.cs
          dest: CatalogService/ProductCatalog.cs
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "anti-patterns-coverage-touching"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Read-only audit of CatalogService.Tests/ProductCatalogTests.cs. This suite shows a systematic coverage-touching pattern: nearly every method is called but most tests have no assertions, which inflates coverage without verifying behavior.

              CRITICAL
              1. Assertion-free tests — AddProduct_Works, UpdatePrice_Works, RemoveProduct_Works, GetProductCount_Works, ApplyBulkDiscount_Works, and ImportFromCsv_Works each execute the method but assert nothing, so they never verify the result. Fix: add real assertions (see below).
              2. Trivial checks — the few tests that do assert use only Assert.IsNotNull, a shallow check that does not verify actual content or correctness.

              Why this is dangerous: coverage metrics look healthy (95%), but bugs in pricing, search logic, CSV export format, or bulk-discount math would go undetected because nothing about the outputs is checked.

              Concrete fixes:
              - UpdatePrice_Works: assert the product price changed to the new value.
              - RemoveProduct_Works: assert the product is gone (GetById returns null and count dropped).
              - ImportFromCsv_Works / ExportToCsv: assert the parsed count and the exact CSV format of a round-tripped row.
              - ApplyBulkDiscount_Works: assert the discounted prices for representative products.

              Summary: 2 Critical (assertion-free plus trivial IsNotNull-only checks). Add behavioral assertions before trusting the coverage number. I did not edit any files.
    graders:
      - type: output-matches
        config:
          pattern: (no assert|missing assert|never verif|without.*assert|coverage.*touch|coverage.*inflat|surface.area|systematic.*call)
      - type: output-matches
        config:
          pattern: (IsNotNull.*only|trivial|shallow|not.*verif|not.*check)
      - type: exit-success
      - type: prompt
    rubric:
      - "Identified the systematic pattern: nearly every method is called but most tests have no assertions or only
        Assert.IsNotNull — this inflates coverage without verifying behavior"
      - Called out specific assertion-free tests (AddProduct_Works, UpdatePrice_Works, RemoveProduct_Works,
        GetProductCount_Works, ApplyBulkDiscount_Works, ImportFromCsv_Works) that execute code but prove nothing
      - Identified that the few tests with assertions only use trivial IsNotNull checks that don't verify actual content
        or correctness
      - "Explained why this pattern is dangerous: coverage metrics look healthy but bugs in pricing, search logic, CSV
        export format, or bulk discount calculations would go undetected"
      - Suggested concrete assertions for at least some of the methods (e.g., verify price changed after UpdatePrice,
        verify product is gone after RemoveProduct, verify CSV format in ExportToCsv)
    constraints:
      reject_tools:
        - bash
        - edit
        - create

  - name: Detect self-referential assertions in round-trip and identity tests
    prompt: |
      I inherited this test suite from another team. Tests pass and coverage
      looks decent but I don't trust them. Audit
      `Serialization.Tests/SerializerTests.cs` for .NET test anti-patterns —
      pay special attention to self-referential / tautological assertions
      where the test asserts `output == input` for an operation that should
      transform something. Use the production code under `Serialization/`
      for context.

      Give me a severity-ranked list with concrete code-level fixes. Do not
      edit the files — this is a read-only review.
    tags:
      capability: detect-self-referential-assertions
      risk: high
      journey: audit-round-trip-tests
    environment:
      files:
        - src: ./fixtures/self-referential/Serialization.Tests/Serialization.Tests.csproj
          dest: Serialization.Tests/Serialization.Tests.csproj
        - src: ./fixtures/self-referential/Serialization.Tests/SerializerTests.cs
          dest: Serialization.Tests/SerializerTests.cs
        - src: ./fixtures/self-referential/Serialization/Serialization.cs
          dest: Serialization/Serialization.cs
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "anti-patterns-self-referential"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Read-only audit of Serialization.Tests/SerializerTests.cs, focused on self-referential / tautological assertions where a test asserts output equals input for an operation that should transform something.

              CRITICAL (self-referential, prove nothing)
              1. NormalizeName_AlreadyNormalized_NoChange — asserts the normalizer output equals already-normalized input, so it only proves the method is a no-op on that input, not that it normalizes anything. Fix: feed messy input (extra spaces, mixed case) and assert the normalized form.
              2. GetDisplayName_ReturnsFormattedName — asserts the display name equals the raw Name property; either the method is trivial or the test is not verifying the actual formatting. Fix: assert the concrete formatted string.
              3. Validate_ValidInput_ReturnsSameInput — asserting valid input passes through unchanged does not exercise the validation logic. Fix: assert rejection of invalid input and the specific validation result.
              4. UpperCase_ToUpper_Works — calls ToUpper on an already-uppercase string and compares to the input, a self-fulfilling assertion. Fix: pass lowercase input and assert the uppercased result.

              CONTEXT (not automatically wrong)
              - Serialize_ThenDeserialize, ToString_ParseBack, and MapToDto_MapBack are round-trip tests: valid IF paired with non-trivial inputs that exercise edge cases; add those.
              - Clone_ProducesEqualObject is a legitimate deep-copy equality check, not self-referential — keep it.

              Summary: 4 Critical self-referential tests, plus round-trip tests to strengthen. I did not edit any files.
    graders:
      - type: output-matches
        config:
          pattern: (self.referent|tautolog|identity|round.?trip.*only|input.*equals.*output|circular|proves
            nothing|assert.*same)
      - type: output-matches
        config:
          pattern: (NormalizeName|GetDisplayName|Validate.*ValidInput|UpperCase.*ToUpper)
      - type: exit-success
      - type: prompt
    rubric:
      - "Identified the self-referential pattern: multiple tests assert that output equals input, which is tautological
        when the operation is identity or the input is already in the expected form"
      - Flagged NormalizeName_AlreadyNormalized_NoChange as a self-referential test — it only proves the normalizer is a
        no-op on already-normalized input, not that it actually normalizes anything
      - Flagged GetDisplayName_ReturnsFormattedName — it asserts the display name equals the raw Name property, which
        either means the method is trivial or the test isn't verifying the actual formatting
      - Flagged Validate_ValidInput_ReturnsSameInput — asserting that valid input passes through unchanged doesn't test
        the validation logic itself
      - Flagged UpperCase_ToUpper_Works — calling ToUpper on an already-uppercase string and comparing to the input is a
        self-fulfilling assertion
      - Distinguished the round-trip tests (Serialize_ThenDeserialize, ToString_ParseBack, MapToDto_MapBack) as
        potentially valid IF accompanied by tests using non-trivial inputs that exercise edge cases
      - Noted that Clone_ProducesEqualObject is a legitimate equality check (testing deep copy), not self-referential
    constraints:
      reject_tools:
        - bash
        - edit
        - create

  - name: Audit a pytest suite using Python-specific anti-pattern markers
    prompt: >
      Review the tests in this Python project and tell me what's wrong with them. Rank what you
      find by how badly it hurts us.
    tags:
      capability: audit-pytest-anti-patterns
      risk: high
      journey: audit-python-test-suite
    environment:
      files:
        - src: fixtures/pytest-mixed/pyproject.toml
          dest: pyproject.toml
        - src: fixtures/pytest-mixed/src/user_service.py
          dest: src/user_service.py
        - src: fixtures/pytest-mixed/tests/test_user_service.py
          dest: tests/test_user_service.py
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "anti-patterns-pytest-mixed"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Read-only audit of tests/test_user_service.py (pytest). Severity-ranked, using pytest idioms. Note up front: Python's bare `assert` is canonical in pytest, so I am NOT flagging bare asserts as a missing assertion library.

              Critical
              1. test_add_user_runs_without_error — has no assertion at all; it calls add_user and only checks it does not raise, so it is assertion-free and passes without verifying anything. Fix: assert the returned user id and that get_user returns the new record.
              2. test_get_missing_swallows_exception — wraps the call in try/except and pass, so it swallows the exception and passes either way. Fix: use `with pytest.raises(KeyError):` and assert the specific type.
              3. test_delete_compares_count_to_itself — asserts count() == count(), a tautological self-comparison that always holds. Fix: capture count before delete and assert it decreased by one.

              High
              4. Flakiness — the service uses a wall-clock time.sleep and an un-injected datetime.datetime.now(), making timing tests flaky. Fix: inject a clock and remove the sleep.
              5. Shared module-level state — _SHARED_SERVICE is created once at module scope, so test_ordering_first and test_ordering_second are order-dependent. Fix: use a function-scoped fixture that builds a fresh service per test.

              Medium
              6. The four near-identical test_repeated_value_assertion_* tests are duplicates; parametrize them with @pytest.mark.parametrize.
              7. pytest.raises(Exception) is too broad; assert the specific exception type.

              Good
              - test_get_user_returns_correct_name is a well-written test — keep it as the model.

              Severity summary: 3 Critical, 2 High, 2 Medium. I did not edit any files.
    graders:
      - type: output-matches
        config:
          pattern: (Critical|High|Medium|Low|severity)
      - type: output-matches
        config:
          pattern: (test_add_user_runs_without_error|no assertion|assertion-free|without.*assert)
      - type: output-matches
        config:
          pattern: (sleep|time\.sleep|flak)
      - type: prompt
    rubric:
      - Flagged test_add_user_runs_without_error as having no assertion at all
      - Flagged test_get_missing_swallows_exception for swallowing the exception so the test passes either way
      - Flagged test_delete_compares_count_to_itself as a tautological self-comparison
      - Flagged the wall-clock time.sleep and the un-injected datetime.datetime.now as flakiness sources
      - Flagged the shared _SHARED_SERVICE module-level state that makes the two ordering tests order-dependent
      - Flagged the four near-identical test_repeated_value_assertion_* tests as duplicates that should be
        parametrized with @pytest.mark.parametrize
      - Flagged pytest.raises(Exception) as too broad and recommended the specific exception type
      - Did NOT flag Python's bare assert statements as a missing assertion library — bare assert is canonical in
        pytest
      - Acknowledged test_get_user_returns_correct_name as a well-written test
      - Used pytest terminology and Python APIs throughout rather than describing the suite in MSTest terms

  - name: Separate false-confidence assertions from cosmetic ones
    prompt: My CalculatorTests suite is green, but I don't trust it. What's actually wrong, and what should I fix first?
    tags:
      capability: separate-false-confidence-from-cosmetic
      risk: high
      journey: prioritize-untrusted-green-suite
    environment:
      files:
        - src: fixtures/assertion-problems/Calculator.cs
          dest: Calculator.cs
        - src: fixtures/assertion-problems/CalculatorTests.cs
          dest: CalculatorTests.cs
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "anti-patterns-assertion-problems"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Read-only audit of CalculatorTests.cs. The suite is green because several tests can never fail. Severity-ranked, false-confidence problems first.

              Critical (false confidence — these tests can never fail)
              1. Add_TwoNumbers_ReturnsSum — has no assertion, only a TODO comment; it computes the result and never checks it. Fix: Assert.AreEqual(5, calculator.Add(2, 3)).
              2. Subtract_TwoNumbers_ReturnsDifference — uses Assert.IsTrue(true), an always-true assertion that ignores the result entirely. Fix: Assert.AreEqual(1, calculator.Subtract(3, 2)).
              3. Divide_TwoNumbers_ReturnsQuotient — uses Assert.AreEqual(result, result), a self-comparison that proves nothing. Fix: Assert.AreEqual(2, calculator.Divide(6, 3)).
              4. Divide_ByZero_ThrowsException — swallows the exception in a try/catch and passes even when nothing is thrown. Fix: Assert.ThrowsException<DivideByZeroException>(() => calculator.Divide(1, 0)).

              Low (cosmetic — clearly separate from the above)
              5. Add_Negative_Works has a real assertion but a vague message "Expected and actual are not equal"; this is a Low-severity readability nit, not a correctness problem.

              Fix order: repair the four Critical tests that can never fail first, then improve the assertion message. I did not edit any files.
    graders:
