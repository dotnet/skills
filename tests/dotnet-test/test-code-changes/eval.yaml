          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: node .grading/check-workspace.js retained --dir tests --original .grading/original/tests --names Parse_Seconds_ReturnsSeconds,Parse_Minutes_ReturnsMinutes,Parse_Hours_ReturnsHours,Parse_SurroundingWhitespace_IsIgnored,Parse_UnknownUnit_Throws,Parse_Empty_Throws,TryParse_Text_ReturnsFalse,Parse_EveryMinutes_SetsInterval,Parse_RuleKeyword_IgnoresCase,Parse_UnknownRule_Throws,NextAfter_AddsInterval
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: node .grading/check-workspace.js no-scratch --projects src/Timing/Timing.csproj,src/Reminders/Reminders.csproj,tests/Timing.Tests/Timing.Tests.csproj,tests/Reminders.Tests/Reminders.Tests.csproj
          expected_exit_code: 0
          timeout: 1m
      - type: tool-calls
        config:
          required:
            - name: '^(bash|powershell|shell|execute|run_shell_command|local_shell)$'
              args:
                command: '(?i)(?:^|[\n;&|(]\s*)(?:\w+=\S*\s+)*dotnet\s+(?:test|vstest)\b(?![^\n;&|]*(?:--(?:filter|treenode-filter|list-tests|help)\b|\s[-/]{1,2}(?:testcasefilter|tests)\s*[:=]|\s[-/]{1,2}listtests\b|\s-h\b|\s\/\?))'
      - type: prompt
    rubric:
      - Parse and TryParse add every unit of a combined duration, and the reminder rule "every 1h30m" yields a 90-minute interval, while single-unit inputs, unknown rules and invalid durations behave as before
      - Regression tests fail against the original code for both the parser and the reminder rule, and cases show that single-unit input is unchanged
