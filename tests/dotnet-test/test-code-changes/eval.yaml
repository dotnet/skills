          dest: .grading/original/tests
    golden_patch:
      path: references/duration-parser.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: test-code-changes-duration-parser
        agent: { name: reference, version: "1.0.0", model_name: curated }
        notes: Curated expected steps; golden_patch and run-command graders replay the edit and verification.
        steps:
          - step_id: 1
            source: agent
            message: Run both test projects that reference the changed Timing and Reminders projects after the last edit.
            tool_calls:
              - tool_call_id: final-run
                function_name: bash
                arguments: { command: dotnet test Scheduling.slnx }
            observation:
              results:
                - source_call_id: final-run
                  content: |-
                    Passed!  - Failed:     0, Passed:     6, Skipped:     0, Total:     6 - Reminders.Tests.dll (net10.0)
                    Passed!  - Failed:     0, Passed:    11, Skipped:     0, Total:    11 - Timing.Tests.dll (net10.0)
          - step_id: 2
            source: agent
            message: |-
              Two defects caused this. `DurationParser.TryParse`, which `Parse` calls, matched only the first number and unit; it now adds optional hour, minute and second parts across the whole input. `ReminderSchedule.Parse` captured only `\d+[hms]` after `every`; it now passes the whole interval token to the parser.

              Regression tests:
              - `DurationParserTests.Parse_CombinedUnits_AddsEveryUnit` for "1h30m", "2h5s" and "1h30m15s", plus `TryParse_CombinedUnits_AddsEveryUnit`
              - `ReminderScheduleTests.Parse_CombinedUnits_SetsWholeInterval` for "every 1h30m" and "every 2h5s"
              - The single-unit, unknown-rule and invalid-input tests are unchanged and still pass

              Final run: `dotnet test Scheduling.slnx` -> Reminders.Tests Passed: 6, Timing.Tests Passed: 11, Failed: 0, Skipped: 0
    graders:
      - type: file-not-exists
        config:
          path: "**/research.md"
      - type: file-not-exists
        config:
          path: "**/plan.md"
      - type: tool-calls
