    tags:
      capability: create-the-first-test-project
      risk: cli-side-effects-unverified
      journey: add-a-dry-run-option
    environment:
      files:
        - src: fixtures/rename-console
          dest: .
    grading_environment:
      files:
        - src: graders/check-b.py
          dest: .tcc-grade/check.py
        - src: fixtures/rename-console/src
          dest: .grading/original/src
        - src: fixtures/rename-console/ReceiptRenamer.slnx
          dest: .grading/original/ReceiptRenamer.slnx
    golden_patch:
      path: references/p3-rename-dry-run.patch
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: test-code-changes-receipt-dry-run
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I'll verify the new project from the solution.
            tool_calls:
              - tool_call_id: tests
                function_name: bash
                arguments: { command: dotnet test ReceiptRenamer.slnx }
            observation:
              results:
                - source_call_id: tests
                  content: "Passed: 2, Failed: 0, Skipped: 0"
          - step_id: 2
            source: agent
            message: |
              `--dry-run` prints the planned rename and skips the file move.
              The new `ReceiptRenamer.Tests` project is in the solution; `RenameCommandTests.cs`
              covers preview mode and regular mode. No previous expectations changed.
              Final run: `dotnet test ReceiptRenamer.slnx` — 2 passed, 0 failed, 0 skipped.
    graders:
      - type: run-command
        config:
          command: python3 .tcc-grade/check.py registered ReceiptRenamer.slnx .grading/original/ReceiptRenamer.slnx
          timeout: 10m
      - type: run-command
        config:
          command: dotnet test ReceiptRenamer.slnx
          stdout_matches: '(?i)\b(?:passed|succeeded):\s*[1-9]\d*\b'
          timeout: 5m
      - type: prompt
    rubric:
      - With the flag the command prints the planned rename without moving the file; without the flag it still performs the rename.
      - The new solution-registered test project proves the flag's output and lack of filesystem changes, as well as a normal rename.
      - The transcript shows a completed test run after the last edit, covering the whole new test project, and the final reply names the project and reports the result.

  - name: Collapse repeated dashes in catalog slugs
    prompt: |
      Product URLs in the catalog look sloppy: the category "Tools & Hardware"
      comes out as `/products/tools---hardware/...`. Make slug generation
      collapse any run of dashes into a single dash. Leading and trailing dashes
      should still be trimmed.
    tags:
      capability: whole-project-run-after-shared-helper-change
      risk: sibling-test-broken-by-narrow-final-run
      journey: change-shared-helper
    environment:
      files:
        - src: fixtures/catalog-slugs
          dest: .
      commands:
        - dotnet restore Catalog.slnx --nologo
    grading_environment:
      files:
        - src: graders/catalog-slugs
          dest: .grading/checks
        - src: fixtures/catalog-slugs/src
          dest: .grading/original/src
        - src: fixtures/catalog-slugs/tests
          dest: .grading/original/tests
    golden_patch:
      path: references/catalog-slugs.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: test-code-changes-catalog-slugs
        agent: { name: reference, version: "1.0.0", model_name: curated }
        notes: Curated expected steps; golden_patch and run-command graders replay the edit and verification.
        steps:
          - step_id: 1
            source: agent
            message: Run the whole Catalog.Tests project after the last edit.
            tool_calls:
              - tool_call_id: final-run
                function_name: bash
                arguments: { command: dotnet test tests/Catalog.Tests/Catalog.Tests.csproj }
            observation:
              results:
                - source_call_id: final-run
                  content: "Passed!  - Failed:     0, Passed:    11, Skipped:     0, Total:    11"
          - step_id: 2
            source: agent
            message: |-
              `SlugHelper.ToSlug` now appends a dash only when the previous character is not already one, so "Tools & Hardware" becomes `tools-hardware`; leading and trailing dashes are still trimmed.

              Tests:
              - New `SlugHelperTests`: runs of separators collapse, outer dashes are trimmed, a single separator is unchanged, symbol-only text is empty
              - Intended behavior change: `ProductUrlBuilderTests.For_CategoryWithSymbols_ReplacesEachSymbol` expected `tools---hardware`; it is now `For_CategoryWithSymbols_UsesSingleDash` expecting `tools-hardware`

              Final run: `dotnet test tests/Catalog.Tests/Catalog.Tests.csproj` -> Passed: 11, Failed: 0, Skipped: 0
    graders:
      - type: run-command
        config:
          command: dotnet run --project .grading/checks/FixChecks.csproj
          expected_exit_code: 0
          stdout_contains: fix checks passed
          timeout: 5m
      - type: run-command
        config:
          command: dotnet test tests/Catalog.Tests/Catalog.Tests.csproj --nologo
          expected_exit_code: 0
          stdout_matches: '(?i)\b(?:passed|succeeded):\s*[1-9]\d*\b'
          timeout: 5m
      - type: run-command
        config:
          command: node .grading/assert-tests-detect-change.js --tests tests/Catalog.Tests/Catalog.Tests.csproj --restore src=.grading/original/src
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: node .grading/check-workspace.js retained --dir tests --original .grading/original/tests --names For_SingleWordNames_UsesLowercaseSegments,For_MultiWordNames_JoinsWordsWithDashes,For_SimpleNames_BuildsTwoSegments,For_PaddedName_TrimsOuterDashes,For_DigitsInName_AreKept
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: node .grading/check-workspace.js no-scratch --projects src/Catalog/Catalog.csproj,tests/Catalog.Tests/Catalog.Tests.csproj
          expected_exit_code: 0
          timeout: 1m
      - type: tool-calls
        config:
          required:
            - name: '^(bash|powershell|shell|execute|run_shell_command|local_shell)$'
              args:
                command: '(?i)(?:^|[\n;&|(]\s*)(?:\w+=\S*\s+)*dotnet\s+(?:test|vstest)\b(?![^\n;&|]*(?:--(?:filter|treenode-filter|list-tests|help)\b|\s[-/]{1,2}(?:testcasefilter|tests)\s*[:=]|\s[-/]{1,2}listtests\b|\s-h\b|\s\/\?))'
      - type: prompt
    rubric:
      - Slugs collapse every run of separators into one dash, so "Tools & Hardware" becomes tools-hardware, while outer dashes are still trimmed and single separators are unchanged
      - The ProductUrlBuilderTests expectation that encoded the triple-dash URL was updated to the new URL rather than deleted or weakened, and the reply tells the user that this existing expectation changed
      - Tests that exercise the collapsing rule directly or through the URL builders fail against the original slug code
      - After the last edit the complete Catalog.Tests project passed, not only the tests written for this change, and the reply reports those counts
      - No scratch project or script was left behind to check slugs

  - name: Switch score rounding to banker's rounding
    prompt: |
      The reporting team wants `ScoreFormatter` to use banker's rounding: a score
      exactly halfway between two whole numbers should round to the even one, so
      2.5 shows as "2 points" and 3.5 as "4 points". Everything else should round
      the way it does today. Please make the switch.
    tags:
      capability: tests-for-intended-behavior-change
      risk: old-expectation-deleted-or-loosened
      journey: change-library-behavior
    environment:
      files:
        - src: fixtures/score-formatter
          dest: .
      commands:
        - dotnet restore Scoring.slnx --nologo
    grading_environment:
      files:
        - src: graders/score-formatter
          dest: .grading/checks
        - src: fixtures/score-formatter/src
          dest: .grading/original/src
        - src: fixtures/score-formatter/tests
          dest: .grading/original/tests
        - src: graders/score-formatter-mutant
          dest: .grading/mutants/half-toward-zero
    golden_patch:
      path: references/score-formatter.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: test-code-changes-score-formatter
        agent: { name: reference, version: "1.0.0", model_name: curated }
        notes: Curated expected steps; golden_patch and run-command graders replay the edit and verification.
        steps:
          - step_id: 1
            source: agent
            message: Run the whole Scoring.Tests project after the last edit.
            tool_calls:
              - tool_call_id: final-run
                function_name: bash
                arguments: { command: dotnet test tests/Scoring.Tests/Scoring.Tests.csproj }
            observation:
              results:
                - source_call_id: final-run
                  content: "Passed!  - Failed:     0, Passed:    11, Skipped:     0, Total:    11"
          - step_id: 2
            source: agent
            message: |-
              `ScoreFormatter.Format` now rounds with `MidpointRounding.ToEven`, so exact halves go to the even whole number; other values round as before.

              Tests:
              - Intended behavior change: `Format_ExactlyHalf_RoundsUp` asserted 2.5 -> "3 points"; it is now `Format_ExactlyHalf_RoundsToEven` with 2.5 -> "2 points", 3.5 -> "4 points", 0.5 -> "0 points" and -2.5 -> "-2 points"
              - New `FormatRange_HalfwayEnds_RoundToEven`
              - The below-half, above-half, singular and range-validation tests are untouched

              Final run: `dotnet test tests/Scoring.Tests/Scoring.Tests.csproj` -> Passed: 11, Failed: 0, Skipped: 0
    graders:
      - type: run-command
        config:
          command: dotnet run --project .grading/checks/FixChecks.csproj
          expected_exit_code: 0
          stdout_contains: fix checks passed
          timeout: 5m
      - type: run-command
        config:
          command: dotnet test tests/Scoring.Tests/Scoring.Tests.csproj --nologo
          expected_exit_code: 0
          stdout_matches: '(?i)\b(?:passed|succeeded):\s*[1-9]\d*\b'
          timeout: 5m
      - type: run-command
        config:
          command: node .grading/assert-tests-detect-change.js --tests tests/Scoring.Tests/Scoring.Tests.csproj --restore src=.grading/original/src
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: node .grading/check-workspace.js retained --dir tests --original .grading/original/tests --names Format_WholeNumber_IsUnchanged,Format_BelowHalf_RoundsDown,Format_AboveHalf_RoundsUp,Format_One_IsSingular,FormatRange_JoinsBothEnds,FormatRange_HighBelowLow_Throws
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: node .grading/check-workspace.js no-scratch --projects src/Scoring/Scoring.csproj,tests/Scoring.Tests/Scoring.Tests.csproj
          expected_exit_code: 0
          timeout: 1m
      # A mutant that rounds every exact half toward zero still gives 2.5 -> 2; only a test that pins an
      # odd midpoint rounding up to even (3.5 -> 4, written any way) kills it.
      - type: run-command
        config:
          command: node .grading/assert-tests-detect-change.js --tests tests/Scoring.Tests/Scoring.Tests.csproj --restore src=.grading/mutants/half-toward-zero
          expected_exit_code: 0
          timeout: 10m
      - type: tool-calls
        config:
          required:
            - name: '^(bash|powershell|shell|execute|run_shell_command|local_shell)$'
              args:
                command: '(?i)(?:^|[\n;&|(]\s*)(?:\w+=\S*\s+)*dotnet\s+(?:test|vstest)\b(?![^\n;&|]*(?:--(?:filter|treenode-filter|list-tests|help)\b|\s[-/]{1,2}(?:testcasefilter|tests)\s*[:=]|\s[-/]{1,2}listtests\b|\s-h\b|\s\/\?))'
      - type: prompt
    rubric:
      - Exact halves round to the even whole number (2.5 gives "2 points", 3.5 gives "4 points") while other values and the singular "1 point" text are unchanged
      - The test that asserted 2.5 rounds up to 3 now asserts the new result instead of being deleted, skipped or weakened, and the reply tells the user that this existing expectation changed
      - The tests cover both requested examples, 2.5 and 3.5, and at least one value whose rounding must stay the same
      - Tests for non-halfway values, the singular text and range validation remain as they were
      - After the last edit the complete Scoring.Tests project ran with no test filter, and the reply reports its real counts

