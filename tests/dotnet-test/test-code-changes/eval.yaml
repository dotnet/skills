      you would change. Don't modify any files.
    tags:
      expect_activation: "false"
      capability: stay-dormant-for-read-only-test-review
      risk: incorrect-skill-activation
      journey: route-test-review-request
    environment:
      files:
        - src: fixtures/invoice-library
          dest: .
    grading_environment:
      files:
        - src: fixtures/invoice-library/src
          dest: .grading/original/src
        - src: fixtures/invoice-library/tests
          dest: .grading/original/tests
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: test-code-changes-review-anti-patterns
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Findings in `TaxTableTests`, most serious first:

              1. `RateFor_UnknownRegion` swallows the exception in an empty catch, so it passes whether or not `RateFor` throws. Use `Assert.Throws<KeyNotFoundException>`.
              2. `Default_IsReady` sleeps for 250 ms and then asserts `Assert.True(true)`, so it can never fail. Delete it or assert a real rate.
              3. `RateFor_KnownRegion` boxes a decimal and asserts it is not null, which is always true. Assert the expected 0.20 instead.
              4. `RateFor_IgnoresCase` compares two production results, so a wrong rate for both casings would still pass. Assert 0.10 for each casing.

              No files were modified.
    graders:
      - type: tool-calls
        config:
          disallowed:
            - '^(edit|create|delete|remove|apply_patch|write)$'
      - type: run-command
        config:
          command: node .grading/check-workspace.js unchanged --original .grading/original/tests --dir tests
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: node .grading/check-workspace.js unchanged --original .grading/original/src --dir src
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: RateFor_UnknownRegion
      - type: output-matches
        config:
          pattern: '(?i)swallow|empty catch|catch(?:es)? (?:block|and ignores)|never fails?|always pass|can(?:not|''t) fail|pass(?:es)? (?:even|whether)'
      - type: prompt
    rubric:
      - Flagged RateFor_UnknownRegion because its empty catch lets it pass whether or not RateFor throws
      - Flagged Default_IsReady for its sleep and its Assert.True(true) that can never fail
      - Flagged RateFor_KnownRegion's not-null check on a decimal as asserting nothing about the rate
      - Left every file unchanged and did not attempt to rewrite the tests, which was out of scope
      - Ranked the tests that can never fail above style issues

