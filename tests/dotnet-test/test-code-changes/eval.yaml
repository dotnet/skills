          stdout_matches: '(?i)\b(?:passed|succeeded):\s*[1-9]\d*\b'
          timeout: 5m
      # The parser change must be proven by either test project; the reminder-rule change by Reminders.Tests.
      - type: run-command
        config:
          command: node .grading/assert-tests-detect-change.js --tests tests/Timing.Tests/Timing.Tests.csproj --tests tests/Reminders.Tests/Reminders.Tests.csproj --restore src/Timing=.grading/original/src/Timing
