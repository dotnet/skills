          stdout_matches: '(?i)\b(?:passed|succeeded):\s*[1-9]\d*\b'
          timeout: 5m
      - type: prompt
    rubric:
      - The whitespace verification passes for the Inventory solution
      - Only whitespace changed in the source files; code, behavior and tests are unchanged
      - Did not add tests or test projects, which were not needed here for a formatting-only change

  - name: Stay dormant for a Python bug fix
    prompt: |
      `count_words("hello  world")` returns 3: runs of spaces are counted as extra
      words. Can you fix it?
    tags:
      expect_activation: "false"
      capability: stay-dormant-for-non-dotnet-bug-fix
      risk: dotnet-tests-added-to-python-project
      journey: fix-python-bug
    environment:
      files:
        - src: fixtures/python-wordstats
          dest: .
    grading_environment:
      files:
        - src: graders/python-wordstats/check_fix.py
          dest: .grading/check_fix.py
        - src: fixtures/python-wordstats
          dest: .grading/original
    golden_patch:
      path: references/python-wordstats.patch
    graders:
      - type: run-command
        config:
          command: python3 .grading/check_fix.py
          expected_exit_code: 0
          stdout_contains: fix checks passed
          timeout: 1m
      - type: run-command
        config:
          command: python3 -m unittest discover -s tests 2>&1
          expected_exit_code: 0
          stdout_matches:
            - 'Ran [1-9]\d* tests?'
            - '(?m)^OK'
          timeout: 2m
      # Only files the agent added count: staged skills (for example a skill's .cs script) are skipped.
      - type: run-command
        config:
          command: node .grading/check-workspace.js added --original .grading/original --ext .cs,.csproj,.sln,.slnx,.fs,.fsproj,.vb,.vbproj
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - count_words treats any run of whitespace as one separator and returns 0 for empty text, with other results unchanged
      - Kept the fix and any tests in Python with the project's unittest suite, and did not attempt to add .NET projects or C# files
      - Reported the unittest result after the change

