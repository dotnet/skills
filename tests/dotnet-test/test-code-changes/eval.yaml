    prompt: |
      Durations with more than one unit are cut short. `DurationParser.Parse("1h30m")`
      returns one hour instead of ninety minutes, and a reminder created with the
      rule `every 1h30m` fires every hour. Fix it and add regression tests.
    tags:
      capability: focused-regression-tests-across-modules
      risk: broad-test-pipeline-on-multi-module-fix
      journey: fix-bug-with-regression-test
    environment:
      files:
