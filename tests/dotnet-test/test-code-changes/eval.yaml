name: test-code-changes
description: Evaluates the dotnet-test/test-code-changes skill
type: capability
# Preference stimuli (first 11) ask for a production behavior change without mentioning tests;
# the duration-parser case is deliberately cued. Dormancy stimuli (last 7) carry
# tags.expect_activation: "false". Graders must accept any file layout the agent picks:
# - .grading/checks is a hidden console project staged after the agent finishes; it proves the
#   production change itself, independent of the agent's tests.
# - assert-tests-detect-change.js rebuilds the agent's test project against the original src/
#   tree; at least one test must fail (or stop compiling), so a fix without a test that proves it,
#   a script-only check, or a test outside the test project does not pass.
# - check-workspace.js proves original tests are still declared and no scratch projects, probe
#   scripts or stray sources are left behind.
# - .tcc-grade/check.py holds the checks for the API, CLI, component, SQL-fake, page and
#   new-project stimuli and for the docs and Dockerfile dormancy cases.
# Whether the last test run after the last edit covered the whole test project is graded from the
# transcript. The library stimuli add a tool-calls grader that requires an unfiltered
# `dotnet test`; in every preference stimulus the rubric judges that the run followed the last edit.
# The budget is above the proposal's ~6m because each preference task restores, edits, and runs
# the test project more than once.
defaults:
  timeout: 8m
  runs: 1
grading_environment:
  files:
    - src: graders/shared/assert-tests-detect-change.js
      dest: .grading/assert-tests-detect-change.js
    - src: graders/shared/check-workspace.js
      dest: .grading/check-workspace.js
stimuli:
  - name: Fix touching stays reported as overlapping
    prompt: |
      Back-to-back stays are being rejected. `DateRange.Overlaps` says a stay from
      March 1 to March 5 overlaps the next guest's stay from March 5 to March 8.
      Our ranges are half-open: the end date is the checkout day and is not
      occupied, so ranges that only touch must not overlap, while ranges that
      share at least one night still must. Please fix it.
    tags:
      capability: regression-test-for-bug-fix
      risk: bug-fix-without-repository-test
      journey: fix-library-bug
    environment:
      files:
        - src: fixtures/stay-calendar
          dest: .
      commands:
        - dotnet restore Stays.slnx --nologo
    grading_environment:
      files:
        - src: graders/stay-calendar
          dest: .grading/checks
        - src: fixtures/stay-calendar/src
          dest: .grading/original/src
        - src: fixtures/stay-calendar/tests
          dest: .grading/original/tests
    golden_patch:
      path: references/stay-calendar.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: test-code-changes-stay-calendar
        agent: { name: reference, version: "1.0.0", model_name: curated }
        notes: Curated expected steps; golden_patch and run-command graders replay the edit and verification.
        steps:
          - step_id: 1
            source: agent
            message: Run the whole Stays.Tests project after the last edit.
            tool_calls:
              - tool_call_id: final-run
                function_name: bash
                arguments: { command: dotnet test tests/Stays.Tests/Stays.Tests.csproj }
            observation:
              results:
                - source_call_id: final-run
                  content: "Passed!  - Failed:     0, Passed:    12, Skipped:     0, Total:    12"
          - step_id: 2
            source: agent
            message: |-
              `DateRange.Overlaps` compared with `<=`, so a stay ending on another stay's check-in day counted as an overlap. It now uses strict comparisons, which matches half-open ranges.

              Tests in tests/Stays.Tests:
              - `DateRangeTests.Overlaps_StayEndingOnNextCheckIn_IsFalse`: March 1-5 vs March 5-8, both orders
              - `DateRangeTests.Overlaps_OneSharedNight_IsTrue`: ranges sharing a night still overlap
              - `BookingCalendarTests.TryBook_BackToBackStay_IsAccepted`

              Existing expectations are unchanged.
              Final run: `dotnet test tests/Stays.Tests/Stays.Tests.csproj` -> Passed: 12, Failed: 0, Skipped: 0
    graders:
      - type: run-command
        config:
          command: dotnet run --project .grading/checks/FixChecks.csproj
          expected_exit_code: 0
          stdout_contains: fix checks passed
          timeout: 5m
      - type: run-command
        config:
          command: dotnet test tests/Stays.Tests/Stays.Tests.csproj --nologo
          expected_exit_code: 0
          stdout_matches: '(?i)\b(?:passed|succeeded):\s*[1-9]\d*\b'
          timeout: 5m
      - type: run-command
        config:
          command: node .grading/assert-tests-detect-change.js --tests tests/Stays.Tests/Stays.Tests.csproj --restore src=.grading/original/src
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: node .grading/check-workspace.js retained --dir tests --original .grading/original/tests --names Constructor_EndNotAfterStart_Throws,Nights_CountsCheckInToCheckOut,Contains_CheckInNight_IsTrue,Contains_CheckOutDay_IsFalse,Overlaps_SharedNights_IsTrue,Overlaps_SeparatedByAGap_IsFalse,TryBook_EmptyCalendar_AcceptsStay,TryBook_ConflictingStay_IsRejected,IsOccupied_NightInsideStay_IsTrue
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: node .grading/check-workspace.js no-scratch --projects src/Stays/Stays.csproj,tests/Stays.Tests/Stays.Tests.csproj
          expected_exit_code: 0
          timeout: 1m
      - type: tool-calls
        config:
          required:
            - name: '^(bash|powershell|shell|execute|run_shell_command|local_shell)$'
              args:
                command: '(?i)(?:^|[\n;&|(]\s*)(?:\w+=\S*\s+)*dotnet\s+(?:test|vstest)\b(?![^\n;&|]*(?:--(?:filter|treenode-filter|list-tests|help)\b|\s[-/]{1,2}(?:testcasefilter|tests)\s*[:=]|\s[-/]{1,2}listtests\b|\s-h\b|\s\/\?))'
      - type: prompt
    rubric:
      - Stays that only touch, one ending on the other's check-in day, no longer overlap in either order, and stays that share at least one night still do
      - The Stays.Tests project gained tests that fail against the original comparison, covering the March 1-5 and March 5-8 example and a pair of stays that share a night
      - Every pre-existing test is still present with its original assertions
      - The fix was checked through the repository's test project rather than throwaway scripts, console apps or manual runs, and no such scratch files remain
      - After the last source or test edit, the complete Stays.Tests project ran with no test filter, and the final reply reports that run's real pass and fail counts

  - name: Toggle the archive flag on a bookmark
    prompt: |
      Add `PATCH /bookmarks/{id}/archive` so a client can toggle whether a bookmark
      is archived. Return the updated bookmark, or a 404 if the ID doesn't exist.
    tags:
      capability: cover-an-api-change
      risk: endpoint-verified-only-by-hand
      journey: add-bookmark-archive-endpoint
    environment:
      files:
        - src: fixtures/bookmark-api
          dest: .
    grading_environment:
      files:
        - src: fixtures/bookmark-api/src
          dest: .grading/original/src
    golden_patch:
      path: references/p2-bookmark-archive.patch
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: test-code-changes-bookmark-archive
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I'll run the bookmark API test project.
            tool_calls:
              - tool_call_id: tests
                function_name: bash
                arguments: { command: dotnet test tests/Bookmarks.Tests }
            observation:
              results:
                - source_call_id: tests
                  content: "Passed: 3, Failed: 0, Skipped: 0"
          - step_id: 2
            source: agent
            message: |
              PATCH now toggles and returns the bookmark; unknown IDs return 404.
              Added the toggle-and-read-back and unknown-ID cases in `BookmarkEndpointsTests.cs`.
              Existing expectations were unchanged.
              Final run: `dotnet test tests/Bookmarks.Tests` — 3 passed, 0 failed, 0 skipped.
    graders:
      - type: run-command
        config:
          command: node .grading/assert-tests-detect-change.js --tests tests/Bookmarks.Tests/Bookmarks.Tests.csproj --restore src=.grading/original/src
          timeout: 10m
      - type: run-command
        config:
          command: dotnet test tests/Bookmarks.Tests
          stdout_matches: '(?i)\b(?:passed|succeeded):\s*[1-9]\d*\b'
          timeout: 5m
      - type: prompt
    rubric:
      - The PATCH endpoint toggles the stored archive flag in both directions, returns the updated bookmark, and responds with 404 for an unknown ID.
      - The existing API test project exercises successful toggling and an unknown ID, with assertions on observable status and bookmark state; a temporary script or manual call does not substitute.
      - The transcript shows the whole API test project finished running after the last edit, and the final reply accurately reports that run.

  - name: Preview the receipt renames without changing files
    prompt: |
