              | truncate at hyphen boundary | tests/test_slugify.py::test_truncates_at_hyphen_boundary |
              | truncate without boundary | tests/test_slugify.py::test_truncates_without_hyphen_boundary |
              | non-positive max_length error | tests/test_slugify.py::test_non_positive_max_length_raises |
