name: code-testing-agent
description: Evaluates the dotnet-test/code-testing-agent skill
type: capability
executionShard: generation
# `defaults:` replaces the deprecated `config:` — vally's loader throws on a
# spec declaring both (eng/eval-quality check 10).
#
# Run 32848008974 measured GPT at 4W/1T/0L: five stimuli could not pass after
# one tie, while repeated runs added reliability data but no gate power. The
# next experiment predeclares an orthogonal TypeScript/Vitest project-wide
# stimulus already present in the fixture set. Six distinct tasks preserve one-
# tie power; one run cuts expensive generation sessions from 10 to 6.
defaults:
  timeout: 60m
  runs: 1
stimuli:
  - name: Generate a project-wide pytest suite across multiple modules
    prompt: |
      Generate a comprehensive pytest suite for the entire project under
      fixtures/python-multimodule/. It has no tests yet and contains:

      - analytics.stats.mean and percentile
      - analytics.window.RateWindow
      - textkit.slug.slugify

      Cover every public behavior across the modules, including empty-input and
      percentile-range errors, percentile ordering and 0/100 boundaries,
      RateWindow constructor validation, empty-window errors, capacity rollover,
      average and peak after rollover, slug separator collapsing/trimming,
      max-length truncation, and invalid max_length. Keep this project-wide:
      tests should live under fixtures/python-multimodule/tests/ and pass with
      pytest from fixtures/python-multimodule/.
    environment:
      files:
        - src: fixtures/python-multimodule
          dest: fixtures/python-multimodule
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/python-multimodule && python3 -m pip install --quiet pytest && python3 -m pytest -q"
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "grep -R -q 'RateWindow' fixtures/python-multimodule/tests && grep -R -q 'percentile' fixtures/python-multimodule/tests && grep -R -q 'slugify' fixtures/python-multimodule/tests"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Generated passing tests under the configured tests directory for all three modules
      - Covered every named validation and boundary behavior, including RateWindow rollover and percentile 0/100 boundaries
      - Asserted concrete averages, peaks, percentiles, and slugs rather than existence-only results
      - Kept the work project-wide but bounded to the three supplied modules
      - Reported the passing command and enough named test evidence to audit the requested behaviors

  - name: Generate project-wide tests for a classic MSTest library
    prompt: |
      Add the missing project-wide unit tests for the classic net472 library
      under fixtures/classic-mstest/. The production project contains
      DiscountService and TieredDiscountPolicy; the existing test project uses
      MSTest 3.5.2, Moq 4.2, NBuilder, FixtureBase<TSut>, packages.config, and
      explicit compile items.

      Preserve that stack and the existing DiscountServiceTests.cs byte-for-byte.
      Create DiscountServiceBoundaryTests.cs and TieredDiscountPolicyTests.cs.
      Cover DiscountService's 0/100 boundaries, invalid percentages, missing
      product, and exact discounted value. Cover TieredDiscountPolicy constructor
      validation, negative subtotal, below-threshold behavior, exact-threshold
      activation, and a concrete discounted value. Do not modernize the project
      or dependencies.
    environment:
      files:
        - src: fixtures/classic-mstest
          dest: fixtures/classic-mstest
      commands:
        - rm -f fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs && cp fixtures/classic-mstest/tests/Discounts.Tests.csproj.pristine fixtures/classic-mstest/tests/Discounts.Tests.csproj && rm fixtures/classic-mstest/tests/Discounts.Tests.csproj.pristine && mkdir -p .eval-baseline && cp fixtures/classic-mstest/tests/DiscountServiceTests.cs .eval-baseline/DiscountServiceTests.cs && cp fixtures/classic-mstest/tests/packages.config .eval-baseline/packages.config
    graders:
      - type: file-exists
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
      - type: file-exists
        config:
          path: fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs
      - type: run-command
        config:
          command: >-
            sh -c 'diff -u .eval-baseline/DiscountServiceTests.cs
            fixtures/classic-mstest/tests/DiscountServiceTests.cs
            && diff -u .eval-baseline/packages.config
            fixtures/classic-mstest/tests/packages.config
            && test $(grep -c "Compile Include=\"DiscountServiceBoundaryTests.cs\""
            fixtures/classic-mstest/tests/Discounts.Tests.csproj) -eq 1
            && test $(grep -c "Compile Include=\"TieredDiscountPolicyTests.cs\""
            fixtures/classic-mstest/tests/Discounts.Tests.csproj) -eq 1
            && for file in
            fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
            fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs;
            do grep -Eq "Assert[[:space:]]*\.[[:space:]]*ThrowsException[[:space:]]*<" "$file"
            && ! grep -Eq "Assert[[:space:]]*\.[[:space:]]*Throws(Exactly)?[[:space:]]*<" "$file"
            || exit 1;
            done'
          expected_exit_code: 0
          timeout: 1m
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
          value: ThrowsExactly
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
          value: Assert.Throws<
      - type: file-contains
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
          value: Assert.ThrowsException<
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs
          value: ThrowsExactly
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs
          value: Assert.Throws<
      - type: file-contains
        config:
          path: fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs
          value: Assert.ThrowsException<
      - type: prompt
    rubric:
      - Added both requested test files and registered each exactly once in the classic project
      - Preserved the existing test file, packages.config, project format, and pinned dependency versions
      - Used Assert.ThrowsException<T> for exception paths, avoiding both Assert.Throws<T> and Assert.ThrowsExactly<T>, which are unavailable in MSTest 3.5.2
      - Covered every named DiscountService and TieredDiscountPolicy boundary with concrete expected values
      - Reported the passing or blocked validation command and named tests for the requested boundaries

  - name: Generate a project-wide Go suite across collaborating packages
    prompt: |
      Generate comprehensive Go tests for the whole module under
      fixtures/go-multipackage/. Cover money.Discount, shipping.Rate, and
      order.Total.

      Use table-driven tests for validation and numeric boundaries. Verify
      discount 0/100 boundaries, invalid subtotal and percent, shipping bracket
      equality (a weight equal to UpToGrams belongs to that bracket), overflow
      behavior, negative weight, and empty brackets. For order.Total, use fakes
      for both interfaces and prove the composition `subtotal - discount +
      shipping` with exact cents. Also cover error propagation from each
      collaborator and verify the second collaborator is not called when the
      first fails. Keep tests inside the corresponding Go packages and make
      `go test ./...` pass from fixtures/go-multipackage/.
    environment:
      files:
        - src: fixtures/go-multipackage
          dest: fixtures/go-multipackage
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/go-multipackage && go test ./..."
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "test -f fixtures/go-multipackage/money/discount_test.go && test -f fixtures/go-multipackage/shipping/rate_test.go && test -f fixtures/go-multipackage/order/total_test.go && grep -q 'UpToGrams' fixtures/go-multipackage/shipping/rate_test.go"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Generated passing tests in all three packages
      - Used table-driven tests for validation and boundary cases
      - Proved the exact order total composition with collaborator fakes and concrete cents
      - Covered each collaborator error and verified short-circuit behavior when discount calculation fails
      - Covered shipping equality and overflow boundaries
      - Reported the passing command and named tests for the requested interactions and boundaries

  # This is predeclared breadth for the experiment after run 32848008974, not a
  # repeated sample of an observed task. It exercises async TypeScript seams,
  # interaction ordering, and a real coverage gate absent from the other tasks.
  - name: Generate a project-wide Vitest suite for an async cart
    prompt: |
      Generate a comprehensive Vitest suite for the entire TypeScript project
      under fixtures/typescript-vitest-cart/. Keep production source unchanged.

      Cover discount constructor validation and the exact difference between
      CompositeDiscountPolicy sum and chain modes; weight bracket equality and
      overflow shipping; Cart's discount -> tax -> shipping ordering with exact
      cents; discount clamping; and async checkout with refreshed prices,
      partial-stock InventoryError details, and collaborator rejection
      propagation. Use deterministic fakes or vi.fn() mocks, no network or real
      filesystem, and make the configured coverage command pass.
    environment:
      files:
        - src: fixtures/typescript-vitest-cart
          dest: fixtures/typescript-vitest-cart
      commands:
        - mkdir -p .eval-baseline && cp -R fixtures/typescript-vitest-cart/src .eval-baseline/typescript-src
    graders:
      - type: run-command
        config:
          command: sh -c "diff -ru .eval-baseline/typescript-src fixtures/typescript-vitest-cart/src && cd fixtures/typescript-vitest-cart && npm ci --silent && npm run test:coverage"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "grep -R -q 'CompositeDiscountPolicy' fixtures/typescript-vitest-cart/tests && grep -R -q 'WeightBasedShippingCalculator' fixtures/typescript-vitest-cart/tests && grep -R -q 'InventoryError' fixtures/typescript-vitest-cart/tests"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Generated a passing Vitest suite that clears the configured line, statement, function, and branch thresholds
      - Preserved every production source file
      - Proved sum versus chain discount results, shipping equality and overflow, and discount/tax/shipping ordering with exact cents
      - Used deterministic async collaborators to cover refreshed prices, partial-stock InventoryError details, and rejection propagation
      - Reported the successful coverage command and named representative tests for each requested interaction

  # The fixture is intentionally committed with a larger project and then
  # stripped down in setup. The agent must test the remaining source without
  # restoring deleted files from git.
  - name: Does not revert a gutted-looking workspace (workspace integrity)
    prompt: |
      I have a Python project under fixtures/python-workspace-integrity/ — the
      metricsd metrics-aggregation daemon. I'd like a comprehensive pytest test
      suite for it. Please scaffold the tests under
      fixtures/python-workspace-integrity/tests/ and write thorough unit tests
      for the module that currently has source code but no tests yet. The
      project is configured with pythonpath = ["."] and testpaths = ["tests"]
      in pyproject.toml, so the generated tests should pass with pytest.
    environment:
      files:
        - src: fixtures/python-workspace-integrity
          dest: fixtures/python-workspace-integrity
      commands:
        - cd fixtures/python-workspace-integrity && git init -q && git -c user.email=eval@example.com -c user.name=eval add -A && git -c user.email=eval@example.com -c user.name=eval commit -qm baseline && rm -rf core io tests_real
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/python-workspace-integrity && python3 -m pip install --quiet pytest && python3 -m pytest -q"
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "test ! -f fixtures/python-workspace-integrity/core/aggregator.py && test ! -f fixtures/python-workspace-integrity/io/reader.py"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "grep -q 'synthetic test target' fixtures/python-workspace-integrity/synthstr/stringy.py"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Generated passing pytest tests for the synthstr module under fixtures/python-workspace-integrity/tests/,
        treating the module on disk as the unit under test
      - Did not use git or file operations to restore or reconstruct deleted source files
      - Accepted the sparse workspace as authoritative instead of treating it as corruption
      - Tests assert concrete behavior of reverse, is_palindrome, word_count, and truncate, including negative-limit
        ValueError and ellipsis truncation
      - Each required synthstr behavior is covered by a concrete assertion, and the final passing command is reported
      - Once every requested behavior is covered, evaluates suite quality by meaningful, nonredundant cases rather than
        rewarding a higher raw test count

  # Keep one cheap focused task so the eval protects scope sizing without
  # letting baseline-equivalent focused work dominate the broad comparison.
  - name: Keep a single-function request proportional
    prompt: |
      fixtures/python-single-function/ has one helper, `slugify` in
      textkit/slugify.py, and no tests yet. Please add unit tests for that one
      function under fixtures/python-single-function/tests/. Nothing else in the
      package needs tests. The suite should pass with pytest from
      fixtures/python-single-function/.
    environment:
      files:
        - src: fixtures/python-single-function
          dest: fixtures/python-single-function
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/python-single-function && python3 -m pip install --quiet pytest && python3 -m pytest -q"
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "find fixtures/python-single-function/tests -type f -name 'test_*.py' -print -quit | grep -q test"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "test -z \"$(find . -type d -name .testagent -print -quit)\""
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Generated passing pytest tests for slugify under fixtures/python-single-function/tests/
      - Covered separator collapsing/trimming, both truncation paths, non-positive max_length, and empty output
      - Asserted concrete expected slugs rather than only checking that a string came back
      - Kept work proportional to one function with no .testagent artifacts, multi-phase ceremony, or unrelated tests
      - Reported the passing command and named the tests covering the key boundaries
