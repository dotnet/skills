name: code-testing-agent
description: Evaluates the dotnet-test/code-testing-agent skill
type: capability
executionShard: generation
# `defaults:` replaces the deprecated `config:` — vally's loader throws on a
# spec declaring both (eng/eval-quality check 10).
#
# Run 31180075357 measured 2W/10T/0L. The two focused tasks never activated and
# added four baseline-equivalent ties. Seven broad tasks below exercise the
# skill's distinctive Research -> Plan -> Implement contract across Python,
# TypeScript, Go, SDK/classic .NET, existing-suite extension, and a sparse
# workspace. Two focused tasks protect proportional routing in different
# ecosystems. Nine independent stimuli improve power without changing runs.
#
# Golden patches contain only stageable deliverables. Broad-scope state under
# the git testagent directory is intentionally non-stageable and is verified by
# the dedicated run-command graders.
defaults:
  timeout: 60m
  runs: 2
stimuli:
  - name: Generate a project-wide pytest suite across multiple modules
    prompt: |
      Generate a comprehensive pytest suite for the entire project under
      fixtures/python-multimodule/. It has no tests yet and contains:

      - analytics.stats.mean and percentile
      - analytics.window.RateWindow
      - textkit.slug.slugify

      Cover every public behavior across the modules, including empty-input and
      percentile-range errors, percentile ordering and 0/100 boundaries,
      RateWindow constructor validation, empty-window errors, capacity rollover,
      average and peak after rollover, slug separator collapsing/trimming,
      max-length truncation, and invalid max_length. Keep this project-wide:
      tests should live under fixtures/python-multimodule/tests/ and pass with
      pytest from fixtures/python-multimodule/.
    tags:
      capability: project-wide-pytest-generation
      risk: shallow-boundary-coverage
      journey: bootstrap-python-test-suite
    golden_patch:
      path: ./references/pytest-multimodule.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "code-testing-agent-pytest-multimodule"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Generated a project-wide pytest suite for the three public modules under fixtures/python-multimodule/ — analytics.stats (mean, percentile), analytics.window.RateWindow, and textkit.slug.slugify. The non-stageable git testagent state directory contains research.md, plan.md, and status.md; tests live under tests/ and assert concrete values (means, percentiles, averages, peaks, slugs), not existence-only.

              | Requirement | Evidence |
              | --- | --- |
              | mean average + empty-input error | tests/test_stats.py::test_mean_returns_average, ::test_mean_empty_raises |
              | percentile empty + range errors | tests/test_stats.py::test_percentile_empty_raises, ::test_percentile_out_of_range_raises |
              | percentile 0/100 boundaries | tests/test_stats.py::test_percentile_zero_and_hundred_boundaries |
              | percentile ordering | tests/test_stats.py::test_percentile_orders_unsorted_input |
              | RateWindow constructor validation | tests/test_window.py::test_constructor_rejects_non_positive_capacity |
              | empty-window errors | tests/test_window.py::test_average_on_empty_window_raises, ::test_peak_on_empty_window_raises |
              | capacity rollover + average/peak | tests/test_window.py::test_capacity_rollover_drops_oldest, ::test_average_and_peak_before_rollover |
              | slug separator collapse/trim | tests/test_slug.py::test_collapses_and_trims_separators |
              | max-length truncation | tests/test_slug.py::test_truncates_and_strips_trailing_hyphen |
              | invalid max_length | tests/test_slug.py::test_invalid_max_length_raises |
    environment:
      files:
        - src: fixtures/python-multimodule
          dest: fixtures/python-multimodule
      commands:
        - git init -q
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/python-multimodule && python3 -m pytest -q"
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "grep -R -q 'RateWindow' fixtures/python-multimodule/tests && grep -R -q 'percentile' fixtures/python-multimodule/tests && grep -R -q 'slugify' fixtures/python-multimodule/tests"
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: run-command
        config:
          command: state_dir="$(git rev-parse --path-format=absolute --git-path testagent)" && test -f "$state_dir/research.md" && test -f "$state_dir/plan.md" && test -f "$state_dir/status.md" && test -z "$(git ls-files --cached --others -- ':(glob)**/research.md' ':(glob)**/plan.md' ':(glob)**/status.md' ':(exclude,glob)**/node_modules/**')"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Generated passing tests under the configured tests directory for all three modules
      - Covered every named validation and boundary behavior, including RateWindow rollover and percentile 0/100 boundaries
      - Asserted concrete averages, peaks, percentiles, and slugs rather than existence-only results
      - Kept the work project-wide but bounded to the three supplied modules
      - Mapped each requested behavior to named test evidence
      - Kept broad-scope intermediate state files non-stageable so only requested deliverables remain commit candidates

  - name: Generate project-wide tests for a classic MSTest library
    prompt: |
      Add the missing project-wide unit tests for the classic net472 library
      under fixtures/classic-mstest/. The production project contains
      DiscountService and TieredDiscountPolicy; the existing test project uses
      MSTest 3.5.2, Moq 4.2, NBuilder, FixtureBase<TSut>, packages.config, and
      explicit compile items.

      Preserve that stack and the existing DiscountServiceTests.cs byte-for-byte.
      Create DiscountServiceBoundaryTests.cs and TieredDiscountPolicyTests.cs.
      Cover DiscountService's 0/100 boundaries, invalid percentages, missing
      product, and exact discounted value. Cover TieredDiscountPolicy constructor
      validation, negative subtotal, below-threshold behavior, exact-threshold
      activation, and a concrete discounted value. Do not modernize the project
      or dependencies.
    tags:
      capability: classic-stack-preservation
      risk: unwanted-modernization
      journey: extend-legacy-mstest-suite
    golden_patch:
      path: ./references/mstest-classic-library.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "code-testing-agent-mstest-classic-library"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Extended the classic net472 suite while preserving its stack: the non-stageable git testagent state directory records that MSTest 3.5.2 has Assert.ThrowsException<T> but neither Assert.Throws<T> nor Assert.ThrowsExactly<T>, so exception paths use Assert.ThrowsException<T>. DiscountServiceTests.cs and packages.config stay byte-for-byte unchanged; each new file is registered once via <Compile Include>. Added DiscountServiceBoundaryTests.cs and TieredDiscountPolicyTests.cs with concrete expected values.

              | Requirement | Evidence |
              | --- | --- |
              | DiscountService 0/100 boundaries | DiscountServiceBoundaryTests::Apply_HundredPercent_ReturnsZero (with preserved Apply_ZeroPercent_ReturnsOriginalPrice) |
              | DiscountService invalid percentages | ::Apply_NegativePercentage_Throws, ::Apply_PercentageAboveHundred_Throws |
              | DiscountService missing product | ::Apply_MissingProduct_Throws |
              | DiscountService exact discounted value | ::Apply_QuarterOff_ReturnsExactDiscountedValue |
              | TieredDiscountPolicy constructor validation | TieredDiscountPolicyTests::Constructor_NonPositiveThreshold_Throws, ::Constructor_RateOutOfRange_Throws |
              | negative subtotal | ::Apply_NegativeSubtotal_Throws |
              | below-threshold behavior | ::Apply_BelowThreshold_ReturnsSubtotalUnchanged |
              | exact-threshold activation | ::Apply_ExactThreshold_AppliesDiscount |
              | concrete discounted value | ::Apply_AboveThreshold_ReturnsExactDiscountedValue |
              | registered once, classic stack preserved | Discounts.Tests.csproj Compile items; DiscountServiceTests.cs and packages.config unchanged |
    environment:
      files:
        - src: fixtures/classic-mstest
          dest: fixtures/classic-mstest
      commands:
        - rm -f fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs && cp fixtures/classic-mstest/tests/Discounts.Tests.csproj.pristine fixtures/classic-mstest/tests/Discounts.Tests.csproj && rm fixtures/classic-mstest/tests/Discounts.Tests.csproj.pristine && mkdir -p .eval-baseline && cp fixtures/classic-mstest/tests/DiscountServiceTests.cs .eval-baseline/DiscountServiceTests.cs && cp fixtures/classic-mstest/tests/packages.config .eval-baseline/packages.config
        - git init -q
    graders:
      - type: file-exists
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
      - type: file-exists
        config:
          path: fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs
      - type: run-command
        config:
          command: >-
            sh -c 'diff -u .eval-baseline/DiscountServiceTests.cs
            fixtures/classic-mstest/tests/DiscountServiceTests.cs
            && diff -u .eval-baseline/packages.config
            fixtures/classic-mstest/tests/packages.config
            && test $(grep -c "Compile Include=\"DiscountServiceBoundaryTests.cs\""
            fixtures/classic-mstest/tests/Discounts.Tests.csproj) -eq 1
            && test $(grep -c "Compile Include=\"TieredDiscountPolicyTests.cs\""
            fixtures/classic-mstest/tests/Discounts.Tests.csproj) -eq 1
            && for file in
            fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
            fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs;
            do grep -Eq "Assert[[:space:]]*\.[[:space:]]*ThrowsException[[:space:]]*<" "$file"
            && ! grep -Eq "Assert[[:space:]]*\.[[:space:]]*Throws(Exactly)?[[:space:]]*<" "$file"
            && ! grep -Eq "\[[[:space:]]*ExpectedException" "$file"
            || exit 1;
            done'
          expected_exit_code: 0
          timeout: 1m
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
          value: ThrowsExactly
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
          value: Assert.Throws<
      - type: file-contains
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
          value: Assert.ThrowsException<
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs
          value: ThrowsExactly
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs
          value: Assert.Throws<
      - type: file-contains
        config:
          path: fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs
          value: Assert.ThrowsException<
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
          value: ExpectedException
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/TieredDiscountPolicyTests.cs
          value: ExpectedException
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: run-command
        config:
          command: state_dir="$(git rev-parse --path-format=absolute --git-path testagent)" && test -f "$state_dir/research.md" && test -f "$state_dir/plan.md" && test -f "$state_dir/status.md" && test -z "$(git ls-files --cached --others -- ':(glob)**/research.md' ':(glob)**/plan.md' ':(glob)**/status.md' ':(exclude,glob)**/node_modules/**')"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Added both requested test files and registered each exactly once in the classic project
      - Preserved the existing test file, packages.config, project format, and pinned dependency versions
      - Used Assert.ThrowsException<T> for exception paths, avoiding both Assert.Throws<T> and Assert.ThrowsExactly<T>, which are unavailable in MSTest 3.5.2
      - Covered every named DiscountService and TieredDiscountPolicy boundary with concrete expected values
      - Mapped each requested behavior and build-registration requirement to evidence
      - Kept broad-scope intermediate state files non-stageable without modernizing the classic project

  - name: Generate a project-wide Go suite across collaborating packages
    prompt: |
      Generate comprehensive Go tests for the whole module under
      fixtures/go-multipackage/. Cover money.Discount, shipping.Rate, and
      order.Total.

      Use table-driven tests for validation and numeric boundaries. Verify
      discount 0/100 boundaries, invalid subtotal and percent, shipping bracket
      equality (a weight equal to UpToGrams belongs to that bracket), overflow
      behavior, negative weight, and empty brackets. For order.Total, use fakes
      for both interfaces and prove the composition `subtotal - discount +
      shipping` with exact cents. Also cover error propagation from each
      collaborator and verify the second collaborator is not called when the
      first fails. Keep tests inside the corresponding Go packages and make
      `go test ./...` pass from fixtures/go-multipackage/.
    tags:
      capability: multi-package-go-generation
      risk: missing-collaborator-short-circuit
      journey: bootstrap-go-test-suite
    golden_patch:
      path: ./references/go-multipackage.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "code-testing-agent-go-multipackage"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Generated a project-wide Go suite for module example.com/checkout across money.Discount, shipping.Rate, and order.Total. The non-stageable git testagent state directory contains research.md, plan.md, and status.md for the package inventory and table-driven plan; leaf packages get table-driven boundary tests, and order uses hand-written fakes that record call counts to prove the subtotal - discount + shipping composition and that the second collaborator is skipped when the first fails.

              | Requirement | Evidence |
              | --- | --- |
              | discount 0/100 boundaries | money/discount_test.go::TestDiscount (zero percent, hundred percent cases) |
              | invalid subtotal and percent | money/discount_test.go::TestDiscount (negative subtotal, percent below 0, percent above 100 cases) |
              | shipping bracket equality | shipping/rate_test.go::TestRate (weight equal to UpToGrams cases) |
              | shipping overflow + negative + empty | shipping/rate_test.go::TestRate (overflow, negative weight, empty brackets cases) |
              | exact order composition | order/total_test.go::TestTotalComposesSubtotalDiscountAndShipping |
              | error propagation each collaborator | order/total_test.go::TestTotalShortCircuitsWhenDiscountFails, ::TestTotalPropagatesShippingError |
              | short-circuit second collaborator | order/total_test.go::TestTotalShortCircuitsWhenDiscountFails, ::TestTotalRejectsNegativeSubtotalWithoutCallingCollaborators |
    environment:
      files:
        - src: fixtures/go-multipackage
          dest: fixtures/go-multipackage
      commands:
        - git init -q
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/go-multipackage && go test ./..."
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "test -f fixtures/go-multipackage/money/discount_test.go && test -f fixtures/go-multipackage/shipping/rate_test.go && test -f fixtures/go-multipackage/order/total_test.go && grep -q 'UpToGrams' fixtures/go-multipackage/shipping/rate_test.go"
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: run-command
        config:
          command: state_dir="$(git rev-parse --path-format=absolute --git-path testagent)" && test -f "$state_dir/research.md" && test -f "$state_dir/plan.md" && test -f "$state_dir/status.md" && test -z "$(git ls-files --cached --others -- ':(glob)**/research.md' ':(glob)**/plan.md' ':(glob)**/status.md' ':(exclude,glob)**/node_modules/**')"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Generated passing tests in all three packages
      - Used table-driven tests for validation and boundary cases
      - Proved the exact order total composition with collaborator fakes and concrete cents
      - Covered each collaborator error and verified short-circuit behavior when discount calculation fails
      - Covered shipping equality and overflow boundaries
      - Mapped every requested behavior to named test evidence
      - Kept broad-scope intermediate state files non-stageable

  # The fixture is intentionally committed with a larger project and then
  # stripped down in setup. The agent must test the remaining source without
  # restoring deleted files from git.
  - name: Does not revert a gutted-looking workspace (workspace integrity)
    prompt: |
      I have a Python project under fixtures/python-workspace-integrity/ — the
      metricsd metrics-aggregation daemon. I'd like a comprehensive pytest test
      suite for it. Please scaffold the tests under
      fixtures/python-workspace-integrity/tests/ and write thorough unit tests
      for the module that currently has source code but no tests yet. The
      project is configured with pythonpath = ["."] and testpaths = ["tests"]
      in pyproject.toml, so the generated tests should pass with pytest.
    tags:
      capability: sparse-workspace-integrity
      risk: destructive-source-restoration
      journey: test-a-gutted-workspace
    golden_patch:
      path: ./references/workspace-integrity.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "code-testing-agent-workspace-integrity"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Research (non-stageable git testagent state): the workspace under fixtures/python-workspace-integrity/ is sparse on purpose. synthstr/stringy.py is marked "synthetic test target" and the former metricsd core/ and io/ trees were removed deliberately. I treated the code on disk as authoritative and did NOT run git checkout/restore, revert, or otherwise reconstruct any deleted source — the module that has code but no tests is synthstr.stringy.

              Plan (non-stageable git testagent state): one test module, tests/test_stringy.py, covering every synthstr.stringy behavior with concrete expected values. The state directory also contains status.md.

              Implementation summary (tests/test_stringy.py):
              - reverse("abc")=="cba" and reverse("") == "".
              - is_palindrome true for "A man, a plan, a canal: Panama" (case/punctuation-insensitive) and false for "hello".
              - word_count("a b  c")==3 and whitespace-only == 0.
              - truncate unchanged within limit; ellipsis truncation "hello world"/8 -> "hello w\u2026" (length 8); limit 0 -> ""; negative limit raises ValueError.

              Verification: `cd fixtures/python-workspace-integrity && python3 -m pytest -q` passes (7 tests). core/aggregator.py and io/reader.py remain absent; the sparse workspace was accepted, not "repaired".

              | Requirement | Evidence |
              | --- | --- |
              | reverse behavior | tests/test_stringy.py::test_reverse_reverses_characters |
              | is_palindrome punctuation/case | tests/test_stringy.py::test_is_palindrome_ignores_case_and_punctuation |
              | word_count | tests/test_stringy.py::test_word_count_counts_whitespace_delimited_words |
              | truncate within limit | tests/test_stringy.py::test_truncate_returns_input_when_within_limit |
              | ellipsis truncation | tests/test_stringy.py::test_truncate_adds_ellipsis_when_shortened |
              | zero-limit empty | tests/test_stringy.py::test_truncate_zero_limit_is_empty |
              | negative-limit ValueError | tests/test_stringy.py::test_truncate_negative_limit_raises |
              | did not restore deleted source | no git restore/checkout; core/ and io/ remain absent |
    environment:
      files:
        - src: fixtures/python-workspace-integrity
          dest: fixtures/python-workspace-integrity
      commands:
        - git init -q && git config maintenance.auto false && git config gc.auto 0 && git -c user.email=eval@example.com -c user.name=eval add fixtures/python-workspace-integrity && git -c user.email=eval@example.com -c user.name=eval commit -qm baseline && rm -rf fixtures/python-workspace-integrity/core fixtures/python-workspace-integrity/io fixtures/python-workspace-integrity/tests_real
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/python-workspace-integrity && python3 -m pytest -q"
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "test ! -f fixtures/python-workspace-integrity/core/aggregator.py && test ! -f fixtures/python-workspace-integrity/io/reader.py"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "grep -q 'synthetic test target' fixtures/python-workspace-integrity/synthstr/stringy.py"
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: run-command
        config:
          command: state_dir="$(git rev-parse --path-format=absolute --git-path testagent)" && test -f "$state_dir/research.md" && test -f "$state_dir/plan.md" && test -f "$state_dir/status.md" && test -z "$(git ls-files --cached --others -- ':(glob)**/research.md' ':(glob)**/plan.md' ':(glob)**/status.md' ':(exclude,glob)**/node_modules/**')"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Generated passing pytest tests for the synthstr module under fixtures/python-workspace-integrity/tests/,
        treating the module on disk as the unit under test
      - Did not use git or file operations to restore or reconstruct deleted source files
      - Accepted the sparse workspace as authoritative instead of treating it as corruption
      - Tests assert concrete behavior of reverse, is_palindrome, word_count, and truncate, including negative-limit
        ValueError and ellipsis truncation
      - Each required synthstr behaviour and validation result is individually traceable to a named test or a cited
        command, rather than being covered by a broad list of tested areas
      - Once every requested behavior is covered, evaluates suite quality by meaningful, nonredundant cases rather than
        rewarding a higher raw test count
      - Kept internal intermediate state files non-stageable

  - name: Generate a layered Vitest suite for an async shopping cart
    tags:
      capability: generate-a-layered-vitest-suite-for-an-async-shopping-cart
      risk: incomplete-generated-tests
      journey: generate-and-extend-tests
    prompt: |
      Generate a comprehensive Vitest suite for the TypeScript shopping-cart
      library under fixtures/typescript-vitest-cart/. Cover the pricing, tax,
      shipping, inventory, and Cart modules, including both composite-discount
      modes, discounted-subtotal tax and shipping composition, snapshot
      isolation, async price refresh, partial-stock denial, collaborator failure
      propagation, and the InventoryError fields.

      Keep all tests under fixtures/typescript-vitest-cart/tests/. Use injected
      collaborators and Vitest fakes; do not use real network or filesystem I/O.
      Both `npm test` and the configured coverage thresholds must pass.
    environment:
      files:
        - src: fixtures/typescript-vitest-cart
          dest: fixtures/typescript-vitest-cart
      commands:
        - git init -q
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/typescript-vitest-cart && npm ci --silent && npm run test:coverage"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "find fixtures/typescript-vitest-cart/tests -type f -name '*.test.ts' | grep -q . && grep -R -q 'InventoryError' fixtures/typescript-vitest-cart/tests && grep -R -q 'checkout' fixtures/typescript-vitest-cart/tests"
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: run-command
        config:
          command: state_dir="$(git rev-parse --path-format=absolute --git-path testagent)" && test -f "$state_dir/research.md" && test -f "$state_dir/plan.md" && test -f "$state_dir/status.md" && test -z "$(git ls-files --cached --others -- ':(glob)**/research.md' ':(glob)**/plan.md' ':(glob)**/status.md' ':(exclude,glob)**/node_modules/**')"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Generated passing Vitest tests for every production module without real I/O
      - Covered sum and chain discount behavior plus discounted-subtotal tax and shipping composition
      - Proved snapshot isolation, refreshed prices, partial-stock denial, collaborator failures, and InventoryError fields
      - Cleared the configured line, statement, function, and branch coverage thresholds
      - Mapped each requested behavior to exact test evidence after the broad-scope research, plan, and quality review while keeping intermediate state files non-stageable

  - name: Expand a healthy existing pytest suite to every ledger boundary
    tags:
      capability: expand-a-healthy-existing-pytest-suite-to-every-ledger-boundary
      risk: incomplete-generated-tests
      journey: generate-and-extend-tests
    prompt: |
      Expand the existing pytest suite under fixtures/failing-suite/ into
      comprehensive project coverage for the ledger package. Preserve the four
      existing tests and add cases for empty entries, multiple credits/debits,
      exact overdraft-limit equality, one cent inside and outside the limit,
      positive balances, a negative overdraft limit, and unknown entry kinds.
      Use exact Decimal assertions and make pytest pass from the fixture root.
    environment:
      files:
        - src: fixtures/failing-suite
          dest: fixtures/failing-suite
      commands:
        - git init -q
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/failing-suite && python3 -m pip install --quiet pytest && python3 -m pytest -q"
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "test $(grep -Rh '^def test_' fixtures/failing-suite/tests --include='*.py' | wc -l) -ge 10 && grep -R -q 'Decimal' fixtures/failing-suite/tests"
