scenarios:
  # ============================================================================
  # Goal: Generate comprehensive tests for a real-world ASP.NET Core MVC app
  # ContosoUniversity is a non-trivial web app with EF Core (SqlServer), TPH
  # inheritance, multiple CRUD controllers, a notification service, pagination,
  # and a complex DbContext. The agent must figure out how to set up an in-memory
  # or SQLite test database, mock/arrange controller dependencies, and cover
  # controllers + services + data layer logic.
  # ============================================================================

  - name: "Generate tests for ContosoUniversity ASP.NET Core MVC app"
    prompt: |
      I have an ASP.NET Core MVC application under ContosoUniversity/ — a university
      enrollment system with multiple controllers, EF Core data access, and a
      notification service. This is a project-wide, multi-file test generation task.

      Please scaffold a new test project, then write comprehensive unit tests
      across the controllers (Students, Courses, Departments, Instructors), the
      services, and the data layer. Achieve high code coverage. The generated
      tests should compile and pass, and the test project should be configured so
      `dotnet test --collect:"XPlat Code Coverage"` produces a Cobertura XML
      report under TestResults/ (add `coverlet.collector` to the test csproj if
      it is not already there).
    setup:
      copy_test_files: true
    assertions:
      # The generated tests must compile, pass, and produce a coverage report
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "test ContosoUniversity.Tests/ContosoUniversity.Tests.csproj -v:q --collect:\"XPlat Code Coverage\""
        expected_exit_code: 0
        expected_std_output_contains: "Passed!"
        command_timeout: 300
      - type: file_exists
        path: "**/TestResults/**/coverage.cobertura.xml"
    rubric:
      - "Achieved high line coverage (>70%) across the ContosoUniversity source files as reported by the Cobertura XML in TestResults/"
      - "Tests are organized logically with clear naming that describes test scenarios"
      - "Generated tests that cover multiple controllers (Students, Courses, Departments, Instructors)"
      - "Set up the EF Core SchoolContext correctly for testing without a real SQL Server (e.g., InMemory provider or SQLite)"
    timeout: 3600

  # ============================================================================
  # Goal: Verify the agent can generate idiomatic pytest tests for a Flask app
  # The tasks_api package has a TaskService (with an injected clock), an
  # InMemoryTaskRepository implementing a Protocol, and a Flask blueprint
  # exposing /tasks. The agent must use Flask's test_client() (no real ports),
  # mock the repository for service-level tests, and exercise error paths.
  # The fixture lives under fixtures/python-flask-tasks/ with an empty tests/
  # directory so passing pytest proves the agent generated the test files.
  # ============================================================================

  - name: "Generate pytest tests for the Flask tasks API (Python polyglot)"
    prompt: |
      I have a Python Flask web application under fixtures/python-flask-tasks/
      — a small /tasks REST API with a service layer (TaskService with an
      injected `now` clock), an in-memory repository implementing a Protocol,
      and a Flask blueprint exposing the HTTP surface (see
      fixtures/python-flask-tasks/README.md for the layout). There are no
      tests yet — the tests/ directory is empty. This is a project-wide,
      multi-file test generation task across the service, repository, and
      routes layers.

      Please scaffold a comprehensive pytest suite under
      fixtures/python-flask-tasks/tests/ and achieve high code coverage
      across the tasks_api package. The suite should:
        - Unit-test TaskService with the repository mocked or stubbed (not
          the real in-memory implementation), and an injected `now`
          callable so completion timestamps are deterministic. Cover the
          happy path, validation errors (empty title, oversized title),
          not-found, and already-done cases.
        - Integration-test the Flask blueprint in-process (Flask exposes a
          test client for this — no real network ports).
        - Assert both HTTP status codes and JSON response bodies for the
          POST /tasks, GET /tasks, GET /tasks/<id>, and POST
          /tasks/<id>/complete endpoints, including 400/404/409 error
          cases.

      Tests should pass with: `python -m pip install -e ".[test]"` then
      `python -m pytest` from the fixtures/python-flask-tasks/ directory.
    setup:
      copy_test_files: true
    assertions:
      # The generated pytest suite must install cleanly and pass
      - type: run_command_and_assert
        command_to_run: "bash"
        command_arguments: "-c \"cd fixtures/python-flask-tasks && python3 -m pip install -e '.[test]' --quiet && python3 -m pytest -q\""
        expected_exit_code: 0
        command_timeout: 300
      # The agent must actually create at least one test file
      - type: file_exists
        path: "fixtures/python-flask-tasks/tests/**/test_*.py"
    rubric:
      - "Created at least one test file under fixtures/python-flask-tasks/tests/ named test_*.py"
      - "Uses Flask's test_client() (or werkzeug Client) for route tests rather than starting a real HTTP server"
      - "Mocks TaskRepository (e.g. unittest.mock.Mock(spec=TaskRepository)) when unit-testing TaskService rather than relying on InMemoryTaskRepository"
      - "Asserts both HTTP status codes (201/200/400/404/409) and JSON body contents for the /tasks endpoints"
      - "Covers TaskService.create validation errors (empty title and >200 char title) and complete()'s 'already done' error"
    timeout: 1800

  # ============================================================================
  # Goal: Verify the agent can generate idiomatic Vitest tests for a TS library
  # The shopping-cart fixture exposes a Cart class with an injectable
  # DiscountPolicy seam, plus NoDiscountPolicy and PercentageDiscountPolicy.
  # The agent must mock DiscountPolicy via vi.fn() (or a hand-rolled stub) to
  # isolate Cart from its collaborators, and exercise the policy classes too.
  # ============================================================================

  - name: "Generate Vitest tests for the shopping-cart library (TypeScript polyglot)"
    prompt: |
      I have a TypeScript shopping-cart library under
      fixtures/typescript-vitest-cart/ — a small package with a Cart class,
      an injectable DiscountPolicy seam, and NoDiscountPolicy /
      PercentageDiscountPolicy implementations (see its README.md for the
      layout). There are no tests yet — the tests/ directory is empty. This
      is a project-wide, multi-file test generation task across the cart
      and pricing modules.

      Please scaffold a comprehensive Vitest suite under
      fixtures/typescript-vitest-cart/tests/ (one or more `*.test.ts` files)
      and achieve high code coverage across the src/ modules. The suite
      should:
        - Use a mock or hand-written stub for DiscountPolicy when testing
          Cart, so Cart is exercised in isolation from its discount
          collaborator rather than only through the real policy classes.
        - Cover Cart.add merge semantics for repeated product ids, add's
          guard against non-positive / non-integer quantities, updateQuantity
          (including 0 removing the line and unknown-id throwing), remove
          returning false for unknown ids, and totals() clamping the discount
          when the policy returns a value greater than the subtotal.
        - Include boundary tests for PercentageDiscountPolicy's constructor
          (rejects out-of-range percent) and computeDiscountCents (rounds
          down, returns 0 for non-positive subtotals).

      Tests should pass with: `npm ci` then `npx vitest run` from the
      fixtures/typescript-vitest-cart/ directory.
    setup:
      copy_test_files: true
    assertions:
      # The generated Vitest suite must install cleanly and pass
      - type: run_command_and_assert
        command_to_run: "bash"
        command_arguments: "-c \"cd fixtures/typescript-vitest-cart && npm ci --silent && npx vitest run\""
        expected_exit_code: 0
        command_timeout: 300
      # The agent must actually create at least one test file
      - type: file_exists
        path: "fixtures/typescript-vitest-cart/tests/**/*.test.ts"
    rubric:
      - "Created at least one `*.test.ts` file under fixtures/typescript-vitest-cart/tests/"
      - "Mocks DiscountPolicy (e.g. via vi.fn() or a hand-rolled stub) when testing Cart, rather than only exercising the real policy implementations"
      - "Exercises Cart.add merge semantics, updateQuantity zero-removes, and totals() clamping when the discount exceeds the subtotal"
      - "Includes constructor boundary tests for PercentageDiscountPolicy (rejects out-of-range percent)"
      - "No real network or filesystem dependencies in the generated tests"
    timeout: 1800
