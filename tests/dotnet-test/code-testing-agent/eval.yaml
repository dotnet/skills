name: code-testing-agent
description: Evaluates the dotnet-test/code-testing-agent skill
type: capability
executionShard: generation
# `defaults:` replaces the deprecated `config:` — vally's loader throws on a
# spec declaring both (eng/eval-quality check 10).
#
# runs: 2 for two independent reasons, reached separately on this branch and in
# #974.
#
# It is necessary: at runs: 1 this eval could not produce a passing verdict at
# any effect size. The sign test conditions on the discordant (non-tie) trials,
# and one of the five scenarios is a dormancy guard whose correct outcome IS a
# tie — both arms diagnose the failing suite and the skill rightly stays
# dormant. That caps discordant trials at 4, one short of the 5 the test needs,
# so the eval was unwinnable before a single trial ran (run 30631489464:
# 1W/4T/0L, p=0.500). Two runs give ~8 discordant-capable trials, which a
# genuinely-helping skill can clear and luck cannot.
#
# And runs is the right lever here rather than more scenarios, which is normally
# preferred because it widens what the skill is measured on: every scenario here
# drives the full multi-file generate-build-test pipeline end to end — `npm ci`
# plus two Vitest runs, `pip install` plus pytest, and a `dotnet test` build.
# Another scenario of that shape costs more than it informs. This is also the
# plugin's most expensive eval and its token cost is the open P1 on #899, so 2
# is the smallest count that makes a verdict reachable at all.
defaults:
  timeout: 60m
  runs: 2
stimuli:
  - name: Generate Vitest tests for the shopping-cart library (TypeScript polyglot)
    prompt: |
      I have a TypeScript shopping-cart library under
      fixtures/typescript-vitest-cart/ — a package with a Cart class
      that exposes a fixed pricing pipeline (subtotal → discount → tax
      → shipping) and an async checkout(), composable discount policies
      (NoDiscountPolicy, PercentageDiscountPolicy,
      FixedAmountDiscountPolicy, CompositeDiscountPolicy with sum and
      chain stacking modes), tax calculators (NoTaxCalculator,
      RegionalTaxCalculator, AsyncTaxCalculator backed by an
      AsyncTaxRateProvider), shipping calculators (FreeShippingCalculator,
      FlatShippingCalculator with free-over threshold, and
      WeightBasedShippingCalculator with WeightBracket boundaries), and
      async PriceFetcher / InventoryChecker seams plus an InventoryError
      type used by checkout() (see its README.md for the layout). There
      are no test files yet — the tests/ directory contains only a
      .gitkeep marker. This is a project-wide, multi-file test
      generation task across the cart, pricing, tax, shipping, and
      inventory modules.

      Please scaffold a comprehensive Vitest test suite under
      fixtures/typescript-vitest-cart/tests/, then write comprehensive
      unit tests across all of these modules — covering Cart (with the
      discount / tax / shipping seams mocked) and every real policy /
      calculator implementation, and async checkout() (with
      PriceFetcher, InventoryChecker, and AsyncTaxRateProvider mocked
      via vi.fn().mockResolvedValue / mockRejectedValue).

      Coverage tooling (@vitest/coverage-v8) is pre-configured in
      vitest.config.ts with a hard floor of 80% line / statement /
      function coverage and 70% branch coverage on src/. The generated
      tests should pass with: `npm ci` then `npx vitest run` from the
      fixtures/typescript-vitest-cart/ directory, and the run-with-
      coverage step `npx vitest run --coverage` (which produces
      fixtures/typescript-vitest-cart/coverage/lcov.info) fails if your
      tests do not clear the configured thresholds across every module.
    environment:
      files:
        - src: .
          dest: .
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/typescript-vitest-cart && npm ci --silent && npx vitest run"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "find fixtures/typescript-vitest-cart/tests -type f -name '*.test.ts' -print -quit | grep -q test"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "cd fixtures/typescript-vitest-cart && npx vitest run --coverage"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "test -f fixtures/typescript-vitest-cart/coverage/lcov.info"
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: prompt
    rubric:
      - Created at least one `*.test.ts` file under fixtures/typescript-vitest-cart/tests/
      - Mocks DiscountPolicy, TaxCalculator, and ShippingCalculator (e.g. via vi.fn() or hand-rolled stubs) when
        testing Cart, rather than only exercising the real implementations
      - "Asserts the Cart pricing pipeline composition: tax is computed on the *discounted* subtotal, and totalCents =
        (subtotal - discount) + tax + shipping"
      - Tests CompositeDiscountPolicy in both stacking modes ("sum" vs "chain") and demonstrates the difference in
        computed discount for an overlapping policy set
      - Covers WeightBasedShippingCalculator bracket boundaries (a weight that equals a bracket's upToGrams falls
        inside that bracket) and the overflow path
      - Exercises async Cart.checkout() with vi.fn().mockResolvedValue / mockRejectedValue for PriceFetcher (price
        refresh), InventoryChecker (denial via available=false and via availableQuantity < requested), and
        AsyncTaxRateProvider, including asserting the InventoryError shape (productId / requested / available)
      - Includes constructor boundary tests for PercentageDiscountPolicy, FixedAmountDiscountPolicy,
        RegionalTaxCalculator, and WeightBasedShippingCalculator (rejects empty bracket list, out-of-range / negative
        inputs)
      - No real network or filesystem dependencies in the generated tests
      - Tests pin down behavior with concrete expected values — minimal use of `toBeDefined`/`toBeTruthy`-only
        assertions; primary observables (totalCents, line item counts, calculated tax, computed shipping) are
        checked with `toBe(specificNumber)` rather than truthy/existence-only checks
      - At least one Cart test exercises the *intersection* of multiple pricing dimensions (e.g., a
        CompositeDiscountPolicy combined with a RegionalTaxCalculator and a WeightBasedShippingCalculator above the
        threshold) rather than only one dimension at a time, exercising property intersections
      - Every requested behaviour is individually traceable to a named generated test — each policy/calculator
        boundary, async rejection path, mocked seam and the multi-dimension pricing intersection is backed by a
        specific test name rather than a broad claim of coverage — and the coverage artifact is cited
      - Avoided redundant tests after all requested behaviors and coverage thresholds were satisfied; a smaller focused
        suite is not penalized merely for having fewer tests than another passing suite

  # The fixture is intentionally committed with a larger project and then
  # stripped down in setup. The agent must test the remaining source without
  # restoring deleted files from git.
  - name: Does not revert a gutted-looking workspace (workspace integrity)
    prompt: |
      I have a Python project under fixtures/python-workspace-integrity/ — the
      metricsd metrics-aggregation daemon. I'd like a comprehensive pytest test
      suite for it. Please scaffold the tests under
      fixtures/python-workspace-integrity/tests/ and write thorough unit tests
      for the module that currently has source code but no tests yet. The
      project is configured with pythonpath = ["."] and testpaths = ["tests"]
      in pyproject.toml, so the generated tests should pass with pytest.
    environment:
      files:
        - src: fixtures/python-workspace-integrity
          dest: fixtures/python-workspace-integrity
      commands:
        - cd fixtures/python-workspace-integrity && git init -q && git -c user.email=eval@example.com -c user.name=eval add -A && git -c user.email=eval@example.com -c user.name=eval commit -qm baseline && rm -rf core io tests_real
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/python-workspace-integrity && python3 -m pip install --quiet pytest && python3 -m pytest -q"
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "test ! -f fixtures/python-workspace-integrity/core/aggregator.py && test ! -f fixtures/python-workspace-integrity/io/reader.py"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "grep -q 'synthetic test target' fixtures/python-workspace-integrity/synthstr/stringy.py"
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: prompt
    rubric:
      - Generated passing pytest tests for the synthstr module under fixtures/python-workspace-integrity/tests/,
        treating the module on disk as the unit under test
      - Did not use git or file operations to restore or reconstruct deleted source files
      - Accepted the sparse workspace as authoritative instead of treating it as corruption
      - Tests assert concrete behavior of reverse, is_palindrome, word_count, and truncate, including negative-limit
        ValueError and ellipsis truncation
      - Each required synthstr behaviour and validation result is individually traceable to a named test or a cited
        command, rather than being covered by a broad list of tested areas
      - Once every requested behavior is covered, evaluates suite quality by meaningful, nonredundant cases rather than
        rewarding a higher raw test count

  # Compact C# scenario: the existing suite already covers BillableWeight, so the
  # agent must extend coverage to QuoteAsync without duplicating or rewriting it.
  - name: Extend an existing suite to the untested method only
    prompt: |
      The ShippingQuotes project under fixtures/csharp-shipping-quotes/ has a test project that
      already covers BillableWeight, but QuoteAsync has no tests at all. Please add tests for
      QuoteAsync only — put them in a new test
      file and leave BillableWeightTests.cs exactly as it is, without re-testing BillableWeight.

      QuoteAsync must be tested with IRateProvider and ISurchargeTable mocked or stubbed, never
      against real I/O, following the existing xUnit conventions in the project. Please cover the
      fixed pricing pipeline (the fuel surcharge applies to the base price and the handling fee is
      added afterwards so it is never surcharged), the QuoteUnavailableException paths, and the
      blank-destination guard. The suite should pass with
      `dotnet test fixtures/csharp-shipping-quotes/tests/ShippingQuotes.Tests.csproj`.
    environment:
      files:
        - src: fixtures/csharp-shipping-quotes
          dest: fixtures/csharp-shipping-quotes
      # Snapshot the pre-existing suite so the graders can assert it is
      # byte-for-byte unmodified. Checking that one test method name still
      # appears in the file would let a run rewrite it, or duplicate the
      # BillableWeight cases into it, and still pass a scope-containment
      # scenario. The snapshot is kept inside the workspace (not /tmp) because
      # graders are only guaranteed to see workspace-relative paths, and it
      # lives outside the test project so it is never compiled.
      commands:
        - mkdir -p .eval-baseline && cp fixtures/csharp-shipping-quotes/tests/BillableWeightTests.cs .eval-baseline/BillableWeightTests.cs
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/csharp-shipping-quotes/tests/ShippingQuotes.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      # Scope containment: the existing suite must be untouched, byte for byte.
      - type: run-command
        config:
          command: sh -c "diff -u .eval-baseline/BillableWeightTests.cs fixtures/csharp-shipping-quotes/tests/BillableWeightTests.cs"
          expected_exit_code: 0
          timeout: 1m
      # The QuoteAsync tests must therefore live in a new file, and must exist.
      - type: run-command
        config:
          command: sh -c "grep -rl QuoteAsync fixtures/csharp-shipping-quotes/tests --include='*.cs' | grep -v BillableWeightTests.cs | grep -q ."
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: prompt
    rubric:
      - Added tests for QuoteAsync that compile and pass
      - Left the existing BillableWeightTests.cs byte-for-byte unmodified and did not duplicate its BillableWeight
        cases into the new tests
      - Substituted IRateProvider and ISurchargeTable with mocks, fakes, or stubs rather than performing real I/O
      - "Asserts the pipeline order with a concrete expected value: the fuel surcharge multiplies the base price
        only, and the 4.50 handling fee is added afterwards so it is never surcharged"
      - Covers the QuoteUnavailableException paths for a non-positive rate and for a rate provider that throws
        HttpRequestException, asserting the exception type rather than just that something threw
      - Covers the blank/whitespace destination guard as ArgumentException
      - "Asserts numeric results with exact expected decimals rather than existence-only checks such as
        Assert.IsNotNull"
      - Each requested behaviour, including the pipeline-order requirement, is individually traceable to a named
        generated test rather than to a general statement that the method is covered
      - Once every requested behaviour is covered, judged on meaningful, nonredundant cases; a smaller focused suite
        is not penalized merely for containing fewer tests than another passing suite

  # Focused single-function request. The pipeline ceremony (research/plan
  # artifacts, sub-agent fan-out, repeated whole-repo discovery) is what makes
  # this skill expensive; on a one-function scope it should stay proportional.
  #
  # No scenario in this eval uses the phrase "standard test-generation
  # workflow". It appeared in three prompts and in the skill's own description,
  # and nowhere else in the repository — a closed loop between the eval and the
  # skill it measures. Run 30631489464 showed what it was hiding: with the
  # phrase removed from this one prompt, the skill stopped activating here
  # (skillActivationCount 0) even though the request is plainly a
  # test-generation ask. The description now covers focused scope on its own
  # merits, so activation is measured against how users actually write.
  - name: Keep a single-function request proportional
    prompt: |
      fixtures/python-single-function/ has one helper, `slugify` in
      textkit/slugify.py, and no tests yet. Please add unit tests for that one
      function under fixtures/python-single-function/tests/. Nothing else in the
      package needs tests. The suite should pass with pytest from
      fixtures/python-single-function/.
    environment:
      files:
        - src: fixtures/python-single-function
          dest: fixtures/python-single-function
    graders:
      - type: run-command
        config:
          command: sh -c "cd fixtures/python-single-function && python3 -m pip install --quiet pytest && python3 -m pytest -q"
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: sh -c "find fixtures/python-single-function/tests -type f -name 'test_*.py' -print -quit | grep -q test"
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: prompt
    rubric:
      - Generated passing pytest tests for slugify under fixtures/python-single-function/tests/
      - Covered the documented behaviours — separator collapsing and trimming, truncation at a hyphen boundary,
        truncation when no boundary exists, the ValueError for a non-positive max_length, and input that slugifies
        to an empty string
      - Asserted concrete expected slugs rather than only checking that a string came back
      - Kept the work proportional to a one-function scope — no multi-phase research/planning ceremony, no
        repository-wide discovery sweep, and no test files for parts of the package the user excluded
      - Produced the Requirement | Evidence table with each behaviour traced to a named test
      - Did not pad the suite with redundant cases once every documented behaviour was covered

  - name: Register tests in a classic project without modernizing it
    prompt: |
      Add focused MSTest coverage for the percentage boundaries and missing-product
      path of DiscountService.Apply in fixtures/classic-mstest/. Put the new tests
      in tests/DiscountServiceBoundaryTests.cs and follow the suite's existing
      FixtureBase<DiscountService>, Moq, and NBuilder conventions.

      Cover all four percentage boundaries explicitly: below 0, exactly 0,
      exactly 100, and above 100.

      This is a classic net472 project pinned by packages.config to MSTest 3.5.2
      and Moq 4.2. Keep that project system and those package versions exactly as
      they are. New source files must be part of the test assembly.
    environment:
      files:
        - src: fixtures/classic-mstest
          dest: fixtures/classic-mstest
      commands:
        - mkdir -p .eval-baseline && cp fixtures/classic-mstest/tests/packages.config .eval-baseline/packages.config
    graders:
      - type: file-exists
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
      - type: file-contains
        config:
          path: fixtures/classic-mstest/tests/Discounts.Tests.csproj
          value: <Compile Include="DiscountServiceBoundaryTests.cs" />
      - type: file-contains
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
          value: FixtureBase<DiscountService>
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/DiscountServiceBoundaryTests.cs
          value: ThrowsExactly
      - type: file-not-contains
        config:
          path: fixtures/classic-mstest/tests/Discounts.Tests.csproj
          value: PackageReference
      - type: run-command
        config:
          command: sh -c "diff -u .eval-baseline/packages.config fixtures/classic-mstest/tests/packages.config && test $(grep -c 'Compile Include=\"DiscountServiceBoundaryTests.cs\"' fixtures/classic-mstest/tests/Discounts.Tests.csproj) -eq 1"
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: \|\s*Requirement\s*\|\s*Evidence\s*\|
      - type: prompt
    rubric:
      - Added focused tests for percentage values below 0 and above 100, asserting ArgumentOutOfRangeException
      - Added exact-boundary tests proving 0% returns the full price and 100% returns zero
      - Added a missing-product test that asserts InvalidOperationException
      - Registered the new test file exactly once in the classic project's compile items so it is part of the test assembly
      - Preserved the non-SDK project, packages.config, MSTest 3.5.2, Moq 4.2, and existing FixtureBase/NBuilder style
      - Used assertions available in MSTest 3.5.2 rather than newer APIs such as Assert.ThrowsExactly
      - Reported any unavailable Windows/Visual Studio test toolchain honestly instead of claiming dotnet test validated the classic project
      - Mapped every requested behavior and the project-registration requirement to concrete evidence

  # Dormancy guard. Running an existing suite and debugging failing test logic
  # are both in this skill's "When Not to Use" list, so the property under test
  # is that it stays dormant and does not hijack the request into generation.
  # Do not add `reject_skills: ["*"]`: forcing the skilled arm skill-free makes
  # it identical to the baseline arm, so the head-to-head score becomes pure
  # judge noise rather than a measurement.
  - name: Diagnose failing tests without generating a new suite
    prompt: |
      Two tests in fixtures/failing-suite/ are failing. Run the suite and tell me
      why they fail and what the fix is. Don't change anything yet — I want to
      review the diagnosis first.
    expect_activation: false
    environment:
      files:
        - src: fixtures/failing-suite
          dest: fixtures/failing-suite
    graders:
      - type: run-command
        config:
          command: sh -c "test $(find fixtures/failing-suite -type f -name 'test_*.py' | wc -l) -eq 1"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Named both failing tests — test_running_balance_applies_credits_and_debits and
        test_is_overdrawn_respects_overdraft_limit
      - Explained that both failures are wrong expectations in the tests, not defects in ledger/balance.py — the
        running balance of 100 + 50 - 20 really is 130, and a -50 balance is not overdrawn against a 100
        overdraft limit
      - Did not derail into generating a new test suite, scaffolding test files, or planning coverage work the
        user never asked for
      - Respected the "don't change anything yet" instruction and left the workspace as it was found
      - Judge on the quality of the diagnosis, not on how much output was produced — do not reward writing more
        tests or more analysis sections than the request called for
