[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tasks-api"
version = "0.0.1"
description = "Small Flask tasks API used as a polyglot fixture for code-testing-agent."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
