name: find-untested-sources
executionShard: b
description: Evaluates the dotnet-test/find-untested-sources skill
type: capability
# Six distinct stimuli clear the eligibility floor.
#
# Repeated runs collapse to one majority-direction vote per stimulus, so they do
# not increase the sign-test sample. The three runs below measure reliability and
# reduce the chance that one noisy execution decides a stimulus vote.
#
# These tasks are expensive and cover distinct source-discovery cases. Add a new
# discriminating stimulus, not more runs, to improve statistical power.
defaults:
  timeout: 5m
  runs: 3

stimuli:
  - name: Disambiguate duplicate C# type names by namespace
    prompt: |
      Find the C# source file under NamespaceCollision that is not referenced by
      any test and suggest the exact test path in the existing test project. Do
      not build or collect coverage.
    tags:
      capability: namespace-disambiguated-pairing
      risk: wrong-file-flagged-untested
      journey: find-untested-source-by-namespace
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-untested-sources-namespace-collision-settings"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I paired by fully-qualified type, not by short name, because both source files declare a `Settings` class.

              - `Alpha/Settings.cs` declares `Alpha.Configuration.Settings`. `AlphaSettingsTests.cs` opens with `using Alpha.Configuration;` and constructs `new Settings()`, so it exercises the Alpha type — this source is already paired and is **not** untested.
              - `Beta/Settings.cs` declares `Beta.Configuration.Settings`. No test references the `Beta.Configuration` namespace, so it is the unpaired source.

              ### Untested source

              - `Beta/Settings.cs` (`Beta.Configuration.Settings`) — no referencing test.

              ### Suggested test path

              Place the new test in the existing test project, mirroring the source folder:

              `NamespaceCollision/tests/NamespaceCollision.Tests/Beta/SettingsTests.cs`

              This is a static source-to-test pairing heuristic, not line or branch coverage — I cannot confirm the Alpha type is actually exercised at runtime without running the tests, which you asked me not to do.
    environment:
      files:
        - src: fixtures/namespace-collision/src/NamespaceCollision/NamespaceCollision.csproj
          dest: NamespaceCollision/src/NamespaceCollision/NamespaceCollision.csproj
        - src: fixtures/namespace-collision/src/NamespaceCollision/Alpha/Settings.cs
          dest: NamespaceCollision/src/NamespaceCollision/Alpha/Settings.cs
        - src: fixtures/namespace-collision/src/NamespaceCollision/Beta/Settings.cs
          dest: NamespaceCollision/src/NamespaceCollision/Beta/Settings.cs
        - src: fixtures/namespace-collision/tests/NamespaceCollision.Tests/NamespaceCollision.Tests.csproj
          dest: NamespaceCollision/tests/NamespaceCollision.Tests/NamespaceCollision.Tests.csproj
        - src: fixtures/namespace-collision/tests/NamespaceCollision.Tests/AlphaSettingsTests.cs
          dest: NamespaceCollision/tests/NamespaceCollision.Tests/AlphaSettingsTests.cs
    graders:
      - type: output-matches
        config:
          pattern: Beta[\\/]Settings\.cs
      - type: output-matches
        config:
          pattern: (?:NamespaceCollision[\\/])?tests[\\/]NamespaceCollision\.Tests[\\/]Beta[\\/]SettingsTests\.cs
      - type: output-not-matches
        config:
          pattern: (?is)(?:Alpha[\\/]Settings\.cs.{0,100}(?:untested|unpaired|no test)|(?:untested|unpaired|no test)(?:\s+(?:sources?|files?)\s*:)?\s*(?:[-*]\s*)?Alpha[\\/]Settings\.cs)
      - type: output-matches
        config:
          pattern: AlphaSettingsTests\.cs
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:build|test)\b
      - type: output-matches
        config:
          pattern: (?is)(?=.*\bstatic\b)(?=.*\b(?:pairing|heuristic)\b)(?=.*\b(?:line|branch)\b)(?=.*\bcoverage\b)(?=.*\b(?:not|isn't|doesn't|unknown|unverified|cannot)\b)
      - type: exit-success
      - type: prompt
    rubric:
      - Correctly paired Alpha/Settings.cs to AlphaSettingsTests.cs using the Alpha.Configuration namespace
      - Correctly identified Beta/Settings.cs as unpaired despite its duplicate short type name
      - Suggested NamespaceCollision/tests/NamespaceCollision.Tests/Beta/SettingsTests.cs in the referencing test project
      - Clearly distinguished static source-to-test evidence from actual line or branch coverage

  - name: Identify an unpaired TypeScript module
    prompt: |
      Find the untested TypeScript source module under TypeScriptPairing using
      static source-to-test pairing, and suggest a test file location. Return
      only the pairing result; do not install packages or run tests.
    tags:
      capability: typescript-module-pairing
      risk: unnecessary-package-install
      journey: find-untested-typescript-module
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-untested-sources-typescript-pairing-tax"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Static pairing over `TypeScriptPairing` by module name:

              - `src/cart/pricing.ts` is paired with `tests/cart/pricing.test.ts`, which imports from `../../src/cart/pricing`. It is covered, so I excluded it from the worklist.
              - `src/cart/tax.ts` has no matching `tax.test.ts` / `tax.spec.ts`, so it is the only unpaired source module.

              ### Untested source

              - `tax.ts` — no test module references it.

              ### Suggested test path

              Follow the convention already used by `pricing.test.ts`:

              `TypeScriptPairing/tests/cart/tax.test.ts`

              This is a static source-to-test pairing heuristic, not line or branch coverage — I did not install packages or run the suite, so I cannot confirm the exercised lines; `tax.ts` is simply unpaired by filename.
    environment:
      files:
        - src: fixtures/typescript-pairing/src/cart/pricing.ts
          dest: TypeScriptPairing/src/cart/pricing.ts
        - src: fixtures/typescript-pairing/src/cart/tax.ts
          dest: TypeScriptPairing/src/cart/tax.ts
        - src: fixtures/typescript-pairing/tests/cart/pricing.test.ts
          dest: TypeScriptPairing/tests/cart/pricing.test.ts
    graders:
      - type: output-matches
        config:
          pattern: tax\.ts
      - type: output-matches
        config:
          pattern: tax\.(test|spec)\.ts
      - type: output-not-matches
        config:
          pattern: (?i)pricing\.ts.{0,100}(untested|unpaired|no test)
      - type: output-matches
        config:
          pattern: pricing\.test\.ts
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?(?:npm|pnpm|yarn)\s+(?:ci|install|test|run\s+test)\b
      - type: output-matches
        config:
          pattern: (?is)(?=.*\bstatic\b)(?=.*\b(?:pairing|heuristic)\b)(?=.*\b(?:line|branch)\b)(?=.*\bcoverage\b)(?=.*\b(?:not|isn't|doesn't|unknown|unverified|cannot)\b)
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that pricing.ts is paired with pricing.test.ts
      - Identified tax.ts as the only unpaired source module
      - Suggested a conventional TypeScript test filename for tax.ts without running the test suite
      - Clearly distinguished static source-to-test evidence from actual line or branch coverage

  - name: Disambiguate duplicate C# types by nested test namespace
    prompt: |
      Find the C# source file under NamespaceCollision that has no test
      referencing its declared Options type. Suggest the exact test path in the
      existing test project. Do not build or collect coverage.
    tags:
      capability: nested-namespace-pairing
      risk: wrong-file-flagged-untested
      journey: find-untested-source-by-nested-namespace
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-untested-sources-namespace-collision-options"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Both files declare an `Options` type, so I resolved the pairing by declared namespace rather than short name.

              - `Alpha/Advanced/Options.cs` declares `Alpha.Configuration.Advanced.Options`. `AdvancedOptionsTests.cs` sits in the nested `Alpha.Configuration.Advanced.Tests` namespace and constructs `new Options()`, which binds to the Alpha type via the enclosing namespace. So this source is already paired and is **not** the answer.
              - `Beta/Advanced/Options.cs` declares `Beta.Configuration.Advanced.Options`. Nothing references the `Beta.Configuration.Advanced` namespace, so it has no test exercising its declared `Options` type.

              ### Untested source

              - `Beta/Advanced/Options.cs` (`Beta.Configuration.Advanced.Options`).

              ### Suggested test path

              `NamespaceCollision/tests/NamespaceCollision.Tests/Beta/Advanced/OptionsTests.cs`

              This is a static source-to-test pairing heuristic, not line or branch coverage — I cannot confirm the Alpha type is actually exercised without running the tests, which you asked me to skip.
    environment:
      files:
        - src: fixtures/namespace-collision/src/NamespaceCollision/NamespaceCollision.csproj
          dest: NamespaceCollision/src/NamespaceCollision/NamespaceCollision.csproj
        - src: fixtures/namespace-collision/src/NamespaceCollision/Alpha/Advanced/Options.cs
          dest: NamespaceCollision/src/NamespaceCollision/Alpha/Advanced/Options.cs
        - src: fixtures/namespace-collision/src/NamespaceCollision/Beta/Advanced/Options.cs
          dest: NamespaceCollision/src/NamespaceCollision/Beta/Advanced/Options.cs
        - src: fixtures/namespace-collision/tests/NamespaceCollision.Tests/NamespaceCollision.Tests.csproj
          dest: NamespaceCollision/tests/NamespaceCollision.Tests/NamespaceCollision.Tests.csproj
        - src: fixtures/namespace-collision/tests/NamespaceCollision.Tests/AdvancedOptionsTests.cs
          dest: NamespaceCollision/tests/NamespaceCollision.Tests/AdvancedOptionsTests.cs
    graders:
      - type: output-matches
        config:
          pattern: Beta[\\/]Advanced[\\/]Options\.cs
      - type: output-matches
        config:
          pattern: AdvancedOptionsTests\.cs
      - type: output-matches
        config:
          pattern: (?:NamespaceCollision[\\/])?tests[\\/]NamespaceCollision\.Tests[\\/]Beta[\\/]Advanced[\\/]OptionsTests\.cs
      - type: output-not-matches
        config:
          pattern: (?is)(?:Alpha[\\/]Advanced[\\/]Options\.cs.{0,100}(?:untested|unpaired|no test)|(?:untested|unpaired|no test)(?:\s+(?:sources?|files?)\s*:)?\s*(?:[-*]\s*)?Alpha[\\/]Advanced[\\/]Options\.cs)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:build|test)\b
      - type: output-matches
        config:
          pattern: (?is)(?=.*\bstatic\b)(?=.*\b(?:pairing|heuristic)\b)(?=.*\b(?:line|branch)\b)(?=.*\bcoverage\b)(?=.*\b(?:not|isn't|doesn't|unknown|unverified|cannot)\b)
      - type: exit-success
      - type: prompt
    rubric:
      - Correctly paired Alpha/Advanced/Options.cs from the nested Alpha.Configuration.Advanced.Tests namespace
      - Correctly identified Beta/Advanced/Options.cs as unpaired despite its duplicate short type name
      - Suggested NamespaceCollision/tests/NamespaceCollision.Tests/Beta/Advanced/OptionsTests.cs
      - Clearly distinguished static source-to-test evidence from actual line or branch coverage

  - name: Exclude generated sources and surface an orphan test
    prompt: >
      Which classes under Billing still need unit tests, and is any test file
      not exercising production code at all? Sources are under src/, tests under
      tests/. Static pairing only — do not build or run the tests.
    tags:
      capability: generated-exclusion-and-orphan-detection
      risk: generated-code-listed-as-untested
      journey: audit-untested-classes-and-orphan-tests
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-untested-sources-generated-and-orphan"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Static pairing over `Billing`, with generated files excluded:

              ### Classes still needing tests

              - `InvoiceCalculator.cs` — no test references `InvoiceCalculator`. This is the untested production class.

              ### Already paired (no action)

              - `DiscountRules.cs` is paired with `DiscountRulesTests.cs`, which references `DiscountRules`. Covered — not reported as untested.

              ### Excluded as generated

              - `TaxTable.Designer.cs` and `Resources.g.cs` are generated (`.Designer.cs` / `.g.cs`). I skipped them; they are not production sources that need hand-written tests.

              ### Orphan test

              - `SmokeEnvironmentTests.cs` references no production type in `Billing` — it is an orphan test, not a pairing for any source, so I did not pair it to a file.

              ### Suggested test path

              `tests/Billing.Tests/InvoiceCalculatorTests.cs`

              This is a static source-to-test pairing heuristic, not line or branch coverage — I did not build or run the tests, so I cannot report an exercised-line percentage.
    environment:
      files:
        - src: fixtures/generated-and-orphan
          dest: .
    graders:
      - type: output-matches
        config:
          pattern: InvoiceCalculator
      - type: output-matches
        config:
          pattern: SmokeEnvironmentTests
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:build|test|restore)\b
      - type: output-matches
        config:
          pattern: (?is)(?=.*\bstatic\b)(?=.*\b(?:pairing|heuristic)\b)(?=.*\b(?:line|branch)\b)(?=.*\bcoverage\b)(?=.*\b(?:not|isn't|doesn't|unknown|unverified|cannot)\b)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified InvoiceCalculator.cs as the source file with no test referencing it
      - Recognised DiscountRules.cs as already paired with DiscountRulesTests.cs, and did not report it as
        untested
      - Excluded the generated files TaxTable.Designer.cs and Resources.g.cs from the untested worklist —
        naming them as generated and skipped is fine, listing them as sources needing tests is not
      - Flagged SmokeEnvironmentTests.cs as an orphan test that references no production type, rather than
        pairing it to a source file
      - Did not run dotnet build, dotnet restore or dotnet test — this is static pairing analysis
      - Labelled the result as static source-to-test pairing rather than line or branch coverage

  - name: Pair sources to tests across a src/tests directory split
    prompt: >
      Which classes in this repository don't have unit tests yet? The sources
      live under src/ and the tests under tests/.
    tags:
      capability: src-tests-split-pairing
      risk: sibling-only-pairing-miss
      journey: find-untested-classes-across-split
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-untested-sources-pairing-repo-src-tests-split"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I resolved pairing across the `src/` → `tests/` split, not by looking for sibling files.

              ### Class with no test

              - `src/Store/OrderProcessor.cs` (`OrderProcessor`) — no test in `tests/Store.Tests/` references it.

              ### Already paired (no action)

              - `src/Store/CustomerService.cs` is paired with `tests/Store.Tests/CustomerServiceTests.cs`, which references `CustomerService`. Covered — not reported as untested.

              ### Suggested test path

              Following the existing `tests/Store.Tests/` convention:

              `tests/Store.Tests/OrderProcessorTests.cs`

              This is a static source-to-test pairing heuristic, not line or branch coverage — I did not compile or run anything, so this is not a coverage percentage, just an unpaired-source finding.
    environment:
      files:
        - src: fixtures/pairing-repo
          dest: .
    graders:
      - type: output-matches
        config:
          pattern: OrderProcessor
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:build|test)\b
      - type: prompt
    rubric:
      - Identified OrderProcessor.cs as having no corresponding test file
      - Recognised CustomerService.cs as already paired with CustomerServiceTests.cs, and did not report it as
        untested
      - Resolved the pairing across the src/ and tests/ directory split rather than only looking for a sibling file
      - Suggested a concrete test path following the repository's existing tests/Store.Tests/ convention
      - Did not run dotnet build or dotnet test — this is static pairing analysis
      - Did not claim a line-coverage percentage; source-to-test pairing is not coverage

  - name: Choose the polyglot engine for a mixed C# and TypeScript repository
    prompt: >
      This repository has a C# service under src/Store and a TypeScript cart
      under src/cart, with tests in tests/. Which sources have no tests? Use one
      analysis pass over the whole repository — do not build, install packages,
      or run tests.
    tags:
      capability: polyglot-engine-selection
      risk: single-language-blind-spot
      journey: audit-mixed-language-repository
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-untested-sources-polyglot-csharp-typescript"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The repository mixes a C# service under `src/Store` and a TypeScript cart under `src/cart`, so this is not C#-only. I used the polyglot tree-sitter pairing engine, not the C#-only Roslyn engine, and covered both languages in a single pass.

              ### Unpaired sources

              - `src/Store/OrderProcessor.cs` (`OrderProcessor`) — no C# test references it.
              - `src/cart/tax.ts` — no `tax.test.ts` / `tax.spec.ts` module references it.

              ### Already paired (no action)

              - `src/Store/CustomerService.cs` → `tests/Store.Tests/CustomerServiceTests.cs`.
              - `src/cart/pricing.ts` → `tests/cart/pricing.test.ts`. Both are covered and excluded from the worklist.

              ### Suggested test paths

              - C#: `tests/Store.Tests/OrderProcessorTests.cs` (existing `tests/Store.Tests/` convention).
              - TypeScript: `tests/cart/tax.test.ts` (beside the other cart tests).

              This is a static source-to-test pairing heuristic, not line or branch coverage — I did not build, install packages, or run any test, so I cannot state actual exercised lines.
    environment:
      files:
        - src: fixtures/pairing-repo
          dest: .
        - src: fixtures/typescript-pairing/src/cart/pricing.ts
          dest: src/cart/pricing.ts
        - src: fixtures/typescript-pairing/src/cart/tax.ts
          dest: src/cart/tax.ts
        - src: fixtures/typescript-pairing/tests/cart/pricing.test.ts
          dest: tests/cart/pricing.test.ts
    graders:
      - type: output-matches
        config:
          pattern: OrderProcessor
      - type: output-matches
        config:
          pattern: tax\.ts
      - type: output-not-matches
        config:
          pattern: (?i)pricing\.ts.{0,100}(untested|unpaired|no test)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?(?:dotnet\s+(?:build|test)|npm|pnpm|yarn)\b
      - type: output-matches
        config:
          pattern: (?is)(?=.*\bstatic\b)(?=.*\b(?:pairing|heuristic)\b)(?=.*\b(?:line|branch)\b)(?=.*\bcoverage\b)(?=.*\b(?:not|isn't|doesn't|unknown|unverified|cannot)\b)
      - type: prompt
    rubric:
      - Recognised the repository is not C#-only and therefore used the polyglot tree-sitter engine rather than the C#-only Roslyn engine
      - Covered both languages in a single analysis pass instead of reporting only the C# half or only the TypeScript half
      - Reported OrderProcessor.cs and tax.ts as the unpaired sources
      - Did not report CustomerService.cs or pricing.ts as untested, and named the tests that cover them
      - Suggested test paths that follow each language's existing convention (tests/Store.Tests/ for C#, a .test.ts beside the other cart tests)
      - Did not run dotnet build, dotnet test, or a package manager — this is static pairing analysis
      - Labelled the result a static pairing heuristic rather than line or branch coverage
