name: find-untested-sources
description: Evaluates the dotnet-test/find-untested-sources skill
type: capability
config:
  timeout: 5m
stimuli:
  - name: Identify unpaired C# source files and suggest a test location
    prompt: |
      Find the C# source files under PairingRepo that have no test file
      referencing their declared types. Prioritize the largest untested file and
      tell me where its test file should go. I only need the static pairing
      result; do not build the projects or collect coverage.
    environment:
      files:
        - src: fixtures/pairing-repo/src/Store/Store.csproj
          dest: PairingRepo/src/Store/Store.csproj
        - src: fixtures/pairing-repo/src/Store/CustomerService.cs
          dest: PairingRepo/src/Store/CustomerService.cs
        - src: fixtures/pairing-repo/src/Store/OrderProcessor.cs
          dest: PairingRepo/src/Store/OrderProcessor.cs
        - src: fixtures/pairing-repo/tests/Store.Tests/Store.Tests.csproj
          dest: PairingRepo/tests/Store.Tests/Store.Tests.csproj
        - src: fixtures/pairing-repo/tests/Store.Tests/CustomerServiceTests.cs
          dest: PairingRepo/tests/Store.Tests/CustomerServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: OrderProcessor\.cs
      - type: output-matches
        config:
          pattern: PairingRepo[\\/]tests[\\/]Store\.Tests[\\/]OrderProcessorTests\.cs
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:build|test)\b
      - type: output-matches
        config:
          pattern: (?i)static.{0,80}(?:pairing|heuristic)
      - type: output-matches
        config:
          pattern: (?i)(?:not|isn't|doesn't).{0,80}(?:line|branch).{0,40}coverage
      - type: exit-success
      - type: prompt
    rubric:
      - Correctly identified OrderProcessor.cs as untested while recognizing that CustomerService.cs is paired with CustomerServiceTests.cs
      - Suggested PairingRepo/tests/Store.Tests/OrderProcessorTests.cs using the existing project-reference relationship
      - Returned the requested source-to-test result without performing an unnecessary build or coverage run
  - name: Identify unpaired Python source files and suggest a test location
    prompt: |
      Use static source-to-test pairing to find the untested Python modules in
      this small package and suggest pytest file locations for them. I only need
      the pairing result; do not run tests or collect coverage.
    environment:
      files:
        - src: fixtures/python-package/src/store/pricing.py
          dest: src/store/pricing.py
    graders:
      - type: output-matches
        config:
          pattern: pricing\.py
      - type: output-matches
        config:
          pattern: test_pricing\.py
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?(?:python(?:3)?\s+-m\s+)?pytest(?:\s+[^\r\n]*)?\s*$
      - type: output-not-matches
        config:
          pattern: (?i)(coverage\s+(?:run|report)|pytest-cov)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified src/store/pricing.py as the Python module without a corresponding test
      - Suggested a pytest-compatible location ending in test_pricing.py
      - Returned a useful pairing result for the Python package without running tests or collecting coverage

  - name: Disambiguate duplicate C# type names by namespace
    prompt: |
      Find the C# source file under NamespaceCollision that is not referenced by
      any test and suggest the exact test path in the existing test project. Do
      not build or collect coverage.
    environment:
      files:
        - src: fixtures/namespace-collision/src/NamespaceCollision/NamespaceCollision.csproj
          dest: NamespaceCollision/src/NamespaceCollision/NamespaceCollision.csproj
        - src: fixtures/namespace-collision/src/NamespaceCollision/Alpha/Settings.cs
          dest: NamespaceCollision/src/NamespaceCollision/Alpha/Settings.cs
        - src: fixtures/namespace-collision/src/NamespaceCollision/Beta/Settings.cs
          dest: NamespaceCollision/src/NamespaceCollision/Beta/Settings.cs
        - src: fixtures/namespace-collision/tests/NamespaceCollision.Tests/NamespaceCollision.Tests.csproj
          dest: NamespaceCollision/tests/NamespaceCollision.Tests/NamespaceCollision.Tests.csproj
        - src: fixtures/namespace-collision/tests/NamespaceCollision.Tests/AlphaSettingsTests.cs
          dest: NamespaceCollision/tests/NamespaceCollision.Tests/AlphaSettingsTests.cs
    graders:
      - type: output-matches
        config:
          pattern: Beta[\\/]Settings\.cs
      - type: output-matches
        config:
          pattern: (?:NamespaceCollision[\\/])?tests[\\/]NamespaceCollision\.Tests[\\/]Beta[\\/]SettingsTests\.cs
      - type: output-not-matches
        config:
          pattern: (?i)Alpha[\\/]Settings\.cs.{0,100}(untested|unpaired|no test)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:build|test)\b
      - type: exit-success
      - type: prompt
    rubric:
      - Correctly paired Alpha/Settings.cs to AlphaSettingsTests.cs using the Alpha.Configuration namespace
      - Correctly identified Beta/Settings.cs as unpaired despite its duplicate short type name
      - Suggested NamespaceCollision/tests/NamespaceCollision.Tests/Beta/SettingsTests.cs in the referencing test project

  - name: Identify an unpaired TypeScript module
    prompt: |
      Identify the TypeScript source module under TypeScriptPairing that has no
      corresponding test reference and suggest a test file location. Return only
      a static pairing result; do not install packages or run tests.
    environment:
      files:
        - src: fixtures/typescript-pairing/src/cart/pricing.ts
          dest: TypeScriptPairing/src/cart/pricing.ts
        - src: fixtures/typescript-pairing/src/cart/tax.ts
          dest: TypeScriptPairing/src/cart/tax.ts
        - src: fixtures/typescript-pairing/tests/cart/pricing.test.ts
          dest: TypeScriptPairing/tests/cart/pricing.test.ts
    graders:
      - type: output-matches
        config:
          pattern: tax\.ts
      - type: output-matches
        config:
          pattern: tax\.(test|spec)\.ts
      - type: output-not-matches
        config:
          pattern: (?i)pricing\.ts.{0,100}(untested|unpaired|no test)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?(?:npm|pnpm|yarn)\s+(?:ci|install|test|run\s+test)\b
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that pricing.ts is paired with pricing.test.ts
      - Identified tax.ts as the only unpaired source module
      - Suggested a conventional TypeScript test filename for tax.ts without running the test suite

  - name: Identify an unpaired Go source file
    prompt: |
      Find the Go source file under GoPairing that has no test referencing its
      declarations and suggest the matching _test.go location. Use static
      pairing only; do not run go test.
    environment:
      files:
        - src: fixtures/go-pairing/go.mod
          dest: GoPairing/go.mod
        - src: fixtures/go-pairing/pricing.go
          dest: GoPairing/pricing.go
        - src: fixtures/go-pairing/discount.go
          dest: GoPairing/discount.go
        - src: fixtures/go-pairing/pricing_test.go
          dest: GoPairing/pricing_test.go
    graders:
      - type: output-matches
        config:
          pattern: discount\.go
      - type: output-matches
        config:
          pattern: discount_test\.go
      - type: output-not-matches
        config:
          pattern: (?i)pricing\.go.{0,100}(untested|unpaired|no test)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?go\s+test\b
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that pricing.go is paired with pricing_test.go
      - Identified discount.go as the only unpaired source file
      - Suggested discount_test.go without building or running the package
