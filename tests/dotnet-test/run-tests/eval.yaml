name: run-tests
description: Evaluates the dotnet-test/run-tests skill
type: capability
executionShard: execution
# Run 31083033945 exhausted the monolithic plugin step after 233/234 trajectories.
# Two tied scenarios were removed as duplicates. Three unique but expensive
# multi-TFM, NUnit, and VSTest-TRX paths were replaced by focused no-tool
# stimuli. The unchanged retained set measured 10W/1T and the full eval still
# covers classic, VSTest, bridged/native MTP, xUnit, NUnit, TUnit, framework
# selection, combined filters, diagnostics, TRX, and props detection.
defaults:
  timeout: 6m
stimuli:
  - name: Preserve the runner for a classic packages.config project
    prompt: |
      How should I build and run the tests in this project? It is a classic
      net472 project and I do not want to migrate or upgrade it.
    environment:
      files:
        - src: fixtures/classic-mstest
          dest: .
    graders:
      - type: output-matches
        config:
          pattern: (?i)(MSBuild(\.exe)?|repository.*(script|command))
      - type: output-matches
        config:
          pattern: (?i)(vstest\.console(\.exe)?|MSTest\.exe|test runner)
      - type: prompt
    rubric:
      - Recognizes the ToolsVersion, explicit compile items, and packages.config as a classic non-SDK project
      - Does not assume dotnet test is a valid replacement or suggest migrating the project
      - Recommends using the repository's existing build/test script when present, otherwise full MSBuild followed by the compatible VSTest or MSTest runner
      - States that the Visual Studio/MSBuild test toolchain is required and does not claim tests ran when it is unavailable
  - name: Run tests in a VSTest MSTest project
    prompt: I need to run all the tests in this project. Can you help me?
    environment:
      files:
        - src: fixtures/vstest-mstest/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/vstest-mstest/OrderServiceTests.cs
          dest: OrderServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: (?i)passed\s*[:=]\s*\d+
      - type: output-matches
        config:
          pattern: (?i)failed\s*[:=]\s*\d+
      - type: output-matches
        config:
          pattern: (?i)skipped\s*[:=]\s*\d+
      - type: exit-success
      - type: prompt
    rubric:
      - Identifies the project as a VSTest project (Microsoft.NET.Test.Sdk + MSTest.TestAdapter)
      - Uses 'dotnet test' without MTP-specific arguments or '--' separator
      - Does not suggest MTP-style arguments like --report-trx or --treenode-filter
      - Reports passed, failed, and skipped test counts from the completed run
    constraints:
      expect_tools:
        - bash
  - name: Select one target framework in a multi-targeted project
    prompt: |
      This project targets `<TargetFrameworks>net8.0;net9.0</TargetFrameworks>`.
      Give me the exact `dotnet test` command that runs only net9.0. Do not run
      anything.
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: --framework\s+net9\.0
      - type: prompt
    rubric:
      - Used --framework net9.0 rather than running every target framework
      - Kept --framework as a dotnet test/MSBuild option rather than forwarding it as a test-platform argument
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter one NUnit class on VSTest
    prompt: |
      An SDK-style project references Microsoft.NET.Test.Sdk, NUnit 4, and
      NUnit3TestAdapter, with no MTP runner signals. Give me the exact
      `dotnet test` command that runs `ReportExporterTests` but not
      `ReportGeneratorTests`. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: --filter
      - type: output-matches
        config:
          pattern: FullyQualifiedName~ReportExporterTests
      - type: prompt
    rubric:
      - Identified VSTest from Microsoft.NET.Test.Sdk plus NUnit3TestAdapter without MTP signals
      - Used the NUnit-supported FullyQualifiedName VSTest filter to target ReportExporterTests
      - Did not use MTP-specific flags such as --filter-class
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Generate TRX from a VSTest project
    prompt: |
      An SDK-style MSTest project references Microsoft.NET.Test.Sdk and
      MSTest.TestAdapter, with no MTP runner or bridge properties. Give me the
      exact command to run its tests and write a TRX report. Do not run it.
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: --logger.*(trx|"trx")
      - type: output-not-contains
        config:
          substring: --report-trx
      - type: prompt
    rubric:
      - Identified the project as VSTest rather than MTP
      - Used --logger trx and did not use the MTP-only --report-trx flag
      - Did not add the MTP argument separator
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Collect a hang dump on an MTP project (SDK 10)
    prompt: >
      My tests are occasionally hanging. I want to run them with dotnet test using
      a hang timeout of 5 minutes to detect the culprit. Here's my project. Give
      me the exact command, but do not run anything.
    environment:
      files:
        - src: fixtures/mtp-mstest-sdk10/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-mstest-sdk10/CatalogServiceTests.cs
          dest: CatalogServiceTests.cs
        - src: fixtures/mtp-mstest-sdk10/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test(?=[^\r\n]*--hangdump(?:\s|$))(?=[^\r\n]*--hangdump-timeout\s+(?:5min|300s|00:05:00)(?:\s|$))[^\r\n]*$
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--blame
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--(?:\s|$)
      - type: prompt
    rubric:
      - Detects MTP via the global.json runner setting (Microsoft.Testing.Platform)
      - Recognizes that SDK 10 passes MTP arguments directly without '--' separator
      - Uses '--hangdump --hangdump-timeout 5min' or equivalent directly, not after '--'
      - Does not use the VSTest-only '--blame-hang' options
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Enable a diagnostic log for a VSTest project
    prompt: |
      An SDK-style test project uses Microsoft.NET.Test.Sdk and MSTest.TestAdapter
      with no MTP runner signals. Give me the exact `dotnet test` command that
      writes a diagnostic log to `artifacts/vstest.log`. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*(?:-d|--diag)\s+["'']?artifacts[/\\]vstest\.log["'']?(?:\s|$)'
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--diagnostic(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--(?:\s|$)
      - type: prompt
    rubric:
      - Uses the VSTest diagnostic-log option with the requested output path
      - Does not use the MTP diagnostic options for a VSTest project
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Enable diagnostic logs for a native MTP project
    prompt: |
      A .NET 10 project uses native Microsoft.Testing.Platform mode. Give me the
      exact `dotnet test` command that enables diagnostic logging and writes the
      logs under `artifacts/diagnostics`. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--diagnostic(?:\s|$)
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--diagnostic-output-directory\s+(?:["'']artifacts[/\\]diagnostics["'']|artifacts[/\\]diagnostics)(?:\s|$)'
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--diag(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--(?:\s|$)
      - type: prompt
    rubric:
      - Uses the native MTP diagnostic options and requested output directory
      - Does not use the VSTest diagnostic-log option
      - Does not insert the VSTest-to-MTP argument separator in native mode
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter xUnit v3 tests by class on MTP
    prompt: >
      I need to run only the ShoppingCartTests class using dotnet test, not the
      InventoryServiceTests. Inspect the project if needed and give me the exact
      command, but do not build or run anything.
    environment:
      files:
        - src: fixtures/mtp-xunit-v3/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-xunit-v3/ShoppingCartTests.cs
          dest: ShoppingCartTests.cs
        - src: fixtures/mtp-xunit-v3/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: --filter-class
      - type: output-matches
        config:
          pattern: ShoppingCartTests
      - type: prompt
    rubric:
      - Detects xUnit v3 on MTP (xunit.v3 package + TestingPlatformDotnetTestSupport)
      - Uses --filter-class instead of the VSTest --filter expression syntax
      - xUnit v3 on MTP does NOT support the VSTest --filter "ClassName=..." syntax
      - Correctly passes the filter after '--' separator since this is SDK 9
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter xUnit v3 tests by trait on MTP
    prompt: >
      I want to run only the tests with the Category=Integration trait in this
      xUnit project using dotnet test. Give me the exact command without running
      it.
    environment:
      files:
        - src: fixtures/mtp-xunit-v3/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-xunit-v3/ShoppingCartTests.cs
          dest: ShoppingCartTests.cs
        - src: fixtures/mtp-xunit-v3/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: --filter-trait
      - type: output-matches
        config:
          pattern: Category=Integration
      - type: prompt
    rubric:
      - Detects xUnit v3 on MTP from the project references
      - Uses --filter-trait "Category=Integration" instead of VSTest --filter "Traits.Category=Integration"
      - xUnit v3 on MTP requires framework-specific filter flags, not VSTest expression syntax
      - Correctly handles the '--' separator for SDK 9
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter xUnit v3 tests by class pattern and trait using query filter language
    prompt: >
      I have an xUnit v3 project with several test classes. I need to run only
      the Smoke tests from classes whose name contains 'Integration' — I want a
      single combined filter expression for dotnet test rather than separate
      flags. Show the command but do not run it.
    environment:
      files:
        - src: fixtures/mtp-xunit-v3/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-xunit-v3-query/EcommerceTests.cs
          dest: EcommerceTests.cs
        - src: fixtures/mtp-xunit-v3/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: --\s+--filter-query
      - type: output-matches
        config:
          pattern: '--filter-query\s+(?:"(?=[^"]*Integration)(?=[^"]*\[Category=Smoke\])[^"]+"|''(?=[^'']*Integration)(?=[^'']*\[Category=Smoke\])[^'']+'')'
      - type: prompt
    rubric:
      - Recognized that xUnit v3 on MTP supports a query filter language for complex combined expressions
      - Uses SDK 9 MTP argument passing with '-- --filter-query'
      - Produced a filter-query expression that combines a class name pattern with a trait filter in square brackets
      - The expression correctly targets only Smoke tests from integration test classes, not all Smoke tests or all integration tests
      - Used the path-segment syntax with wildcard segments and a trait qualifier like [Category=Smoke]
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter TUnit tests by class using treenode-filter
    prompt: >
      I want to run only the SmsNotificationTests from this TUnit project using
      dotnet test. What's the exact command? Do not run it.
    environment:
      files:
        - src: fixtures/mtp-tunit/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-tunit/NotificationTests.cs
          dest: NotificationTests.cs
    graders:
      - type: output-matches
        config:
          pattern: --treenode-filter
      - type: output-matches
        config:
          pattern: SmsNotificationTests
      - type: prompt
    rubric:
      - Identifies TUnit as MTP-only (no VSTest support)
      - Uses --treenode-filter with the path-based syntax to filter by class name
      - Uses the correct wildcard pattern like /*/*/SmsNotificationTests/*
      - Does not use VSTest --filter syntax which is incompatible with TUnit
      - Uses 'dotnet run' or 'dotnet test' with correct MTP argument passing
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Combine multiple filter criteria on VSTest MSTest
    prompt: >
      I want to run only the unit tests in the OrderServiceTests class using
      dotnet test. How do I combine these two filter conditions? Give me the
      command without running it.
    environment:
      files:
        - src: fixtures/vstest-mstest/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/vstest-mstest/OrderServiceTests.cs
          dest: OrderServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: --filter
      - type: output-matches
        config:
          pattern: TestCategory=Unit
      - type: output-matches
        config:
          pattern: OrderServiceTests
      - type: output-contains
        config:
          substring: "&"
      - type: prompt
    rubric:
      - Combines ClassName and TestCategory filters using the '&' (AND) operator
      - 'Uses correct VSTest expression syntax: --filter "ClassName~OrderServiceTests&TestCategory=Unit"'
      - Does not suggest running all tests and post-filtering results
      - Explains the AND/OR combinator syntax for future reference
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Collect a crash dump on an MTP project (SDK 9)
    prompt: >
      I want to run these tests with dotnet test and collect a crash dump if any
      test crashes the host. Give me the exact command without running it.
    environment:
      files:
        - src: fixtures/mtp-mstest-sdk9/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-mstest-sdk9/UserAuthTests.cs
          dest: UserAuthTests.cs
        - src: fixtures/mtp-mstest-sdk9/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--\s+--crashdump(?:\s|$)
      - type: prompt
    rubric:
      - Detects TestingPlatformDotnetTestSupport in the csproj indicating MTP
      - Recognizes that SDK 9 requires MTP arguments after the '--' separator
      - "Places --crashdump after the '--' separator: 'dotnet test -- --crashdump'"
      - Does not use the VSTest-only '--blame-crash' flag for this MTP project
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: MTP project on SDK 10 passes args directly
    prompt: >
      Give me the exact dotnet test command that produces a TRX report for this
      project, but do not run it.
    environment:
      files:
        - src: fixtures/mtp-mstest-sdk10/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-mstest-sdk10/CatalogServiceTests.cs
          dest: CatalogServiceTests.cs
        - src: fixtures/mtp-mstest-sdk10/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: --report-trx
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--\s+--report-trx(?:\s|$)
      - type: prompt
    rubric:
      - Detects MTP via global.json runner setting and SDK 10
      - Passes --report-trx directly without the '--' separator
      - Uses the SDK 10+ dotnet test syntax (e.g., --project flag instead of bare positional argument)
      - Does not use VSTest-style '--logger trx' for an MTP project on SDK 10
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Run one VSTest invocation without rebuilding
    prompt: |
      Give me the exact command for one normal SDK-style VSTest run that skips
      rebuilding. This is not a watch or hot-reload loop. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--no-build(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:run|watch)(?:\s|$)
      - type: prompt
    rubric:
      - Keeps the one-time request in run-tests rather than routing to a persistent hot-reload loop
      - Uses dotnet test with --no-build
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter NUnit tests on an SDK 9 MTP bridge
    prompt: |
      An SDK 9 NUnit project enables the MTP NUnit runner and sets
      TestingPlatformDotnetTestSupport=true. Give me the exact dotnet test
      command that runs only Category=Integration. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--\s+--filter\s+["'']?TestCategory=Integration["'']?(?:\s|$)'
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--filter-class
      - type: prompt
    rubric:
      - Uses the generic MTP NUnit filter expression for TestCategory=Integration
      - Places --filter after the bridge separator because SDK 9 uses VSTest command mode
      - Does not use xUnit-specific filter flags
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Collect coverage with VSTest
    prompt: |
      Give me the exact command to run an SDK-style VSTest project and collect
      code coverage. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test(?![^\r\n]*\s--(?:\s|$))[^\r\n]*--collect(?:\s+|:)["'']Code Coverage["''](?:\s|$)'
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--coverage(?:\s|$)
      - type: prompt
    rubric:
      - Uses the VSTest --collect "Code Coverage" option
      - Does not use the MTP-only --coverage flag or bridge separator
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Collect coverage on an SDK 9 MTP bridge
    prompt: |
      An SDK 9 project has an enabled MTP runner and
      TestingPlatformDotnetTestSupport=true. Give me the exact dotnet test
      command that collects code coverage. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--\s+--coverage(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--collect
      - type: prompt
    rubric:
      - Uses the MTP --coverage option
      - Places --coverage after the bridge separator because SDK 9 uses VSTest command mode
      - Does not use the VSTest --collect option
      - Does not build or run tests for this command-only request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Detect test platform from Directory.Build.props
    prompt: >
      I want to run the integration tests in this project with dotnet test. Can
      you figure out which test platform it uses and run them?
    environment:
      files:
        - src: ./fixtures/detect-test-platform-from-directory-build-props/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/detect-test-platform-from-directory-build-props/Directory.Build.props
          dest: Directory.Build.props
        - src: ./fixtures/detect-test-platform-from-directory-build-props/global.json
          dest: global.json
        - src: ./fixtures/detect-test-platform-from-directory-build-props/ServiceTests.cs
          dest: ServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (MTP|Microsoft\.Testing\.Platform|TestingPlatformDotnetTestSupport)
      - type: output-matches
        config:
          pattern: --filter.*TestCategory=Integration
      - type: output-matches
        config:
          pattern: -- --filter
      - type: exit-success
      - type: prompt
    rubric:
      - Reads Directory.Build.props (not just the csproj) and finds TestingPlatformDotnetTestSupport=true
      - Correctly identifies this as an MTP project even though the csproj alone looks like VSTest
      - Uses MSTest filter syntax for TestCategory since MSTest on MTP uses the same filter syntax as VSTest
      - "Uses '--' separator before MTP filter args since this is SDK 9: 'dotnet test -- --filter
        TestCategory=Integration'"
    constraints:
      expect_tools:
        - bash
