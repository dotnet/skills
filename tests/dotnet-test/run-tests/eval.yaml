name: run-tests
description: Evaluates the dotnet-test/run-tests skill
type: capability
executionShard: execution
# Run 31083033945 exhausted the monolithic plugin step after 233/234 trajectories.
# Two tied scenarios were removed as duplicates. Three unique but expensive
# multi-TFM, NUnit, and VSTest-TRX paths were replaced by focused no-tool
# stimuli. The unchanged retained set measured 10W/1T and the full eval still
# covers classic, VSTest, bridged/native MTP, xUnit, NUnit, TUnit, framework
# selection, combined filters, diagnostics, TRX, and props detection.
defaults:
  timeout: 6m
stimuli:
  - name: Preserve the runner for a classic packages.config project
    prompt: |
      How should I build and run the tests in this project? It is a classic
      net472 project and I do not want to migrate or upgrade it.
    environment:
      files:
        - src: fixtures/classic-mstest
          dest: .
    graders:
      - type: output-matches
        config:
          pattern: (?i)(MSBuild(\.exe)?|repository.*(script|command))
      - type: output-matches
        config:
          pattern: (?i)(vstest\.console(\.exe)?|MSTest\.exe|test runner)
      - type: prompt
    rubric:
      - Gives a repository-compatible build-and-test sequence for the classic project
      - Does not substitute a modern project workflow or propose an unrequested migration
      - Does not claim execution succeeded when the required toolchain is unavailable
  - name: Run tests in a VSTest MSTest project
    prompt: I need to run all the tests in this project. Can you help me?
    environment:
      files:
        - src: fixtures/vstest-mstest/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/vstest-mstest/OrderServiceTests.cs
          dest: OrderServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: (?i)(?:passed\s*[:=]\s*\d+|\d+\s+passed)
      - type: output-matches
        config:
          pattern: (?i)(?:failed\s*[:=]\s*\d+|\d+\s+failed)
      - type: output-matches
        config:
          pattern: (?i)(?:skipped\s*[:=]\s*\d+|\d+\s+skipped)
      - type: exit-success
      - type: prompt
    rubric:
      - Executes the configured test project through its compatible runner
      - Reports passed, failed, and skipped test counts from the completed run
    constraints:
      expect_tools:
        - bash
  - name: Select one target framework in a multi-targeted project
    prompt: |
      This project targets `<TargetFrameworks>net8.0;net9.0</TargetFrameworks>`.
      Give me the exact `dotnet test` command that runs only net9.0. Do not run
      anything.
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: --framework\s+net9\.0
      - type: prompt
    rubric:
      - Gives one runnable command that executes only the requested target framework
      - Does not run or modify the project
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter one NUnit class on VSTest
    prompt: |
      An SDK-style project references Microsoft.NET.Test.Sdk, NUnit 4, and
      NUnit3TestAdapter, with no MTP runner signals. Give me the exact
      `dotnet test` command that runs `ReportExporterTests` but not
      `ReportGeneratorTests`. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: --filter
      - type: output-matches
        config:
          pattern: FullyQualifiedName~ReportExporterTests
      - type: prompt
    rubric:
      - Gives one runnable command that selects the requested NUnit class and excludes the similarly named class
      - The command matches the project's configured test platform without running or modifying it
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Generate TRX from a VSTest project
    prompt: |
      An SDK-style MSTest project references Microsoft.NET.Test.Sdk and
      MSTest.TestAdapter, with no MTP runner or bridge properties. Give me the
      exact command to run its tests and write a TRX report. Do not run it.
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: --logger.*(trx|"trx")
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--report-trx(?:\s|$)
      - type: prompt
    rubric:
      - Gives one runnable command that produces the requested TRX report for the configured project
      - Does not mix command syntax from a different test platform or execute the command
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Collect a hang dump on an MTP project (SDK 10)
    prompt: >
      My tests are occasionally hanging. I want to run them with dotnet test using
      a hang timeout of 5 minutes to detect the culprit. Here's my project. Give
      me the exact command, but do not run anything.
    environment:
      files:
        - src: fixtures/mtp-mstest-sdk10/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-mstest-sdk10/CatalogServiceTests.cs
          dest: CatalogServiceTests.cs
        - src: fixtures/mtp-mstest-sdk10/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test(?=[^\r\n]*--hangdump(?:\s|$))(?=[^\r\n]*--hangdump-timeout\s+(?:5m|5min|300s|00:05:00)(?:\s|$))[^\r\n]*$
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--blame
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--(?:\s|$)
      - type: prompt
    rubric:
      - Gives one runnable command that collects a hang dump after the requested timeout
      - The command matches the configured native test mode and does not mix syntax from another platform
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Enable a diagnostic log for a VSTest project
    prompt: |
      An SDK-style test project uses Microsoft.NET.Test.Sdk and MSTest.TestAdapter
      with no MTP runner signals. Give me the exact `dotnet test` command that
      writes a diagnostic log to `artifacts/vstest.log`. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*(?:-d|--diag)\s+["'']?artifacts[/\\]vstest\.log["'']?(?:\s|$)'
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--diagnostic(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--(?:\s|$)
      - type: prompt
    rubric:
      - Gives one exact command that writes diagnostic output to the requested path
      - The command matches the stated test platform and is not executed
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Enable diagnostic logs for a native MTP project
    prompt: |
      A .NET 10 project at `Tests.csproj` uses native
      Microsoft.Testing.Platform mode. Give me the exact `dotnet test` command
      that enables diagnostic logging and writes the logs under
      `artifacts/diagnostics`. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test(?=[^\r\n]*--project\s+["'']?Tests\.csproj["'']?(?:\s|$))[^\r\n]*$'
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--diagnostic(?:\s|$)
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--diagnostic-output-directory\s+(?:["'']artifacts[/\\]diagnostics["'']|artifacts[/\\]diagnostics)(?:\s|$)'
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s(?:-d|--diag)(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*(?:<[^>\r\n]+>|path[/\\]to[/\\])
      - type: prompt
    rubric:
      - Gives one exact command that enables diagnostics under the requested directory
      - The command matches native test mode and is not executed
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter xUnit v3 tests by class on MTP
    prompt: >
      I need to run only the ShoppingCartTests class using dotnet test, not the
      InventoryServiceTests. Inspect the project if needed and give me the exact
      command, but do not build or run anything.
    environment:
      files:
        - src: fixtures/mtp-xunit-v3/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-xunit-v3/ShoppingCartTests.cs
          dest: ShoppingCartTests.cs
        - src: fixtures/mtp-xunit-v3/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test(?=[^\r\n]*\s--\s+--filter-class(?:\s|$))(?=[^\r\n]*ShoppingCartTests)[^\r\n]*$
      - type: output-matches
        config:
          pattern: ShoppingCartTests
      - type: prompt
    rubric:
      - Gives one runnable command that selects only the requested xUnit class
      - The command matches the project's framework, platform, and SDK mode without being executed
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter xUnit v3 tests by trait on MTP
    prompt: >
      I want to run only the tests with the Category=Integration trait in this
      xUnit project using dotnet test. Give me the exact command without running
      it.
    environment:
      files:
        - src: fixtures/mtp-xunit-v3/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-xunit-v3/ShoppingCartTests.cs
          dest: ShoppingCartTests.cs
        - src: fixtures/mtp-xunit-v3/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--\s+--filter-trait\s+["'']?Category=Integration["'']?(?:\s|$)'
      - type: output-matches
        config:
          pattern: Category=Integration
      - type: prompt
    rubric:
      - Gives one runnable command that selects only tests carrying the requested xUnit trait
      - The command matches the project's framework, platform, and SDK mode without being executed
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter xUnit v3 tests by class pattern and trait using query filter language
    prompt: >
      I have an xUnit v3 project with several test classes. I need to run only
      the Smoke tests from classes whose name contains 'Integration' — I want a
      single combined filter expression for dotnet test rather than separate
      flags. Show the command but do not run it.
    environment:
      files:
        - src: fixtures/mtp-xunit-v3/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-xunit-v3-query/EcommerceTests.cs
          dest: EcommerceTests.cs
        - src: fixtures/mtp-xunit-v3/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--\s+--filter-query(?:\s|$)
      - type: output-matches
        config:
          pattern: '--filter-query\s+(?:"(?=[^"]*Integration)(?=[^"]*\[Category=Smoke\])[^"]+"|''(?=[^'']*Integration)(?=[^'']*\[Category=Smoke\])[^'']+'')'
      - type: prompt
    rubric:
      - The expression correctly targets only Smoke tests from integration test classes, not all Smoke tests or all integration tests
      - Gives one runnable command matching the project's framework, platform, and SDK mode
      - Does not build or run the project
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter TUnit tests by class using treenode-filter
    prompt: >
      I want to run only the SmsNotificationTests from this TUnit project using
      dotnet test. What's the exact command? Do not run it.
    environment:
      files:
        - src: fixtures/mtp-tunit/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-tunit/NotificationTests.cs
          dest: NotificationTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:run|test)(?=[^\r\n]*--treenode-filter(?:\s|$))(?=[^\r\n]*SmsNotificationTests)[^\r\n]*$
      - type: output-matches
        config:
          pattern: SmsNotificationTests
      - type: prompt
    rubric:
      - Gives one runnable command that selects only the requested TUnit class
      - The command matches the framework's supported runner and filter behavior without being executed
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Combine multiple filter criteria on VSTest MSTest
    prompt: >
      I want to run only the unit tests in the OrderServiceTests class using
      dotnet test. How do I combine these two filter conditions? Give me the
      command without running it.
    environment:
      files:
        - src: fixtures/vstest-mstest/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/vstest-mstest/OrderServiceTests.cs
          dest: OrderServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test(?=[^\r\n]*--filter(?:\s|=|:))(?=[^\r\n]*TestCategory=Unit)(?=[^\r\n]*OrderServiceTests)(?=[^\r\n]*&)[^\r\n]*$'
      - type: output-matches
        config:
          pattern: TestCategory=Unit
      - type: output-matches
        config:
          pattern: OrderServiceTests
      - type: output-contains
        config:
          substring: "&"
      - type: prompt
    rubric:
      - Does not suggest running all tests and post-filtering results
      - Gives one runnable command whose filter selects only tests satisfying both requested conditions
      - Does not build or run the project
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Collect a crash dump on an MTP project (SDK 9)
    prompt: >
      I want to run these tests with dotnet test and collect a crash dump if any
      test crashes the host. Give me the exact command without running it.
    environment:
      files:
        - src: fixtures/mtp-mstest-sdk9/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-mstest-sdk9/UserAuthTests.cs
          dest: UserAuthTests.cs
        - src: fixtures/mtp-mstest-sdk9/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--\s+--crashdump(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--blame-crash(?:\s|$)
      - type: prompt
    rubric:
      - Gives one runnable command that collects a crash dump if the configured test host crashes
      - The command matches the project's platform and SDK mode without mixing incompatible options
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: MTP project on SDK 10 passes args directly
    prompt: >
      Give me the exact dotnet test command that produces a TRX report for this
      project, but do not run it.
    environment:
      files:
        - src: fixtures/mtp-mstest-sdk10/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-mstest-sdk10/CatalogServiceTests.cs
          dest: CatalogServiceTests.cs
        - src: fixtures/mtp-mstest-sdk10/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: --report-trx
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--\s+--report-trx(?:\s|$)
      - type: prompt
    rubric:
      - Gives one runnable command that produces the requested TRX report
      - The command matches the configured native test mode without mixing syntax from another platform
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Run one VSTest invocation without rebuilding
    prompt: |
      Give me the exact command for one normal SDK-style VSTest run that skips
      rebuilding. This is not a watch or hot-reload loop. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--no-build(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:run|watch)(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*(?:<[^>\r\n]+>|path[/\\]to[/\\])
      - type: prompt
    rubric:
      - Treats the request as a one-time command and does not propose a persistent edit/re-run loop
      - Gives one runnable command that skips rebuilding for the current project or solution
      - Does not execute the command
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Filter NUnit tests on an SDK 9 MTP bridge
    prompt: |
      An SDK 9 NUnit project enables the MTP NUnit runner and sets
      TestingPlatformDotnetTestSupport=true with OutputType=Exe. Give me the
      exact dotnet test command that runs only Category=Integration. Do not run
      anything.
    graders:
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--\s+--filter\s+["'']?TestCategory=Integration["'']?(?:\s|$)'
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--filter-class
      - type: prompt
    rubric:
      - Gives one runnable command that selects only the requested NUnit category
      - The command matches the stated runner and SDK mode without being executed
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Collect coverage with VSTest
    prompt: |
      Give me the exact command to run an SDK-style VSTest project and collect
      code coverage. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: '(?im)^\s*(?:[$>]\s*)?dotnet\s+test(?![^\r\n]*\s--(?:\s|$))[^\r\n]*--collect(?:\s+|:)["'']Code Coverage["''](?:\s|$)'
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--coverage(?:\s|$)
      - type: prompt
    rubric:
      - Gives one runnable command that collects code coverage for the stated platform
      - Does not mix syntax from another test platform or execute the command
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Collect coverage on an SDK 9 MTP bridge
    prompt: |
      An SDK 9 project has an enabled MTP runner and
      TestingPlatformDotnetTestSupport=true with OutputType=Exe. Give me the
      exact dotnet test command that collects code coverage. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*\s--\s+--coverage(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+test[^\r\n]*--collect
      - type: prompt
    rubric:
      - Gives one runnable command that collects code coverage through the configured bridge
      - Does not mix syntax from another test platform or execute the command
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Detect test platform from Directory.Build.props
    prompt: >
      I want to run the integration tests in this project with dotnet test. Can
      you figure out which test platform it uses and run them?
    environment:
      files:
        - src: ./fixtures/detect-test-platform-from-directory-build-props/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/detect-test-platform-from-directory-build-props/Directory.Build.props
          dest: Directory.Build.props
        - src: ./fixtures/detect-test-platform-from-directory-build-props/global.json
          dest: global.json
        - src: ./fixtures/detect-test-platform-from-directory-build-props/ServiceTests.cs
          dest: ServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (MTP|Microsoft\.Testing\.Platform|TestingPlatformDotnetTestSupport)
      - type: output-matches
        config:
          pattern: --filter.*TestCategory=Integration
      - type: output-matches
        config:
          pattern: -- --filter
      - type: exit-success
      - type: prompt
    rubric:
      - Gives one runnable command that selects only the requested category using the project's effective imported configuration
      - The command matches the framework, platform, and SDK mode
    constraints:
      expect_tools:
        - bash
