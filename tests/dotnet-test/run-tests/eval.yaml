name: run-tests
description: Evaluates the dotnet-test/run-tests skill
type: capability
executionShard: execution
# Run 31083033945 exhausted the monolithic plugin step after 233/234 trajectories.
# Two tied scenarios were removed as duplicates. Three unique but expensive
# multi-TFM, NUnit, and VSTest-TRX paths were replaced by focused no-tool
# stimuli. The unchanged retained set measured 10W/1T and the full eval still
# covers classic, VSTest, bridged/native MTP, xUnit, NUnit, TUnit, framework
# selection, combined filters, diagnostics, TRX, and props detection.
defaults:
  timeout: 6m
stimuli:
  - name: Preserve the runner for a classic packages.config project
    tags:
      capability: preserve-classic-runner
      risk: high
      journey: run-classic-non-sdk
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-preserve-classic-runner
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is a classic non-SDK project: ToolsVersion 15.0, TargetFrameworkVersion v4.7.2, explicit Compile items, and packages.config restoring MSTest.TestAdapter/TestFramework 3.5.2. `dotnet test` is not a valid way to run it, and I won't migrate or upgrade it.

              Build and run it with the classic Visual Studio toolchain:

              1. If the repository has its own build/test script or command, use that first — it already encodes the right restore and runner steps.
              2. Otherwise restore packages (nuget restore) and build with full MSBuild:
                 msbuild TestProject.csproj /t:Restore;Build /p:Configuration=Debug
              3. Then run the built assembly with the compatible VSTest test runner (vstest.console.exe) or MSTest.exe:
                 vstest.console.exe bin\Debug\Legacy.Tests.dll

              This needs the Visual Studio / MSBuild test toolchain to be installed. If that toolchain is not available in this environment, I cannot run the tests here, and I will not claim they passed.
    prompt: |
      How should I build and run the tests in this project? It is a classic
      net472 project and I do not want to migrate or upgrade it. Give me the
      commands, but do not run or change anything.
    environment:
      files:
        - src: fixtures/classic-mstest
          dest: .
    graders:
      - type: output-matches
        config:
          pattern: (?i)(MSBuild(\.exe)?|repository.*(script|command))
      - type: output-matches
        config:
          pattern: (?i)(vstest\.console(\.exe)?|MSTest\.exe|test runner)
      - type: prompt
    rubric:
      - Recognizes the ToolsVersion, explicit compile items, and packages.config as a classic non-SDK project
      - Does not assume dotnet test is a valid replacement or suggest migrating the project
      - Recommends using the repository's existing build/test script when present, otherwise full MSBuild followed by the compatible VSTest or MSTest runner
      - States that the Visual Studio/MSBuild test toolchain is required and does not claim tests ran when it is unavailable
    constraints:
      reject_tools:
        - bash
        - powershell
        - edit
        - create
  - name: Run tests in a VSTest MSTest project
    tags:
      capability: run-vstest-all
      risk: low
      journey: run-full-suite
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-vstest-mstest
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is a VSTest project: it references Microsoft.NET.Test.Sdk with MSTest.TestAdapter and MSTest.TestFramework, and there are no MTP runner or bridge properties. So run every test with plain VSTest-mode dotnet test:

                 dotnet test

              That restores, builds, and runs all tests in TestProject.csproj through VSTest. Don't add Microsoft.Testing.Platform-only arguments or the `--` separator here — those apply only to MTP projects.
    prompt: I need to run all the tests in this project. Can you help me?
    environment:
      files:
        - src: fixtures/vstest-mstest/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/vstest-mstest/OrderServiceTests.cs
          dest: OrderServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: exit-success
      - type: prompt
    rubric:
      - Identifies the project as a VSTest project (Microsoft.NET.Test.Sdk + MSTest.TestAdapter)
      - Uses 'dotnet test' without MTP-specific arguments or '--' separator
      - Does not suggest MTP-style arguments like --report-trx or --treenode-filter
    constraints:
      expect_tools:
        - bash
  - name: Select one target framework in a multi-targeted project
    tags:
      capability: select-target-framework
      risk: low
      journey: run-single-tfm
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-select-tfm-net9
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              To run only the net9.0 target without touching net8.0, pass the target framework as a dotnet test option:

                 dotnet test --framework net9.0

              --framework (short -f) is a dotnet test / MSBuild option, so it goes before any `--` separator, not forwarded as a test-platform argument. This builds and runs the suite for net9.0 alone. I did not run anything.
    prompt: |
      This project targets `<TargetFrameworks>net8.0;net9.0</TargetFrameworks>`.
      Give me the exact `dotnet test` command that runs only net9.0. Do not run
      anything.
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: --framework\s+net9\.0
      - type: prompt
    rubric:
      - Used --framework net9.0 rather than running every target framework
      - Kept --framework as a dotnet test/MSBuild option rather than forwarding it as a test-platform argument
    constraints:
      reject_tools:
        - bash
        - powershell
        - edit
        - create
  - name: Filter one NUnit class on VSTest
    tags:
      capability: filter-nunit-vstest
      risk: medium
      journey: filter-by-class-vstest
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-filter-nunit-class-vstest
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              The project references Microsoft.NET.Test.Sdk plus NUnit 4 and NUnit3TestAdapter, with no MTP runner signals, so this runs on VSTest. Use the VSTest expression filter that NUnit3TestAdapter supports:

                 dotnet test --filter "FullyQualifiedName~ReportExporterTests"

              The ~ (contains) match on FullyQualifiedName selects ReportExporterTests and leaves ReportGeneratorTests out. Don't use MTP-only flags such as --filter-class here; NUnit on VSTest expects the FullyQualifiedName syntax. I did not run anything.
    prompt: |
      An SDK-style project references Microsoft.NET.Test.Sdk, NUnit 4, and
      NUnit3TestAdapter, with no MTP runner signals. Give me the exact
      `dotnet test` command that runs `ReportExporterTests` but not
      `ReportGeneratorTests`. Do not run anything.
    graders:
      - type: output-matches
        config:
          pattern: --filter
      - type: output-matches
        config:
          pattern: FullyQualifiedName~ReportExporterTests
      - type: prompt
    rubric:
      - Identified VSTest from Microsoft.NET.Test.Sdk plus NUnit3TestAdapter without MTP signals
      - Used the NUnit-supported FullyQualifiedName VSTest filter to target ReportExporterTests
      - Did not use MTP-specific flags such as --filter-class
    constraints:
      reject_tools:
        - bash
        - powershell
        - edit
        - create
  - name: Generate TRX from a VSTest project
    tags:
      capability: emit-trx-vstest
      risk: medium
      journey: produce-trx-report
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-generate-trx-vstest
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              This SDK-style MSTest project references Microsoft.NET.Test.Sdk and MSTest.TestAdapter with no MTP runner or bridge properties, so it runs on VSTest. Produce a TRX report with the VSTest logger:

                 dotnet test --logger "trx;LogFileName=TestResults.trx"

              The TRX file lands under TestResults by default. Use the VSTest --logger option here; the Microsoft.Testing.Platform report flag does not apply to a VSTest project, and there is no `--` separator. I did not run it.
    prompt: |
      An SDK-style MSTest project references Microsoft.NET.Test.Sdk and
      MSTest.TestAdapter, with no MTP runner or bridge properties. Give me the
      exact command to run its tests and write a TRX report. Do not run it.
    graders:
      - type: output-matches
        config:
          pattern: '(?mi)^[^\r\n]{0,80}\bdotnet[ \t]+test\b[^\r\n]*--logger(?:[ \t]+|=)[^\r\n]*\btrx\b'
      - type: prompt
    rubric:
      - Identified the project as VSTest rather than MTP
      - Used --logger trx and did not use the MTP-only --report-trx flag
      - Did not add the MTP argument separator
    constraints:
      reject_tools:
        - bash
        - powershell
        - edit
        - create
  - name: Run tests with hang dump on MTP project (SDK 10)
    tags:
      capability: hang-dump-mtp-sdk10
      risk: medium
      journey: diagnose-hang
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-hang-dump-mtp-sdk10
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              global.json pins SDK 10.0.100 and sets the runner to Microsoft.Testing.Platform. The project enables the MSTest runner and references Microsoft.Testing.Extensions.HangDump, so use that extension's MTP options. SDK 10 passes them directly, without the legacy `--` separator:

                 dotnet test --project TestProject.csproj --hangdump --hangdump-timeout 5min

              When the test host has no activity for five minutes, the extension writes a hang dump so you can identify the stuck process. `--blame-hang-timeout` is a VSTest option and is not valid for this MTP test application. I did not run it.
    prompt: >
      My tests are occasionally hanging. I want to run them with dotnet test using
      a hang timeout of 5 minutes to detect the culprit. Here's my project.
    environment:
      files:
        - src: fixtures/mtp-mstest-sdk10/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-mstest-sdk10/CatalogServiceTests.cs
          dest: CatalogServiceTests.cs
        - src: fixtures/mtp-mstest-sdk10/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: --hangdump(?:\s|$)
      - type: output-matches
        config:
          pattern: --hangdump-timeout\s+5m(?:in)?\b
      - type: output-not-matches
        config:
          pattern: -- --hangdump
      - type: exit-success
      - type: prompt
    rubric:
      - Detects MTP via the global.json runner setting (Microsoft.Testing.Platform)
      - Recognizes that SDK 10 passes MTP arguments directly without '--' separator
      - Detects the Microsoft.Testing.Extensions.HangDump package in the project
      - Uses '--hangdump --hangdump-timeout 5min' or similar directly, not after '--'
      - Does not use the VSTest-style '--blame-hang-timeout' option
    constraints:
      expect_tools:
        - bash
  - name: Filter xUnit v3 tests by class on MTP
    tags:
      capability: filter-xunit-class-mtp
      risk: medium
      journey: filter-by-class-mtp
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-filter-xunit-class-mtp
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is xUnit v3 on Microsoft.Testing.Platform (xunit.v3 package plus TestingPlatformDotnetTestSupport), pinned to SDK 9 in global.json, so MTP arguments go after the `--` separator. Run just the ShoppingCartTests class with its fully qualified xUnit MTP class filter:

                 dotnet test -- --filter-class "Contoso.Cart.Tests.ShoppingCartTests"

              That selects all three ShoppingCartTests and excludes InventoryServiceTests. xUnit v3 on MTP does not accept the VSTest --filter "ClassName=..." expression syntax, so use --filter-class as shown. I did not run it.
    prompt: >
      I need to run only the ShoppingCartTests class using dotnet test, not the
      InventoryServiceTests. Can you show me the command?
    environment:
      files:
        - src: fixtures/mtp-xunit-v3/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-xunit-v3/ShoppingCartTests.cs
          dest: ShoppingCartTests.cs
        - src: fixtures/mtp-xunit-v3/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: --filter-class[^\r\n]*Contoso\.Cart\.Tests\.ShoppingCartTests
      - type: exit-success
      - type: prompt
    rubric:
      - Detects xUnit v3 on MTP (xunit.v3 package + TestingPlatformDotnetTestSupport)
      - Uses --filter-class instead of the VSTest --filter expression syntax
      - Uses the fixture's fully qualified Contoso.Cart.Tests.ShoppingCartTests class name so the filter selects all three intended tests
      - xUnit v3 on MTP does NOT support the VSTest --filter "ClassName=..." syntax
      - Correctly passes the filter after '--' separator since this is SDK 9
    constraints:
      expect_tools:
        - bash
  - name: Filter xUnit v3 tests by trait on MTP
    tags:
      capability: filter-xunit-trait-mtp
      risk: medium
      journey: filter-by-trait
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-filter-xunit-trait-mtp
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is xUnit v3 on Microsoft.Testing.Platform, pinned to SDK 9, so MTP arguments go after the `--` separator. Run only the Integration-category tests with the xUnit MTP trait filter:

                 dotnet test -- --filter-trait "Category=Integration"

              Use --filter-trait here, not the VSTest --filter "Traits.Category=Integration" expression — xUnit v3 on MTP needs the framework-specific filter flag. I did not run it.
    prompt: >
      I want to run only the tests with the Category=Integration trait in this
      xUnit project using dotnet test.
    environment:
      files:
        - src: fixtures/mtp-xunit-v3/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-xunit-v3/ShoppingCartTests.cs
          dest: ShoppingCartTests.cs
        - src: fixtures/mtp-xunit-v3/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: --filter-trait
      - type: output-matches
        config:
          pattern: Category=Integration
      - type: exit-success
      - type: prompt
    rubric:
      - Detects xUnit v3 on MTP from the project references
      - Uses --filter-trait "Category=Integration" instead of VSTest --filter "Traits.Category=Integration"
      - xUnit v3 on MTP requires framework-specific filter flags, not VSTest expression syntax
      - Correctly handles the '--' separator for SDK 9
    constraints:
      expect_tools:
        - bash
  - name: Filter xUnit v3 tests by class pattern and trait using query filter language
    tags:
      capability: combine-filters-query-mtp
      risk: high
      journey: filter-combined-expression
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-filter-xunit-query-mtp
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              xUnit v3 on Microsoft.Testing.Platform supports a query filter language that combines several conditions in one expression, which is what you want here. This project is SDK 9, so the MTP args go after `--`.

                 dotnet test -- --filter-query "/*/*/*Integration*/*[Category=Smoke]"

              The query is a path with four segments: assembly / namespace / class / method, plus a trait qualifier in square brackets. The class segment *Integration* matches only classes whose name contains 'Integration', the method segment * keeps every test method inside them, and [Category=Smoke] keeps only the Smoke-trait tests. Omitting the method segment leaves the query one segment short and it will not select what you want. Together they return Smoke tests from integration classes only — not all Smoke tests and not all integration tests. I did not run it.
    prompt: >
      I have an xUnit v3 project with several test classes. I need to run only
      the Smoke tests from classes whose name contains 'Integration' — I want a
      single combined filter expression for dotnet test rather than separate
      flags.
    environment:
      files:
        - src: fixtures/mtp-xunit-v3/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-xunit-v3-query/EcommerceTests.cs
          dest: EcommerceTests.cs
        - src: fixtures/mtp-xunit-v3/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: --\s+--filter-query
      - type: output-matches
        config:
          pattern: '--filter-query\s+"/\*/\*/[^/"]*Integration[^/"]*/\*\[Category=Smoke\]"'
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that xUnit v3 on MTP supports a query filter language for complex combined expressions
      - Uses SDK 9 MTP argument passing with '-- --filter-query'
      - Produced a filter-query expression that combines a class name pattern with a trait filter in square brackets
      - The expression correctly targets only Smoke tests from integration test classes, not all Smoke tests or all integration tests
      - Used the complete four-segment path syntax (assembly/namespace/class/method) with a trait qualifier like [Category=Smoke], rather than dropping the method segment
    constraints:
      expect_tools:
        - bash
  - name: Filter TUnit tests by class using treenode-filter
    tags:
      capability: filter-tunit-treenode
      risk: medium
      journey: filter-tunit-class
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-filter-tunit-treenode
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              TUnit is a Microsoft.Testing.Platform-only framework — it has no VSTest adapter — so filter with the MTP tree-node filter, not the VSTest --filter syntax. Run only the SmsNotificationTests class:

                 dotnet run --project TestProject.csproj -- --treenode-filter "/*/*/SmsNotificationTests/*"

              The path is /assembly/namespace/class/method; the wildcard segments match any assembly and namespace, SmsNotificationTests pins the class, and the final /* keeps every test method in it. You can also use `dotnet test -- --treenode-filter ...` for the same effect. I did not run it.
    prompt: >
      I want to run only the SmsNotificationTests from this TUnit project using
      dotnet test. What's the command?
    environment:
      files:
        - src: fixtures/mtp-tunit/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-tunit/NotificationTests.cs
          dest: NotificationTests.cs
    graders:
      - type: output-matches
        config:
          pattern: --treenode-filter
      - type: output-matches
        config:
          pattern: SmsNotificationTests
      - type: exit-success
      - type: prompt
    rubric:
      - Identifies TUnit as MTP-only (no VSTest support)
      - Uses --treenode-filter with the path-based syntax to filter by class name
      - Uses the correct wildcard pattern like /*/*/SmsNotificationTests/*
      - Does not use VSTest --filter syntax which is incompatible with TUnit
      - Uses 'dotnet run' or 'dotnet test' with correct MTP argument passing
    constraints:
      expect_tools:
        - bash
  - name: Combine multiple filter criteria on VSTest MSTest
    tags:
      capability: combine-filters-vstest
      risk: medium
      journey: filter-combined-vstest
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-combine-filters-vstest
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is a VSTest MSTest project, so combine the two conditions in one VSTest --filter expression with the & (AND) operator:

                 dotnet test --filter "ClassName~OrderServiceTests&TestCategory=Unit"

              That runs only the Unit-category tests inside OrderServiceTests in a single pass — no need to run everything and post-filter the results. For future reference: & means AND and | means OR, and you can group with parentheses, for example "(TestCategory=Unit|TestCategory=Smoke)&ClassName~OrderServiceTests". I did not run it.
    prompt: >
      I want to run only the unit tests in the OrderServiceTests class using
      dotnet test. How do I combine these two filter conditions?
    environment:
      files:
        - src: fixtures/vstest-mstest/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/vstest-mstest/OrderServiceTests.cs
          dest: OrderServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: --filter
      - type: output-matches
        config:
          pattern: TestCategory=Unit
      - type: output-matches
        config:
          pattern: OrderServiceTests
      - type: output-contains
        config:
          substring: "&"
      - type: exit-success
      - type: prompt
    rubric:
      - Combines ClassName and TestCategory filters using the '&' (AND) operator
      - 'Uses correct VSTest expression syntax: --filter "ClassName~OrderServiceTests&TestCategory=Unit"'
      - Does not suggest running all tests and post-filtering results
      - Explains the AND/OR combinator syntax for future reference
    constraints:
      expect_tools:
        - bash
  - name: Exclude slow integration tests on VSTest MSTest
    tags:
      capability: filter-vstest-select-exclude
      risk: medium
      journey: filter-ci-subset
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-filter-vstest-select-exclude
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              Use one VSTest expression with an AND between the positive and negated category conditions:

              ```bash
              dotnet test --filter "TestCategory=Integration&TestCategory!=Slow"
              ```

              `TestCategory=Integration` selects the integration tests. `TestCategory!=Slow` removes tests that also carry the Slow category. Keeping the full expression quoted prevents the shell from treating `&` as an operator. This needs no source or project changes.
    prompt: |
      This is an SDK-style MSTest project on VSTest. Its CI job should run tests
      marked `Integration` but skip any of those tests that are also marked
      `Slow`. Give me one exact `dotnet test` command. Do not run anything or
      change the tests.
    graders:
      - type: output-matches
        config:
          pattern: --filter
      - type: output-matches
        config:
          pattern: TestCategory=Integration
      - type: output-matches
        config:
          pattern: TestCategory!=Slow
      - type: output-contains
        config:
          substring: "&"
      - type: prompt
    rubric:
      - Uses one VSTest filter expression that selects the Integration category and excludes the Slow category
      - Combines the positive and negated conditions with the AND operator
      - Does not split the request into two test runs or propose source changes
      - Keeps the filter as one quoted command-line argument so the shell does not interpret the AND operator
    constraints:
      reject_tools:
        - bash
        - powershell
        - edit
        - create
  - name: Exclude a TUnit category with treenode-filter
    tags:
      capability: filter-tunit-exclude-category
      risk: medium
      journey: filter-ci-subset
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-filter-tunit-exclude-category
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              TUnit uses a path-shaped tree-node filter. Wildcard every path segment, then append the negated category selector to the test segment:

              ```bash
              dotnet run -- --treenode-filter "/*/*/*/*[Category!=Slow]"
              ```

              The first `--` makes the remaining tokens application arguments, so future `dotnet run` options cannot consume them. The four wildcard segments keep every assembly, namespace, class, and test name eligible. `[Category!=Slow]` then excludes tests marked Slow. This is one command and needs no test-source changes.
    prompt: |
      This project uses TUnit on Microsoft.Testing.Platform. Give me one exact
      command that runs the suite but excludes every test marked with the
      `Slow` category. Do not run anything or change the tests.
    graders:
      - type: output-matches
        config:
          pattern: (?m)^[ \t]*dotnet[ \t]+(?:run[ \t]+--[ \t]+|test[ \t]+(?:--[ \t]+)?)--treenode-filter\b
      - type: output-matches
        config:
          pattern: Category!=Slow
      - type: output-matches
        config:
          pattern: /\*/\*/\*/\*
      - type: prompt
    rubric:
      - Uses TUnit's path-shaped treenode filter rather than a VSTest property-expression filter
      - Wildcards the assembly, namespace, class, and test-name segments so the full suite remains eligible
      - Appends the negated Slow category selector to the test-name segment
      - Uses dotnet run with the application-argument delimiter, bridged dotnet test with the delimiter, or native-MTP dotnet test with direct arguments
      - Does not propose editing test attributes
    constraints:
      reject_tools:
