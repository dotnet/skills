  - name: MTP project on SDK 9 must use -- separator for args
    tags:
      capability: mtp-sdk9-separator
      risk: high
      journey: collect-crash-dump
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: run-tests-mtp-sdk9-separator-crash
        agent:
          name: reference
          version: 1.0.0
          model_name: curated
        steps:
          - step_id: 1
            source: agent
            message: |-
              The project enables the MSTest runner, sets TestingPlatformDotnetTestSupport=true, and references Microsoft.Testing.Extensions.CrashDump, so it runs on Microsoft.Testing.Platform. global.json pins SDK 9, where MTP application arguments must follow the `--` separator. To collect a crash dump if a test crashes the host:

                 dotnet test -- --crashdump

              The separator sends the CrashDump extension's `--crashdump` option to the test application. `--blame` and `--blame-crash` are VSTest options and are not valid replacements for this MTP extension command. I did not run it.
    prompt: >
      I want to run these tests with dotnet test and collect a crash dump if any
      test crashes the host.
    environment:
      files:
        - src: fixtures/mtp-mstest-sdk9/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/mtp-mstest-sdk9/UserAuthTests.cs
          dest: UserAuthTests.cs
        - src: fixtures/mtp-mstest-sdk9/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: --\s+--crashdump(?:\s|$)
      - type: output-not-matches
        config:
          pattern: (?mi)^[^\r\n]{0,40}\bdotnet\s+test[^\r\n]*--blame(?:-crash)?
      - type: exit-success
      - type: prompt
    rubric:
      - Detects EnableMSTestRunner and TestingPlatformDotnetTestSupport in the csproj indicating MTP
      - Detects the Microsoft.Testing.Extensions.CrashDump package that supplies the crash-dump option
      - Recognizes that SDK 9 requires MTP arguments after the '--' separator
      - "Places --crashdump after the '--' separator: 'dotnet test -- --crashdump'"
      - Does not use the VSTest-style '--blame' or '--blame-crash' options for this MTP project
    constraints:
      expect_tools:
        - bash
