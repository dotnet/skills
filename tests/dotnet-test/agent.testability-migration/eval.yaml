name: agent.testability-migration
description: Evaluates the dotnet-test/agent.testability-migration internal specialist
type: capability
defaults:
  timeout: 20m
environment:
  files:
    - src: ../graders/authenticated_artifacts.py
      dest: .eval/authenticated_artifacts.py
stimuli:
  - name: "Full pipeline: detect statics and recommend migration plan"
    prompt: >
      I have a SubscriptionManager class that's impossible to unit test
      because it uses DateTime.UtcNow, File.*, Directory.*, Environment.*,
      and Console.* all directly. Analyze it and give me a bounded migration
      plan, but do not change files yet.
    tags:
      capability: static-dependency-migration-plan
      risk: untestable-static-coupling
      journey: plan-testability-migration
    environment:
      files:
        - src: ./fixtures/full-pipeline
          dest: FullPipeline
        - src: ../agent.test-quality-auditor/graders/check_readonly.py
          dest: .eval/check_readonly.py
      commands:
        - python .eval/check_readonly.py snapshot FullPipeline
      skills:
        - ../../plugins/dotnet-test/skills/detect-static-dependencies
        - ../../plugins/dotnet-test/skills/generate-testability-wrappers
        - ../../plugins/dotnet-test/skills/migrate-static-to-wrapper
    graders:
      - type: output-matches
        config:
          pattern: (DateTime\.UtcNow|DateTime\.Now|time)
      - type: output-matches
        config:
          pattern: (File\.|Directory\.|file system|filesystem)
      - type: output-matches
        config:
          pattern: TimeProvider
      - type: output-matches
        config:
          pattern: (IFileSystem|System\.IO\.Abstractions|wrapper|abstraction)
      - type: output-matches
        config:
          pattern: (Environment\.|environment|configuration)
      - type: output-matches
        config:
          pattern: (Console\.|console|logging|TextWriter|ILogger)
      - type: output-matches
        config:
          pattern: (increment|step|phase|first|order|sequence)
      - type: run-command
        config:
          command: >-
            python3 -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/authenticated_artifacts.py');assert hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e1f80ddf5efca29aa82174dafd3130df9ec19572f34b6aeff7a9ed184faad8b7';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)" --expect 606142a930232cb26959562f7128f460defe42a82ac670a34074ace09feeb74e:.eval/check_readonly.py --expect 70c443c393a8973de19071d890cab67074b5db552c531c6b5c993fa689b82579:.eval/baseline.json -- python .eval/check_readonly.py verify FullPipeline
          expected_exit_code: 0
          timeout: 1m
      - type: exit-success
      - type: prompt
    rubric:
      - Identified the static dependencies in SubscriptionManager (time, filesystem, environment, console)
      - Recommended TimeProvider for replacing DateTime.UtcNow calls
      - Recommended System.IO.Abstractions or a wrapper for File/Directory calls
      - Proposed an incremental migration plan rather than changing everything at once
      - Produced clear next steps without modifying source or project configuration

  - name: "Targeted request: just migrate DateTime to TimeProvider"
    prompt: >
      I only care about making the time calls testable right now. Replace
      DateTime.UtcNow with TimeProvider in my SubscriptionManager class. I'm
      on .NET 10.
    tags:
      capability: timeprovider-migration
      risk: untestable-static-coupling
      journey: migrate-time-dependency
    environment:
      files:
        - src: ./fixtures/full-pipeline
          dest: FullPipeline
        - src: ../agent.test-quality-auditor/graders/check_readonly.py
          dest: .eval/check_readonly.py
        - src: graders/check_time_scope.py
          dest: .eval/check_time_scope.py
        - src: graders/TimeContract
          dest: .eval/TimeContract
      commands:
        - python .eval/check_readonly.py snapshot FullPipeline
      skills:
        - ../../plugins/dotnet-test/skills/migrate-static-to-wrapper
    graders:
      - type: file-contains
        config:
          path: "**/SubscriptionManager.cs"
          value: TimeProvider
      - type: file-not-contains
        config:
          path: "**/SubscriptionManager.cs"
          value: DateTime.UtcNow
      - type: file-contains
        config:
          path: "**/Program.cs"
          value: TimeProvider.System
      - type: run-command
        config:
          command: >-
            python3 -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/authenticated_artifacts.py');assert hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e1f80ddf5efca29aa82174dafd3130df9ec19572f34b6aeff7a9ed184faad8b7';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)" --expect 606142a930232cb26959562f7128f460defe42a82ac670a34074ace09feeb74e:.eval/check_readonly.py --expect 70c443c393a8973de19071d890cab67074b5db552c531c6b5c993fa689b82579:.eval/baseline.json -- python .eval/check_readonly.py verify FullPipeline --allow FullPipeline/Services/SubscriptionManager.cs --allow FullPipeline/Program.cs
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: >-
            python3 -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/authenticated_artifacts.py');assert hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e1f80ddf5efca29aa82174dafd3130df9ec19572f34b6aeff7a9ed184faad8b7';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)" --expect 0065ceb2aa76bac3a3bef417267e51c1b8342f4bb586a67861784a436bb108d7:.eval/check_time_scope.py --expect 70c443c393a8973de19071d890cab67074b5db552c531c6b5c993fa689b82579:.eval/baseline.json -- python .eval/check_time_scope.py
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: >-
            python3 -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/authenticated_artifacts.py');assert hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e1f80ddf5efca29aa82174dafd3130df9ec19572f34b6aeff7a9ed184faad8b7';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)" --expect 8768d99d41e0021669c2179a2415572c2c0c9177dfc1dc4e7d09f91996ace148:.eval/TimeContract/Program.cs --expect ea3bdafcaa215400ffb53b2fc21bdd0347f67a59a5dd1a7d9e9697492ebb3cb3:.eval/TimeContract/TimeContract.csproj -- dotnet run --project .eval/TimeContract
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Replaced all DateTime.UtcNow calls in SubscriptionManager with TimeProvider equivalents
      - Added TimeProvider as a dependency to SubscriptionManager via constructor injection
      - Registered TimeProvider.System in the DI container in Program.cs
      - Did not modify the File.*, Directory.*, Environment.*, or Console.* calls — stayed focused

  - name: "Migrate time dependencies and add deterministic tests"
    prompt: |
      SubscriptionManager directly uses DateTime.UtcNow in CreateTrial and
      IsActive. Migrate those time calls to TimeProvider, wire the production
      default, and add deterministic xUnit tests for the 14-day trial dates and
      the active/expired boundary. Put the new test project in a sibling
      `FullPipeline.Tests/` directory, outside the protected `FullPipeline/`
      production tree. Keep the filesystem, environment, and console calls out
      of scope. Do not stop after the production build; run the tests.
    tags:
      capability: timeprovider-migration-with-tests
      risk: nondeterministic-time-tests
      journey: migrate-and-test-time-dependency
    environment:
      files:
        - src: ./fixtures/full-pipeline
          dest: FullPipeline
        - src: ../agent.test-quality-auditor/graders/check_readonly.py
          dest: .eval/check_readonly.py
        - src: graders/check_time_scope.py
          dest: .eval/check_time_scope.py
        - src: graders/TimeContract
          dest: .eval/TimeContract
      commands:
        - python .eval/check_readonly.py snapshot FullPipeline
      skills:
        - ../../plugins/dotnet-test/skills/migrate-static-to-wrapper
        - ../../plugins/dotnet-test/skills/code-testing
    graders:
      - type: file-contains
        config:
          path: "**/SubscriptionManager.cs"
          value: TimeProvider
      - type: file-not-contains
        config:
          path: "**/SubscriptionManager.cs"
          value: DateTime.UtcNow
      - type: file-contains
        config:
          path: "**/Program.cs"
          value: TimeProvider.System
      - type: run-command
        config:
          command: >-
            python3 -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/authenticated_artifacts.py');assert hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e1f80ddf5efca29aa82174dafd3130df9ec19572f34b6aeff7a9ed184faad8b7';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)" --expect 606142a930232cb26959562f7128f460defe42a82ac670a34074ace09feeb74e:.eval/check_readonly.py --expect 70c443c393a8973de19071d890cab67074b5db552c531c6b5c993fa689b82579:.eval/baseline.json -- python .eval/check_readonly.py verify FullPipeline --allow FullPipeline/Services/SubscriptionManager.cs --allow FullPipeline/Program.cs
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: >-
            python3 -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/authenticated_artifacts.py');assert hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e1f80ddf5efca29aa82174dafd3130df9ec19572f34b6aeff7a9ed184faad8b7';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)" --expect 0065ceb2aa76bac3a3bef417267e51c1b8342f4bb586a67861784a436bb108d7:.eval/check_time_scope.py --expect 70c443c393a8973de19071d890cab67074b5db552c531c6b5c993fa689b82579:.eval/baseline.json -- python .eval/check_time_scope.py
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: >-
            python3 -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/authenticated_artifacts.py');assert hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e1f80ddf5efca29aa82174dafd3130df9ec19572f34b6aeff7a9ed184faad8b7';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)" --expect 8768d99d41e0021669c2179a2415572c2c0c9177dfc1dc4e7d09f91996ace148:.eval/TimeContract/Program.cs --expect ea3bdafcaa215400ffb53b2fc21bdd0347f67a59a5dd1a7d9e9697492ebb3cb3:.eval/TimeContract/TimeContract.csproj -- dotnet run --project .eval/TimeContract
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: dotnet test FullPipeline.Tests/FullPipeline.Tests.csproj
          expected_exit_code: 0
          stdout_matches: 'Passed:\s+[1-9][0-9]*'
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "grep -Rqi 'CreateTrial' FullPipeline.Tests --include='*Tests.cs' && grep -Rqi 'IsActive' FullPipeline.Tests --include='*Tests.cs' && grep -Rqi 'expired\\|boundary\\|Advance' FullPipeline.Tests --include='*Tests.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Replaced only DateTime.UtcNow usages with TimeProvider and kept filesystem/environment/console calls unchanged
      - Wired TimeProvider.System for production
      - Created a runnable sibling FullPipeline.Tests project referencing FullPipeline
      - Added deterministic tests proving StartedAt, the 14-day ExpiresAt value, active-before-expiry, and expired-at-boundary behavior
      - Used a controlled TimeProvider rather than wall-clock timing
      - Ran the tests successfully instead of stopping after migration or build

  - name: "Replace filesystem statics without touching unrelated dependencies"
    prompt: |
      Replace only the File and Directory calls in SubscriptionManager with an
      injectable filesystem abstraction. Wire the production implementation and
      keep DateTime, Environment, and Console usage unchanged. Build the project
      after the migration.
    tags:
      capability: focused-filesystem-migration
      risk: unrelated-dependency-drift
      journey: replace-filesystem-statics
    environment:
      files:
        - src: ./fixtures/full-pipeline
          dest: FullPipeline
      skills:
        - ../../plugins/dotnet-test/skills/generate-testability-wrappers
        - ../../plugins/dotnet-test/skills/migrate-static-to-wrapper
    graders:
      - type: output-matches
        config:
          pattern: (IFileSystem|System\.IO\.Abstractions|file system|filesystem)
      - type: run-command
        config:
          command: >-
            python -c "import pathlib,re,sys; text=next(pathlib.Path('.').rglob('SubscriptionManager.cs')).read_text(); sys.exit(1 if re.search(r'(?<![\w.])(?:System\.IO\.)?(?:File|Directory)\.', text) else 0)"
      - type: file-contains
        config:
          path: "**/SubscriptionManager.cs"
          value: DateTime.UtcNow
      - type: run-command
        config:
          command: dotnet build FullPipeline
          expected_exit_code: 0
          timeout: 5m
      - type: prompt
    rubric:
      - Replaced the filesystem statics with one injectable abstraction and wired its production implementation
      - Preserved DateTime, Environment, and Console calls because they were outside the requested scope
      - Left the project in a buildable state

  - name: "Inventory static dependencies without modifying the project"
    prompt: |
      Analyze SubscriptionManager for dependencies that make deterministic unit
      testing difficult. Group the findings by dependency category, identify the
      affected members, and rank the migration order. This is analysis only; do
      not edit any files.
    tags:
      capability: static-dependency-inventory
      risk: unintended-production-edits
      journey: analyze-testability-blockers
    environment:
      files:
        - src: ./fixtures/full-pipeline
          dest: FullPipeline
        - src: ../agent.test-quality-auditor/graders/check_readonly.py
          dest: .eval/check_readonly.py
      commands:
        - python .eval/check_readonly.py snapshot FullPipeline
      skills:
        - ../../plugins/dotnet-test/skills/detect-static-dependencies
    graders:
      - type: output-matches
        config:
          pattern: (DateTime\.UtcNow|time)
      - type: output-matches
        config:
          pattern: (File\.|Directory\.|filesystem|file system)
      - type: output-matches
        config:
          pattern: (Environment\.|Console\.)
      - type: output-matches
        config:
          pattern: (priority|rank|order|first)
      - type: run-command
        config:
          command: >-
            python3 -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/authenticated_artifacts.py');assert hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e1f80ddf5efca29aa82174dafd3130df9ec19572f34b6aeff7a9ed184faad8b7';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)" --expect 606142a930232cb26959562f7128f460defe42a82ac670a34074ace09feeb74e:.eval/check_readonly.py --expect 70c443c393a8973de19071d890cab67074b5db552c531c6b5c993fa689b82579:.eval/baseline.json -- python .eval/check_readonly.py verify FullPipeline
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Identified time, filesystem, environment, and console dependencies with their affected members
      - Ranked the migration sequence based on testing value and implementation risk
      - Kept the analysis read-only and did not alter the supplied project
