name: assertion-quality
description: Evaluates the dotnet-test/assertion-quality skill
type: capability
defaults:
  timeout: 5m
  runs: 2
stimuli:
  - name: Identify low assertion diversity in equality-dominated test suite
    prompt: |
      I want to understand whether my PaymentService tests are actually
      thorough. They all pass, but I'm not confident they'd catch real bugs.
      Can you analyze the assertion quality and variety?
    tags:
      capability: assertion-diversity-analysis
      risk: shallow-assertions
      journey: assess-test-thoroughness
    golden_trajectory:
      path: ./references/low-diversity-payment.json
    environment:
      files:
        - src: fixtures/low-diversity/PaymentService.Tests/PaymentService.Tests.csproj
          dest: PaymentService.Tests/PaymentService.Tests.csproj
        - src: fixtures/low-diversity/PaymentService.Tests/PaymentProcessorTests.cs
          dest: PaymentService.Tests/PaymentProcessorTests.cs
        - src: fixtures/low-diversity/PaymentService.Tests/PaymentProcessor.cs
          dest: PaymentService.Tests/PaymentProcessor.cs
    graders:
      - type: output-matches
        config:
          pattern: (diversity|variety|spread|shallow|narrow|limited|homogeneous|repetitive)
      - type: output-matches
        config:
          pattern: (AreEqual|equality|equal)
      - type: output-matches
        config:
          pattern: (exception|throw|error|negative|missing)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified that the vast majority of assertions are Assert.AreEqual, showing low assertion type diversity
      - Noted the absence of exception assertions — no tests verify error handling behavior (e.g., invalid card,
        negative amounts)
      - Identified GetReceipt test as having only a trivial Assert.IsNotNull without checking the receipt's content
      - Noted that no tests verify collection contents in GetTransactionHistory — only the count is checked
      - Recommended additional assertions that would catch bugs the current suite cannot — covering error/exception
        behaviour, collection contents, and object state — regardless of how those categories are labelled
      - Provided concrete examples of assertions that could be added to specific test methods
  - name: Flag assertion-free tests and trivial-only assertions
    prompt: |
      Our QA team says these API smoke tests give us good coverage but I'm
      suspicious. Analyze the assertion quality and depth in
      `SmokeTests/ApiEndpointSmokeTests.cs`. Identify tests with no meaningful
      verification or only trivial assertions, explain the false confidence
      they create, and recommend what each weak test should verify instead.
      Include the number of tests in each group and an overall quality
      assessment. Do not edit the files.
    tags:
      capability: assertion-free-detection
      risk: false-confidence-in-tests
      journey: audit-smoke-tests
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "assertion-quality-assertion-free-smoke"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I read all 8 tests in ApiEndpointSmokeTests.cs without editing anything. Your suspicion is right: this file gives false confidence.

              **Overall quality: weak.** None of the 8 tests verifies a returned value. They split into two groups that reconcile exactly to the 8 methods in the file:

              **5 of 8 tests (62.5%) are assertion-free** — they call a method and assert nothing at all:
              - `GetUsers_DoesNotThrow`, `GetUserById_DoesNotThrow`, `CreateUser_DoesNotThrow`, `DeleteUser_DoesNotThrow`, `UpdateUser_DoesNotThrow`.

              These only prove the call did not throw. That said, their names openly declare a "does not throw" intent, so they are a deliberate (if very weak) smoke check rather than an accidental omission — I am calling them out separately from tests that merely execute code and forgot to assert. Even so, a "does not throw" smoke test is not a correctness test: `CreateUser` could persist the wrong email and this suite would stay green.

              **3 of 8 tests use only a trivial `Assert.IsNotNull`:**
              - `GetOrders_ReturnsNotNull`, `GetOrderById_ReturnsNotNull`, `SearchProducts_ReturnsNotNull`.

              `IsNotNull` confirms an object came back but never inspects its content, so a wrong or empty result passes.

              5 assertion-free + 3 trivial-only = the 8 methods in the file. The danger is that line coverage looks healthy while correctness is unverified — the classic false-security trap.

              **What each weak test should verify instead (examples):**
              - `CreateUser`: assert the returned user's `Email`, `Name`, and a generated id equal the inputs.
              - `GetUserById`: assert the returned user's id and fields match the requested record.
              - `GetOrders`: assert the collection's count and that specific expected orders are present, not just non-null.
              - `SearchProducts("widget")`: assert the results actually contain "widget" matches.

              Convert the `_DoesNotThrow` smoke tests into value-asserting tests, or at minimum keep one explicit "does not throw" test per endpoint and add real correctness tests alongside it.
    environment:
      files:
        - src: fixtures/assertion-free/SmokeTests/SmokeTests.csproj
          dest: SmokeTests/SmokeTests.csproj
        - src: fixtures/assertion-free/SmokeTests/ApiEndpointSmokeTests.cs
          dest: SmokeTests/ApiEndpointSmokeTests.cs
        - src: fixtures/assertion-free/SmokeTests/ApiClient.cs
          dest: SmokeTests/ApiClient.cs
    graders:
      # Bind a count to prose, the neighboring table cell, or a group's first finding
      # after an optional method list. Don't borrow counts from the next row or group.
      - type: output-matches
        config:
          pattern: '(?i)(?:(?<![\w.])(?:5|five)\b(?:(?:\s*/\s*|\s+(?:out\s+)?of\s+(?:the\s+)?)(?:8|eight)\b)?(?:[ \t`*]*\|| (?:tests?|methods?)\)\r?\n(?:`[\w`, \t]+`\r?\n)?(?:[ \t]*\r?\n)*)?(?:(?!\b(?:three|five|eight)\b)[^\d.,;:!?|\r\n]|\d+(?:\.\d+)?%)*?\b(?:assertion[- ]free|(?:no|zero|without|lack(?:ing)?) (?:any |explicit )?assertions?|asserts? nothing)\b|\b(?:assertion[- ]free|(?:no|zero) (?:explicit )?assertions?)\b(?: tests?| methods?)?[ \t`*():|–—=-]+\b(?:5|five)\b)'
      - type: output-matches
        config:
          pattern: '(?i)(?:(?<![\w.])(?:3|three)\b(?:(?:\s*/\s*|\s+(?:out\s+)?of\s+(?:the\s+)?)(?:8|eight)\b)?(?:[ \t`*]*\|| (?:tests?|methods?)\)\r?\n(?:`[\w`, \t]+`\r?\n)?(?:[ \t]*\r?\n)*)?(?:(?!\b(?:three|five|eight)\b)[^\d.,;:!?|\r\n]|\d+(?:\.\d+)?%)*?\b(?:(?:Assert\.)?IsNotNull|(?:non|not)[- ]null|null[- ]checks?|trivial[- ]only|trivial assertions?)\b|\b(?:IsNotNull|(?:non|not)[- ]null|null[- ]checks?|trivial[- ]only|trivial assertions?)\b(?: only| tests?)?[ \t`*():|–—=-]+\b(?:3|three)\b)'
      - type: exit-success
      - type: prompt
    rubric:
      - Identified that 5 out of 8 tests have zero assertions — they only call methods without verifying results
      - Identified that the remaining 3 tests only use Assert.IsNotNull, which is a trivial assertion that doesn't
        verify content
      - Explained that these tests give false security — code coverage may look good but correctness is not verified
      - Recommended specific meaningful assertions for at least some of the assertion-free tests
      - Separated tests that merely execute code without verifying it from tests that are deliberately only checking
        "this does not throw", instead of lumping every assertion-free test together
      - Metric counts add up correctly - the 5 assertion-free tests plus the 3 trivial-only tests reconcile to the
        8 test methods in the file, and any percentage reported matches those counts
  - name: Recognize well-diversified assertion usage
    prompt: |
      Can you evaluate the assertion quality in my UserService.Tests project?
      I want to make sure my tests are thorough enough before we ship.
    tags:
      capability: assertion-strength-recognition
      risk: false-positive-findings
      journey: pre-ship-test-review
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "assertion-quality-good-diversity-user"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I evaluated all 12 tests in UserManagerTests.cs. This is a genuinely strong, well-diversified suite — I am not going to invent problems just to have something to flag.

              **Assertion variety is good.** The suite uses a real spread of assertion types rather than leaning on one:
              - Equality on specific fields (`Email`, `Name`, `Role`, ids).
              - Boolean assertions (`IsTrue`/`IsFalse`) on `DeleteUser` outcomes and `Id > 0`.
              - Null / not-null (`IsNull`, `IsNotNull`) to check presence and absence.
              - Exception assertions with specific types — `ThrowsException<InvalidOperationException>` for a duplicate email and `ThrowsException<ArgumentNullException>` for a null email, and the latter even verifies `ex.ParamName == "email"`.
              - Collection assertions — `CollectionAssert.AllItemsAreNotNull`, count checks, and `Any(...)`/`All(...)` content predicates in `ListUsers`, `ListUsers_FilterByRole`, and `SearchUsers`.

              **Positive patterns worth crediting:**
              - `CreateUser_ValidInput_ReturnsUserWithCorrectProperties` asserts six properties on the returned object, not just one field.
              - The suite verifies failure and absence outcomes as first-class behavior — `GetUser_NonExistent_ReturnsNull`, `DeleteUser_NonExistent_ReturnsFalse`, and `SearchUsers_NoMatch_ReturnsEmptyList` are real verification, not filler.
              - `UpdateRole_ChangesUserRole` asserts both the new role and, with `AreNotEqual`, that it actually changed from the old value.

              **Minor enhancement opportunities (not problems):** you could additionally assert `CreatedAt` ordering across users, or check the exact message on the duplicate-email exception. These are polish on an already-thorough suite.

              Overall: this suite has strong assertion diversity and depth and is in good shape to ship.
    environment:
      files:
        - src: fixtures/good-diversity/UserService.Tests/UserService.Tests.csproj
          dest: UserService.Tests/UserService.Tests.csproj
        - src: fixtures/good-diversity/UserService.Tests/UserManagerTests.cs
          dest: UserService.Tests/UserManagerTests.cs
        - src: fixtures/good-diversity/UserService.Tests/UserManager.cs
          dest: UserService.Tests/UserManager.cs
    graders:
      - type: output-matches
        config:
          pattern: (?i)(good|strong|solid|diverse|well|thorough|comprehensive|varied)
      - type: output-matches
        config:
          pattern: (?i)\b(GetUser_NonExistent_ReturnsNull|missing[- ]user|nonexistent user|user not found)\b
      # Merely saying a test checks for null does not credit the expected outcome.
      - type: output-matches
        config:
          pattern: (?i)\b(?:(?:verif(?:y|ies)|checks?|asserts?)\s+(?:(?:the|its)\s+)?(?:expected|promised)\s+(?:absence|null|missing[- ]user)|(?:GetUser_NonExistent_ReturnsNull|absence|null|missing[- ]user)\b[^.!?;\n]*?\b(?:is|are|as)\s+(?:(?:the|a)\s+)?(?:expected|promised|correct|contract|meaningful|valid|real verification|first[- ]class))\b
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that the test suite uses a variety of assertion types including equality, boolean, null, exception,
        and collection assertions
      - "Noted positive patterns: tests check multiple properties on returned objects, not just one field"
      - Credited the tests that verify absence and failure outcomes (no user found, delete returning false, role
        actually changing) as genuine verification rather than counting them as weak
      - Acknowledged the exception assertions with specific exception types and parameter name verification
      - If any gaps were identified, they were presented as minor enhancement opportunities rather than problems
      - The report acknowledges outright that this suite has good assertion diversity, instead of manufacturing
        problems so it has something to flag
  - name: Identify self-referential assertions in identity and round-trip tests
    prompt: |
      I want an assertion quality analysis of my Config tests. They all pass
      but regressions still escape. Analyze the depth of
      `ConfigService.Tests/ConfigTests.cs`, identify the tests whose assertions
      do not meaningfully verify the behavior implied by their names, and
      explain what concrete checks would make them useful. Include counts and
      method names. Do not edit the files.
    tags:
      capability: self-referential-assertion-detection
      risk: tautological-assertions
      journey: diagnose-escaping-regressions
    golden_trajectory:
      path: ./references/self-referential-config.json
    environment:
      files:
        - src: fixtures/self-referential/ConfigService.Tests/ConfigTests.cs
          dest: ConfigService.Tests/ConfigTests.cs
        - src: fixtures/self-referential/ConfigService.Tests/ConfigService.Tests.csproj
          dest: ConfigService.Tests/ConfigService.Tests.csproj
    graders:
      - type: tool-calls
        config:
          disallowed:
            - bash
            - powershell
            - execute
            - shell
            - run_shell_command
            - local_shell
            - edit
            - create
            - delete
            - remove
            - apply_patch
      - type: output-matches
        config:
          pattern: (self.referent|tautolog|identity|input.*equals.*output|circular|same.*value|trivial.*round.?trip|round.?trip|set.*get|write.*read|proves
            nothing|not.*(testing|verif)|meaningless)
      - type: output-matches
        config:
          pattern: (GetTimeout|GetRetries|FormatConnectionString|ValidateKey)
      - type: exit-success
      - type: prompt
    rubric:
      - Distinguished weak self-referential checks from meaningful round-trip behavior instead of treating every
        input/output equality assertion as incapable of catching defects
      - Credited GetTimeout_Default_ReturnsDefault and GetRetries_Default_ReturnsDefault as valid set/get storage tests
        while noting that their names overstate coverage because they never exercise the unset default/fallback behavior
      - Flagged FormatConnectionString_RoundTrip as only proving round-trip identity without verifying the formatted
        string's actual structure or content
      - Flagged ValidateKey_Valid_ReturnsSameKey as not exercising the validation logic — it only proves valid input
        passes through unchanged
      - Noted that the Serialize_Deserialize round-trip would only become meaningful with inputs that can actually
        break it (special characters, nulls, empty strings), rather than dismissing or endorsing it outright
      - "Recommended concrete improvements: test actual default values, test invalid keys, test formatted string
        structure, test edge-case serialization inputs"
  - name: Judge assertion strength in a shallow Jest suite
    prompt: |
      These Jest tests for our OrderService all pass and the file looks busy,
      but I don't trust them. Are these assertions actually verifying anything?
    tags:
      capability: assertion-strength-analysis
      risk: silently-passing-tests
      journey: assess-js-test-quality
    golden_trajectory:
      path: ./references/jest-shallow-order.json
    environment:
      files:
        - src: fixtures/jest-shallow/package.json
          dest: package.json
        - src: fixtures/jest-shallow/src/order.ts
          dest: src/order.ts
        - src: fixtures/jest-shallow/tests/order.test.ts
          dest: tests/order.test.ts
    graders:
      - type: output-matches
        config:
          pattern: (toBeDefined|toBeTruthy|toBeNull|shallow|weak|trivial)
      - type: output-matches
        config:
          pattern: (await|resolves|async)
      - type: prompt
    rubric:
      - Identified that the create/list tests assert only existence or type rather than the returned order's actual
        field values
      - Flagged the always-true assertion that cannot fail regardless of the code's behavior
      - "Flagged the un-awaited `.resolves` matcher as unreliable and shallow: it is not returned or awaited and only
        checks definedness; also recognized that synchronous `confirm` executes before `Promise.resolve`"
      - Flagged the assertion that compares a value to itself as incapable of detecting any bug
      - Flagged the not-equal-to-an-unrelated-string assertion as passing for almost any possible value
      - Recognized that the two tests pinning the returned customer and asserting the thrown error message do verify
        real behavior, instead of condemning the whole file
      - Recommended concrete replacement assertions pinning the actual expected values

  - name: Distinguish weak and meaningful assertions in a pytest suite
    prompt: |
      Analyze the assertion quality in `tests/test_inventory.py`. Some tests may
      only execute code or make checks that cannot catch a realistic bug, while
      others may already verify the behavior well. Identify both groups and
      recommend focused improvements. This is a read-only review.
    tags:
      capability: weak-assertion-triage
      risk: uncatchable-bugs
      journey: assess-python-test-quality
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "assertion-quality-pytest-mixed-inventory"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Read-only review of tests/test_inventory.py (6 tests). They fall into a weak group that cannot catch a realistic bug and a strong group that already verifies behavior well.

              **Weak — would not catch a production bug:**
              - `test_add_item_executes_without_verification` is assertion-free: it calls `inventory.add(...)` and asserts nothing, so it only proves the call does not raise. Add value/state assertions — e.g. `inventory.find("sku-1").quantity == 3` and `inventory.total() == 12.00`.
              - `test_find_item_exists` is trivial: `assert inventory.find("sku-1") is not None` confirms something came back but never checks which item or its quantity/price. Assert the returned item's fields.
              - `test_discount_is_valid` uses `assert True` with the `discount` variable unused. That is an always-true assertion that cannot fail regardless of the code. Replace it with a real check on the discount calculation (e.g. `apply_discount(100, 0.15) == 85`).

              **Strong — keep as genuine verification:**
              - `test_rejects_non_positive_quantity` uses `pytest.raises(ValueError)` to assert `add("sku-1", 0, ...)` is rejected — a meaningful exception assertion of the validation contract.
              - `test_notifies_when_stock_is_added` asserts `notifier.stock_added.assert_called_once_with("sku-1", 3)` — real side-effect verification of the collaboration, not just that code ran.
              - `test_total_uses_quantity_and_price` asserts the exact `inventory.total() == 22.00`. This is a meaningful equality assertion; I am not condemning equality assertions in general, only the ones that compare a value to itself or to nothing.

              **Recommendations:** give the three weak tests concrete value, state, or collection assertions (item fields after `add`, the real discount result, and the exact total/contents) so they can actually fail when the inventory logic breaks.
    environment:
      files:
        - src: fixtures/pytest-mixed/src/inventory.py
          dest: src/inventory.py
        - src: fixtures/pytest-mixed/tests/test_inventory.py
          dest: tests/test_inventory.py
    graders:
      - type: output-matches
        config:
          pattern: (no assertion|assertion.free|without.*assert|does not assert)
      - type: output-matches
        config:
          pattern: (assert True|always.true|tautolog|cannot fail)
      - type: output-matches
        config:
          pattern: (pytest\.raises|exception|mock|assert_called_once_with)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified test_add_item_executes_without_verification as assertion-free
      - Flagged test_find_item_exists as trivial because `is not None` does not verify which item or its values
      - Flagged test_discount_is_valid as an always-true assertion that cannot catch a production bug
      - Recognized the `pytest.raises(ValueError)` test as a meaningful exception assertion
      - Recognized `assert_called_once_with("sku-1", 3)` as meaningful side-effect verification
      - Recognized the exact total assertion as meaningful rather than condemning every equality assertion
      - Recommended concrete value, state, or collection assertions for the weak tests

  - name: Calibrate trivial checks without penalizing complete MSTest assertions
    tags:
      capability: calibrate-trivial-checks-without-penalizing-complete-mstest-assertions
      risk: false-positive-assertion-review
      journey: audit-test-assertions
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: assertion-quality-calibration-boundaries
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I reviewed all five methods. Two create false confidence; the other three protect their stated behavior.

              | Test | Assessment | Why |
              |------|------------|-----|
              | `LoadExisting_ReturnsConfiguredValue` | Meaningful | The null check guards exact assertions for `Environment == "prod"` and `RetryCount == 3`. |
              | `ParseInvalid_ThrowsFormatException` | Meaningful | The exact `FormatException` is the behavior this method promises to verify. |
              | `Save_PersistsRecord` | Meaningful | `Contains("order-42")` verifies that the save changed observable store state. |
              | `Ping_ReturnsResponse` | Weak | `IsNotNull` accepts any non-null response; it does not check the expected `"healthy"` result. |
              | `HealthCheck_Healthy` | Weak | `Assert.IsTrue(true)` is unconditional and passes even if the health check is broken. |

              Overall, two of five methods are weak. Add an exact response assertion for Ping and invoke a real health predicate instead of asserting a literal `true`; keep the complete value, exception, and state checks.
    prompt: |
      Review `CalibratedAssertions.Tests/CalibrationTests.cs` and separate the
      tests that can catch a real regression from those that create false
      confidence. Name the weak methods, explain why they are weak, and give a
      concise overall assessment. Do not edit or run the project.
    environment:
      files:
        - src: fixtures/calibration-boundaries/CalibratedAssertions.Tests/CalibratedAssertions.Tests.csproj
          dest: CalibratedAssertions.Tests/CalibratedAssertions.Tests.csproj
        - src: fixtures/calibration-boundaries/CalibratedAssertions.Tests/CalibrationTests.cs
          dest: CalibratedAssertions.Tests/CalibrationTests.cs
    graders:
      - type: tool-calls
        config:
          disallowed:
            - bash
            - powershell
            - execute
            - shell
            - run_shell_command
            - local_shell
            - edit
            - create
            - delete
            - remove
            - apply_patch

      # Bind each method to an affirmative label or to a bullet under a weak-test heading.
      # Stop at the next section; a keyword elsewhere in the report is not a verdict.
      - type: output-matches
        config:
          pattern: '(?im)(?:\bPing_ReturnsResponse\b[ \t`*():|–—-]*(?:is[ \t]+)?(?:weak|trivial|false confidence)\b|(?:(?:^|\|)[ \t`*#-]*(?:weak|trivial|false confidence)[ \t`*:|–—-]+|^[ \t#*]*(?:weak|trivial|false confidence)\b[^\r\n|]*\r?\n(?:[ \t]*(?:[-*] [^\r\n]*)?\r?\n)*[ \t]*[-*] [*`]*)\bPing_ReturnsResponse\b)'
      - type: output-matches
        config:
          pattern: '(?im)(?:\bHealthCheck_Healthy\b[ \t`*():|–—-]*(?:is[ \t]+)?(?:weak|trivial|false confidence|always[- ]true)\b|(?:(?:^|\|)[ \t`*#-]*(?:weak|trivial|false confidence|always[- ]true)[ \t`*:|–—-]+|^[ \t#*]*(?:weak|trivial|false confidence)\b[^\r\n|]*\r?\n(?:[ \t]*(?:[-*] [^\r\n]*)?\r?\n)*[ \t]*[-*] [*`]*)\bHealthCheck_Healthy\b)'
      - type: output-matches
        config:
          pattern: (ParseInvalid_ThrowsFormatException|Save_PersistsRecord|LoadExisting_ReturnsConfiguredValue)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified Ping_ReturnsResponse as trivial because an IsNotNull check alone does not verify the response content
      - Identified HealthCheck_Healthy as incapable of failing because it asserts the literal value true
      - Treated LoadExisting_ReturnsConfiguredValue as meaningful because the null guard is followed by exact value checks
      - Treated ParseInvalid_ThrowsFormatException as complete for its stated exception behavior despite having one assertion
      - Treated Save_PersistsRecord as meaningful state verification rather than dismissing its boolean assertion as trivial
      - Recommended concrete checks for the weak methods without treating the other three as weak
  - name: Recognize structural and interaction checks in Jest while flagging vacuous tests
    tags:
      capability: recognize-structural-and-interaction-checks-in-jest-while-flagging-vacuous-tests
      risk: false-positive-assertion-review
      journey: audit-test-assertions
    prompt: |
      Assess the five tests in `tests/notifier.test.js`. Identify the ones that
      would still pass after a realistic defect, but do not penalize tests that
      already pin returned structure or observable interactions. Give method
      names and focused replacement checks. This is a read-only review.
    environment:
      files:
        - src: fixtures/jest-structural/package.json
          dest: package.json
        - src: fixtures/jest-structural/src/notifier.js
          dest: src/notifier.js
        - src: fixtures/jest-structural/tests/notifier.test.js
          dest: tests/notifier.test.js
    graders:
      - type: output-matches
        config:
          pattern: returns something
      - type: output-matches
        config:
          pattern: is wired
      - type: output-matches
        config:
          pattern: (toBeDefined|assert.*true|always.true|vacuous|trivial|weak)
      - type: output-matches
        config:
          pattern: (snapshot|toMatchInlineSnapshot|toHaveBeenCalledWith|interaction|payload)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified "returns something" as weak because toBeDefined does not verify any response field
      - Identified "is wired" as vacuous because expect(true).toBe(true) cannot fail
      - Recognized the exact payload equality check as meaningful structural verification
      - Recognized the mock call argument check as meaningful side-effect or interaction verification
      - Recognized the inline snapshot as a structural assertion that pins the serialized response
      - Reported two weak tests and three meaningful tests without equating assertion variety with raw assertion count

  - name: Review generated registry verification
    prompt: |
      Review RegistryTests.cs before we rely on it to protect our generator.
      Which tests verify what their names promise, and what could still go
      wrong unnoticed? Recommend focused improvements. Do not edit or run code.
    tags:
      capability: generated-source-completeness
      risk: extra-registrations-and-broken-source
      journey: review-generator-tests
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: registry-output-review
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Static review: Registry_RegistersTwoClasses is weak. An extra
              Register(typeof(AlphaTests)); or missing closing brace preserves
              all three Contains fragments. Compare the complete independently
              expected generated source, not just counts or compilation.
              Registry_EmptyInput already pins the full empty registry and is
              meaningful; more assertion categories would not strengthen it.
    environment:
      files:
        - src: fixtures/predictable-output/Output.Tests.csproj
          dest: Output.Tests.csproj
        - src: fixtures/predictable-output/RegistryTests.cs
          dest: RegistryTests.cs
    graders:
      - type: tool-calls
        config: &static_review
          disallowed: [bash, powershell, execute, shell, run_shell_command, local_shell, edit, create, delete, remove, apply_patch]
      - type: output-matches
        config: {pattern: Registry_RegistersTwoClasses}
      - type: output-matches
        config: {pattern: '(?i)(exact|complete|full|snapshot)'}
