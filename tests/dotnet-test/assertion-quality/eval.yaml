      - type: output-matches
        config: {pattern: '(?i)(pars|JsonDocument|ReadResults)'}
      - type: exit-success
      - type: prompt
    rubric:
      - Explained that Report_ContainsResults accepts Alpha failed and Beta passed while retaining both totals and IDs; also recognized that matching text outside the intended payload is insufficient.
      - Recommended extracting and parsing the actual results payload, checking complete stable result identities and outcomes and rejecting unexpected entries, not comparing JSON property order.
      - Used Report_ParsesResults and ReadResults as available prior art without crediting their checks to Report_ContainsResults.
      - Credited Report_RejectsMissingResultsScript for checking that the parser rejects a missing results-script marker.

