        steps:
          - step_id: 1
            source: agent
            message: |
              Static review: Report_ContainsResults accepts Alpha failed and
              Beta passed with unchanged totals and IDs. Fragments can also
              occur outside the intended script payload. Reuse ReadResults to
              extract and parse that JSON, asserting complete stable identities,
              outcomes, totals and multiplicity. Report_ParsesResults already
              binds each ID to its outcome and rejects extra result records;
              its checks do not belong to the weaker test.
              Report_RejectsMissingResultsScript meaningfully verifies that the
              parser rejects a missing script marker. JSON property order is
              not contractual.
    environment:
