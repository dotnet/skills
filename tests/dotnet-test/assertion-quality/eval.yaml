  - name: Preserve intentionally partial and variable output contracts
    prompt: |
      Evaluate the three tests in PartialContractTests.cs. We want regression
      protection without brittle checks of unspecified output. Identify only
      supported weaknesses; do not edit files or execute commands.
    tags:
      capability: partial-output-contract-calibration
      risk: brittle-exactness-and-false-positives
      journey: review-stable-output-boundaries
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: partial-output-review
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Static review: all three tests protect their stated contracts.
              Log_IncludesRequiredWarning pins the required warning; other
              events are explicitly unspecified. Results_HaveExpectedStableRecords
              checks RenderResults' complete stable ID/outcome records in the
              promised order and separately validates its variable timestamp.
              Raw JSON equality would add brittleness without protection.
              Results_CountIsTwo independently checks DiscoverTestIds' cardinality;
              it does not claim identity or formatting coverage. Do not demand
              extra assertion types, deduplicate records, or normalize stable fields.
    environment:
      files:
        - src: fixtures/predictable-output/Output.Tests.csproj
          dest: Output.Tests.csproj
        - src: fixtures/predictable-output/PartialContractTests.cs
          dest: PartialContractTests.cs
