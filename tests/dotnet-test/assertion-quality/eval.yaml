      - type: output-matches
        config: {pattern: Results_CountIsTwo}
      - type: exit-success
      - type: prompt
    rubric:
      - Credited Log_IncludesRequiredWarning because only the warning is contractual, without demanding exact equality of variable or unspecified log events.
      - Credited Results_HaveExpectedStableRecords for complete stable identity/outcome records and a separately validated variable timestamp, without recommending raw JSON equality or deduplication.
      - Credited Results_CountIsTwo for its explicitly cardinality-only intent rather than claiming it promises record identities or manufacturing assertion-variety requirements.
