name: testability-obstacle
description: Evaluates the dotnet-test/testability-obstacle skill
type: capability
# Each scenario preserves a different public static API while requiring nested
# and async-safe overrides. Two runs provide repeated evidence for the common
# restore-previous-value failure without adding near-duplicate fixtures.
defaults:
  timeout: 20m
  runs: 2
stimuli:
  - name: Preserve a static clock API with nested and parallel scopes
    prompt: |
      ReceiptNamer is a public static utility, so its Create signature and static
      shape cannot change. Add a scoped clock seam for deterministic tests. The
      seam must support nested overrides, restore the outer clock when the inner
      scope ends, and isolate parallel async flows. Production still uses system
      time by default.
    environment:
      files:
        - src: fixtures/static-receipt-namer
          dest: fixtures/static-receipt-namer
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/static-receipt-namer/tests/ReceiptNamer.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "grep -q 'static class ReceiptNamer' fixtures/static-receipt-namer/src/ReceiptNamer.cs && grep -q 'AsyncLocal' fixtures/static-receipt-namer/src/ReceiptNamer.cs"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "grep -REqi 'nested|outer.*inner|inner.*outer|twice.*restore|restore.*first' fixtures/static-receipt-namer/tests --include='*.cs' && grep -REqi 'parallel|Task\\.Run|WhenAll' fixtures/static-receipt-namer/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Preserved the public static class and Create signature
      - Nested overrides restore the previously active clock
      - Concurrent async callers observe isolated deterministic clocks
      - Kept system time as the production default

  - name: Preserve a static filesystem API with nested fake stores
    prompt: |
      LegacyConfig is a public static helper and callers cannot change. Make Read
      deterministic without real disk access. Tests must nest two in-memory file
      stores and prove disposing the inner scope restores the outer store; they
      must also prove separate async flows remain isolated.
    environment:
      files:
        - src: fixtures/static-config-reader
          dest: fixtures/static-config-reader
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/static-config-reader/tests/StaticConfigReader.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "grep -q 'static class LegacyConfig' fixtures/static-config-reader/src/LegacyConfig.cs && grep -q 'AsyncLocal' fixtures/static-config-reader/src/LegacyConfig.cs && ! grep -q 'File.ReadAllText' fixtures/static-config-reader/tests/*.cs"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "grep -REqi 'nested|outer.*inner|inner.*outer|restore.*first' fixtures/static-config-reader/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Preserved LegacyConfig as a static public API
      - Production calls still read from the real filesystem by default
      - Tests prove nested restoration and concurrent async isolation without disk access

  - name: Restore environment overrides after exceptions and nesting
    prompt: |
      FeatureFlags.IsEnabled is a public static API that reads environment
      variables directly. Add a deterministic scoped seam without changing its
      signature. Each scope must own and restore the value active before it, with
      nested scopes unwinding in LIFO order through disposal. Tests must let an
      inner override throw, run its using/finally cleanup, and assert that the
      outer override is active before the outer scope is disposed. Make the outer
      value differ from the production fallback so clearing the override cannot
      accidentally pass. The tests must also overlap parallel async flows and
      prove isolation without setting process environment variables.
    environment:
      files:
        - src: fixtures/static-feature-flags
          dest: fixtures/static-feature-flags
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/static-feature-flags/tests/StaticFeatureFlags.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: >-
            sh -c "grep -q 'static class FeatureFlags'
            fixtures/static-feature-flags/src/FeatureFlags.cs
            && grep -q 'AsyncLocal'
            fixtures/static-feature-flags/src/FeatureFlags.cs
            && grep -q 'IDisposable'
            fixtures/static-feature-flags/src/FeatureFlags.cs
            && grep -q 'Dispose'
            fixtures/static-feature-flags/src/FeatureFlags.cs"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: >-
            sh -c "grep -REqi 'throw|exception'
            fixtures/static-feature-flags/tests --include='*.cs'
            && grep -REqi 'using[[:space:]]*(var[[:space:]]|[(])|finally'
            fixtures/static-feature-flags/tests --include='*.cs'
            && grep -REqi 'nested|outer.*inner|inner.*outer|restore'
            fixtures/static-feature-flags/tests --include='*.cs'
            && grep -REqi 'parallel|Task[.]Run|WhenAll'
            fixtures/static-feature-flags/tests --include='*.cs'
            && ! grep -Rq 'Environment.SetEnvironmentVariable'
            fixtures/static-feature-flags/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Preserved the static API and real environment lookup as the production default
      - Nested and exception-unwound overrides restore the previously active value
      - Concurrent async callers remain isolated without mutating process environment variables

  - name: Scope deterministic identity generation without breaking callers
    prompt: |
      CorrelationIds.Create is public and static and currently calls
      Guid.NewGuid. Keep its signature and static shape, but make it deterministic
      in nested and concurrent async tests. Disposing an inner generator override
      must restore the outer generator, not the production default.
    environment:
      files:
        - src: fixtures/static-correlation-ids
          dest: fixtures/static-correlation-ids
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/static-correlation-ids/tests/StaticCorrelationIds.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "grep -q 'static class CorrelationIds' fixtures/static-correlation-ids/src/CorrelationIds.cs && grep -q 'AsyncLocal' fixtures/static-correlation-ids/src/CorrelationIds.cs"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "grep -REqi 'nested|outer.*inner|inner.*outer|restore' fixtures/static-correlation-ids/tests --include='*.cs' && grep -REqi 'parallel|Task\\.Run|WhenAll' fixtures/static-correlation-ids/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Preserved the existing public static Create API
      - Kept Guid.NewGuid as the production default
      - Tests prove nested restoration and concurrent async isolation

  - name: Make delayed renewal testable with built-in fake time
    prompt: |
      LeaseRenewer waits with Task.Delay and then records UTC time. Make
      RenewAfterAsync deterministic on .NET 10 using built-in framework
      abstractions. Add tests proving it is incomplete before the deadline,
      completes when fake time advances, and honors cancellation. Do not add an
      IDelay abstraction or wait for wall-clock time.
    environment:
      files:
        - src: fixtures/delayed-renewal
          dest: fixtures/delayed-renewal
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/delayed-renewal/tests/DelayedRenewal.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: sh -c "grep -q 'TimeProvider' fixtures/delayed-renewal/src/LeaseRenewer.cs && ! grep -Rq 'IDelay' fixtures/delayed-renewal && ! grep -R 'Thread.Sleep' fixtures/delayed-renewal/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: sh -c "grep -REq 'Advance|AdvanceAsync|SetUtcNow' fixtures/delayed-renewal/tests --include='*.cs' && grep -REqi 'cancel|cancellation' fixtures/delayed-renewal/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Delayed completion and the recorded timestamp use the same controllable time source
      - Tests prove incomplete-before-deadline, completion-at-deadline, and cancellation without wall-clock waits
      - Kept system time as the production default

  - name: Make random promo codes deterministic with a narrow seam
    prompt: |
      PromoCodeGenerator uses Random.Shared, so I cannot prove the exact code in
      a unit test. Introduce the smallest production seam and add deterministic
      tests for prefix normalization, the exact generated suffix, and blank-prefix
      validation. Do not seed or replace process-global randomness.
    environment:
      files:
        - src: fixtures/random-promo-code
          dest: fixtures/random-promo-code
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/random-promo-code/tests/RandomPromoCode.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: >-
            sh -c "grep -Eq
            'Func<[^>]*int>|((global::)?System[.])?Random[?]?[[:space:]]+[A-Za-z_]'
            fixtures/random-promo-code/src/PromoCodeGenerator.cs
            && grep -REqi '[0-9]{4}|exact|suffix'
            fixtures/random-promo-code/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Exact suffix generation is controllable without mutating global Random state
      - Production behavior and the four-digit range remain unchanged
      - Passing tests cover the exact suffix, uppercase prefix, and every supplied blank-input case

  - name: Test report export without touching the real filesystem
    prompt: |
      ReportExporter writes directly through File.WriteAllText. Make Export
      deterministic and add tests for the exact newline-joined content, an empty
      row list, and invalid paths. Tests must not create temp files or touch the
      real filesystem. Keep the public Export signature unchanged.
    environment:
      files:
        - src: fixtures/file-report-exporter
          dest: fixtures/file-report-exporter
      commands:
        - cp fixtures/file-report-exporter/src/ReportExporter.cs.pristine fixtures/file-report-exporter/src/ReportExporter.cs && rm fixtures/file-report-exporter/src/ReportExporter.cs.pristine && find fixtures/file-report-exporter/tests -type f -name '*.cs' -delete
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/file-report-exporter/tests/FileReportExporter.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: >-
            sh -c "! grep -Eq
            'File[[:space:]]*\\.[[:space:]]*WriteAllText[[:space:]]*\\('
            fixtures/file-report-exporter/src/ReportExporter.cs
            && find fixtures/file-report-exporter/tests -type f -name '*.cs'
            -print -quit | grep -q .
            && grep -REq '\\[(Fact|Theory)'
            fixtures/file-report-exporter/tests --include='*.cs'
            && grep -REq 'Assert[[:space:]]*\\.'
            fixtures/file-report-exporter/tests --include='*.cs'
            && grep -REqi 'empty|invalid|argument|path'
            fixtures/file-report-exporter/tests --include='*.cs'
            && ! grep -REq
            'GetTemp|TempPath|System\\.IO\\.File|(^|[^[:alnum:]_.])File\\.(WriteAllText|ReadAllText|Open|Create|Delete)'
            fixtures/file-report-exporter/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Preserved the public Export signature and real-filesystem production behavior
      - Passing tests prove exact LF-joined content, empty rows, and invalid paths
      - Tests do not touch temp or real files

  - name: Keep the seam narrow and async-safe for static environment flags
    prompt: |
      FeatureFlags.IsEnabled is a public static API; callers cannot change. Use
      a narrow ambient override that flows across async work and restores the
      previous value on nested disposal. Keep the production default on
      Environment.GetEnvironmentVariable, do not wrap the entire static API, and
      do not add a DI container to this library. Expose only the members needed by
      the target behavior, and write tests that use Assert.True, Assert.False,
      and Assert.Throws<InvalidOperationException> to prove nested restoration and
      exception unwinding without mutating process state.
    environment:
      files:
        - src: fixtures/static-feature-flags
          dest: fixtures/static-feature-flags
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/static-feature-flags/tests/StaticFeatureFlags.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: >-
            sh -c "grep -REq
            'public[[:space:]]+static[[:space:]]+(partial[[:space:]]+)?class[[:space:]]+FeatureFlags'
            fixtures/static-feature-flags/src --include='*.cs'
            && grep -REq
            'public[[:space:]]+static[[:space:]]+bool[[:space:]]+IsEnabled[[:space:]]*\([[:space:]]*string[[:space:]]+name[[:space:]]*\)'
            fixtures/static-feature-flags/src --include='*.cs'
            && grep -Rq 'AsyncLocal'
            fixtures/static-feature-flags/src --include='*.cs'
            && grep -REq
            'Environment[[:space:]]*\.[[:space:]]*GetEnvironmentVariable[[:space:]]*\('
            fixtures/static-feature-flags/src --include='*.cs'
            && grep -Rq 'IDisposable'
            fixtures/static-feature-flags/src --include='*.cs'
            && ! grep -Rq 'Environment.SetEnvironmentVariable'
            fixtures/static-feature-flags/src --include='*.cs'
            && ! grep -REq
            '(ServiceCollection|IServiceCollection|Add(Singleton|Scoped|Transient)|BuildServiceProvider)'
            fixtures/static-feature-flags/src --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: >-
            sh -c "grep -REq '\[(Fact|Theory)'
            fixtures/static-feature-flags/tests --include='*.cs'
            && grep -REq 'Assert[[:space:]]*\.[[:space:]]*True'
            fixtures/static-feature-flags/tests --include='*.cs'
            && grep -REq 'Assert[[:space:]]*\.[[:space:]]*False'
            fixtures/static-feature-flags/tests --include='*.cs'
            && grep -REq
            'Assert[[:space:]]*\.[[:space:]]*Throws[[:space:]]*<[[:space:]]*InvalidOperationException[[:space:]]*>'
            fixtures/static-feature-flags/tests --include='*.cs'
            && grep -REqi 'nested|outer.*inner|inner.*outer|restore'
            fixtures/static-feature-flags/tests --include='*.cs'
            && grep -REqi 'using[[:space:]]*(var[[:space:]]|[(])|finally'
            fixtures/static-feature-flags/tests --include='*.cs'
            && grep -REqi 'parallel|Task[.]Run|WhenAll'
            fixtures/static-feature-flags/tests --include='*.cs'
            && ! grep -Rq 'Environment.SetEnvironmentVariable'
            fixtures/static-feature-flags/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Preserved the public static API and real environment lookup by default
      - Exposed only what the requested behavior needs without adding a DI container
      - Passing tests prove nested restoration, exception unwinding, and concurrent async isolation
      - Tests do not mutate process environment state or use wall-clock waits

  - name: Inject time into an instance class without adding a container
    prompt: |
      ExpirationPolicy is an ordinary instance class in
      fixtures/instance-expiration/ and DateTimeOffset.UtcNow prevents exact
      boundary tests. Add the smallest production seam, update its one
      manual factory, and add tests for immediately before and exactly at expiry.
      This library has no service container; do not add one or create a custom
      clock interface.
    environment:
      files:
        - src: fixtures/instance-expiration
          dest: fixtures/instance-expiration
      commands:
        - find fixtures/instance-expiration/tests -type f -name '*.cs' -delete
    graders:
      - type: run-command
        config:
          command: sh -c "dotnet test fixtures/instance-expiration/tests/InstanceExpiration.Tests.csproj"
          expected_exit_code: 0
          timeout: 10m
      - type: run-command
        config:
          command: >-
            sh -c "grep -q 'TimeProvider' fixtures/instance-expiration/src/ExpirationPolicy.cs
            && ! grep -q 'DateTimeOffset.UtcNow' fixtures/instance-expiration/src/ExpirationPolicy.cs
            && grep -q 'TimeProvider.System' fixtures/instance-expiration/src/ExpirationPolicyFactory.cs
            && grep -Rq 'FakeTimeProvider' fixtures/instance-expiration/tests --include='*.cs'
            && grep -REq '\\[(Fact|Theory)' fixtures/instance-expiration/tests --include='*.cs'
            && grep -REqi 'before|not.*expired' fixtures/instance-expiration/tests --include='*.cs'
            && grep -REqi 'exact|at.*expir|expired' fixtures/instance-expiration/tests --include='*.cs'"
          expected_exit_code: 0
          timeout: 1m
      - type: prompt
    rubric:
      - Preserved the existing public construction behavior without adding a container
      - The manual factory still supplies real system time in production
      - Preserved the DateTimeOffset boundary semantics
      - Added passing deterministic tests for immediately before and exactly at expiry
