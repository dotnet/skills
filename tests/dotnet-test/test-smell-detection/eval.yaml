name: test-smell-detection
description: Evaluates the dotnet-test/test-smell-detection skill
type: capability
config:
  timeout: 5m
stimuli:
  - name: Detect multiple test smells in order processing test suite
    prompt: |
      I'm worried about the quality of our OrderProcessor test suite.
      Please run a full testsmells.org 19-smell catalog audit on this
      suite and name each finding using the academic taxonomy
      (Conditional Test Logic, Mystery Guest, Sleepy Test,
      Assertion-Free Test, etc.) so I can cite the research catalog
      when I share the results.
    environment:
      files:
        - src: fixtures/smelly-tests/OrderService.Tests/OrderService.Tests.csproj
          dest: OrderService.Tests/OrderService.Tests.csproj
        - src: fixtures/smelly-tests/OrderService.Tests/OrderProcessorTests.cs
          dest: OrderService.Tests/OrderProcessorTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (conditional|if.else|control flow|branch)
      - type: output-matches
        config:
          pattern: (no assert|assertion.free|without.*assert|zero assert|missing.*assert)
      - type: output-matches
        config:
          pattern: (Thread\.Sleep|sleep|delay|sleepy)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified the conditional test logic in ProcessOrder_SetsCorrectStatus — the if/else means one branch is always
        untested
      - Flagged ProcessOrder_CompletesWithoutError as having no assertions — it only calls the method without verifying
        anything
      - Identified the Thread.Sleep(2000) in ProcessOrder_AsyncNotification_IsSent as a flakiness risk
      - Noted the try/catch pattern in ProcessOrder_EmptyOrder_ThrowsValidationError and suggested using
        Assert.ThrowsException instead
      - Identified the ToString() comparison in GetOrderSummary_ReturnsFormattedString as fragile
      - Noted the File.ReadAllText with a hard-coded path in ImportOrders_FromCsv_ParsesCorrectly as an external
        dependency problem
      - Provided concrete fix suggestions showing how to rewrite at least some of the smelly tests
  - name: Recognize well-written tests with no significant smells
    prompt: |
      Can you do a research-backed academic test-smell taxonomy review
      of my Calculator tests using the full testsmells.org 19-smell
      catalog? I want each finding (or "no smell detected") to map to
      a named smell from the academic literature so we can use these
      tests as a clean reference template.
    environment:
      files:
        - src: fixtures/clean-tests/Calculator.Tests/Calculator.Tests.csproj
          dest: Calculator.Tests/Calculator.Tests.csproj
        - src: fixtures/clean-tests/Calculator.Tests/ScientificCalculatorTests.cs
          dest: Calculator.Tests/ScientificCalculatorTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (clean|good|well.written|no.*(major|significant).*(smell|issue|problem)|solid|well.structured)
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that the test suite is well-structured with clear Arrange-Act-Assert patterns
      - Acknowledged proper use of Assert.ThrowsException for exception testing instead of try/catch
      - Noted the use of parameterized tests with [DataTestMethod] as a good practice
      - Did not invent false problems or flag correct patterns as smells
      - If any minor suggestions were made, they were presented as optional improvements rather than problems
  - name: Recognize integration tests and avoid false positives for external resources
    prompt: |
      Our team has been arguing about whether our integration tests are
      well-designed. Please use the academic testsmells.org 19-smell
      catalog to give us an objective severity-ranked assessment, with
      each finding tagged by its formal taxonomy name and integration-
      test calibration rules applied.
    environment:
      files:
        - src: fixtures/integration-tests/DataAccess.IntegrationTests/DataAccess.IntegrationTests.csproj
          dest: DataAccess.IntegrationTests/DataAccess.IntegrationTests.csproj
        - src: fixtures/integration-tests/DataAccess.IntegrationTests/UserRepositoryIntegrationTests.cs
          dest: DataAccess.IntegrationTests/UserRepositoryIntegrationTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (integration|appropriate|expected|legitimate|acceptable)
      - type: output-matches
        config:
          pattern: (Sleep|delay|sleepy|conditional|if.else|assert|no assert)
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that these are integration tests and did not flag database usage or insert-then-query patterns as
        smells
      - Identified the Thread.Sleep(3000) in NotifyOnInsert_SendsEventAfterDelay as a real smell even in an integration
        test context
      - Flagged the if/else conditional logic in GetUser_ReturnsCorrectType as a test smell — one branch is untested
      - Identified BulkInsert_RunsWithoutErrors as having no assertions — it exercises code but verifies nothing
      - Distinguished between the legitimate integration patterns (setup/teardown, multi-step persistence) and the
        actual smells (sleep, conditional, assertion-free)

  - name: Separate reasoned skips and self-documenting numbers from real smells
    prompt: |
      Audit `Inventory.Tests/InventoryServiceTests.cs` against the
      testsmells.org catalog. Name each finding using the academic
      taxonomy, and for every finding give me the severity plus the
      reason you assigned that severity, and the fixed code — I don't
      want "fix this", I want the replacement. If something looks like a
      smell but isn't, tell me that too and say why.
    environment:
      files:
        - src: fixtures/skip-and-magic/Inventory/Inventory.csproj
          dest: Inventory/Inventory.csproj
        - src: fixtures/skip-and-magic/Inventory/InventoryService.cs
          dest: Inventory/InventoryService.cs
        - src: fixtures/skip-and-magic/Inventory.Tests/Inventory.Tests.csproj
          dest: Inventory.Tests/Inventory.Tests.csproj
        - src: fixtures/skip-and-magic/Inventory.Tests/InventoryServiceTests.cs
          dest: Inventory.Tests/InventoryServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (Ignored Test|skip|Skip)
      - type: output-matches
        config:
          pattern: (Sleepy|Thread\.Sleep|sleep)
      - type: output-matches
        config:
          pattern: (Assertion.?Free|no assert|without.*assert)
      - type: output-matches
        config:
          pattern: (High|Medium|Low|severity)
      - type: exit-success
      - type: prompt
    rubric:
      - Flagged the Thread.Sleep(3000) in Replenish_AsyncJob_Completes as a High-severity Sleepy Test
      - Flagged Audit_RunsWithoutError as an Assertion-Free Test — it exercises the service but verifies nothing
      - Reported both skipped tests as Ignored Test, but treated the bare `Skip = "skip"` on
        Restock_FromSupplier_UpdatesQuantities as more concerning than the reasoned skip on
        Reserve_AcrossWarehouses_BalancesStock, which documents why and links a tracking issue
      - Did not flag the contextually obvious numbers as Magic Number Test — asserting a count of 3 right after
        adding three items, and a count of 1 after removing one of two, is self-documenting
      - Severity levels are justified with a stated rationale rather than assigned arbitrarily
      - Every finding includes a concrete fix example — the rewritten code — rather than a bare "fix this"
        instruction
      - Used xUnit terminology and APIs (Fact, Skip, Assert.Equal) rather than describing the suite in MSTest terms
  - name: Decline request to write new tests from scratch
    prompt: |
      I need to write unit tests for my ShoppingCart class. It supports
      adding items, removing items, calculating totals, and applying
      coupon codes. Can you write a complete MSTest test suite for me?
    # Off-target request: this skill audits existing tests, it does not author
    # suites. The skill IS loaded here on purpose — the property under test is
    # that it stays dormant and does not hijack the request. Do not add
    # `reject_skills: ["*"]`: forcing the skilled arm skill-free makes it
    # identical to the baseline arm, so the head-to-head score becomes pure
    # judge noise (it cost this skill a pass at -40% in run 30247614857).
    expect_activation: false
    environment:
      files:
        - src: ./fixtures/decline-request-to-write-new-tests-from-scratch/ShoppingCart.cs
          dest: ShoppingCart.cs
    graders:
      - type: output-matches
        config:
          pattern: (TestMethod|TestClass|\[Fact\]|test)
      - type: prompt
    rubric:
      - Wrote test methods for the ShoppingCart class
      - Covered multiple methods of the class
      - Did not derail into a test-smell audit of code the user never asked about
      - Judged on whether the requested behaviours are actually covered, not on which response happened to emit more
        test methods

  - name: Audit a JUnit suite using Java-specific smell markers
    prompt: >
      Review the tests in this Java project and tell me which test smells they
      have, with severity. I want to know what to fix first.
    environment:
      files:
        - src: fixtures/junit-smells/pom.xml
          dest: pom.xml
        - src: fixtures/junit-smells/src/main/java/com/example/Catalog.java
          dest: src/main/java/com/example/Catalog.java
        - src: fixtures/junit-smells/src/test/java/com/example/CatalogTest.java
          dest: src/test/java/com/example/CatalogTest.java
    graders:
      - type: output-matches
        config:
          pattern: (High|Medium|Low|severity)
      - type: output-matches
        config:
          pattern: (addAndDoNothing|assertion.free|no assertion|Unknown Test)
      - type: output-matches
        config:
          pattern: (sleep|Sleepy)
      - type: prompt
    rubric:
      - Flagged addAndDoNothing as an assertion-free test that verifies nothing
      - Flagged the Thread.sleep in addSleepy as a Sleepy Test
      - Flagged the branching inside addConditionalLogic as Conditional Test Logic
      - Flagged addLoadsFromFile as a Mystery Guest for depending on the file system
      - Flagged doEverythingAtOnce as an Eager Test that exercises many distinct methods
      - Flagged the unexplained 42 in quantityAfterAdds as a Magic Number Test
      - Flagged toStringFormat as Sensitive Equality for depending on the toString format
      - Flagged addNullSkuManualCatch for hand-rolling try/catch instead of using assertThrows
      - Flagged the @Disabled test as an Ignored Test
      - Recognised addThrowsOnNegativeCount as a well-written test rather than condemning the whole file
      - Used JUnit terminology and Java APIs throughout rather than describing the suite in MSTest terms

  - name: Calibrate skips and contextually obvious numbers
    prompt: >
      Audit these xUnit tests for smells. I care about real problems — please
      don't flag things that are actually fine.
    environment:
      files:
        - src: fixtures/skip-and-magic/Inventory.Tests/Inventory.Tests.csproj
          dest: Inventory.Tests/Inventory.Tests.csproj
        - src: fixtures/skip-and-magic/Inventory.Tests/InventoryServiceTests.cs
          dest: Inventory.Tests/InventoryServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (Skip|skipped|Ignored|disabled)
      - type: output-matches
        config:
          pattern: (sleep|Sleepy|Audit_RunsWithoutError|assertion.free|no assertion)
      - type: prompt
    rubric:
      - Flagged the Thread.Sleep(3000) in Replenish_AsyncJob_Completes as a real Sleepy Test
      - Flagged Audit_RunsWithoutError as an assertion-free test
      - Flagged the bare Skip = "skip" on Restock_FromSupplier_UpdatesQuantities as an Ignored Test with no
        justification
      - Distinguished the documented skip on Reserve_AcrossWarehouses_BalancesStock, which cites a tracking issue and
        a reason, as materially less concerning than the bare one
      - Did NOT flag the counts in AddItems_ThreeAdded_CountIsThree or RemoveItem_FromTwo_LeavesOne as magic numbers —
        adding three items and asserting three is self-documenting
      - Kept the report proportionate instead of inflating severity to justify the review
