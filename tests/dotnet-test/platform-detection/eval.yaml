name: platform-detection
description: Evaluates the dotnet-test/platform-detection skill
type: capability
executionShard: execution
# The first direct eval proved that a hidden reference skill compares baseline
# against baseline (0/5 activation, 0W/4T/1L). platform-detection is now a real
# user-facing diagnostic skill, and these added stimuli exercise decisions that
# baseline commonly gets wrong. Run 31180075357 produced 3W/9T/0L with a
# 4.8-vs-4.1 absolute quality delta. These advisory scenarios are cheap and
# already span 12 distinct precedence cases, so two independent runs measure
# the stable direction through the high judge-tie rate without adding duplicates.
defaults:
  timeout: 4m
  runs: 2
stimuli:
  - name: SDK 10 VSTest mode bridges to an MSTest.Sdk MTP project
    prompt: |
      Detect this project's test platform and test framework. The SDK is pinned
      in global.json and there is no explicit test.runner setting. Do not run or
      build anything.

      Answer with these three lines first:
      dotnet test mode: <VSTest or native MTP>
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: bridge-vstest-mode-to-mtp
      risk: medium
      journey: detect-sdk10-mstestsdk-default
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk10-mstest-sdk-default-vstest"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              dotnet test mode: VSTest
              Platform: MTP
              Framework: MSTest

              Why: global.json pins SDK 10.0.100 and has no test.runner override, so `dotnet test` starts in its VSTest command mode. But the project uses `Sdk="MSTest.Sdk/3.8.0"`, which turns on the MSTest runner and sets TestingPlatformDotnetTestSupport by default. That bridge redirects the VSTest target to InvokeTestingPlatform, so the tests actually execute on Microsoft.Testing.Platform. The framework is MSTest, supplied by the MSTest.Sdk project SDK. I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/sdk10-mstest-sdk-default-vstest/global.json
          dest: global.json
        - src: ./fixtures/sdk10-mstest-sdk-default-vstest/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*dotnet test mode:\s*\**\s*VSTest
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*(MTP|Microsoft\.Testing\.Platform)
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*MSTest
      - type: prompt
    rubric:
      - Identified VSTest as the dotnet test command mode because global.json has no test.runner override
      - Identified MTP as the executed platform because the pinned MSTest.Sdk 3.8 enables the runner and TestingPlatformDotnetTestSupport bridge
      - Identified MSTest from the MSTest.Sdk project SDK

  - name: SDK 9 MTP signal and framework versions live in Directory.Packages.props
    prompt: |
      Detect the test platform and framework for this project. The project uses
      central package management, and I need you to inspect all relevant project
      files without building or running tests.

      Answer with these two lines first:
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: detect-mtp-in-central-packages
      risk: medium
      journey: detect-sdk9-directory-packages
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk9-directory-packages-mtp"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Platform: MTP
              Framework: NUnit

              Why: central package management moves the deciding switches out of the .csproj. I inspected Directory.Packages.props and found both EnableNUnitRunner=true and TestingPlatformDotnetTestSupport=true set there. On SDK 9 the platform is decided by these MSBuild properties, so the enabled NUnit runner plus the dotnet test bridge means the tests run on Microsoft.Testing.Platform. The framework is NUnit, from the centrally versioned NUnit and NUnit3TestAdapter references in Directory.Packages.props. I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/sdk9-directory-packages-mtp/global.json
          dest: global.json
        - src: ./fixtures/sdk9-directory-packages-mtp/Directory.Packages.props
          dest: Directory.Packages.props
        - src: ./fixtures/sdk9-directory-packages-mtp/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*(MTP|Microsoft\.Testing\.Platform)
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*NUnit
      - type: output-matches
        config:
          pattern: Directory\.Packages\.props
      - type: output-matches
        config:
          pattern: EnableNUnitRunner
      - type: prompt
    rubric:
      - Read Directory.Packages.props and found both EnableNUnitRunner and TestingPlatformDotnetTestSupport there
      - Applied the SDK 8/9 property-based rule and concluded MTP
      - Identified NUnit from the centrally versioned NUnit and NUnit3TestAdapter references

  - name: xUnit runner property outranks Microsoft.NET.Test.Sdk on SDK 9
    prompt: |
      Is this xUnit project running on VSTest or Microsoft.Testing.Platform?
      Explain which project signal decides it. Do not build or run anything.

      Answer with these two lines first:
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: runner-property-outranks-testsdk
      risk: medium
      journey: detect-sdk9-xunit-runner
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk9-xunit-runner"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Platform: MTP
              Framework: xUnit

              Why: the deciding signal is UseMicrosoftTestingPlatformRunner=true together with TestingPlatformDotnetTestSupport=true. The xUnit runner is enabled and the bridge redirects `dotnet test`, so the tests execute on Microsoft.Testing.Platform. The Microsoft.NET.Test.Sdk reference does not make this a VSTest project; xunit.v3 pulls it in for compatibility, and it does not outrank the runner property. The framework is xUnit, from the xunit.v3 package. I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/sdk9-xunit-runner/global.json
          dest: global.json
        - src: ./fixtures/sdk9-xunit-runner/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*(MTP|Microsoft\.Testing\.Platform)
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*xUnit
      - type: output-matches
        config:
          pattern: UseMicrosoftTestingPlatformRunner
      - type: output-matches
        config:
          pattern: TestingPlatformDotnetTestSupport
      - type: prompt
    rubric:
      - Concluded MTP because the xUnit runner is enabled and TestingPlatformDotnetTestSupport redirects dotnet test
      - Identified xUnit from xunit.v3
      - Did not let the Microsoft.NET.Test.Sdk compatibility reference incorrectly decide VSTest

  - name: Classic packages.config project requires the standalone VSTest toolchain
    prompt: |
      Identify this project's project system, test platform, and test framework.
      Also tell me which command family it requires; do not migrate, build, or
      run anything.

      Answer with these three lines first:
      Project system: <SDK-style or classic non-SDK>
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: classify-classic-non-sdk-vstest
      risk: high
      journey: detect-classic-packages-config
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-classic-packages-config"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Project system: classic non-SDK
              Platform: VSTest
              Framework: MSTest

              Why: the .csproj uses ToolsVersion=15.0, imports Microsoft.Common.props and Microsoft.CSharp.targets, has an explicit Compile item, and a TargetFrameworkVersion of v4.7.2 — that is a classic non-SDK project. Dependencies come from packages.config, referencing MSTest.TestAdapter and MSTest.TestFramework 3.5.2, so the framework is MSTest. This project cannot use `dotnet test`; it needs the repository's MSBuild plus the standalone vstest.console/MSTest toolchain. I am not proposing migration or a PackageReference conversion, and I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/classic-packages-config/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/classic-packages-config/packages.config
          dest: packages.config
        - src: ./fixtures/classic-packages-config/LegacyTests.cs
          dest: LegacyTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Project system:\s*\**\s*classic non-SDK
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*VSTest
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*MSTest
      - type: output-matches
        config:
          pattern: (?i)(MSBuild|vstest\.console|MSTest\.exe)
      - type: prompt
    rubric:
      - Classified the ToolsVersion/import/explicit Compile project as classic non-SDK
      - Identified packages.config dependency management and MSTest 3.5.2
      - Identified VSTest and recommended the repository's MSBuild plus VSTest/MSTest toolchain rather than dotnet test
      - Did not propose migration or PackageReference conversion

  - name: SDK 10 explicit VSTest mode still bridges to MTP
    prompt: |
      Which test platform and which test framework does this project use? The
      SDK in use is the one pinned in global.json. Do not build or run anything.

      Answer with these three lines first, then explain briefly:
      dotnet test mode: <VSTest or native MTP>
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: separate-command-mode-from-platform
      risk: medium
      journey: detect-sdk10-explicit-vstest
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk10-globaljson-vstest-wins"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              dotnet test mode: VSTest
              Platform: MTP
              Framework: MSTest

              Why: global.json pins SDK 10.0.100 and sets test.runner to VSTest, which is authoritative for the `dotnet test` command mode, so the command mode is VSTest. That is separate from the platform that actually runs the tests: the project sets EnableMSTestRunner=true and TestingPlatformDotnetTestSupport=true, and the bridge redirects the VSTest target to InvokeTestingPlatform, so execution happens on Microsoft.Testing.Platform. The Microsoft.NET.Test.Sdk reference is not the deciding signal here. The framework is MSTest, from the MSTest metapackage. I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/sdk10-globaljson-vstest-wins/global.json
          dest: global.json
        - src: ./fixtures/sdk10-globaljson-vstest-wins/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*dotnet test mode:\s*\**\s*VSTest
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*(MTP|Microsoft\.Testing\.Platform)
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*MSTest
      - type: prompt
    rubric:
      - Distinguished VSTest command mode from the MTP platform that actually executes the tests
      - Treated global.json test.runner as authoritative for command mode because the pinned SDK is 10.0.100
      - Explained that TestingPlatformDotnetTestSupport=true redirects the VSTest target to InvokeTestingPlatform
      - Identified the framework as MSTest from the MSTest metapackage reference
      - Did not treat the presence of Microsoft.NET.Test.Sdk as the deciding signal

  - name: SDK 9 runner without bridge remains on VSTest
    prompt: |
      This SDK 9 project enables the MSTest MTP runner. Does `dotnet test`
      actually execute it through MTP, or does it remain on VSTest? Distinguish
      capability from the platform that runs. Do not build or run anything.

      Answer with these three lines first:
      dotnet test mode: <VSTest or native MTP>
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: runner-capable-but-not-bridged
      risk: high
      journey: detect-sdk9-runner-no-bridge
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk9-runner-no-bridge"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              dotnet test mode: VSTest
              Platform: VSTest
              Framework: MSTest

              Why: SDK 9 has no native MTP command mode, so `dotnet test` runs in VSTest mode. EnableMSTestRunner=true makes the project MTP-capable, but there is no TestingPlatformDotnetTestSupport bridge property set, so `dotnet test` does not redirect to Microsoft.Testing.Platform — the executed platform stays VSTest. The runner would only take effect if you launched the test app directly (dotnet run) or added the bridge. The framework is MSTest, from the MSTest metapackage. I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/sdk9-runner-no-bridge/global.json
          dest: global.json
        - src: ./fixtures/sdk9-runner-no-bridge/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*dotnet test mode:\s*\**\s*VSTest
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*VSTest
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*MSTest
      - type: output-matches
        config:
          pattern: TestingPlatformDotnetTestSupport
      - type: prompt
    rubric:
      - Identified VSTest command mode because SDK 9 has no native MTP mode
      - Identified VSTest as the executed platform because TestingPlatformDotnetTestSupport is absent
      - Explained that EnableMSTestRunner makes the project MTP-capable but does not redirect dotnet test by itself
      - Identified MSTest as the framework

  - name: MTP signal set in Directory.Build.props rather than the project file
    prompt: |
      Which test platform and which test framework does this project use? The
      SDK in use is the one pinned in global.json. Do not build or run anything.

      Answer with these two lines first, then explain briefly:
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: read-mtp-signal-in-props
      risk: medium
      journey: detect-sdk9-props-signal
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk9-props-mtp-signal"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Platform: MTP
              Framework: NUnit

              Why: the .csproj alone looks like a plain VSTest project, so I also read Directory.Build.props, where both EnableNUnitRunner=true and TestingPlatformDotnetTestSupport=true are set. On SDK 9 the platform is decided by these properties regardless of which file supplies them, so the enabled NUnit runner plus the dotnet test bridge means the tests run on Microsoft.Testing.Platform. There is no global.json test.runner section on SDK 9, so I applied the property-based rule instead of looking for one. The framework is NUnit, from the NUnit and NUnit3TestAdapter references. I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/sdk9-props-mtp-signal/global.json
          dest: global.json
        - src: ./fixtures/sdk9-props-mtp-signal/Directory.Build.props
          dest: Directory.Build.props
        - src: ./fixtures/sdk9-props-mtp-signal/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*(MTP|Microsoft\.Testing\.Platform)
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*NUnit
      - type: output-matches
        config:
          pattern: Directory\.Build\.props
      - type: output-matches
        config:
          pattern: EnableNUnitRunner
      - type: prompt
    rubric:
      - Read Directory.Build.props, not only the .csproj, and found both EnableNUnitRunner and TestingPlatformDotnetTestSupport there
      - Concluded MTP from the enabled NUnit runner plus dotnet test bridge
      - Identified the framework as NUnit from the NUnit and NUnit3TestAdapter references
      - Applied the SDK 8/9 property-based rules rather than looking for a global.json test.runner section that does not exist here

  - name: Microsoft.NET.Test.Sdk alongside an MTP runner property
    prompt: |
      Which test platform and which test framework does this project use? The
      SDK in use is the one pinned in global.json. Do not build or run anything.

      Answer with these two lines first, then explain briefly:
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: testsdk-reference-not-decisive
      risk: medium
      journey: detect-sdk9-runner-with-testsdk
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk9-mstest-runner-with-test-sdk"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Platform: MTP
              Framework: MSTest

              Why: the project sets EnableMSTestRunner=true and TestingPlatformDotnetTestSupport=true. Together these enable the MSTest runner and redirect `dotnet test` through the bridge, so the tests execute on Microsoft.Testing.Platform. The referenced Microsoft.NET.Test.Sdk does not make this a VSTest project — MSTest pulls it in for compatibility, and I checked the MTP signals before reasoning from it. The framework is MSTest, from the MSTest metapackage. I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/sdk9-mstest-runner-with-test-sdk/global.json
          dest: global.json
        - src: ./fixtures/sdk9-mstest-runner-with-test-sdk/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*(MTP|Microsoft\.Testing\.Platform)
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*MSTest
      - type: output-matches
        config:
          pattern: EnableMSTestRunner
      - type: output-matches
        config:
          pattern: TestingPlatformDotnetTestSupport
      - type: prompt
    rubric:
      - Concluded MTP from EnableMSTestRunner=true together with TestingPlatformDotnetTestSupport=true
      - Explicitly stated that Microsoft.NET.Test.Sdk being referenced does not make this a VSTest project, because frameworks pull it in for compatibility
      - Identified the framework as MSTest
      - Checked the MTP signals before reasoning from Microsoft.NET.Test.Sdk

  - name: MSTest.Sdk explicitly opts back into VSTest
    prompt: |
      MSTest.Sdk normally enables its MTP runner. This SDK 9 project sets an
      explicit opt-out. Which platform actually executes the tests, and which
      property decides it? Do not build or run anything.

      Answer with these three lines first:
      dotnet test mode: <VSTest or native MTP>
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: usevstest-opts-out-of-mtp
      risk: medium
      journey: detect-sdk9-mstestsdk-opt-out
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk9-mstest-sdk-use-vstest"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              dotnet test mode: VSTest
              Platform: VSTest
              Framework: MSTest

              Why: SDK 9 has no native MTP command mode, so `dotnet test` runs in VSTest mode. MSTest.Sdk normally enables its MTP runner, but this project sets UseVSTest=true, which is the deciding property: it opts MSTest.Sdk back out of the MTP runner, so the executed platform is VSTest. I did not infer MTP from the mere presence of MSTest.Sdk. The framework is MSTest, from the project SDK. I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/sdk9-mstest-sdk-use-vstest/global.json
          dest: global.json
        - src: ./fixtures/sdk9-mstest-sdk-use-vstest/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*dotnet test mode:\s*\**\s*VSTest
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*VSTest
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*MSTest
      - type: output-matches
        config:
          pattern: UseVSTest
      - type: prompt
    rubric:
      - Identified VSTest command mode because SDK 9 has no native MTP mode
      - Identified VSTest as the executed platform because UseVSTest=true opts MSTest.Sdk out of its default MTP runner
      - Named UseVSTest as the deciding property rather than inferring MTP from MSTest.Sdk
      - Identified MSTest from the project SDK

  - name: Project-level bridge opt-out overrides Directory.Build.props
    prompt: |
      Directory.Build.props enables the VSTest-to-MTP bridge, but this SDK 9
      project may override it. Determine the final evaluated test platform and
      framework without building or running anything.

      Answer with these three lines first:
      dotnet test mode: <VSTest or native MTP>
      Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
    tags:
      capability: apply-msbuild-property-precedence
      risk: high
      journey: detect-sdk9-project-override
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk9-project-disables-bridge"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              dotnet test mode: VSTest
              Platform: VSTest
              Framework: MSTest

              Why: Directory.Build.props sets TestingPlatformDotnetTestSupport=true, but the .csproj imports after it and sets the same property to false. By MSBuild precedence the later project-level assignment wins, so the final evaluated bridge value is false. That means `dotnet test` does not redirect to Microsoft.Testing.Platform even though EnableMSTestRunner=true, and the executed platform is VSTest. SDK 9 also has no native MTP command mode. The framework is MSTest, from the metapackage. I did not build or run anything.
    environment:
      files:
        - src: ./fixtures/sdk9-project-disables-bridge/global.json
          dest: global.json
        - src: ./fixtures/sdk9-project-disables-bridge/Directory.Build.props
          dest: Directory.Build.props
        - src: ./fixtures/sdk9-project-disables-bridge/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*dotnet test mode:\s*\**\s*VSTest
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Platform:\s*\**\s*VSTest
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Framework:\s*\**\s*MSTest
      - type: output-matches
        config:
          pattern: (?i)(override|precedence|final evaluated).*(false|disabled)|false.*(override|precedence|final evaluated)
      - type: prompt
    rubric:
      - Identified SDK 9 VSTest command mode
      - Applied MSBuild property precedence and concluded that the project-level false value overrides the earlier true value from Directory.Build.props
      - Identified VSTest as the executed platform despite EnableMSTestRunner because the final bridge value is false
      - Identified MSTest from the metapackage

  - name: Native MTP mode conflicts with MSTest.Sdk UseVSTest opt-out
    prompt: |
      global.json selects native Microsoft.Testing.Platform mode, but this
      MSTest.Sdk project sets UseVSTest=true. Can `dotnet test` execute this
      configuration as written? Do not build, run, or modify anything.

      Answer with this line first:
      Configuration: <compatible or incompatible>
    tags:
      capability: flag-runner-mode-conflict
      risk: high
      journey: detect-sdk10-native-mtp-conflict
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk10-native-mtp-use-vstest-conflict"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Configuration: incompatible

              Why: global.json pins SDK 10.0.100 with test.runner set to native Microsoft.Testing.Platform mode, which requires the project to run on MTP. But the project sets UseVSTest=true, which opts MSTest.Sdk into VSTest. These two demands contradict each other, so `dotnet test` cannot execute this configuration as written. To fix it, align the two settings deliberately: either remove UseVSTest so the project stays on MTP to match global.json, or change the repository runner mode to VSTest. I am not silently rewriting either file. The framework is MSTest, from the MSTest.Sdk project SDK. I did not build, run, or modify anything.
    environment:
      files:
        - src: ./fixtures/sdk10-native-mtp-use-vstest-conflict/global.json
          dest: global.json
        - src: ./fixtures/sdk10-native-mtp-use-vstest-conflict/TestProject.csproj
          dest: TestProject.csproj
    graders:
      - type: output-matches
        config:
          pattern: (?im)^\s*\**\s*Configuration:\s*\**\s*incompatible
      - type: output-matches
        config:
          pattern: (?i)global\.json.*(native|Microsoft\.Testing\.Platform|MTP)
      - type: output-matches
        config:
          pattern: (?i)UseVSTest.*(VSTest|opt)
      - type: prompt
    rubric:
      - Reported the configuration as incompatible rather than selecting a platform that could successfully run it
      - Explained that global.json requires native MTP command mode while UseVSTest opts the project into VSTest
      - Recommended aligning the repository runner mode and project setting without silently rewriting either
      - Identified the framework as MSTest

  - name: Conditional properties produce mixed platforms by target framework
    prompt: |
      Determine the executed test platform for each target framework in this SDK
      9 multi-targeted MSTest project. The runner and bridge properties are
      conditional. Do not build or run anything.

      Answer with these lines first:
      net8.0 Platform: <VSTest or MTP>
      net9.0 Platform: <VSTest or MTP>
      Framework: <MSTest, xUnit, NUnit, or TUnit>
