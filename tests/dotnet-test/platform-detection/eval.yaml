        schema_version: "ATIF-v1.6"
        session_id: "platform-detection-sdk9-mixed-tfm-platforms"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              net8.0 Platform: VSTest
              net9.0 Platform: MTP
              Framework: MSTest

              Why: the runner and bridge properties are inside a PropertyGroup conditioned on '$(TargetFramework)' == 'net9.0', so I evaluated each target separately. For net8.0 the condition is false, so neither EnableMSTestRunner nor TestingPlatformDotnetTestSupport is set, and `dotnet test` stays on VSTest. For net9.0 the condition is true, so both EnableMSTestRunner=true and TestingPlatformDotnetTestSupport=true evaluate, the bridge redirects, and the tests run on Microsoft.Testing.Platform. The framework is MSTest from the MSTest metapackage; the project does not collapse to a single platform. I did not build or run anything.
    environment:
