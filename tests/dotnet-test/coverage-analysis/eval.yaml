name: coverage-analysis
description: Evaluates the dotnet-test/coverage-analysis skill
type: capability
# Raised above the 5-trial eligibility floor deliberately.
#
# At exactly 5 trials the ONLY record that reaches p <= 0.05 is a clean 5W/0T/0L
# sweep: the sign test conditions on the discordant (non-tie) trials, so a single
# tie drops it to 4 and no record can pass. Run 30611635547 measured a 32% tie
# rate across this plugin, which gives a genuinely-helping skill roughly a 1-in-10
# chance of being certified. The eval now has eight distinct scenarios. Run
# 31012795023 produced 17W/6T/1L across 24 trials; two runs retain 16 counted
# trials and ample discordant headroom while avoiding 24 redundant agent sessions
# in the monolithic plugin job.
#
defaults:
  timeout: 6m
  runs: 2

stimuli:
  - name: Preserve a classic packages.config project when coverage data is absent
    prompt: |
      Analyze coverage and CRAP risk for this classic net472 MSTest project.
      There is no coverage report yet. Do not migrate the project or change its
      package management.
    environment:
      files:
        - src: fixtures/classic-packages-config
          dest: .
      commands:
        - mkdir -p .eval-baseline && cp Legacy.Tests.csproj .eval-baseline/Legacy.Tests.csproj && cp packages.config .eval-baseline/packages.config && find . -path './.eval-baseline' -prune -o -type f \( -name '*.csproj' -o -name '*.fsproj' -o -name '*.vbproj' \) -print | sort > .eval-baseline/project-files.txt
    graders:
      - type: run-command
        config:
          command: >-
            sh -c 'find . -path "./.eval-baseline" -prune -o -type f
            \( -name "*.csproj" -o -name "*.fsproj" -o -name "*.vbproj" \)
            -print | sort | diff -u .eval-baseline/project-files.txt -
            && diff -u .eval-baseline/Legacy.Tests.csproj Legacy.Tests.csproj
            && diff -u .eval-baseline/packages.config packages.config
            && test -z "$(find . -path "./.eval-baseline" -prune -o -type f
            -name "*.cobertura.xml" -print -quit)"'
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: (?i)(classic|non-SDK|packages\.config)
      - type: output-matches
        config:
          pattern: (?i)(Cobertura|coverage workflow|coverage command)
      - type: prompt
    rubric:
      - Recognizes that the classic packages.config project is unsafe for automatic SDK-style provider injection
      - Leaves the project and packages.config byte-for-byte unchanged
      - Uses a repository-owned coverage workflow if one exists; otherwise requests Cobertura XML and reports that CRAP cannot be calculated without real coverage
      - Does not create a temporary SDK-style wrapper/project or report substitute coverage from another assembly
      - Does not claim project-wide coverage or CRAP results when no report was produced
  - name: Project-wide coverage analysis with existing Cobertura data
    prompt: Run coverage analysis on this project. Coverage data is already in TestResults/coverage.cobertura.xml.
    environment:
      files:
        - src: fixtures/shared/ContosoUniversity.sln
          dest: ContosoUniversity.sln
        - src: fixtures/shared/ContosoUniversity/ContosoUniversity.csproj
          dest: ContosoUniversity/ContosoUniversity.csproj
        - src: fixtures/shared/ContosoUniversity/StudentService.cs
          dest: ContosoUniversity/StudentService.cs
        - src: fixtures/shared/ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
          dest: ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
        - src: fixtures/shared/ContosoUniversity.UnitTests/StudentServiceTests.cs
          dest: ContosoUniversity.UnitTests/StudentServiceTests.cs
        - src: fixtures/partial-coverage/coverage.cobertura.xml
          dest: TestResults/coverage.cobertura.xml
    graders:
      - type: output-matches
        config:
          pattern: CRAP|crap
      - type: output-matches
        config:
          pattern: CalculateGpa|Calculate_?Gpa
      - type: output-matches
        config:
          pattern: hotspot|risk|coverage
      - type: prompt
    rubric:
      - Discovers the solution and identifies the test project
      - Parses the existing Cobertura XML to extract per-method coverage data
      - Calculates CRAP scores and produces a sorted risk hotspot table
      - Identifies CalculateGpa as the highest-risk method (high complexity, low coverage)
      - Provides actionable recommendations for the riskiest methods
      - Generates or displays a coverage analysis report
  - name: Run coverage from scratch without existing data
    prompt: Analyze code coverage and risk hotspots for this project. I haven't run any coverage yet.
    environment:
      files:
        - src: fixtures/shared/ContosoUniversity.sln
          dest: ContosoUniversity.sln
        - src: fixtures/shared/ContosoUniversity/ContosoUniversity.csproj
          dest: ContosoUniversity/ContosoUniversity.csproj
        - src: fixtures/shared/ContosoUniversity/StudentService.cs
          dest: ContosoUniversity/StudentService.cs
        - src: fixtures/shared/ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
          dest: ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
        - src: fixtures/shared/ContosoUniversity.UnitTests/StudentServiceTests.cs
          dest: ContosoUniversity.UnitTests/StudentServiceTests.cs
    graders:
      - type: output-matches
        config:
          pattern: dotnet test
      - type: output-matches
        config:
          pattern: coverage
      - type: output-matches
        config:
          pattern: CRAP|crap|hotspot|risk
      - type: prompt
    rubric:
      - Detects the coverage provider from the test project .csproj (coverlet.collector)
      - Runs dotnet test with coverage collection to generate Cobertura XML
      - Extracts per-method coverage from the generated data
      - Computes CRAP scores and identifies risk hotspots
      - Identifies CalculateGpa as untested or highest risk due to complexity with no coverage
      - Provides prioritized recommendations for where to add tests
  - name: Coverage plateau diagnosis
    prompt: My coverage is stuck at 47% and I can't get it higher. What's blocking me? Coverage data is in
      TestResults/coverage.cobertura.xml.
    environment:
      files:
        - src: fixtures/shared/ContosoUniversity.sln
          dest: ContosoUniversity.sln
        - src: fixtures/shared/ContosoUniversity/ContosoUniversity.csproj
          dest: ContosoUniversity/ContosoUniversity.csproj
        - src: fixtures/shared/ContosoUniversity/StudentService.cs
          dest: ContosoUniversity/StudentService.cs
        - src: fixtures/shared/ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
          dest: ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
        - src: fixtures/shared/ContosoUniversity.UnitTests/StudentServiceTests.cs
          dest: ContosoUniversity.UnitTests/StudentServiceTests.cs
        - src: fixtures/plateau/coverage.cobertura.xml
          dest: TestResults/coverage.cobertura.xml
    graders:
      - type: output-matches
        config:
          pattern: CalculateGpa|Calculate_?Gpa
      - type: output-matches
        config:
          pattern: 0%|uncovered|untested|no coverage
      - type: prompt
    rubric:
      - Identifies CalculateGpa as the method blocking coverage improvement (0% coverage, highest complexity)
      - Explains that 3 of 4 methods are well-covered but CalculateGpa drags down the average
      - Quantifies the impact — covering CalculateGpa would raise overall coverage significantly
      - Uses CRAP scores to distinguish the risky gap (CalculateGpa) from trivial ones
      - Provides specific test recommendations for the uncovered method
  - name: Account for a gap spread across several members
    prompt: Coverage on this billing library is sitting around 60% and we need 80%. Which members are holding
      it back, and what has to be tested to get there? The Cobertura report is in
      TestResults/coverage.cobertura.xml.
    environment:
      files:
        - src: fixtures/spread-gap/Contoso.Billing/Contoso.Billing.csproj
          dest: Contoso.Billing/Contoso.Billing.csproj
        - src: fixtures/spread-gap/Contoso.Billing/InvoiceService.cs
          dest: Contoso.Billing/InvoiceService.cs
        - src: fixtures/spread-gap/Contoso.Billing/TaxService.cs
          dest: Contoso.Billing/TaxService.cs
        - src: fixtures/spread-gap/coverage.cobertura.xml
          dest: TestResults/coverage.cobertura.xml
    graders:
      - type: output-matches
        config:
          pattern: CRAP|crap
      - type: output-matches
        config:
          pattern: Apply
      - type: output-matches
        config:
          pattern: (?i)hotspot|risk
      - type: prompt
    rubric:
      - Reported overall line coverage as roughly 60% (25 of 42 lines), taken from the report rather than
        estimated
      - Listed every member below the 80% line threshold — Apply (0%), Validate (43%), Calculate (58%) and
        Resolve (67%) — not just the worst one
      - Did not claim any single member is the entire gap; the 17 uncovered lines are spread across four
        members, the largest of which accounts for only 5 of them
      - Made the arithmetic reconcile — reaching 80% needs 34 of the 42 lines covered, so covering the top
        hotspot alone (5 lines, taking it to about 71%) is not enough and more than one member must be tested
      - Ranked the members by CRAP/risk and named TaxService.Apply as the top hotspot because it is entirely
        uncovered
      - Gave a prioritized, specific recommendation naming which members to test first
  - name: Analyse a CI Cobertura report without re-running tests or installing tools
    prompt: Our CI already published a Cobertura report at artifacts/ci/coverage.cobertura.xml. Give me the top
      risk hotspots from it. Don't re-run the suite.
    environment:
      files:
        - src: fixtures/shared/ContosoUniversity.sln
          dest: ContosoUniversity.sln
        - src: fixtures/shared/ContosoUniversity/ContosoUniversity.csproj
          dest: ContosoUniversity/ContosoUniversity.csproj
        - src: fixtures/shared/ContosoUniversity/StudentService.cs
          dest: ContosoUniversity/StudentService.cs
        - src: fixtures/shared/ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
          dest: ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
        - src: fixtures/shared/ContosoUniversity.UnitTests/StudentServiceTests.cs
          dest: ContosoUniversity.UnitTests/StudentServiceTests.cs
        - src: fixtures/partial-coverage/coverage.cobertura.xml
          dest: artifacts/ci/coverage.cobertura.xml
    graders:
      - type: output-matches
        config:
          pattern: CalculateGpa|Calculate_?Gpa
      - type: output-matches
        config:
          pattern: CRAP|crap
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[$>]\s*)?dotnet\s+(?:test|tool\s+install)\b
      - type: prompt
    rubric:
      - Used the Cobertura report at the path the user gave, instead of scanning TestResults/ or reporting that
        no coverage data was found
      - Did not run dotnet test — the user supplied coverage data and explicitly asked not to re-run the suite
      - Did not install ReportGenerator or any other global tool; HTML/CSV reports were not requested
      - Delivered the CRAP/risk hotspot table as the response rather than deferring it behind optional report
        generation
      - Identified CalculateGpa as the top hotspot with the supporting complexity and coverage figures
  - name: Refactoring safety assessment from coverage data
    prompt: I need to refactor StudentService before adding a feature. Which methods are safe to change and which
      ones would I be refactoring blind? Coverage data is in TestResults/coverage.cobertura.xml.
    environment:
      files:
        - src: fixtures/shared/ContosoUniversity.sln
          dest: ContosoUniversity.sln
        - src: fixtures/shared/ContosoUniversity/ContosoUniversity.csproj
          dest: ContosoUniversity/ContosoUniversity.csproj
        - src: fixtures/shared/ContosoUniversity/StudentService.cs
          dest: ContosoUniversity/StudentService.cs
        - src: fixtures/shared/ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
          dest: ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
        - src: fixtures/shared/ContosoUniversity.UnitTests/StudentServiceTests.cs
          dest: ContosoUniversity.UnitTests/StudentServiceTests.cs
        - src: fixtures/partial-coverage/coverage.cobertura.xml
          dest: TestResults/coverage.cobertura.xml
    graders:
      - type: output-matches
        config:
          pattern: CRAP|crap
      - type: output-matches
        config:
          pattern: CalculateGpa|Calculate_?Gpa
      - type: output-matches
        config:
          pattern: FindById|Find_?ById
      - type: prompt
    rubric:
      - Ranks the methods by refactoring risk using CRAP rather than raw coverage percentage alone
      - Names CalculateGpa as the dangerous one — high complexity combined with low coverage means a regression would not be caught
      - Names the well-covered low-complexity methods (FindById, and Enroll or Search) as comparatively safe to change
      - Explains why complexity and coverage together determine refactoring safety, not either number on its own
      - Recommends adding tests to the risky method before refactoring it, rather than refactoring first
  - name: Distinguish branch coverage from line coverage
    prompt: My report says line coverage is 47% but I do not know which decision paths are actually untested. Which
      branches are missing tests, and does the line number overstate how well tested this is? Coverage data is in
      TestResults/coverage.cobertura.xml.
    environment:
      files:
        - src: fixtures/shared/ContosoUniversity.sln
          dest: ContosoUniversity.sln
        - src: fixtures/shared/ContosoUniversity/ContosoUniversity.csproj
          dest: ContosoUniversity/ContosoUniversity.csproj
        - src: fixtures/shared/ContosoUniversity/StudentService.cs
          dest: ContosoUniversity/StudentService.cs
        - src: fixtures/shared/ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
          dest: ContosoUniversity.UnitTests/ContosoUniversity.UnitTests.csproj
        - src: fixtures/shared/ContosoUniversity.UnitTests/StudentServiceTests.cs
          dest: ContosoUniversity.UnitTests/StudentServiceTests.cs
        - src: fixtures/partial-coverage/coverage.cobertura.xml
          dest: TestResults/coverage.cobertura.xml
    graders:
      - type: output-matches
        config:
          pattern: (?i)branch
      - type: output-matches
        config:
          pattern: CalculateGpa|Calculate_?Gpa
      - type: output-matches
        config:
          pattern: Enroll
      - type: prompt
    rubric:
      - Reports branch coverage as a separate figure from line coverage instead of collapsing the two
      - Notes that branch coverage is the lower of the two here, so the line figure is the more flattering number
      - Points at the partially covered conditions — Enroll is executed but has decisions taken only one way
      - Identifies CalculateGpa as having whole decision paths never exercised
      - Recommends tests that target the missing branch outcomes specifically, not just more line hits
