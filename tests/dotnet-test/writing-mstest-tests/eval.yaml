name: writing-mstest-tests
description: Evaluates the dotnet-test/writing-mstest-tests skill
type: capability
executionShard: mstest
# Run 31083033945 exhausted the monolithic plugin step after 233/234 trajectories.
# Three removed prompts were test-generation tasks now owned by
# code-testing-agent; they measured 1W/1T/1L in the last conclusive run.
# Expensive string/comparison generation prompts were replaced with focused
# no-tool API transformations. The unchanged retained set measured 11W/1T.
defaults:
  # Run 31039546010 had two plugin sessions stall at session.idle exactly at
  # five minutes (one before any response, one after two globs). Six minutes
  # gives transient model stalls recovery room without changing skill behavior.
  timeout: 6m
stimuli:
  - name: Modernize an async test with cooperative cancellation
    prompt: |
      Review and modernize this existing MSTest test so its timeout is
      cooperative and it flows the test framework's cancellation token:

      ```csharp
      [TestClass]
      public class DataFetcherTests
      {
          public TestContext TestContext { get; set; }

          [TestMethod]
          public async Task FetchAsync_ReturnsContent()
          {
              var result = await _service.FetchAsync(
                  "https://example.test", CancellationToken.None);
              Assert.IsNotNull(result);
          }
      }
      ```

      Show the corrected test and explain the relevant MSTest APIs. Do not run
      tools or add another test suite.
    tags:
      capability: cooperative-cancellation
      risk: hanging-test
      journey: modernize-existing-test
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-modernize-async-cancellation"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Here is the corrected test. The class is now sealed, the method stays async Task (never async void, so the runner can await it and observe assertion failures), and the timeout is cooperative and flows the framework's own cancellation token:

              ```csharp
              [TestClass]
              public sealed class DataFetcherTests
              {
                  public TestContext TestContext { get; set; }

                  [TestMethod]
                  [Timeout(30000, CooperativeCancellation = true)]
                  public async Task FetchAsync_ReturnsContent()
                  {
                      var result = await _service.FetchAsync(
                          "https://example.test", TestContext.CancellationToken);
                      Assert.IsNotNull(result);
                  }
              }
              ```

              Why these APIs matter:

              - `[Timeout(30000, CooperativeCancellation = true)]` asks MSTest to signal `TestContext.CancellationToken` when the 30-second budget elapses, instead of aborting the worker thread abruptly. The awaited work then unwinds cleanly and any registered cancellation callbacks run.
              - Pass `TestContext.CancellationToken` into `FetchAsync` rather than `CancellationToken.None`. A none token can never move to the cancelled state, so a cooperative timeout would have nothing to trip and the test could still hang.
              - Keep the method `async Task`, not `async void`. Only the Task form lets the framework wait for completion and surface failures.
              - Seal the test class. This matches MSTest guidance and stops other members from being inherited by accident.

              I only reshaped the existing test; I did not add a second test method or run any tools.
    graders:
      - type: output-matches
        config:
          pattern: async Task
      - type: output-matches
        config:
          pattern: \[Timeout\(\d+,\s*CooperativeCancellation\s*=\s*true\)\]
      - type: output-matches
        config:
          pattern: CancellationToken
      - type: prompt
    rubric:
      - Uses async Task test methods (not async void)
      - Uses TestContext.CancellationToken or mentions its importance for cooperative timeout
      - Uses a valid [Timeout(milliseconds, CooperativeCancellation = true)] attribute
      - Does not use CancellationToken.None when TestContext.CancellationToken is available
      - Seals the test class
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Fix swapped Assert.AreEqual arguments
    prompt: |
      Review and fix these MSTest assertions following MSTest best practices. Leave anything that is already correct untouched.

      ```csharp
      [TestClass]
      public class MathTests
      {
          [TestMethod]
          public void Add_TwoNumbers_ReturnsSum()
          {
              var result = Calculator.Add(2, 3);
              Assert.AreEqual(result, 5);
          }

          [TestMethod]
          public void Multiply_ByZero_ReturnsZero()
          {
              var result = Calculator.Multiply(42, 0);
              Assert.AreEqual(result, 0);
          }
      }
      ```
    tags:
      capability: assert-argument-order
      risk: misleading-failure-message
      journey: fix-review-feedback
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-fix-swapped-areequal"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Both assertions have the two arguments reversed. The MSTest signature is `Assert.AreEqual(expected, actual)`, so the value you expect must come first and the computed `result` second. The expected values themselves are right, so only the order changes:

              ```csharp
              [TestMethod]
              public void Add_TwoNumbers_ReturnsSum()
              {
                  var result = Calculator.Add(2, 3);
                  Assert.AreEqual(5, result);
              }

              [TestMethod]
              public void Multiply_ByZero_ReturnsZero()
              {
                  var result = Calculator.Multiply(42, 0);
                  Assert.AreEqual(0, result);
              }
              ```

              Why the order matters: when the check fails, MSTest prints a message shaped like `Assert.AreEqual failed. Expected:<X>. Actual:<Y>.` With the arguments swapped, those labels are backwards. A genuine regression would then show the computed value under `Expected:` and your intended constant under `Actual:`, which points whoever reads the log the wrong way. Nothing else in these two methods needed changing, so I left it as it was.
    graders:
      - type: output-matches
        config:
          pattern: Assert\.AreEqual\(5
      - type: output-matches
        config:
          pattern: Assert\.AreEqual\(0
      - type: prompt
    rubric:
      - Identifies the swapped arguments in Assert.AreEqual — expected should be first, actual second
      - Fixes to Assert.AreEqual(5, result) and Assert.AreEqual(0, result)
      - "Explains why argument order matters (failure messages show 'Expected: X, Actual: Y')"
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Modernize legacy test patterns
    prompt: Can you review these MSTest tests and modernize them to use current MSTest best practices like sealed classes and Assert.ThrowsExactly?
    environment:
      files:
        - src: fixtures/legacy-antipatterns/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/legacy-antipatterns/PriceCalculatorTests.cs
          dest: PriceCalculatorTests.cs
        - src: fixtures/legacy-antipatterns/PriceCalculator.cs
          dest: PriceCalculator.cs
        - src: fixtures/legacy-antipatterns/global.json
          dest: global.json
    tags:
      capability: legacy-modernization
      risk: accumulated-antipatterns
      journey: refactor-test-suite
    golden_trajectory:
      path: ./references/modernize-legacy-patterns.json
    graders:
      - type: output-matches
        config:
          pattern: \bsealed\b
      - type: output-matches
        config:
          pattern: Assert\.ThrowsExactly|Assert\.Throws
      - type: output-matches
        config:
          pattern: IsInstanceOfType
      - type: prompt
    rubric:
      - Seals the test class (adds 'sealed' keyword)
      - Replaces [ExpectedException] with Assert.ThrowsExactly or Assert.Throws
      - Fixes the swapped Assert.AreEqual arguments (expected first, actual second)
      - Moves synchronous setup from [TestInitialize] into the constructor, enabling readonly fields and satisfying
        nullability analyzers
      - Removes nullable annotation from TestContext property or switches to constructor injection
      - Improves test naming to be descriptive (replaces 'Test1', 'TestNegativeQuantity')
      - Replaces hard cast with Assert.IsInstanceOfType
      - Replaces manual foreach test data loop with [DataRow] or [DynamicData] attributes
  - name: Replace ExpectedException with Assert.Throws
    prompt: |
      Modernize this MSTest test to replace [ExpectedException] with Assert.ThrowsExactly, following MSTest best practices.

      ```csharp
      [TestMethod]
      [ExpectedException(typeof(ArgumentNullException))]
      public void CreateUser_NullEmail_ThrowsException()
      {
          var service = new UserService();
          service.CreateUser(null, "John");
      }
      ```
    tags:
      capability: exception-assertion
      risk: broad-exception-scope
      journey: modernize-exception-test
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-replace-expectedexception"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Replace the attribute-based expectation with an inline `Assert.ThrowsExactly` that scopes exactly the call under test:

              ```csharp
              [TestMethod]
              public void CreateUser_NullEmail_ThrowsArgumentNullException()
              {
                  var service = new UserService();

                  var ex = Assert.ThrowsExactly<ArgumentNullException>(
                      () => service.CreateUser(null, "John"));

                  Assert.AreEqual("email", ex.ParamName);
              }
              ```

              Why this is better than the ExpectedException attribute:

              - The lambda pins down which single statement must throw. The attribute passes if the exception comes from anywhere in the method, including arrange or setup lines, which can hide a bug.
              - `Assert.ThrowsExactly` and `Assert.Throws` return the caught exception, so you can assert on its properties. Here I check `ParamName == "email"` to prove the right argument was guarded; you could also inspect `Message`.
              - `ThrowsExactly<T>` requires the thrown type to be exactly `ArgumentNullException`. If you want a derived type such as a custom subclass to also satisfy the test, use `Assert.Throws<T>` instead, which matches `T` or anything deriving from it.
    graders:
      - type: output-matches
        config:
          pattern: Assert\.ThrowsExactly|Assert\.Throws
      - type: output-not-contains
        config:
          substring: "[ExpectedException]"
      - type: prompt
    rubric:
      - Replaces [ExpectedException] with Assert.ThrowsExactly<ArgumentNullException> or
        Assert.Throws<ArgumentNullException>
      - 'Wraps the call in a lambda: Assert.ThrowsExactly<ArgumentNullException>(() => service.CreateUser(null, "John"))'
      - Mentions that Assert.Throws/ThrowsExactly allows asserting on the exception properties (message, param name)
      - Explains the difference between Throws (matches derived types) and ThrowsExactly (exact type only)
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Keep exception assertions compatible with the installed MSTest version
    prompt: |
      Our classic net472 test project is pinned to MSTest.TestFramework 3.5.2
      in packages.config. This existing test does not compile because it uses a
      newer assertion API. Fix it without changing or upgrading dependencies,
      and explain the version constraint:

      ```csharp
      [TestMethod]
      public void Create_NullInput_Throws()
      {
          Assert.ThrowsExactly<ArgumentNullException>(
              () => new CustomerService().Create(null));
      }
      ```
    tags:
      capability: version-compatible-assertion
      risk: uncompilable-api
      journey: fix-classic-project
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-compatible-exception-assertion"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Your classic net472 project is pinned to MSTest.TestFramework 3.5.2 in packages.config, and the unified `Assert.ThrowsExactly<T>` API did not exist until MSTest 3.8. That is why the test does not compile. The compatible assertion for 3.5.2 is `Assert.ThrowsException<T>`, which takes the same lambda and returns the caught exception:

              ```csharp
              [TestMethod]
              public void Create_NullInput_Throws()
              {
                  var ex = Assert.ThrowsException<ArgumentNullException>(
                      () => new CustomerService().Create(null));

                  // Optional: pin the guarded argument. Match the real parameter name.
                  Assert.AreEqual("input", ex.ParamName);
              }
              ```

              This compiles against the package you already reference, with no change to packages.config and no dependency bump. The newer exact-type assertion is simply not present on 3.5.2, so it is not an option in this project; stay on `Assert.ThrowsException<ArgumentNullException>` for the null-guard test. If your team ever decides to move off 3.5.2, that is a separate, deliberate migration rather than something this fix should force.
    graders:
      - type: output-matches
        config:
          pattern: Assert\.ThrowsException<ArgumentNullException>
      - type: output-matches
        config:
          pattern: (?i)(MSTest(?:\.TestFramework)?\s*)?3\.5\.2
      - type: prompt
    rubric:
      - Uses Assert.ThrowsException<ArgumentNullException>, which is available in the pinned MSTest version
      - Does not recommend Assert.ThrowsExactly, unified modern assertions, or a package upgrade
      - Keeps the answer focused on a compatible test for the null guard
      - Optionally asserts the ArgumentNullException parameter name without requiring newer APIs
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Use proper collection assertions
    prompt: >
      I'm writing MSTest tests and I'm using Assert.IsTrue for all my collection checks. Are there more specific MSTest
      assertions I should use instead, following MSTest best practices? Here's what I have:


      ```csharp

      [TestMethod]

      public void GetActiveUsers_ReturnsOnlyActiveUsers()

      {
          var service = new UserService();
          var users = service.GetActiveUsers();

          Assert.IsTrue(users.Count > 0);
          Assert.IsTrue(users.All(u => u.IsActive));
          Assert.IsTrue(users.Count() == 3);
          var admin = users.Single(u => u.Role == "Admin");
          Assert.IsTrue(admin != null);
      }

      ```
    tags:
      capability: collection-assertion
      risk: weak-failure-diagnostics
      journey: improve-assertion-quality
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-collection-assertions"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Yes. Each generic `Assert.IsTrue` here hides what you are really checking, and MSTest has a more specific assertion for most of them (the unified `Assert` collection methods below are available on MSTest 3.8+):

              ```csharp
              [TestMethod]
              public void GetActiveUsers_ReturnsOnlyActiveUsers()
              {
                  var service = new UserService();
                  var users = service.GetActiveUsers();

                  Assert.IsNotEmpty(users);
                  Assert.HasCount(3, users);
                  Assert.IsEmpty(users.Where(u => !u.IsActive));
                  var admin = Assert.ContainsSingle(users.Where(u => u.Role == "Admin"));
                  Assert.IsNotNull(admin);
              }
              ```

              Mapping from what you had:

              - `Assert.IsTrue(users.Count > 0)` becomes `Assert.IsNotEmpty(users)` — it states the intent directly.
              - `Assert.IsTrue(users.Count() == 3)` becomes `Assert.HasCount(3, users)`, which reports the actual count on failure.
              - The `users.All(u => u.IsActive)` check becomes `Assert.IsEmpty(users.Where(u => !u.IsActive))` so a failure tells you an inactive user slipped through.
              - `users.Single(u => u.Role == "Admin")` becomes `Assert.ContainsSingle(...)`, which fails clearly when there are zero or more than one match instead of throwing a bare `InvalidOperationException`.
              - `Assert.IsTrue(admin != null)` becomes `Assert.IsNotNull(admin)`.

              The point of the specialized assertions is the failure message: a generic `IsTrue` can only tell you a boolean was false, while `HasCount`, `ContainsSingle`, `IsNotEmpty`, and `IsNotNull` print what the collection actually contained. When you need to confirm a specific element is present, `Assert.Contains(expectedItem, users)` does the same job with the same benefit.
    graders:
      - type: output-matches
        config:
          pattern: Assert\.HasCount|Assert\.AreEqual\(3
      - type: output-matches
        config:
          pattern: ContainsSingle|Assert\.IsNotNull
      - type: prompt
    rubric:
      - Replaces Assert.IsTrue(users.Count > 0) with Assert.IsNotEmpty(users) or similar
      - Replaces Assert.IsTrue(users.Count() == 3) with Assert.HasCount(3, users)
      - Replaces users.Single() with Assert.ContainsSingle for better failure messages
      - Uses Assert.IsNotNull instead of Assert.IsTrue(x != null)
      - Uses Assert.Contains for checking specific items in collections
      - Explains that specialized assertions give better failure messages than generic Assert.IsTrue
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Use proper type assertions instead of casts
    prompt: |
      Rewrite this MSTest test for a factory method to replace the hard cast with a proper type-checking assertion, following MSTest best practices.

      ```csharp
      [TestMethod]
      public void Create_ReturnsCorrectHandler()
      {
          var factory = new HandlerFactory();
          var result = factory.Create("email");

          var handler = (EmailHandler)result;
          Assert.IsNotNull(handler);
          Assert.AreEqual("email", handler.Type);
      }
      ```
    tags:
      capability: type-assertion
      risk: invalidcast-exception
      journey: replace-hard-cast
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-type-assertion-cast"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Replace the hard `(EmailHandler)result` cast with a type-checking assertion:

              ```csharp
              [TestMethod]
              public void Create_ReturnsCorrectHandler()
              {
                  var factory = new HandlerFactory();
                  var result = factory.Create("email");

                  // MSTest 3.x: the checked instance comes back through an out parameter
                  Assert.IsInstanceOfType<EmailHandler>(result, out var handler);
                  Assert.AreEqual("email", handler.Type);
              }
              ```

              Why this is better than the cast: if `result` is not an `EmailHandler`, the hard cast throws a bare `InvalidCastException` with no context, whereas `Assert.IsInstanceOfType<EmailHandler>` fails with a message that names the expected type and the actual type it received. It also keeps the type check inside the assertion story of the test.

              Use the typed value it hands back for the follow-up assertions. On MSTest 3.x the strongly typed instance is returned via an `out` parameter, as shown above. On MSTest 4.x the same method returns the value directly, so you drop the `out`:

              ```csharp
              // MSTest 4.x
              var handler = Assert.IsInstanceOfType<EmailHandler>(result);
              Assert.AreEqual("email", handler.Type);
              ```

              Either way you get a strongly typed `handler` for the `Type` check without a manual cast.
    graders:
      - type: output-matches
        config:
          pattern: IsInstanceOfType
      - type: prompt
    rubric:
      - Replaces hard cast (EmailHandler)result with Assert.IsInstanceOfType<EmailHandler>(result)
      - Shows how to use the typed result from IsInstanceOfType for further assertions
      - Explains that IsInstanceOfType provides a clear failure message showing actual vs expected type
      - Distinguishes MSTest 3.x (out parameter) vs 4.x (direct return) syntax
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Set up test lifecycle correctly
    prompt: >
      I need to set up my MSTest test lifecycle with both synchronous and asynchronous initialization. I want to inject
      TestContext via the constructor. What's the recommended way to do this in modern MSTest?
    environment:
      files:
        - src: fixtures/modern-mstest/TestProject.csproj
          dest: TestProject.csproj
        - src: fixtures/modern-mstest/global.json
          dest: global.json
    tags:
      capability: test-lifecycle
      risk: nullability-warnings
      journey: setup-new-fixture
    golden_trajectory:
      path: ./references/test-lifecycle.json
    graders:
      - type: output-matches
        config:
          pattern: constructor|\bctor\b
      - type: output-matches
        config:
          pattern: TestContext
      - type: output-matches
        config:
          pattern: \[TestInitialize\]|TestInitialize
      - type: prompt
    rubric:
      - Always initializes in the constructor — enables readonly fields and satisfies nullability analyzers (fields
        guaranteed non-null after construction)
      - Uses [TestInitialize] only for async initialization, combined with constructor for sync parts
      - Injects TestContext via constructor parameter (MSTest 3.6+) rather than property
      - "Mentions the execution order: Constructor → TestContext property → [TestInitialize] → Test → [TestCleanup] →
        Dispose"
      - Seals the test class
      - If TestContext property is used, does not add nullable annotation or = null! initializer
  - name: Use DynamicData with ValueTuples over object arrays
    prompt: |
      Rewrite this data-driven MSTest test to use type-safe ValueTuples instead of object arrays, following modern MSTest best practices.

      ```csharp
      [TestMethod]
      [DynamicData(nameof(TestData))]
      public void Validate_ReturnsExpected(string input, bool expected)
      {
          var result = Validator.IsValid(input);
          Assert.AreEqual(expected, result);
      }

      public static IEnumerable<object[]> TestData =>
      [
          ["valid@email.com", true],
          ["invalid", false],
          ["", false],
      ];
      ```
    tags:
      capability: data-driven-typing
      risk: object-array-untyped
      journey: modernize-data-source
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-dynamicdata-valuetuples"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Switch the data source from `IEnumerable<object[]>` to a type-safe ValueTuple sequence whose element types line up with the test-method parameters:

              ```csharp
              [TestMethod]
              [DynamicData(nameof(TestData))]
              public void Validate_ReturnsExpected(string input, bool expected)
              {
                  var result = Validator.IsValid(input);
                  Assert.AreEqual(expected, result);
              }

              public static IEnumerable<(string input, bool expected)> TestData =>
              [
                  ("valid@email.com", true),
                  ("invalid", false),
                  ("", false),
              ];
              ```

              Why the ValueTuple form is better:

              - The tuple element types `(string input, bool expected)` are checked at compile time against the `(string input, bool expected)` parameters. A wrong type or the wrong number of columns is now a build error, not a runtime `InvalidCastException` inside the test runner the way boxed `object[]` rows fail.
              - The named elements `input` and `expected` document what each column means, so the data reads like the method signature.

              This requires MSTest 3.7 or later. When you also need a custom `DisplayName` or extra metadata for a case, wrap the tuple in `TestDataRow<(string input, bool expected)>` (available on 3.8+) and set `DisplayName` on each row, which keeps the type safety while letting each case name itself in the results.
    graders:
      - type: output-matches
        config:
          pattern: ValueTuple|\(string.*bool\)
      - type: output-matches
        config:
          pattern: IEnumerable<\(
      - type: prompt
    rubric:
      - Recommends switching from IEnumerable<object[]> to IEnumerable<(string input, bool expected)> ValueTuples
      - Explains that ValueTuples provide compile-time type safety
      - Shows the correct ValueTuple syntax with named elements
      - Mentions TestDataRow<T> as an option when custom DisplayName or metadata is needed
      - Notes this requires MSTest 3.7+
  - name: Replace manual string checks with MSTest 3.10 assertions
    prompt: |
      This project uses MSTest 3.10. Rewrite these assertions with the most
      specific MSTest APIs. Do not add tests or run tools.

      ```csharp
      Assert.IsTrue(greeting.StartsWith("Dear "));
      Assert.IsTrue(greeting.EndsWith(","));
      Assert.IsTrue(Regex.IsMatch(slug, "^[a-z0-9-]+$"));
      ```
    tags:
      capability: string-assertion
      risk: opaque-boolean-check
      journey: adopt-newer-assertions
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-string-assertions-310"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              On MSTest 3.10 each of these manual boolean checks has a dedicated string assertion on the unified `Assert` class. The expected prefix, suffix, and pattern come first and the value under test comes second:

              ```csharp
              Assert.StartsWith("Dear ", greeting);
              Assert.EndsWith(",", greeting);
              Assert.MatchesRegex("^[a-z0-9-]+$", slug);
              ```

              Each rewrite keeps the exact meaning of the original: `greeting.StartsWith("Dear ")` maps to `Assert.StartsWith("Dear ", greeting)`, `greeting.EndsWith(",")` maps to `Assert.EndsWith(",", greeting)`, and `Regex.IsMatch(slug, "^[a-z0-9-]+$")` maps to `Assert.MatchesRegex("^[a-z0-9-]+$", slug)` with the same pattern untouched. The benefit is the failure message: instead of just reporting that a condition was `False`, these assertions print the actual string alongside the prefix, suffix, or regex it failed to match. Since the project is on 3.10, prefer these over `StringAssert` or wrapping the check back in `Assert.IsTrue`.
    graders:
      - type: output-matches
        config:
          pattern: Assert\.StartsWith
      - type: output-matches
        config:
          pattern: Assert\.EndsWith
      - type: output-matches
        config:
          pattern: Assert\.MatchesRegex
      - type: prompt
    rubric:
      - Replaced each manual boolean check with the corresponding MSTest 3.10 string assertion
      - Preserved the expected/actual argument meaning and regex pattern
      - Did not fall back to StringAssert or Assert.IsTrue
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Replace manual numeric bounds with MSTest 3.10 assertions
    prompt: |
      This project uses MSTest 3.10. Rewrite these checks with specific MSTest
      comparison assertions. Do not add tests or run tools.

      ```csharp
      Assert.IsTrue(score > 0);
      Assert.IsTrue(score < 100);
      Assert.IsTrue(score >= 60 && score <= 90);
      ```
    tags:
      capability: comparison-assertion
      risk: unclear-bounds-check
      journey: tighten-numeric-checks
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-numeric-assertions-310"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              On MSTest 3.10 the comparison assertions replace these manual `Assert.IsTrue` checks:

              ```csharp
              Assert.IsGreaterThan(0, score);
              Assert.IsLessThan(100, score);
              Assert.IsInRange(60, 90, score);
              ```

              How each maps:

              - `score > 0` becomes `Assert.IsGreaterThan(0, score)`. The signature is `Assert.IsGreaterThan(lowerBound, value)`, so the bound `0` comes first and the value under test `score` second.
              - `score < 100` becomes `Assert.IsLessThan(100, score)` — the upper bound first, then the value.
              - The combined `score >= 60 && score <= 90` becomes `Assert.IsInRange(60, 90, score)`, whose argument order is minimum, then maximum, then the actual value. The range is inclusive of both 60 and 90, matching the original `>=` and `<=`.

              These report the actual value and the bound that was violated on failure, which the plain `Assert.IsTrue` comparisons cannot do, so do not keep the manual boolean form.
    graders:
      - type: output-matches
        config:
          pattern: Assert\.IsGreaterThan
      - type: output-matches
        config:
          pattern: Assert\.IsLessThan
      - type: output-matches
        config:
          pattern: Assert\.IsInRange\(60,\s*90,\s*score\)
      - type: prompt
    rubric:
      - Used IsGreaterThan and IsLessThan for strict bounds
      - Used Assert.IsInRange(60, 90, score) with minimum, maximum, then actual value
      - Did not retain manual Assert.IsTrue comparisons
    constraints:
      reject_tools:
        - bash
        - edit
        - create
