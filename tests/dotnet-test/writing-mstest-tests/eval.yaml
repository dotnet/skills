  - name: Replace generic IsTrue checks for null, identity, emptiness, and absence
    prompt: |
      Every check in this MSTest test is written with Assert.IsTrue. Rewrite it so each check uses the most specific MSTest assertion available for what it is actually verifying, following MSTest best practices.

      ```csharp
      [TestMethod]
      public void SessionStore_StartTouchEndPurge_BehavesCorrectly()
      {
          var store = new SessionStore();
          var session = store.Start("alice");

          Assert.IsTrue(ReferenceEquals(session, store.Get("alice")));
          Assert.IsTrue(store.Get("nobody") == null);

          store.End("alice");
          Assert.IsTrue(!store.ActiveSessions().Contains(session));

          store.Purge();
          Assert.IsTrue(store.ActiveSessions().Count == 0);
      }
      ```
    tags:
      capability: specific-assertions
      risk: generic-boolean-assert
      journey: replace-istrue-checks
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "writing-mstest-tests-specific-istrue-replacements"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Each check is really testing something more specific than a bare boolean, so use the assertion that matches the intent:

              ```csharp
              [TestMethod]
              public void SessionStore_StartTouchEndPurge_BehavesCorrectly()
              {
                  var store = new SessionStore();
                  var session = store.Start("alice");

                  Assert.AreSame(session, store.Get("alice"));
                  Assert.IsNull(store.Get("nobody"));

                  store.End("alice");
                  Assert.DoesNotContain(session, store.ActiveSessions());

                  store.Purge();
                  Assert.IsEmpty(store.ActiveSessions());
              }
              ```

              How each maps:

              - `Assert.IsTrue(ReferenceEquals(session, store.Get("alice")))` becomes `Assert.AreSame(session, store.Get("alice"))`, which asserts the two references are the very same object instance, not merely equal values.
              - `Assert.IsTrue(store.Get("nobody") == null)` becomes `Assert.IsNull(store.Get("nobody"))`.
              - `Assert.IsTrue(!store.ActiveSessions().Contains(session))` becomes `Assert.DoesNotContain(session, store.ActiveSessions())`, which states that the item is absent from the collection; the item comes first, the collection second.
              - `Assert.IsTrue(store.ActiveSessions().Count == 0)` becomes `Assert.IsEmpty(store.ActiveSessions())`.

              The payoff is on failure. `Assert.AreSame`, `Assert.IsNull`, `Assert.DoesNotContain`, and `Assert.IsEmpty` each report what actually differed — the two distinct instances, the non-null value, the unexpected element, or the actual count — whereas the generic `Assert.IsTrue` form can only tell you a condition evaluated to false.
    graders:
      - type: output-matches
        config:
          pattern: Assert\.AreSame
      - type: output-matches
        config:
          pattern: Assert\.IsNull
      - type: output-matches
        config:
          pattern: Assert\.DoesNotContain
      - type: output-matches
        config:
          pattern: Assert\.IsEmpty
      - type: prompt
    rubric:
      - Replaced the ReferenceEquals check with an assertion dedicated to verifying that two references are the same
        object, not merely equal values
      - Replaced the '== null' comparison with a null-specific assertion
      - Replaced the negated Contains check with an assertion for an item being absent from a collection
      - Replaced the 'Count == 0' check with a dedicated empty-collection assertion
      - Explained that the specific assertions report what actually differed on failure, whereas the generic boolean form
        can only report that a condition was false
    constraints:
      reject_tools:
        - bash
        - edit
        - create

