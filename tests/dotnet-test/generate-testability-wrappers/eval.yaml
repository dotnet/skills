name: generate-testability-wrappers
description: Evaluates the dotnet-test/generate-testability-wrappers skill
type: capability
# Eight distinct stimuli provide credible power while preserving the established
# high-quality scenarios.
#
# With eight stimulus votes, 7W/1L reaches p <= 0.05. The new process, HTTP, and
# console cases exercise different abstraction decisions; repeated runs remain
# unchanged and collapse to one majority-direction vote per stimulus.
defaults:
  timeout: 4m
  runs: 3

stimuli:
  - name: Generate TimeProvider adoption for DateTime.UtcNow
    prompt: >
      My ReportGenerator class uses DateTime.UtcNow and I can't write
      deterministic unit tests for it. I'm on .NET 10. Can you create the
      right abstraction so I can mock time in tests?
    tags:
      capability: timeprovider-adoption
      risk: nondeterministic-time-tests
      journey: make-datetime-testable
    golden_trajectory:
      path: ./references/timeprovider-adoption.json
    environment:
      files:
        - src: ./fixtures/needs-wrappers
          dest: NeedsWrappers
    graders:
      - type: output-matches
        config:
          pattern: (TimeProvider|time provider)
      - type: output-matches
        config:
          pattern: (FakeTimeProvider|fake.*time|mock.*time|test.*time)
      - type: output-matches
        config:
          pattern: (AddSingleton|Register|services\.Add)
      - type: output-matches
        config:
          pattern: Assert\.(True|IsTrue|AreEqual|Equal)
      - type: output-matches
        config:
          pattern: Microsoft\.Extensions\.TimeProvider\.Testing
      - type: exit-success
      - type: prompt
    rubric:
      - Recommended TimeProvider as the built-in abstraction since the project targets .NET 10
      - Showed how to register TimeProvider.System in the DI container
      - Showed how to inject TimeProvider into the ReportGenerator class
      - Showed how to use FakeTimeProvider in tests to pin time
      - The sample test actually asserts on a time-dependent outcome after advancing the pinned clock, rather than only
        constructing the fake
      - Mentioned the Microsoft.Extensions.TimeProvider.Testing NuGet package for testing
      - Supplied all affected construction/registration changes needed for the sample to compile instead of leaving
        disconnected snippets

  - name: Generate custom Environment wrapper
    prompt: >
      My code calls Environment.GetEnvironmentVariable and
      Environment.MachineName directly. I need to make these testable. Can you
      generate a wrapper interface and implementation I can inject?
    tags:
      capability: custom-environment-wrapper
      risk: over-wrapped-api-surface
      journey: wrap-static-for-injection
    golden_trajectory:
      path: ./references/environment-wrapper.json
    environment:
      files:
        - src: ./fixtures/needs-wrappers
          dest: NeedsWrappers
    graders:
      - type: output-matches
        config:
          pattern: (interface|IEnvironment)
      - type: output-matches
        config:
          pattern: (GetEnvironmentVariable|MachineName)
      - type: output-matches
        config:
          pattern: \bsealed\b
      - type: output-matches
        config:
          pattern: AddSingleton
      - type: exit-success
      - type: prompt
    rubric:
      - Generated an interface with methods for GetEnvironmentVariable and MachineName
      - Generated a default implementation that delegates to the real Environment static class
      - Provided DI registration code for the wrapper
      - Chose a singleton lifetime (`AddSingleton`) because the wrapper holds no state, and said what would change for a
        stateful wrapper that needs `AddTransient` or `AddScoped`
      - Only wrapped the two members actually used in the code, not every Environment member

  - name: Recommend System.IO.Abstractions for file system calls
    prompt: >
      I've got File.WriteAllText, File.ReadAllText, and Directory.Exists
      scattered across my project. What's the best way to make these testable?
    tags:
      capability: recommend-established-package
      risk: reinvented-filesystem-wrapper
      journey: adopt-io-abstractions
    golden_trajectory:
      path: ./references/filesystem-abstractions.json
    environment:
      files:
        - src: ./fixtures/needs-wrappers
          dest: NeedsWrappers
    graders:
      - type: output-matches
        config:
          pattern: (System\.IO\.Abstractions|IFileSystem)
      - type: output-matches
        config:
          pattern: (MockFileSystem|mock.*file)
      - type: output-matches
        config:
          pattern: Assert\.(Equal|AreEqual)
      - type: output-matches
        config:
          pattern: System\.IO\.Abstractions\.TestingHelpers
      - type: exit-success
      - type: prompt
    rubric:
      - Recommended System.IO.Abstractions NuGet package instead of writing a custom wrapper
      - Showed how to register IFileSystem in DI
      - Showed how to use MockFileSystem in tests
      - The sample test seeds the in-memory file system and then asserts on what the code under test read back from it
      - Did not generate a custom file system wrapper when the established package exists
      - Included both package references plus compile-ready production composition instead of mixing package adoption
        with a second custom wrapper

  - name: Make time controllable in a library that has no DI container
    prompt: >
      Contoso.Retention is a NuGet library we ship. Its whole public API is
      static, so there is nothing for a caller to construct and no service
      container I can register anything into, and I'm not allowed to change the
      released signatures. Every method reads DateTime.UtcNow directly, so I
      can't test the expiry rules. Our test suite runs in parallel. How do I make
      the current time controllable from tests here?
    tags:
      capability: asynclocal-ambient-clock
      risk: parallel-test-clock-bleed
      journey: make-static-library-testable
    golden_trajectory:
      path: ./references/asynclocal-ambient-clock.json
    environment:
      files:
        - src: ./fixtures/no-di-library
          dest: Contoso.Retention
    graders:
      - type: output-matches
        config:
          pattern: AsyncLocal
      - type: output-matches
        config:
          pattern: \breadonly\b
      - type: output-matches
        config:
          pattern: (IDisposable|Dispose)
      - type: output-matches
        config:
          pattern: (?i)(InternalsVisibleTo|friend assembly|test assembly|public.*override|accessible)
      - type: output-matches
        config:
          pattern: (UtcDateTime|DateTimeKind|DateTime\s+UtcNow)
      - type: exit-success
      - type: prompt
    rubric:
      - Offered a way to substitute the clock that works without a service container and without changing the public API
      - Kept the substituted value flow-local across `async`/`await` so tests running in parallel cannot observe each
        other's substitution
      - Scoped the substitution to something the test disposes, so the real clock is restored when the test ends
      - Preserved the UTC semantics of the members it replaced, so the DateTimeKind the expiry comparisons and the
        file-name stamp depend on does not silently change
      - Explained the trade-offs of this ambient-context approach, including its per-call cost on the production path
      - Did not tell the user to introduce a DI container or change the released signatures after they ruled both out
      - Did not reach for [ThreadStatic], which does not flow across await points and so breaks the parallel-safety requirement
      - Kept the static members' DateTime return type and UTC DateTimeKind rather than silently widening them to
        DateTimeOffset
      - Made the override callable from the separate test assembly, using a precisely scoped friend assembly or an
        explicitly authorized public seam

  - name: Generate a minimal process runner wrapper
    tags:
      capability: generate-a-minimal-process-runner-wrapper
      risk: wrong-abstraction-boundary
      journey: introduce-testability-seam
    prompt: >
      ProcessLauncher directly uses Process.Start, WaitForExit, and ExitCode in
      fixtures/needs-wrappers. Generate the smallest injectable wrapper and real
      implementation needed to unit test it. Include the appropriate DI
      lifetime, but do not expose unrelated Process APIs.
    environment:
      files:
        - src: ./fixtures/needs-wrappers
          dest: NeedsWrappers
    graders:
      - type: output-matches
        config:
          pattern: (IProcessRunner|ProcessRunner)
      - type: output-matches
        config:
          pattern: (Start|WaitForExit|ExitCode)
      - type: output-matches
        config:
          pattern: AddSingleton
      - type: exit-success
      - type: prompt
    rubric:
      - Generated an injectable process abstraction and a default implementation delegating to System.Diagnostics.Process
      - Exposed only the start, completion, and exit-code behavior ProcessLauncher actually needs
      - Registered the stateless wrapper as a singleton and explained how ProcessLauncher receives it
      - Enabled tests to substitute process outcomes without starting a real process

  - name: Adopt IHttpClientFactory instead of wrapping HttpClient
    tags:
      capability: adopt-ihttpclientfactory-instead-of-wrapping-httpclient
      risk: wrong-abstraction-boundary
      journey: introduce-testability-seam
    prompt: >
      WeatherClient constructs HttpClient directly for every request. This .NET
      10 application already uses Microsoft.Extensions.DependencyInjection.
      Create the right testability abstraction and registration for HTTP without
      inventing a custom IHttpClient wrapper, and show how its tests can use a
      fake handler without network access.
    environment:
      files:
        - src: ./fixtures/needs-wrappers
          dest: NeedsWrappers
    graders:
      - type: output-matches
        config:
          pattern: (IHttpClientFactory|AddHttpClient|typed client)
      - type: output-matches
        config:
          pattern: (HttpMessageHandler|SendAsync)
      - type: exit-success
      - type: prompt
    rubric:
      - Used IHttpClientFactory or a typed HttpClient registration rather than generating a redundant custom wrapper
      - Removed per-call HttpClient construction and showed the corresponding DI registration
      - Demonstrated deterministic HTTP tests with a fake HttpMessageHandler and no network
      - Preserved cancellation and response behavior

  - name: Generate only the console members a prompt uses
    tags:
      capability: generate-only-the-console-members-a-prompt-uses
      risk: wrong-abstraction-boundary
      journey: introduce-testability-seam
    prompt: >
      ConsolePrompter calls Console.Write and Console.ReadLine directly. Generate
      an injectable console abstraction, default implementation, and DI
      registration so I can test the prompt and returned name. Keep the interface
      minimal; this class does not use colors, cursor control, or WriteLine.
    environment:
      files:
        - src: ./fixtures/needs-wrappers
          dest: NeedsWrappers
    graders:
      - type: output-matches
        config:
          pattern: (IConsole|ConsoleWrapper|ConsoleAdapter)
      - type: output-matches
        config:
          pattern: (ReadLine|Write\()
      - type: output-matches
        config:
          pattern: AddSingleton
      - type: exit-success
      - type: prompt
    rubric:
      - Generated an injectable console interface and default implementation
      - Wrapped only Write and ReadLine, excluding unused Console members
      - Registered the stateless adapter as a singleton
      - Enabled deterministic prompt tests without reading or writing the process console

  # Dormancy guard. "The static is already behind an interface" is in the skill's
  # own When Not to Use list, so staying dormant here is the correct behaviour,
  # not a discovery failure — without `expect_activation: false` the run counts
  # it as a scenario that should have activated and didn't. Do not add
  # `reject_skills: ["*"]`: forcing the skilled arm skill-free makes it identical
  # to the baseline arm, so the head-to-head score becomes pure judge noise.
  - name: Decline wrapper generation for already-abstracted code
    expect_activation: false
    prompt: >
      My code already uses IFileSystem from System.IO.Abstractions everywhere.
      Can you generate a file system wrapper for me?
    tags:
      capability: already-abstracted-guard
      risk: redundant-wrapper-layer
      journey: avoid-duplicate-abstraction
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "generate-testability-wrappers-decline-already-abstracted"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              You do not need a new wrapper — `DataService` already takes `IFileSystem` from `System.IO.Abstractions` through its constructor, so the file-system dependency is **already abstracted**. Generating another file-system interface on top of `IFileSystem` would be a redundant, duplicate layer with no benefit; there is no need for it.

              Since the seam already exists, just write the tests against it: inject a `MockFileSystem` from `System.IO.Abstractions.TestingHelpers`, seed the files you need, and assert on what `ReadData` returns. If you point me at a specific static call that is *not* yet behind an abstraction, I can help wrap that — but the existing `IFileSystem` usage should stay as-is.
    environment:
      files:
        - src: ./fixtures/decline-already-abstracted/DataService.cs
          dest: Services/DataService.cs
    graders:
      - type: output-matches
        config:
          pattern: (already|exists|abstracted|no need|unnecessary)
      - type: prompt
    rubric:
      - Recognized that IFileSystem is already in use and no wrapper generation is needed
      - Did not generate a redundant wrapper interface
      - May have suggested other improvements but did not create duplicate abstractions
      - Declined to wrap a dependency that is already abstracted rather than generating a second
        layer over IFileSystem — judge this on whether the redundant work was avoided, and do not
        reward the longer answer for proposing more scaffolding

  - name: Reach for the HttpClient test seam instead of wrapping it
    tags:
      capability: httpclient-seam-selection
      risk: hand-rolled-ihttpclient-interface
      journey: make-outbound-http-testable
    prompt: |
      InventorySyncService in Services/InventorySyncService.cs reaches our
      inventory API through a static HttpClient, so I cannot test
      GetOnHandQuantityAsync without hitting the network. How do I make this
      testable, and what does the unit test look like?
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "generate-testability-wrappers-httpclient-seam"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Do not put an interface in front of `HttpClient`. It already has a substitution point - the `HttpMessageHandler` it sends through - so the fix is to inject the client and stub the handler.

              Take `HttpClient` as a constructor parameter and drop the `static` field:

              ```csharp
              public sealed class InventorySyncService(HttpClient client)
              {
                  public async Task<int> GetOnHandQuantityAsync(string sku) { /* unchanged body, using client */ }
              }
              ```

              Program.cs already uses the built-in service collection. Replace its singleton registration with a typed client so handler lifetime and rotation stay correct:

              ```csharp
              builder.Services.AddHttpClient<InventorySyncService>(c =>
                  c.BaseAddress = new Uri("https://inventory.contoso.example/"));
              ```

              Then the test supplies a canned response through a stub handler:

              ```csharp
              private sealed class StubHandler(HttpResponseMessage response) : HttpMessageHandler
              {
                  protected override Task<HttpResponseMessage> SendAsync(HttpRequestMessage r, CancellationToken t)
                      => Task.FromResult(response);
              }

              [Fact]
              public async Task GetOnHandQuantityAsync_ReadsOnHandFromPayload()
              {
                  var body = new StringContent("""{"onHand":42}""");
                  var handler = new StubHandler(new HttpResponseMessage(HttpStatusCode.OK) { Content = body });
                  var sut = new InventorySyncService(new HttpClient(handler)
                      { BaseAddress = new Uri("https://inventory.contoso.example/") });

                  Assert.Equal(42, await sut.GetOnHandQuantityAsync("SKU-1"));
              }
              ```

              No new abstraction is generated: the seam is the handler, and the production changes are moving the client from a static field to a constructor parameter and replacing the singleton registration with a typed client.
    environment:
      files:
        - src: fixtures/http-static-client/Contoso.Sync.csproj
          dest: Contoso.Sync.csproj
        - src: fixtures/http-static-client/Services/InventorySyncService.cs
          dest: Services/InventorySyncService.cs
        - src: fixtures/http-static-client/Program.cs
          dest: Program.cs
    graders:
      - type: output-matches
        config:
          pattern: AddHttpClient
      - type: output-not-matches
        config:
          pattern: interface\s+IHttpClient
      - type: exit-success
      - type: prompt
    rubric:
      - Injected HttpClient through the constructor and removed the static field instead of leaving the service to build its own client
      - Used the existing DI container to register InventorySyncService as a typed client with AddHttpClient
      - Showed a unit test that substitutes outbound HTTP behaviour without contacting a live endpoint
      - Did not invent an IHttpClient or equivalent wrapper interface around HttpClient
      - Produced a test that asserts the on-hand quantity parsed from the canned response payload, whether shown in the reply or written to a test file