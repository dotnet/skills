name: grade-tests
executionShard: c
description: Evaluates the dotnet-test/grade-tests skill
type: capability
# Six distinct stimuli clear the eligibility floor.
#
# Repeated runs collapse to one majority-direction vote per stimulus, so they do
# not increase the sign-test sample. The three runs below measure reliability and
# reduce the chance that one noisy execution decides a stimulus vote.
#
# These tasks are expensive and cover distinct grading cases. Add a new
# discriminating stimulus, not more runs, to improve statistical power.
defaults:
  timeout: 5m
  runs: 3

stimuli:
  - name: Ask for a bounded list instead of grading the workspace
    prompt: Grade my tests.
    tags:
      capability: request-grading-scope
      risk: invented-grades
      journey: scope-before-grading
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "grade-tests-ask-for-bounded-list"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Before I grade anything, I need you to name the scope — grading is per-test, and I do not want to invent grades for tests you did not ask about.

              Could you tell me **which tests** you want reviewed? Any of these works:

              - Specific test method names (for example `AccountTests.Deposit_IncreasesBalance`).
              - One or more explicit file paths (for example `Some.Tests/AccountTests.cs`).
              - A diff or PR range, and I will grade only the tests it touches.

              I can see `AccountTests.cs`, `InvoiceTests.cs` and `ReportingTests.cs` in `Some.Tests/`, but I will not grade all of them blind. If your intent really is a **suite-wide** review of every test in the project, say so explicitly — for example "grade every test under Some.Tests/" — and I will scope the pass to that whole folder and tell you up front how many tests that covers so the report stays manageable.
    environment:
      files:
        - src: fixtures/no-list-provided/Some.Tests/Some.Tests.csproj
          dest: Some.Tests/Some.Tests.csproj
        - src: fixtures/no-list-provided/Some.Tests/AccountTests.cs
          dest: Some.Tests/AccountTests.cs
        - src: fixtures/no-list-provided/Some.Tests/InvoiceTests.cs
          dest: Some.Tests/InvoiceTests.cs
        - src: fixtures/no-list-provided/Some.Tests/ReportingTests.cs
          dest: Some.Tests/ReportingTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (specific|explicit|which tests|file paths|diff|scope)
      - type: exit-success
      - type: prompt
    rubric:
      - Requested enough scope to identify the tests the user wants reviewed
      - Did not invent grades for tests the user had not identified
      - Explained how to request a broader suite-wide review if that was the user's intent
    constraints:
      reject_tools:
        - edit
        - create
  - name: Grade pytest test methods using the same rubric
    prompt: |
      Please grade each pytest test function in `tests/test_shopping_cart.py`
      individually for test quality and produce a compact per-test
      table (one row per test) plus a short summary. Apply this repository's established
      per-test grading policy and do not modify any files. The production code
      is unavailable, so grade only observable issues in the test bodies and
      mark production-dependent behavior coverage as Unverified.
    tags:
      capability: pytest-per-test-grading
      risk: inconsistent-grade-schema
      journey: grade-python-tests-without-production
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "grade-tests-pytest-per-test"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I graded each pytest function on observable evidence in the test body only, since the production code is unavailable. Worst-graded tests are listed first.

              | Test | Grade | Band | Notes |
              | --- | --- | --- | --- |
              | test_clear_cart_works | F | Failing | Calls `clear_cart()` but asserts nothing — no observable behavior is checked. |
              | test_async_checkout_completes | F | Failing | `assert True` is always-true and the `time.sleep` makes it flaky; it verifies nothing. |
              | test_get_cart_returns_cart | C | Weak | Only a trivial `assert cart is not None`; never checks cart contents or state. |
              | test_calculate_total_with_discount_applies_discount_and_returns_rounded_amount | A | Strong | Clean AAA with equality and state assertions on the rounded total. |
              | test_calculate_total_with_negative_discount_raises_value_error | A | Strong | Complete exception assertion via `pytest.raises(ValueError, match=...)`. |

              **Summary:** two tests (`test_clear_cart_works`, `test_async_checkout_completes`) assert nothing and should be fixed first — they can never fail on a regression. `test_get_cart_returns_cart` needs a real content assertion. The two discount tests are solid models to follow.

              Production-dependent behavior coverage: **Unverified** — `ShoppingCart` source is not in the workspace, so I graded only what the test bodies show and did not judge whether they cover the production logic correctly.
    environment:
      files:
        - src: fixtures/python-pytest/test_shopping_cart.py
          dest: tests/test_shopping_cart.py
    graders:
      - type: output-matches
        config:
          pattern: \|\s*Test\s*\|\s*Grade\s*\|\s*Band\s*\|\s*Notes\s*\|
      - type: output-matches
        config:
          pattern: (test_calculate_total_with_discount_applies_discount_and_returns_rounded_amount.*\|\s*A\s*\|)
      - type: output-matches
        config:
          pattern: (test_calculate_total_with_negative_discount_raises_value_error.*\|\s*A\s*\|)
      - type: output-matches
        config:
          pattern: (test_get_cart_returns_cart.*\|\s*C\s*\|)
      - type: output-matches
        config:
          pattern: (test_clear_cart_works.*\|\s*F\s*\|)
      - type: output-matches
        config:
          pattern: (test_async_checkout_completes.*\|\s*F\s*\|)
      - type: output-matches
        config:
          pattern: (?i)Production-dependent behavior coverage:\s*(?:\*{1,2})?Unverified
      - type: exit-success
      - type: prompt
    rubric:
      - Graded `test_calculate_total_with_discount_applies_discount_and_returns_rounded_amount` as A — recognized the multi-assertion AAA structure with equality + state checks
      - Graded `test_calculate_total_with_negative_discount_raises_value_error` as A — recognized that `pytest.raises(ValueError, match=...)` is a complete exception assertion
      - Graded `test_get_cart_returns_cart` as C — trivial `assert ... is not None` only
      - Graded `test_clear_cart_works` as F — no assertions
      - Graded `test_async_checkout_completes` as F — combines `time.sleep` flakiness with an always-true `assert True`
      - Explicitly separated production-dependent behavior that could not be verified from findings observable in the test bodies
      - Used the stable `Test | Grade | Band | Notes` table schema with score bands rather than point scores
    constraints:
      reject_tools:
        - edit
        - create
  - name: Grade Go table-driven tests without misreading the loop as branching
    prompt: |
      Please grade each of the following Go test functions individually for
      test quality and produce a compact per-test table (one row per test)
      plus a short summary. They live in `calculator_test.go` and the code
      under test is in `calculator.go`. Apply this repository's established
      per-test grading policy and do not modify any files.

      Test functions to grade:
        - TestAdd_TableDriven
        - TestDivide_ByZero
        - TestParse_NoError
        - TestReset_NoAssertions
    tags:
      capability: go-table-driven-grading
      risk: misread-loop-as-branching
      journey: grade-go-tests-fairly
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "grade-tests-go-table-driven"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I graded each Go test on its own. The table-driven loop in `TestAdd_TableDriven` is idiomatic coverage, not untested branching, so I did not penalise it. Worst-graded first.

              | Test | Grade | Band | Notes |
              | --- | --- | --- | --- |
              | TestReset_NoAssertions | F | Failing | Calls `Reset()` but never asserts via `t.Error`/`t.Fatal` — nothing is verified. |
              | TestParse_NoError | C | Weak | Only checks that `err == nil`; never asserts the parsed value, so the happy path is unverified. |
              | TestAdd_TableDriven | A | Strong | Idiomatic table-driven subtests via `t.Run`; the loop drives many cases, each asserting the sum. |
              | TestDivide_ByZero | A | Strong | Asserts the returned error on divide-by-zero — a complete assertion of the error path. |

              **Summary:** `TestReset_NoAssertions` is the one to fix first — it exercises code without asserting. `TestParse_NoError` should also assert the parsed result, not just the absence of an error. The two A tests are good models: the table-driven one is correctly credited for its `t.Run` subtests rather than misread as an untested branch.
    environment:
      files:
        - src: fixtures/go-table-driven/go.mod
          dest: go.mod
        - src: fixtures/go-table-driven/calculator.go
          dest: calculator.go
        - src: fixtures/go-table-driven/calculator_test.go
          dest: calculator_test.go
    graders:
      - type: output-matches
        config:
          pattern: \|\s*Test\s*\|\s*Grade\s*\|\s*Band\s*\|\s*Notes\s*\|
      - type: output-matches
        config:
          pattern: (TestAdd_TableDriven.*\|\s*A\s*\|)
      - type: output-matches
        config:
          pattern: (TestDivide_ByZero.*\|\s*A\s*\|)
      - type: output-matches
        config:
          pattern: (TestParse_NoError.*\|\s*C\s*\|)
      - type: output-matches
        config:
          pattern: (TestReset_NoAssertions.*\|\s*F\s*\|)
      - type: exit-success
      - type: prompt
    rubric:
      - Graded `TestAdd_TableDriven` as A — recognized the idiomatic table-driven subtests driven by `t.Run`
      - Graded `TestDivide_ByZero` as A — the returned error is checked, which is a complete assertion of the error path
      - Graded `TestParse_NoError` as C — only checks that no error came back and never verifies the parsed value (trivial assertion)
      - Graded `TestReset_NoAssertions` as F — calls the function but never asserts via `t.Error`/`t.Fatal`
      - Used the stable `Test | Grade | Band | Notes` table schema with score bands rather than point scores
    constraints:
      reject_tools:
        - edit
        - create
  - name: Keep a 62-test grading report readable as a PR comment
    prompt: |
      Please grade every test declared in `Catalog.Tests/ProductCatalogTests.cs`
      individually for test quality — one row per test — and give me a short
      summary. The code under test is in `Catalog.Core/ProductCatalog.cs`.
      Apply this repository's established per-test grading policy and do not
      modify any files.

      This goes straight into a PR comment, so it has to stay readable when a
      reviewer opens the thread: I don't want to scroll past dozens of rows of
      passing tests before I reach anything I need to act on, and I don't want
      the same problem restated several times in different words.
    tags:
      capability: bounded-large-suite-report
      risk: unreadable-pr-comment
      journey: grade-large-suite-for-review
    golden_trajectory:
      path: ./references/large-suite-pr-comment.json
    environment:
      files:
        - src: fixtures/large-suite/Catalog.Core/Catalog.Core.csproj
          dest: Catalog.Core/Catalog.Core.csproj
        - src: fixtures/large-suite/Catalog.Core/ProductCatalog.cs
          dest: Catalog.Core/ProductCatalog.cs
        - src: fixtures/large-suite/Catalog.Tests/Catalog.Tests.csproj
          dest: Catalog.Tests/Catalog.Tests.csproj
        - src: fixtures/large-suite/Catalog.Tests/ProductCatalogTests.cs
          dest: Catalog.Tests/ProductCatalogTests.cs
    graders:
      - type: output-matches
        config:
          pattern: \|\s*Test\s*\|\s*Grade\s*\|\s*Band\s*\|\s*Notes\s*\|
      - type: output-matches
        config:
          pattern: <details>
      - type: output-matches
        config:
          pattern: (TotalValue_Runs.*\|\s*F\s*\|)
      - type: output-matches
        config:
          pattern: (Find_KnownSku_ReturnsSomething.*\|\s*C\s*\|)
      - type: exit-success
      - type: prompt
    rubric:
      - Kept the rendered table bounded and collapsed the overflow rows into a `<details>` block instead of spilling
        every graded test into the PR comment
      - Put the tests that need attention above the ones that do not, so the first rows a reviewer sees are the
        lowest-graded ones
      - The summary opens with the single most consequential observation and what to do about it, rather than being a
        recap of the table
      - Each distinct issue is reported once under the category that fits it best, rather than the same finding
        appearing again under several categories
      - Graded the tests whose body ends without any assertion as F, and the ones whose only assertion is a null check
        as C
      - Did not silently drop tests from the report — every test in the file is accounted for, whether in the visible
        rows or the collapsed section
    constraints:
      reject_tools:
        - edit
        - create

  - name: Grade tests when the production code under test is unavailable
    prompt: |
      Please grade each of the following test methods individually for test
      quality and produce a compact per-test table (one row per test) plus a
      short summary that we can post as a PR comment. They live in
      `Payments.Tests/PaymentGatewayTests.cs`. The production project
      `Payments.Core` is not in this workspace, so its source is unavailable.
      Apply this repository's established per-test grading policy and do not
      modify any files.

      Test methods to grade:
        - Payments.Tests.PaymentGatewayTests.Charge_ValidCard_ReturnsApprovedResult
        - Payments.Tests.PaymentGatewayTests.Charge_NegativeAmount_ThrowsArgumentOutOfRange
        - Payments.Tests.PaymentGatewayTests.Refund_ExistingCharge_ReturnsReceipt
        - Payments.Tests.PaymentGatewayTests.Settle_PendingBatch_Runs
    tags:
      capability: grade-without-production-source
      risk: invented-production-weaknesses
      journey: grade-tests-missing-production
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "grade-tests-production-unavailable"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              `Payments.Core` is not in the workspace, so I graded only what each test body observably does and did not invent production weaknesses. Worst-graded first.

              | Test | Grade | Band | Notes |
              | --- | --- | --- | --- |
              | Settle_PendingBatch_Runs | F | Failing | Calls `Settle(...)` but has no assertions at all. |
              | Refund_ExistingCharge_ReturnsReceipt | C | Weak | Only a trivial `Assert.IsNotNull(receipt)`; no fields or amounts checked. |
              | Charge_ValidCard_ReturnsApprovedResult | A | Strong | Equality assertions on the approved result — complete on the observable signal alone. |
              | Charge_NegativeAmount_ThrowsArgumentOutOfRange | A | Strong | Complete exception assertion; self-contained and does not need the production source to judge. |

              **Summary:** `Settle_PendingBatch_Runs` asserts nothing and is the top fix; `Refund_ExistingCharge_ReturnsReceipt` needs assertions on the receipt contents, not just non-null. The two charge tests are strong.

              Production-dependent behavior coverage: **Unverified** — because `Payments.Core` source is unavailable, I could not confirm whether these tests exercise the real gateway logic correctly; every grade above is based purely on the test bodies you supplied.
    environment:
      files:
        - src: fixtures/production-unavailable/Payments.Tests/Payments.Tests.csproj
          dest: Payments.Tests/Payments.Tests.csproj
        - src: fixtures/production-unavailable/Payments.Tests/PaymentGatewayTests.cs
          dest: Payments.Tests/PaymentGatewayTests.cs
    graders:
      - type: output-matches
        config:
          pattern: \|\s*Test\s*\|\s*Grade\s*\|\s*Band\s*\|\s*Notes\s*\|
      - type: output-matches
        config:
          pattern: (Charge_ValidCard_ReturnsApprovedResult.*\|\s*A\s*\|)
      - type: output-matches
        config:
          pattern: (Charge_NegativeAmount_ThrowsArgumentOutOfRange.*\|\s*A\s*\|)
      - type: output-matches
        config:
          pattern: (Refund_ExistingCharge_ReturnsReceipt.*\|\s*C\s*\|)
      - type: output-matches
        config:
          pattern: (Settle_PendingBatch_Runs.*\|\s*F\s*\|)
      - type: output-matches
        config:
          pattern: (?i)Production-dependent behavior coverage:\s*(?:\*{1,2})?Unverified
      - type: exit-success
      - type: prompt
    rubric:
      - Based every deduction on observable evidence in the supplied test bodies rather than inventing production behavior
      - Explicitly separated production-dependent behavior that could not be verified from findings observable in the test bodies
      - Graded `Charge_ValidCard_ReturnsApprovedResult` as A on the observable signal of its equality assertions, without inventing weaknesses that would need the unavailable production source to judge
      - Graded `Charge_NegativeAmount_ThrowsArgumentOutOfRange` as A — the exception assertion is complete on its own
      - Graded `Refund_ExistingCharge_ReturnsReceipt` as C — only a trivial `IsNotNull` on the receipt
      - Graded `Settle_PendingBatch_Runs` as F — no assertions at all
      - Used the stable `Test | Grade | Band | Notes` table schema with score bands rather than point scores
    constraints:
      reject_tools:
        - edit
        - create
  - name: Grade C# tests against available production code
    prompt: |
      Please grade each of the following test methods individually for test
      quality and produce a compact per-test table (one row per test) plus a
      short summary. They live in `Banking.Tests/BankAccountTests.cs` and the
      code under test is in `Banking/BankAccount.cs`. Apply this repository's
      established per-test grading policy and do not modify any files.

      Test methods to grade:
        - Banking.Tests.BankAccountTests.Withdraw_AmountExceedsBalance_ThrowsInsufficientFunds
        - Banking.Tests.BankAccountTests.Withdraw_SufficientFunds_LeavesBalanceUnchangedFromItself
        - Banking.Tests.BankAccountTests.ApplyInterest_RateDependsOnTier_UpdatesBalance
        - Banking.Tests.BankAccountTests.Deposit_NonPositiveAmount_HandledGracefully
    tags:
      capability: grade-against-production-source
      risk: self-referential-assertion-missed
      journey: grade-tests-with-production
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "grade-tests-production-available"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              `BankAccount.cs` is present in the workspace, so I graded each test against the real production code — no coverage was left unverified. Worst-graded first.

              | Test | Grade | Band | Notes |
              | --- | --- | --- | --- |
              | Deposit_NonPositiveAmount_HandledGracefully | F | Failing | An empty `catch` swallows the exception and the test asserts nothing — it passes regardless of behavior. |
              | Withdraw_SufficientFunds_LeavesBalanceUnchangedFromItself | D | Weak | `Assert.AreEqual(account.Balance, account.Balance)` is self-referential and verifies nothing about the withdrawal. |
              | ApplyInterest_RateDependsOnTier_UpdatesBalance | D | Weak | The assertions are chosen by `if`/tier logic that mirrors the implementation, so only one branch ever runs and it cannot catch a regression. |
              | Withdraw_AmountExceedsBalance_ThrowsInsufficientFunds | A | Strong | Asserts the specific `InsufficientFundsException` and its documented message — a complete assertion. |

              **Summary:** `Deposit_NonPositiveAmount_HandledGracefully` is the top fix — the empty catch means it can never fail. The two `D` tests give false confidence: one asserts a value against itself, the other lets conditional logic pick the expected result, so both mirror the code instead of pinning behavior. Rewrite them to assert concrete expected balances. `Withdraw_AmountExceedsBalance_ThrowsInsufficientFunds` is the model to follow.
    environment:
      files:
        - src: fixtures/production-available/Banking/Banking.csproj
          dest: Banking/Banking.csproj
        - src: fixtures/production-available/Banking/BankAccount.cs
          dest: Banking/BankAccount.cs
        - src: fixtures/production-available/Banking.Tests/Banking.Tests.csproj
          dest: Banking.Tests/Banking.Tests.csproj
        - src: fixtures/production-available/Banking.Tests/BankAccountTests.cs
          dest: Banking.Tests/BankAccountTests.cs
    graders:
      - type: output-matches
        config:
          pattern: \|\s*Test\s*\|\s*Grade\s*\|\s*Band\s*\|\s*Notes\s*\|
      - type: output-matches
        config:
          pattern: (Withdraw_AmountExceedsBalance_ThrowsInsufficientFunds.*\|\s*A\s*\|)
      - type: output-matches
        config:
          pattern: (Withdraw_SufficientFunds_LeavesBalanceUnchangedFromItself.*\|\s*D\s*\|)
      - type: output-matches
        config:
          pattern: (ApplyInterest_RateDependsOnTier_UpdatesBalance.*\|\s*D\s*\|)
      - type: output-matches
        config:
          pattern: (Deposit_NonPositiveAmount_HandledGracefully.*\|\s*F\s*\|)
      - type: output-not-matches
        config:
          pattern: (?i)Production-dependent behavior coverage:\s*(?:\*{1,2})?Unverified
      - type: exit-success
      - type: prompt
    rubric:
      - Graded `Withdraw_AmountExceedsBalance_ThrowsInsufficientFunds` as A — a specific exception type plus its documented message is a complete assertion
      - Graded `Withdraw_SufficientFunds_LeavesBalanceUnchangedFromItself` as D — `Assert.AreEqual(account.Balance, account.Balance)` is self-referential and verifies nothing about the withdrawal
      - Graded `ApplyInterest_RateDependsOnTier_UpdatesBalance` as D — conditional logic drives the assertions, so only one branch ever runs and the test mirrors the implementation
      - Graded `Deposit_NonPositiveAmount_HandledGracefully` as F — the empty catch swallows the exception and the test asserts nothing
      - Did not report production-dependent behavior as Unverified, because BankAccount.cs is present in the workspace
      - Used the stable `Test | Grade | Band | Notes` table schema with score bands rather than point scores
    constraints:
      reject_tools:
        - edit
        - create
