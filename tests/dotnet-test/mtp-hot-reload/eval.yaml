name: mtp-hot-reload
executionShard: c
description: Evaluates the dotnet-test/mtp-hot-reload skill
type: capability
config:
  timeout: 10m
stimuli:
  - name: Suggest hot reload for failing test in MTP project (SDK 9)
    prompt: I have a failing test in ProcessPayment_NegativeAmount_ThrowsException and want a host to stay running and
      automatically rerun it after each edit. Show me how to set up MTP hot reload for that loop, but do not run or
      modify anything.
    environment:
      files:
        - src: ./fixtures/suggest-hot-reload-for-failing-test-in-mtp-project-sdk-9/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/suggest-hot-reload-for-failing-test-in-mtp-project-sdk-9/PaymentProcessorTests.cs
          dest: PaymentProcessorTests.cs
        - src: ./fixtures/suggest-hot-reload-for-failing-test-in-mtp-project-sdk-9/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: Microsoft\.Testing\.Extensions\.HotReload
      - type: output-matches
        config:
          pattern: TESTINGPLATFORM_HOTRELOAD_ENABLED
      - type: output-matches
        config:
          pattern: dotnet run
      - type: prompt
    rubric:
      - Provides a complete setup for a persistent edit-and-rerun loop that matches the project as configured
      - Explains how the host remains active and reacts to subsequent edits
      - Does not execute or modify the project for this advisory request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Suggest hot reload for failing test in MTP project (SDK 10)
    prompt: My RemoveStock_ExceedsAvailable_ThrowsException test is failing. I want a host to keep running and rerun it
      after every edit. Show me how to set up MTP hot reload for this test project, but do not run or modify anything.
    environment:
      files:
        - src: ./fixtures/suggest-hot-reload-for-failing-test-in-mtp-project-sdk-10/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/suggest-hot-reload-for-failing-test-in-mtp-project-sdk-10/InventoryServiceTests.cs
          dest: InventoryServiceTests.cs
        - src: ./fixtures/suggest-hot-reload-for-failing-test-in-mtp-project-sdk-10/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: Microsoft\.Testing\.Extensions\.HotReload
      - type: output-matches
        config:
          pattern: TESTINGPLATFORM_HOTRELOAD_ENABLED
      - type: output-matches
        config:
          pattern: dotnet run
      - type: prompt
    rubric:
      - Provides a complete setup for a persistent edit-and-rerun loop that matches the native test application
      - Clearly explains the supported host experience and its user-visible limitation
      - Does not execute or modify the project for this advisory request
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Enable hot reload when package already installed
    prompt: I have a test project with some failing tests. I see Microsoft.Testing.Extensions.HotReload is already in the
      project. Show me how to start a long-lived host that automatically reruns tests after each edit, but do not run or
      modify anything.
    environment:
      files:
        - src: ./fixtures/enable-hot-reload-when-package-already-installed/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/enable-hot-reload-when-package-already-installed/EmailValidatorTests.cs
          dest: EmailValidatorTests.cs
        - src: ./fixtures/enable-hot-reload-when-package-already-installed/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: TESTINGPLATFORM_HOTRELOAD_ENABLED
      - type: output-matches
        config:
          pattern: dotnet run
      - type: output-not-matches
        config:
          pattern: dotnet add.*package.*HotReload
      - type: prompt
    rubric:
      - Gives the remaining steps needed to start the persistent edit-and-rerun loop
      - Does not tell the user to reinstall a dependency already present in the project
      - Explains what happens after the host starts
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: Suggest launchSettings.json configuration for hot reload
    prompt: I want to set up hot reload for my test project so it's always enabled when I run from the command line. I don't
      want to set the environment variable every time.
    environment:
      files:
        - src: ./fixtures/suggest-launchsettings-json-configuration-for-hot-reload/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/suggest-launchsettings-json-configuration-for-hot-reload/PaymentProcessorTests.cs
          dest: PaymentProcessorTests.cs
        - src: ./fixtures/suggest-launchsettings-json-configuration-for-hot-reload/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: launchSettings\.json
      - type: output-matches
        config:
          pattern: TESTINGPLATFORM_HOTRELOAD_ENABLED
      - type: output-matches
        config:
          pattern: Microsoft\.Testing\.Extensions\.HotReload
      - type: prompt
    rubric:
      - Provides a valid persistent project-local configuration for the hot-reload host
      - Includes any missing project prerequisite needed for that configuration to work
      - Explains why the setting persists across runs
  - name: Use dotnet run not dotnet test for hot reload
    prompt: I installed the hot reload package and set the environment variable. Should I use 'dotnet test' or 'dotnet run'
      to benefit from hot reload? Answer with the command, but do not run or modify anything.
    environment:
      files:
        - src: ./fixtures/use-dotnet-run-not-dotnet-test-for-hot-reload/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/use-dotnet-run-not-dotnet-test-for-hot-reload/EmailValidatorTests.cs
          dest: EmailValidatorTests.cs
        - src: ./fixtures/use-dotnet-run-not-dotnet-test-for-hot-reload/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet run
      - type: output-matches
        config:
          pattern: console mode
      - type: prompt
    rubric:
      - Selects the command that starts the persistent host rather than a one-time test invocation
      - Briefly explains the supported host experience without running or modifying anything
    constraints:
      reject_tools:
        - bash
        - edit
        - create
  - name: "Negative: VSTest project cannot use MTP hot reload"
    prompt: I have some failing tests and want to use hot reload to iterate faster. Can you set it up for me?
    environment:
      files:
        - src: ./fixtures/negative-vstest-project-cannot-use-mtp-hot-reload/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/negative-vstest-project-cannot-use-mtp-hot-reload/ShippingCalculatorTests.cs
          dest: ShippingCalculatorTests.cs
    graders:
      - type: output-matches
        config:
          pattern: (VSTest|not.*MTP|not.*Microsoft\.Testing\.Platform|migrate|upgrade)
      - type: output-not-matches
        config:
          pattern: TESTINGPLATFORM_HOTRELOAD_ENABLED
      - type: output-not-matches
        config:
          pattern: (?is)(hot reload is set up|(?:installed|added).{0,60}Microsoft\.Testing\.Extensions\.HotReload|created.{0,60}launchSettings\.json)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*]\s*)?`?(?:[$>]\s*)?dotnet\s+(?:run|add)\b
      - type: output-matches
        config:
          pattern: (?im)dotnet\s+watch\b[^\r\n]*\btest\b|\bdotnet\s+watch\s+test\b
      - type: prompt
    rubric:
      - Correctly explains whether hot reload is available for the project as configured
      - Does not modify the project or apply settings that cannot work with its current platform
      - Gives valid next options without starting an unrequested migration
    constraints:
      expect_tools:
        - bash
      reject_tools:
        - edit
        - create
  - name: Run specific failing test with hot reload filter
    prompt: I only want to hot-reload iterate on the ProcessPayment_NegativeAmount_ThrowsException test. Give me the
      command that filters to just that test while using hot reload, but do not run or modify anything.
    environment:
      files:
        - src: ./fixtures/run-specific-failing-test-with-hot-reload-filter/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/run-specific-failing-test-with-hot-reload-filter/PaymentProcessorTests.cs
          dest: PaymentProcessorTests.cs
        - src: ./fixtures/run-specific-failing-test-with-hot-reload-filter/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: dotnet run
      - type: output-matches
        config:
          pattern: --filter
      - type: output-matches
        config:
          pattern: ProcessPayment_NegativeAmount
      - type: prompt
    rubric:
      - Gives one runnable command that starts the persistent host and limits reruns to the requested test
      - Includes the activation prerequisite without executing or modifying the project
    constraints:
      reject_tools:
        - bash
        - edit
        - create

  - name: Restart the host after an unsupported hot reload edit
    prompt: |
      The MTP hot-reload host is already running with:
      dotnet run --project TestProject.csproj -- --filter "FullyQualifiedName~Validate_MissingAtSign_ReturnsFalse"

      I changed a production method signature and added a new type, and now the
      console reports an unsupported edit while the tests no longer update. Can
      hot reload apply this change, and what should I do next? Preserve that
      targeted loop after recovery and include a watch-managed fallback for
      future unsupported edits.
    environment:
      files:
        - src: ./fixtures/enable-hot-reload-when-package-already-installed/TestProject.csproj
          dest: TestProject.csproj
        - src: ./fixtures/enable-hot-reload-when-package-already-installed/EmailValidatorTests.cs
          dest: EmailValidatorTests.cs
        - src: ./fixtures/enable-hot-reload-when-package-already-installed/global.json
          dest: global.json
    graders:
      - type: output-matches
        config:
          pattern: (?is)(unsupported (edit|change)|rude edit|(edit|change).{0,40}not supported)
      - type: output-matches
        config:
          pattern: (?is)(restart|stop.*start|Ctrl\+C)
      - type: output-matches
        config:
          pattern: dotnet run
      - type: output-matches
        config:
          pattern: Validate_MissingAtSign_ReturnsFalse
      - type: output-matches
        config:
          pattern: TESTINGPLATFORM_HOTRELOAD_ENABLED
      - type: output-matches
        config:
          pattern: dotnet build
      - type: output-matches
        config:
          pattern: (?is)(same|original|existing).{0,60}(?:command|invocation|filter|arguments|profile)
      - type: output-matches
        config:
          pattern: dotnet watch
      - type: output-matches
        config:
          pattern: DOTNET_WATCH_RESTART_ON_RUDE_EDIT|Ctrl\+R|restart prompt
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*]\s*)?`?(?:[$>]\s*)?dotnet\s+add(?:\s+\S+)?\s+package\s+\S*HotReload\b
      - type: prompt
    rubric:
      - Correctly distinguishes changes the active session can apply from changes that require a rebuild
      - Gives a safe recovery sequence that preserves the same persistent workflow
      - Offers a valid watch-managed restart fallback for future unsupported edits
      - Preserves existing setup and does not reinstall present dependencies
