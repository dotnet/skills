name: convert-to-cpm
description: Evaluates safe NuGet package alignment and Central Package Management conversion
type: capability
defaults:
  timeout: 10m
  runs: 2
scoring:
  threshold: 0.9
stimuli:
  - name: Keep packages.config migration out of scope
    prompt: |
      Please centralize the NuGet versions in simple-packages-config/LegacyApp.
      Do not migrate its package format as part of this request.
    tags: { capability: packages-config-boundary, risk: high, journey: reject-incompatible-project }
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-dormant-packages-config
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              This project uses packages.config. Central Package Management
              requires PackageReference, so no files were changed. Migrate the
              package format in a separate request before centralizing versions.
    environment:
      files:
        - { src: ./simple-packages-config, dest: simple-packages-config }
        - { src: ./common/verify_unchanged.py, dest: .eval/verify_unchanged.py }
    graders:
      - type: run-command
        config:
          command: >-
            node -e "const fs=require('fs'),c=require('crypto'),s=fs.readFileSync('.eval/verify_unchanged.py','utf8').replace(/\r\n/g,'\n');process.exit(c.createHash('sha256').update(s).digest('hex')==='130b700a3e8337da14c643c83df6d2484d0d259fc0f780ad367e8706b4ab7e81'?0:1)"
            && python .eval/verify_unchanged.py packages-config simple-packages-config
          expected_exit_code: 0
          stdout_matches: UNCHANGED
      - type: file-not-exists
        config: { path: simple-packages-config/Directory.Packages.props }
      - type: output-matches
        config: { pattern: "(packages\\.config|PackageReference)" }
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that Central Package Management cannot manage packages.config entries
      - Left the entire project unchanged
      - Explained that a separate PackageReference migration is the required prerequisite
      - Stopped before conversion and did not modify the incompatible project

  - name: Leave a complete central package setup unchanged
    prompt: |
      Check already-cpm/App and tell me whether it still needs a Central Package
      Management migration. Do not change a healthy setup.
    tags: { capability: already-correct-boundary, risk: low, journey: verify-no-op }
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-dormant-already-cpm
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              No migration is needed. Directory.Packages.props already enables
              central management and App.csproj has no package Version attribute.
              I left the healthy setup unchanged.
    environment:
      files:
        - { src: ./already-cpm, dest: already-cpm }
        - { src: ./common/verify_unchanged.py, dest: .eval/verify_unchanged.py }
        - { src: ./common/NuGet.Config, dest: NuGet.Config }
        - { src: ./common/global.json, dest: global.json }
        - { src: ./common/create_feed.py, dest: .eval/create_feed.py }
      commands:
        - python .eval/create_feed.py .nuget-feed
    graders:
      - type: run-command
        config:
          command: >-
            node -e "const fs=require('fs'),c=require('crypto'),s=fs.readFileSync('.eval/verify_unchanged.py','utf8').replace(/\r\n/g,'\n');process.exit(c.createHash('sha256').update(s).digest('hex')==='130b700a3e8337da14c643c83df6d2484d0d259fc0f780ad367e8706b4ab7e81'?0:1)"
            && python .eval/verify_unchanged.py already-cpm already-cpm
          expected_exit_code: 0
          stdout_matches: UNCHANGED
      - type: run-command
        config:
          command: dotnet restore already-cpm/App/App.csproj --configfile NuGet.Config --packages .nuget-packages
          expected_exit_code: 0
          timeout: 3m
      - type: run-command
        config:
          command: dotnet run --project already-cpm/App/App.csproj --no-restore
          expected_exit_code: 0
          stdout_matches: PASS
          timeout: 3m
      - type: output-matches
        config: { pattern: "(already|no migration|no conversion|nothing.*change|fully enabled)" }
      - type: exit-success
      - type: prompt
    rubric:
      - Correctly concluded that the project already has a complete central package setup
      - Left the central file and project unchanged
      - Reported the healthy state without inventing migration work
      - Recognized the no-op boundary and stopped without entering conversion work

  - name: Leave private feed authentication to package-source tooling
    prompt: |
      What command should I use to add an authenticated private NuGet feed for
      restore? I am not changing package versions or project package policy.
    tags: { capability: package-source-boundary, risk: high, journey: redirect-authentication }
    expect_activation: false
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-dormant-package-source
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              Use `dotnet nuget add source` or edit NuGet.Config with the feed URL.
              Supply credentials through the supported credential provider or a
              secure secret mechanism; no package-version files need to change.
    graders:
      - type: output-matches
        config: { pattern: "(dotnet nuget add source|NuGet\\.Config|credential provider)" }
      - type: exit-success
      - type: prompt
    rubric:
      - Answered the package-source authentication question without starting a package migration
      - Did not suggest changing package versions or central package policy
      - The conversion workflow stayed dormant and did not hijack the feed configuration request

  - name: Leave package signing and publishing out of scope
    prompt: |
      I have a built .nupkg and need to sign it with a certificate before
      publishing. What command and certificate inputs should I use?
    tags: { capability: package-signing-boundary, risk: high, journey: redirect-publishing }
    expect_activation: false
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-dormant-package-signing
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              Use `dotnet nuget sign <package.nupkg>` with the certificate path,
              certificate password supplied securely, and a timestamp server.
              This does not require changing project package versions or CPM files.
    graders:
      - type: output-matches
        config: { pattern: "(dotnet nuget sign|certificate|timestamp)" }
      - type: exit-success
      - type: prompt
    rubric:
      - Answered the package-signing question without starting a package migration
      - Did not suggest changing package versions or central package policy
      - The conversion workflow stayed dormant and did not hijack the publishing request

  - name: Align conflicting versions without changing package management
    prompt: |
      Contoso.Json and Fabrikam.Identity are inconsistent across
      moderate-version-conflicts/Inventory.slnx. Align each package to the
      highest version already present, keep versions in the project files, and
      validate the solution.
    tags: { capability: package-maintenance, risk: medium, journey: align-without-conversion }
    environment:
      files:
        - { src: ./moderate-version-conflicts, dest: moderate-version-conflicts }
        - { src: ./common/NuGet.Config, dest: NuGet.Config }
        - { src: ./common/global.json, dest: global.json }
        - { src: ./common/create_feed.py, dest: .eval/create_feed.py }
        - { src: ./common/verify_state.py, dest: .eval/verify_state.py }
      commands:
        - python .eval/create_feed.py .nuget-feed
    golden_patch: { path: ./references/maintenance-conflicts.patch }
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-maintenance-conflicts
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              Aligned Contoso.Json to 10.0.0 and Fabrikam.Identity to 1.2.0 in
              project files. No central package file was created. Restore and build passed.
    graders:
      - type: run-command
        config:
          command: >-
            node -e "const fs=require('fs'),c=require('crypto'),s=fs.readFileSync('.eval/verify_state.py','utf8').replace(/\r\n/g,'\n');process.exit(c.createHash('sha256').update(s).digest('hex')==='9b763251bb18a2d6aec637b7a0527ef4bf9c117624a128125fe7ba8fabdb322e'?0:1)"
            && python .eval/verify_state.py maintenance-conflicts
          expected_exit_code: 0
          stdout_matches: PASS
      - type: run-command
        config:
          command: dotnet restore moderate-version-conflicts/Inventory.slnx --configfile NuGet.Config --packages .nuget-packages
          expected_exit_code: 0
          timeout: 4m
      - type: run-command
        config:
          command: dotnet build moderate-version-conflicts/Inventory.slnx --no-restore
          expected_exit_code: 0
          timeout: 4m
      - type: run-command
        config:
          command: dotnet run --project moderate-version-conflicts/Api/Api.csproj --no-restore
          expected_exit_code: 0
          stdout_matches: PASS
          timeout: 3m
      - type: file-not-exists
        config: { path: moderate-version-conflicts/Directory.Packages.props }
      - type: prompt
    rubric:
      - Aligned only the requested packages to the highest versions already in the solution
      - Preserved project-level version management
      - Restored and built the affected solution before reporting success
      - Recommended central package management only as a separate follow-up

  - name: Align property and conditional versions without centralizing
    prompt: |
      Bring package versions in advanced-multi-complexity/Enterprise.slnx into
      line with the highest versions already used in that repository. Keep the
      current project, property, shared-props, and target-framework condition
      layout. Do not centralize package management.
    tags: { capability: complex-package-maintenance, risk: high, journey: preserve-existing-layout }
    environment:
      files:
        - { src: ./advanced-multi-complexity, dest: advanced-multi-complexity }
        - { src: ./common/NuGet.Config, dest: NuGet.Config }
        - { src: ./common/global.json, dest: global.json }
        - { src: ./common/create_feed.py, dest: .eval/create_feed.py }
        - { src: ./common/verify_state.py, dest: .eval/verify_state.py }
      commands:
        - python .eval/create_feed.py .nuget-feed
    golden_patch: { path: ./references/maintenance-complex.patch }
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-maintenance-complex
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              Updated drifted versions in existing files, preserved Common.props,
              MSBuild properties, and target-framework conditions, and did not
              create a central package file. Restore and build passed.
    graders:
      - type: run-command
        config:
          command: >-
            node -e "const fs=require('fs'),c=require('crypto'),s=fs.readFileSync('.eval/verify_state.py','utf8').replace(/\r\n/g,'\n');process.exit(c.createHash('sha256').update(s).digest('hex')==='9b763251bb18a2d6aec637b7a0527ef4bf9c117624a128125fe7ba8fabdb322e'?0:1)"
            && python .eval/verify_state.py maintenance-complex
          expected_exit_code: 0
          stdout_matches: PASS
      - type: run-command
        config:
          command: dotnet restore advanced-multi-complexity/Enterprise.slnx --configfile NuGet.Config --packages .nuget-packages
          expected_exit_code: 0
          timeout: 5m
      - type: run-command
        config:
          command: dotnet build advanced-multi-complexity/Enterprise.slnx --no-restore
          expected_exit_code: 0
          timeout: 5m
      - type: file-not-exists
        config: { path: advanced-multi-complexity/Directory.Packages.props }
      - type: prompt
    rubric:
      - Aligned every drifted literal version to the highest version already present
      - Kept StorageVersion, HostingVersion, and Common.props in their existing roles
      - Preserved the target-framework-specific Fabrikam.MvcJson declarations
      - Did not create or modify a central package policy

  - name: Convert one executable project to central package management
    prompt: |
      Convert simple-single-project/MyApp/MyApp.csproj to Central Package
      Management. Keep resolved versions unchanged and validate that it still runs.
    tags: { capability: single-project-conversion, risk: medium, journey: convert-and-run }
    environment:
      files:
        - { src: ./simple-single-project, dest: simple-single-project }
        - { src: ./common/NuGet.Config, dest: NuGet.Config }
        - { src: ./common/global.json, dest: global.json }
        - { src: ./common/create_feed.py, dest: .eval/create_feed.py }
        - { src: ./common/verify_state.py, dest: .eval/verify_state.py }
      commands:
        - python .eval/create_feed.py .nuget-feed
    golden_patch: { path: ./references/convert-single.patch }
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-convert-single
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              Created the central file, moved three unchanged versions into sorted
              PackageVersion items, removed project Version attributes, and passed
              restore, build, and run. Baseline/after binlogs, package snapshots,
              and convert-to-cpm.md were retained.
    graders:
      - type: run-command
        config:
          command: >-
            node -e "const fs=require('fs'),c=require('crypto'),s=fs.readFileSync('.eval/verify_state.py','utf8').replace(/\r\n/g,'\n');process.exit(c.createHash('sha256').update(s).digest('hex')==='9b763251bb18a2d6aec637b7a0527ef4bf9c117624a128125fe7ba8fabdb322e'?0:1)"
            && python .eval/verify_state.py single
          expected_exit_code: 0
          stdout_matches: PASS
      - type: run-command
        config:
          command: dotnet restore simple-single-project/MyApp/MyApp.csproj --configfile NuGet.Config --packages .nuget-packages
          expected_exit_code: 0
          timeout: 3m
      - type: run-command
        config:
          command: dotnet build simple-single-project/MyApp/MyApp.csproj --no-restore
          expected_exit_code: 0
          timeout: 3m
      - type: run-command
        config:
          command: dotnet run --project simple-single-project/MyApp/MyApp.csproj --no-build --no-restore
          expected_exit_code: 0
          stdout_matches: PASS
          timeout: 3m
      - type: file-contains
        config: { path: simple-single-project/**/Directory.Packages.props, value: ManagePackageVersionsCentrally }
      - type: file-exists
        config: { path: simple-single-project/**/convert-to-cpm.md }
      - type: prompt
    rubric:
      - Centralized exactly the three existing package versions without upgrading them
      - Removed only PackageReference version metadata and preserved behavior
      - Captured reviewable before-and-after evidence and a conversion report
      - Verified restore, build, and runtime behavior before reporting success

  - name: Convert a solution while preserving package metadata
    prompt: |
      Move simple-solution/MyApp.sln to Central Package Management. Keep every
      current version and preserve package metadata such as PrivateAssets.
    tags: { capability: solution-conversion, risk: medium, journey: preserve-metadata }
    environment:
      files:
        - { src: ./simple-solution, dest: simple-solution }
        - { src: ./common/NuGet.Config, dest: NuGet.Config }
        - { src: ./common/global.json, dest: global.json }
        - { src: ./common/create_feed.py, dest: .eval/create_feed.py }
        - { src: ./common/verify_state.py, dest: .eval/verify_state.py }
      commands:
        - python .eval/create_feed.py .nuget-feed
    golden_patch: { path: ./references/convert-solution.patch }
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-convert-solution
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              Added one solution-level central file with six sorted versions,
              removed Version attributes, preserved PrivateAssets=all, and passed
              solution build and Web execution. The before/after report and
              evidence artifacts were retained.
    graders:
      - type: run-command
        config:
          command: >-
            node -e "const fs=require('fs'),c=require('crypto'),s=fs.readFileSync('.eval/verify_state.py','utf8').replace(/\r\n/g,'\n');process.exit(c.createHash('sha256').update(s).digest('hex')==='9b763251bb18a2d6aec637b7a0527ef4bf9c117624a128125fe7ba8fabdb322e'?0:1)"
            && python .eval/verify_state.py solution
          expected_exit_code: 0
          stdout_matches: PASS
      - type: run-command
        config:
          command: dotnet restore simple-solution/MyApp.sln --configfile NuGet.Config --packages .nuget-packages
          expected_exit_code: 0
          timeout: 4m
      - type: run-command
        config:
          command: dotnet build simple-solution/MyApp.sln --no-restore
          expected_exit_code: 0
          timeout: 4m
      - type: run-command
        config:
          command: dotnet run --project simple-solution/Web/Web.csproj --no-build --no-restore
          expected_exit_code: 0
          stdout_matches: PASS
          timeout: 3m
      - type: file-contains
        config: { path: simple-solution/Tests/Tests.csproj, value: 'PrivateAssets="all"' }
      - type: file-exists
        config: { path: simple-solution/**/convert-to-cpm.md }
      - type: prompt
    rubric:
      - Covered every solution project with one correctly placed central file
      - Preserved all versions and non-version package metadata
      - Produced a clear before-and-after report and retained evidence
      - Verified the full solution and executable behavior

  - name: Convert independent projects under one requested policy
    prompt: |
      The projects under multi-target-repository are independent and have no
      shared solution. Put both under one central package policy at the directory
      root, then validate each project separately.
    tags: { capability: directory-scope-conversion, risk: high, journey: cover-independent-targets }
    environment:
      files:
        - { src: ./multi-target-repository, dest: multi-target-repository }
        - { src: ./common/NuGet.Config, dest: NuGet.Config }
        - { src: ./common/global.json, dest: global.json }
        - { src: ./common/create_feed.py, dest: .eval/create_feed.py }
        - { src: ./common/verify_state.py, dest: .eval/verify_state.py }
      commands:
        - python .eval/create_feed.py .nuget-feed
    golden_patch: { path: ./references/convert-multi-target.patch }
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-convert-multi-target
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              Covered both projects with one common central file, retained
              per-target baseline and after-cpm evidence, validated App and Tool
              separately, and mapped both targets in the aggregate report.
    graders:
      - type: run-command
        config:
          command: >-
            node -e "const fs=require('fs'),c=require('crypto'),s=fs.readFileSync('.eval/verify_state.py','utf8').replace(/\r\n/g,'\n');process.exit(c.createHash('sha256').update(s).digest('hex')==='9b763251bb18a2d6aec637b7a0527ef4bf9c117624a128125fe7ba8fabdb322e'?0:1)"
            && python .eval/verify_state.py multi-target
          expected_exit_code: 0
          stdout_matches: PASS
      - type: run-command
        config:
          command: dotnet restore multi-target-repository/apps/App/App.csproj --configfile NuGet.Config --packages .nuget-packages && dotnet restore multi-target-repository/tools/Tool/Tool.csproj --configfile NuGet.Config --packages .nuget-packages
          expected_exit_code: 0
          timeout: 4m
      - type: run-command
        config:
          command: dotnet run --project multi-target-repository/apps/App/App.csproj --no-restore && dotnet run --project multi-target-repository/tools/Tool/Tool.csproj --no-restore
          expected_exit_code: 0
          stdout_matches: "(?s)PASS.*PASS"
          timeout: 4m
      - type: file-contains
        config: { path: multi-target-repository/Directory.Packages.props, value: ManagePackageVersionsCentrally }
      - type: file-exists
        config: { path: multi-target-repository/**/convert-to-cpm.md }
      - type: prompt
    rubric:
      - Included both independent projects instead of silently selecting one
      - Placed one central policy at their requested common ancestor
      - Kept target-keyed evidence and one aggregate report
      - Restored and ran each target independently

  - name: Inline MSBuild package properties during conversion
    prompt: |
      Convert moderate-msbuild-properties/Platform.sln to Central Package
      Management. Inline resolved package versions, remove only obsolete version
      properties, and keep unrelated build properties unchanged.
    tags: { capability: property-version-conversion, risk: high, journey: inline-properties-safely }
    environment:
