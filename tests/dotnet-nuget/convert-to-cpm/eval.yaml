    rubric:
      - Resolved and centralized every property-based and literal package version
      - Removed both obsolete property definitions and all references
      - Preserved OutputPath and all unrelated project content
      - Validated the solution and reported before-and-after evidence

  - name: Resolve version conflicts as part of conversion
    prompt: |
      Convert moderate-version-conflicts/Inventory.slnx to Central Package
      Management and resolve each conflict to the highest version already in the
      solution. Call out version changes and validate the result.
    tags: { capability: conflict-resolution-conversion, risk: high, journey: reconcile-and-convert }
    environment:
      files:
        - { src: ./moderate-version-conflicts, dest: moderate-version-conflicts }
        - { src: ./common/NuGet.Config, dest: NuGet.Config }
        - { src: ./common/global.json, dest: global.json }
        - { src: ./common/create_feed.py, dest: .eval/create_feed.py }
        - { src: ./common/verify_state.py, dest: .eval/verify_state.py }
      commands:
        - python .eval/create_feed.py .nuget-feed
    golden_patch: { path: ./references/convert-conflicts.patch }
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: nuget-convert-conflicts
        agent: { name: reference, version: "1.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |
              Centralized five packages, selected Contoso.Json 10.0.0 and
              Fabrikam.Identity 1.2.0, identified changed projects and risk, and
              passed restore, build, and Api execution.
    graders:
      - type: run-command
        config:
          command: >-
            node -e "const fs=require('fs'),c=require('crypto'),s=fs.readFileSync('.eval/verify_state.py','utf8').replace(/\r\n/g,'\n');process.exit(c.createHash('sha256').update(s).digest('hex')==='9b763251bb18a2d6aec637b7a0527ef4bf9c117624a128125fe7ba8fabdb322e'?0:1)"
            && python .eval/verify_state.py conflicts
          expected_exit_code: 0
          stdout_matches: PASS
