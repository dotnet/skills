name: dotnet-maui-doctor
tags:
  executionShard: medium
description: Evaluates the dotnet-maui/dotnet-maui-doctor skill
type: capability
defaults:
  timeout: 6m
  runs: 1
scoring:
  threshold: 1.0

stimuli:
  - name: Repair an incorrect offline environment diagnosis
    tags:
      capability: reconcile-snapshot-diagnosis
      risk: false-healthy-toolchain-report
      journey: repair-generated-diagnosis
    prompt: |
      The captured environment under repair-environment/ cannot access the
      network or install software. Its generated diagnosis artifacts disagree
      with the snapshots, workload manifest, and captured vendor policy. Follow
      diagnosis-contract.json and edit only diagnosis.json and diagnosis.md so
      they accurately report the captured state and required remediation. Then
      run `python .eval/validate_fixture.py repair repair-environment`.
    environment:
      files:
        - src: fixtures/repair-environment
          dest: repair-environment
        - src: graders/validate_fixture.py
          dest: .eval/validate_fixture.py
    golden_patch:
      path: ./references/repair-diagnosis.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "dotnet-maui-doctor-repair-diagnosis"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I corrected only diagnosis.json and diagnosis.md. The captured
              Temurin JDK is now reported as a vendor mismatch against the
              separate Microsoft OpenJDK policy, while version 17.0.12 comes
              from the nested Android workload manifest. The Android SDK
              finding is derived from that manifest's package list and the
              captured installed inventory. No evidence changed, no installation
              action ran, and the report does not recommend workload update or repair.
    graders:
      - type: run-command
        config:
          command: >-
            python -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/validate_fixture.py');assert
            hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e28681ada2d84722bd65b4389a91392b1e54b18570973b4bfe00107dfaf29168';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)"
            repair repair-environment
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: (?i)(Temurin|Microsoft OpenJDK|Android SDK|missing)
      - type: exit-success
      - type: prompt
        config:
          evidence:
            - trajectory
            - diff
            - golden_patch
    rubric:
      - Reconciled the JDK vendor and Android package findings with the captured evidence
      - Took the JDK vendor only from the captured policy and the recommended version only from the nested manifest
      - Derived the missing Android packages from the nested manifest and installed inventory
      - Changed only the generated diagnosis artifacts and did not run installation or network commands

  - name: Preserve a healthy offline environment diagnosis
    tags:
      capability: recognize-healthy-toolchain-snapshot
      risk: unnecessary-remediation-churn
      journey: review-generated-diagnosis
    prompt: |
      Review the captured snapshot and generated diagnosis under
      healthy-environment/. There is no network or installation permission.
      If the artifacts are already consistent, leave every byte and path alone.
    environment:
      files:
        - src: fixtures/healthy-environment
          dest: healthy-environment
        - src: graders/validate_fixture.py
          dest: .eval/validate_fixture.py
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "dotnet-maui-doctor-noop"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I will compare the captured installed state, recorded requirements,
              and generated diagnosis before deciding whether any change is needed.
            tool_calls:
              - tool_call_id: inspect-healthy-capture
                function_name: view
                arguments:
                  path: healthy-environment
            observation:
              results:
                - source_call_id: inspect-healthy-capture
                  content: |-
                    snapshot.json: SDK 9.0.203; workload version 9.0.200-manifests.4f6c91d1;
                    installed workload maui-android; Microsoft OpenJDK 17.0.14;
                    Android packages platform-tools, platforms;android-35,
                    build-tools;35.0.0, cmdline-tools;12.0. requirements match.
                    diagnosis.json: status healthy; no_actions_executed true; issues [].
                    diagnosis.md: captured environment is healthy; no commands were run.
          - step_id: 2
            source: agent
            message: |-
              The generated diagnosis is consistent with the captured snapshot.
              The Android-only workload is present, the JDK vendor and version
              match the requirements, and every required Android package is
              installed. The artifacts also record that no actions were executed.
              No file or path needs to change, so I left the fixture untouched.
    graders:
      - type: run-command
        config:
          command: >-
            python -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/validate_fixture.py');assert
            hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='e28681ada2d84722bd65b4389a91392b1e54b18570973b4bfe00107dfaf29168';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)"
            noop healthy-environment
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: (?i)(healthy|consistent|no (issue|problem|change)|leave.*unchanged)
      - type: exit-success
      - type: prompt
    rubric:
      - Compared all captured requirements with the installed-state snapshot
      - Correctly found no remediation work
      - Left the complete fixture tree byte-for-byte unchanged with no added files

  - name: Plan a macOS setup from an offline capture
    tags:
      capability: plan-macos-toolchain-setup
      risk: incompatible-apple-and-android-tools
      journey: prepare-new-development-host
    prompt: |
      Read macos-setup.txt and give me a setup and verification plan for iOS and
      Android development. This is an offline review: do not query the network,
      install anything, or claim current version numbers that are not captured.
    environment:
      files:
        - src: fixtures/advisory/macos-setup.txt
          dest: macos-setup.txt
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "dotnet-maui-doctor-macos-plan"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              From this offline capture, plan to obtain the approved .NET SDK, the pinned MAUI workload, Microsoft OpenJDK, Android command-line tools, and Xcode from Apple Developer sources. When the host is connected, discover exact compatible versions from the workload dependency manifest instead of guessing them. Verify the result with dotnet --info, dotnet workload list, java -version, sdkmanager inventory, and xcodebuild -version; do not claim any install or verification happened during this review.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(Xcode|Apple Developer)
      - type: output-matches
        config:
          pattern: (?i)(Microsoft OpenJDK|maui workload)
      - type: output-matches
        config:
          pattern: (?i)(manifest|discover|verify|pin)
      - type: exit-success
      - type: prompt
    rubric:
      - Covered the Apple, Android, JDK, SDK, and workload prerequisites
      - Deferred exact versions to captured manifests or a later connected discovery step
      - Provided verification steps without pretending to execute installations or network queries

  - name: Plan an Android-only Linux CI host
    tags:
      capability: plan-linux-android-toolchain
      risk: unsupported-meta-workload
      journey: prepare-headless-ci
    prompt: |
      Use linux-ci.txt to prepare a deterministic Android build-host plan. The
      review is offline, so describe commands and checks without running them or
      downloading anything.
    environment:
      files:
        - src: fixtures/advisory/linux-ci.txt
          dest: linux-ci.txt
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "dotnet-maui-doctor-linux-ci-plan"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The capture establishes Ubuntu 24.04 x64, SDK 9.0.203, no
              workloads, and an Android-only goal. Use `maui-android`, never the
              `maui` meta-workload on Linux. The capture does not include the
              matching workload manifest, JDK recommendation, or Android package
              list, so a deterministic image cannot be finalized from this file
              alone. Add that recorded manifest evidence before provisioning.

              The provisioning script should then use explicit captured values:
              `dotnet workload install maui-android --version <captured-workload-version>`,
              install the manifest-required Microsoft OpenJDK version, and pass
              the recorded package IDs to `sdkmanager`. Verify with
              `dotnet --info`, `dotnet workload list`, `java -version`, and
              `sdkmanager --list_installed`. Do not add iOS or Mac Catalyst
              components, and do not run any command during this offline review.
    graders:
      - type: output-matches
        config:
          pattern: maui-android
      - type: output-not-matches
        config:
          pattern: (?i)install\s+(the\s+)?maui\s+meta-workload
      - type: output-matches
        config:
          pattern: (?i)(Microsoft OpenJDK|sdkmanager|manifest|pin)
      - type: exit-success
      - type: prompt
    rubric:
      - Selected the Android-only workload supported on Linux
      - Identified that the capture lacks the manifest evidence needed to pin the JDK and Android package set
      - Provided command shapes that consume captured versions without inventing them
      - Avoided iOS, Mac Catalyst, and unpinned update advice

  - name: Recover after an SDK update without repair commands
    tags:
      capability: plan-consistent-sdk-upgrade-recovery
      risk: mixed-workload-manifests
      journey: recover-broken-build-host
    prompt: |
      sdk-update.txt captures a host that stopped building after an SDK update.
      Give a diagnosis and recovery sequence based only on that snapshot. Do not
      run commands, use the network, or recommend broad update or repair commands.
    environment:
      files:
        - src: fixtures/advisory/sdk-update.txt
          dest: sdk-update.txt
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "dotnet-maui-doctor-sdk-update-recovery"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The snapshot shows a manifest mismatch: SDK 9.0.203 is paired with a 9.0.100 workload manifest. First capture `dotnet --info` and `dotnet workload list`, then discover the workload version for the active SDK and use `dotnet workload install` with that version pinned. Compare the Android inventory with that manifest, add only missing packages, and rerun the same checks. This is a plan based on the snapshot; no commands were executed.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(manifest mismatch|workload.*version|pin)
      - type: output-matches
        config:
          pattern: dotnet workload (list|install)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*]\s*)?(?:dotnet\s+)?workload\s+(?:update|repair)\b
      - type: exit-success
      - type: prompt
    rubric:
      - Identified the stale manifest as a consistency problem after the SDK change
      - Proposed discovering and reinstalling a version pinned to the active SDK
      - Included Android package revalidation and rejected broad update or repair commands

  - name: Diagnose a captured non-Microsoft JDK
    tags:
      capability: diagnose-jdk-vendor-mismatch
      risk: persistent-java-toolchain-failure
      journey: fix-android-java-validation
    prompt: |
      Inspect jdk-failure.txt. Explain the likely cause and the safe remediation
      options, but do not install software or edit shell profiles during this
      offline review.
    environment:
      files:
        - src: fixtures/advisory/jdk-failure.txt
          dest: jdk-failure.txt
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "dotnet-maui-doctor-jdk-vendor"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The captured vendor is Temurin, while this toolchain expects Microsoft OpenJDK. During a later approved setup window, install the manifest-compatible Microsoft build and either unset JAVA_HOME so MAUI can auto-detect it or point JAVA_HOME to that Microsoft installation. Then confirm the vendor with java -version and retry validation; do not edit the shell profile during this offline review.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(Temurin|vendor).{0,80}(Microsoft OpenJDK|Microsoft)
      - type: output-matches
        config:
          pattern: JAVA_HOME
      - type: output-not-matches
        config:
          pattern: (?i)Temurin.{0,30}(supported|fine|correct|recommended)
      - type: exit-success
      - type: prompt
    rubric:
      - Identified the captured JDK vendor rather than its major version as the mismatch
      - Recommended the Microsoft distribution and treated JAVA_HOME as optional or removable
      - Did not modify the machine or claim to have verified a replacement

  - name: Derive Android packages from a captured manifest
    tags:
      capability: derive-android-package-inventory
      risk: guessed-sdk-package-versions
      journey: generate-ci-prerequisite-list
    prompt: |
      Read android-manifest.json and produce the exact non-optional Android
      package list required for a build host. Identify optional emulator, NDK,
      and host-specific system-image entries separately, but do not install
      them by default. Include an idempotent verification/install outline for a
      future connected CI job. Do not use current web documentation or run
      sdkmanager now.
    environment:
      files:
        - src: fixtures/advisory/android-manifest.json
          dest: android-manifest.json
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "dotnet-maui-doctor-manifest-advisory"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The captured manifest marks exactly four packages as non-optional:
              platform-tools, platforms;android-35, build-tools;35.0.0, and
              cmdline-tools;12.0. Optional entries are emulator,
              ndk;26.1.10909125, and a host-specific system image whose ID
              depends on the runtime identifier. A future connected CI job
              should list installed sdkmanager packages, compare that inventory
              with the four required identifiers, install only missing required
              packages, and then re-list them. Add optional packages only when
              that job needs an emulator, NDK, or system image. These values
              come from the supplied manifest; I did not query the network or
              run sdkmanager.
    graders:
      - type: output-matches
        config:
          pattern: platforms;android-35
      - type: output-matches
        config:
          pattern: build-tools;35\.0\.0
      - type: output-matches
        config:
          pattern: cmdline-tools;12\.0
      - type: output-matches
        config:
          pattern: platform-tools
      - type: output-matches
        config:
          pattern: (?i)optional.{0,120}(emulator|ndk|system.image)|(emulator|ndk|system.image).{0,120}optional
      - type: exit-success
      - type: prompt
    rubric:
      - Reported every non-optional package identifier exactly from the captured manifest
      - Distinguished optional emulator, NDK, and host-specific system-image entries from build-host requirements
      - Separated current offline analysis from future connected execution
      - Proposed inventory comparison and revalidation rather than guessed versions

  - name: Prepare Windows commands from recorded requirements
    tags:
      capability: prepare-windows-toolchain-commands
      risk: wrong-platform-command
      journey: script-future-windows-setup
    prompt: |
      windows-setup.txt contains the approved versions for a future connected
      setup window. Draft the PowerShell command sequence and verification steps,
      but do not execute or install anything in this review.
    environment:
      files:
        - src: fixtures/advisory/windows-setup.txt
          dest: windows-setup.txt
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "dotnet-maui-doctor-windows-commands"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Draft only; I did not run these commands:

              ```powershell
              dotnet workload install maui --version 9.0.200-manifests.4f6c91d1

              $sdkManager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
              & $sdkManager "platforms;android-35" "build-tools;35.0.0"

              dotnet --info
              dotnet workload list
              java -version 2>&1 | Select-String "Microsoft"
              & $sdkManager --list_installed |
                  Select-String "platforms;android-35|build-tools;35.0.0"
              ```

              The capture does not include a JDK version, so do not draft a JDK
              install with a guessed number. Add the matching manifest's
              Microsoft OpenJDK recommendation before the connected setup window.
    graders:
      - type: output-matches
        config:
          pattern: sdkmanager\.bat
      - type: output-matches
        config:
          pattern: (?i)(--version|pin|9\.0\.200-manifests\.4f6c91d1)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*]\s*)?(?:dotnet\s+)?workload\s+(?:update|repair)\b
      - type: exit-success
      - type: prompt
    rubric:
      - Used the Windows sdkmanager executable name
      - Kept workload commands pinned to the captured requirement
      - Included post-action inventory checks and did not claim execution

  - name: Stay dormant for an application runtime crash
    expect_activation: false
    tags:
      capability: boundary-runtime-application-defect
      risk: incorrect-skill-activation
      journey: route-code-debugging-request
    prompt: |
      Read runtime-crash.txt and tell me what code path to inspect first. The
      development environment was already validated, and I do not want any
      machine setup or installation work.
    environment:
      files:
        - src: fixtures/advisory/runtime-crash.txt
          dest: runtime-crash.txt
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "dotnet-maui-doctor-dormancy-runtime"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The validated environment makes this an application-code debugging task. Start at CheckoutViewModel.SubmitAsync and inspect the dereferenced collaborators and state named by the stack summary, then reproduce with null-state logging or a focused test. Do not reinstall workloads, JDKs, or Android packages.
    graders:
      - type: output-matches
        config:
          pattern: CheckoutViewModel\.SubmitAsync
      - type: output-matches
        config:
          pattern: (?i)(application code|NullReferenceException|null|stack)
      - type: output-not-matches
        config:
          pattern: (?i)(workload install|OpenJDK|sdkmanager)
      - type: exit-success
      - type: prompt
    rubric:
      - The environment-diagnosis workflow stayed dormant for an application-code defect
      - Routed the request to application-code debugging rather than toolchain repair
      - Focused first on the method and null state named in the captured runtime symptom
      - Performed no setup, installation, or file changes
