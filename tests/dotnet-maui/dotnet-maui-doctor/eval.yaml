name: dotnet-maui-doctor
description: Project-aware MAUI diagnosis, scoped remediation and reproducible dependency discovery
type: capability
defaults:
  timeout: 4m
  runs: 1
stimuli:
  - name: Preserve project selection after a machine SDK upgrade
    prompt: |
      My MAUI Android app stopped building after I installed a newer SDK.
      global.json specifies SDK 10.0.102, rollForward=disable and workloadVersion
      10.0.102. I ran dotnet --info outside the repo and it showed 11 preview.
      Should I update all workloads? Give me a diagnosis plan only.
    tags: {capability: sdk-selection, risk: pin-bypass, journey: recover-after-upgrade}
    graders:
      - type: output-matches
        config: {pattern: '(?i)global\.json'}
      - type: output-matches
        config: {pattern: '(?i)(project|repo).*(directory|folder)|cd '}
      - type: prompt
    rubric:
      - Explains that the SDK observed outside the repository does not establish the project's selected SDK.
      - Preserves both SDK and workload pins and checks project-directory resolution before proposing an upgrade.
      - Gives a diagnostic plan without claiming commands or remediation ran.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: sdk-selection-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Finding: the outside-repo SDK observation does not explain the failure.
              In the project directory, inspect dotnet --version and workload list,
              the first build error and the applicable global.json. Keep both 10.0.102
              pins. Do not update workloads before identifying the selected SDK and
              error. Validation: this is a plan, not an executed check.

  - name: Missing pinned SDK is not permission to remove the pin
    prompt: |
      Our Linux Android CI has SDKs 10.0.301 and 11 preview installed.
      The repo requests 10.0.102 with rollForward=disable. dotnet reports that
      a compatible SDK was not found. What is the smallest reproducible fix?
      Don't run anything.
    tags: {capability: missing-sdk, risk: uncontrolled-upgrade, journey: restore-ci}
    graders:
      - type: output-matches
        config: {pattern: '10\.0\.102'}
      - type: output-matches
        config: {pattern: '(?i)install|provision'}
      - type: prompt
    rubric:
      - Identifies SDK resolution as the blocker before investigating Android packages.
      - Proposes provisioning the intended SDK rather than silently removing or relaxing the repository pin.
      - Separates a deliberate team-approved upgrade from repairing this CI job.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: missing-sdk-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Finding: neither installed SDK satisfies the exact 10.0.102 pin.
              Provision SDK 10.0.102 in CI from the official .NET source and resolve
              it from the repository directory, retaining the pin. Investigate the
              effective Android workload only after SDK selection works. Changing
              the pin is a separate coordinated upgrade. No commands were run.

  - name: Shell JDK and build JDK disagree
    prompt: |
      On macOS, java -version is Temurin 17.0.12. Our MAUI Android log says
      JavaSdkDirectory=/opt/legacy/jdk-11 and errors that Java 17 or newer is
      required. The selected workload accepts [17.0,22.0). JAVA_HOME points
      to /opt/team/jdk17. What's actually wrong? Please don't change the machine.
    tags: {capability: jdk-resolution, risk: vendor-misdiagnosis, journey: diagnose-java-error}
    graders:
      - type: output-contains
        config: {substring: /opt/legacy/jdk-11}
      - type: output-matches
        config: {pattern: '(?i)JavaSdkDirectory'}
      - type: prompt
    rubric:
      - Identifies the stale build-selected JDK path rather than declaring the shell JDK vendor the cause.
      - Proposes a compatible, usable JDK for the build rather than merely changing the interactive shell's Java selection.
      - Does not change global environment settings or claim a successful build.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: jdk-selection-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Finding: JavaSdkDirectory selects /opt/legacy/jdk-11, below the
              workload's range. The shell's Java does not establish the build's
              JDK. Check /opt/team/jdk17/bin/java and bin/javac, then propose
              correcting the explicit build/IDE override. Temurin's vendor alone
              is not evidence of failure. Microsoft recommends its OpenJDK if a
              replacement is needed. Validation remains unperformed.

  - name: Incomplete Java error does not establish vendor failure
    prompt: |
      My MAUI Android build has a Java-related error. I have Temurin 17.0.12
      and JAVA_HOME points to it, but I didn't save the error text.
      Can you tell me whether switching vendors will fix it? Advice only.
    tags: {capability: evidence-limits, risk: unsupported-certainty, journey: triage-incomplete-report}
    graders:
      - type: output-matches
        config: {pattern: '(?i)(exact|actual|full|specific).*error|error.*(text|log|message)'}
      - type: prompt
    rubric:
      - States that vendor and shell version alone cannot identify the cause or guarantee a fix.
      - Identifies the missing evidence that prevents establishing the failing build's cause.
      - Does not infer universal support, incompatibility or guaranteed remediation from a JDK vendor name.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: incomplete-java-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Finding: there is not enough evidence to predict a vendor switch.
              Obtain the exact error, workload requirements and build-selected
              JavaSdkDirectory, including javac and architecture. Microsoft's
              OpenJDK is recommended and tested; that does not prove every other
              distribution fails or that every matching version works. Validation:
              advice only; the cause is still unconfirmed.

  - name: Working Android configuration stays unchanged
    prompt: |
      Please review the supplied MAUI Android configuration and evidence.
      The files are in this workspace; inspect them before drawing conclusions.
      This is only a read-only consistency check: leave every supplied file and
      the machine alone. Do we need any changes before another Android build?
      The evidence is supplied text; don't try to recreate a toolchain here.
    tags: {capability: healthy-no-op, risk: unnecessary-mutation, journey: verify-existing-environment}
    environment:
      files:
        - {src: fixtures/healthy, dest: .}
        - {src: fixtures/capture_state.py, dest: capture_state.py}
        - {src: fixtures/check_state.py, dest: check_state.py}
      commands:
        - python3 capture_state.py
    graders:
      - type: run-command
        config:
          command: python3 check_state.py
          expected_exit_code: 0
          stdout_contains: Complete input state preserved
      - type: output-matches
        config: {pattern: '(?i)(no|not).*(change|remediat|install)|unchanged|none\s+(is\s+)?(required|needed)|no\s+mismatch'}
      - type: prompt
    rubric:
      - Finds no indicated change needed for the requested Android configuration.
      - Does not replace a working JDK, remove JAVA_HOME, upgrade pins or require Xcode for Android.
      - Attributes previous success to supplied evidence and does not claim a new build or runtime validation.
      - Leaves the complete input file set unchanged.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: healthy-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Finding: the supplied Android evidence is consistent; no change is
              indicated. Preserve global.json, the selected JDK and JAVA_HOME.
              Xcode is irrelevant to this Android-only check. Validation: supplied
              text reports a previous successful build, but is not a new build or
              runtime verification in this workspace.

  - name: Headless Linux plan excludes unrelated targets and emulators
    prompt: |
      We need a clean Linux CI worker to build our existing MAUI Android app,
      not run it. We can't execute commands yet. How should we choose versions,
      install just what's needed and verify the setup reproducibly?
    tags: {capability: linux-build-scope, risk: unsupported-platform-install, journey: provision-headless-ci}
    graders:
      - type: output-contains
        config: {substring: maui-android}
      - type: output-matches
        config: {pattern: '(?i)global\.json|project.*pin|repo.*pin'}
      - type: prompt
    rubric:
      - Selects Linux Android dependencies using repository SDK/workload pins and project targets.
      - Excludes Apple and Windows toolchain installation and emulator acceleration from build-only setup.
      - Provides compatible Java and Android dependency discovery plus a target-specific verification plan.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: linux-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Plan: resolve global.json and the Android TFM first, provision the
              chosen SDK and maui-android under its effective workload pin.
              Discover compatible Java and Android packages from that manifest and
              project target; Microsoft OpenJDK is the tested recommendation.
              Use authorized InstallAndroidDependencies or exact sdkmanager
              packages. No Xcode, Windows SDK, emulator, system images or KVM
              is needed for a build. Verify with the existing project's Android
              target build after provisioning. No installation or build ran here.

  - name: Apple setup chooses Xcode for the selected workload
    prompt: |
      I need an iOS-only MAUI setup plan for a Mac. Our repository already pins
      the SDK and workload set; I can't run commands now. Where should I get
      Xcode, how do I choose its version and how do I verify the setup?
    tags: {capability: apple-version-pairing, risk: latest-xcode-mismatch, journey: provision-ios}
    graders:
      - type: output-matches
        config: {pattern: '(?i)developer\.apple\.com|Apple Developer Downloads'}
      - type: output-matches
        config: {pattern: '(?i)xcodebuild|xcode-select'}
      - type: prompt
    rubric:
      - Chooses Xcode against the pinned Apple workload and host compatibility rather than automatically choosing the latest release.
      - Provides an official versioned Xcode source and separates selection/license mutations from inspection.
      - Does not add Android/JDK requirements to the iOS-only plan or claim unexecuted validation.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: apple-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Keep the repository SDK/workload pins. Resolve the effective iOS
              manifest's Xcode requirements and host macOS compatibility, then
              obtain matching full Xcode via Apple Developer Downloads
              (developer.apple.com/download/all/). Inspect xcode-select -p and
              xcodebuild -version. Changing selection and accepting licenses
              require approval. Android/JDK setup is unnecessary for this request.
              Plan an existing-project iOS build afterwards; no build ran here.

  - name: Windows-only health check does not require Java
    prompt: |
      I'm on Windows 11 and only target net10.0-windows10.0.19041.0 in my
      MAUI app. A checklist says I'm unhealthy because Java and Android SDK
      aren't installed. Is that relevant? Give me only the checks I need.
    tags: {capability: windows-target-scope, risk: unrelated-dependency-demand, journey: verify-windows-build}
    graders:
      - type: output-matches
        config: {pattern: '(?i)Windows SDK'}
      - type: prompt
    rubric:
      - Explains that missing Java/Android tooling is not a blocker for the Windows-only target.
      - Focuses on the project-selected SDK, MAUI Windows components and matching Windows SDK.
      - Does not propose provisioning Android, Apple or emulator components.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: windows-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Java and Android SDK are not required for this Windows-only target.
              Check project-directory SDK resolution, applicable global.json,
              MAUI Windows components and the Windows SDK required by the target
              platform version. Inspect the actual build error if present. No
              unrelated installation or whole-machine inventory is needed.

  - name: Corrupt installed workload packs have a repair path
    prompt: |
      Our pinned MAUI workload used to build. After a disk failure, its installed
      pack directory is missing files; the SDK and workload version selection
      still match the repo. We want the same versions, not an upgrade.
      Is there an appropriate repair command? Explain its scope; don't run it.
    tags: {capability: corruption-repair, risk: needless-version-change, journey: recover-damaged-install}
    graders:
      - type: output-contains
        config: {substring: dotnet workload repair}
      - type: prompt
    rubric:
      - Recognizes workload repair as legitimate for evidenced installed-pack corruption.
      - Explains that repair reinstalls installed packs and is not a general version upgrade or JDK fix.
      - Preserves effective pins, notes mutation scope and proposes revalidation without claiming execution.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: repair-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Finding: supplied evidence indicates damaged installed packs.
              dotnet workload repair is appropriate after approval: it reinstalls
              workload packs already present, not a version upgrade or a JDK fix. Inspect
              SDK/workload selection in the repository first and retain its pins.
              Repair can affect installed workloads beyond one target. Recheck the
              affected pack and target build afterward. No repair ran here.

  - name: Project API override needs project-aware Android packages
    prompt: |
      Our Windows MAUI Android project explicitly targets API 36. The selected
      workload's dependency file lists platforms;android-35, build-tools;35.0.0
      and command-line tools as required objects, plus optional emulator items.
      What is a reproducible way to provision the right SDK for this project?
      This is a plan, and our team hasn't approved automatic license acceptance.
    tags: {capability: project-api-dependencies, risk: manifest-only-provisioning, journey: provision-target-api}
    graders:
      - type: output-matches
        config: {pattern: '(?i)InstallAndroidDependencies|platforms;android-36'}
      - type: prompt
    rubric:
      - Accounts for API 36 from the project rather than treating the manifest baseline as the complete package list.
      - Offers a project-aware installation target or an equivalent correct explicit package plan under the selected workload.
      - Supplies a plan applicable to the existing project and preserves the user's license-acceptance decision.
      - Does not require optional emulators for build-only provisioning or treat installation as a read-only query.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: project-api-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Use the selected SDK/workload with the project's actual Android TFM.
              InstallAndroidDependencies examines project requirements including
              API 36; run it only when provisioning is approved, with quoted
              absolute AndroidSdkDirectory (and JavaSdkDirectory only if needed).
              Do not add AcceptAndroidSdkLicenses=True without permission.
              An equivalent manual plan includes platforms;android-36 plus the
              required compatible packages; Windows uses sdkmanager.bat. Optional
              emulator items are unnecessary for builds. No provisioning ran here.

  - name: Offline CI discovery follows each manifest entry
    prompt: |
      Please create resolve_requirements.py for our offline MAUI Android CI
      metadata inspection. It must accept --set, --catalog and --output paths.
      The catalog maps lowercase manifest-package-id/version to dependency JSON.
      Write JSON containing manifestPackage, manifestVersion, manifestFeatureBand,
      jdkRange, jdkRecommendedVersion and sorted required build-only package IDs
      in packages. Support case-insensitive workload keys and boolean/string
      optional flags. Missing/malformed metadata must exit nonzero without
      producing output. Preserve all inputs and repository configuration.
      You may run local Python checks, but no SDK installs, builds or downloads.
    tags: {capability: manifest-band-discovery, risk: wrong-manifest-selection, journey: automate-ci-requirements}
    environment:
      files:
        - {src: fixtures/discovery, dest: .}
        - {src: fixtures/capture_state.py, dest: capture_state.py}
        - {src: fixtures/check_state.py, dest: check_state.py}
        - {src: fixtures/check_discovery.py, dest: check_discovery.py}
      commands:
        - python3 capture_state.py
    graders:
      - type: run-command
        config:
          command: python3 check_discovery.py
          expected_exit_code: 0
          stdout_contains: 'Offline discovery passed: exact band, required packages, variants and missing metadata'
      - type: prompt
        config:
          evidence: [trajectory, diff]
    rubric:
      - Resolves both manifest version and band from the workload entry, never substituting the SDK feature band.
      - Reads real dependency-object shapes and excludes optional emulator/system-image packages for build-only discovery.
      - Fails closed for unavailable metadata and is reusable with changed entries rather than hardcoding the fixture answer.
      - Preserves every input and describes this as offline metadata validation, not real toolchain or build proof.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: discovery-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              The resolver selects the Android entry's band and version, reads
              required sdkPackage.id values and excludes optional items. The
              offline checks cover changed entries and missing/malformed metadata,
              with inputs preserved. This proves metadata handling only, not SDK
              installation or a working MAUI build.
    golden_patch:
      inline: |
        diff --git a/resolve_requirements.py b/resolve_requirements.py
        new file mode 100644
        --- /dev/null
        +++ b/resolve_requirements.py
        @@ -0,0 +1,49 @@
        +import argparse
        +import json
        +from pathlib import Path
        +
        +
        +def one_key(obj, key):
        +    matches = [value for name, value in obj.items() if name.casefold() == key]
        +    if len(matches) != 1:
        +        raise ValueError("Missing or ambiguous workload key")
        +    return matches[0]
        +
        +
        +def discover(set_path, catalog_path):
        +    entry = one_key(json.loads(Path(set_path).read_text()), "microsoft.net.sdk.android")
        +    parts = entry.split("/")
        +    if len(parts) != 2 or not all(parts):
        +        raise ValueError("Malformed manifest entry")
        +    version, band = parts
        +    package = f"microsoft.net.sdk.android.manifest-{band}".lower()
        +    catalog = json.loads(Path(catalog_path).read_text())
        +    deps = one_key(catalog[f"{package}/{version.lower()}"], "microsoft.net.sdk.android")
        +    packages = []
        +    for item in deps["androidsdk"]["packages"]:
        +        optional = item["optional"]
        +        if str(optional).lower() not in ("true", "false"):
        +            raise ValueError("Invalid optional flag")
        +        if str(optional).lower() == "true":
        +            continue
        +        package_id = item["sdkPackage"]["id"]
        +        if not isinstance(package_id, str) or not package_id:
        +            raise ValueError("Invalid required package ID")
        +        packages.append(package_id)
        +    if not packages:
        +        raise ValueError("Required packages unavailable")
        +    return {
        +        "manifestPackage": package, "manifestVersion": version,
        +        "manifestFeatureBand": band, "jdkRange": deps["jdk"]["version"],
        +        "jdkRecommendedVersion": deps["jdk"]["recommendedVersion"],
        +        "packages": sorted(set(packages)),
        +    }
        +
        +
        +parser = argparse.ArgumentParser()
        +parser.add_argument("--set", required=True)
        +parser.add_argument("--catalog", required=True)
        +parser.add_argument("--output", required=True)
        +args = parser.parse_args()
        +result = discover(args.set, args.catalog)
        +Path(args.output).write_text(json.dumps(result, indent=2) + "\n")

  - name: Runtime UI crash stays outside toolchain diagnosis
    prompt: |
      My MAUI Android app builds and launches, but tapping Save throws a
      NullReferenceException inside my view model. How should I debug it?
    expect_activation: false
    tags: {capability: runtime-dormancy, risk: toolchain-hijack, journey: debug-app-logic}
    graders:
      - type: output-matches
        config: {pattern: '(?i)stack\s+trace|breakpoint|debugger'}
      - type: prompt
    rubric:
      - Recognizes this as an application logic exception rather than an environment setup problem.
      - Helps isolate the failing application state without redirecting to unrelated toolchain remediation.
      - Does not perform a toolchain inventory, reinstall workloads or change JDKs.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: runtime-reference
        agent: {name: reference, version: '1.0', model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              This is a runtime app-logic failure, not evidence of a toolchain
              problem. Break on thrown NullReferenceException, inspect the stack
              trace and null values in the Save handler/view model. Share that
              method and exception location if you need help narrowing it down;
              workload or JDK reinstallation is not indicated.
