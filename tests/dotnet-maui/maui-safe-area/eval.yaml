name: maui-safe-area
description: Evaluates the dotnet-maui/maui-safe-area skill
type: capability
stimuli:
- name: Handle notch and status bar safe areas on iOS
  prompt: |
    I just upgraded my .NET MAUI app from .NET 9 to .NET 10. On iOS, my content
    is now going behind the status bar and the Dynamic Island notch area. In .NET 9
    I was using `ios:Page.UseSafeArea="True"` and it worked fine. What's the correct
    way to handle this in .NET 10? Show me the XAML.
  graders:
  - type: exit-success
  - type: output-matches
    config:
      pattern: SafeAreaEdges
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Recommends SafeAreaEdges="Container" as the replacement for ios:Page.UseSafeArea="True"
  - Explains that UseSafeArea is obsolete/legacy in .NET 10 and should be migrated
  - Highlights that SafeAreaEdges is cross-platform, unlike the old iOS-only API
  - Provides correct XAML syntax showing the migration
  tags:
    capability: handle-notch-and-status-bar-safe-areas-on-ios
    risk: incorrect-guidance
    journey: implement-feature
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: For .NET 10 use <ContentPage SafeAreaEdges="Container"> to protect the notch and system
          bars across platforms. Replace the legacy iOS-only UseSafeArea setting when migrating. Check
          child policies and avoid redundant padding.
- name: Edge-to-edge layout with SafeAreaEdges
  prompt: |
    I'm building a photo viewer page in my .NET MAUI app targeting .NET 10. I want
    the image to fill the entire screen edge-to-edge, going behind the status bar
    and navigation bar. But my image still has padding around it even though I set
    SafeAreaEdges="None" on the ContentPage. What am I missing?
  graders:
  - type: exit-success
  - type: output-matches
    config:
      pattern: None
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Identifies that child layouts default to SafeAreaEdges="Container" even when the page is set to None
  - Recommends setting SafeAreaEdges="None" on BOTH the ContentPage and the child layout (Grid, etc.)
  - Provides complete XAML example showing None on both page and layout
  - Does not suggest using legacy IgnoreSafeArea or UseSafeArea APIs
  tags:
    capability: edge-to-edge-layout-with-safeareaedges
    risk: incorrect-guidance
    journey: implement-feature
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: <ContentPage SafeAreaEdges="None"><Grid SafeAreaEdges="None"><Image Source="photo.jpg"
          Aspect="AspectFill" /></Grid></ContentPage> allows the hero path to extend edge-to-edge. The
          page policy does not erase a layout child's Container default; do not use obsolete IgnoreSafeArea
          for new .NET 10 markup.
- name: Keyboard avoidance with safe area for chat UI
  prompt: |
    I'm building a chat messaging screen in .NET MAUI targeting .NET 10. When the
    keyboard opens, it covers my text input at the bottom of the screen. In .NET 9
    I used WindowSoftInputModeAdjust.Resize but that doesn't seem to work anymore.
    How do I make the input bar move up when the keyboard appears?
  graders:
  - type: exit-success
  - type: output-matches
    config:
      pattern: (SoftInput|All)
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Provides a valid keyboard-aware layout keeping the composer above input while protecting container
    edges.
  - Places keyboard avoidance on a supported wrapper rather than assuming ScrollView honors SoftInput.
  - Does not claim WindowSoftInputModeAdjust.Resize was removed or promise device validation without evidence.
  tags:
    capability: keyboard-avoidance-with-safe-area-for-chat-ui
    risk: incorrect-guidance
    journey: implement-feature
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: '<ContentPage><Grid RowDefinitions="*,Auto" SafeAreaEdges="Container, Container, Container,
          SoftInput"><ScrollView Grid.Row="0"><VerticalStackLayout /></ScrollView><Grid Grid.Row="1" ColumnDefinitions="*,Auto"
          ColumnSpacing="10"><Entry /><Button Grid.Column="1" Text="Send" /></Grid></Grid></ContentPage>
          makes the parent handle keyboard avoidance; SoftInput directly on ScrollView is not supported.
          Resize still exists: do not claim removal. Test keyboard and native window configuration on
          the actual platform.'
- name: Avoid deprecated UseSafeArea in new .NET 10 project
  prompt: |
    I'm starting a new .NET MAUI project on .NET 10. I found a tutorial that says
    to add `ios:Page.UseSafeArea="True"` to my ContentPage to handle the iPhone
    notch. Is this the right approach? Also, the tutorial mentions using
    `IgnoreSafeArea="True"` on a Grid for a background image. Are these correct
    for .NET 10?
  graders:
  - type: exit-success
  - type: output-matches
    config:
      pattern: (SafeAreaEdges|Container)
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Warns that ios:Page.UseSafeArea is obsolete/legacy and should not be used in new .NET 10 code
  - Warns that IgnoreSafeArea is also obsolete and replaced by SafeAreaEdges="None"
  - Recommends SafeAreaEdges="Container" as replacement for UseSafeArea="True"
  - Recommends SafeAreaEdges="None" as replacement for IgnoreSafeArea="True"
  - Mentions that SafeAreaEdges is the new cross-platform API introduced in .NET 10
  tags:
    capability: avoid-deprecated-usesafearea-in-new-net-10-project
    risk: incorrect-guidance
    journey: implement-feature
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: In a new .NET 10 project replace the legacy iOS-only UseSafeArea mechanism with SafeAreaEdges="Container".
          Replace IgnoreSafeArea with SafeAreaEdges="None" on the background path. The new policy is cross-platform;
          do not backport .NET 10 APIs to a .NET 9 branch.
- name: Different policy for hero and editor
  prompt: On my .NET 10 MAUI article screen the cover image should extend under system bars, but the body
    text and a bottom comment editor must remain usable with the keyboard. Show a layout that does not
    apply duplicate insets to every child.
  tags:
    capability: mixed-regions
    risk: double-insets
    journey: read-and-comment
  graders:
  - type: exit-success
  - type: output-matches
    config:
      pattern: (?i)(keyboard|editor)
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Allows the decorative image behind system bars while keeping text and input usable, without stacking
    duplicate insets.
  - Accepts equivalent correct solutions without requiring one sample's syntax or procedure.
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: Assign edge-to-edge None only to the hero path; apply container/keyboard protection to
          the body/editor at an appropriate wrapper, not redundantly to each descendant.
- name: ScrollView keyboard wrapper
  prompt: In a .NET 10 MAUI form, setting keyboard avoidance directly on the ScrollView seems to do nothing.
    The submit button must stay reachable. What should own the keyboard inset and how do I keep the form
    scrollable?
  tags:
    capability: scroll-wrapper
    risk: unreachable-submit
    journey: submit-form
  graders:
  - type: exit-success
  - type: output-matches
    config:
      pattern: (?i)(parent|wrapper|wrapping layout|wrap.{0,80}(?:grid|layout)|outer (?:grid|layout)|(page|window).{0,15}root)
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Keeps the submit control reachable with a scrollable form using an element that supports keyboard
    insets. On .NET 10, SafeAreaEdges.All includes keyboard protection and SoftInput is the keyboard
    region on ContentPage/Layout containers such as Grid. A supported wrapper policy does not require
    a separate custom keyboard event service; ScrollView itself does not handle SoftInput.
  - Accepts equivalent correct solutions without requiring one sample's syntax or procedure.
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: Use a keyboard-aware parent layout because ScrollView directly handles container insets,
          not SoftInput; maintain a scrollable constrained region.
- name: Maintain a net9 branch
  prompt: Our MAUI release branch still targets .NET 9. A proposed fix uses the new cross-platform per-edge
    safe-area API and no longer builds. How should we handle the iPhone notch on this branch without upgrading
    its target framework?
  tags:
    capability: version-boundary
    risk: unsupported-api
    journey: maintain-release
  graders:
  - type: exit-success
  - type: output-matches
    config:
      pattern: (?i)(9|legacy|iOS)
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Provides code supported by the existing release target and avoids requiring a framework upgrade.
  - Accepts equivalent correct solutions without requiring one sample's syntax or procedure.
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: Respect the .NET 9 target and use its supported iOS safe-area mechanism; do not insist
          on .NET 10-only APIs or a toolchain upgrade.
- name: Landscape inset change
  prompt: My .NET 10 MAUI photo detail screen works in portrait, but its controls overlap the side notch
    after rotation. Someone suggested hardcoding a top margin of 44. Is that a robust fix?
  tags:
    capability: rotation
    risk: hardcoded-insets
    journey: rotate-photo
  graders:
  - type: exit-success
  - type: output-matches
    config:
      pattern: (?i)(SafeAreaEdges|safe.area|runtime.{0,40}insets|insets.{0,40}runtime)
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Maintains usable content after orientation changes instead of relying on one device's fixed notch
    dimensions.
  - Accepts equivalent correct solutions without requiring one sample's syntax or procedure.
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: Use runtime safe-area policy for container edges instead of fixed notch dimensions; verify
          portrait and landscape on relevant devices.
- name: Repair supplied executable contract
  prompt: This .NET 10 chat-layout factory does not compile. Fix the unsupported spacing member in Program.cs
    without changing the intended 10-unit gap or its screen/keyboard edge policy. Run the supplied checks.
    Do not claim to have tested a keyboard on a device. The supplied files are in your working
    directory; inspect and edit only that copy, not fixture originals elsewhere.
  tags:
    capability: executable-repair
    risk: broken-code
    journey: repair-feature
  environment:
    files:
    - src: fixtures/repair
      dest: .
    commands:
    - python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('Program.cs').read_bytes()).hexdigest() == '3aed7ad8290e44fb3cf8dec7b145eddd950f469cb398f5c38c6173d341619072', 'Fixture changed before trial setup'"
  graders:
  - type: run-command
    config:
      command: 'python3 -c ''import hashlib,pathlib; expected={''"''"''Fixture.csproj''"''"'': ''"''"''daaa2155aa040b8c8e421ae545be8d52233f1ed82cac1a46cb39949fb371962c''"''"'',
        ''"''"''Checks.cs''"''"'': ''"''"''ef75eabad5acdddc7278b754138acf61fff9fb437c564d8851d22f81cd868523''"''"'',
        ''"''"''Directory.Build.props''"''"'': ''"''"''17284cb74605517cbec8a8153505da71a685b28694b67b5ef80608cd79b1c0ea''"''"'',
        ''"''"''Directory.Build.targets''"''"'': ''"''"''17284cb74605517cbec8a8153505da71a685b28694b67b5ef80608cd79b1c0ea''"''"''};
        assert all(pathlib.Path(p).is_file() and hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h
        for p,h in expected.items()); assert {p.as_posix() for p in pathlib.Path(''"''"''.''"''"'').rglob(''"''"''*''"''"'')
        if p.is_file() and p.suffix in (''"''"''.cs''"''"'',''"''"''.csproj''"''"'',''"''"''.props''"''"'',''"''"''.targets''"''"'',''"''"''.xaml''"''"'',''"''"''.resx''"''"'')
        and not any(part in (''"''"''bin''"''"'',''"''"''obj''"''"'',''"''"''.git''"''"'',''"''"''.scratch''"''"'')
        for part in p.parts)} == (set(expected) | {''"''"''Program.cs''"''"''})'''
  - &id001
    type: run-command
    config:
      command: dotnet run --project Fixture.csproj --verbosity quiet
      expected_exit_code: 0
      timeout: 120s
      stdout_matches: 'PASS: behavior-contract'
  - type: prompt
    config:
      evidence:
      - trajectory
      - diff
  rubric:
  - Repairs the stated defect without changing protected files or weakening checks.
    The supplied factory has no multiple-row geometry, and Checks.cs specifies a 10-unit ColumnSpacing.
    Grid.Spacing is unsupported, so it had no valid prior uniform row-spacing behavior to preserve.
    Do not require RowSpacing=10; both column-only and harmless additional row-spacing solutions are valid.
  - Reports only validation actually performed and distinguishes object-model checks from native/device
    behavior.
  golden_patch:
    path: goldens/repair.patch
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: 'Expected result: the supplied defect is corrected in Program.cs without changing the
          public contract. The executable checks verify platform-neutral code against real MAUI 10.0.0
          assemblies; they are not device, native layout, navigation or lifecycle execution evidence.'
- name: Preserve working supplied implementation
  prompt: Review the supplied implementation for the behavior checked by Checks.cs. Run the checks; if
    it already satisfies that contract, do not edit, delete, rename, or add any source/project files.
    Explain any platform-specific validation limitations rather than rewriting working code.
    The supplied files are in your working directory; inspect only that copy, not fixture originals elsewhere.
  tags:
    capability: working-code-preservation
    risk: unnecessary-rewrite
    journey: review-working-code
  environment:
    files:
    - src: fixtures/working
      dest: .
    commands:
    - python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('Program.cs').read_bytes()).hexdigest() == 'e68196ae330c8d0103994b4d429202c03ed3d29779f4edd7ab085b1445da0f79', 'Fixture changed before trial setup'"
  graders:
  - type: run-command
    config:
      command: 'python3 -c ''import hashlib,pathlib; expected={''"''"''Fixture.csproj''"''"'': ''"''"''daaa2155aa040b8c8e421ae545be8d52233f1ed82cac1a46cb39949fb371962c''"''"'',
        ''"''"''Checks.cs''"''"'': ''"''"''ef75eabad5acdddc7278b754138acf61fff9fb437c564d8851d22f81cd868523''"''"'',
        ''"''"''Directory.Build.props''"''"'': ''"''"''17284cb74605517cbec8a8153505da71a685b28694b67b5ef80608cd79b1c0ea''"''"'',
        ''"''"''Directory.Build.targets''"''"'': ''"''"''17284cb74605517cbec8a8153505da71a685b28694b67b5ef80608cd79b1c0ea''"''"'',
        ''"''"''Program.cs''"''"'': ''"''"''e68196ae330c8d0103994b4d429202c03ed3d29779f4edd7ab085b1445da0f79''"''"''};
        assert all(pathlib.Path(p).is_file() and hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h
        for p,h in expected.items()); assert {p.as_posix() for p in pathlib.Path(''"''"''.''"''"'').rglob(''"''"''*''"''"'')
        if p.is_file() and p.suffix in (''"''"''.cs''"''"'',''"''"''.csproj''"''"'',''"''"''.props''"''"'',''"''"''.targets''"''"'',''"''"''.xaml''"''"'',''"''"''.resx''"''"'')
        and not any(part in (''"''"''bin''"''"'',''"''"''obj''"''"'',''"''"''.git''"''"'',''"''"''.scratch''"''"'')
        for part in p.parts)} == (set(expected) | {''"''"''Program.cs''"''"''})'''
  - *id001
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Leaves the complete supplied source/project file set byte-identical when the checks already pass.
  - Separates platform-neutral evidence from unperformed native/device validation.
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: The supplied implementation satisfies the requested object-model contract; leave every
          supplied file unchanged. Platform-neutral checks do not establish behavior on a device.
- name: Web CSS notch padding
  prompt: My responsive website overlaps the iPhone notch in Safari. How do I use CSS environment insets
    and viewport settings? This is HTML/CSS, not a native app.
  expect_activation: false
  tags:
    capability: routing-boundary
    risk: off-target-activation
    journey: use-other-platform
  graders:
  - type: exit-success
  - type: output-not-matches
    config:
      pattern: <ContentPage\b[^>]*SafeAreaEdges\s*=
  - type: prompt
    config:
      evidence:
      - trajectory
  rubric:
  - Recognizes the requested platform/control boundary and gives appropriate guidance.
  - Treats the native app workflow as out of scope; does not apply its APIs, edit unrelated files, or
    install tools.
  golden_trajectory:
    inline:
      schema_version: ATIF-v1.2
      session_id: expected-response
      agent:
        name: reference
        version: '1'
        model_name: curated
      steps:
      - step_id: 1
        source: agent
        message: Use CSS env(safe-area-inset-*) and appropriate viewport-fit configuration, not native
          MAUI markup.
defaults:
  timeout: 6m
  runs: 1
