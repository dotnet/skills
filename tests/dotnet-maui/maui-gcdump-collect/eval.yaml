name: maui-gcdump-collect
description: Physical-device Mono heap collection planning, capability boundaries, and capture integrity
type: capability
defaults:
  timeout: 5m
  runs: 3
stimuli:
  - name: Route Android physical device without host PID confusion
    prompt: |
      Read android-session.txt. Prepare capture-plan.json for our operator to
      collect a managed heap after navigating back from CatalogDetail on the
      selected phone. Do not run device commands, install tools, modify inputs,
      or collect anything. The JSON must have status "planned", device_id,
      physical_capture_verified (boolean), and a nested "commands" object
      containing route, collect, validate, cleanup arrays of shell command
      strings. Use the reserved artifact name; the reserved host port and IPC
      path are only needed if a separately-started finer-control router is
      used instead of the default self-managing route. Record the single
      command that establishes the device route in the route array, and guard
      its collect-array counterpart with an executable
      no-overwrite check before invoking the collector. Include
      selected-device routing, file-format validation, and only the cleanup
      this route actually requires.
      Explain the approval/relaunch checkpoint and any remaining verification.
    tags:
      capability: android-usb-route
      risk: wrong-process-attachment
      journey: prepare-navigation-snapshot
    environment:
      files:
        - src: fixtures/android-session.txt
          dest: android-session.txt
    graders:
      - type: file-exists
        config:
          path: capture-plan.json
      - type: run-command
        config:
          command: |
            python3 -c '
            import json, pathlib, re
            
            p = json.loads(pathlib.Path("capture-plan.json").read_text())
            assert p["status"] == "planned" and p["device_id"] == "R58M123" and p["physical_capture_verified"] is False
            c = p["commands"]
            assert all(isinstance(c[k], list) and c[k] and all(isinstance(s, str) for s in c[k]) for k in ("route", "collect", "validate", "cleanup"))
            r = "\n".join(c["route"])
            q = "\n".join(c["collect"])
            v = "\n".join(c["validate"])
            x = "\n".join(c["cleanup"])
            route_mode = re.search(r"--dsrouter\s+(\S+)", r)
            collect_mode = re.search(r"--dsrouter\s+(\S+)", q)
            assert route_mode and collect_mode and route_mode.group(1) == collect_mode.group(1) == "android"
            assert "after-navigation.gcdump" in r and "after-navigation.gcdump" in q
            assert "dotnet-gcdump collect" in q and "--timeout" in q
            assert "dotnet-gcdump report" in v and "after-navigation.gcdump" in v and "-p " not in v and "|| true" not in v and "|| :" not in v
            a = r + q + v + x
            did = p["device_id"]
            sq = chr(39)
            dq = chr(34)
            
            def extract(name, text):
                # Bare (unquoted) values end at the first shell metacharacter
                # (";", "&", "|") or whitespace -- not just whitespace -- so a
                # real "export NAME=value;"-style assignment resolves to
                # "value", not "value;" with the separator wrongly captured.
                pattern = (r"(?<![A-Za-z0-9_])" + re.escape(name) + r"="
                           + r"(?:" + dq + r"([^" + dq + r"]*)" + dq
                           + r"|" + sq + r"([^" + sq + r"]*)" + sq
                           + r"|([^\s;&|)]+))")
                last = None
                for mm in re.finditer(pattern, text):
                    if mm.group(1) is not None:
                        last = (mm.group(1), "double")
                    elif mm.group(2) is not None:
                        last = (mm.group(2), "single")
                    else:
                        last = (mm.group(3), "bare")
                return last
            
            def resolves(name, text, depth=0):
                # A single-quoted shell value is never subject to $VAR
                # expansion, so e.g. ANDROID_SERIAL=(sq)$SERIAL(sq) must be
                # compared literally -- and correctly fails to equal the
                # selected serial -- rather than treated as a resolvable
                # reference. Bare/double-quoted values may themselves be
                # another $VAR-style reference, which only resolves against
                # the same single commands own text (true single-shell
                # invocation execution order): each route/collect/validate/
                # cleanup entry is its own separate command invocation, so an
                # assignment that only exists in a different, later array
                # entry (e.g. a correct serial set in "cleanup") never reaches
                # this commands environment in a real shell and must not
                # satisfy the reference.
                found = extract(name, text)
                if found is None:
                    return False
                val, kind = found
                if kind == "single":
                    return val == did
                if val.startswith("$") and depth < 4:
                    return resolves(val[1:], text, depth + 1)
                return val == did
            
            assert resolves("ANDROID_SERIAL", r) and resolves("ANDROID_SERIAL", q), "route/collect must bind the selected device via a literal or resolvable ANDROID_SERIAL value -- a single-quoted reference such as " + sq + "$SERIAL" + sq + " never expands in a real shell and must not be accepted -- since neither --dsrouter nor collect accepts a serial flag"
            assert not any(t in a for t in ("server-server", "adb reverse", "adb -s", "setprop debug.mono.profile", "-ipcs", "-tcps", "AndroidEnableProfiler"))
            assert "0.0.0.0" not in a and "--remove-all" not in a and "-p 2841" not in a and "adb pull" not in a
            assert pathlib.Path("android-session.txt").read_text() == """Operator-supplied facts for a planning exercise; no device is attached to the eval worker.\nHost: macOS, .NET SDK 10.0.102; installed Android workload matches the project.\nProject: App.csproj, net10.0-android, Mono, Release.\nProfiling APK includes libmono-component-diagnostics_tracing.so for arm64-v8a.\nDevice: physical serial R58M123, USB debugging authorized; other serials may be present.\nPackage: com.example.catalog; device PID 2841 is identity information, not a host PID.\ndotnet-gcdump and dotnet-dsrouter: 10.0.750501, installed on host; the --dsrouter switch is present.\nNo diagnostic route is configured yet; a controlled relaunch is acceptable after operator approval.\nReserved host TCP port: 9001. Reserved host IPC path: capture-diag.sock in workspace.\nArtifact requested: after-navigation.gcdump in host workspace.\n"""
            print("Android plan and input preservation valid")
            '
      - type: output-matches
        config:
          pattern: (?i)(approv|consent|permission)
      - type: output-matches
        config:
          pattern: (?i)(not verified|not.*captur|no.*captur|pending.*device)
      - &false-verification
        type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*+]\s+|\d+[.)]\s+)?(?:Physical[- ]device capture (?:was |is )?(?:verified|tested|successful)|(?:I |We )?(?:successfully collected|verified the physical[- ]device))
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*+]\s+|\d+[.)]\s+)?(?:Run|Use)\s+dotnet-gcdump\s+collect\s+-p\s+2841\b
      - &no-overwrite
        type: run-command
        config:
          command: |
            python3 -c 'import json, os, shlex, re
            
            def check(path):
                p = json.load(open(path))
                commands = p["commands"]["collect"]
                assert isinstance(commands, list) and commands, "collect must be a non-empty list"
            
                def tokenize(s):
                    lex = shlex.shlex(s, posix=True, punctuation_chars=True)
                    lex.whitespace_split = True
                    return expand_puncts(list(lex))
            
                def expand_puncts(toks):
                    # shlex fuses adjacent punctuation characters with no
                    # intervening whitespace into a single token (e.g. a
                    # paren-close immediately followed by a semicolon, as in
                    # "(exit 1);", becomes one fused closing-paren-semicolon
                    # token) -- split those back into individual operator
                    # tokens, preserving the real two-character shell
                    # operators, so later exact-token comparisons against
                    # "(", ")", ";", etc. are reliable regardless of
                    # surrounding whitespace.
                    two_char_ops = ("&&", "||", ";;", ">>", "<<")
                    punct_chars = set("(){};&|<>")
                    out = []
                    for t in toks:
                        if t and len(t) > 1 and t not in two_char_ops and all(ch in punct_chars for ch in t):
                            k = 0
                            while k < len(t):
                                pair = t[k:k + 2]
                                if pair in two_char_ops:
                                    out.append(pair)
                                    k += 2
                                else:
                                    out.append(t[k])
                                    k += 1
                        else:
                            out.append(t)
                    return out
            
                def top_level_clauses(toks):
                    # Split a token stream on bare top-level ";" into the
                    # shell clauses it actually sequences, skipping any ";"
                    # nested inside balanced "(" ... ")" (a subshell), since
                    # that semicolon never terminates the enclosing clause.
                    clauses = []
                    current = []
                    depth = 0
                    for t in toks:
                        if t == "(":
                            depth += 1
                        elif t == ")":
                            depth = max(0, depth - 1)
                        if t == ";" and depth == 0:
                            clauses.append(current)
                            current = []
                        else:
                            current.append(t)
                    clauses.append(current)
                    return [c for c in clauses if c]
            
                def has_unconditional_exit(block_tokens):
                    # A genuinely nonzero "exit N" only guarantees the real
                    # enclosing script terminates right there if it is the
                    # FIRST thing a top-level (bare ";"-separated) clause
                    # does: an "exit" gated behind "||"/"&&" only runs if an
                    # earlier command in the same clause fails/succeeds
                    # (e.g. "printf msg || exit 1" never reaches exit when
                    # printf itself succeeds, which it normally does), and an
                    # "exit" wrapped in "(...)" only terminates that inner
                    # subshell, not the actual script -- both must be
                    # rejected. Requiring "exit" to be clause[0] excludes
                    # both: a clause opening with "(" or any other command
                    # cannot satisfy it.
                    for clause in top_level_clauses(block_tokens):
                        if (len(clause) >= 2 and clause[0] == "exit"
                                and clause[1].isdigit() and 1 <= int(clause[1]) <= 255):
                            return True
                    return False
            
                norm = lambda value: os.path.abspath(value.replace("$" + "{PWD}", os.getcwd()).replace("$PWD", os.getcwd()))
            
                # Locate the single array element that actually invokes the collector,
                # accepting either the literal binary name or a variable resolved from it
                # earlier in that same element (e.g. collector="$(command -v dotnet-gcdump)").
                invoke_idx = None
                invoke_tokens = None
                invoke_pos = None
                for i, elem in enumerate(commands):
                    assert isinstance(elem, str)
                    tokens = tokenize(elem)
                    literal_positions = [j for j, t in enumerate(tokens) if t == "dotnet-gcdump" and j + 1 < len(tokens) and tokens[j + 1] == "collect"]
                    var_pos = None
                    m = re.search(r"(\w+)=.*dotnet-gcdump", elem)
                    if m:
                        var = m.group(1)
                        for j, t in enumerate(tokens):
                            if t.strip(chr(34) + chr(39)) == "$" + var and j + 1 < len(tokens) and tokens[j + 1] == "collect":
                                var_pos = j
                                break
                    pos = literal_positions[0] if literal_positions else var_pos
                    if pos is not None:
                        assert invoke_idx is None, "Exactly one collect element may invoke the collector"
                        invoke_idx = i
                        invoke_tokens = tokens
                        invoke_pos = pos
            
                assert invoke_idx is not None, "No guarded capture invocation found"
                tokens = invoke_tokens
                index = invoke_pos
                assert tokens[index + 1] == "collect"
                output = tokens[tokens.index("--output") + 1] if "--output" in tokens else tokens[tokens.index("-o") + 1]
                prefix = tokens[:index]
                # Strip inline environment-variable assignments (e.g.
                # "ANDROID_SERIAL=...") immediately preceding the invocation: these
                # bind the environment for that command and are not a separate
                # shell clause, so the real preceding guard clause is whatever
                # came before them.
                while prefix and re.match(r"^[A-Za-z_][A-Za-z0-9_]*=", prefix[-1]):
                    prefix = prefix[:-1]
            
                def guard_tests_output(guard_tokens):
                    forms = [["test", "!", "-e", output], ["!", "test", "-e", output], ["[", "!", "-e", output, "]"]]
                    return any(
                        len(guard_tokens) == len(form) and guard_tokens[:3] == form[:3]
                        and norm(guard_tokens[3]) == norm(output) and guard_tokens[4:] == form[4:]
                        for form in forms
                    )
            
                matched = False
                matched_form_b = False
            
                # Form A: "<guard> && [<other guards> &&]... <invoke>" -- take the clause
                # immediately preceding the invocation (the rightmost "&&"-joined clause),
                # so additional defensive checks earlier in the chain (binary resolution,
                # executability) does not block recognition of the actual guard.
                if not matched and prefix[-1:] == ["&&"]:
                    chain = prefix[:-1]
                    # split chain by top-level "&&" tokens into clauses
                    clauses = [[]]
                    for t in chain:
                        if t == "&&":
                            clauses.append([])
                        else:
                            clauses[-1].append(t)
                    if clauses and guard_tests_output(clauses[-1]):
                        matched = True
            
                # Form B: "if <guard>; then <invoke>; else <exit N>; fi" -- a bare
                # "if <guard>; then <invoke>; fi" with NO else is not accepted on its
                # own: when the guard is false (output already exists), an if with no
                # executed branch exits 0, which falsely reports success for a skipped
                # capture -- the same false-success defect the Form C "exit 0" mutation is
                # rejected for below. A qualifying "else ...exit N; fi" closer with a
                # genuinely nonzero (1-255; see the modulo-256 note on Form C) exit is
                # required, mirroring the Form C nonzero-exit requirement.
                form_b_else_idx = None
                if (not matched and prefix[:1] == ["if"] and prefix[-2:] == [";", "then"]
                        and tokens[-1] == "fi" and "else" in tokens[index:]):
                    guard = prefix[1:-2]
                    else_idx = len(tokens) - 1 - tokens[::-1].index("else")
                    else_block = tokens[else_idx + 1:-1]
                    # "exit N" merely appearing somewhere in the else-block is not
                    # enough: e.g. "else printf \"exists\\n\" || exit 1; fi" never
                    # reaches exit when printf itself succeeds (the normal case),
                    # so the if-statement still exits 0 overall. Require exit to be
                    # the unconditional first action of a top-level clause instead.
                    has_else_exit = has_unconditional_exit(else_block)
                    if has_else_exit and guard_tests_output(guard):
                        matched = True
                        matched_form_b = True
                        form_b_else_idx = else_idx
            
                # Form C: "<guard> || { ...; exit N; }; <invoke>" -- inverse guard with an
                # early-exit block, joined to the invocation within the SAME shell string
                # so the exit genuinely short-circuits execution of the collector.
                if not matched and prefix[-1:] == [";"] and len(prefix) >= 2 and prefix[-2] == "}":
                    # find matching "{" by scanning backward, tracking brace depth
                    # (prefix[-2] is the already-identified closing brace, so depth starts at 1)
                    depth = 1
                    open_idx = None
                    for j in range(len(prefix) - 3, -1, -1):
                        if prefix[j] == "}":
                            depth += 1
                        elif prefix[j] == "{":
                            depth -= 1
                            if depth == 0:
                                open_idx = j
                                break
                    if open_idx is not None and open_idx >= 1 and prefix[open_idx - 1] == "||":
                        block = prefix[open_idx + 1:-2]
                        guard = prefix[:open_idx - 1]
                        # "exit 0" would unconditionally terminate the script before the
                        # collector runs too, but it falsely reports success to any caller
                        # even though the guard skipped the capture -- only a nonzero exit
                        # correctly signals "nothing was captured" to an orchestrating process.
                        # POSIX shells reduce the exit status modulo 256, so "exit 256" (and
                        # any other multiple of 256) is indistinguishable from "exit 0" at
                        # runtime; only 1-255 are genuinely nonzero once the shell truncates.
                        # "exit N" merely appearing somewhere in the block is not enough
                        # either: "{ printf \"exists\\n\" || exit 1; }" never reaches exit
                        # when printf succeeds (the normal case), so the group real exit
                        # status is printf success and the following bare ";" still runs
                        # the collector regardless; "{ (exit 1); }" only terminates the
                        # inner subshell, never the actual script, so the bare ";" after it
                        # still runs the collector too. Require exit to be the unconditional
                        # first action of a top-level (non-subshelled) clause instead.
                        has_exit = has_unconditional_exit(block)
                        if has_exit and guard_tests_output(guard):
                            matched = True
            
                assert matched, "Collector lacks a short-circuit output-exists guard connected to the invocation in the same command"
            
                # The guard is worthless if a trailing shell control operator after the
                # invocation (in the SAME array element) can mask its real exit status,
                # e.g. "dotnet-gcdump collect ... || true" (unconditionally succeeds),
                # "; echo done" (runs regardless of the exit code of the invocation), or a
                # trailing pipe (the exit code of the pipeline becomes that of the last
                # stage, not that of the collector) -- the Form B matched "else ...; fi" closer
                # terminates the invocation at the "else" keyword -- that is one carve-out.
                # Two more safety-preserving forms are also allowed: a single bare trailing
                # ";" with nothing after it (just a statement terminator, nothing can run
                # unconditionally), and any chain of additional "&&"-joined commands (each
                # only runs if everything before it, including the collector, already
                # succeeded, so a collector failure still short-circuits the chain and
                # surfaces as the failure).
                # A single bare trailing ";" is stripped before scanning: any "||", "|",
                # or additional ";" remaining after that strip means a later clause can
                # run (or an exit code can be swallowed) regardless of whether
                # the collector itself succeeded, which is what must be rejected. A
                # single trailing "&" (background) is NOT stripped: it backgrounds the
                # invocation and the shell reports status 0 immediately, so the guard
                # exit status can never propagate and validation can race the capture.
                invocation_tail = tokens[index:form_b_else_idx] if matched_form_b else tokens[index:]
                if invocation_tail and invocation_tail[-1] == ";":
                    invocation_tail = invocation_tail[:-1]
                unsafe_operators = {"||", ";", "|", "&"}
                assert not any(t in unsafe_operators for t in invocation_tail), (
                    "A shell control operator after the collector invocation can mask its exit status"
                )
                print("No-overwrite guard valid:", path)
            
            check("capture-plan.json")
            '
      - type: prompt
    rubric:
      - Provides a coherent selected-serial USB connection between the Mono app and host collector, not a host attach to the phone PID; binds the route/collect commands to that serial via ANDROID_SERIAL since neither `--dsrouter` nor `collect` accepts a serial flag.
      - Accounts for diagnostics starting at app launch and reproduction after an approved restart, without claiming the current heap can survive that restart.
      - Identifies managed GC pause and confidentiality risks without performing capture or exposing a network listener.
      - Validates a host-side gcdump and confirms --dsrouter android leaves no router process, port forward, or device property requiring manual cleanup.
    golden_patch:
      inline: |
        diff --git a/capture-plan.json b/capture-plan.json
        new file mode 100644
        --- /dev/null
        +++ b/capture-plan.json
        @@ -0,0 +1,15 @@
        +{
        +  "status": "planned",
        +  "device_id": "R58M123",
        +  "physical_capture_verified": false,
        +  "commands": {
        +    "route": [
        +      "ANDROID_SERIAL=R58M123 dotnet-gcdump collect --dsrouter android --output \"$PWD/after-navigation.gcdump\" --timeout 60"
        +    ],
        +    "collect": ["test ! -e \"$PWD/after-navigation.gcdump\" && ANDROID_SERIAL=R58M123 dotnet-gcdump collect --dsrouter android --output \"$PWD/after-navigation.gcdump\" --timeout 60"],
        +    "validate": ["dotnet-gcdump report \"$PWD/after-navigation.gcdump\""],
        +    "cleanup": [
        +      "echo \"--dsrouter android owns its own port forward and router process for this single capture and tears both down on exit; no manual process or property to restore\""
        +    ]
        +  }
        +}
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: android-plan
        agent: {name: reference, version: "1"}
        steps:
          - step_id: 1
            source: agent
            message: |
              This is an advisory plan, not an executed capture. Obtain approval
              before creating the route or relaunching. The configured component
              alone does not add a port to the running app; apply the launch
              setting to an approved restart, then repeat the navigation.
              The single dotnet-gcdump collect --dsrouter android command starts
              its own adb-reverse route and dsrouter process for this one
              capture; no separate router or manual adb step is needed. Neither
              --dsrouter nor collect accepts a device-serial flag, so prefix
              both with ANDROID_SERIAL=R58M123 (the inherited adb selector) to
              scope this to the intended device when other serials are present.
              Verify
              its connection belongs to com.example.catalog on R58M123 before
              collecting. PID 2841 is the phone app, not a host attach.
              Collection induces a full GC and may pause/OOM the app. Keep
              diagnostic TCP on loopback and keep the dump private. The collector
              writes after-navigation.gcdump on the host; require successful exit,
              a new nonempty file and readable type statistics from file report.
              The collect command short-circuits if the output path already exists;
              choose a new name rather than overwriting an earlier capture.
              --dsrouter android tears down its router and reverse mapping when
              the capture finishes, so there is no separate process or property
              to restore. Physical-device capture not verified.

  - name: Use physical iOS listener without restarting a prepared app
    prompt: |
      Read ios-session.txt and write capture-plan.json for collecting the current
      managed object graph from this running iPhone app. It is important not to
      lose current state. No installation, relaunch, tool installation, capture
      or device commands are authorized here. Preserve inputs. The JSON must
      have status "planned", device_id, physical_capture_verified (boolean), and
      a nested "commands" object containing route, collect, validate, cleanup
      arrays of shell strings. Use the reserved artifact name; the reserved host
      IPC path is only needed if a separately-started finer-control router is
      used instead of the default self-managing route. Include an executable
      no-overwrite check before collection. Explain how the host reaches
      this device rather than a simulator, and what still needs verification.
    tags:
      capability: ios-live-usb-route
      risk: simulator-device-conflation
      journey: preserve-live-reproduction
    environment:
      files:
        - src: fixtures/ios-session.txt
          dest: ios-session.txt
    graders:
      - type: file-exists
        config:
          path: capture-plan.json
      - type: run-command
        config:
          command: >-
            python3 -c 'import json,pathlib,re; p=json.loads(pathlib.Path("capture-plan.json").read_text());
            assert p["status"]=="planned" and p["device_id"]=="00008110-001234567890001E" and p["physical_capture_verified"] is False;
            c=p["commands"]; assert all(isinstance(c[k],list) and c[k] and all(isinstance(s,str) for s in c[k]) for k in ("route","collect","validate","cleanup"));
            r="\n".join(c["route"]); q="\n".join(c["collect"]); v="\n".join(c["validate"]); a=r+q+v+"\n".join(c["cleanup"]);
            assert "server-client" in r and "-tcpc" in r and "127.0.0.1:9001" in r and "--forward-port" in r and re.search(r"(?i)\bios\b", r) and "capture-diag.sock" in r;
            assert "--diagnostic-port" in q and "capture-diag.sock" in q and ",connect" in q;
            assert "after-navigation.gcdump" in q;
            assert "dotnet-gcdump collect" in q and "--timeout" in q;
            assert "dotnet-gcdump report" in v and "after-navigation.gcdump" in v and "-p " not in v and "|| true" not in v and "|| :" not in v;
            assert all(t not in a for t in ("--dsrouter","mlaunch","--launchdev","--installdev","--launchsim","ios-sim","simctl","adb ","0.0.0.0","-p 519"));
            assert pathlib.Path("ios-session.txt").read_text()=="""Operator-supplied facts for a planning exercise; no device is attached to the eval worker.\nHost: macOS, .NET SDK 10.0.102, matching iOS workload/Xcode; dotnet-gcdump and dotnet-dsrouter 10.0.750501 (the --dsrouter switch is present).\nProject: Catalog.csproj, net10.0-ios, ios-arm64, Mono AOT (PublishAot=false), Release.\nSigned development .app has the real static diagnostics_tracing component, not the stub.\nOne physical USB iPhone: UDID 00008110-001234567890001E; trusted, unlocked, Developer Mode enabled.\nBundle: com.example.catalog; device PID 519 is not a host diagnostics PID.\nThe app is already running with DiagnosticConfiguration=127.0.0.1:9001,nosuspend,listen from its last approved dotnet run launch.\nNo host router is currently running; no app restart or install is permitted.\nReserved host IPC path: capture-diag.sock in workspace.\nArtifact requested: after-navigation.gcdump in host workspace.\n""";
            print("iOS live plan and input preservation valid")'
      - type: output-matches
        config:
          pattern: (?i)(not verified|not.*captur|no.*captur|pending.*device)
      - *false-verification
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*+]\s+|\d+[.)]\s+)?(?:Run|Use)\s+dotnet-gcdump\s+collect\s+-p\s+519\b
      - *no-overwrite
      - type: prompt
    rubric:
      - Reaches a physical USB iPhone via the explicit finer-control router (the listener is on a non-default port the self-managing `--dsrouter ios` route cannot reach), not simulator tooling or direct host attach to PID 519.
      - Preserves the prepared running session rather than introducing an unnecessary install, rebuild, or restart.
      - Distinguishes Mono AOT from NativeAOT and handles the stated diagnostic component as a satisfied prerequisite.
      - Explains file-format and identity checks still required before claiming a successful snapshot.
    golden_patch:
      inline: |
        diff --git a/capture-plan.json b/capture-plan.json
        new file mode 100644
        --- /dev/null
        +++ b/capture-plan.json
        @@ -0,0 +1,16 @@
        +{
        +  "status": "planned",
        +  "device_id": "00008110-001234567890001E",
        +  "physical_capture_verified": false,
        +  "commands": {
        +    "route": [
        +      "dotnet-dsrouter server-client -ipcs \"$PWD/capture-diag.sock\" -tcpc 127.0.0.1:9001 --forward-port iOS &"
        +    ],
        +    "collect": ["test ! -e \"$PWD/after-navigation.gcdump\" && dotnet-gcdump collect --diagnostic-port \"$PWD/capture-diag.sock\",connect --output \"$PWD/after-navigation.gcdump\" --timeout 60"],
        +    "validate": ["dotnet-gcdump report \"$PWD/after-navigation.gcdump\""],
        +    "cleanup": [
        +      "echo \"stop the backgrounded server-client router process once collection and validation finish; no app restart needed\""
        +    ]
        +  },
        +  "note": "The running app and its launch-time listener are preserved; no reinstall or relaunch."
        +}
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: ios-plan
        agent: {name: reference, version: "1"}
        steps:
          - step_id: 1
            source: agent
            message: |
              Plan only: no capture performed. Mono AOT is not NativeAOT.
              The supplied real static diagnostic component and launch-time
              listener satisfy build/launch prerequisites; preserve this session.
              Obtain approval before starting the router and triggering GC.
              The listener is already on 127.0.0.1:9001, but dotnet-gcdump's
              self-managing --dsrouter ios route always targets the physical
              device's usbmux port 9000 with no port offset, so it cannot reach
              this listener without a restart. Instead, start the explicit
              finer-control router (dotnet-dsrouter server-client -ipcs
              capture-diag.sock -tcpc 127.0.0.1:9001 --forward-port iOS) over
              the physical iPhone's usbmux connection, then connect
              dotnet-gcdump collect to that same IPC path with ",connect"; no
              simulator or adb is involved. One attached USB iPhone avoids
              router selection ambiguity; confirm bundle/build and router logs
              before collecting. PID 519 is not a host attach.
              The dump is written on the Mac. Require successful collector exit,
              a new nonempty file and a readable file report. Collection can pause
              or OOM the app, and managed graph data must stay private. Protect
              existing output with the collect command's short-circuit guard;
              choose another name if a prior file exists. Stop the backgrounded
              server-client router once collection and validation finish; the
              launch-time diagnostics listener stays in place until the next
              ordinary launch, so there is nothing else to stop now.
              Physical-device capture not verified.

  - name: Preserve an unprepared running heap
    prompt: |
      We have a Mono net10.0-android MAUI app on a real phone. A memory problem
      has just appeared and we must preserve the current process. The Release
      APK omitted profiling support and it was launched without diagnostic
      ports. Can we get the required managed heap file right now by setting an
      adb property? Give a go/no-go decision and the smallest safe next step.
      We cannot restart, install, or change the app today. Advice only.
    tags:
      capability: launch-prerequisite
      risk: fabricated-live-attach
      journey: preserve-incident-state
    graders:
      - type: output-matches
        config:
          pattern: (?i)(no-go|cannot|can't|not possible|blocked)
      - type: output-matches
        config:
          pattern: (?i)(launch|start|restart|relaunch)
      - type: output-not-matches
        config:
          pattern: (?i)(successfully captured|dump collected|capture succeeded)
      - *false-verification
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*+]\s+|\d+[.)]\s+)?(?:You|The property|This setting)\s+(?:can|will)\s+(?:retrofit|enable)\s+(?:the\s+)?diagnostic[^\n]*(?:already running|without (?:a )?restart)
      - type: prompt
    rubric:
      - Explains both missing component and launch-time endpoint as blockers to collecting the current live heap.
      - Respects the no-restart constraint instead of running deployment or retroactive port activation.
      - Offers an approved future profiling build and new reproduction without misrepresenting it as preserving this process.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: missing-component
        agent: {name: reference, version: "1"}
        steps:
          - step_id: 1
            source: agent
            message: |
              No-go for the current process. The diagnostic component is absent,
              and setting debug.mono.profile now cannot retrofit a diagnostic
              server into an already running app. A launch-time port alone cannot
              replace the omitted component. Preserve the process and perform no
              changes today. The next opportunity needs approval for a profiling
              build with -p:EnableDiagnostics=true, a selected-serial USB route,
              nosuspend diagnostics at launch, and a fresh reproduction; that
              produces a different heap, not this incident's current state.
              Physical-device capture not verified.

  - name: Prepare iOS Release profiling without store guarantees
    prompt: |
      Give our Mac operator a concise preparation checklist for a signed
      development Release build of a Mono MAUI net9.0-ios app on a physical
      iPhone. PublishAot is false. We need a managed memory snapshot after
      navigation, not startup timing. The linker used the diagnostics stub.
      Include the SDK build switch to investigate, actual component evidence,
      and how to pass the endpoint to the phone app. No commands are authorized
      to run; the shipping App Store configuration must remain unchanged.
    tags:
      capability: ios-release-component
      risk: diagnostics-stub-shipping
      journey: prepare-test-binary
    graders:
      - type: output-contains
        config:
          substring: EnableDiagnostics
      - type: output-matches
        config:
          pattern: (?is)(static|link).*(component|diagnostic)|(component|diagnostic).*(static|link)
      - type: output-matches
        config:
          pattern: nosuspend%2clisten
      - type: output-contains
        config:
          substring: --device
      - type: output-contains
        config:
          substring: DiagnosticConfiguration
      - type: output-matches
        config:
          pattern: (?i)(?:-p:|--property:)DiagnosticConfiguration=
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?!(?:[-*+]\s+|\d+[.)]\s+)?(?:Never|Don['\u2019]?t|Do\s+not|Won['\u2019]?t|Should\s+not|Must\s+not|Avoid(?:ing)?)\b)(?:[-*+]\s+|\d+[.)]\s+)?[^\n]*?(?:-e[:\s]|--environment[:\s])DiagnosticConfiguration=
      - *false-verification
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*+]\s+|\d+[.)]\s+)?(?:Use|Require|Verify|Load)[^\n]*libmono-component-diagnostics_tracing\.so
      - type: output-not-matches
        config:
          pattern: (?i)\bmlaunch\b|--launchdev|--installdev
      - type: prompt
    rubric:
      - Treats the diagnostics stub as a blocker and proposes a separate diagnostic test build with version-specific verification, not a shipping edit.
      - Identifies a real static diagnostic component for physical iOS rather than looking for an Android-style shared library.
      - Uses dotnet run's device launch with the diagnostic configuration passed as an
        MSBuild property and a matching physical USB route, not a runtime environment
        variable or a simulator/stale mlaunch command.
      - Recognizes Mono AOT as distinct from NativeAOT and accounts for signing, trust and Developer Mode.
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: ios-release
        agent: {name: reference, version: "1"}
        steps:
          - step_id: 1
            source: agent
            message: |
              Blocked until the test build links the real static diagnostics_tracing
              component rather than its stub. For this Mono Release lane,
              investigate -p:EnableDiagnostics=true on an ios-arm64 test build; this
              is the documented, version-independent switch that gates linking the
              component, so inspect actual link evidence.
              Keep shipping configuration untouched. Mono AOT is not NativeAOT.
              On the Mac verify matching workload/Xcode, signed provisioning for
              the selected UDID, trust/unlock and Developer Mode as required.
              Discover the device UDID with the SDK's own
              --list-devices output rather than assuming one device.
              After approval launch the exact test build with dotnet run
              --project App.csproj -f net9.0-ios -c Release --device UDID
              -p:DiagnosticConfiguration=127.0.0.1:9000%2cnosuspend%2clisten (the
              comma is escaped as %2c because dotnet run's own argument parser
              treats an unescaped comma as a separator; this must be an MSBuild
              property, -p:, not a runtime environment variable of the same
              name, because the build maps the DiagnosticConfiguration property
              to the DOTNET_DiagnosticPorts variable actually forwarded to the
              device app -- passing it instead as a runtime variable would
              forward that literal, wrong name unchanged and establish no
              listener; setting this property also implicitly sets
              EnableDiagnostics=true for the build).
              Then collect with dotnet-gcdump collect --dsrouter ios after
              reproduction. No store-build access is promised. Physical-device
              capture not verified.

  - name: Disambiguate two iPhones before GC
