                # stimulus above: ";"/"&&"/"||"/"&"/newline delimit clauses
                # outside quotes/parens, recording the separator that
                # precedes each one.
                clauses, cur, depth, quote, sep = [], [], 0, None, None
                i, n = 0, len(text)
                while i < n:
                    ch = text[i]
                    if quote:
                        cur.append(ch)
                        if ch == quote:
                            quote = None
                        i += 1
                        continue
                    if ch in (dq, sq):
                        quote = ch
                        cur.append(ch)
                        i += 1
                        continue
                    if ch == "(":
                        depth += 1
                        cur.append(ch)
                        i += 1
                        continue
                    if ch == ")":
                        depth = max(0, depth - 1)
                        cur.append(ch)
                        i += 1
                        continue
