                        continue
                    if depth == 0 and ch == "|" and clause[i:i + 2] != "||":
                        segs.append("".join(cur))
                        cur = []
                        i += 1
                        continue
                    cur.append(ch)
                    i += 1
                segs.append("".join(cur))
                if len(segs) == 1:
                    return True
                return not any(re.search(r"dotnet-gcdump\s+report\b", s) for s in segs[:-1])
            
            def report_status_propagates(validate_entries):
                # Each commands-array entry is its OWN separate shell
                # invocation with fresh state -- joining every entry into
                # one script before splitting into clauses would let an
                # unrelated LATER entry look like a trailing clause that
                # masks an EARLIER entrys own, already-safe "dotnet-gcdump
                # report" invocation, even though the two entries never
                # share a single real exit status. Evaluate every entry
                # independently instead, while still catching masking
                # WITHIN a single entrys own text.
                keyword_re = re.compile(r"^(?:then|else|do)\s+")
                leading_assigns_re = re.compile(
                    r"^(?:[A-Za-z_][A-Za-z0-9_]*=(?:" + sq + r"[^" + sq + r"]*" + sq
                    + r"|" + dq + r"[^" + dq + r"]*" + dq + r"|\S*)\s+)*"
                )
                report_head_re = re.compile(r"dotnet-gcdump\s+report\b")
                reported = False
                for entry in validate_entries:
                    clauses = split_clauses(entry)
                    for idx, (sep, clause) in enumerate(clauses):
                        bare = leading_assigns_re.sub(
                            "", keyword_re.sub("", clause.strip(), count=1))
                        # Only a clause whose OWN head command literally IS
                        # "dotnet-gcdump report" (after stripping a leading
                        # keyword/assignments) can let its real exit status
                        # propagate. Report text appearing elsewhere in the
                        # clause -- as a literal argument to "echo"/"printf",
                        # negated behind a leading "!", or nested only inside
                        # a "$(...)" command-substitution argument -- never
                        # does: "echo"/"printf" always exit 0 regardless of
                        # the wrapped text or substituted commands own
                        # status, and "!" inverts a real invocations status
                        # instead of propagating it, so neither counts.
                        if not report_head_re.match(bare):
                            continue
                        # A report invocation reached only via a
                        # preceding "||" only runs when an earlier
                        # command in the SAME entry already failed --
                        # if that earlier command instead succeeds,
                        # report never runs at all, silently skipping
                        # the parse this check exists to guarantee.
                        if sep == "||":
                            return False
                        if not pipe_safe_report(bare):
                            return False
                        reported = True
                        if any(nsep not in ("&&",) for nsep, _ in clauses[idx + 1:]):
                            return False
                return reported
            
            assert "server-client" in r and "-tcpc" in r and "127.0.0.1:9001" in r and "--forward-port" in r and re.search(r"(?i)\bios\b", r) and "capture-diag.sock" in r
            assert "--diagnostic-port" in q and "capture-diag.sock" in q and ",connect" in q
            assert "after-navigation.gcdump" in q
            assert "dotnet-gcdump collect" in q and "--timeout" in q
            assert "dotnet-gcdump report" in v and "after-navigation.gcdump" in v and "-p " not in v and "|| true" not in v and "|| :" not in v
            assert report_status_propagates(c["validate"]), "A trailing " + dq + ";" + dq + "/" + dq + "&" + dq + "-joined clause after dotnet-gcdump report can mask its real exit status regardless of " + dq + "|| true" + dq + "; only the report clause itself or further " + dq + "&&" + dq + "-joined clauses are accepted, and report must be reached unconditionally within its own entry (not only via a preceding " + dq + "||" + dq + ")"
            # The backgrounded finer-control server-client router is a
            # separate, long-lived process dotnet-gcdump never tears down on
            # its own; an echo-only cleanup that merely describes stopping it
            # (rather than actually invoking a stop) leaves the router running
            # forever and must be rejected.
            x = "\n".join(c["cleanup"])
            stop_word_re = re.compile(r"(?i)\b(stop|kill|terminate|pkill)\b")
            def real_stop_text(text):
                # A clause whose own command word is itself just echo/printf
                # never actually stops anything -- it only prints a stop/kill
                # word (or the router name) as a literal argument, so such
                # clauses must be excluded before checking for a real
                # stop/kill/terminate/pkill invocation.
                for cl in re.split(r";|&&|\|\||&|\n", text):
                    cl = cl.strip()
                    if not cl:
                        continue
                    words = cl.split()
                    if words and words[0] in ("echo", "printf"):
                        continue
                    if stop_word_re.search(cl) or "dotnet-dsrouter" in cl:
                        return True
                return False
            assert real_stop_text(x), "cleanup must actually stop the backgrounded server-client router (e.g. kill/pkill), not merely describe or echo doing so"
            # Each commands-array entry is its OWN independent shell
            # invocation: a plain "$VAR" or its braced form reference naming a value
            # assigned only in route own shell-local state is simply unset
            # by the time cleanup separate invocation runs, so it must still
            # be rejected even when it superficially mentions a stop verb.
            bare_var_ref = re.search(r"\b(?:stop|kill|terminate)\s+\$\{?(\w+)\}?\b", x, re.IGNORECASE)
            assert not bare_var_ref, "cleanup stops the router via a bare $VAR reference, but each commands-array entry is an independent shell invocation -- a value assigned only in route own shell-local state never reaches cleanup separate invocation; recover the router identity in a way that actually crosses shell boundaries instead, e.g. " + dq + "kill " + chr(92) + dq + "$(cat FILE)" + chr(92) + dq + dq + " after route persists it with " + dq + "> FILE" + dq + ", or " + dq + "pkill -f PATTERN" + dq
            assert all(t not in a for t in ("--dsrouter", "mlaunch", "--launchdev", "--installdev", "--launchsim", "ios-sim", "simctl", "adb ", "0.0.0.0", "-p 519"))
            assert pathlib.Path("ios-session.txt").read_text() == """Operator-supplied facts for a planning exercise; no device is attached to the eval worker.\nHost: macOS, .NET SDK 10.0.102, matching iOS workload/Xcode; dotnet-gcdump and dotnet-dsrouter 10.0.750501 (the --dsrouter switch is present).\nProject: Catalog.csproj, net10.0-ios, ios-arm64, Mono AOT (PublishAot=false), Release.\nSigned development .app has the real static diagnostics_tracing component, not the stub.\nOne physical USB iPhone: UDID 00008110-001234567890001E; trusted, unlocked, Developer Mode enabled.\nBundle: com.example.catalog; device PID 519 is not a host diagnostics PID.\nThe app is already running with DiagnosticConfiguration=127.0.0.1:9001,nosuspend,listen from its last approved dotnet run launch.\nNo host router is currently running; no app restart or install is permitted.\nReserved host IPC path: capture-diag.sock in workspace.\nArtifact requested: after-navigation.gcdump in host workspace.\n"""
            print("iOS live plan and input preservation valid")
            '
      - type: output-matches
        config:
          pattern: (?i)(not verified|not.*captur|no.*captur|pending.*device)
      - *false-verification
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:[-*+]\s+|\d+[.)]\s+)?(?:Run|Use)\s+dotnet-gcdump\s+collect\s+-p\s+519\b
      - *no-overwrite
      - type: prompt
    rubric:
      - Reaches a physical USB iPhone via the explicit finer-control router (the listener is on a non-default port the self-managing `--dsrouter ios` route cannot reach), not simulator tooling or direct host attach to PID 519.
      - Preserves the prepared running session rather than introducing an unnecessary install, rebuild, or restart.
      - Distinguishes Mono AOT from NativeAOT and handles the stated diagnostic component as a satisfied prerequisite.
      - Explains file-format and identity checks still required before claiming a successful snapshot.
    golden_patch:
      inline: |
        diff --git a/capture-plan.json b/capture-plan.json
        new file mode 100644
        --- /dev/null
        +++ b/capture-plan.json
        @@ -0,0 +1,16 @@
        +{
        +  "status": "planned",
        +  "device_id": "00008110-001234567890001E",
        +  "physical_capture_verified": false,
        +  "commands": {
        +    "route": [
        +      "dotnet-dsrouter server-client -ipcs \"$PWD/capture-diag.sock\" -tcpc 127.0.0.1:9001 --forward-port iOS & echo $! > \"$PWD/router.pid\""
        +    ],
        +    "collect": ["test ! -e \"$PWD/after-navigation.gcdump\" && dotnet-gcdump collect --diagnostic-port \"$PWD/capture-diag.sock\",connect --output \"$PWD/after-navigation.gcdump\" --timeout 60"],
        +    "validate": ["dotnet-gcdump report \"$PWD/after-navigation.gcdump\""],
        +    "cleanup": [
        +      "kill \"$(cat \"$PWD/router.pid\" 2>/dev/null)\" 2>/dev/null; rm -f \"$PWD/router.pid\"; echo done"
        +    ]
