name: maui-gcdump-collect
description: Physical-device Mono heap collection planning, capability boundaries, and capture integrity
type: capability
defaults:
  timeout: 5m
  runs: 3
stimuli:
  - name: Route Android physical device without host PID confusion
    prompt: |
      Read android-session.txt. Prepare capture-plan.json for our operator to
      collect a managed heap after navigating back from CatalogDetail on the
      selected phone. Do not run device commands, install tools, modify inputs,
      or collect anything. The JSON must have status "planned", device_id,
      physical_capture_verified (boolean), and a nested "commands" object
      containing route, collect, validate, cleanup arrays of shell command
      strings. Use the reserved artifact name; the reserved host port and IPC
      path are only needed if a separately-started finer-control router is
      used instead of the default self-managing route. Record the single
      command that establishes the device route in the route array, and guard
      its collect-array counterpart with an executable
      no-overwrite check before invoking the collector. Include
      selected-device routing, file-format validation, and only the cleanup
      this route actually requires.
      Explain the approval/relaunch checkpoint and any remaining verification.
    tags:
      capability: android-usb-route
      risk: wrong-process-attachment
      journey: prepare-navigation-snapshot
    environment:
      files:
        - src: fixtures/android-session.txt
          dest: android-session.txt
    graders:
      - type: file-exists
        config:
          path: capture-plan.json
      - type: run-command
        config:
          command: |
            python3 -c '
            import json, pathlib, re
            
            p = json.loads(pathlib.Path("capture-plan.json").read_text())
            assert p["status"] == "planned" and p["device_id"] == "R58M123" and p["physical_capture_verified"] is False
            c = p["commands"]
            assert all(isinstance(c[k], list) and c[k] and all(isinstance(s, str) for s in c[k]) for k in ("route", "collect", "validate", "cleanup"))
            r = "\n".join(c["route"])
            q = "\n".join(c["collect"])
            v = "\n".join(c["validate"])
            x = "\n".join(c["cleanup"])
            sq = chr(39)
            dq = chr(34)
            route_mode = re.search(r"--dsrouter\s+(\S+)", r)
            # The prompt explicitly permits EITHER the default self-managing
            # "dotnet-gcdump ... --dsrouter android" route (route and collect
            # share one --dsrouter-mode invocation) OR a separately-started
            # finer-control "dotnet-dsrouter android" router attached to by
            # PID (references/android.md, the "Route and approved preparation"
            # section) -- the self-managing route own artifact-in-route,
            # serial-resolution and forbidden-IPC assumptions must not be
            # applied verbatim to the standalone-router alternative.
            standalone_router = re.search(r"(?<!--)\bdotnet-dsrouter\s+android\b", r) is not None
            assert (route_mode and route_mode.group(1) == "android") or standalone_router, "route must establish the device route via either the self-managing " + dq + "dotnet-gcdump collect --dsrouter android" + dq + " command or the standalone " + dq + "dotnet-dsrouter android" + dq + " finer-control router"
            if route_mode and route_mode.group(1) == "android":
                collect_mode = re.search(r"--dsrouter\s+(\S+)", q)
                assert collect_mode and collect_mode.group(1) == "android", "collect must reuse the SAME self-managing --dsrouter android mode route established"
                assert "after-navigation.gcdump" in r and "after-navigation.gcdump" in q
            else:
                assert "--dsrouter" not in q, "collect must attach to the already-started standalone router by PID (dotnet-gcdump collect -p <PID>), not also start a second self-managing --dsrouter route"
                assert "after-navigation.gcdump" in q
                # "--process-id" is the exact long-form synonym "-p" documented by
                # "dotnet-gcdump collect --help" (confirmed against the installed
                # 10.0.750501 CLI), so a plan spelling it out in full must be
                # accepted on equal footing with the short flag.
                assert re.search(r"dotnet-gcdump\s+collect\b", q) and re.search(r"(?:^|\s)(?:-p|--process-id)\s+\S", q), "a standalone-router collect must attach via " + dq + "dotnet-gcdump collect -p <PID>" + dq + " (or its " + dq + "--process-id" + dq + " synonym), correlated to the router this plan itself started"
                pid_match = re.search(r"(?:-p|--process-id)\s+(\S+)", q)
                assert pid_match and not pid_match.group(1).strip(dq + sq).isdigit(), "the attach PID must come from a captured, correlated value (e.g. a variable set from " + dq + "dotnet-gcdump ps" + dq + " or the printed router PID), not a hardcoded guess"
                pid_var = pid_match.group(1).strip(dq + sq).lstrip("$").strip("{}")
                # The device-app PID (2841) already banned above as "identity
                # information, not a host PID" is itself a correlated-looking
                # value if blindly reused; the PID this standalone attach needs is
                # the LOCAL process id "dotnet-gcdump ps" reports for the device
                # connection once "dotnet-dsrouter android" has it, not a bare
                # first/last listing row (which carries no numeric-extraction
                # signal) and not a row for an unrelated process (which carries
                # no correlation to the catalog app this plan itself connected).
                pid_capture = re.search(re.escape(pid_var) + r"\s*=\s*\$\(([^()]*dotnet-gcdump\s+ps\b[^()]*)\)", q)
                assert pid_capture, "the attach PID variable must be assigned from a " + dq + "dotnet-gcdump ps" + dq + " command substitution in this same collect text, not left unset"
                pid_capture_body = pid_capture.group(1)
                # Confirmed against the installed 10.0.750501 CLI on this
                # fixture macOS host: for an Android router connection,
                # "dotnet-gcdump ps" lists the ROUTER process itself (e.g.
                # by its "dotnet-dsrouter"/"dotnet-gcdump" process name),
                # never the connected device package name -- requiring
                # "com.example.catalog" here would reject every real plan
                # and only reward a filter that always returns an empty
                # PID. Accept either a package-style filter (harmless if a
                # future tool version ever does list it) or a correlation
                # to the router process itself; the selected device/app
                # connection is already verified separately via the
                # required ANDROID_SERIAL route binding checked below.
                assert "com.example.catalog" in pid_capture_body or re.search(r"(?i)dotnet-ds?router", pid_capture_body), "the " + dq + "dotnet-gcdump ps" + dq + " capture must be correlated to the connected router process (the real output identifies the router, not the device package) or, if filtering by package, the app itself -- not an unfiltered listing that could match an unrelated process"
                assert re.search(r"awk\s+[" + sq + dq + r"]?\{?\s*print\s+\$1\b", pid_capture_body) or re.search(r"\bcut\s+-f\s*1\b", pid_capture_body) or re.search(r"\bgrep\s+-oE?\s+[" + sq + dq + r"]?\^?\\?\[0-9", pid_capture_body), "the " + dq + "dotnet-gcdump ps" + dq + " capture must be narrowed to a single numeric field (e.g. awk " + sq + "{print $1}" + sq + ", cut -f1, or grep -oE), not a bare/unfiltered row"
                stop_word_re = re.compile(r"(?i)\b(stop|kill|terminate|pkill)\b")
                def real_stop_text(text):
                    # A clause whose own command word is itself just echo/printf
                    # never actually stops anything -- it only prints a stop/kill
                    # word (or the router name) as a literal argument, so such
                    # clauses must be excluded before checking for a real
                    # stop/kill/terminate/pkill invocation.
                    for cl in re.split(r";|&&|\|\||&|\n", text):
                        cl = cl.strip()
                        if not cl:
                            continue
                        words = cl.split()
                        if words and words[0] in ("echo", "printf"):
                            continue
                        if stop_word_re.search(cl) or "dotnet-dsrouter" in cl:
                            return True
                    return False
                assert real_stop_text(x), "a standalone finer-control router is a separate long-lived process that --dsrouter android never starts -- cleanup must actually stop it (e.g. kill/pkill), not merely describe or echo doing so, unlike the self-managing route which tears itself down automatically"
                # Each commands-array entry is its OWN independent shell
                # invocation (see resolves() below): a plain "$VAR" or its braced form
                # reference naming a value assigned only in route/collect
                # own shell-local state (e.g. "ROUTER_PID=$!") is simply
                # unset by the time cleanup separate invocation runs, no
                # matter which entry assigned that same name -- referencing
                # it there can never actually recover the real router
                # identity, so it is always rejected here, fail-closed.
                # Genuine cross-entry recovery instead needs a value that
                # crosses shell-process boundaries on its own, e.g. reading
                # back a file route itself wrote ("$(cat FILE)") or matching
                # the router by its own command-line ("pkill -f PATTERN").
                bare_var_ref = re.search(r"\b(?:stop|kill|terminate)\s+\$\{?(\w+)\}?\b", x, re.IGNORECASE)
                assert not bare_var_ref, "cleanup stops the router via a bare $VAR reference, but each commands-array entry is an independent shell invocation -- a value assigned only in route/collect own shell-local state never reaches cleanup separate invocation; recover the router identity in a way that actually crosses shell boundaries instead, e.g. " + dq + "kill " + chr(92) + dq + "$(cat FILE)" + chr(92) + dq + dq + " after route persists it with " + dq + "> FILE" + dq + ", or " + dq + "pkill -f PATTERN" + dq
            assert "dotnet-gcdump collect" in q and "--timeout" in q
            assert "dotnet-gcdump report" in v and "after-navigation.gcdump" in v and "-p " not in v and "|| true" not in v and "|| :" not in v
            a = r + q + v + x
            did = p["device_id"]
            
            def split_clauses(text):
                # Split into the top-level clauses real POSIX sequencing
                # operators (";", "&&", "||", "&", newline) actually
                # delimit, skipping any that are nested inside quotes or a
                # "(" ... ")" subshell, and record which operator (if any)
                # precedes each clause. ";"/"&"/newline run unconditionally
                # in textual sequence, so state from those clauses still
                # follows left-to-right order; a clause reached only via
                # "&&" or "||" runs or does not run depending on a prior
                # exit status this static check cannot know, so its own
                # assignments must not be trusted as having actually taken
                # effect -- a real command could place a decoy assignment on
                # the unreached side of a short-circuit (for example "true
                # || export ANDROID_SERIAL=WRONG_BUT_UNREACHED") to make a
                # textual walk see an assignment that a real shell never
                # executes.
                clauses, cur, depth, quote, sep = [], [], 0, None, None
                i, n = 0, len(text)
                while i < n:
                    c = text[i]
                    if quote:
                        cur.append(c)
                        if c == quote:
                            quote = None
                        i += 1
                        continue
                    if c in (dq, sq):
                        quote = c
                        cur.append(c)
                        i += 1
                        continue
                    if c == "(":
                        depth += 1
                        cur.append(c)
                        i += 1
                        continue
                    if c == ")":
                        depth = max(0, depth - 1)
                        cur.append(c)
                        i += 1
                        continue
                    if depth == 0:
                        if text[i:i + 2] in ("&&", "||"):
                            clauses.append((sep, "".join(cur)))
                            cur = []
                            sep = text[i:i + 2]
                            i += 2
                            continue
                        if c in (";", "&", "\n"):
                            clauses.append((sep, "".join(cur)))
                            cur = []
                            sep = c
                            i += 1
                            continue
                    cur.append(c)
                    i += 1
                clauses.append((sep, "".join(cur)))
                filtered = [(s, c.strip()) for s, c in clauses if c.strip()]
                # A trailing "&" with nothing after it backgrounds the
                # preceding clause and leaves an empty final clause that the
                # filter above would otherwise silently drop, losing the only
                # record that the real last clause was backgrounded -- a bare
                # trailing ";" (or no trailing operator at all) is still a
                # safe terminator with nothing left to run, so only "&" needs
                # to be re-attached as an empty marker entry for callers
                # (e.g. report_status_propagates) to detect.
                if clauses and clauses[-1][0] == "&" and not clauses[-1][1].strip():
                    filtered.append(("&", ""))
                return filtered
            
            assign_re = re.compile(
                r"^(export\s+)?([A-Za-z_][A-Za-z0-9_]*)="
                + r"(?:" + dq + r"([^" + dq + r"]*)" + dq
                + r"|" + sq + r"([^" + sq + r"]*)" + sq
                + r"|([^\s;&|)]+))\s*")
            
            def leading_assigns(clause):
                # Walk any number of (optionally "export"-prefixed)
                # NAME=value tokens at the start of a clause -- POSIX allows
                # several simple-command prefix assignments before the
                # command word -- and return them plus whatever command
                # text remains (empty for an assignment-only clause).
                assigns, rest = [], clause
                while True:
                    m = assign_re.match(rest)
                    if not m:
                        break
                    if m.group(3) is not None:
                        val, kind = m.group(3), "double"
                    elif m.group(4) is not None:
                        val, kind = m.group(4), "single"
                    else:
                        val, kind = m.group(5), "bare"
                    assigns.append((m.group(2), val, kind, m.group(1) is not None))
                    rest = rest[m.end():]
                return assigns, rest.strip()
            
            def resolve_value(val, kind, before_vals, clause_assigned_names):
                # A single-quoted value is never subject to $VAR expansion in
                # a real shell -- compared literally. A bare/double-quoted
                # "$NAME" reference expands against the variable state as it
                # stood strictly BEFORE this clauses own assignments. POSIX
                # itself leaves same-clause sibling prefix assignments (for
                # example "A=1 B=$A cmd") an UNSPECIFIED case (see "Simple
                # Commands" in the Shell Command Language rationale: whether
                # earlier prefix assignments are visible to later ones in
                # step 4 expansion "is unspecified"); confirmed divergent
                # real "sh -c" probes show dash, zsh and ksh resolve B to 1
                # while bash (also reachable as "sh" via POSIX mode) resolves
                # it to empty. Given that divergence this checker never
                # treats a same-clause sibling as resolvable -- it is
                # rejected by invocation_value below regardless of what any
                # one shell happens to do, since a device-serial selector
                # must not depend on non-portable, unspecified behavior --
                # so before_vals intentionally excludes this clauses own
                # assignments and an unresolved reference expands to an
                # empty string exactly like the real shells that do not see
                # it.
                # A bare/double-quoted "$NAME" reference that names a
                # variable ALSO being assigned within this SAME clause (a
                # sibling prefix, not a strictly earlier clause) is the exact
                # unspecified case above and must resolve as unresolved --
                # regardless of whether before_vals happens to already hold
                # an unrelated, earlier, correctly-established value for that
                # same name from a prior clause. Several real shells (dash,
                # zsh, ksh) would actually see the siblings own new value
                # here, not that stale earlier one, so trusting the earlier
                # value would be just as non-portable as trusting the
                # sibling.
                if kind == "single":
                    return val
                if val.startswith("$"):
                    ref = val[1:]
                    if ref in clause_assigned_names:
                        return ""
                    return before_vals.get(ref, "")
                return val
            
            def invocation_values(name, text, invocation_pattern=r"dotnet-gcdump\s+collect\b"):
                # Walk clauses in true left-to-right execution order,
                # tracking each variables resolved value and whether it has
                # ever been exported, and return a value for EVERY clause
                # that actually invokes the collector in this one text (not
                # just the last) -- an earlier wrong invocation must not be
                # masked by a later correct one overwriting a single result.
                # At each such clause, "name" resolves to: (a) that same
                # clauses own prefix assignment if present -- always
                # inherited by this one command regardless of export, since
                # POSIX prefix assignments are inherently scoped to it;
                # otherwise (b) the most recent EXPORTED separate-statement
                # assignment from an earlier clause reached only
                # UNCONDITIONALLY (by ";", "&", newline, or being the first
                # clause); otherwise the value is unset (None).
                # An assignment-only clause (no command word) persists into
                # later clauses state ONLY when it was itself reached
                # unconditionally: a clause reached solely via "&&" or "||"
                # runs or does not run depending on a prior exit status this
                # static check cannot know, so its assignment must not be
                # trusted as having actually taken effect (for example "true
                # || export ANDROID_SERIAL=WRONG_BUT_UNREACHED; <collect>"
                # never actually runs the export in a real shell, since
                # "true" already satisfies the "||").
                # A prefix attached to any OTHER command is scoped to that
                # one child process only and must not update persistent
                # state -- matching real shell variable-propagation rules.
                # A clause may be reached through an "if"/"then"/"else"/"do"
                # control keyword (the guarded forms this skill actually
                # accepts, e.g. "if <guard>; then ANDROID_SERIAL=... cmd;
                # else exit 1; fi"); strip exactly one such leading keyword
                # before looking for prefix assignments, since the keyword
                # itself is not part of the invoked commands own prefix.
                # A clause that is itself backgrounded (its OWN following
                # separator -- not the one preceding it -- is "&") runs its
                # assignments inside a child subshell that never reaches the
                # real parent shell this skill actually inherits from, so
                # that state must not persist either, even though the clause
                # ran unconditionally in textual sequence (e.g. "export
                # ANDROID_SERIAL=R58M123 & wait; <collect>" never actually
                # sets the parent shells ANDROID_SERIAL).
                keyword_re = re.compile(r"^(?:then|else|do)\s+")
                clauses = split_clauses(text)
                global_vals, global_exported, found = {}, set(), []
                for idx, (sep, clause) in enumerate(clauses):
                    following = clauses[idx + 1][0] if idx + 1 < len(clauses) else None
                    assigns, rest = leading_assigns(keyword_re.sub("", clause, count=1))
                    before_vals = dict(global_vals)
                    clause_assigned_names = {n for n, _, _, _ in assigns}
                    resolved = {
                        n: (resolve_value(v, k, before_vals, clause_assigned_names), exp)
                        for n, v, k, exp in assigns
                    }
                    if re.search(invocation_pattern, rest):
                        if name in resolved:
                            found.append(resolved[name][0])
                        elif name in global_exported:
                            found.append(global_vals.get(name))
                        else:
                            found.append(None)
                    if not rest:
                        if sep in ("&&", "||"):
                            # This assignment-only clause might or might not
                            # actually run (a prior exit status this static
                            # check cannot know decides that) -- but if it
                            # DOES run, it really does overwrite any earlier
                            # trusted value for the same name, so that
                            # earlier value can no longer be trusted either.
                            # Never persist the new value and never keep
                            # trusting the old one.
                            for n in resolved:
                                global_vals.pop(n, None)
                                global_exported.discard(n)
                        elif following != "&":
                            for n, (rv, exp) in resolved.items():
                                global_vals[n] = rv
                                if exp:
                                    global_exported.add(n)
                return found
            
            def resolves(name, commands_list, expected, invocation_pattern=r"dotnet-gcdump\s+collect\b"):
                # Each "commands" array entry is evaluated with its OWN
                # fresh state, never carried over from a prior entry: a JSON
                # array of separate command strings guarantees nothing about
                # them being pasted into one continuous shell session, so an
                # export in one entry must not be assumed to leak into the
                # next entrys invocation. Continuity WITHIN a single entrys
                # own text (its own ";"/"&&"/etc. clauses) is still a real,
                # single paste and is handled by invocation_values above.
                found_any = False
                for entry in commands_list:
                    for val in invocation_values(name, entry, invocation_pattern):
                        found_any = True
                        if val is None or val != expected:
                            return False
                return found_any
            
            def pipe_safe_report(clause):
                # Split THIS ONE clause on bare top-level "|" (not "||",
                # which split_clauses already consumed at the clause-
                # boundary level above) while still respecting quotes and
                # "(" ")" depth, and require any "dotnet-gcdump report"
                # invocation to be the LAST stage of the pipeline -- without
                # "set -o pipefail" (not assumed here) a pipelines real
                # exit status is only that of its LAST stage, so piping
                # report output into anything else (e.g. "| cat") would
                # hide a real report/parse failure behind that trailing
                # exit status of that trailing command, unrelated to report.
                segs, cur, depth, quote = [], [], 0, None
                i, n = 0, len(clause)
                while i < n:
                    ch = clause[i]
                    if quote:
                        cur.append(ch)
                        if ch == quote:
                            quote = None
                        i += 1
                        continue
                    if ch in (dq, sq):
                        quote = ch
                        cur.append(ch)
                        i += 1
                        continue
                    if ch == "(":
                        depth += 1
                        cur.append(ch)
                        i += 1
                        continue
                    if ch == ")":
                        depth = max(0, depth - 1)
                        cur.append(ch)
                        i += 1
                        continue
                    if depth == 0 and ch == "|" and clause[i:i + 2] != "||":
                        segs.append("".join(cur))
                        cur = []
                        i += 1
                        continue
                    cur.append(ch)
                    i += 1
                segs.append("".join(cur))
                if len(segs) == 1:
                    return True
                return not any(re.search(r"dotnet-gcdump\s+report\b", s) for s in segs[:-1])
            
            def report_status_propagates(validate_entries):
                # Each commands-array entry is its OWN separate shell
                # invocation with fresh state (see resolves() below) -- joining
                # every entry into one script before splitting into clauses
                # would let an unrelated LATER entry (e.g. a standalone
                # "test -s ..." sanity check submitted as its own array
                # element) look like a trailing clause that masks an EARLIER
                # entrys own, already-safe "dotnet-gcdump report" invocation,
                # even though the two entries never share a single real exit
                # status. Evaluate every entry independently instead, while
                # still catching masking WITHIN a single entrys own text.
                keyword_re = re.compile(r"^(?:then|else|do)\s+")
                leading_assigns_re = re.compile(
                    r"^(?:[A-Za-z_][A-Za-z0-9_]*=(?:" + sq + r"[^" + sq + r"]*" + sq
                    + r"|" + dq + r"[^" + dq + r"]*" + dq + r"|\S*)\s+)*"
                )
                report_head_re = re.compile(r"dotnet-gcdump\s+report\b")
                reported = False
                for entry in validate_entries:
                    clauses = split_clauses(entry)
                    for idx, (sep, clause) in enumerate(clauses):
                        bare = leading_assigns_re.sub(
                            "", keyword_re.sub("", clause.strip(), count=1))
                        # Only a clause whose OWN head command literally IS
                        # "dotnet-gcdump report" (after stripping a leading
                        # keyword/assignments) can let its real exit status
                        # propagate. Report text appearing elsewhere in the
                        # clause -- as a literal argument to "echo"/"printf",
                        # negated behind a leading "!", or nested only inside
                        # a "$(...)" command-substitution argument -- never
                        # does: "echo"/"printf" always exit 0 regardless of
                        # the wrapped text or substituted commands own
                        # status, and "!" inverts a real invocations status
                        # instead of propagating it, so neither counts.
                        if not report_head_re.match(bare):
                            continue
                        # A report invocation reached only via a
                        # preceding "||" only runs when an earlier
                        # command in the SAME entry already failed -- if
                        # that earlier command instead succeeds, report
                        # never runs at all and the entrys overall
                        # status reflects the earlier commands success,
                        # silently skipping the parse this check exists
                        # to guarantee (e.g. "test -s FILE ||
                        # dotnet-gcdump report FILE" skips the parse
                        # whenever the file is already nonempty).
                        if sep == "||":
                            return False
                        if not pipe_safe_report(bare):
                            return False
                        reported = True
                        if any(nsep not in ("&&",) for nsep, _ in clauses[idx + 1:]):
                            return False
                return reported
            
            route_invocation_pattern = r"dotnet-dsrouter\s+android\b" if standalone_router else r"dotnet-gcdump\s+collect\b"
            assert resolves("ANDROID_SERIAL", c["route"], did, route_invocation_pattern) and (standalone_router or resolves("ANDROID_SERIAL", c["collect"], did)), "route must always bind the selected device via a literal ANDROID_SERIAL prefix on the invocation itself, or a " + dq + "$VAR" + dq + " reference to a value assigned -- and, if in a separate, non-prefix statement, EXPORTED -- strictly before the invocation, UNCONDITIONALLY, within that SAME commands-array entry, in true left-to-right shell execution order: a single-quoted reference, a non-exported separate-statement assignment, an assignment reached only via " + dq + "&&" + dq + " or " + dq + "||" + dq + " (not provably executed), an assignment in a different commands-array entry, or a same-clause sibling assignment (left unspecified by POSIX itself, and divergent across real shells) never reliably reaches the invocations actual environment; the self-managing collect must bind it the same way since --dsrouter accepts no serial flag, but a standalone-router collect attaches by PID instead and is device-correlated through the router it was started against, not a serial"
            assert report_status_propagates(c["validate"]), "A trailing " + dq + ";" + dq + "/" + dq + "&" + dq + "-joined clause after dotnet-gcdump report can mask its real exit status regardless of " + dq + "|| true" + dq + "; only the report clause itself or further " + dq + "&&" + dq + "-joined clauses are accepted, and report must be reached unconditionally within its own entry (not only via a preceding " + dq + "||" + dq + ")"
            assert not any(t in a for t in ("server-server", "adb reverse", "adb -s", "setprop debug.mono.profile", "-ipcs", "-tcps", "AndroidEnableProfiler"))
            assert "0.0.0.0" not in a and "--remove-all" not in a and "-p 2841" not in a and "adb pull" not in a
            assert pathlib.Path("android-session.txt").read_text() == """Operator-supplied facts for a planning exercise; no device is attached to the eval worker.\nHost: macOS, .NET SDK 10.0.102; installed Android workload matches the project.\nProject: App.csproj, net10.0-android, Mono, Release.\nProfiling APK includes libmono-component-diagnostics_tracing.so for arm64-v8a.\nDevice: physical serial R58M123, USB debugging authorized; other serials may be present.\nPackage: com.example.catalog; device PID 2841 is identity information, not a host PID.\ndotnet-gcdump and dotnet-dsrouter: 10.0.750501, installed on host; the --dsrouter switch is present.\nNo diagnostic route is configured yet; a controlled relaunch is acceptable after operator approval.\nReserved host TCP port: 9001. Reserved host IPC path: capture-diag.sock in workspace.\nArtifact requested: after-navigation.gcdump in host workspace.\n"""
