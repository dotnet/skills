                segs, cur, depth, quote = [], [], 0, None
                i, n = 0, len(clause)
                while i < n:
                    ch = clause[i]
                    if quote:
                        cur.append(ch)
                        if ch == quote:
                            quote = None
                        i += 1
                        continue
                    if ch in (dq, sq):
                        quote = ch
                        cur.append(ch)
                        i += 1
                        continue
                    if ch == "(":
                        depth += 1
                        cur.append(ch)
                        i += 1
                        continue
                    if ch == ")":
                        depth = max(0, depth - 1)
