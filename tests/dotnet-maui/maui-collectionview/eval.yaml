name: maui-collectionview
tags:
  executionShard: medium
description: Evaluates the dotnet-maui/maui-collectionview skill
type: capability
defaults:
  timeout: 6m
  runs: 1
scoring:
  threshold: 1.0

stimuli:
  - name: Repair an invalid inventory item template
    tags:
      capability: repair-compiled-item-template
      risk: xaml-build-failure
      journey: fix-existing-list-page
    prompt: |
      InventoryPage.xaml is meant to show a changing inventory list, but its item
      template is invalid and its bindings have no compile-time checking. Edit
      only that file so the existing list keeps the same two fields and becomes
      valid, strongly typed markup.
    environment:
      files:
        - src: fixtures/repair
          dest: repair
        - src: graders/validate_fixture.py
          dest: .eval/validate_fixture.py
    golden_patch:
      path: ./references/repair-inventory.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "maui-collectionview-repair-template"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              I removed the unsupported ViewCell wrapper, kept the existing Grid and bindings, and added x:DataType to both the page and DataTemplate so the bindings are compiled. Only InventoryPage.xaml changed.
    graders:
      - type: run-command
        config:
          command: >-
            python -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/validate_fixture.py');assert
            hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='033d3d8427c456224b85b7c5de8f2860306f6ac1aedb5dd8bb79c7f6bfb04ac6';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)"
            repair repair
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: (?i)(ViewCell|x:DataType|compiled binding|template)
      - type: exit-success
      - type: prompt
        config:
          evidence:
            - trajectory
            - diff
            - golden_patch
    rubric:
      - Removed the unsupported ViewCell wrapper while preserving the item layout
      - Added compiled binding types for both the page and item template
      - Limited the edit to the requested XAML file

  - name: Preserve an already-correct catalog list
    tags:
      capability: recognize-correct-list-markup
      risk: unnecessary-xaml-churn
      journey: review-working-list-page
    prompt: |
      Review the catalog list under healthy/. It already behaves correctly in
      manual testing. Tell me whether there is a concrete correctness problem;
      if there is none, leave every file exactly as it is.
    environment:
      files:
        - src: fixtures/healthy
          dest: healthy
        - src: graders/validate_fixture.py
          dest: .eval/validate_fixture.py
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "maui-collectionview-noop"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The catalog list is already correct. The page and item template both declare compiled binding types, the changing collection is observable, the template root is a Grid rather than a ViewCell, and single selection uses a TwoWay SelectedItem binding. I found no correctness defect, so I made no changes.
    graders:
      - type: run-command
        config:
          command: >-
            python -c "import hashlib,pathlib,subprocess,sys;p=pathlib.Path('.eval/validate_fixture.py');assert
            hashlib.sha256(p.read_bytes().replace(b'\r\n',b'\n')).hexdigest()=='033d3d8427c456224b85b7c5de8f2860306f6ac1aedb5dd8bb79c7f6bfb04ac6';subprocess.run([sys.executable,str(p),*sys.argv[1:]],check=True)"
            noop healthy
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: (?i)(already correct|no (correctness )?(issue|problem|change)|leave.*unchanged)
      - type: exit-success
      - type: prompt
    rubric:
      - Recognized that the markup and collection type already satisfy the requested behavior
      - Left the complete healthy fixture tree byte-for-byte unchanged with no added files
      - Did not propose stylistic restructuring as a correctness fix

  - name: Design a compiled dynamic product list
    tags:
      capability: author-basic-data-bound-list
      risk: stale-or-unchecked-bindings
      journey: build-product-browse-page
    prompt: |
      I have a product page whose view model exposes a collection that changes
      after loading. Show the minimal XAML needed to display each product name
      and price in a vertical scrolling list with compile-time checked bindings.
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      path: ./references/compiled-dynamic-product-list.json
    graders:
      - type: output-matches
        config:
          pattern: (?i)ObservableCollection
      - type: output-matches
        config:
          pattern: (?i)(ItemsSource|DataTemplate|x:DataType)
      - type: output-not-matches
        config:
          pattern: <ViewCell
      - type: exit-success
      - type: prompt
    rubric:
      - Used an observable collection for data that changes after initial binding
      - Supplied compiled types for the page and item template
      - Used a valid view or layout as the template root

  - name: Configure a spaced three-column gallery
    tags:
      capability: configure-grid-items-layout
      risk: incorrect-gallery-layout
      journey: build-photo-gallery
    prompt: |
      Give me focused XAML for a photo gallery with three columns. Each tile
      needs an image and caption, with horizontal and vertical space between
      tiles. I do not need selection, refresh, or grouping.
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      path: ./references/spaced-three-column-gallery.json
    graders:
      - type: output-matches
        config:
          pattern: (?i)(GridItemsLayout|Span\s*=\s*"3")
      - type: output-matches
        config:
          pattern: (?i)(HorizontalItemSpacing|VerticalItemSpacing)
      - type: output-not-matches
        config:
          pattern: <ViewCell
      - type: exit-success
      - type: prompt
    rubric:
      - Configured a three-column grid with spacing in both directions
      - Included a typed item template with image and caption
      - Stayed within the requested gallery scope

  - name: Combine selection with pull to refresh
    tags:
      capability: compose-selection-and-refresh
      risk: stuck-refresh-or-stale-selection
      journey: add-list-interactions
    prompt: |
      My results page needs single selection and pull-to-refresh. Selection
      should reach the view model, and the refresh indicator must stop after the
      asynchronous reload. Show the XAML bindings and the key view-model behavior.
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      path: ./references/selection-pull-to-refresh.json
    graders:
      - type: output-matches
        config:
          pattern: (?i)(SelectionMode|SelectedItem|SelectionChangedCommand)
      - type: output-matches
        config:
          pattern: (?i)(RefreshView|IsRefreshing|RefreshCommand)
      - type: output-matches
        config:
          pattern: (?i)(finally|false|stop|reset).{0,80}IsRefreshing|IsRefreshing.{0,80}(false|stop|reset)
      - type: exit-success
      - type: prompt
    rubric:
      - Wired single selection to view-model state or a command
      - Wrapped the list in a refresh container with command and busy-state bindings
      - Ensured the refresh state is cleared after asynchronous work

  - name: Plan a ListView migration without ViewCell
    tags:
      capability: map-listview-behaviors
      risk: invalid-migration-markup
      journey: migrate-xamarin-list
    prompt: |
      We are moving a Xamarin.Forms screen that uses ListView, ViewCell,
      ItemTapped, pull-to-refresh, and separators. Map those behaviors to modern
      MAUI controls and call out anything that has no direct property equivalent.
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "maui-collectionview-listview-migration"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Move the data display to CollectionView and replace the ViewCell root because ViewCell is not supported there. Map ItemTapped to a tap gesture or selection command, and put pull-to-refresh on a surrounding RefreshView. CollectionView has no separator property, so draw the divider with a BoxView or Border inside the item template.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(CollectionView|RefreshView)
      - type: output-matches
        config:
          pattern: (?i)(ViewCell).{0,60}(not|unsupported|remove|replace)|(?:not|unsupported|remove|replace).{0,60}ViewCell
      - type: output-matches
        config:
          pattern: (?i)(separator).{0,80}(no|none|BoxView|Border)
      - type: exit-success
      - type: prompt
    rubric:
      - Replaced the old list and refresh behaviors with valid modern equivalents
      - Explained that ViewCell cannot be reused as the item template root
      - Identified that separators need template markup rather than a direct property

  - name: Choose a safe sizing strategy for uniform rows
    tags:
      capability: select-item-sizing-strategy
      risk: clipped-variable-height-items
      journey: improve-scroll-performance
    prompt: |
      Every row in my scrolling results list is the same height, and profiling
      shows repeated measurement is expensive. Show the narrow XAML change and
      explain the data conditions that would make that optimization unsafe.
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "maui-collectionview-uniform-sizing"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Set `ItemSizingStrategy="MeasureFirstItem"` on the CollectionView itself. Keep the default measurement when items have variable height from wrapping text, different templates, unloaded data, or an atypical first item, because reusing that first size can clip or stretch later rows.
    graders:
      - type: output-matches
        config:
          pattern: ItemSizingStrategy\s*=\s*"MeasureFirstItem"
      - type: output-not-matches
        config:
          pattern: <(Linear|Grid)ItemsLayout[^>]*ItemSizingStrategy
      - type: output-matches
        config:
          pattern: (?i)(variable|different|wrap|template selector|atypical).{0,80}(height|size|item)
      - type: exit-success
      - type: prompt
    rubric:
      - Put the sizing strategy on the list control rather than its layout
      - Limited the optimization to genuinely uniform item sizes
      - Warned about realistic variable-size cases

  - name: Add bounded incremental loading
    tags:
      capability: implement-incremental-loading
      risk: repeated-load-storm
      journey: extend-long-feed
    prompt: |
      My feed should request another page when the user nears the end. Describe
      the XAML and view-model guards needed so one threshold crossing cannot
      start overlapping requests or append items from a worker thread.
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "maui-collectionview-incremental-loading"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Set RemainingItemsThreshold and bind RemainingItemsThresholdReachedCommand to a load-more command. Guard the command with IsLoading (or a semaphore) so repeated threshold events cannot overlap, release the guard in finally, and append the returned page through MainThread or the UI Dispatcher before updating completion state.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(RemainingItemsThreshold|RemainingItemsThresholdReachedCommand)
      - type: output-matches
        config:
          pattern: (?i)(IsLoading|semaphore|guard|already loading|overlap)
      - type: output-matches
        config:
          pattern: (?i)(MainThread|UI thread|Dispatcher)
      - type: exit-success
      - type: prompt
    rubric:
      - Used the list threshold command for incremental loading
      - Prevented concurrent page requests
      - Kept collection mutation on the UI thread

  - name: Stay dormant for a carousel snapping question
    expect_activation: false
    tags:
      capability: boundary-carousel-control
      risk: incorrect-skill-activation
      journey: route-non-list-control
    prompt: |
      I have a horizontal CarouselView and want one card centered after each
      swipe. Which snap-point settings should I use? Do not change any files.
    constraints:
      reject_tools: [edit, create]
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "maui-collectionview-dormancy-carousel"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is already a `CarouselView`, so keep that control and configure its horizontal items layout:

              ```xml
              <CarouselView ItemsSource="{Binding Cards}">
                  <CarouselView.ItemsLayout>
                      <LinearItemsLayout Orientation="Horizontal"
                                         SnapPointsType="MandatorySingle"
                                         SnapPointsAlignment="Center" />
                  </CarouselView.ItemsLayout>
              </CarouselView>
              ```

              `MandatorySingle` advances one snap point per swipe, and `Center` places the selected card at the viewport center. This does not require a list-control migration or any file change.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(CarouselView|snap)
      - type: output-matches
        config:
          pattern: (?i)(MandatorySingle|Center)
      - type: exit-success
      - type: prompt
    rubric:
      - The list-control workflow stayed dormant for a CarouselView-specific request
      - Answered the CarouselView-specific snapping question
      - Did not rewrite the control as a different list control
      - Made no file changes
