scenarios:
  - name: "Detect and replace deprecated Device class APIs"
    prompt: |
      I have this code in my .NET MAUI app targeting net10.0. Can you review it
      and fix any deprecated APIs?

      ```csharp
      public class SettingsViewModel
      {
          public void CheckPlatform()
          {
              if (Device.RuntimePlatform == Device.Android)
              {
                  Device.BeginInvokeOnMainThread(() =>
                  {
                      StatusMessage = "Running on Android";
                  });
              }

              Device.StartTimer(TimeSpan.FromSeconds(5), () =>
              {
                  RefreshData();
                  return true;
              });
          }

          public async Task OpenLink()
          {
              Device.OpenUri(new Uri("https://learn.microsoft.com"));
          }
      }
      ```
    assertions:
      - type: "output_contains"
        value: "DeviceInfo.Platform"
      - type: "output_contains"
        value: "MainThread.BeginInvokeOnMainThread"
      - type: "output_not_contains"
        value: "Device.BeginInvokeOnMainThread"
      - type: "output_matches"
        pattern: "(?i)Launcher|OpenAsync"
      - type: "output_matches"
        pattern: "(?i)Dispatcher|PeriodicTimer"
    rubric:
      - "Replaces Device.RuntimePlatform with DeviceInfo.Platform"
      - "Replaces Device.BeginInvokeOnMainThread with MainThread.BeginInvokeOnMainThread"
      - "Replaces Device.StartTimer with Dispatcher.StartTimer or PeriodicTimer"
      - "Replaces Device.OpenUri with Launcher.OpenAsync"
      - "Explains that the entire Device class is deprecated in .NET MAUI"
    timeout: 120

  - name: "Fix deprecated animation methods for .NET 10"
    prompt: |
      I'm upgrading my .NET MAUI app from .NET 9 to .NET 10. I have animation
      code using FadeTo, RotateTo, and TranslateTo. The compiler shows warnings.
      What changed and how do I fix it?
    assertions:
      - type: "output_contains"
        value: "FadeToAsync"
      - type: "output_matches"
        pattern: "RotateToAsync|ScaleToAsync|TranslateToAsync"
    rubric:
      - "Identifies that animation extension methods were renamed to *Async in .NET 10"
      - "Provides the correct async replacement names (FadeToAsync, RotateToAsync, TranslateToAsync, ScaleToAsync)"
      - "Mentions RelRotateToAsync, RelScaleToAsync, or LayoutToAsync as part of the same pattern"
    timeout: 120

  - name: "Prevent Xamarin.Forms namespace usage"
    prompt: |
      I'm following an older tutorial to build a .NET MAUI app. The tutorial says
      to add 'using Xamarin.Forms' and use DependencyService to register platform
      services. How do I do this in my MAUI project?
    assertions:
      - type: "output_not_contains"
        value: "using Xamarin.Forms"
      - type: "output_matches"
        pattern: "(?i)constructor injection|IServiceProvider|builder\\.Services"
    rubric:
      - "Explains that Xamarin.Forms namespaces do not exist in .NET MAUI"
      - "Replaces DependencyService with constructor injection via IServiceProvider"
      - "Shows how to register services in MauiProgram.cs using builder.Services"
      - "Does not suggest using Compatibility namespace for new code"
    timeout: 120

  - name: "Detect project TFM before generating code"
    prompt: |
      I have a .NET MAUI project. Here is my csproj:

      ```xml
      <Project Sdk="Microsoft.NET.Sdk">
        <PropertyGroup>
          <TargetFrameworks>net8.0-android;net8.0-ios</TargetFrameworks>
          <UseMaui>true</UseMaui>
        </PropertyGroup>
        <ItemGroup>
          <PackageReference Include="CommunityToolkit.Maui" Version="5.3.0" />
          <PackageReference Include="CommunityToolkit.Mvvm" Version="8.2.1" />
        </ItemGroup>
      </Project>
      ```

      I want to add a page that displays an alert and fades in an image. Show me
      the code.
    assertions:
      - type: "output_contains"
        value: "DisplayAlert"
      - type: "output_contains"
        value: "FadeTo"
      - type: "output_not_contains"
        value: "DisplayAlertAsync"
      - type: "output_not_contains"
        value: "FadeToAsync"
    rubric:
      - "Uses net8.0-compatible APIs (not .NET 10 APIs like DisplayAlertAsync or FadeToAsync)"
      - "Recognizes the project targets .NET 8, not .NET 10"
      - "Does not suggest APIs that require CommunityToolkit.Maui v11+ (project uses v5.3.0)"
      - "Uses the correct method names for the detected .NET version"
    timeout: 120

  - name: "Replace MessagingCenter with WeakReferenceMessenger"
    prompt: |
      My .NET MAUI 10 app uses MessagingCenter.Send and MessagingCenter.Subscribe
      for communication between ViewModels. The compiler shows it's deprecated.
      How do I replace it?
    assertions:
      - type: "output_contains"
        value: "WeakReferenceMessenger"
      - type: "output_matches"
        pattern: "CommunityToolkit\\.Mvvm|CommunityToolkit\\.Mvvm\\.Messaging"
    rubric:
      - "Recommends WeakReferenceMessenger from CommunityToolkit.Mvvm as the replacement"
      - "Shows the Send/Register pattern with the new messenger API"
      - "Explains that MessagingCenter was made internal in .NET MAUI 10"
      - "Mentions the CommunityToolkit.Mvvm NuGet package if not already referenced"
    timeout: 120
