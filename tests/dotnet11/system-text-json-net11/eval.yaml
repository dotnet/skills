      - Did not reward redundant verifier commands over the required successful dotnet run

  - name: Preserve an already-correct .NET 11 implementation
    tags:
      capability: correct-implementation-no-op
      risk: unnecessary-code-churn
      journey: verify-existing-json-implementation
    prompt: |
      Review the `app` project for its use of the new .NET 11 System.Text.Json
      APIs. If it already uses the right property policy, dictionary-key policy,
      typed metadata API, and resolver, do not change any file. Run it and report
      whether a change was needed.
    environment:
      files:
        - src: fixtures/already-correct
          dest: app
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-already-correct"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I will inspect the existing configuration and run it without editing files.
            tool_calls:
              - tool_call_id: inspect_1
                function_name: bash
                arguments: { command: "cat app/Program.cs && cat app/App.csproj" }
              - tool_call_id: run_1
                function_name: bash
                arguments: { command: "dotnet run --project app/App.csproj" }
            observation:
              results:
                - source_call_id: inspect_1
                  content: |-
                    <TargetFramework>net11.0</TargetFramework>
                    PropertyNamingPolicy = JsonNamingPolicy.PascalCase,
                    DictionaryKeyPolicy = JsonNamingPolicy.PascalCase,
                    TypeInfoResolver = new DefaultJsonTypeInfoResolver()
                    JsonTypeInfo<Person> typeInfo = options.GetTypeInfo<Person>();
                - source_call_id: run_1
                  content: "{\"Name\":\"Jane\",\"Age\":30,\"Stats\":{\"PendingOrders\":2}}\nProcess exited with code 0."
          - step_id: 2
            source: agent
            message: |-
              The project is already correct, so no files need changes. It uses the .NET 11 PascalCase policy for properties and dictionary keys, configures a default metadata resolver, and calls the generic metadata API without a cast. The validation run completed with `{"Name":"Jane","Age":30,"Stats":{"PendingOrders":2}}`.
