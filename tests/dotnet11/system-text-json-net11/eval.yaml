name: system-text-json-net11
description: Evaluates the dotnet11/system-text-json-net11 skill
type: capability
tags:
  executionShard: dotnet11
defaults:
  timeout: 8m
  runs: 1
environment:
  files:
    - src: graders/verify.mjs
      dest: .eval/verify.mjs
    - src: fixtures/NuGet.Config
      dest: NuGet.Config
    - src: fixtures/global.json
      dest: global.json
stimuli:
  - name: Replace a custom PascalCase policy with the .NET 11 API
    tags:
      capability: pascal-case-property-names
      risk: unnecessary-custom-serialization-code
      journey: modernize-json-serialization
    prompt: |
      This `app` project targets .NET 11 and already prints the JSON shape I need,
      but it carries a custom naming-policy class only to capitalize property
      names. Simplify that workaround, keep the same output, and run the project.
    environment:
      files:
        - src: fixtures/pascal-properties
          dest: app
    golden_patch:
      path: references/pascal-properties.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-pascal-properties"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I will replace the custom policy and run the project.
            tool_calls:
              - tool_call_id: edit_1
                function_name: apply_patch
                arguments: { path: app/Program.cs }
              - tool_call_id: run_1
                function_name: bash
                arguments: { command: "dotnet run --project app/App.csproj" }
            observation:
              results:
                - source_call_id: edit_1
                  content: Replaced the custom naming policy with JsonNamingPolicy.PascalCase.
                - source_call_id: run_1
                  content: "{\"Name\":\"Jane\",\"Age\":30}\nProcess exited with code 0."
          - step_id: 2
            source: agent
            message: "Replaced the custom naming-policy class with `JsonNamingPolicy.PascalCase`. The project ran successfully and printed `{\"Name\":\"Jane\",\"Age\":30}`."
    graders:
      - type: run-command
        config:
          command: node .eval/verify.mjs pascal-properties app
          expected_exit_code: 0
          stdout_matches: PASS pascal-properties
          timeout: 3m
      - type: prompt
    rubric:
      - Replaced the custom naming-policy implementation with the .NET 11 built-in PascalCase policy
      - Preserved the requested serialized property names and produced working code
      - Reported the validation result without claiming behavior that was not observed

  - name: Remove per-member casing attributes during deserialization
    tags:
      capability: pascal-case-deserialization
      risk: repetitive-member-annotations
      journey: simplify-json-contract
    prompt: |
      In `app`, the record uses an attribute on every positional member so
      PascalCase JSON can bind to lowercase C# member names. This project is now
      on .NET 11. Remove the repetitive workaround without renaming the members,
      and run the app to prove the values still deserialize.
    environment:
      files:
        - src: fixtures/pascal-deserialization
          dest: app
    golden_patch:
      path: references/pascal-deserialization.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-pascal-deserialization"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I will remove the member attributes, configure one policy, and run the project.
            tool_calls:
              - tool_call_id: edit_1
                function_name: apply_patch
                arguments: { path: app/Program.cs }
              - tool_call_id: run_1
                function_name: bash
                arguments: { command: "dotnet run --project app/App.csproj" }
            observation:
              results:
                - source_call_id: edit_1
                  content: Removed JsonPropertyName attributes and added JsonNamingPolicy.PascalCase.
                - source_call_id: run_1
                  content: "Jane|30\nProcess exited with code 0."
          - step_id: 2
            source: agent
            message: "Removed the per-member attributes and configured `JsonNamingPolicy.PascalCase` once on the serializer options. The app ran successfully and printed `Jane|30`."
    graders:
      - type: run-command
        config:
          command: node .eval/verify.mjs pascal-deserialization app
          expected_exit_code: 0
          stdout_matches: PASS pascal-deserialization
          timeout: 3m
      - type: prompt
    rubric:
      - Removed the per-member JSON-name attributes and configured one built-in PascalCase policy
      - Preserved successful deserialization of both values
      - Kept the change focused on the JSON contract instead of renaming the record members

  - name: Configure PascalCase dictionary keys without pre-transforming data
    tags:
      capability: pascal-case-dictionary-keys
      risk: data-copy-and-key-rewrite
      journey: serialize-dictionary-contract
    prompt: |
      The `app` project currently creates a second dictionary only to capitalize
      its keys before serialization. The project now targets .NET 11. Remove that
      data rewrite while preserving the JSON contract, and run the app.
    environment:
      files:
        - src: fixtures/pascal-dictionary
          dest: app
    golden_patch:
      path: references/pascal-dictionary.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-pascal-dictionary"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I will remove the copied dictionary and validate the dictionary-key policy.
            tool_calls:
              - tool_call_id: edit_1
                function_name: apply_patch
                arguments: { path: app/Program.cs }
              - tool_call_id: run_1
                function_name: bash
                arguments: { command: "dotnet run --project app/App.csproj" }
            observation:
              results:
                - source_call_id: edit_1
                  content: Configured DictionaryKeyPolicy with JsonNamingPolicy.PascalCase.
                - source_call_id: run_1
                  content: "{\"PendingOrders\":2,\"ActiveUsers\":5}\nProcess exited with code 0."
          - step_id: 2
            source: agent
            message: "Removed the manual key transformation and set `DictionaryKeyPolicy = JsonNamingPolicy.PascalCase`. The app ran successfully and printed both PascalCase keys."
    graders:
      - type: run-command
        config:
          command: node .eval/verify.mjs pascal-dictionary app
          expected_exit_code: 0
          stdout_matches: PASS pascal-dictionary
          timeout: 3m
      # The runtime grader compiles the new .NET 11 API and checks exact output.
      # General-purpose judges can carry stale framework API inventories.
    rubric:
      - Applied the built-in PascalCase policy specifically to dictionary keys
      - Removed the manual key-copy or string-casing workaround
      - Preserved both expected JSON keys in executable output

  - name: Fix nested dictionary keys without changing property casing
    tags:
      capability: nested-dictionary-key-policy
      risk: property-policy-misapplied-to-dictionary-keys
      journey: troubleshoot-mixed-json-casing
    prompt: |
      In this .NET 11 `app`, object property names are already PascalCase, but
      keys inside the nested `stats` dictionary still come out as
      `pendingOrders`. Fix only the dictionary-key behavior and run the project.
    environment:
      files:
        - src: fixtures/nested-dictionary
          dest: app
    golden_patch:
      path: references/nested-dictionary.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-nested-dictionary"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I will correct the dictionary-key configuration and run the project.
            tool_calls:
              - tool_call_id: edit_1
                function_name: apply_patch
                arguments: { path: app/Program.cs }
              - tool_call_id: run_1
                function_name: bash
                arguments: { command: "dotnet run --project app/App.csproj" }
            observation:
              results:
                - source_call_id: edit_1
                  content: Added DictionaryKeyPolicy without changing PropertyNamingPolicy.
                - source_call_id: run_1
                  content: "{\"Stats\":{\"PendingOrders\":2}}\nProcess exited with code 0."
          - step_id: 2
            source: agent
            message: "Kept the property policy and added `DictionaryKeyPolicy = JsonNamingPolicy.PascalCase`. The run printed `{\"Stats\":{\"PendingOrders\":2}}`."
    graders:
      - type: run-command
        config:
          command: node .eval/verify.mjs nested-dictionary app
          expected_exit_code: 0
          stdout_matches: PASS nested-dictionary
          timeout: 3m
      # The verifier distinguishes property and dictionary-key configuration.
    rubric:
      - Added the separate dictionary-key policy while preserving the existing property policy
      - Corrected the nested dictionary key without pre-transforming data
      - Demonstrated both casing levels through successful execution

  - name: Retrieve typed metadata without a non-generic cast
    tags:
      capability: typed-json-metadata
      risk: invalid-runtime-metadata-cast
      journey: modernize-metadata-access
    prompt: |
      `app` targets .NET 11, but it still calls the non-generic metadata API and
      casts the result before serializing an `Order`. Remove the cast without
      weakening the variable type, keep the resolver configuration, and run the
      project.
    environment:
      files:
        - src: fixtures/typed-metadata
          dest: app
    golden_patch:
      path: references/typed-metadata.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-typed-metadata"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I will replace the cast with typed metadata access and run the project.
            tool_calls:
              - tool_call_id: edit_1
                function_name: apply_patch
                arguments: { path: app/Program.cs }
              - tool_call_id: run_1
                function_name: bash
                arguments: { command: "dotnet run --project app/App.csproj" }
            observation:
              results:
                - source_call_id: edit_1
                  content: Replaced the non-generic lookup and cast with options.GetTypeInfo<Order>().
                - source_call_id: run_1
                  content: "{\"Id\":42,\"Total\":19.95}\nProcess exited with code 0."
          - step_id: 2
            source: agent
            message: "The code now retrieves `JsonTypeInfo<Order>` through `GetTypeInfo<Order>()` and keeps the configured resolver. The project ran successfully and serialized the order without a cast."
    graders:
      - type: run-command
        config:
          command: node .eval/verify.mjs typed-metadata app
          expected_exit_code: 0
          stdout_matches: PASS typed-metadata
          timeout: 3m
      # The compiler/runtime verifier is authoritative for this .NET 11 API;
      # general-purpose judges can retain the earlier non-generic API inventory.
    rubric:
      - Replaced the non-generic lookup and cast with strongly typed metadata access
      - Retained a resolver that makes metadata available at runtime
      - Used the typed metadata in successful serialization

  - name: Probe source-generated metadata without exception control flow
    tags:
      capability: no-throw-metadata-probe
      risk: exceptions-used-for-expected-control-flow
      journey: branch-on-metadata-availability
    prompt: |
      This source-generated `app` checks one covered message type and one
      uncovered type, but it uses exceptions to detect missing metadata. On
      .NET 11, replace exception control flow with a direct availability check,
      handle both results explicitly, and run the project.
    environment:
      files:
        - src: fixtures/metadata-probe
          dest: app
    golden_patch:
      path: references/metadata-probe.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-metadata-probe"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I will replace exception control flow with the no-throw probe and run both branches.
            tool_calls:
              - tool_call_id: edit_1
                function_name: apply_patch
                arguments: { path: app/Program.cs }
              - tool_call_id: run_1
                function_name: bash
                arguments: { command: "dotnet run --project app/App.csproj" }
            observation:
              results:
                - source_call_id: edit_1
                  content: Used TryGetTypeInfo<T> for both message types and removed try/catch.
                - source_call_id: run_1
                  content: "Known=True\nUnknown=False\nProcess exited with code 0."
          - step_id: 2
            source: agent
            message: "Replaced the exception-based check with `TryGetTypeInfo<T>` for both types. The app ran successfully and printed `Known=True` and `Unknown=False`."
    graders:
      - type: run-command
        config:
          command: node .eval/verify.mjs metadata-probe app
          expected_exit_code: 0
          stdout_matches: PASS metadata-probe
          timeout: 3m
      - type: prompt
    rubric:
      - Used the generic no-throw metadata probe for both covered and uncovered types
      - Removed exception handling used only to detect metadata availability
      - Demonstrated the true and false branches with executable output

  - name: Make a .NET 11 file-based JSON app runnable
    tags:
      capability: file-based-json-app
      risk: reflection-disabled-runtime-failure
      journey: repair-file-based-app
    prompt: |
      `app.cs` is a .NET 11 file-based app. It should serialize lowercase record
      members as PascalCase JSON, but `dotnet run app.cs` currently fails. The
      file also carries a custom casing policy. Simplify the code, fix the
      runtime failure, and run it.
    environment:
      files:
        - src: fixtures/file-based-app/app.cs
          dest: app.cs
    golden_patch:
      path: references/file-based-app.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-file-based-app"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: I will use the built-in policy, add an explicit resolver, and run the file.
            tool_calls:
              - tool_call_id: edit_1
                function_name: apply_patch
                arguments: { path: app.cs }
              - tool_call_id: run_1
                function_name: bash
                arguments: { command: "dotnet run app.cs" }
            observation:
              results:
                - source_call_id: edit_1
                  content: Added JsonNamingPolicy.PascalCase and DefaultJsonTypeInfoResolver.
                - source_call_id: run_1
                  content: "{\"Name\":\"Jane\",\"Age\":30}\nProcess exited with code 0."
          - step_id: 2
            source: agent
            message: "Replaced the custom policy with `JsonNamingPolicy.PascalCase` and added `DefaultJsonTypeInfoResolver` for the file-based app. `dotnet run app.cs` completed successfully and printed `{\"Name\":\"Jane\",\"Age\":30}`."
    graders:
      - type: run-command
        config:
          command: node .eval/verify.mjs file-based-app .
          expected_exit_code: 0
          stdout_matches: PASS file-based-app
          timeout: 3m
      - type: prompt
    rubric:
      - Used the built-in PascalCase policy instead of a custom naming-policy class
      - Configured an explicit metadata resolver required by System.Text.Json in a file-based app
      - Produced the requested JSON through a successful file-based execution
      - Did not reward redundant verifier commands over the required successful dotnet run

  - name: Replace a custom enum naming policy
    tags:
      capability: pascal-case-enum-values
      risk: duplicate-enum-naming-code
      journey: simplify-string-enum-serialization
    prompt: |
      The `app` project targets .NET 11 and serializes enum values as strings.
