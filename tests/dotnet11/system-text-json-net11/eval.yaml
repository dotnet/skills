    environment:
      files:
        - src: fixtures/empty-options-probe
          dest: app
    golden_patch:
      path: references/empty-options-probe.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-empty-options-probe"
