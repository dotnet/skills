  - name: "Non-activation: explain the .NET 10 PascalCase boundary"
    expect_activation: false
    tags:
      capability: dormancy-earlier-framework-boundary
      risk: unavailable-api-recommendation
      journey: implement-pascal-case-on-net10
    prompt: |
      I must stay on `net10.0`, but I need System.Text.Json to serialize lowercase
      member names as PascalCase. Is there a built-in PascalCase policy in this
      target, and what is the smallest compatible approach?
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "system-text-json-net11-net10-boundary"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              `net10.0` does not provide `JsonNamingPolicy.PascalCase`. Keep the target and use a small custom `JsonNamingPolicy` implementation, or explicit `JsonPropertyName` attributes when the contract is limited. Do not reference the .NET 11-only property in a .NET 10 build.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(not (available|provided)|does not (have|provide)|\.NET 11)
      - type: output-matches
        config:
          pattern: (?i)(custom.*JsonNamingPolicy|JsonPropertyName)
      - type: output-not-matches
        config:
          pattern: (?im)^\s*(?:\w+\.)?PropertyNamingPolicy\s*=\s*JsonNamingPolicy\.PascalCase
      - type: output-not-matches
        config:
          pattern: JsonStringEnumConverter\s*\(\s*JsonNamingPolicy\.PascalCase
      # This version boundary is compiler-proven locally (CS0117 on net10.0);
      # avoid a model judge whose API-version memory can be stale.
    rubric:
      - Correctly stated that the built-in PascalCase policy is unavailable on net10.0
      - Proposed a compatible fallback without changing the requested target framework
      - Did not present the .NET 11-only API as compilable on .NET 10
      - The specialized .NET 11 guidance stayed dormant at the earlier framework boundary
