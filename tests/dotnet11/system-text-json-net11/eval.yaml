      - Reused the .NET 11 built-in PascalCase policy for string enum values
      - Removed the custom naming-policy implementation
      - Preserved the exact enum JSON through successful execution

  - name: Deserialize with typed metadata without a cast
    tags:
      capability: typed-json-deserialization-metadata
      risk: invalid-deserialization-metadata-cast
      journey: modernize-typed-deserialization
    prompt: |
      In the .NET 11 `app`, deserialization still gets metadata through the
