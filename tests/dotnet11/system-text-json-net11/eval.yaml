    rubric:
      - Replaced the non-generic lookup and cast with typed metadata access
      - Preserved the configured resolver and used the typed metadata for deserialization
      - Demonstrated the deserialized values through successful execution

  - name: Probe empty options without catching metadata exceptions
    tags:
      capability: empty-resolver-metadata-probe
      risk: expected-metadata-miss-throws
      journey: test-unconfigured-metadata-availability
    prompt: |
      This .NET 11 `app` intentionally leaves `JsonSerializerOptions`
      unconfigured and needs to report whether metadata is available. It
      currently catches an exception for the expected miss. Replace that control
