    rubric:
      - Used the .NET 11 no-throw generic metadata check for unconfigured options
      - Removed exception handling for the expected unavailable-metadata result
      - Demonstrated the false result through successful execution

  - name: Serialize optional payloads only when metadata is available
    tags:
      capability: conditional-serialization-metadata
      risk: optional-payload-probe-throws
      journey: serialize-supported-plugin-payloads
    prompt: |
      This .NET 11 `app` receives optional plugin payloads. It should serialize
