            source: agent
            message: |
              ```csharp
              using System.Diagnostics;
              using System.IO;
              using Microsoft.Win32.SafeHandles;

              using SafeFileHandle output = File.OpenHandle("artifact.bin", FileMode.Create, FileAccess.Write);
              ProcessStartInfo info = new("encoder")
