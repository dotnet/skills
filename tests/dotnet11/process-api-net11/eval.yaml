name: process-api-net11
description: Evaluates the dotnet11/process-api-net11 skill
type: capability
defaults:
  timeout: 5m
stimuli:
  # --- Stimulus 1: Run and capture output in .NET 11 ---
  - name: Run and capture process output in .NET 11
    prompt: |
      I'm writing a .NET 11 command-line tool that needs to run an external CLI (e.g. 'git status') and capture both stdout and stderr.
      I want to make sure I don't run into any OS pipe deadlock issues, and I want to write it in the cleanest way possible using new .NET 11 features.
      Show me the C# program and the `.csproj` XML targeting `net11.0` for this tool. Print both in your response.
    tags:
      capability: capture-process-output
      risk: redirected-stream-deadlock
      journey: run-external-cli
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-capture
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              `Program.cs`:
              ```csharp
              using System;
              using System.Diagnostics;

              ProcessTextOutput output = Process.RunAndCaptureText("git", ["status"]);
              Console.Out.Write(output.StandardOutput);
              Console.Error.Write(output.StandardError);
              Environment.ExitCode = output.ExitStatus.ExitCode;
              ```

              `Capture.csproj`:
              ```xml
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <OutputType>Exe</OutputType>
                  <TargetFramework>net11.0</TargetFramework>
                </PropertyGroup>
              </Project>
              ```

              This API drains both streams together. No manual event subscriptions are needed.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: Process\.RunAndCaptureText(Async)?
      - type: output-matches
        config:
          pattern: net11\.0
      - type: output-matches
        config:
          pattern: \.StandardOutput\b
      - type: output-matches
        config:
          pattern: \.StandardError\b
      - type: output-not-matches
        config:
          pattern: \.\s*Begin(Output|Error)ReadLine\s*\(|\.\s*(Output|Error)DataReceived\s*\+=
      - type: prompt
    rubric:
      - Uses the new built-in Process.RunAndCaptureText or Process.RunAndCaptureTextAsync static method
      - Targets net11.0 in the project file
      - Captures both streams without event-callback plumbing; if using the ProcessStartInfo overload, enables both output and error redirection

  # --- Stimulus 2: Auto-teardown child processes on parent exit ---
  - name: Auto-teardown child processes on parent exit in .NET 11
    prompt: |
      In a .NET 11 application, I need to spawn a background daemon process.
      To prevent orphan processes, I want to ensure that this daemon process is automatically killed by the operating system if my main parent process crashes or exits.
      How do I configure this in .NET 11 using ProcessStartInfo? Show me a minimal example, and show the `.csproj` XML targeting `net11.0` in your response.
    tags:
      capability: child-process-lifetime
      risk: orphaned-child-process
      journey: supervise-background-daemon
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-teardown
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Replace `daemon` with the executable to supervise.

              `Program.cs`:
              ```csharp
              using System;
              using System.Diagnostics;

              var info = new ProcessStartInfo("daemon") { UseShellExecute = false };
              if (OperatingSystem.IsWindows() || OperatingSystem.IsLinux() || OperatingSystem.IsAndroid())
              {
                  info.KillOnParentExit = true;
              }
              else
              {
                  throw new PlatformNotSupportedException("Automatic teardown is not supported here.");
              }

              using Process child = Process.Start(info)
                  ?? throw new InvalidOperationException("The child did not start.");
              Console.WriteLine("Press Enter to exit the parent.");
              Console.ReadLine();
              ```

              `Supervisor.csproj`:
              ```xml
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <OutputType>Exe</OutputType>
                  <TargetFramework>net11.0</TargetFramework>
                </PropertyGroup>
              </Project>
              ```

              The property assignment itself is guarded. Unsupported platforms fail before any child starts.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: 'KillOnParentExit\s*=\s*true\b\s*(?=[,;}]|//|\r?\n|$)'
      - type: output-matches
        config:
          pattern: net11\.0
      - type: prompt
    rubric:
      - Enables KillOnParentExit on ProcessStartInfo on a supported platform
      - Guards the property assignment in cross-platform code and does not start an unprotected child on an unsupported platform when automatic teardown is required
      - Targets net11.0

  # --- Stimulus 3: deadlock-free full read via instance ReadAllText (tuple return) ---
  - name: Deadlock-free full-output read via instance ReadAllText in .NET 11
    prompt: |
      In a .NET 11 app I start a child process myself with `Process.Start(...)` because I
      need to configure `ProcessStartInfo` first. After it starts I want to read its ENTIRE
      standard output AND standard error to completion, without the classic deadlock where
      one buffer fills while I'm draining the other. Give me the simplest first-party .NET 11
      way to get both back at once. Show a minimal program and the `net11.0` `.csproj`.
    tags:
      capability: read-complete-process-output
      risk: incorrect-tuple-return
      journey: capture-custom-process-streams
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-tuple
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              `Program.cs`:
              ```csharp
              using System;
              using System.Diagnostics;

              var info = new ProcessStartInfo("git", ["status"])
              {
                  UseShellExecute = false,
                  RedirectStandardOutput = true,
                  RedirectStandardError = true
              };
              using Process process = Process.Start(info)
                  ?? throw new InvalidOperationException("The child did not start.");
              var output = await process.ReadAllTextAsync();
              Console.Out.Write(output.StandardOutput);
              Console.Error.Write(output.StandardError);
              await process.WaitForExitAsync();
              Environment.ExitCode = process.ExitCode;
              ```

              `ReadOutput.csproj`:
              ```xml
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <OutputType>Exe</OutputType>
                  <TargetFramework>net11.0</TargetFramework>
                </PropertyGroup>
              </Project>
              ```

              The returned value is a tuple with both streams, not one string. Both streams are drained together.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: net11\.0
      - type: output-matches
        config:
          pattern: ReadAllText(Async)?\s*\(
      - type: output-matches
        config:
          pattern: \)\s*=\s*(await\s+)?\w+\.ReadAllText(Async)?\s*\(|\.(StandardOutput|Item1)\b
      - type: output-matches
        config:
          pattern: \)\s*=\s*(await\s+)?\w+\.ReadAllText(Async)?\s*\(|\.(StandardError|Item2)\b
      - type: output-not-matches
        config:
          pattern: string\s+\w+\s*=\s*(await\s+)?\w+\.ReadAllText(Async)?\s*\(
      - type: prompt
    rubric:
      - Uses the new instance method Process.ReadAllText or Process.ReadAllTextAsync
      - Uses both returned tuple elements correctly, through deconstruction or tuple member access, rather than treating the result as a single string
      - Does not fall back to manual StandardOutput.ReadToEndAsync() as the primary mechanism
      - Targets net11.0

  # --- Stimulus 4: stream tagged output lines via ReadAllLinesAsync ---
  - name: Stream tagged process output lines in .NET 11
    prompt: |
      I have a long-running child process in a .NET 11 app. As it runs I want to handle each
      output line the moment it is produced — not buffer everything to the end — and for each
      line I need to know whether it came from stdout or stderr. I want the cleanest first-party
      .NET 11 approach, with no event-callback plumbing and no deadlock risk. Show a minimal
      program and the `net11.0` `.csproj`.
    tags:
      capability: stream-tagged-process-output
      risk: lost-stream-identity
      journey: monitor-running-process
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-stream
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Replace `worker` with the long-running executable.

              `Program.cs`:
              ```csharp
              using System;
              using System.Diagnostics;
              using System.IO;

              var info = new ProcessStartInfo("worker")
              {
                  UseShellExecute = false,
                  RedirectStandardOutput = true,
                  RedirectStandardError = true
              };
              using Process process = Process.Start(info)
                  ?? throw new InvalidOperationException("The child did not start.");
              await foreach (ProcessOutputLine line in process.ReadAllLinesAsync())
              {
                  TextWriter destination = line.StandardError ? Console.Error : Console.Out;
                  destination.WriteLine(line.Content);
              }
              await process.WaitForExitAsync();
              Environment.ExitCode = process.ExitCode;
              ```

              `StreamOutput.csproj`:
              ```xml
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <OutputType>Exe</OutputType>
                  <TargetFramework>net11.0</TargetFramework>
                </PropertyGroup>
              </Project>
              ```

              The async sequence supplies each line's text and source without event-callback plumbing.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: net11\.0
      - type: output-matches
        config:
          pattern: ReadAllLines(Async)?\s*\(
      - type: output-matches
        config:
          pattern: await\s+foreach
      - type: output-matches
        config:
          pattern: \.Content\b|\.ToString\s*\(
      - type: output-matches
        config:
          pattern: \.StandardError\b
      - type: output-not-matches
        config:
          pattern: \.\s*Begin(Output|Error)ReadLine\s*\(|\.\s*(Output|Error)DataReceived\s*\+=
      - type: prompt
    rubric:
      - Uses Process.ReadAllLinesAsync consumed with `await foreach` over IAsyncEnumerable<ProcessOutputLine>
      - Reads each line's text through Content or ToString and distinguishes stdout vs stderr via StandardError
      - Does NOT use the old OutputDataReceived/BeginOutputReadLine event model; targets net11.0

  # --- Stimulus 5: Fire-and-forget process start ---
  - name: Fire-and-forget process start in .NET 11
    prompt: |
      In a .NET 11 tool, I need to launch an independent helper executable (such as a background tool)
      and immediately move on without holding onto process handles or having to manage its disposal.
      I just want to launch it without keeping process handle structures alive and obtain its process ID.
      Show me a minimal C# program and the `.csproj` XML targeting `net11.0` for this.
    tags:
      capability: fire-and-forget-process
      risk: retained-process-handle
      journey: launch-independent-helper
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-forget
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Supply the helper executable path as the program's first argument.

              `Program.cs`:
              ```csharp
              using System;
              using System.Diagnostics;

              if (args.Length != 1)
              {
                  throw new ArgumentException("Supply a helper executable path.");
              }
              int processId = Process.StartAndForget(args[0]);
              Console.WriteLine(processId);
              ```

              `LaunchHelper.csproj`:
              ```xml
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <OutputType>Exe</OutputType>
                  <TargetFramework>net11.0</TargetFramework>
                </PropertyGroup>
              </Project>
              ```

              This returns the process ID and releases the parent's process resources. It does not kill the child.
              It launches an executable, not a URL through the shell. Do not enable standard-stream redirection.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: net11\.0
      - type: output-matches
        config:
          pattern: Process\.StartAndForget\(
      - type: prompt
    rubric:
      - Uses the new Process.StartAndForget method added in .NET 11
      - Launches the executable without shell execution or redirected standard streams, returns its process ID, and releases the parent's process resources
      - Targets net11.0

  # --- Stimulus 6: Whitelist inherited handles for child process ---
  - name: Whitelist inherited handles for child process in .NET 11
    prompt: |
      In a high-throughput .NET 11 application, I need to spawn child processes while keeping open file handles in the parent.
      To avoid leaking file descriptors to the child, I need to explicitly specify which handles get inherited
      by the child process using the new ProcessStartInfo handle inheritance features in .NET 11.
      Show me a minimal example configuring handle inheritance and the `.csproj` XML targeting `net11.0`.
    tags:
      capability: control-handle-inheritance
      risk: leaked-file-descriptor
      journey: spawn-processes-under-load
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-handles
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              This example supplies one file handle to a helper that accepts the inherited handle value.
              Replace `handle-reader` with that helper. The parent keeps the handle open until the child exits.

              `Program.cs`:
              ```csharp
              using System;
              using System.Diagnostics;
              using System.Globalization;
              using System.IO;
              using Microsoft.Win32.SafeHandles;

              using SafeFileHandle handle = File.OpenHandle("shared.txt", FileMode.Open, FileAccess.Read);
              string value = handle.DangerousGetHandle().ToInt64().ToString(CultureInfo.InvariantCulture);
              var info = new ProcessStartInfo("handle-reader", [value])
              {
                  UseShellExecute = false,
                  InheritedHandles = [handle]
              };
              using Process child = Process.Start(info)
                  ?? throw new InvalidOperationException("The child did not start.");
              child.WaitForExit();
              Environment.ExitCode = child.ExitCode;
              ```

              `InheritHandle.csproj`:
              ```xml
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <OutputType>Exe</OutputType>
                  <TargetFramework>net11.0</TargetFramework>
                </PropertyGroup>
              </Project>
              ```

              Only the explicit list is allowed to inherit; an empty list passes no extra handles.
              Serialize starts that share this handle. Do not pre-enable inheritance or combine the list with a username.
              This feature can reduce process-start performance on Unix systems without native inheritance control.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: net11\.0
      - type: output-matches
        config:
          pattern: InheritedHandles\s*=
      - type: output-not-matches
        config:
          pattern: InheritedHandles\s*=\s*(null\b|default\b)
      - type: prompt
    rubric:
      - Restricts InheritedHandles on ProcessStartInfo to an explicit non-null collection instead of null or default
      - Does not use the same inherited handle in concurrent process starts
      - Targets net11.0

  # --- Stimulus 7: Negative — skill should NOT activate on .NET 8 ---
  - name: "Non-activation: Running a process on .NET 8"
    prompt: |
      I have a .NET 8 console app and I need to start a process 'notepad.exe'.
      Show me a minimal C# program and the `.csproj` XML targeting `net8.0` that starts this process using the traditional Process.Start. Print both in your response.
    expect_activation: false
    tags:
      capability: framework-version-boundary
      risk: unsupported-net8-api
      journey: launch-legacy-framework-process
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-net8
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              This example runs on Windows, where Notepad is available.

              `Program.cs`:
              ```csharp
              using System;
              using System.Diagnostics;

              using Process process = Process.Start("notepad.exe")
                  ?? throw new InvalidOperationException("Notepad did not start.");
              Console.WriteLine(process.Id);
              ```

              `LaunchNotepad.csproj`:
              ```xml
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <OutputType>Exe</OutputType>
                  <TargetFramework>net8.0</TargetFramework>
                </PropertyGroup>
              </Project>
              ```

              Disposing the wrapper releases the parent's resources; it does not stop Notepad.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: net8\.0
      - type: output-matches
        config:
          pattern: Process\.Start\(
      - type: output-not-matches
        config:
          pattern: \bProcess\.Run(Async)?\s*\(|\bRunAndCaptureText(Async)?\s*\(|\bReadAll(Text|Bytes|Lines)(Async)?\s*\(|\bStartAndForget\s*\(|\b(KillOnParentExit|InheritedHandles|StartDetached)\s*=
      - type: prompt
    rubric:
      - Solves the task using standard pre-.NET 11 APIs (Process.Start)
      - Does NOT load or reference the process-api-net11 skill
      - Targets net8.0

  # --- Stimulus 8: Subtle negative — capture output on .NET 10 (APIs are net11-only) ---
  - name: "Non-activation: capture process output on .NET 10"
    prompt: |
      I'm on a `.NET 10` project (`net10.0`). I need to run `git` with the argument `status`
      and capture its standard output into a string. Show a minimal C# program and the
      `.csproj` XML targeting `net10.0`, and print both.
    expect_activation: false
    tags:
      capability: framework-version-boundary
      risk: unsupported-net10-api
      journey: capture-legacy-framework-output
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-net10
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              `Program.cs`:
              ```csharp
              using System;
              using System.Diagnostics;

              var info = new ProcessStartInfo("git", ["status"])
              {
                  UseShellExecute = false,
                  RedirectStandardOutput = true
              };
              using Process process = Process.Start(info)
                  ?? throw new InvalidOperationException("The child did not start.");
              string output = await process.StandardOutput.ReadToEndAsync();
              await process.WaitForExitAsync();
              Console.Write(output);
              Environment.ExitCode = process.ExitCode;
              ```

              `CaptureLegacy.csproj`:
              ```xml
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <OutputType>Exe</OutputType>
                  <TargetFramework>net10.0</TargetFramework>
                </PropertyGroup>
              </Project>
              ```

              Only stdout is redirected. Stderr remains inherited, so there is no second redirected pipe to drain.
              The .NET 11 convenience APIs are not available on this target.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: net10\.0
      - type: output-not-matches
        config:
          pattern: \bProcess\.Run(Async)?\s*\(|\bRunAndCaptureText(Async)?\s*\(|\bReadAll(Text|Bytes|Lines)(Async)?\s*\(|\bStartAndForget\s*\(|\b(KillOnParentExit|InheritedHandles|StartDetached)\s*=
      - type: output-matches
        config:
          pattern: RedirectStandardOutput\s*=\s*true\b
      - type: output-matches
        config:
          pattern: ReadToEnd(Async)?\s*\(
      - type: prompt
    rubric:
      - Solves the task with pre-.NET 11 APIs (RedirectStandardOutput + ReadToEnd/ReadToEndAsync)
      - Recognizes the new .NET 11 Process convenience APIs are unavailable on net10.0 and does not use them
      - Does NOT load the process-api-net11 skill; targets net10.0
