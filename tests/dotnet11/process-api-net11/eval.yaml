  - name: Observe child termination independently of descendant output
    prompt: |
      My .NET 11 service starts a command that launches a long-running helper and then exits.
      I use BeginOutputReadLine and BeginErrorReadLine for logging. The helper inherits those
      output streams. Awaiting WaitForExitAsync never completes, although the original command
      has exited. I need its exit status promptly, not all of the helper's output.
      Explain why this happens and show the appropriate wait for the already-started Process
      named process. Do not kill the helper. Respond inline without creating files.
    tags:
      capability: termination-versus-output-eof
      risk: descendant-held-pipe-writer
      journey: observe-launcher-exit
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-exit-status
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              WaitForExitAsync also waits for active event readers to reach EOF. The helper retains
              inherited write handles, so EOF can remain pending after the original command exits.
              Wait for termination independently:
              ```csharp
              ProcessExitStatus status = await process.WaitForExitStatusAsync();
              int exitCode = status.ExitCode;
              ```
              This does not drain output or kill the helper. Keep the logging readers and Process
              alive for as long as logging is needed; define a separate output-reader lifetime policy.
              Restricted inheritance in the parent does not stop the child passing its standard handles onward.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: 'await\s+process\.(?:WaitForExitStatusAsync|SafeHandle\.WaitForExitAsync)\s*\(|\b(?:SafeProcessHandle|var)\s+(\w+)\s*=\s*process\.SafeHandle\s*;[\s\S]*?\bawait\s+\1\.WaitForExitAsync\s*\('
      - type: output-matches
        config:
          pattern: '(?i)\bEOF\b|end.of.(?:file|stream)'
      - type: prompt
    rubric:
      - Explains that inherited writers held by the helper delay event-reader EOF after the original command terminates
      - Awaits termination independently of output completion and reads the returned exit status
      - Does not kill the helper or promise that restricting inheritance in the parent prevents standard-handle inheritance by grandchildren

  - name: Discard child output without creating unread pipes
    prompt: |
      This .NET 11 console tool sometimes hangs when builder produces lots of output.
      I do not need any input or output, just the exit code:
      ```csharp
      ProcessStartInfo info = new("builder")
      {
          RedirectStandardInput = true,
          RedirectStandardOutput = true,
          RedirectStandardError = true
      };
      using Process process = Process.Start(info)!;
      process.WaitForExit();
      ```
      Explain the failure and replace this with the simplest synchronous .NET 11 solution.
      Respond inline without creating files.
    tags:
      capability: discard-standard-streams
      risk: unread-output-pipes
      journey: run-silent-build-tool
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-silent
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Redirection creates output pipes that nobody drains. Once a pipe fills, the child blocks
              writing while the parent waits for exit. Redirected stdin can also leave it waiting for
              input or EOF. Discard all three streams through the null device instead:
              ```csharp
              ProcessExitStatus status = Process.Run("builder", silent: true);
              int exitCode = status.ExitCode;
              ```
              This creates no parent-side capture pipes, buffers no output, and gives the child EOF on input.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: 'Process\.Run\s*\([^;]*\bsilent\s*:\s*true\b|\bFile\.OpenNullHandle\s*\('
      - type: prompt
    rubric:
      - Explains the full-output-pipe deadlock rather than blaming synchronous waiting alone
      - Discards stdin, stdout, and stderr without capturing output in memory or creating pipes that require draining
      - Uses a synchronous operation that returns the exit status without sync-over-async

  - name: Write binary child output directly to a file
    prompt: |
      In .NET 11, I need to launch an encoder whose stdout is a potentially huge binary artifact.
      Save those bytes unchanged to artifact.bin, leave stderr visible, and wait for the encoder
      to finish. The parent never inspects or transforms the output. Avoid buffering or copying
      the output through the parent. Show a minimal C# snippet inline; do not create files.
    tags:
      capability: direct-standard-handle-redirection
      risk: unnecessary-binary-capture
      journey: export-large-artifact
    golden_trajectory:
      inline:
