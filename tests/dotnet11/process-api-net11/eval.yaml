      - Connects the child's stdout directly to a writable file handle and preserves binary bytes without parent-side capture or copying
      - Leaves stderr inherited and does not also enable RedirectStandardOutput
      - Waits for termination and manages the parent file handle lifetime without manually marking it inheritable

  - name: Bound memory when consuming untrusted process output
    prompt: |
      A .NET 11 service runs third-party plugins as child executables. A plugin can emit unlimited
      stdout and stderr, including output with no newline characters. We only need to retain at most
      1 MiB of output in total. Would full text capture with a two-second cancellation token make this
      safe? Would reading lines fix it? Recommend a policy that actually bounds memory and handles a
      plugin that exceeds the limit. Explain the design only; no code or file changes.
    tags:
      capability: bounded-untrusted-output
      risk: parent-memory-exhaustion
      journey: supervise-untrusted-plugin
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-memory-bound
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              Neither a timeout nor line reading establishes this memory bound. Full-output capture
              buffers everything until EOF; a fast writer can exhaust memory before two seconds.
              One arbitrarily long line can also exhaust memory.

              Drain stdout and stderr concurrently using fixed-size byte buffers. Enforce one shared
              1 MiB (1,048,576 bytes) retention budget across both streams, limiting each retained chunk
              to the remaining budget rather than checking only after an unbounded allocation.
              When the combined limit is exceeded, either terminate the plugin and wait for termination,
              or retain only the bounded prefix and continue draining both streams while discarding excess
              bytes until EOF. Report the limit violation or truncation explicitly. Do not merely stop
              reading and leave a live child blocked on full pipes. Give output draining its own
              cancellation or timeout policy because descendants may retain pipe writers even after
              the immediate child terminates.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: '(?i)\b(concurrent(?:ly)?|parallel|simultaneous(?:ly)?)\b|at\s+the\s+same\s+time'
      - type: output-matches
        config:
          pattern: '1,?048,?576|1\s*MiB'
      - type: prompt
    rubric:
      - Rejects timeout-based full capture as a memory guarantee and identifies an arbitrarily long line as a remaining risk for line readers
      - Drains both streams concurrently with bounded byte buffers and one combined retention budget of at most 1 MiB
      - Handles excess output by either terminating and waiting for the child or continuing concurrent bounded draining while discarding excess bytes; reports truncation or the limit violation rather than silently dropping output
      - Does not leave a live child blocked on unread pipes or assume that immediate-child termination guarantees output EOF; treats execution and output-reader lifetimes separately

  - name: Retain a process handle in a size-sensitive NativeAOT supervisor
    prompt: |
      I'm writing a size-sensitive NativeAOT supervisor targeting .NET 11. A factory must launch
      a worker and return ownership to its caller, which needs the process ID and may wait for or
      terminate that worker later. I don't need managed standard streams, output events, or the
      component-based process API. This isn't a single combined launch-and-wait operation.
      What first-party API fits this narrower lifecycle? Show a minimal factory and caller,
      including the required namespaces and a net11.0 project file, and explain the ownership
      and trimming implications. Print code blocks inline; do not create or modify files.
    tags:
      capability: owning-process-handle
      risk: unnecessary-process-wrapper
      journey: supervise-nativeaot-worker
    golden_trajectory:
      inline:
        schema_version: ATIF-v1.6
        session_id: process-api-net11-owning-handle
        agent: {name: reference, version: "1.0.0", model_name: curated}
        steps:
          - step_id: 1
            source: agent
            message: |
              `Program.cs`:
              ```csharp
              using System;
              using System.Diagnostics;
              using Microsoft.Win32.SafeHandles;

              using SafeProcessHandle worker = StartWorker("worker");
              Console.WriteLine(worker.ProcessId);
              ProcessExitStatus status = await worker.WaitForExitAsync();
              Environment.ExitCode = status.ExitCode;

              static SafeProcessHandle StartWorker(string fileName)
              {
                  ProcessStartInfo info = new(fileName)
                  {
                      InheritedHandles = []
                  };
                  return SafeProcessHandle.Start(info);
              }
              ```

              `Supervisor.csproj`:
              ```xml
              <Project Sdk="Microsoft.NET.Sdk">
                <PropertyGroup>
                  <OutputType>Exe</OutputType>
                  <TargetFramework>net11.0</TargetFramework>
                  <PublishAot>true</PublishAot>
                </PropertyGroup>
              </Project>
              ```

              SafeProcessHandle.Start returns an owning handle without the higher-level Process
              wrapper. The caller disposes it; the factory must not dispose it before returning.
              Disposal releases parent-side resources, not the child process. To terminate the
              worker explicitly, call Kill and then wait to confirm termination.

              Its focused API offers better trimmability, but binary-size savings depend on the
              app and platform. Leave UseShellExecute unset so unused shell-execution code can
              also be trimmed. Managed RedirectStandard* flags are unsupported here; use direct
              standard handles or Process capture APIs if output requirements change.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: '\bSafeProcessHandle\s*\.\s*Start\s*\('
      - type: output-matches
        config:
          pattern: net11\.0
      - type: prompt
    rubric:
      - Starts the worker directly through the focused owning-handle API, without creating a higher-level Process wrapper or adding native interop
      - Returns a valid owning handle from the factory and disposes it in the caller; does not return a borrowed handle invalidated by disposing its Process owner
      - Provides the required namespaces, a net11.0 NativeAOT project, and a caller that obtains the process ID and waits without managed stream redirection
      - Explains the trimming advantage without promising fixed size savings and distinguishes handle disposal from terminating the child

