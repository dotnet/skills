name: lightweight-telemetry
description: Evaluates the dotnet11/lightweight-telemetry skill
type: capability
config:
  timeout: 3m
stimuli:
  - name: Emit structured telemetry from a .NET 11 CLI
    prompt: |
      I'm building a .NET 11 console tool and I want it to report how many times
      it ran and how long each run took, as structured telemetry. I do NOT want to
      pull in OpenTelemetry or any external APM SDK — the host has no collector and
      is resource constrained. Show me a minimal `net11.0` program that uses the
      framework's built-in metrics API and prints one structured line per measurement.
    graders:
      - type: exit-success
      - type: output-contains
        config:
          substring: System.Diagnostics.Metrics
      - type: output-matches
        config:
          pattern: new Meter\(
      - type: output-matches
        config:
          pattern: CreateCounter
      - type: output-matches
        config:
          pattern: CreateHistogram
      - type: output-matches
        config:
          pattern: net11\.0
      - type: output-not-matches
        config:
          pattern: OpenTelemetry
      - type: prompt
    rubric:
      - Uses System.Diagnostics.Metrics.Meter (built into the framework, no extra NuGet package for the API) rather than OpenTelemetry or a vendor APM SDK
      - Defines a counter and a histogram from the Meter
      - Targets net11.0
      - Emits structured (JSON) output per measurement rather than only a plaintext log line

  - name: Drive timing with TimeProvider instead of DateTime.Now
    prompt: |
      In a .NET 11 tool I need to measure how long an operation takes and record it
      as a metric. I want the timing to go through the framework's TimeProvider
      abstraction rather than reaching for DateTime.Now everywhere. Show a small
      `net11.0` snippet that starts a timestamp with a TimeProvider and computes the
      elapsed milliseconds, then records it on a histogram.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: TimeProvider
      - type: output-matches
        config:
          pattern: GetTimestamp
      - type: output-matches
        config:
          pattern: GetElapsedTime
      - type: output-not-matches
        config:
          pattern: DateTime\.Now
      - type: output-matches
        config:
          pattern: net11\.0
      - type: prompt
    rubric:
      - Uses TimeProvider.System (or a TimeProvider instance) to obtain and compute elapsed time
      - Calls GetTimestamp to start and GetElapsedTime to compute the duration
      - Does NOT use DateTime.Now for the measurement
      - Targets net11.0

  - name: Consistent meter name for downstream scraping
    prompt: |
      I'm adding telemetry to several .NET 11 tools and I plan to scrape the
      emitted metrics with an external system later. What should I be careful about
      with the Meter name, and give me a `net11.0` example that creates a Meter with
      a stable name and version.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: new Meter\(
      - type: output-matches
        config:
          pattern: net11\.0
      - type: output-not-matches
        config:
          pattern: Guid\.NewGuid
      - type: output-matches
        config:
          pattern: (stable|namespace|consisten)
      - type: prompt
    rubric:
      - Creates a Meter with an explicit, stable name (and version) rather than a randomly generated one
      - Explains that the meter name becomes the metric namespace downstream, so it must stay stable
      - Targets net11.0

  - name: Zero-dependency sink via built-in MeterListener
    prompt: |
      I have a .NET 11 tool that uses System.Diagnostics.Metrics. I want to print the
      measurements to the console as JSON lines with no extra packages. Show me a
      `net11.0` console listener that attaches to a Meter, enables measurement events,
      and writes one JSON line per reading.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: MeterListener
      - type: output-matches
        config:
          pattern: InstrumentPublished
      - type: output-matches
        config:
          pattern: EnableMeasurementEvents
      - type: output-matches
        config:
          pattern: JsonSerializer
      - type: output-matches
        config:
          pattern: net11\.0
      - type: output-not-matches
        config:
          pattern: OpenTelemetry
      - type: prompt
    rubric:
      - Uses the built-in MeterListener (no external dependency) to subscribe to instrument measurements
      - Enables measurement events via InstrumentPublished / EnableMeasurementEvents
      - Serializes each reading to JSON (e.g. via System.Text.Json) and writes it to the console
      - Targets net11.0

  - name: Non-activation — distributed tracing belongs elsewhere
    prompt: |
      My .NET 11 service needs distributed tracing across multiple microservices,
      with spans, context propagation, and a backend like Jaeger. Should I use the
      lightweight built-in metrics approach from the telemetry skill for this?
      If not, what should I reach for instead?
    expect_activation: false
    graders:
      - type: output-matches
        config:
          pattern: OpenTelemetry
      - type: output-not-matches
        config:
          pattern: System\.Diagnostics\.Metrics\.Meter
      - type: prompt
    rubric:
      - Recognizes that cross-service distributed tracing is out of scope for the lightweight-telemetry skill
      - Recommends OpenTelemetry (or the configuring-opentelemetry-dotnet skill) instead of System.Diagnostics.Metrics
      - Does NOT load the lightweight-telemetry skill as the solution for this request

  - name: Non-activation — cloud ingestion belongs elsewhere
    prompt: |
      I want to send my .NET 11 app's telemetry to Application Insights in the cloud
      so I get dashboards and alerting. Is the dependency-free, console-emitting
      telemetry approach the right fit here?
    expect_activation: false
    graders:
      - type: output-matches
        config:
          pattern: Application Insights|ApplicationInsights|app insights|vendor SDK
      - type: output-not-matches
        config:
          pattern: System\.Diagnostics\.Metrics\.Meter
      - type: prompt
    rubric:
      - Recognizes that cloud ingestion / managed dashboards are out of scope for the lightweight-telemetry skill
      - Recommends the vendor SDK (Application Insights) rather than the built-in console sink
      - Does NOT load the lightweight-telemetry skill as the solution for this request
