scenarios:
  - name: "Review custom target for authoring anti-patterns"
    prompt: "I added some custom MSBuild targets to TargetAuthoring.csproj but the build behaves oddly — compilation steps seem to go missing and rebuilds happen every time. Can you review the targets and tell me what's wrong?"
    setup:
      copy_test_files: true
    assertions:
      - type: "output_contains"
        value: "CompileDependsOn"
      - type: "output_matches"
        pattern: "(overwrit|append|chain)"
    rubric:
      - "Identified that CompileDependsOn is overwritten instead of appending, which drops existing SDK compilation targets"
      - "Identified that GetApiEndpoints query target should use Returns instead of Outputs to avoid caching stale results"
      - "Identified that GenerateApiClient is missing Inputs/Outputs, causing unnecessary rebuilds"
      - "Identified that generated file is not registered in FileWrites, so dotnet clean won't remove it"
    timeout: 180

  - name: "Diagnose broken SDK target chain across files"
    prompt: "We have a custom SDK that defines a target chain for code generation using DependsOnTargets, but after someone added custom targets in Directory.Build.targets the generated code stopped being tracked for clean and incremental builds broke. The setup is in the hard/ subfolder. Can you review the target authoring and find what went wrong?"
    setup:
      copy_test_files: true
    assertions:
      - type: "output_matches"
        pattern: "(CoreCodeGen|overrid|replac|redefin)"
      - type: "output_matches"
        pattern: "(FileWrites|incremental|Inputs|Outputs)"
    rubric:
      - "Identified that Directory.Build.targets redefines CoreCodeGen, silently replacing the SDK's implementation that had Inputs/Outputs and FileWrites"
      - "Identified that RunLinter uses BeforeTargets instead of appending to $(CodeGenDependsOn), making it fragile"
      - "Identified that CodeGen is duplicated in CompileDependsOn (SDK adds it, Directory.Build.targets adds it again)"
      - "Identified that PostCodeGenValidation depends on CodeGen's outputs but doesn't declare DependsOnTargets"
    timeout: 180
