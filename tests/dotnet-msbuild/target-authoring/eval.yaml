scenarios:
  - name: "Diagnose custom target build regression"
    prompt: >-
      After adding custom MSBuild targets to TargetAuthoring.csproj, our build
      started behaving strangely: dotnet build always recompiles everything even
      when no source files have changed, and after cleaning and rebuilding, some
      standard compilation steps seem to have vanished entirely. We also have a
      target that queries API endpoint metadata from schema files, but it keeps
      returning the first run's results even after we modify the schema files.
      Can you investigate TargetAuthoring.csproj and identify what's causing these
      regressions?
    setup:
      copy_test_files: true
    assertions:
      - type: "output_matches"
        pattern: "(CompileDependsOn|compilation.*chain|SDK.*target|existing.*target)"
      - type: "output_matches"
        pattern: "(Returns|stale|cach|query.*target|re-evaluat)"
    rubric:
      - "Explained why standard compilation steps vanished — the dependency chain property was replaced wholesale rather than extended, dropping all previously-chained SDK targets"
      - "Identified why the endpoint query target returns stale results — using Outputs causes the build engine to cache results and skip re-evaluation, whereas Returns always re-evaluates"
      - "Identified that the code generation target always re-runs because it lacks file-based incremental build declarations"
      - "Identified that generated files survive dotnet clean because they are not registered with the build's file tracking mechanism"
    timeout: 180

  - name: "Diagnose broken SDK target chain across files"
    prompt: >-
      We maintain a custom MSBuild SDK (CustomSdk.targets) that defines a code
      generation pipeline with proper incremental build and clean support. It
      worked perfectly until someone added customizations in Directory.Build.targets.
      Now the generated code no longer updates when we modify schema files, dotnet
      clean leaves stale generated files behind, and the build seems slower than
      before. The setup is in the hard/ subfolder — start from hard/HardTarget.csproj
      and trace through how CustomSdk.targets and Directory.Build.targets interact.
    setup:
      copy_test_files: true
    assertions:
      - type: "output_matches"
        pattern: "(CoreCodeGen|redefin|replac|overrid|shadow)"
      - type: "output_matches"
        pattern: "(FileWrites|incremental|Inputs|Outputs|clean)"
    rubric:
      - "Identified that Directory.Build.targets redefines the core code generation target, silently replacing the SDK's version that had incremental build tracking and clean file registration"
      - "Identified that a linting target bypasses the SDK's extensibility chain by using direct injection instead of the established dependency chain pattern"
      - "Identified the duplicate entry in the compilation dependency chain — the same target appears twice because both the SDK and customization file add it"
      - "Identified that a post-processing target reads generated files but doesn't declare an ordering dependency, risking execution before generation completes"
    timeout: 180

  - name: "Fix custom target anti-patterns"
    prompt: >-
      The custom MSBuild targets in TargetAuthoring.csproj cause full rebuilds
      every time and leave generated files behind after dotnet clean. Please fix
      all the target authoring issues you find so that: (1) incremental builds
      work correctly — unchanged schemas shouldn't trigger regeneration,
      (2) dotnet clean removes all generated files, and (3) the existing SDK
      compilation pipeline isn't disrupted by our custom targets.
    setup:
      copy_test_files: true
    assertions:
      - type: "file_contains"
        path: "TargetAuthoring.csproj"
        value: "$(CompileDependsOn)"
      - type: "file_contains"
        path: "TargetAuthoring.csproj"
        value: "FileWrites"
    rubric:
      - "Fixed the dependency chain to append the custom target rather than replacing all existing SDK compilation targets"
      - "Changed the query target to use a return mechanism that doesn't cache stale results across builds"
      - "Added file-based incremental build support to the code generation target with proper input/output declarations"
      - "Registered generated files for clean tracking so dotnet clean removes them"
      - "The resulting project file follows canonical MSBuild target authoring patterns"
    timeout: 180
