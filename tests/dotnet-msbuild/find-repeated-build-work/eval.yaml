              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Per-TFM tasks | 36 | 36 | 0 | 12 projects times 3 TFMs | Leave unchanged | unknown |
              | Calls per project | 4 | 4 | 0 | One outer plus three inner builds | Leave unchanged | unknown |

              Verdict: no repeated work worth changing
    graders:
      - type: run-command
        config:
          command: python
          args:
            - -c
            - |
              import hashlib, pathlib
              base = pathlib.Path('legit-per-project-calls')
              expected = {
                  'Directory.Build.props': '25501be4407cbdb202defb3848da024dc276d2b67d5eea0636dbb1322ab1d634',
                  'perf-summary.txt': 'a1bc920051a847021358ad164239be568240e1ea120c67f967da039949c6953a',
              }
              actual = {p.relative_to(base).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in base.rglob('*') if p.is_file()}
              assert actual == expected, 'preserve every fixture file without edits, additions or deletions'
          expected_exit_code: 0
      - type: output-matches
        config:
