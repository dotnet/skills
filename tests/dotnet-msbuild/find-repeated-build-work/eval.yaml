        steps:
          - step_id: 1
            source: agent
            message: |-
              The command text matches, but its working directories belong to two different Git repositories. Compute one full revision per repository and pass the matching value to that repository's 12 projects, retaining the direct-build fallback and write-if-different behavior. A single product-wide revision would incorrectly stamp Engine with Main's commit. Two calls rather than 24 could avoid 44,000 ms of aggregate task time; overlap and wall-clock gain are unknown. This is a proposal, not a measured result.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Git revision | 24 | 2 | 44000 estimated | Two repository roots | Compute once per repository | unknown |

              Verdict: proposed removal of 22 executions; wall-clock not validated
    graders:
      - type: tool-calls
        config:
          disallowed: [edit, create]
      - type: run-command
        config:
          command: python
          args:
            - -c
            - &preserve-audit |
              import hashlib, pathlib, sys
              base = pathlib.Path('audit')
              actual = {p.relative_to(base).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in base.rglob('*') if p.is_file()}
              assert actual == {'evidence.txt': sys.argv[1]}, 'preserve the complete supplied evidence without edits, additions or deletions'
            - 76dadff9d21382a7ec513453c2cca7120dc0b62ccc3cb55ad616f4125339dc61
          expected_exit_code: 0
      - &audit-table
        type: output-matches
        config:
          pattern: '(?m)^\|\s*Work\s*\|\s*Calls\s*\|\s*Expected\s*\|\s*Avoidable ms\s*\|\s*Cause\s*\|\s*Fix\s*\|\s*On critical path\?\s*\|\r?\n\|(?:\s*:?-+:?\s*\|){7}\r?\n\|(?:[^|\r\n]*\|){7}\s*$'
      - &audit-verdict
        type: output-matches
        config:
          pattern: '(?m)^Verdict:[ \t]*\S[^\r\n]*$'
      - type: prompt
    rubric:
