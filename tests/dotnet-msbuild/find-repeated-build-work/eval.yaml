              base = pathlib.Path('negligible-repeat')
              expected = {
                  'Directory.Build.targets': '04ec3ab2ea98c4814dcf0646404177408b7940c635dde20d97ce35cd245c7c50',
                  'perf-summary.txt': 'c9f2e67662ba7a144ab8aad46affbc247ad9d9acdc727b2e72ae94d8ad1f04f0',
              }
              actual = {p.relative_to(base).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in base.rglob('*') if p.is_file()}
              assert actual == expected, 'preserve every fixture file without edits, additions or deletions'
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: (?im)^Verdict:[ \t]*no repeated work worth changing[.!]?[ \t]*$
      - type: output-matches
        config:
          pattern: '(?m)^\|\s*Work\s*\|\s*Calls\s*\|\s*Expected\s*\|\s*Avoidable ms\s*\|\s*Cause\s*\|\s*Fix\s*\|\s*On critical path\?\s*\|\r?\n\|(?:\s*:?-+:?\s*\|){7}\r?\n\|(?:[^|\r\n]*\|){7}\s*$'
      - type: output-matches
        config:
          pattern: '(?m)^Verdict:[ \t]*\S[^\r\n]*$'
      - type: prompt
    rubric:
      - Found that the Exec runs 4 times for about 6 s in total
