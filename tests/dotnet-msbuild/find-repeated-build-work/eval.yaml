  - name: Avoid moving noncritical work onto the critical path
    prompt: |
      Would moving the inventory probe to the wrapper make the build in audit/evidence.txt faster? Compare it with
      computing the value inside Inventory. Explain your recommendation without editing or running anything.
    tags: { capability: noncritical-work-hoisting-regression, risk: high, journey: audit }
    environment:
      files:
        - { src: ./audit-scenarios/off-critical-path.txt, dest: audit/evidence.txt }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: repeated-work-off-critical-path
        agent: *audit-agent
        steps:
          - step_id: 1
            source: agent
            message: |-
              Inventory is not on the critical path and has no contention with Compiler. Removing nine probes could save 18,000 ms of aggregate task time, but computing once within Inventory still leaves the 120 s Compiler branch as the final join. It provides no modeled wall-clock saving here. A 2 s wrapper probe delays the start of Compiler and instead models a 122 s build. Do not make that move as a build-speed optimization; branch-local sharing is only a resource-cost improvement and must preserve the version for all consumers.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Inventory probe | 10 | 1 | 18000 aggregate, 0 wall-clock estimated | Repeats on a noncritical branch | Leave off the global preflight; optionally share inside Inventory | no |

              Verdict: wrapper hoisting risks a 2 s regression; branch-local deduplication has no modeled wall-clock benefit
    graders:
      - type: tool-calls
        config:
          disallowed: [edit, create]
      - type: run-command
        config:
          command: python
          args: [-c, *preserve-audit, 520fde95f44a400204b6bbf069dc232a0a5697ff4ab2a184debe971e82ce1413]
          expected_exit_code: 0
      - *audit-table
      - *audit-verdict
      - type: prompt
    rubric:
      - Recognized that removing Inventory work cannot shorten the independent 120 s Compiler critical path under the supplied assumptions
      - Identified the 2 s regression from running a wrapper probe before Compiler starts
      - Distinguished 18000 ms aggregate resource savings from zero modeled wall-clock improvement for branch-local sharing
      - Preserved all consumers and made no edits, executions or measured-result claims

  - name: Stop a failed shared preflight before child fallbacks repeat it
    prompt: |
      Why does the failing invocation in audit/evidence.txt run the tool so many times after the preflight? Recommend
      safe failure behavior while keeping direct project builds supported. Do not modify files or invoke the build.
    tags: { capability: failed-preflight-error-propagation, risk: high, journey: audit }
    environment:
      files:
        - { src: ./audit-scenarios/failed-preflight.txt, dest: audit/evidence.txt }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: repeated-work-failed-preflight
        agent: *audit-agent
        steps:
          - step_id: 1
            source: agent
            message: |-
              The wrapper's || true hides exit 17 and passes an empty version, so every child's fallback runs the same failing command. Remove the suppression or explicitly propagate the probe's exit status and diagnostics before starting MSBuild. There is no valid default version. Preserve "$@" forwarding and the fallback for direct project builds; on successful wrapper runs pass the real value globally. On this failing invocation, one failed preflight should stop all child dispatch, not produce a successful-looking build.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Failing version probe | 17 | 1 | 16000 aggregate estimated | Suppressed failure yields empty global value | Fail before dispatch with exit 17 | unknown |

              Verdict: proposed removal of 16 redundant failed attempts; preserve the original failure, not a success fallback
    graders:
      - type: tool-calls
        config:
          disallowed: [edit, create]
      - type: run-command
        config:
          command: python
          args: [-c, *preserve-audit, 424b1e79205d8ba7ead84a60b343e078516fd74bf1bd7a0a9209c71e957dcd8e]
          expected_exit_code: 0
      - *audit-table
      - *audit-verdict
      - type: prompt
    rubric:
      - Traced the repeated child attempts to the swallowed preflight failure and empty passed value
      - Stopped before child dispatch with the original error status and diagnostics rather than inventing a default or silently succeeding
      - Retained caller arguments, successful global value propagation and direct-project fallback support
      - Distinguished an estimated reduction in failing attempts from validated build performance and did not execute or edit

  - name: Preserve distinct identities despite matching command lines
    prompt: |
      Review the twenty-four process launches in audit/evidence.txt. Are any removable under the release contract,
      and what would be unsafe to share? Do not change files or execute the build.
    tags: { capability: intentionally-nondeterministic-project-work, risk: high, journey: audit }
    environment:
      files:
        - { src: ./audit-scenarios/per-project-identity.txt, dest: audit/evidence.txt }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: repeated-work-per-project-identity
        agent: *audit-agent
        steps:
          - step_id: 1
            source: agent
            message: |-
              These calls are intentionally not equivalent: identitygen creates a fresh per-project signing identity on every invocation. One product-wide cached result would give projects the same identity and violate the release contract. All 24 outputs remain necessary, and this tool cannot generate several identities in one process. Leave the step unchanged under the supplied constraints rather than infer invariance from command text or promise a 34.5 s saving.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Signing identity creation | 24 | 24 | 0 | Required distinct random identities | Leave unchanged | unknown |

              Verdict: no safely removable identity-generation work with the current tool contract
    graders:
      - type: tool-calls
        config:
          disallowed: [edit, create]
      - type: run-command
        config:
          command: python
          args: [-c, *preserve-audit, 09dfde3c236d57cf5513e05899353e7337e38687d26aa9ebeb9ffb594bb0d4fa]
          expected_exit_code: 0
      - *audit-table
      - *audit-verdict
      - type: prompt
    rubric:
      - Recognized nondeterministic per-project identity creation as required distinct work despite identical command text
      - Preserved 24 distinct identities and rejected product-wide value caching or unsupported multi-identity tool modes
      - Did not claim any removable work or performance gain under the given contract
      - Kept the review read-only without builds or edits

  - name: Fix a correctness race even when timing savings are negligible
    prompt: |
      The source corruption in audit/evidence.txt is rare and the task time is tiny. Should we change this step?
      Recommend safe ordering and rerun behavior without modifying files or running a build.
    tags: { capability: correctness-race-overrides-timing-threshold, risk: high, journey: audit }
    environment:
      files:
        - { src: ./audit-scenarios/cheap-race.txt, dest: audit/evidence.txt }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: repeated-work-cheap-correctness-race
        agent: *audit-agent
        steps:
          - step_id: 1
            source: agent
            message: |-
              Change it for correctness, not speed. Exists is a check-then-write race: parallel projects can all enter and truncate the shared file. Generate once successfully in build.sh before starting the parallel build, retain the shared Compile include, and propagate generator errors. Generate to a temporary file and replace only on byte changes so an unchanged rerun preserves the timestamp. Avoiding seven 10 ms calls saves at most 70 ms, about 0.012% of this build, but that tiny timing gain does not justify leaving source corruption unfixed.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | stampgen | 8 | 1 | 70 aggregate estimated | Concurrent Exists-guarded writers | Generate before dispatch, replace only on change | unknown |

              Verdict: proposed correctness fix removing 7 concurrent writers; negligible timing benefit, not validated
    graders:
      - type: tool-calls
        config:
          disallowed: [edit, create]
      - type: run-command
        config:
          command: python
          args: [-c, *preserve-audit, ae891f69fb623f1c6cc90051801c84aa6fa8460ab2a358d3011f439141ed9c01]
          expected_exit_code: 0
      - *audit-table
      - *audit-verdict
      - type: prompt
    rubric:
      - Recommended fixing the demonstrated source-corruption race despite the negligible timing upper bound
      - Ensured one successful generation finishes before parallel readers and retained the shared compilation input and failure propagation
      - Preserved unchanged-content timestamps rather than unconditionally rewriting the generated source on every wrapper invocation
      - Distinguished the 70 ms estimated aggregate saving from the correctness benefit without claiming a measured build

  - name: Share a value between different targets in one project instance
    prompt: |
      Both consumers in audit/evidence.txt need the revision. Explain why it is computed twice and recommend how
      to compute it once without breaking Build-only or Pack-only use. Do not modify files or execute the build.
    tags: { capability: same-instance-cross-target-sharing, risk: medium, journey: audit }
    environment:
      files:
        - { src: ./audit-scenarios/two-targets-one-instance.txt, dest: audit/evidence.txt }
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: repeated-work-cross-target-sharing
        agent: *audit-agent
        steps:
          - step_id: 1
            source: agent
            message: |-
              The two Exec tasks live in different targets; target-once-per-instance semantics do not merge their bodies. Extract one revision-producing target and make both StampAssembly and StampPackage depend on it. In this single project instance, the shared dependency executes once before either consumer and exposes the same full revision to both. Keep both consumer hooks so either entry path obtains the value, rather than depending on Build to run before Pack. No cross-project global-state mechanism is required.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Git revision | 2 | 1 | 1500 estimated | Separate target bodies repeat one lookup | Shared dependency target for both consumers | unknown |

              Verdict: proposed removal of 1 execution; both standalone entry paths retained; wall-clock not validated
    graders:
      - type: tool-calls
        config:
          disallowed: [edit, create]
      - type: run-command
        config:
          command: python
          args: [-c, *preserve-audit, 710ea3d8de55e5b2305ba8e2dac4d45956616681c55b76fb95059e530046ef62]
          expected_exit_code: 0
      - *audit-table
      - *audit-verdict
      - type: prompt
    rubric:
      - Explained that identical tasks in different targets can execute twice in one project instance
      - Proposed one shared computation ordered before both consumers, valid for either standalone entry path
      - Preserved both full-revision consumers without assuming cross-project property sharing or requiring Build before Pack
      - Estimated one avoided call and 1500 ms without editing, executing or claiming measured performance

  - name: Decline evaluation-only global-property instances
    prompt: |
      A binlog shows Shared.csproj evaluated five times under different global properties. Evaluation accounts for
      almost all the delay, but its targets and tasks execute only once. How should I investigate that cost?
    tags:
      expect_activation: "false"
      capability: dormancy-property-variant-evaluation
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-property-evaluation-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The measured cost is project evaluation, not repeated target execution. Compare the evaluated global-property sets, then inspect evaluation timings, import chains, globs and file-I/O property functions. Use preprocessed output to locate expensive imports and preserve property variants that are actually required. Target run-once guards cannot remove this pre-target work.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(evaluat|preprocess|import|glob)
      - type: prompt
    rubric:
      - Identified evaluation as the measured bottleneck rather than duplicate target or task execution
      - Investigated evaluation work and distinct global-property sets without proposing a per-target run-once guard
      - Preserved required property variants

  - name: Decline collisions between required project variants
    prompt: |
      Build.proj builds Shared.csproj concurrently with PublishReadyToRun=true and PublishReadyToRun=false.
      We need both variants, but they use the same bin and obj directories and overwrite each other's files.
      How should I stop the failures without dropping either variant?
    tags:
      expect_activation: "false"
      capability: dormancy-property-variant-output-collision
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-property-collision-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              These are intentionally different variants, not redundant builds. Give each variant separate output and intermediate paths, setting the intermediate base before SDK imports so restore assets are isolated too. Verify that both configurations still produce their intended assemblies. Do not remove PublishReadyToRun or collapse the builds merely because they share a project path.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(OutputPath|IntermediateOutputPath|separate|isolat|distinct.*director)
      - type: prompt
    rubric:
      - Identified shared output and intermediate paths as the cause of the collision
      - Isolated both required variants' outputs and restore intermediates
      - Did not remove a required global property or collapse the variants into one build

  - name: Decline an unranked slow-build investigation
    prompt: |
      Our .NET solution builds slowly in CI, but we do not have timings or logs that show where the time goes.
      What should we collect first before deciding what to change?
    tags:
      expect_activation: "false"
      capability: dormancy-unranked-build-slowness
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-unranked-slowness-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Establish a baseline before choosing a fix. Record the SDK, original build command, configuration, machine and restore state. Measure comparable cold, warm and unchanged builds at least three times each, resetting the intended state before every sample and reporting medians and ranges. Capture a separate binary log for each sample without changing the original invocation's restore or parallelism behavior. Use those timings and logs to locate the dominant phase; do not assume compilation, restore or duplicate work is the bottleneck.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(measur|baseline|timing|profil|binlog|binary log)
      - type: prompt
    rubric:
      - Recommended collecting repeatable build timings and diagnostic logs before choosing an optimization
      - Kept the original invocation and build environment comparable across measurements
      - Did not assume a specific bottleneck or propose deduplication without evidence

  - name: Decline second-build rerun questions
    prompt: |
      On a second dotnet build of an unchanged checkout, CoreCompile still runs for every project instead of being skipped.
      Why does MSBuild not treat the projects as up to date?
    tags:
      expect_activation: "false"
      capability: dormancy-no-op-rebuild
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-no-op-rebuild-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              CoreCompile is skipped only when every input is older than the outputs it declares. A second build that still compiles means an input is newer than an output or a declared output is missing. Typical causes are a generator that rewrites a source file on every build, a Compile glob that picks up files in obj or bin, a timestamp written to an input, or an Inputs and Outputs list that does not match what the target really reads and writes. Build with a detailed log and look for the message that names the input or output that made the target run again.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(incremental|up-to-date|up to date|timestamp|inputs|outputs|FileWrites)
      - type: prompt
    rubric:
      - Recognized that the question is about a target rerunning on a second unchanged build, not duplicate executions
        within one build
      - Explained the incremental build mechanism, such as inputs and outputs, timestamps, or files that change on every build
      - Did not apply within-build deduplication fixes, such as computing a value outside the projects or removing global
        properties, to an incremental-build question

  - name: Decline repeated restore questions across CI commands
    prompt: |
      Our CI runs dotnet restore, dotnet build and dotnet test for the same solution. The logs show NuGet restore three
      times. How can we avoid the unnecessary restore work without skipping required package downloads?
    tags:
      expect_activation: "false"
      capability: dormancy-repeated-restores
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-restore-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is NuGet restore repeated across separate CI commands, not duplicate task execution inside one build. Restore once for the required project graph, frameworks, runtimes and configuration, then use dotnet build --no-restore and dotnet test --no-restore with matching inputs. Keep restore when package or project inputs change or assets are missing. The restore guidance belongs to eliminate-redundant-restores; changing per-project targets or removing global properties is not needed here.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(--no-restore|separate.*restore|restore once)
      - type: prompt
    rubric:
      - Recognized implicit NuGet restores across separate commands rather than repeated custom work inside one build
      - Recommended reusing a valid restore with matching project, framework, runtime and configuration inputs
      - Redirected restore analysis to the restore-performance guidance
      - Did not apply per-project deduplication fixes or remove global properties

  - name: Decline slow evaluation before target execution
    prompt: |
      dotnet build spends about 35 seconds before the first target starts, then compilation finishes in two seconds.
      Directory.Build.props has recursive globs and the repository imports many props and targets files. How should I
      investigate that startup delay?
    tags:
      expect_activation: "false"
      capability: dormancy-slow-evaluation
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-evaluation-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Time before targets start points to project evaluation, not repeated target or task execution. Capture a binlog of the original build and inspect evaluation durations and import/glob costs with the binlog MCP evaluation and imports tools; use eval-performance for that investigation. Preprocessing can show the expanded import structure, but measure first before rewriting globs or imports. Per-project task deduplication and run-once guards are not needed here.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(evaluation|imports|globs)
      - type: prompt
    rubric:
      - Distinguished evaluation before target execution from time spent compiling or running targets
      - Recommended measuring evaluation and inspecting expensive imports or glob traversal before editing build files
      - Redirected the startup-delay investigation to evaluation-performance analysis
      - Did not apply task deduplication or run-once guards to an evaluation problem

  - name: Decline idle-node questions on a serial project chain
    prompt: |
      Our CI runs dotnet msbuild Build.proj -m:16. Its MSBuild task schedules a Projects list of 12 distinct project
      files with BuildInParallel enabled. The binlog shows each project compiling once, but most worker nodes are idle
      while Core, Api and Web build one after another along their ProjectReference chain. Raising -m does not reduce
      elapsed time. How should I investigate and improve this?
    tags:
      expect_activation: "false"
      capability: dormancy-serial-project-chain
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-parallelism-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The idle nodes and Core -> Api -> Web dependency chain point to scheduling and a serial critical path, not repeated work: every project compiles once. Use build-parallelism to inspect the binlog node timeline and project timings, identify the longest dependency chain, and confirm which references are genuinely needed. More -m workers cannot run a dependent project before its prerequisite finishes. Keep legitimate work and required references; remove only proven unnecessary dependencies or reorganize independent work so it can run concurrently. Per-project run-once guards, merging Exec calls, or removing global properties do not address this evidence.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(critical path|serial.*chain|dependency.*chain)
      - type: output-matches
        config:
          pattern: (?i)(build-parallelism|parallelism analysis|scheduling analysis)
      - type: prompt
    rubric:
      - Recognized idle workers and the serial ProjectReference chain as scheduling or critical-path evidence rather
        than unnecessary repeated execution
      - Explained why raising the worker count cannot parallelize required dependencies and recommended inspecting
        the node timeline and project timings
      - Did not apply repeated-work fixes such as run-once guards, merging Exec calls or removing global properties
        to legitimate compilation, and did not remove required references
      - Redirected the investigation to build-parallelism
