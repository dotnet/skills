      - type: output-matches
        config:
          pattern: '(?m)^\|\s*Work\s*\|\s*Calls\s*\|\s*Expected\s*\|\s*Avoidable ms\s*\|\s*Cause\s*\|\s*Fix\s*\|\s*On critical path\?\s*\|\r?\n\|(?:\s*:?-+:?\s*\|){7}\r?\n\|(?:[^|\r\n]*\|){7}\s*$'
      - type: output-matches
        config:
          pattern: '(?m)^Verdict:[ \t]*\S[^\r\n]*$'
      - type: prompt
    rubric:
      - Compared the 36 calls of Csc and the other tasks with the 12 projects and three target frameworks and concluded the
        counts are expected
      - Concluded that no task is repeated unnecessarily
      - Did not invent a speedup or suggest removing multi-targeting

  - name: Leave a repeated task alone when it costs almost nothing
    prompt: |
      negligible-repeat/perf-summary.txt is the performance summary of the nightly build, and
      negligible-repeat/Directory.Build.targets is the repository's shared build logic. Tell me whether any work in this
      build is done more often than necessary and whether it is worth changing. Do not modify any file.
    constraints:
      reject_tools: [edit, create]
    tags:
      capability: negligible-win-stop-condition
      risk: medium
      journey: audit
    environment:
      files:
        - src: ./negligible-repeat
          dest: negligible-repeat
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-negligible-repeat"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The only repeat is the Exec in Directory.Build.targets, which runs 4 times because four deployment-test projects stamp the tool version. It costs 6.1 s in total. Making it run once could avoid about 4.59 s of task time. Even if all of that reduced wall-clock time, it is at most 0.43% of an 18 minute build; the 16-node count alone does not establish actual overlap. Csc and the other tasks run 212 times for 212 projects. I would not change anything: the added complexity is not worth the gain.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Tool-version probe | 4 | 1 | 4590 estimated | Invariant per-project probe | Leave unchanged: upper bound below 1% | unknown |

              Verdict: no repeated work worth changing
    graders:
      - type: run-command
        config:
          command: python
          args:
            - -c
            - |
              import hashlib, pathlib
              base = pathlib.Path('negligible-repeat')
              expected = {
                  'Directory.Build.targets': '04ec3ab2ea98c4814dcf0646404177408b7940c635dde20d97ce35cd245c7c50',
                  'perf-summary.txt': 'c9f2e67662ba7a144ab8aad46affbc247ad9d9acdc727b2e72ae94d8ad1f04f0',
              }
              actual = {p.relative_to(base).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in base.rglob('*') if p.is_file()}
              assert actual == expected, 'preserve every fixture file without edits, additions or deletions'
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: (?im)^Verdict:[ \t]*no repeated work worth changing[.!]?[ \t]*$
      - type: output-matches
        config:
          pattern: '(?m)^\|\s*Work\s*\|\s*Calls\s*\|\s*Expected\s*\|\s*Avoidable ms\s*\|\s*Cause\s*\|\s*Fix\s*\|\s*On critical path\?\s*\|\r?\n\|(?:\s*:?-+:?\s*\|){7}\r?\n\|(?:[^|\r\n]*\|){7}\s*$'
      - type: output-matches
        config:
          pattern: '(?m)^Verdict:[ \t]*\S[^\r\n]*$'
      - type: prompt
    rubric:
      - Found that the Exec runs 4 times for about 6 s in total
      - Compared the aggregate saving upper bound with the 18 minute wall-clock and concluded it is not worth changing
        without assuming every busy node divides that saving
      - Did not recommend a change to the Exec or invent other repeated work

  - name: Decline evaluation-only global-property instances
    prompt: |
      A binlog shows Shared.csproj evaluated five times under different global properties. Evaluation accounts for
      almost all the delay, but its targets and tasks execute only once. How should I investigate that cost?
    expect_activation: false
    tags:
      capability: dormancy-property-variant-evaluation
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-property-evaluation-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The measured cost is project evaluation, not repeated target execution. Compare the evaluated global-property sets, then inspect evaluation timings, import chains, globs and file-I/O property functions. Use preprocessed output to locate expensive imports and preserve property variants that are actually required. Target run-once guards cannot remove this pre-target work.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(evaluat|preprocess|import|glob)
      - type: prompt
    rubric:
      - Identified evaluation as the measured bottleneck rather than duplicate target or task execution
      - Investigated evaluation work and distinct global-property sets without proposing a per-target run-once guard
      - Preserved required property variants

  - name: Decline collisions between required project variants
    prompt: |
      Build.proj builds Shared.csproj concurrently with PublishReadyToRun=true and PublishReadyToRun=false.
      We need both variants, but they use the same bin and obj directories and overwrite each other's files.
      How should I stop the failures without dropping either variant?
    expect_activation: false
    tags:
      capability: dormancy-property-variant-output-collision
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-property-collision-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              These are intentionally different variants, not redundant builds. Give each variant separate output and intermediate paths, setting the intermediate base before SDK imports so restore assets are isolated too. Verify that both configurations still produce their intended assemblies. Do not remove PublishReadyToRun or collapse the builds merely because they share a project path.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(OutputPath|IntermediateOutputPath|separate|isolat|distinct.*director)
      - type: prompt
    rubric:
      - Identified shared output and intermediate paths as the cause of the collision
      - Isolated both required variants' outputs and restore intermediates
      - Did not remove a required global property or collapse the variants into one build

  - name: Decline an unranked slow-build investigation
    prompt: |
      Our .NET solution builds slowly in CI, but we do not have timings or logs that show where the time goes.
      What should we collect first before deciding what to change?
    expect_activation: false
    tags:
      capability: dormancy-unranked-build-slowness
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-unranked-slowness-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Establish a baseline before choosing a fix. Record the SDK, original build command, configuration, machine and restore state. Measure comparable cold, warm and unchanged builds at least three times each, resetting the intended state before every sample and reporting medians and ranges. Capture a separate binary log for each sample without changing the original invocation's restore or parallelism behavior. Use those timings and logs to locate the dominant phase; do not assume compilation, restore or duplicate work is the bottleneck.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(measur|baseline|timing|profil|binlog|binary log)
      - type: prompt
    rubric:
      - Recommended collecting repeatable build timings and diagnostic logs before choosing an optimization
      - Kept the original invocation and build environment comparable across measurements
      - Did not assume a specific bottleneck or propose deduplication without evidence

  - name: Decline second-build rerun questions
    prompt: |
      On a second dotnet build of an unchanged checkout, CoreCompile still runs for every project instead of being skipped.
      Why does MSBuild not treat the projects as up to date?
    expect_activation: false
    tags:
      capability: dormancy-no-op-rebuild
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-no-op-rebuild-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              CoreCompile is skipped only when every input is older than the outputs it declares. A second build that still compiles means an input is newer than an output or a declared output is missing. Typical causes are a generator that rewrites a source file on every build, a Compile glob that picks up files in obj or bin, a timestamp written to an input, or an Inputs and Outputs list that does not match what the target really reads and writes. Build with a detailed log and look for the message that names the input or output that made the target run again.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(incremental|up-to-date|up to date|timestamp|inputs|outputs|FileWrites)
      - type: prompt
    rubric:
      - Recognized that the question is about a target rerunning on a second unchanged build, not duplicate executions
        within one build
      - Explained the incremental build mechanism, such as inputs and outputs, timestamps, or files that change on every build
      - Did not apply within-build deduplication fixes, such as computing a value outside the projects or removing global
        properties, to an incremental-build question

  - name: Decline repeated restore questions across CI commands
    prompt: |
      Our CI runs dotnet restore, dotnet build and dotnet test for the same solution. The logs show NuGet restore three
      times. How can we avoid the unnecessary restore work without skipping required package downloads?
    expect_activation: false
    tags:
      capability: dormancy-repeated-restores
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-restore-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is NuGet restore repeated across separate CI commands, not duplicate task execution inside one build. Restore once for the required project graph, frameworks, runtimes and configuration, then use dotnet build --no-restore and dotnet test --no-restore with matching inputs. Keep restore when package or project inputs change or assets are missing. The restore guidance belongs to eliminate-redundant-restores; changing per-project targets or removing global properties is not needed here.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(--no-restore|separate.*restore|restore once)
      - type: prompt
    rubric:
      - Recognized implicit NuGet restores across separate commands rather than repeated custom work inside one build
      - Recommended reusing a valid restore with matching project, framework, runtime and configuration inputs
      - Redirected restore analysis to the restore-performance guidance
      - Did not apply per-project deduplication fixes or remove global properties

  - name: Decline slow evaluation before target execution
    prompt: |
      dotnet build spends about 35 seconds before the first target starts, then compilation finishes in two seconds.
      Directory.Build.props has recursive globs and the repository imports many props and targets files. How should I
      investigate that startup delay?
    expect_activation: false
    tags:
      capability: dormancy-slow-evaluation
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-evaluation-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Time before targets start points to project evaluation, not repeated target or task execution. Capture a binlog of the original build and inspect evaluation durations and import/glob costs with the binlog MCP evaluation and imports tools; use eval-performance for that investigation. Preprocessing can show the expanded import structure, but measure first before rewriting globs or imports. Per-project task deduplication and run-once guards are not needed here.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(evaluation|imports|globs)
      - type: prompt
    rubric:
      - Distinguished evaluation before target execution from time spent compiling or running targets
      - Recommended measuring evaluation and inspecting expensive imports or glob traversal before editing build files
      - Redirected the startup-delay investigation to evaluation-performance analysis
      - Did not apply task deduplication or run-once guards to an evaluation problem

  - name: Decline idle-node questions on a serial project chain
    prompt: |
      Our CI runs dotnet msbuild Build.proj -m:16. Its MSBuild task schedules a Projects list of 12 distinct project
      files with BuildInParallel enabled. The binlog shows each project compiling once, but most worker nodes are idle
      while Core, Api and Web build one after another along their ProjectReference chain. Raising -m does not reduce
      elapsed time. How should I investigate and improve this?
    expect_activation: false
    tags:
      capability: dormancy-serial-project-chain
      risk: routing
      journey: boundary-condition
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-parallelism-dormancy"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The idle nodes and Core -> Api -> Web dependency chain point to scheduling and a serial critical path, not repeated work: every project compiles once. Use build-parallelism to inspect the binlog node timeline and project timings, identify the longest dependency chain, and confirm which references are genuinely needed. More -m workers cannot run a dependent project before its prerequisite finishes. Keep legitimate work and required references; remove only proven unnecessary dependencies or reorganize independent work so it can run concurrently. Per-project run-once guards, merging Exec calls, or removing global properties do not address this evidence.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(critical path|serial.*chain|dependency.*chain)
      - type: output-matches
        config:
          pattern: (?i)(build-parallelism|parallelism analysis|scheduling analysis)
      - type: prompt
    rubric:
      - Recognized idle workers and the serial ProjectReference chain as scheduling or critical-path evidence rather
        than unnecessary repeated execution
      - Explained why raising the worker count cannot parallelize required dependencies and recommended inspecting
        the node timeline and project timings
      - Did not apply repeated-work fixes such as run-once guards, merging Exec calls or removing global properties
        to legitimate compilation, and did not remove required references
      - Redirected the investigation to build-parallelism
