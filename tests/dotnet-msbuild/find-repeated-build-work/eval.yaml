                  'perf-summary.txt': '1d6e09453c0776384f64e432938ca515476e14b63af02f328d38dedd8a39107f',
              }
              actual = {p.relative_to(base).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
