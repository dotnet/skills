name: find-repeated-build-work
tags:
  executionShard: heavy
description: Evaluates the dotnet-msbuild/find-repeated-build-work skill
type: capability
defaults:
  timeout: 6m
stimuli:
  - name: Compute a per-project git lookup once for the whole build
    prompt: |
      git-stamp/perf-summary.txt is the performance summary of the CI build that runs git-stamp/build.sh. Cut the build
      time that is not spent compiling, without changing the informational version stamped into each assembly. You
      cannot run the build from here, so work from the repository files. Developers also run dotnet build inside a
      single project directory.
    tags:
      capability: invariant-per-project-exec
      risk: high
      journey: apply-fix
    environment:
      files:
        - src: ./git-stamp
          dest: git-stamp
    golden_patch:
      path: ./references/compute-once-pass-global-property.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-git-stamp"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The Task Performance Summary shows Exec with 38 calls for a solution of 38 projects, about 1970 ms each, so the git lookup in Directory.Build.targets starts a process in every project and gives the same answer each time. Removing 37 calls could avoid about 72.89 s of aggregate task time; the summary does not show actual overlap, so eight cores alone do not establish a wall-clock saving. I could not run the build here, so this is not validated. The commit id is now computed once in build.sh and passed as -p:GitCommit, which every project inherits as a global property. The Exec in Directory.Build.targets only runs when GitCommit is empty, so a single-project dotnet build still gets a stamp. The version assignment remains unconditional. I did not use a flag property or an Exists check to skip the Exec, because properties are per project instance and the worker nodes are separate processes. The informational version remains 3.2.0 plus the same short commit id.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Git lookup | 38 | 1 | 72890 estimated | Build-invariant command in every project | Compute once and pass GitCommit; keep fallback | unknown |

              Verdict: proposed removal of 37 repeated executions; estimated task-time saving 72.89 s; wall-clock not validated
    graders:
      - type: run-command
        config:
          command: python
          args:
            - -c
            - |
              import os, pathlib, re, shutil, subprocess, tempfile, uuid
              import xml.etree.ElementTree as ET
              root = ET.parse('git-stamp/Directory.Build.targets').getroot()
              informational = [p for p in root.iter() if p.tag.lower() == 'informationalversion']
              assert informational and all(p.text == '$(Version)+$(GitCommit)' for p in informational), 'the stamped version format changed'
              props = ET.parse('git-stamp/Directory.Build.props').getroot()
              versions = [p.text for group in props.findall('PropertyGroup') if not group.get('Condition')
                          for p in group if p.tag.lower() == 'version' and not p.get('Condition')]
              assert versions and versions[-1] == '3.2.0', 'preserve the stamped base version'
              assert all(p.text == '3.2.0' for document in [props, root] for p in document.iter() if p.tag.lower() == 'version'), 'no assignment may change the base version'
              assignments = [p for t in root.findall('Target') if not t.get('Condition')
                             and 'GetAssemblyAttributes' in t.get('BeforeTargets', '').split(';')
                             for group in t.findall('PropertyGroup') if not group.get('Condition')
                             for p in group if p.tag.lower() == 'informationalversion' and not p.get('Condition')
                             and p.text == '$(Version)+$(GitCommit)']
              assert assignments, 'the version assignment must still execute when GitCommit is supplied'
              fallbacks = [
                  (target, task) for target in root.findall('Target') for task in target.findall('Exec')
                  if task.get('Command') == 'git rev-parse --short HEAD'
              ]
              assert len(fallbacks) == 1, 'single-project builds need a commit lookup fallback'
              target, task = fallbacks[0]
              guarded = lambda element: re.fullmatch(r"\s*'\$\(GitCommit\)'\s*==\s*''\s*", element.get('Condition', ''))
              assert guarded(target) or guarded(task), 'the per-project git lookup must be skipped when GitCommit is supplied'
              assert any(o.get('TaskParameter') == 'ConsoleOutput' and o.get('PropertyName') == 'GitCommit'
                         for o in task.findall('Output')), 'the fallback must supply GitCommit'
              bash = shutil.which('bash')
              assert bash, 'Bash is required to check build.sh with mocked git and dotnet'
              dotnet = shutil.which('dotnet')
              assert dotnet, 'the .NET SDK is required to check the commit before its first consumer'
              with tempfile.TemporaryDirectory() as tmp:
                  bin_dir = pathlib.Path(tmp)
                  mocks = {
                      'git': '#!/usr/bin/env bash\nprintf "%s\\n" "$*" >> "$MOCK_BIN/git-calls"\nprintf "%s\\n" "$EXPECTED_COMMIT"\n',
                      'dotnet': '#!/usr/bin/env bash\nrecord="$(mktemp "$MOCK_BIN/dotnet-call.XXXXXX")"\nprintf "%s\\0" "$@" > "$record"\n',
                  }
                  for name, text in mocks.items():
                      path = bin_dir / name
                      path.write_text(text, encoding='utf-8', newline='\n')
                      path.chmod(0o755)
                  if os.name == 'nt':
                      (bin_dir / 'git.cmd').write_text(
                          '@echo off\necho %*>>"%MOCK_BIN%\\git-calls"\necho %EXPECTED_COMMIT%\n',
                          encoding='utf-8', newline='\r\n',
                      )
                  probe = ET.Element('Project')
                  defaults = ET.SubElement(probe, 'PropertyGroup')
                  ET.SubElement(defaults, 'Configuration', Condition="'$(Configuration)' == ''").text = 'Debug'
                  for name in ['Directory.Build.props', 'Directory.Build.targets']:
                      ET.SubElement(probe, 'Import', Project=str(pathlib.Path('git-stamp', name).resolve()))
                  ET.SubElement(probe, 'Target', Name='Restore')
                  consumer = ET.SubElement(probe, 'Target', Name='GetAssemblyAttributes')
                  ET.SubElement(ET.SubElement(consumer, 'PropertyGroup'), 'ObservedInformationalVersion').text = '$(InformationalVersion)'
                  probe_path = bin_dir / 'stamp.proj'
                  ET.ElementTree(probe).write(probe_path, encoding='utf-8')
                  for _ in range(2):
                      commit = uuid.uuid4().hex[:7]
                      for path in [bin_dir / 'git-calls', *bin_dir.glob('dotnet-call.*')]:
                          path.unlink(missing_ok=True)
                      env = dict(os.environ, MOCK_BIN=tmp, EXPECTED_COMMIT=commit)
                      subprocess.run(
                          [bash, '-c', 'export MOCK_BIN="$(cd "$MOCK_BIN" && pwd)"; export PATH="$MOCK_BIN:$PATH"; bash build.sh'],
                          cwd='git-stamp', env=env, check=True, timeout=20,
                      )
                      assert (bin_dir / 'git-calls').read_text().splitlines() == ['rev-parse --short HEAD'], 'compute the current short commit exactly once'
                      calls = [[arg.decode() for arg in path.read_bytes().split(b'\0')[:-1]]
                               for path in bin_dir.glob('dotnet-call.*')]
                      builds = [call for call in calls if call and call[0] in ['build', 'msbuild']]
                      assert len(builds) == 1 and builds[0][1:2] == ['Contoso.slnx'], 'require exactly one solution build'
                      args = builds[0]
                      values = []
                      for index, arg in enumerate(args):
                          match = re.fullmatch(r'(?:--property|[-/]p(?:roperty)?)(?::|=)(.+)', arg, re.I)
                          if match:
                              values.append(match[1])
                          elif arg.lower() in ['--property', '-p', '/p', '-property', '/property']:
                              assert index + 1 < len(args), 'property switches require a value'
                              values.append(args[index + 1])
                      assignments = [p for value in values for p in value.split(';')]
                      commits = [p.partition('=')[2] for p in assignments if p.partition('=')[0].lower() == 'gitcommit']
                      assert commits and commits[-1] == commit, 'pass the actual git result, not an empty, fixed or undefined value'
                      assert all(p.partition('=')[2] == '3.2.0' for p in assignments if p.partition('=')[0].lower() == 'version'), 'the build must not override the base version'
                      assert all(p.partition('=')[2] == '3.2.0+' + commit for p in assignments if p.partition('=')[0].lower() == 'informationalversion'), 'the build must not override the stamped version'
                      parallel = [match[1] for arg in args
                                  if (match := re.fullmatch(r'(?:--?|/)(?:m|maxcpucount)(?::(\d+))?', arg, re.I))]
                      assert parallel and (parallel[-1] is None or int(parallel[-1]) > 1), 'preserve parallel execution, not a missing switch or single worker'
                      build_in_parallel = [p.partition('=')[2] for p in assignments if p.partition('=')[0].lower() == 'buildinparallel']
                      assert not build_in_parallel or build_in_parallel[-1].strip().lower() not in ['false', 'off', 'no', '0'], 'do not disable parallel execution through global properties'
                      configuration = subprocess.run(
                          [dotnet, args[0], str(probe_path), *args[2:], '-nologo', '-verbosity:quiet',
                           '-getProperty:Configuration'],
                          cwd=bin_dir, env=env, capture_output=True, text=True, timeout=30,
                      )
                      assert configuration.returncode == 0, configuration.stdout + configuration.stderr
                      assert configuration.stdout.strip() == 'Release', 'preserve the effective Release configuration'
                      for supplied in [False, True]:
                          (bin_dir / 'git-calls').unlink(missing_ok=True)
                          command = [dotnet, 'msbuild', str(probe_path), '-nologo', '-verbosity:quiet',
                                     '-nodeReuse:false', '-target:GetAssemblyAttributes', '-getProperty:ObservedInformationalVersion']
                          if supplied:
                              command.append('-p:GitCommit=' + commit)
                          result = subprocess.run(
                              command, cwd=bin_dir, env=dict(env, PATH=tmp + os.pathsep + os.environ['PATH']),
                              capture_output=True, text=True, timeout=30,
                          )
                          assert result.returncode == 0, result.stdout + result.stderr
                          assert result.stdout.strip() == '3.2.0+' + commit, 'the commit and version must be ready before GetAssemblyAttributes consumes them'
                          log = bin_dir / 'git-calls'
                          calls = log.read_text().splitlines() if log.exists() else []
                          assert calls == ([] if supplied else ['rev-parse --short HEAD']), 'the fallback must run once only when GitCommit is absent'
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: '(?m)^\|\s*Work\s*\|\s*Calls\s*\|\s*Expected\s*\|\s*Avoidable ms\s*\|\s*Cause\s*\|\s*Fix\s*\|\s*On critical path\?\s*\|\r?\n\|(?:\s*:?-+:?\s*\|){7}\r?\n\|(?:[^|\r\n]*\|){7}\s*$'
      - type: output-matches
        config:
          pattern: '(?m)^Verdict:[ \t]*\S[^\r\n]*$'
      - type: prompt
    rubric:
      - Identified from the Exec call count (38 calls for 38 projects) that the same git lookup runs in every project
      - Computed the commit id once, for example in build.sh passed as a global property, and made the per-project Exec
        run only when the property is empty so single-project builds keep a stamp
      - Did not rely on a flag property or Exists check to dedupe the work across projects
      - Kept the informational version in the same format
      - Did not claim the build was run or the saving measured

  - name: Stop a shared project from being built once per caller
    prompt: |
      shared-project-instances/perf-summary.txt is the performance summary of the CI build that runs
      shared-project-instances/build.sh. Most of the time in it is spent in Core. Reduce the build time without changing
      what Web, Api and Worker produce: each must still get its own component name in its AssemblyTitle. You cannot run
      the build from here, so work from the repository files.
    tags:
      capability: global-property-instances
      risk: high
      journey: apply-fix
    environment:
      files:
        - src: ./shared-project-instances
          dest: shared-project-instances
    golden_patch:
      path: ./references/remove-property-from-shared-reference.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-shared-project-instances"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Core.csproj shows 3 calls in the Project Performance Summary, about 21 s each, although it is one project. Build.proj passes Properties="ComponentName=%(Component.Filename)" to each component, and every component then builds its reference to Core with that global property inherited. A different global property makes a different project instance, so Core is built once per component even though it never reads ComponentName. I added GlobalPropertiesToRemove="ComponentName" to the Core ProjectReference in Web, Api and Worker, so Core is built with the same properties every time and only once. The components still receive ComponentName for their AssemblyTitle. Not validated: I could not run the build here. Rebuilding with a binlog should show Core.csproj with 1 call.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Core project | 3 | 1 | 42060 estimated | ComponentName creates distinct global-property instances | Remove ComponentName only on Core references | unknown |

              Verdict: proposed removal of 2 repeated executions; estimated project-time saving 42.06 s; wall-clock not validated
    graders:
      - type: run-command
        config:
          command: python
          args:
            - -c
            - |
              import fnmatch, os, pathlib, re, shutil, subprocess, tempfile
              import xml.etree.ElementTree as ET
              base = pathlib.Path('shared-project-instances')
              build = ET.parse(base / 'Build.proj').getroot()
              normalize = lambda path: str(pathlib.PurePosixPath(path.replace('\\', '/'))).lower()
              items = {}
              for group in build.findall('ItemGroup'):
                  if group.get('Condition'):
                      continue
                  for item in group:
                      if item.get('Condition'):
                          continue
                      values = items.setdefault(item.tag, [])
                      excluded = [normalize(p.strip()) for p in item.get('Exclude', '').split(';') if p.strip()]
                      included = [normalize(p.strip()) for p in item.get('Include', '').split(';') if p.strip()]
                      values.extend(p for p in included if not any(fnmatch.fnmatchcase(p, pattern) for pattern in excluded))
                      for pattern in item.get('Remove', '').split(';'):
                          if pattern.strip():
                              values[:] = [p for p in values if not fnmatch.fnmatchcase(p, normalize(pattern.strip()))]
              targets = {t.get('Name'): t for t in build.findall('Target') if not t.get('Condition')}
              pending = build.get('DefaultTargets', '').split(';')
              visited, tasks = set(), []
              while pending:
                  name = pending.pop().strip()
                  if name in visited:
                      continue
                  assert name in targets, 'the default build target must exist'
                  visited.add(name)
                  target = targets[name]
                  pending.extend(n for n in target.get('DependsOnTargets', '').split(';') if n.strip())
                  for task in target.findall('MSBuild'):
                      if task.get('Condition'):
                          continue
                      if not {'Build', 'Rebuild'} & {n.strip() for n in (task.get('Targets') or 'Build').split(';')}:
                          continue
                      projects = re.sub(r'@\((\w+)\)', lambda m: ';'.join(items.get(m[1], [])), task.get('Projects', ''))
                      assert '@(' not in projects and '$(' not in projects, 'resolve the MSBuild Projects input'
                      roots = {normalize(p.strip()) for p in projects.split(';') if p.strip()}
                      tasks.append((task, roots))
              expected_roots = {normalize(f'{c}/{c}.csproj') for c in ['Web', 'Api', 'Worker']}
              assert expected_roots <= set().union(*(roots for _, roots in tasks)), 'Web, Api and Worker must all remain build roots'
              shared_path = base / 'Directory.Build.targets'
              shared = ET.parse(shared_path).getroot() if shared_path.exists() else ET.Element('Project')
              def references(project):
                  return [r for group in project.findall('ItemGroup') if not group.get('Condition')
                          for r in group.findall('ProjectReference') if not r.get('Condition')]
              def removal_metadata(reference, default=''):
                  if 'GlobalPropertiesToRemove' in reference.attrib:
                      return reference.get('GlobalPropertiesToRemove')
                  child = reference.find('GlobalPropertiesToRemove')
                  if child is None or child.get('Condition'):
                      return default
                  return child.text or ''
              for component in ['Web', 'Api', 'Worker']:
                  component_path = normalize(f'{component}/{component}.csproj')
                  passes_name = False
                  for task, roots in tasks:
                      if component_path not in roots:
                          continue
                      for assignment in task.get('Properties', '').split(';'):
                          match = re.fullmatch(r'ComponentName=%\((\w+)\.Filename\)', assignment.strip())
                          if match and '@(' + match[1] + ')' in task.get('Projects', ''):
                              passes_name = True
                          elif assignment.strip() == 'ComponentName=' + component and roots == {component_path}:
                              passes_name = True
                  root = ET.parse(base / component / (component + '.csproj')).getroot()
                  title = root.findtext('.//AssemblyTitle', '')
                  name = root.findtext('.//ComponentName', '')
                  assert (title == 'Contoso ' + component or
                          title == 'Contoso $(ComponentName)' and (passes_name or name == component)), 'component AssemblyTitle changed'
                  refs = [r for r in references(root)
                          if normalize(r.get('Include', '')) == '../core/core.csproj']
                  assert refs, 'the component must still reference Core'
                  if not passes_name:
                      continue
                  for ref in refs:
                      metadata = removal_metadata(ref)
                      applicable = references(root)
                      updates = applicable[applicable.index(ref) + 1:] + references(shared)
                      for update in updates:
                          pattern = update.get('Update', '')
                          if pattern and any(fnmatch.fnmatchcase(normalize(ref.get('Include')), normalize(p.strip())) for p in pattern.split(';')):
                              metadata = removal_metadata(update, metadata)
                      assert 'ComponentName' in [p.strip() for p in metadata.split(';')], 'ComponentName still reaches Core: removal must be metadata on its ProjectReference'
              dotnet = shutil.which('dotnet')
              bash = shutil.which('bash')
              assert dotnet and bash, 'the .NET SDK and Bash are required to exercise the submitted build'
              with tempfile.TemporaryDirectory() as tmp:
                  work = (pathlib.Path(tmp) / 'work').resolve()
                  shutil.copytree(base, work, ignore=shutil.ignore_patterns('bin', 'obj'))
                  logs = (pathlib.Path(tmp) / 'logs').resolve()
                  (logs / 'core').mkdir(parents=True)
                  core_path = work / 'Core' / 'Core.csproj'
                  core = ET.parse(core_path)
                  record = ET.SubElement(core.getroot(), 'Target', Name='_GraderRecordCoreBuild', BeforeTargets='Build')
                  ET.SubElement(record, 'WriteLinesToFile', Overwrite='true', Encoding='UTF-8',
                                File=str(logs / 'core' / '$([System.Guid]::NewGuid()).txt'), Lines='$(TargetPath)')
                  core.write(core_path, encoding='utf-8')
                  for component in ['Web', 'Api', 'Worker']:
                      path = work / component / (component + '.csproj')
                      project = ET.parse(path)
                      record = ET.SubElement(project.getroot(), 'Target', Name='_GraderRecordComponentBuild', AfterTargets='Build')
                      ET.SubElement(record, 'WriteLinesToFile', File=str(logs / (component + '.txt')),
                                    Lines="$(AssemblyTitle);$(TargetPath);@(ReferencePathWithRefAssemblies->'%(FullPath)')",
                                    Overwrite='true', Encoding='UTF-8')
                      project.write(path, encoding='utf-8')
                  result = subprocess.run(
                      [bash, 'build.sh'], cwd=work, env=dict(os.environ, MSBUILDDISABLENODEREUSE='1'),
                      capture_output=True, text=True, timeout=120,
                  )
                  assert result.returncode == 0, result.stdout + result.stderr
                  calls = list((logs / 'core').glob('*.txt'))
                  assert len(calls) == 1, 'the submitted BuildAll path must build Core exactly once'
                  core_output = pathlib.Path(calls[0].read_text(encoding='utf-8-sig').strip()).resolve()
                  assert core_output.is_relative_to(work) and core_output.is_file() and core_output.name == 'Core.dll', 'Core must produce its assembly on a clean build'
                  for component in ['Web', 'Api', 'Worker']:
                      lines = (logs / (component + '.txt')).read_text(encoding='utf-8-sig').splitlines()
                      assert lines[0] == 'Contoso ' + component, 'preserve the effective component AssemblyTitle'
                      output = pathlib.Path(lines[1]).resolve()
                      assert output.is_relative_to(work) and output.is_file() and output.name == component + '.dll', 'each component must still produce its assembly'
                      references = [pathlib.Path(p).resolve() for p in lines[2:]]
                      assert any(p.name == 'Core.dll' and p.is_relative_to(work / 'Core') and p.is_file()
                                 for p in references), 'Core must remain an actual compilation reference'
                      assert (output.parent / 'Core.dll').read_bytes() == core_output.read_bytes(), 'each component must retain the built Core copy'
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: (?i)(global propert|project instance)
      - type: output-matches
        config:
          pattern: '(?m)^\|\s*Work\s*\|\s*Calls\s*\|\s*Expected\s*\|\s*Avoidable ms\s*\|\s*Cause\s*\|\s*Fix\s*\|\s*On critical path\?\s*\|\r?\n\|(?:\s*:?-+:?\s*\|){7}\r?\n\|(?:[^|\r\n]*\|){7}\s*$'
      - type: output-matches
        config:
          pattern: '(?m)^Verdict:[ \t]*\S[^\r\n]*$'
      - type: prompt
    rubric:
      - Identified from Core.csproj having several calls that the same project is built once per distinct set of global
        properties
      - Traced the cause to the ComponentName property passed by Build.proj and inherited through the ProjectReference
      - Kept each component's own AssemblyTitle, for example by removing ComponentName only on the reference to Core with
        GlobalPropertiesToRemove, instead of deleting the property from the components
      - Did not claim the build was run or the saving measured

  - name: Generate a shared file before the parallel build starts
    prompt: |
      Intermittently the Build step in exists-sentinel-race fails with the error in
      exists-sentinel-race/failure-log.txt, and a re-run passes. Fix the cause so the failure cannot depend on timing.
      Everyone builds through exists-sentinel-race/build.sh, and every project must still compile obj/buildinfo.g.cs.
      An unchanged rerun must not force every project to compile again.
      You cannot run the build from here, so work from the repository files.
    tags:
      capability: racy-run-once-guard
      risk: high
      journey: apply-fix
    environment:
      files:
        - src: ./exists-sentinel-race
          dest: exists-sentinel-race
    golden_patch:
      path: ./references/generate-before-build.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-exists-sentinel-race"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              The target in Directory.Build.targets is meant to generate buildinfo.g.cs once, but its Exists check is evaluated separately in every project, and with -m the projects build in separate worker processes. Several of them see no file at the same moment and each run the generator, which is why Exec shows 9 calls for 24 projects and why one writer sometimes hits Text file busy. A flag property would not help because properties are per project instance. I removed the generation from the per-project target and build.sh now runs tools/make-buildinfo.sh once into a temporary file, before dotnet build. It publishes that file only when its content differs, keeping the compiled file's timestamp on an unchanged rerun and updating it when the daily stamp changes. The Compile item still includes it. Not validated: I could not run the build here.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Shared file generation | 9 | 1 | 3480 estimated | Per-project check-then-write race | Generate once and finish before the parallel build | unknown |

              Verdict: proposed removal of 8 repeated executions; estimated task-time saving 3.48 s; wall-clock not validated
    graders:
      - type: run-command
        config:
          command: python
          args:
            - -c
            - |
              import datetime, os, pathlib, shutil, subprocess, tempfile, uuid
              import xml.etree.ElementTree as ET
              base = pathlib.Path('exists-sentinel-race')
              root = ET.parse(base / 'Directory.Build.targets').getroot()
              bash = shutil.which('bash')
              assert bash, 'Bash is required to exercise build.sh'
              real_dotnet = shutil.which('dotnet')
              assert real_dotnet, 'the .NET SDK is required to exercise per-project generation hooks'
              with tempfile.TemporaryDirectory() as tmp:
                  work = pathlib.Path(tmp) / 'work'
                  shutil.copytree(base, work)
                  bin_dir = pathlib.Path(tmp) / 'bin'
                  bin_dir.mkdir()
                  projects = []
                  phases = ['BeforeBuild', 'PrepareForBuild', 'BeforeCompile', 'CoreCompile', 'AfterBuild']
                  submitted_targets = {target.get('Name') for target in root.findall('Target')}
                  observations = []
                  compile_observations = []
                  for name in ['Api', 'Worker']:
                      project_dir = work / 'probes' / name
                      project_dir.mkdir(parents=True)
                      probe = ET.Element('Project')
                      properties = ET.SubElement(probe, 'PropertyGroup')
                      for property_name, value in [('Configuration', 'Release'), ('TargetFramework', 'net10.0'),
                                                   ('IsCrossTargetingBuild', 'false'),
                                                   ('BuildDependsOn', ';'.join(phases))]:
                          ET.SubElement(properties, property_name).text = value
                      ET.SubElement(probe, 'Import', Project=str((work / 'Directory.Build.targets').resolve()))
                      for phase in phases:
                          if phase not in submitted_targets:
                              ET.SubElement(probe, 'Target', Name=phase)
                      if 'Build' not in submitted_targets:
                          ET.SubElement(probe, 'Target', Name='Build', DependsOnTargets='$(BuildDependsOn)')
                      observation = bin_dir / (name + '.built')
                      observations.append((name, observation))
                      observer = ET.SubElement(probe, 'Target', Name='ObserveProbeBuild_' + uuid.uuid4().hex,
                                               AfterTargets='Build')
                      ET.SubElement(observer, 'WriteLinesToFile', File=str(observation.resolve()),
                                    Lines='$(MSBuildProjectName)', Overwrite='true')
                      compiler = ET.SubElement(probe, 'Target', Name='ObserveCompile_' + uuid.uuid4().hex,
                                               BeforeTargets='CoreCompile')
                      for phase, target in [('compile', compiler), ('built', observer)]:
                          items = bin_dir / (name + '.' + phase + '.compile-items')
                          compile_observations.append(items)
                          ET.SubElement(target, 'WriteLinesToFile', File=str(items.resolve()),
                                        Lines="@(Compile->'%(FullPath)')", Overwrite='true')
                      project_path = project_dir / (name + '.proj')
                      ET.ElementTree(probe).write(project_path, encoding='utf-8')
                      projects.append(str(project_path.resolve()))
                  graph = ET.Element('Project', DefaultTargets='Build')
                  ET.SubElement(graph, 'Target', Name='Restore')
                  build = ET.SubElement(graph, 'Target', Name='Build')
                  ET.SubElement(build, 'MSBuild', Projects=';'.join(projects), Targets='Build', BuildInParallel='true')
                  graph_path = work / 'probe-build.proj'
                  ET.ElementTree(graph).write(graph_path, encoding='utf-8')
                  generator = work / 'tools/make-buildinfo.sh'
                  generator.rename(generator.with_name('make-buildinfo.submitted.sh'))
                  generator.write_text(
                      '#!/usr/bin/env sh\nset -eu\n'
                      'export MOCK_BIN="$(cd "$MOCK_BIN" && pwd)"\n'
                      'printf "generator-start\\n" >> "$MOCK_BIN/events"\n'
                      'sleep 1\n'
                      'sh "$(dirname "$0")/make-buildinfo.submitted.sh" "$@"\n'
                      'printf "generator-done\\n" >> "$MOCK_BIN/events"\n',
                      encoding='utf-8', newline='\n',
                  )
                  real_date = subprocess.run([bash, '-c', 'command -v date'], check=True,
                                             capture_output=True, text=True).stdout.strip()
                  assert real_date, 'GNU date is required to vary the submitted generator input'
                  date = bin_dir / 'date'
                  date.write_text(
                      '#!/usr/bin/env sh\nset -eu\n'
                      '"$REAL_DATE" --date="$EXPECTED_DATE" "$@"\n',
                      encoding='utf-8', newline='\n',
                  )
                  date.chmod(0o755)
                  dotnet = bin_dir / 'dotnet'
                  dotnet.write_text(
                      '#!/usr/bin/env sh\nset -eu\n'
                      'printf "build\\n" >> "$MOCK_BIN/events"\n'
                      '[ "$1" = build ] || [ "$1" = msbuild ]\n'
                      '[ "$2" = Contoso.slnx ]\n'
                      'cmp obj/buildinfo.g.cs "$MOCK_BIN/expected-buildinfo"\n'
                      'stat -c %Y obj/buildinfo.g.cs >> "$MOCK_BIN/mtimes"\n'
                      'mode="$1"\nshift 2\n'
                      '"$REAL_DOTNET" "$mode" probe-build.proj "$@" -nologo -verbosity:quiet\n',
                      encoding='utf-8', newline='\n',
                  )
                  dotnet.chmod(0o755)
                  env = dict(os.environ, MOCK_BIN=str(bin_dir), REAL_DATE=real_date,
                             REAL_DOTNET=pathlib.Path(real_dotnet).as_posix())
                  expected = bin_dir / 'expected-buildinfo'
                  stamp = datetime.date(2040, 1, 1) + datetime.timedelta(days=uuid.uuid4().int % 20000)
                  def set_stamp(value):
                      env['EXPECTED_DATE'] = value.isoformat() + ' 00:00:00 UTC'
                      expected.write_bytes(
                          ('internal static class BuildInfo { public const string Stamp = "' +
                           value.strftime('%Y%m%d') + '"; }\n').encode('utf-8')
                      )
                  set_stamp(stamp)
                  generated = work / 'obj/buildinfo.g.cs'
                  def run_build():
                      for path in [path for _, path in observations] + compile_observations:
                          path.unlink(missing_ok=True)
                      subprocess.run(
                          [bash, '-c', 'export MOCK_BIN="$(cd "$MOCK_BIN" && pwd)"; export PATH="$MOCK_BIN:$PATH"; bash build.sh'],
                          cwd=work, env=env, check=True, timeout=20,
                      )
                      assert all(path.is_file() and path.read_text(encoding='utf-8-sig').strip() == name
                                 for name, path in observations), 'exercise both project Build paths and their submitted target hooks'
                      assert all(path.is_file() and generated.resolve() in [
                          pathlib.Path(line).resolve() for line in path.read_text(encoding='utf-8-sig').splitlines()
                      ] for path in compile_observations), 'each project must retain buildinfo.g.cs in effective Compile items at the compile and build boundaries'
                      assert (bin_dir / 'events').read_text().splitlines() == ['generator-start', 'generator-done', 'build'], 'generate exactly once and await its required output before building'
                      assert generated.read_bytes() == expected.read_bytes(), 'preserve the original daily build-info output bytes'
                      (bin_dir / 'events').unlink()
                      return generated.stat().st_mtime_ns
                  run_build()
                  previous = generated.stat()
                  os.utime(generated, ns=(previous.st_atime_ns, previous.st_mtime_ns - 20_000_000_000))
                  unchanged_mtime = generated.stat().st_mtime_ns
                  assert run_build() == unchanged_mtime, 'an identical second build must preserve the generated-source timestamp'
                  assert int((bin_dir / 'mtimes').read_text().splitlines()[-1]) == unchanged_mtime // 1_000_000_000, 'preserve the unchanged timestamp before the build consumes the source'
                  set_stamp(stamp + datetime.timedelta(days=1))
                  assert run_build() > previous.st_mtime_ns, 'changed generated content must advance the source timestamp'
                  mtimes = [int(value) for value in (bin_dir / 'mtimes').read_text().splitlines()]
                  assert mtimes[-1] > mtimes[0], 'publish the changed timestamp before the build consumes the source'
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: '(?m)^\|\s*Work\s*\|\s*Calls\s*\|\s*Expected\s*\|\s*Avoidable ms\s*\|\s*Cause\s*\|\s*Fix\s*\|\s*On critical path\?\s*\|\r?\n\|(?:\s*:?-+:?\s*\|){7}\r?\n\|(?:[^|\r\n]*\|){7}\s*$'
      - type: output-matches
        config:
          pattern: '(?m)^Verdict:[ \t]*\S[^\r\n]*$'
      - type: prompt
    rubric:
      - Explained that the Exists check runs separately in every project and, with -m, in separate worker processes, so
        several projects can run the generator at the same time
      - Moved the generation so it happens once before the parallel build, for example a step in build.sh before
        dotnet build, and did not rely on a flag property or another check-then-write guard inside the per-project target
      - Kept obj/buildinfo.g.cs compiled by every project
      - Preserved the generated-source timestamp on an identical second build, while still publishing changed generated content
      - Did not claim the failure was reproduced or the fix verified

  - name: Replace one generator process per file with one process for the list
    prompt: |
      per-file-exec/perf-summary.txt shows where the build of Contoso.Schemas spends its time, and
      per-file-exec/tools/schemagen.md describes the generator it uses. The real schemas directory has about 120 files;
      three samples are checked in here. Reduce the generation cost. The generated output must stay identical. You cannot
      run the build from here, so work from the repository files.
    tags:
      capability: per-item-exec
      risk: medium
      journey: apply-fix
    environment:
      files:
        - src: ./per-file-exec
          dest: per-file-exec
    golden_patch:
      path: ./references/single-exec-input-list.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-per-file-exec"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Exec has 120 calls in one project, about 1400 ms each, so the generator starts once per schema, and its startup cost does not depend on the file. Batching on %(SchemaFile.FullPath) in Schemas.targets causes that. schemagen.md says --input-list takes a list of paths and produces the same output as one run per schema, so the target now writes the list with WriteLinesToFile and runs schemagen once with --input-list and --output-dir. That removes about 119 launches, roughly 2.7 minutes of 3.8 total. I kept Inputs and Outputs on the target, so a build after changing one schema still only regenerates the stale files, because MSBuild passes only the out-of-date items into the target. Not validated: I could not run the build here.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | schemagen startup | 120 | 1 | 166838 estimated | Sequential per-item Exec on one node | Write stale paths to a list and invoke once | yes, before compilation |

              Verdict: proposed removal of 119 repeated executions; estimated task-time saving 166.84 s; wall-clock not validated
    graders:
      - type: run-command
        config:
          command: python
          args:
            - -c
            - |
              import hashlib, json, os, pathlib, re, shlex, shutil, subprocess, sys, tempfile
              import xml.etree.ElementTree as ET
              base = pathlib.Path('per-file-exec')
              expected = {
                  'perf-summary.txt': 'a7a87a9f72d2a3ea5e94a0b98ce895e08c6b73b7c41ad772da5c67dc96e018ba',
                  'schemas/Customer.json': '67eb0f87e3e7d30e93c695f6309869ad756ec9d3a794fea1f579b53e76588276',
                  'schemas/Invoice.json': '84fda3aa966679bf270dcb52a962638ccfb0a98a9f8a98fd8412bfb514a7f73d',
                  'schemas/Order.json': '62e76a2120a81ebf31bd338c87f570619c3f98ceeee8378c139b678cf274297e',
                  'tools/schemagen.md': '5f1e323d5f5b121037fc94b50a8a7b318b8c91e133efd2d1fa26eff45097d75b',
              }
              actual = {p.relative_to(base).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in base.rglob('*') if p.is_file()
                        and p.relative_to(base).as_posix() not in ['Schemas.targets', 'Contoso.Schemas.csproj']
                        and p.relative_to(base).parts[0] not in ['bin', 'obj']}
              assert actual == expected, 'preserve all schema contents and files outside the project/target edits'
              project = ET.parse('per-file-exec/Contoso.Schemas.csproj').getroot()
              root = ET.parse('per-file-exec/Schemas.targets').getroot()
              properties = {p.tag: p.text or '' for group in project.findall('PropertyGroup') for p in group}
              def expand(value):
                  for _ in range(len(properties) + 1):
                      value = re.sub(r'\$\(([^)]+)\)', lambda m: properties.get(m[1], m[0]), value)
                  return value.replace('\\', '/').rstrip('/')
              assert any(str(pathlib.PurePosixPath(expand(i.get('Project', '')))) == 'Schemas.targets'
                         and not i.get('Condition') for i in project.findall('Import')), 'the project must import Schemas.targets'
              properties.update({p.tag: p.text or '' for group in root.findall('PropertyGroup') for p in group})
              generators = [(target, task) for target in root.findall('Target') for task in target.findall('Exec')
                            if 'schemagen' in task.get('Command', '')]
              assert len(generators) == 1, 'use one generator invocation'
              target, task = generators[0]
              assert not task.get('Condition'), 'the generator invocation must not be disabled'
              targets = {t.get('Name'): t for t in root.findall('Target') if not t.get('Condition')}
              pending = [name for name, t in targets.items()
                         if {'BeforeCompile', 'CoreCompile'} & {n.strip() for n in t.get('BeforeTargets', '').split(';')}]
              compile_path = set()
              while pending:
                  name = pending.pop()
                  if name in compile_path:
                      continue
                  assert name in targets, 'compile dependencies must reference an existing target'
                  compile_path.add(name)
                  pending.extend(n.strip() for n in targets[name].get('DependsOnTargets', '').split(';') if n.strip())
              assert target.get('Name') in compile_path, 'schema generation must run before compilation'
              command = expand(task.get('Command'))
              assert '%(' not in command, 'the generator still starts once per schema'
              args = shlex.split(command)
              assert '--input-list' in args and '--output-dir' in args, 'the generator needs both its input list and output directory'
              input_list = args[args.index('--input-list') + 1]
              output_dir = args[args.index('--output-dir') + 1]
              assert target.get('Inputs') == '@(SchemaFile)', 'keep the stale SchemaFile inputs'
              assert expand(target.get('Outputs', '')) == "@(SchemaFile->'" + output_dir + "/%(Filename).g.cs')", 'outputs must match the generator output directory'
              preceding = list(target)[:list(target).index(task)]
              writers = [w for w in preceding if w.tag == 'WriteLinesToFile' and expand(w.get('File', '')) == input_list]
              assert len(writers) == 1, 'write the consumed input list before running the generator'
              writer = writers[0]
              assert writer.get('Lines') in ["@(SchemaFile->'%(FullPath)')", "@(SchemaFile->'%(Identity)')", '@(SchemaFile)'], 'the list must contain all stale schema paths'
              assert writer.get('Overwrite', '').lower() == 'true', 'overwrite the list so it cannot retain previously stale schemas'
              assert not writer.get('Condition'), 'the list writer must not skip stale schemas'
              before_writer = preceding[:preceding.index(writer)]
              created = [expand(d.strip()) for step in before_writer if step.tag == 'MakeDir' and not step.get('Condition')
                         for d in step.get('Directories', '').split(';') if d.strip()]
              for directory in [str(pathlib.PurePosixPath(input_list).parent), output_dir]:
                  assert ((pathlib.Path('per-file-exec') / directory).is_dir() or
                          any(d == directory or d.startswith(directory + '/') for d in created)), 'create the list/output directory before writing on a clean build'
              dotnet = shutil.which('dotnet')
              assert dotnet, 'the .NET SDK is required to query evaluated Compile items'
              hooks = list(dict.fromkeys(
                  name for phase in ['BeforeCompile', 'CoreCompile'] for name, t in targets.items()
                  if phase in [n.strip() for n in t.get('BeforeTargets', '').split(';')]
              ))
              with tempfile.TemporaryDirectory() as tmp:
                  work = (pathlib.Path(tmp) / 'work').resolve()
                  shutil.copytree('per-file-exec', work, ignore=shutil.ignore_patterns('bin', 'obj', '*.g.cs'))
                  bin_dir = pathlib.Path(tmp) / 'bin'
                  bin_dir.mkdir()
                  log = pathlib.Path(tmp) / 'schemagen-calls.jsonl'
                  script = bin_dir / 'schemagen.py'
                  script.write_text(
                      'import argparse, json, os, pathlib\n'
                      'parser = argparse.ArgumentParser()\n'
                      'parser.add_argument("--input-list", required=True)\n'
                      'parser.add_argument("--output-dir", required=True)\n'
                      'args = parser.parse_args()\n'
                      'work = pathlib.Path(os.environ["SCHEMA_WORK"]).resolve()\n'
                      'source_list = pathlib.Path(args.input_list).resolve()\n'
                      'output_dir = pathlib.Path(args.output_dir).resolve()\n'
                      'assert source_list.is_relative_to(work) and output_dir.is_relative_to(work)\n'
                      'assert output_dir.is_dir()\n'
                      'inputs = [pathlib.Path(line).resolve() for line in source_list.read_text(encoding="utf-8-sig").splitlines() if line.strip()]\n'
                      'assert inputs and all(p.is_relative_to(work) and p.is_file() for p in inputs)\n'
                      'outputs = [output_dir / (p.stem + ".g.cs") for p in inputs]\n'
                      'for output in outputs:\n'
                      '    output.write_bytes(b"// generated placeholder for Compile-item inspection\\n")\n'
                      'with open(os.environ["SCHEMA_LOG"], "a", encoding="utf-8") as stream:\n'
                      '    stream.write(json.dumps({"inputs": [str(p) for p in inputs], "outputs": [str(p) for p in outputs]}) + "\\n")\n',
                      encoding='utf-8', newline='\n',
                  )
                  if os.name == 'nt':
                      (bin_dir / 'schemagen.cmd').write_text(
                          '@echo off\n"' + sys.executable + '" "' + str(script) + '" %*\n',
                          encoding='utf-8', newline='\r\n',
                      )
                  else:
                      launcher = bin_dir / 'schemagen'
                      launcher.write_text(
                          '#!/bin/sh\nexec ' + shlex.quote(sys.executable) + ' ' + shlex.quote(str(script)) + ' "$@"\n',
                          encoding='utf-8', newline='\n',
                      )
                      launcher.chmod(0o755)
                  env = dict(os.environ, PATH=str(bin_dir) + os.pathsep + os.environ['PATH'],
                             SCHEMA_WORK=str(work), SCHEMA_LOG=str(log))
                  result = subprocess.run(
                      [dotnet, 'msbuild', 'Contoso.Schemas.csproj', '-nologo', '-verbosity:quiet',
                       '-nodeReuse:false', '-target:' + ';'.join(hooks), '-getItem:Compile'],
                      cwd=work, env=env, capture_output=True, text=True, timeout=60,
                  )
                  assert result.returncode == 0, result.stdout + result.stderr
                  calls = [json.loads(line) for line in log.read_text().splitlines()]
                  assert len(calls) == 1, 'schema generation must execute exactly once'
                  sources = set(work.joinpath('schemas').rglob('*.json'))
                  required = {work / 'schemas' / (name + '.json') for name in ['Customer', 'Invoice', 'Order']}
                  assert required <= sources, 'preserve all fixture schema inputs'
                  assert {pathlib.Path(p) for p in calls[0]['inputs']} == sources, 'generate an output for every schema'
                  generated = {pathlib.Path(p) for p in calls[0]['outputs']}
                  compiled = {pathlib.Path(item['FullPath']).resolve() for item in json.loads(result.stdout)['Items']['Compile']}
                  assert generated <= compiled, 'every generated output must remain a Compile input'
                  assert all(p.is_file() for p in compiled if p.name.endswith('.g.cs')), 'generated Compile inputs must exist'
                  assert all(p.read_bytes() == b'// generated placeholder for Compile-item inspection\n'
                             for p in generated), 'preserve every generated schema output byte-for-byte'
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: '(?m)^\|\s*Work\s*\|\s*Calls\s*\|\s*Expected\s*\|\s*Avoidable ms\s*\|\s*Cause\s*\|\s*Fix\s*\|\s*On critical path\?\s*\|\r?\n\|(?:\s*:?-+:?\s*\|){7}\r?\n\|(?:[^|\r\n]*\|){7}\s*$'
      - type: output-matches
        config:
          pattern: '(?m)^Verdict:[ \t]*\S[^\r\n]*$'
      - type: prompt
    rubric:
      - Identified from Exec having 120 calls in one project that the generator is started once per schema file and that
        startup dominates
      - Replaced the per-item Exec with one invocation that uses the list option documented in schemagen.md
      - Kept Inputs and Outputs on the target so unchanged schemas are not regenerated
      - Preserved every generated output byte-for-byte
      - Did not claim the build was run or the saving measured

  - name: Preserve a build that already shares incremental generation
    prompt: |
      already-shared-work/perf-summary.txt is the performance summary from
      dotnet msbuild already-shared-work/Build.proj -restore -m. Reduce unnecessary build work without changing what Api
      and Worker compile. Apply a fix if one is needed. You cannot run the build from here, so work from the repository
      files. Do not execute dotnet/MSBuild commands or collect another log; use the supplied summary and repository files.
    tags:
      capability: already-shared-incremental-work
      risk: unnecessary-rewrite
      journey: apply-fix
    environment:
      files:
        - src: ./already-shared-work
          dest: already-shared-work
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "find-repeated-build-work-already-shared-work"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              No fix is needed, and I left all files unchanged. GenerateSharedBuildInfo runs once in Build.proj before either project starts, and its Inputs and Outputs skip generation when the template has not changed. Both projects receive the same BuildInfoPath and compile the shared file. Copy has one call, while Csc has two calls for two projects, which is expected. Moving the generation into Directory.Build.targets would duplicate it; another run-once guard adds no benefit. I could not run the build here, so I have not measured any saving.

              | Work | Calls | Expected | Avoidable ms | Cause | Fix | On critical path? |
              |---|---|---|---|---|---|---|
              | Shared generation | 1 | 1 | 0 | Already shared and incremental | Leave unchanged | yes, before both projects |
              | Csc | 2 | 2 | 0 | One compilation per project | Leave unchanged | unknown |

              Verdict: no repeated work worth changing
    graders:
      - type: run-command
