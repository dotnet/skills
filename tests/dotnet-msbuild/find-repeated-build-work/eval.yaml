                  'Worker/Worker.csproj': 'e2c08643e21eba9123e4b319840fec508efc44b473a7cab491d6188e5f6905ca',
                  'Build.proj': 'd3f26267e84dde321e3c4dd735f265ca477f236723b998342ba7f6f236451781',
