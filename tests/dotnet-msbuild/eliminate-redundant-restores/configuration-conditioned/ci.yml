steps:
  - script: dotnet restore tests/Contoso.Tests/Contoso.Tests.csproj
    displayName: Restore
  - script: dotnet build tests/Contoso.Tests/Contoso.Tests.csproj -c Release
    displayName: Build
  - script: dotnet test tests/Contoso.Tests/Contoso.Tests.csproj -c Release --no-build
    displayName: Test
