          dest: configuration-conditioned/tests/Contoso.Tests/Contoso.Tests.csproj
        - src: ./configuration-conditioned/SmokeTests.cs
          dest: configuration-conditioned/tests/Contoso.Tests/SmokeTests.cs
    golden_patch:
      path: ./references/configuration-conditioned.patch
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "eliminate-redundant-restores-configuration"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              Core selects Newtonsoft.Json 13.0.2 by default but 13.0.3 for Release. Suppressing Build's restore without matching Configuration would reuse the wrong package, which the real test detects. I passed -p:Configuration=Release to the first restore, added --no-restore to the Release build, and kept the no-build Release test. One of two restores is removed; only ci.yml changed.
    graders:
      - type: run-command
        config:
          command: node
          args:
            - -e
            - &restore_state |
              const fs = require('fs');
              const root = process.argv[1], kind = process.argv[2];
              const steps = fs.readFileSync(root + '/ci.yml', 'utf8').split(/\r?\n/)
                .filter(l => /^\s*-?\s*script:/.test(l))
                .map(l => l.replace(/^\s*-?\s*script:\s*/, '').trim().replace(/["']/g, '').replace(/\\/g, '/'));
              const flag = (l, name) => new RegExp('(?:^|\\s)' + name + '(?:\\s|$)').test(l);
              const property = (l, name) => [...l.matchAll(/(?:^|\s)(?:--?|\/)(?:p|property):([^\s]+)/gi)]
                .flatMap(m => m[1].split(/[,;](?=[A-Za-z_]\w*=)/))
                .reduce((value, p) => {
                  const match = /^([^=]+)=(.*)$/.exec(p);
                  return match && match[1].toLowerCase() === name.toLowerCase() ? decodeURIComponent(match[2]) : value;
                }, undefined);
              const project = (l, name) => l.split(/\s+/).some(t => t.replace(/^\.\//, '') === name);
              const restoreSwitches = l => l.match(/(?:^|\s)(?:--?|\/)(?:restore(?::(?:true|false))?|r:(?:true|false))(?=\s|$)/gi) || [];
              const restoreOff = l => /:false$/i.test(restoreSwitches(l).at(-1) || '');
              const restores = steps.filter(l => /^dotnet restore\b/.test(l));
              const builds = steps.filter(l => /^dotnet (build|msbuild)\b/.test(l));
              const tests = steps.filter(l => /^dotnet test\b/.test(l));
              if (restores.length !== 1 || builds.length !== 1 || tests.length < 1 ||
                  tests.length > (kind === 'frameworks' ? 2 : 1) || steps.length !== 2 + tests.length) {
                throw new Error('keep one explicit restore, one build, and complete test coverage');
              }
              const [restore] = restores, [build] = builds;
              const entry = 'tests/Contoso.Tests/Contoso.Tests.csproj';
              if (!project(restore, entry) || !tests.every(l => project(l, entry)) ||
                  !project(build, kind === 'orchestrated' ? 'Build.proj' : entry) ||
                  steps.indexOf(restore) > steps.indexOf(build) || tests.some(l => steps.indexOf(build) > steps.indexOf(l))) {
                throw new Error('restore the complete child graph before building and testing it');
              }
              if (flag(restore, '(?:--no-(?:restore|build)|-c|--configuration)') ||
                  !tests.every(l => flag(l, '--no-build')) ||
                  (/^dotnet build\b/.test(build) && flag(build, '--no-build'))) {
                throw new Error('preserve valid restore, Release build, and no-build test modes');
              }
              if ([build, ...tests].some(l => restoreSwitches(l).length && !restoreOff(l))) throw new Error('restore is re-enabled');
              if (/^dotnet msbuild\b/.test(build) ? !restoreOff(build) || flag(build, '--no-restore')
                  : !flag(build, '--no-restore')) throw new Error('the build must not restore');
              if ([build, ...tests].some(l => [...l.matchAll(/(?:^|\s)(?:--?|\/)(?:t|target|targets):([^\s]+)/gi)]
                  .some(m => m[1].split(/[;,]/).some(t => t.toLowerCase() === 'restore')))) {
                throw new Error('an explicit Restore target still repeats restore');
              }
              if (kind === 'configuration' && property(restore, 'Configuration') !== 'Release') {
                throw new Error('restore must select Release packages with a supported MSBuild property');
              }
              if (kind === 'frameworks') {
                const required = ['net10.0', 'net10.0-windows'];
                const coverage = l => {
                  const single = property(l, 'TargetFramework') ??
                    /(?:^|\s)(?:-f|--framework)[ =]([^\s]+)/.exec(l)?.[1];
                  return single !== undefined ? [single] : property(l, 'TargetFrameworks')?.split(';') ?? required;
                };
                const tested = tests.flatMap(coverage);
                const complete = targets => required.every(t => targets.includes(t)) && targets.every(t => required.includes(t));
                if (![restore, build].every(l => complete(coverage(l))) || !complete(tested) ||
                    (tests.length === 2 && !tests.every(l => coverage(l).length === 1))) {
                  throw new Error('preserve exactly the declared framework set in restore, build, and tests');
                }
              }
              if (kind === 'artifacts' && !steps.every(l => /(?:^|\s)--artifacts-path[ =](?:\.\/)?artifacts(?:\s|$)/.test(l))) {
                throw new Error('restore must write assets to the retained artifacts output layout');
              }
              if (kind === 'orchestrated' && (!/^dotnet msbuild\b/.test(build) || property(build, 'ChildTargets') !== 'Build')) {
                throw new Error('task-invoked children must build without repeating their explicit Restore targets');
              }
            - configuration-conditioned
            - configuration
          expected_exit_code: 0
      - type: run-command
        config:
          command: node
          args: [-e, *execution_modes, configuration-conditioned/ci.yml]
          expected_exit_code: 0
      - type: run-command
        config:
          command: node
          args:
            - -e
            - *immutable_fixture
            - configuration-conditioned
            - >-
              {"src/Contoso.Core/BuildMarker.cs":"d54dd569c7d7b53726d251e543eef1ae652c463c5a182a381302e816d099b88b",
              "src/Contoso.Core/Contoso.Core.csproj":"a26d770959e689b08a73f04a118bb36aa710c6b116131efd41c2ada4d5ef6630",
              "tests/Contoso.Tests/Contoso.Tests.csproj":"0b523d82a19231031bae17755104a62fd21b18db894dd23d24234fb7e2dbdf0e",
              "tests/Contoso.Tests/SmokeTests.cs":"d333f3dcb0509ebd578b11daf952131cc672e1b03f6e3824b7b88851db2706a0"}
          expected_exit_code: 0
      - type: prompt
    rubric:
      - Recognized that Configuration changes the package version, not just the output folder
      - Matched the first restore to Release before suppressing the later restore
      - Built once and ran the unchanged test, preserving the 13.0.3 runtime dependency
      - Changed only ci.yml and retained the required first restore

