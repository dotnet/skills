scenarios:
  - name: "Review MSBuild extension point patterns"
    prompt: "Our build breaks on fresh clones and a NuGet package's custom hook stopped working after we added Directory.Build.targets. Also other teams can't plug into our RunCodeGen step. Can you review the file and find the issues?"
    setup:
      copy_test_files: true
    assertions:
      - type: "output_matches"
        pattern: "(Exists|missing|not found)"
      - type: "output_matches"
        pattern: "(CustomBefore|append|overwrite|drop)"
    rubric:
      - "Identified that the Import will fail on fresh clones because there's no existence check for the imported file"
      - "Identified that the CustomBeforeMicrosoftCommonTargets assignment drops any previously-set hooks (from NuGet packages or parent files)"
      - "Identified that the RunCodeGen target cannot be extended by other teams and suggested a way to make it extensible"
      - "Suggested concrete fixes with correct patterns for each issue"
    timeout: 120
