name: agent.msbuild
description: Evaluates the dotnet-msbuild/msbuild custom agent
type: capability
defaults:
  timeout: 6m
stimuli:
  - name: Diagnose the binlog connection before changing the project
    prompt: |-
      I cannot inspect my .NET build because the binlog MCP server reports
      CONNECTION_CLOSED. Its registration is in affected-workspace/host.json.
      The registered launcher is an offline stand-in for dotnet, including SDK
      and source queries; use it instead of the machine-wide SDK or live feeds.
      Investigate from that workspace and save launch stdout, stderr, and numeric
      exitCode in affected-workspace/launch-result.json. Explain the cause and
      smallest safe next step without disclosing private feed URLs or credentials.
      Do not build, install anything, access the network, or change the supplied files.
    tags:
      capability: binlog-startup-routing
      risk: changing-project-instead-of-diagnosing-reader
      journey: unblock-build-diagnosis
    environment:
      files:
        - src: ../troubleshoot-binlog-mcp/fixtures/launch-failure
          dest: .
      skills:
        - ../../plugins/dotnet-msbuild/skills/troubleshoot-binlog-mcp
    golden_trajectory:
      path: references/executable-launch.json
    graders:
      - type: run-command
        config:
          command: node
          args:
            - -e
            - |
              const assert = require('node:assert/strict');
              const fs = require('node:fs');
              const crypto = require('node:crypto');
              const content = fs.readFileSync('check-launch.cjs', 'utf8').replace(/\r\n/g, '\n');
              assert.equal(crypto.createHash('sha256').update(content).digest('hex'),
                'b058d8c0d423ce33844c264a99c5f5ab9194ed2888a1af9f5950d5a76d9358c6', 'Changed or missing diagnostic input: check-launch.cjs');
              require('./check-launch.cjs');
          expected_exit_code: 0
          timeout: 1m
      - type: output-matches
        config:
          pattern: 'MCP status: failed'
      - type: output-not-matches
        config:
          pattern: 'mirror\.example\.invalid|fixture-only-feed-token'
      - type: prompt
    rubric:
      - Identifies the launch package-resolution failure rather than treating the transport error as a project compilation error
      - Explains the workspace-selected SDK and mirror-only source configuration using the recorded diagnostics
      - Recommends an approved-feed repair without modifying the project, SDK, NuGet configuration, host, or launcher
      - Does not claim recovery before host reconnection and discovery of binlog tools
  - name: Triage a build failure and route to appropriate analysis
    prompt: My .NET project is failing to build. I see errors when I run dotnet build but I'm not sure how to diagnose the
      issue. Can you help me figure out what's going wrong and how to fix it?
    tags:
      capability: build-failure-triage
      risk: high
      journey: diagnose-build-failure
    environment:
      files:
        - src: ./MyApp.csproj
          dest: MyApp.csproj
        - src: ./Program.cs
          dest: Program.cs
        - src: ./NuGet.Config
          dest: NuGet.Config
        - src: ./empty-feed
          dest: empty-feed
      skills:
        - ../../plugins/dotnet-msbuild/skills/binlog-failure-analysis
        - ../../plugins/dotnet-msbuild/skills/binlog-generation
    graders:
      - type: output-contains
        config:
          substring: NU1101
      - type: prompt
    rubric:
      - Correctly identified the build failure is caused by a missing NuGet package reference (NU1101 for Devdiv.Utils)
      - Attempted to build the project to reproduce the error
      - Suggested removing or replacing the invalid PackageReference with a valid package
  - name: Advise on project file organization
    prompt: I have a repository with several .NET projects and I'm wondering if there's a better way to organize my shared
      build properties. Right now I'm duplicating settings like TargetFramework, Nullable, and ImplicitUsings across all
      my project files.
    tags:
      capability: directory-build-props-recommendation
      risk: medium
      journey: build-infra-organization
    environment:
      files:
        - src: ./healthy
          dest: .
    graders:
      - type: output-matches
        config:
          pattern: Directory\.Build\.props|Directory\.Build\.targets
      - type: prompt
    rubric:
      - Recommended using Directory.Build.props for shared properties like TargetFramework
      - Explained how Directory.Build.props works (automatic import by MSBuild for all projects in the directory tree)
      - Suggested moving duplicated PackageReferences or common properties into the shared file
  - name: Route a slow build to performance analysis
    prompt: |
      These small .NET projects build successfully, but our real solution has
      become much slower over time. Explain how you would establish a baseline,
      capture the right evidence, and identify the expensive targets, tasks, and
      analyzers before changing the build.
    tags:
      capability: build-performance-routing
      risk: high
      journey: diagnose-build-performance
    environment:
      files:
        - src: ./healthy
          dest: .
      skills:
        - ../../plugins/dotnet-msbuild/skills/binlog-generation
        - ../../plugins/dotnet-msbuild/skills/build-perf-baseline
        - ../../plugins/dotnet-msbuild/skills/build-perf-diagnostics
    graders:
      - type: output-matches
        config:
          pattern: (baseline|cold build|warm build|no-op build)
      - type: output-matches
        config:
          pattern: (binlog|binary log)
      - type: output-matches
        config:
          pattern: (target|task|analyzer)
      - type: prompt
    rubric:
      - Proposed measuring comparable cold, warm, and no-op builds before optimizing
      - Recommended collecting a binary log and inspecting expensive targets, tasks, or analyzers
      - Avoided guessing at optimizations before gathering evidence
  - name: Diagnose broken incremental build behavior
    prompt: |
      Rebuilding AppOne/AppOne.csproj without source changes still reruns its
      GenerateBuildMarker target. Show me how to diagnose why the target is not
      being skipped and what input, output, or timestamp mistakes to look for.
    tags:
      capability: incremental-build-routing
      risk: high
      journey: diagnose-incremental-build
    environment:
      files:
        - src: ./healthy
          dest: .
      skills:
        - ../../plugins/dotnet-msbuild/skills/incremental-build
    graders:
      - type: output-matches
        config:
          pattern: (Inputs|Outputs|incremental|up.to.date|skip)
      - type: output-matches
        config:
          pattern: (timestamp|changed|missing|mapping)
      - type: prompt
    rubric:
      - Explained that MSBuild target skipping depends on correct Inputs and Outputs relationships
      - Identified concrete timestamp, missing-output, or one-to-one mapping checks
      - Proposed a repeatable no-change rebuild to verify the fix
  - name: Review a project file for maintainability risks
    prompt: |
      Review AppOne/AppOne.csproj for build configuration maintainability
      and correctness risks. Prioritize concrete issues, explain their impact,
      and suggest targeted improvements without redesigning unrelated application code.
    tags:
      capability: project-file-review
      risk: medium
      journey: review-build-configuration
    environment:
      files:
        - src: ./healthy
          dest: .
      skills:
        - ../../plugins/dotnet-msbuild/skills/msbuild-antipatterns
        - ../../plugins/dotnet-msbuild/skills/msbuild-modernization
    graders:
      - type: output-matches
        config:
          pattern: (PackageReference|TargetFramework|property|item|condition|target)
      - type: prompt
    rubric:
      - Grounded findings in the supplied project file rather than giving generic MSBuild advice
      - Prioritized correctness and maintainability issues by impact
      - Kept recommendations scoped to build configuration
