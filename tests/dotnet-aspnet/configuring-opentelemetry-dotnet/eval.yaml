scenarios:
  - name: "Add OpenTelemetry tracing and metrics to an ASP.NET Core API"
    prompt: |
      Show me the code changes needed to add OpenTelemetry to my ASP.NET Core 8 app. I need distributed tracing with custom spans for order processing, a counter metric for orders processed, and OTLP export. My custom traces weren't showing up last time I tried — what did I likely get wrong? Don't create or modify any files, just explain with code snippets.
    assertions:
      - type: "output_matches"
        pattern: "(OpenTelemetry\\.Extensions\\.Hosting|AddOpenTelemetry)"
      - type: "output_matches"
        pattern: "(ActivitySource|StartActivity)"
      - type: "output_matches"
        pattern: "(AddSource|AddMeter)"
      - type: "output_matches"
        pattern: "(Counter|Histogram|CreateCounter|CreateHistogram)"
      - type: "output_matches"
        pattern: "(AddOtlpExporter|OtlpExporter|OpenTelemetryProtocol)"
    rubric:
      - "Listed the correct NuGet packages: OpenTelemetry.Extensions.Hosting, OpenTelemetry.Instrumentation.AspNetCore, OpenTelemetry.Instrumentation.Http, OpenTelemetry.Exporter.OpenTelemetryProtocol"
      - "Showed AddOpenTelemetry() configuration with .WithTracing() and .WithMetrics()"
      - "Included AddAspNetCoreInstrumentation() and/or AddHttpClientInstrumentation() for auto-instrumentation"
      - "Showed how to register custom ActivitySource names via AddSource() and create spans with StartActivity()"
      - "Showed how to create custom metrics using CreateCounter() or similar, with the Meter name registered via AddMeter()"
      - "Warned that ActivitySource/Meter names must match AddSource/AddMeter registrations exactly or custom telemetry will be silently dropped"
    reject_tools: ["bash", "edit"]
    timeout: 360

  - name: "OpenTelemetry skill should not activate for simple logging question"
    prompt: "How do I configure Serilog structured logging in my ASP.NET Core app to write to a file and console?"
    assertions:
      - type: "output_not_contains"
        value: "OpenTelemetry"
      - type: "output_not_matches"
        pattern: "(ActivitySource|StartActivity|AddOpenTelemetry|OTLP)"
    rubric:
      - "Did NOT suggest OpenTelemetry for a Serilog logging question"
      - "Provided Serilog-specific configuration guidance"
    reject_tools: ["bash", "edit"]
    timeout: 60
    expect_activation: false
