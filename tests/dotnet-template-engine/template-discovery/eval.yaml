name: template-discovery
description: Evaluates the dotnet-template-engine/template-discovery skill
type: capability
defaults:
  timeout: 3m
stimuli:
  - name: Find template for web API project
    prompt: I need to create a web API project with authentication. What template should I use and what are the
      authentication options?
    graders:
      - type: exit-success
      - type: output-contains
        config:
          substring: webapi
      - type: output-matches
        config:
          pattern: (?i)IndividualB2C
      - type: output-matches
        config:
          pattern: (?i)SingleOrg
      - type: output-matches
        config:
          pattern: (?i)\bWindows\b
      - type: output-matches
        config:
          pattern: (?i)\bNone\b
      - type: prompt
    rubric:
      - The agent identified the webapi template as the best match
      - The agent explained available authentication options (IndividualB2C, SingleOrg, None, Windows, etc.)
      - The agent mentioned how to set the auth parameter
    constraints:
      expect_tools:
        - skill
  - name: Inspect web API template parameters
    prompt: |
      Inspect the installed `webapi` template before I use it. Show its authentication
      choices, target frameworks, native AOT option, and controllers option, including
      defaults and any compatibility constraints. Finish with an example command for a
      project named SecureApi, but don't create it.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)\bframework\b
      - type: output-matches
        config:
          pattern: (?i)webapi
      - type: output-matches
        config:
          pattern: (?i)auth
      - type: output-matches
        config:
          pattern: (?i)aot
      - type: output-matches
        config:
          pattern: (?i)(use-controllers|controllers)
      - type: prompt
    rubric:
      - The response reflects the installed webapi template's actual parameter names, choices, and defaults
      - Authentication, frameworks, native AOT, and controllers are all covered with relevant constraints
      - The response ends with a concrete example command without creating files
    constraints:
      expect_tools:
        - skill
  - name: Search NuGet for specialized template
    prompt: I need a template for creating gRPC services in .NET. Search for available gRPC templates — both installed
      locally and on NuGet.org. Tell me which package to install.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)grpc
      - type: output-matches
        config:
          pattern: (?i)(Microsoft\.Grpc|grpc.*service|ASP\.NET.*gRPC)
      - type: output-matches
        config:
          pattern: (?i)dotnet\s+new\s+list
      - type: output-matches
        config:
          pattern: (?i)dotnet\s+new\s+search
      - type: prompt
    rubric:
      - The agent searched both local and NuGet.org sources
      - The agent identified the SDK-shipped grpc template and accurately distinguished it from any NuGet alternatives
      - The agent either provided a package ID copied from actual search results with install instructions or clearly stated that no extra package is needed
    constraints:
      expect_tools:
        - skill
  - name: Resolve ambiguous project intent to multiple candidates
    prompt: I want to build a real-time collaborative dashboard where users can see live updates. What .NET project
      templates could work? I need you to search available templates and show me the top 3 options with their key
      parameters.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)blazor
      - type: output-matches
        config:
          pattern: (?i)(server|webassembly|wasm|interactive)
      - type: prompt
    rubric:
      - The agent presented at least 2-3 template options
      - The agent explained the trade-offs between different approaches (Blazor Server vs WebAssembly, SignalR, etc.)
      - The agent showed key parameters for the recommended templates
    constraints:
      expect_tools:
        - skill
  - name: Preview project creation with dry run
    prompt: Before creating anything, show me exactly what files would be generated if I create a Blazor Web App called
      MyBlazorApp in ./test-output with interactive server rendering. Don't actually create the project yet.
    graders:
      - type: exit-success
      - type: output-contains
        config:
          substring: MyBlazorApp
      - type: file-not-exists
        config:
          path: test-output/**/MyBlazorApp.csproj
      - type: output-matches
        config:
          pattern: (?i)(Program\.cs|App\.razor|\.csproj)
      - type: prompt
    rubric:
      - The agent listed the files and directories that would be created
      - The agent did NOT actually create the project
      - The agent explained what key generated files are for
    constraints:
      expect_tools:
        - skill

  - name: Inspect a single worker template before creation
    prompt: |
      I'm considering the built-in worker service template for a queue consumer. Before I
      create anything, inspect its available target frameworks and options for native AOT
      and Windows Service support. Give me a ready-to-run command for a project named
      QueueProcessor, but don't create files.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)dotnet new worker
      - type: output-matches
        config:
          pattern: (?i)(framework|net\d+\.0)
      - type: output-matches
        config:
          pattern: (?i)(aot|native)
      - type: output-matches
        config:
          pattern: (?i)(windows service|windows-service)
      - type: file-not-exists
        config:
          path: "**/*.csproj"
      - type: prompt
    rubric:
      - The answer reflects parameters exposed by the installed worker template rather than guessed options
      - The answer gives a concrete command for QueueProcessor without creating the project
      - The answer explains any platform or framework constraints relevant to the requested options
    constraints:
      expect_tools:
        - skill

  - name: Find installed test project template choices
    prompt: |
      I need a C# unit-test project and want to know what the current SDK already has
      installed. Find the xUnit, NUnit, and MSTest project templates, show their short names,
      and recommend one for a team standardized on Microsoft.Testing.Platform. Don't create
      a project.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)\bxunit\b
      - type: output-matches
        config:
          pattern: (?i)\bnunit\b
      - type: output-matches
        config:
          pattern: (?i)\bmstest\b
      - type: output-matches
        config:
          pattern: (?i)recommend
      - type: file-not-exists
        config:
          path: "**/*.csproj"
      - type: prompt
    rubric:
      - The response identifies the installed C# test-project templates and their actual short names
      - The recommendation is tied to the team's Microsoft.Testing.Platform requirement
      - No project files are created
    constraints:
      expect_tools:
        - skill
