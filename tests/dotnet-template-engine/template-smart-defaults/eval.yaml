name: template-smart-defaults
description: Evaluates the dotnet-template-engine/template-smart-defaults skill
type: capability
defaults:
  timeout: 3m
environment:
  env:
    XDG_DATA_HOME: .xdg-data
    LOCALAPPDATA: .local-app-data
    DOTNET_NOLOGO: "1"
  files:
    - src: ./fixtures/global.json
      dest: global.json
  commands:
    - >-
      node -e "const fs=require('fs');
      fs.mkdirSync('.xdg-data/NuGet/Migrations', { recursive: true });
      fs.writeFileSync('.xdg-data/NuGet/Migrations/1', '');
      fs.mkdirSync('.local-app-data/NuGet/Migrations', { recursive: true });
      fs.writeFileSync('.local-app-data/NuGet/Migrations/1', '');"
stimuli:
  - name: Fill the framework for an AOT worker
    prompt: |
      I chose the worker template with native AOT but did not choose a target
      framework. Use evidence/template-help.txt to fill only the missing value,
      show where each value came from, and give a safe exact command. Do not
      create files.
    tags:
      capability: fill-aot-framework-default
      risk: high
      journey: complete-aot-worker-settings
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-smart-defaults-aot-worker"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              **Defaults applied**
              | Parameter | Value | Source | Why |
              |---|---|---|---|
              | `--aot` | enabled | user | Explicitly requested |
              | `--framework` | `net10.0` | rule | Latest AOT-capable choice in the capture |
              `dotnet new worker --aot --framework net10.0 --dry-run`
    graders:
      - type: output-matches
        config:
          pattern: (?i)Defaults applied
      - type: output-matches
        config:
          pattern: (?i)--framework[ =]+net10\.0
      - type: output-matches
        config:
          pattern: (?i)dotnet new worker.*--aot.*--dry-run
      - type: prompt
    rubric:
      - Preserves the explicit AOT choice and fills only the missing framework
      - Chooses the latest compatible framework offered by the captured template
      - Distinguishes user input from the inferred value and keeps the command read-only
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Keep HTTPS for organizational authentication
    prompt: |
      I chose `webapi` with SingleOrg authentication and left related values
      unset. Use evidence/template-help.txt, show preserved and inferred values,
      and give the exact command you recommend. Do not create the project.
    tags:
      capability: preserve-https-for-auth
      risk: high
      journey: complete-authenticated-api-settings
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-smart-defaults-auth-https"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              **Defaults applied**
              | Parameter | Value | Source | Why |
              |---|---|---|---|
              | `--auth` | `SingleOrg` | user | Explicit organizational sign-in |
              | HTTPS | enabled by omission | rule | Authentication redirects and credentials need HTTPS |
              `dotnet new webapi --auth SingleOrg --dry-run`
    graders:
      - type: output-matches
        config:
          pattern: (?i)\|.*--auth.*SingleOrg.*user
      - type: output-not-matches
        config:
          pattern: (?i)dotnet new webapi.*--no-https
      - type: output-matches
        config:
          pattern: (?i)dotnet new webapi.*--auth[ =]+SingleOrg.*--dry-run
      - type: prompt
    rubric:
      - Keeps the explicit authentication choice
      - Leaves HTTPS enabled and explains why it is the compatible default
      - Shows provenance for the decision and emits only flags actually passed
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Preserve controllers without adding a minimal flag
    prompt: |
      I chose a controller-based `webapi`. Complete any related defaults from
      evidence/template-help.txt, show which values came from me, and give the
      exact dry-run command. Do not change files.
    tags:
      capability: preserve-controller-model
      risk: medium
      journey: complete-controller-api-settings
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-smart-defaults-controllers"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              **Defaults applied**
              | Parameter | Value | Source | Why |
              |---|---|---|---|
              | `--use-controllers` | enabled | user | Explicit program model |
              | Minimal API mode | omitted | rule | The models are mutually exclusive |
              `dotnet new webapi --use-controllers --dry-run`
    graders:
      - type: output-matches
        config:
          pattern: (?i)\|.*--use-controllers.*user
      - type: output-matches
        config:
          pattern: (?i)dotnet new webapi.*--use-controllers.*--dry-run
      - type: output-not-matches
        config:
          pattern: (?i)dotnet new webapi.*--[a-z-]*minimal
      - type: prompt
    rubric:
      - Preserves and visibly passes the explicit controllers choice
      - Does not add a contradictory minimal-API option
      - Explains the omission and keeps the command non-writing
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Preserve an explicit older compatible framework
    prompt: |
      For a native AOT console app, I explicitly chose net8.0 even though the
      capture also offers newer frameworks. Preserve my choice, show parameter
      provenance, and give the exact safe command. Do not create files.
    tags:
      capability: preserve-explicit-framework
      risk: high
      journey: complete-pinned-aot-console
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-smart-defaults-explicit-net8"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              **Defaults applied**
              | Parameter | Value | Source | Why |
              |---|---|---|---|
              | `--aot` | enabled | user | Explicitly requested |
              | `--framework` | `net8.0` | user | Explicit compatible choice; not replaced |
              `dotnet new console --aot --framework net8.0 --dry-run`
    graders:
      - type: output-matches
        config:
          pattern: (?i)\|.*--framework.*net8\.0.*user
      - type: output-matches
        config:
          pattern: (?i)dotnet new console.*--framework[ =]+net8\.0.*--dry-run
      - type: output-not-matches
        config:
          pattern: (?i)dotnet new console.*--framework[ =]+net(9|10)\.0
      - type: prompt
    rubric:
      - Treats the explicit compatible framework as authoritative
      - Does not replace the user's choice merely because a newer value exists
      - Preserves AOT and emits a safe command with clear provenance
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Treat a repository framework as already set
    prompt: |
      This repository is intentionally pinned to net9.0. I want an AOT worker
      that fits it. Use evidence/template-help.txt, preserve the repository
      framework, fill only real gaps, and show provenance plus the exact command.
      Do not create files.
    tags:
      capability: preserve-workspace-framework
      risk: high
      journey: align-aot-worker-with-repository
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-smart-defaults-repository-net9"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              **Defaults applied**
              | Parameter | Value | Source | Why |
              |---|---|---|---|
              | `--framework` | `net9.0` | user | Repository pin counts as an existing choice |
              | `--aot` | enabled | user | Explicitly requested |
              `dotnet new worker --framework net9.0 --aot --dry-run`
    graders:
      - type: output-matches
        config:
          pattern: (?i)\|.*--framework.*net9\.0.*user
      - type: output-matches
        config:
          pattern: (?i)dotnet new worker.*--framework[ =]+net9\.0.*--aot.*--dry-run
      - type: output-not-matches
        config:
          pattern: (?i)dotnet new worker.*--framework[ =]+net10\.0
      - type: prompt
    rubric:
      - Treats the compatible repository pin as already specified
      - Enables AOT without replacing net9.0 with the template's newer default
      - Makes the source of each selected value clear
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Preserve an explicit minimal API choice
    prompt: |
      I chose a minimal `webapi` on net9.0 and do not want controllers. Use
      evidence/template-help.txt, preserve those choices, show provenance, and
      provide the exact safe command. Do not create the project.
    tags:
      capability: preserve-minimal-api-choice
      risk: medium
      journey: complete-minimal-api-settings
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-smart-defaults-minimal-api"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              **Defaults applied**
              | Parameter | Value | Source | Why |
              |---|---|---|---|
              | Program model | minimal API | user | Explicit choice; this is the template default |
              | `--framework` | `net9.0` | user | Explicit target |
              | `--use-controllers` | omitted | rule | Controllers would contradict the selected model |
              `dotnet new webapi --framework net9.0 --dry-run`
    graders:
      - type: output-matches
        config:
          pattern: (?i)\|.*minimal API.*user
      - type: output-matches
        config:
          pattern: (?i)dotnet new webapi.*--framework[ =]+net9\.0.*--dry-run
      - type: output-not-matches
        config:
          pattern: (?i)dotnet new webapi.*--use-controllers
      - type: prompt
    rubric:
      - Preserves both explicit choices and represents minimal APIs by omitting the controller flag
      - Does not invent a separate minimal-API switch
      - Separates preserved values from the omission chosen for compatibility
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Preserve explicit no-auth and no-HTTPS choices
    prompt: |
      For a local-only `webapi`, I explicitly chose no authentication and
      disabled HTTPS. Use evidence/template-help.txt, preserve both values, show
      their provenance, and give the exact dry-run command.
    tags:
      capability: preserve-explicit-security-options
      risk: high
      journey: complete-local-prototype-settings
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-smart-defaults-no-auth-no-https"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              **Defaults applied**
              | Parameter | Value | Source | Why |
              |---|---|---|---|
              | `--auth` | `None` | user | Explicitly requested |
              | `--no-https` | enabled | user | Explicit local-only choice |
              `dotnet new webapi --auth None --no-https --dry-run`
    graders:
      - type: output-matches
        config:
          pattern: (?i)\|.*--auth.*None.*user
      - type: output-matches
        config:
          pattern: (?i)\|.*--no-https.*user
      - type: output-matches
        config:
          pattern: (?i)dotnet new webapi.*--auth[ =]+None.*--no-https.*--dry-run
      - type: prompt
    rubric:
      - Preserves both explicit values instead of applying the authenticated-HTTPS rule
      - Labels both values as user supplied
      - Emits only the selected flags plus the read-only safety option
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Surface an explicit incompatible combination
    prompt: |
      I explicitly selected `webapi`, SingleOrg authentication, and native AOT.
      Use evidence/template-help.txt. Do not silently change any value: explain
      conflicts, show provenance, and give safe alternatives. Do not create files.
    tags:
      capability: handle-explicit-option-conflict
      risk: high
      journey: resolve-auth-aot-conflict
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-smart-defaults-auth-aot-conflict"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              **Defaults applied**
              | Parameter | Value | Source | Why |
              |---|---|---|---|
              | `--auth` | `SingleOrg` | user | Explicit choice |
              | `--aot` | enabled | user | Explicit choice |
              **Conflict:** the captured help permits AOT only with auth None, so no valid command preserves both.
              Keep auth: `dotnet new webapi --auth SingleOrg --dry-run`
              Keep AOT: `dotnet new webapi --auth None --aot --framework net10.0 --dry-run`
    graders:
      - type: output-matches
        config:
          pattern: (?is)(conflict|incompatible).*((SingleOrg|auth).*(AOT|--aot)|(AOT|--aot).*(SingleOrg|auth))
      - type: output-matches
        config:
          pattern: (?is)(Keep auth|preserve auth).*(Keep AOT|preserve AOT)
      - type: prompt
    rubric:
      - Detects the captured incompatibility instead of producing an invalid combined command
      - Preserves both explicit values in the provenance log and does not silently override either
      - Offers safe, clearly labeled alternatives for each possible user priority
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Stay dormant for choosing between templates
    prompt: |
      Compare `worker` and `console` side by side for a long-running queue
      processor. Cover lifecycle, hosting, logging, configuration, and shutdown,
      then recommend one. I have not selected a template or any parameters.
    tags:
      capability: boundary-template-comparison
      risk: routing
      journey: handoff-to-template-comparison
    expect_activation: false
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-smart-defaults-dormancy-comparison"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              No template or parameter set has been chosen, so this is a template-comparison request rather than a defaults-completion request. Compare worker's Generic Host lifecycle, DI, configuration, logging, and graceful shutdown with console's direct entry point, then recommend `worker` for the long-running queue processor. Do not apply cross-parameter defaults or create files.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(template-comparison|comparison request)
      - type: output-matches
        config:
          pattern: (?i)recommend.*worker
      - type: prompt
    rubric:
      - Recognizes that no selected template or incomplete parameter set exists
      - Did not apply smart-default rules or create project files
      - Redirects to the sibling comparison capability and gives the scenario-level decision
    constraints:
      reject_tools: [edit, create]
