scenarios:
  - name: "Create a console application"
    prompt: "Create a new .NET console application called MyConsoleApp in the ./test-output directory"
    assertions:
      - type: "exit_success"
      - type: "output_contains"
        value: "MyConsoleApp"
      - type: "file_exists"
        path: "test-output/MyConsoleApp/MyConsoleApp.csproj"
    rubric:
      - "The agent used the template-instantiation skill or dotnet new to create the project"
      - "The agent specified the correct output path"
      - "The agent verified the project was created successfully"
    expect_tools:
      - skill
    timeout: 180

  - name: "Create web API with authentication and AOT"
    prompt: "Create a new ASP.NET Core web API called SecureApi in ./test-output with Individual authentication and native AOT publishing enabled."
    assertions:
      - type: "exit_success"
      - type: "output_contains"
        value: "SecureApi"
      - type: "file_exists"
        path: "test-output/**/SecureApi.csproj"
      - type: "output_matches"
        pattern: "(?i)individual"
      - type: "output_matches"
        pattern: "(?i)(aot|PublishAot)"
    rubric:
      - "The agent created the project with the correct parameters"
      - "The agent passed the auth parameter set to Individual"
      - "The agent enabled native AOT publishing via the PublishAot parameter"
      - "The agent verified or previewed the creation"
    expect_tools:
      - skill
    timeout: 300

  - name: "Preview project creation with dry run"
    prompt: "Before creating anything, show me exactly what files would be generated if I create a Blazor Web App called MyBlazorApp in ./test-output with interactive server rendering. Don't actually create the project yet."
    assertions:
      - type: "exit_success"
      - type: "output_contains"
        value: "MyBlazorApp"
      - type: "file_not_exists"
        path: "test-output/**/MyBlazorApp.csproj"
      - type: "output_matches"
        pattern: "(?i)(Program\\.cs|App\\.razor|\\.csproj)"
    rubric:
      - "The agent used the template-instantiation skill to preview without writing to disk"
      - "The agent listed the files and directories that would be created"
      - "The agent did NOT actually create the project"
      - "The agent explained what key generated files are for"
    expect_tools:
      - skill
    timeout: 180

  - name: "Create Blazor app with interactive rendering"
    prompt: "Create a new Blazor Web App called MyDashboard in ./test-output with interactive server-side rendering enabled."
    assertions:
      - type: "exit_success"
      - type: "output_contains"
        value: "MyDashboard"
      - type: "file_exists"
        path: "test-output/**/MyDashboard.csproj"
      - type: "output_matches"
        pattern: "(?i)(server|interactive|render)"
    rubric:
      - "The agent created the Blazor Web App with correct rendering mode"
      - "The agent chose the blazor template (not blazorserver or blazorwasm)"
      - "The agent set the interactivity parameter appropriately"
      - "The agent confirmed successful creation"
    expect_tools:
      - skill
    timeout: 180
