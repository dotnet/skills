name: template-instantiation
description: Evaluates the dotnet-template-engine/template-instantiation skill
type: capability
defaults:
  timeout: 6m
stimuli:
  - name: Create a console application
    prompt: Create a new .NET console application called MyConsoleApp in the ./test-output directory
    graders:
      - type: exit-success
      - type: output-contains
        config:
          substring: MyConsoleApp
      - type: file-exists
        config:
          path: test-output/MyConsoleApp/MyConsoleApp.csproj
      - type: prompt
    rubric:
      - The agent created the requested console project
      - The agent created it at the requested ./test-output path
      - The resulting project is a valid console application
    constraints:
      expect_tools:
        - skill

  - name: Create and build a class library
    prompt: |
      Create a C# class library named Contoso.Utilities under
      `./src/Contoso.Utilities`, preview the generated files first, then create it
      and verify that it builds.
    graders:
      - type: exit-success
      - type: file-exists
        config:
          path: src/Contoso.Utilities/Contoso.Utilities.csproj
      - type: run-command
        config:
          command: dotnet build ./src/Contoso.Utilities/Contoso.Utilities.csproj
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: (?i)(dry-run|preview)
      - type: prompt
    rubric:
      - The class library is created at the exact requested path
      - The agent previews creation before writing files
      - A clean build is run and reported truthfully
    constraints:
      expect_tools:
        - skill

  - name: Create a controller-based web API
    prompt: |
      Create a web API named Orders.Api in `./src/Orders.Api`. It must use
      controllers rather than minimal APIs. Preview it, create it with the
      template's actual controller option, and build the result.
    graders:
      - type: exit-success
      - type: file-exists
        config:
          path: src/Orders.Api/Orders.Api.csproj
      - type: file-exists
        config:
          path: src/Orders.Api/Controllers/*.cs
      - type: run-command
        config:
          command: dotnet build ./src/Orders.Api/Orders.Api.csproj
          expected_exit_code: 0
      - type: output-matches
        config:
          pattern: (?i)(use-controllers|controllers)
      - type: prompt
    rubric:
      - The generated project uses the webapi template's controller option
      - The project is created only under the requested src/Orders.Api path
      - Preview and build both complete successfully
    constraints:
      expect_tools:
        - skill

  - name: Create a worker service
    prompt: |
      Scaffold a worker service called Billing.Worker in
      `./src/Billing.Worker`. Use the workspace's available SDK defaults, show a
      dry run before creation, then build the generated service.
    graders:
      - type: exit-success
      - type: file-exists
        config:
          path: src/Billing.Worker/Billing.Worker.csproj
      - type: file-exists
        config:
          path: src/Billing.Worker/Worker.cs
      - type: run-command
        config:
          command: dotnet build ./src/Billing.Worker/Billing.Worker.csproj
          expected_exit_code: 0
      - type: prompt
    rubric:
      - The worker template is instantiated with the requested name and output path
      - The agent does not add unrelated project types or packages
      - The generated worker is built after creation
    constraints:
      expect_tools:
        - skill

  - name: Compose an application and test solution
    prompt: |
      Create `Inventory.sln` with a class library at
      `src/Inventory.Core` and an xUnit test project at
      `tests/Inventory.Core.Tests`. Add a project reference from the tests to the
      library, add both projects to the solution, and build the solution.
    graders:
      - type: exit-success
      - type: file-exists
        config:
          path: Inventory.sln*
      - type: file-exists
        config:
          path: src/Inventory.Core/Inventory.Core.csproj
      - type: file-exists
        config:
          path: tests/Inventory.Core.Tests/Inventory.Core.Tests.csproj
      - type: file-contains
        config:
          path: tests/Inventory.Core.Tests/Inventory.Core.Tests.csproj
          value: ProjectReference
      - type: run-command
        config:
          command: dotnet build ./Inventory.sln
          expected_exit_code: 0
          timeout: 3m
      - type: prompt
    rubric:
      - The solution contains the library and its test project at the requested paths
      - The test project references the library
      - The complete solution builds successfully
    constraints:
      expect_tools:
        - skill

  - name: Match a neighboring project's target framework
    prompt: |
      This repo already has `src/Existing/Existing.csproj`. Create a sibling
      console app named Companion under `src/Companion`, matching the existing
      project's target framework instead of accepting a newer template default.
      Preview, create, and build it.
    environment:
      files:
        - src: ./fixtures/workspace-framework/src/Existing/Existing.csproj
          dest: src/Existing/Existing.csproj
    graders:
      - type: exit-success
      - type: file-exists
        config:
          path: src/Companion/Companion.csproj
      - type: file-contains
        config:
          path: src/Companion/Companion.csproj
          value: net9.0
      - type: run-command
        config:
          command: dotnet build ./src/Companion/Companion.csproj
          expected_exit_code: 0
      - type: prompt
    rubric:
      - The existing project is inspected and net9.0 is treated as the workspace's explicit framework choice
      - The new project is created with a matching target framework
      - The generated console app builds cleanly
    constraints:
      expect_tools:
        - skill

  - name: Adapt a generated test project to central package management
    prompt: |
      This repository uses `Directory.Packages.props`. Create an xUnit test project
      named Payments.Tests under `tests/Payments.Tests`, then adapt every generated
      PackageReference to central package management and build the project.
    environment:
      files:
        - src: ./fixtures/central-package-management/Directory.Packages.props
          dest: Directory.Packages.props
    graders:
      - type: exit-success
      - type: file-exists
        config:
          path: tests/Payments.Tests/Payments.Tests.csproj
      - type: file-not-contains
        config:
          path: tests/Payments.Tests/Payments.Tests.csproj
          value: " Version="
      - type: file-contains
        config:
          path: Directory.Packages.props
          value: PackageVersion
      - type: run-command
        config:
          command: dotnet build ./tests/Payments.Tests/Payments.Tests.csproj
          expected_exit_code: 0
          timeout: 3m
      - type: prompt
    rubric:
      - The agent detects central package management before finalizing the generated project
      - Inline versions are removed from all generated PackageReference items
      - Matching central PackageVersion entries are added without deleting the existing version
      - The adapted project restores and builds successfully
    constraints:
      expect_tools:
        - skill
