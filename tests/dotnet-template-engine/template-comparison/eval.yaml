name: template-comparison
description: Evaluates the dotnet-template-engine/template-comparison skill
type: capability
defaults:
  timeout: 3m
stimuli:
  - name: Compare webapi vs webapp side by side
    prompt: "I'm deciding between the 'webapi' and 'webapp' templates for a new .NET project. Compare them side by side — show parameters, which supports authentication, AOT, Docker, and controllers, and the available frameworks. Then recommend one for a JSON REST backend."
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)webapi
      - type: output-matches
        config:
          pattern: (?i)webapp
      - type: output-matches
        config:
          pattern: (?i)auth
      - type: output-matches
        config:
          pattern: (?i)aot
      - type: output-matches
        config:
          pattern: (?i)docker
      - type: output-matches
        config:
          pattern: (?i)controllers
      - type: output-matches
        config:
          pattern: (?i)recommend
      - type: prompt
    rubric:
      - The comparison reflects each template's actual parameters and choices (not guessed)
      - The agent produced a side-by-side comparison table (not just two separate lists)
      - The comparison covered parameters, feature support (auth/AOT/Docker/controllers), and frameworks
      - The agent gave a clear recommendation for a JSON REST backend
    constraints:
      expect_tools:
        - skill
  - name: Choose between blazor and blazorwasm
    prompt: "Which template should I use for an app that needs offline support: 'blazor' (Blazor Web App) or 'blazorwasm' (Blazor WebAssembly Standalone)? Compare the interactivity/hosting trade-offs and recommend one."
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)\bblazor\b
      - type: output-matches
        config:
          pattern: (?i)blazorwasm
      - type: output-matches
        config:
          pattern: (?i)recommend
      - type: prompt
    rubric:
      - The comparison reflects each template's actual capabilities (not guessed)
      - The agent explained the hosting/interactivity trade-offs (server-rendered vs WebAssembly)
      - The agent connected the offline-support requirement to a concrete recommendation
    constraints:
      expect_tools:
        - skill
  - name: Decide which template fits a background processing scenario
    prompt: "I need to run a long-lived background job that processes a queue. Which template should I use — 'worker' or 'console'? Compare them and justify the choice."
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)worker
      - type: output-matches
        config:
          pattern: (?i)console
      - type: prompt
    rubric:
      - The agent compared worker and console templates side by side
      - The agent explained why the worker template fits a long-lived queue processor (hosted service lifecycle)
      - The agent did NOT create any project files
    constraints:
      expect_tools:
        - skill

  - name: Choose MVC or Razor Pages for an admin portal
    prompt: |
      I'm building a server-rendered internal admin portal with mostly CRUD pages,
      but it may grow into a large app with shared controller logic. Compare the
      `mvc` and `webapp` templates side by side, including project structure,
      routing model, auth options, and supported frameworks. Recommend one for this
      situation without creating either project.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)\bmvc\b
      - type: output-matches
        config:
          pattern: (?i)\bwebapp\b
      - type: output-matches
        config:
          pattern: \|.*\|
      - type: output-matches
        config:
          pattern: (?i)recommend
      - type: prompt
    rubric:
      - The comparison accurately distinguishes controllers and views from the Razor Pages page model
      - The table covers the requested structure, routing, authentication, and framework dimensions
      - The recommendation accounts for both the current CRUD focus and likely growth
      - No project files are created
    constraints:
      expect_tools:
        - skill

  - name: Compare REST and gRPC service templates
    prompt: |
      For an internal service-to-service API, should I start from `webapi` or `grpc`?
      Compare the two templates side by side on transport and contracts, browser
      friendliness, streaming, AOT options, and generated project shape. Recommend
      one for high-throughput typed calls between .NET services.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)\bwebapi\b
      - type: output-matches
        config:
          pattern: (?i)\bgrpc\b
      - type: output-matches
        config:
          pattern: (?i)(protobuf|proto)
      - type: output-matches
        config:
          pattern: (?i)recommend
      - type: prompt
    rubric:
      - The comparison is grounded in the installed templates and accurately covers all requested dimensions
      - The recommendation connects typed, high-throughput .NET-to-.NET calls to the chosen template
      - Trade-offs such as browser compatibility and streaming are stated clearly
    constraints:
      expect_tools:
        - skill

  - name: Choose a Blazor or Razor Pages template
    prompt: |
      Compare `blazor` and `webapp` for a customer portal that needs rich interactive
      forms but should render useful HTML on the first request. Show the relevant
      interactivity, authentication, and framework options side by side, then
      recommend a starting template.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)\bblazor\b
      - type: output-matches
        config:
          pattern: (?i)\bwebapp\b
      - type: output-matches
        config:
          pattern: (?i)(interactive|render)
      - type: output-matches
        config:
          pattern: (?i)recommend
      - type: prompt
    rubric:
      - The response compares the actual interactivity, authentication, and framework choices exposed by both templates
      - The recommendation balances first-request rendering with the need for rich interactive forms
      - The answer uses a side-by-side presentation rather than unrelated summaries
    constraints:
      expect_tools:
        - skill

  - name: Select a test project template for an enterprise suite
    prompt: |
      My organization is choosing among the `xunit`, `nunit`, and `mstest` project
      templates for a new enterprise test suite. Compare the generated dependencies,
      default test platform integration, and framework choices side by side. We value
      Microsoft-supported tooling and Visual Studio integration; make a clear
      recommendation and don't create projects.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)\bxunit\b
      - type: output-matches
        config:
          pattern: (?i)\bnunit\b
      - type: output-matches
        config:
          pattern: (?i)\bmstest\b
      - type: output-matches
        config:
          pattern: (?i)recommend
      - type: prompt
    rubric:
      - The comparison reflects the templates' actual generated package and platform choices
      - The three options are compared on the same requested dimensions
      - The recommendation follows from the stated Microsoft tooling and Visual Studio priorities
      - No project files are created
    constraints:
      expect_tools:
        - skill
