name: template-comparison
description: Evaluates the dotnet-template-engine/template-comparison skill
type: capability
defaults:
  timeout: 3m
environment:
  env:
    XDG_DATA_HOME: .xdg-data
    LOCALAPPDATA: .local-app-data
    DOTNET_NOLOGO: "1"
  files:
    - src: ./fixtures/global.json
      dest: global.json
  commands:
    - >-
      node -e "const fs=require('fs');
      fs.mkdirSync('.xdg-data/NuGet/Migrations', { recursive: true });
      fs.writeFileSync('.xdg-data/NuGet/Migrations/1', '');
      fs.mkdirSync('.local-app-data/NuGet/Migrations', { recursive: true });
      fs.writeFileSync('.local-app-data/NuGet/Migrations/1', '');"
stimuli:
  - name: Choose webapi or webapp for a JSON backend
    prompt: |
      Use evidence/template-help.txt to compare `webapi` and `webapp` on
      authentication, AOT, controllers, Docker options, frameworks, and generated
      application shape. Recommend one for a JSON REST backend. Do not create files.
    tags:
      capability: compare-web-backend-templates
      risk: high
      journey: choose-json-backend
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-comparison-webapi-webapp"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              | Aspect | `webapi` | `webapp` |
              |---|---|---|
              | Auth | None, IndividualB2C, SingleOrg, Windows | None, Individual, SingleOrg, Windows |
              | AOT/controllers | `--aot`, `--use-controllers` | Not exposed |
              | Docker option | Not recorded | Not exposed |
              | Frameworks | net8.0, net9.0, net10.0 | net8.0, net9.0, net10.0 |
              | Shape | HTTP API | Razor Pages UI |
              **Recommendation: `webapi`** — it directly fits a JSON REST backend. Preview: `dotnet new webapi --name CatalogApi --dry-run`.
    graders:
      - type: output-matches
        config:
          pattern: (?i)\|.*webapi.*\|.*webapp
      - type: output-matches
        config:
          pattern: (?is)(recommend|use|choose|pick|prefer|start with).{0,80}webapi
      - type: output-matches
        config:
          pattern: (?i)(Not exposed|not recorded)
      - type: prompt
    rubric:
      - Compares both templates on every requested dimension using only the capture
      - Marks absent or unavailable evidence instead of guessing feature parity
      - Selects the API template for the stated backend scenario
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Choose Blazor hosting for offline use
    prompt: |
      I need an app that continues to run after the network drops. Compare
      `blazor` and `blazorwasm` from evidence/template-help.txt, including
      hosting, interactivity, PWA requirements, and first-load behavior. Recommend
      a starting template without creating it.
    tags:
      capability: compare-blazor-hosting-models
      risk: high
      journey: choose-offline-blazor
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-comparison-blazor-offline"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              | Aspect | `blazor` | `blazorwasm` |
              |---|---|---|
              | Hosting | Server plus selectable render modes | Standalone browser WebAssembly |
              | Interactivity | None, Server, WebAssembly, Auto | Client-side WebAssembly |
              | Offline | Server modes need a live server | `--pwa` enables cached app assets |
              | First load | Server-rendered HTML can arrive immediately | Assets must load and be cached first |
              **Recommendation: `blazorwasm --pwa`** for offline execution after the first successful load.
    graders:
      - type: output-matches
        config:
          pattern: (?is)\|.*\bblazor\b.*\|.*(blazorwasm|Blazor WebAssembly)
      - type: output-matches
        config:
          pattern: (?i)(PWA|service worker|cached)
      - type: output-matches
        config:
          pattern: (?is)(recommend|use|choose|pick|prefer|start with).{0,80}(blazorwasm|Blazor WebAssembly)
      - type: prompt
    rubric:
      - Accurately distinguishes the captured hosting and interactivity models
      - Explains that offline use requires PWA caching after an initial load
      - Makes a clear recommendation tied to the offline requirement
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Choose worker or console for a durable queue processor
    prompt: |
      Compare `worker` and `console` from evidence/template-help.txt for a
      long-running service that reads a durable queue. Cover lifecycle,
      dependency injection, configuration, logging, shutdown, and operational
      fit, then recommend one. Do not create a project.
    tags:
      capability: compare-background-process-templates
      risk: medium
      journey: choose-queue-processor
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-comparison-worker-console"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              | Aspect | `worker` | `console` |
              |---|---|---|
              | Lifecycle | Generic Host and BackgroundService | Direct process entry point |
              | DI/config/logging | Built in through the host | Must be assembled explicitly |
              | Shutdown | Hosted-service cancellation and graceful stop | Application-owned handling |
              **Recommendation: `worker`** for a durable queue consumer because its host lifecycle, DI, configuration, logging, and graceful shutdown fit a managed long-running process. The queue itself must still be durable.
    graders:
      - type: output-matches
        config:
          pattern: (?i)\|.*worker.*\|.*console
      - type: output-matches
        config:
          pattern: (?is)(Generic Host|BackgroundService).*(graceful|shutdown)
      - type: output-matches
        config:
          pattern: (?is)(recommend|use|choose|pick|prefer|start with).{0,80}worker
      - type: prompt
    rubric:
      - Compares the two generated application models on the requested operational concerns
      - Connects the hosted-service lifecycle to long-running queue processing
      - Does not imply that the template itself supplies a durable queue
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Choose MVC or Razor Pages for a growing admin portal
    prompt: |
      Compare `mvc` and `webapp` from evidence/template-help.txt for a
      server-rendered internal admin portal. It starts as CRUD pages but may grow
      shared controller logic. Cover structure, routing, auth, and frameworks,
      then recommend one. Do not create files.
    tags:
      capability: compare-server-rendered-web-models
      risk: medium
      journey: choose-admin-portal
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-comparison-mvc-webapp"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              | Aspect | `mvc` | `webapp` |
              |---|---|---|
              | Structure | Controllers, Views, Models | Razor Pages and PageModel classes |
              | Routing | Conventional or attribute routes | File/page-oriented routes |
              | Auth | None, Individual, SingleOrg, Windows | None, Individual, SingleOrg, Windows |
              | Frameworks | net8.0, net9.0, net10.0 | net8.0, net9.0, net10.0 |
              **Recommendation: `mvc`** because the expected shared controller logic and application growth outweigh Razor Pages' simpler CRUD start.
    graders:
      - type: output-matches
        config:
          pattern: (?is)\|.*mvc.*\|.*(webapp|Razor Pages)
      - type: output-matches
        config:
          pattern: (?is)((PageModel|Razor Pages).*(controller|MVC)|(controller|MVC).*(PageModel|Razor Pages))
      - type: output-matches
        config:
          pattern: (?is)(recommend|use|choose|pick|prefer|start with).{0,80}mvc
      - type: prompt
    rubric:
      - Accurately distinguishes controller/view and page-oriented structures
      - Covers all requested decision dimensions with comparable evidence
      - Weighs likely growth and shared controller logic in the recommendation
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Choose REST or gRPC for typed internal calls
    prompt: |
      Compare `webapi` and `grpc` from evidence/template-help.txt for
      high-throughput calls between .NET services. Cover contracts, transport,
      browser friendliness, streaming, AOT evidence, and generated project
      shape. Recommend one without creating it.
    tags:
      capability: compare-service-contract-templates
      risk: high
      journey: choose-internal-service-protocol
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-comparison-webapi-grpc"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              | Aspect | `webapi` | `grpc` |
              |---|---|---|
              | Contract | HTTP API conventions | Protocol Buffers in Protos/greet.proto |
              | Transport/streaming | Browser-friendly HTTP APIs | HTTP/2 with unary and streaming RPCs |
              | AOT evidence | `--aot` is exposed | No AOT option is recorded in the capture |
              | Shape | API Program.cs | Proto, service implementation, Program.cs |
              **Recommendation: `grpc`** for typed, high-throughput .NET-to-.NET calls; choose `webapi` when direct browser compatibility is primary.
    graders:
      - type: output-matches
        config:
          pattern: (?i)\|.*webapi.*\|.*grpc
      - type: output-matches
        config:
          pattern: (?is)(Protocol Buffers|proto).*(HTTP/2|stream)
      - type: output-matches
        config:
          pattern: (?is)(recommend|use|choose|pick|prefer|start with).{0,80}grpc
      - type: prompt
    rubric:
      - Uses captured template evidence for generated shape and option support
      - States the typed-contract, streaming, and browser trade-offs accurately
      - Selects gRPC for the stated service-to-service workload while naming the REST boundary
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Choose Blazor or Razor Pages for interactive forms
    prompt: |
      Compare `blazor` and `webapp` from evidence/template-help.txt for a customer
      portal with rich interactive forms and useful HTML on the first response.
      Cover rendering, interaction model, auth, and frameworks, then recommend a
      starting template. Do not create it.
    tags:
      capability: compare-interactive-web-templates
      risk: high
      journey: choose-customer-portal
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-comparison-blazor-webapp"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              | Aspect | `blazor` | `webapp` |
              |---|---|---|
              | First response | Server rendering is available | Server-rendered Razor Pages |
              | Rich interaction | Server, WebAssembly, or Auto components | PageModel forms plus added client code |
              | Auth | None or Individual in the capture | None, Individual, SingleOrg, Windows |
              | Frameworks | net8.0, net9.0, net10.0 | net8.0, net9.0, net10.0 |
              **Recommendation: `blazor` with Server interactivity** because it can send useful initial HTML and then run component-based interactive forms.
    graders:
      - type: output-matches
        config:
          pattern: (?is)\|.*blazor.*\|.*(webapp|Razor Pages)
      - type: output-matches
        config:
          pattern: (?is)((first response|initial HTML|server render).*(interactive|interactivity)|(interactive|interactivity).*(first response|initial HTML|server render))
      - type: output-matches
        config:
          pattern: (?is)(recommend|use|choose|pick|prefer|start with).{0,80}blazor
      - type: prompt
    rubric:
      - Compares the captured rendering, interaction, authentication, and framework choices
      - Explains how server interactivity meets both initial-render and rich-form needs
      - Distinguishes component forms from the Razor Pages PageModel approach
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Choose an enterprise test project template
    prompt: |
      Compare the captured `xunit`, `nunit`, and `mstest` template project files
      in evidence/. Show generated dependencies, test-platform integration, and
      target framework side by side. We prioritize Microsoft-supported tooling
      and native Microsoft.Testing.Platform use. Do not create projects.
    tags:
      capability: compare-generated-test-dependencies
      risk: high
      journey: choose-enterprise-test-template
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/xunit-template.csproj
          dest: evidence/xunit-template.csproj
        - src: ./fixtures/captured-sdk-10/nunit-template.csproj
          dest: evidence/nunit-template.csproj
        - src: ./fixtures/captured-sdk-10/mstest-template.csproj
          dest: evidence/mstest-template.csproj
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-comparison-test-projects"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              | Template | Generated dependencies/platform | Framework |
              |---|---|---|
              | `xunit` | Microsoft.NET.Test.Sdk, xunit, VS runner, coverlet | net10.0 |
              | `nunit` | Microsoft.NET.Test.Sdk, NUnit, NUnit3TestAdapter, coverlet | net10.0 |
              | `mstest` | MSTest.Sdk 3.8.3 with EnableMSTestRunner and TestingPlatformDotnetTestSupport | net10.0 |
              **Recommendation: `mstest`** because this capture directly enables the MSTest runner and Microsoft.Testing.Platform bridge while matching the Microsoft tooling preference.
    graders:
      - type: output-matches
        config:
          pattern: (?is)\|.*xunit.*\|.*nunit.*\|.*mstest
      - type: output-matches
        config:
          pattern: (?i)(MSTest\.Sdk|EnableMSTestRunner).*(TestingPlatformDotnetTestSupport|Microsoft\.Testing\.Platform)
      - type: output-matches
        config:
          pattern: (?is)(recommend|use|choose|pick|prefer|start with).{0,80}mstest
      - type: prompt
    rubric:
      - Reads generated package and platform choices from the captured project files
      - Compares all three templates on the same requested dimensions
      - Grounds the MSTest recommendation in the stated platform and support priorities
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Choose a library template for reusable UI components
    prompt: |
      I am packaging reusable components and static styles for several ASP.NET
      Core applications. Compare `classlib` and `razorclasslib` from
      evidence/template-help.txt on generated shape, Razor support, static web
      assets, and framework choices. Recommend one without creating it.
    tags:
      capability: compare-overlapping-library-templates
      risk: medium
      journey: choose-ui-component-library
    environment:
      files:
        - src: ./fixtures/captured-sdk-10/template-help.txt
          dest: evidence/template-help.txt
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-comparison-classlib-razorclasslib"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              | Aspect | `classlib` | `razorclasslib` |
              |---|---|---|
              | Shape | Ordinary .NET library with Class1.cs | Razor components, _Imports.razor, and wwwroot |
              | Razor/static assets | Not exposed | Built for components and static web assets |
              | Frameworks | net8.0, net9.0, net10.0 | net8.0, net9.0, net10.0 |
              **Recommendation: `razorclasslib`** because the package must carry reusable UI components and styles. Use `classlib` for non-UI shared code.
    graders:
      - type: output-matches
        config:
          pattern: (?is)\|.*(classlib|class library).*\|.*(razorclasslib|Razor Class Library)
      - type: output-matches
        config:
          pattern: (?i)(Razor components|static web assets|wwwroot)
      - type: output-matches
        config:
          pattern: (?is)(recommend|use|choose|pick|prefer|start with).{0,80}(razorclasslib|Razor Class Library)
      - type: prompt
    rubric:
      - Compares two genuinely overlapping library choices on UI packaging needs
      - Accurately distinguishes ordinary libraries from Razor component/static-asset libraries
      - Selects the Razor class library for the stated reusable UI workload
    constraints:
      expect_tools: [skill]
      reject_tools: [edit, create]

  - name: Stay dormant for single-template inspection
    prompt: |
      Inspect only the installed `worker` template. List its exact framework
      choices, defaults, and every creation option, then give one safe example
      command. I am not comparing it with another template.
    tags:
      capability: boundary-single-template-discovery
      risk: routing
      journey: handoff-to-template-discovery
    expect_activation: false
    golden_trajectory:
      inline:
        schema_version: "ATIF-v1.6"
        session_id: "template-comparison-dormancy-discovery"
        agent: { name: reference, version: "1.0.0", model_name: curated }
        steps:
          - step_id: 1
            source: agent
            message: |-
              This is a single-template inspection, so it belongs to template discovery rather than comparison. Inspect the installed worker help, report its observed choices and defaults, and provide a `dotnet new worker --name QueueProcessor --dry-run` example. No side-by-side comparison or file creation is needed.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(worker template|single template|inspect)
      - type: output-matches
        config:
          pattern: (?i)dotnet new worker.*--dry-run
      - type: prompt
    rubric:
      - Recognizes that one-template inspection belongs to the discovery workflow
      - The comparison skill stayed dormant and did not manufacture a second template
      - Redirects to the sibling capability while preserving the useful next action
    constraints:
      reject_tools: [edit, create]
