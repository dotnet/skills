name: template-validation
description: Evaluates the dotnet-template-engine/template-validation skill
type: capability
defaults:
  timeout: 3m
stimuli:
  - name: Validate template with multiple errors
    prompt: Check this template.json for any issues. It's at .template.config/template.json
    environment:
      files:
        - src: ./fixtures/validate-template-with-multiple-errors/.template.config/template.json
          dest: .template.config/template.json
    graders:
      - type: exit-success
      - type: output-contains
        config:
          substring: identity
      - type: output-matches
        config:
          pattern: (?i)shortName.*(list|conflict|reserved|CLI)
      - type: output-matches
        config:
          pattern: (?i)(net7\.0|default.*not in|not.*valid.*choice)
      - type: output-matches
        config:
          pattern: (?i)((enableLogging|yes).*(bool|boolean).*(invalid|not\s+valid|must\s+be|expected)|(enableLogging|yes).*(invalid|not\s+valid|must\s+be|expected).*(bool|boolean))
      - type: output-matches
        config:
          pattern: (?i)((maxRetries|abc).*(int|integer).*(invalid|not\s+valid|must\s+be|expected)|(maxRetries|abc).*(invalid|not\s+valid|must\s+be|expected).*(int|integer))
      - type: output-matches
        config:
          pattern: (?i)computed.*(missing|no).*value
      - type: output-matches
        config:
          pattern: (?i)generated.*(missing|no).*generator
      - type: output-matches
        config:
          pattern: (?i)(actionId|post.?action).*(missing|required|no)
      - type: output-matches
        config:
          pattern: (?i)(not ready|\d+\s*error)
      - type: output-matches
        config:
          pattern: \|.*\|
      - type: prompt
    rubric:
      - The agent identified the missing 'identity' field (required)
      - The agent flagged 'list' as a shortName that conflicts with a dotnet new subcommand
      - The agent found that defaultValue 'net7.0' is not in the choices (net8.0, net9.0)
      - The agent reported that 'yes' is not a valid boolean defaultValue for enableLogging
      - The agent reported that 'abc' is not a valid integer defaultValue for maxRetries
      - The agent found the computed symbol missing its 'value' expression
      - The agent found the generated symbol missing its 'generator' field
      - The agent found the post-action missing its 'actionId'
    constraints:
      expect_tools:
        - skill
  - name: Validate correct template and suggest improvements
    prompt: Review the template at .template.config/template.json and tell me if it's ready to publish to NuGet.
    environment:
      files:
        - src: ./fixtures/validate-correct-template-and-suggest-improvements/.template.config/template.json
          dest: .template.config/template.json
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)(no errors?\b|0 errors?\b|template (is|looks) (valid|good)|ready to publish|no issues? (found|identified)?)
      - type: output-matches
        config:
          pattern: (?i)\b(identity|shortName|name)\b
      - type: prompt
    rubric:
      - The agent confirmed the template has no errors
      - The agent verified all required fields (identity, name, shortName) are present
      - The agent checked that shortName doesn't conflict with CLI commands
      - The agent noted the template is well-formed and ready to publish
      - The agent may suggest optional improvements (defaultName, description) without flagging errors
    constraints:
      expect_tools:
        - skill

  - name: Report a malformed template with its parse location
    prompt: |
      My custom template stopped installing after I edited
      `.template.config/template.json`. Validate it, identify the syntax problem
      precisely, and show the concrete correction.
    environment:
      files:
        - src: ./fixtures/malformed-template/.template.config/template.json
          dest: .template.config/template.json
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)(parse|syntax|JSON).*(line|:)
      - type: output-matches
        config:
          pattern: (?i)(missing comma|expected.*comma|add.*comma|unexpected)
      - type: output-matches
        config:
          pattern: (?i)(not ready|[1-9]\d*\s+errors?\b)
      - type: prompt
    rubric:
      - The response identifies the malformed JSON and points to its location
      - It gives the specific edit needed to make the file parse
      - It does not continue with speculative semantic findings after parsing failed
    constraints:
      expect_tools:
        - skill

  - name: Validate discoverability metadata severity
    prompt: |
      Review `.template.config/template.json` before I publish this template.
      Report errors, warnings, and suggestions with a concrete fix for each.
    environment:
      files:
        - src: ./fixtures/discoverability-metadata/.template.config/template.json
          dest: .template.config/template.json
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)sourceName
      - type: output-matches
        config:
          pattern: (?i)(description|defaultName)
      - type: output-matches
        config:
          pattern: \|.*\|
      - type: output-matches
        config:
          pattern: (?i)(publishable|0 errors|no errors)
      - type: prompt
    rubric:
      - Missing sourceName is reported as a warning and distinguished from optional discoverability metadata
      - Missing description and defaultName are treated as optional improvements rather than errors
      - Findings are severity-ordered and summarized accurately
    constraints:
      expect_tools:
        - skill

  - name: Check every short name in an alias array
    prompt: |
      This template has more than one short-name alias. Validate
      `.template.config/template.json` against the installed SDK's command names
      and tell me whether every alias is safe to publish.
    environment:
      files:
        - src: ./fixtures/short-name-array/.template.config/template.json
          dest: .template.config/template.json
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)\bsearch\b.*(conflict|reserved|subcommand|rename|unsafe)
      - type: output-matches
        config:
          pattern: (?i)\bacme-service\b.*(safe|valid|no conflict|fine)
      - type: output-matches
        config:
          pattern: (?i)(dotnet new --help|Commands:)
      - type: prompt
    rubric:
      - Every alias is checked rather than treating the shortName array as one scalar
      - The reserved search alias is rejected based on the installed SDK's dotnet new subcommands
      - The non-conflicting alias is not incorrectly rejected
      - A concrete replacement for the conflicting alias is supplied
    constraints:
      expect_tools:
        - skill

  - name: Find incomplete symbol definitions
    prompt: |
      This template's custom parameters are not appearing in `dotnet new --help`.
      Validate `.template.config/template.json`, focusing on every symbol definition,
      and give exact fixes for anything incomplete.
    environment:
      files:
        - src: ./fixtures/incomplete-symbols/.template.config/template.json
          dest: .template.config/template.json
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)EnableCaching.*(missing|no|required).*type
      - type: output-matches
        config:
          pattern: (?i)(Color|choice).*(empty|no choices|missing choices)
      - type: output-matches
        config:
          pattern: (?i)EnableCaching.*"type"\s*:\s*"parameter"
      - type: prompt
    rubric:
      - The symbol missing its required type is reported as an error with a concrete parameter type fix
      - The choice parameter's empty choices object is reported as an error
      - The response proposes actual choice entries rather than only restating that the object is empty
      - Findings do not invent unrelated source-condition or prefix-collision errors
    constraints:
      expect_tools:
        - skill

  - name: Review post-action and constraint completeness
    prompt: |
      Check `.template.config/template.json` before release. Pay particular
      attention to whether its post-action can guide users when automation is
      unavailable and whether its host constraint is complete.
    environment:
      files:
        - src: ./fixtures/post-action-and-constraint/.template.config/template.json
          dest: .template.config/template.json
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)post.?action.*description
      - type: output-matches
        config:
          pattern: (?i)manualInstructions
      - type: output-matches
        config:
          pattern: (?i)constraint.*args
      - type: output-matches
        config:
          pattern: \|.*\|
      - type: prompt
    rubric:
      - Missing post-action description and manual instructions are reported separately
      - The incomplete constraint is identified and given a specific args fix
      - The existing actionId and constraint type are not falsely reported as missing
      - The final totals match the findings
    constraints:
      expect_tools:
        - skill
