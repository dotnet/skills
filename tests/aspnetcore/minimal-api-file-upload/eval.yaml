scenarios:
  - name: "Implement secure file upload in ASP.NET Core 8 minimal API"
    prompt: |
      I need to implement a file upload endpoint in my ASP.NET Core 8 minimal API.
      The endpoint should accept image files (JPEG and PNG only), reject files over 10MB,
      and save them to an "uploads" folder. My app already has UseAntiforgery() in the pipeline.
      Show me the complete implementation including size limits configuration and the endpoint.
    assertions:
      - type: "output_matches"
        pattern: "(IFormFile|IFormFileCollection)"
      - type: "output_matches"
        pattern: "(Guid\\.NewGuid|Path\\.GetRandomFileName)"
    rubric:
      - "Configures both the Kestrel request body size limit and the form multipart body length limit — not just one of them"
      - "Handles the antiforgery middleware that would otherwise reject the upload with a 400 error"
      - "Does not save to disk using the original user-provided filename — generates a safe name to prevent path traversal"
      - "Verifies the actual file content (e.g., magic bytes or file signatures), not just the Content-Type header which can be spoofed"
    timeout: 180

  - name: "File upload should not use magic bytes for JSON API"
    expect_activation: false
    prompt: |
      I'm building a REST API in ASP.NET Core that accepts JSON payloads.
      How do I validate the request body schema?
    rubric:
      - "Response focuses on JSON validation (e.g., model binding, FluentValidation, data annotations) and does NOT suggest magic bytes or file upload patterns"
    timeout: 60

  - name: "Fix broken file upload endpoint in ASP.NET Core minimal API"
    prompt: |
      My ASP.NET Core 8 minimal API file upload endpoint has several problems.
      It's supposed to accept JPEG and PNG image uploads via IFormFile but it
      doesn't work correctly in production — uploads fail, and I'm worried the
      file handling isn't safe. Can you fix the file upload implementation in
      Program.cs?
    setup:
      files:
        - path: "Program.cs"
          content: |
            using Microsoft.AspNetCore.Http;

            var builder = WebApplication.CreateBuilder(args);
            builder.Services.AddAntiforgery();
            var app = builder.Build();
            app.UseAntiforgery();

            app.MapPost("/api/upload", async (IFormFile file) =>
            {
                var allowedTypes = new[] { "image/jpeg", "image/png" };
                if (!allowedTypes.Contains(file.ContentType))
                    return Results.BadRequest("Invalid file type");

                var uploadPath = Path.Combine("uploads", file.FileName);
                Directory.CreateDirectory("uploads");
                using var stream = File.Create(uploadPath);
                await file.CopyToAsync(stream);

                return Results.Ok(new { file.FileName, file.Length });
            });

            app.Run();
        - path: "UploadApp.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk.Web">
              <PropertyGroup>
                <TargetFramework>net8.0</TargetFramework>
              </PropertyGroup>
            </Project>
    assertions:
      - type: "output_matches"
        pattern: "(path traversal|safe.?name|Guid|sanitiz)"
    rubric:
      - "Identified that using file.FileName directly for the save path allows path traversal attacks"
      - "Identified that checking only ContentType is insufficient because it can be spoofed by the client"
      - "Identified that the antiforgery middleware will reject API upload requests with a 400 error"
    timeout: 240
