scenarios:
  - name: "Add per-client rate limiting to an ASP.NET Core API"
    prompt: |
      I need to add rate limiting to my ASP.NET Core 8 API. Requirements:
      1. Global limit: 100 requests per minute per IP address
      2. Stricter limit on POST /api/orders: 10 requests per minute per authenticated user
      3. No limit on GET /healthz
      4. Return a proper 429 response with Retry-After header when rate limited

      Show me the full Program.cs configuration and how to apply it to the endpoints.
    assertions:
      - type: "output_matches"
        pattern: "(AddRateLimiter|UseRateLimiter)"
      - type: "output_matches"
        pattern: "(429|TooManyRequests)"
      - type: "output_matches"
        pattern: "(RequireRateLimiting|EnableRateLimiting)"
      - type: "output_matches"
        pattern: "DisableRateLimiting"
      - type: "output_matches"
        pattern: "/healthz"
    rubric:
      - "Set RejectionStatusCode to 429 (NOT the default 503) — this is critical"
      - "Placed UseRateLimiter() AFTER UseRouting() in the middleware pipeline"
      - "Used partitioned rate limiter for per-IP global limiting"
      - "Applied a named policy to the POST /api/orders endpoint with per-user partitioning"
      - "Disabled rate limiting on the healthz endpoint"
      - "Configured OnRejected callback that sets Retry-After header"
    timeout: 120

  - name: "Fix rate limiter returning 503 instead of 429"
    prompt: |
      My ASP.NET Core API rate limiter is returning 503 Service Unavailable instead of 429 Too Many Requests when clients hit the limit. Clients are confused because 503 usually means the server is down. How do I fix this?
    setup:
      files:
        - path: "Program.cs"
          content: |
            var builder = WebApplication.CreateBuilder(args);

            builder.Services.AddRateLimiter(options =>
            {
                options.GlobalLimiter = PartitionedRateLimiter.Create<HttpContext, string>(context =>
                    RateLimitPartition.GetFixedWindowLimiter(
                        context.Connection.RemoteIpAddress?.ToString() ?? "unknown",
                        _ => new FixedWindowRateLimiterOptions
                        {
                            PermitLimit = 60,
                            Window = TimeSpan.FromMinutes(1)
                        }));
            });

            var app = builder.Build();
            app.UseRateLimiter();
            app.MapGet("/api/data", () => "Hello!");
            app.Run();
        - path: "RateLimitBug.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk.Web">
              <PropertyGroup>
                <TargetFramework>net8.0</TargetFramework>
              </PropertyGroup>
            </Project>
    assertions:
      - type: "output_matches"
        pattern: "(RejectionStatusCode|429|TooManyRequests)"
    rubric:
      - "Identified the root cause: default RejectionStatusCode is 503, must explicitly set to 429"
      - "Provided code that correctly configures the rate limiter to return HTTP 429 instead of 503"
      - "Suggested providing a meaningful response body or headers so clients know when to retry"
    timeout: 180

  - name: "Combine rate limiting with authentication-aware partitioning"
    prompt: |
      My ASP.NET Core 8 API has two concerns:
      1. Public endpoints (/api/products, /api/search) need per-IP rate limiting at 60 req/min
      2. Authenticated endpoints (/api/orders, /api/account) need per-user rate limiting at 30 req/min
      3. The login endpoint (/api/auth/login) needs brute-force protection — max 5 failed attempts per IP per minute

      How should I configure rate limiting to handle all three cases? Should I use the built-in rate limiting middleware for all of them, or do some need a different approach?
    assertions:
      - type: "output_matches"
        pattern: "(AddRateLimiter|UseRateLimiter)"
      - type: "output_matches"
        pattern: "(per-user|per.user|ClaimTypes|NameIdentifier|User\\.Find)"
    rubric:
      - "Configured per-IP rate limiting for public endpoints"
      - "Configured per-authenticated-user rate limiting for protected endpoints using claims-based partitioning"
      - "Recognized that brute-force login protection has different requirements than API rate limiting"
      - "Explained the tradeoffs of using rate limiting middleware vs. Identity lockout or custom logic for login throttling"
    timeout: 120

  - name: "Choose correct rate limiting algorithm"
    prompt: |
      I'm building a payment processing API. I need to rate limit to exactly 100 transactions per hour per merchant, with no bursting allowed — each merchant should get a steady, even flow of requests. Which .NET rate limiting algorithm should I use and why?
    assertions:
      - type: "output_matches"
        pattern: "(TokenBucket|token.bucket|SlidingWindow|sliding.window)"
    rubric:
      - "Recommended an algorithm that prevents bursting at window boundaries (NOT fixed window)"
      - "Explained why fixed window is unsuitable when even distribution is required"
      - "Showed a working rate limiter configuration with correct options for the chosen algorithm"
      - "Implemented per-merchant partitioning so each merchant has an independent rate limit"
    timeout: 120

  - name: "Diagnose multiple interacting rate limiting bugs"
    prompt: |
      My ASP.NET Core 8 API has rate limiting configured but it's completely broken. When I test it:
      - Named policy endpoints are never rate limited (unlimited requests succeed)
      - The global limiter DOES trigger, but returns 503 instead of 429
      - When rate limited, there's no Retry-After header or error body

      Can you look at my Program.cs and tell me everything that's wrong?
    setup:
      files:
        - path: "Program.cs"
          content: |
            using Microsoft.AspNetCore.RateLimiting;
            using System.Threading.RateLimiting;

            var builder = WebApplication.CreateBuilder(args);

            builder.Services.AddRateLimiter(options =>
            {
                options.GlobalLimiter = PartitionedRateLimiter.Create<HttpContext, string>(context =>
                    RateLimitPartition.GetFixedWindowLimiter(
                        context.Connection.RemoteIpAddress?.ToString() ?? "unknown",
                        _ => new FixedWindowRateLimiterOptions
                        {
                            PermitLimit = 100,
                            Window = TimeSpan.FromMinutes(1)
                        }));

                options.AddTokenBucketLimiter("api", tokenOptions =>
                {
                    tokenOptions.TokenLimit = 20;
                    tokenOptions.ReplenishmentPeriod = TimeSpan.FromSeconds(10);
                    tokenOptions.TokensPerPeriod = 5;
                    tokenOptions.AutoReplenishment = false;
                    tokenOptions.QueueLimit = 0;
                });
            });

            var app = builder.Build();
            app.UseAuthorization();
            app.UseRouting();
            app.UseRateLimiter();

            app.MapGet("/api/data", () => "Hello!").RequireRateLimiting("api");
            app.MapGet("/api/health", () => "OK");
            app.Run();
        - path: "BrokenRateLimiting.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk.Web">
              <PropertyGroup>
                <TargetFramework>net8.0</TargetFramework>
              </PropertyGroup>
            </Project>
    assertions:
      - type: "output_matches"
        pattern: "(RejectionStatusCode|429)"
      - type: "output_matches"
        pattern: "(AutoReplenishment|auto.replenish)"
    rubric:
      - "Identified that RejectionStatusCode is not set, causing the default 503 response"
      - "Found the AutoReplenishment = false bug that causes the token bucket to reject all requests after the initial burst"
      - "Identified the middleware ordering issue and explained the correct order"
      - "Suggested adding an OnRejected callback for proper error responses with Retry-After"
    timeout: 240

  - name: "Rate limiting behind a reverse proxy"
    prompt: |
      My ASP.NET Core 8 API uses AddRateLimiter with per-IP partitioning (RemoteIpAddress). It works perfectly in development, but after deploying behind a load balancer, ALL clients share the same rate limit — once the global 100 req/min is hit, every client gets 429 Too Many Requests even though individual clients are well under the limit. How do I fix my per-client rate limiting partitioning?
    setup:
      files:
        - path: "Program.cs"
          content: |
            using Microsoft.AspNetCore.RateLimiting;
            using System.Threading.RateLimiting;

            var builder = WebApplication.CreateBuilder(args);

            builder.Services.AddRateLimiter(options =>
            {
                options.RejectionStatusCode = StatusCodes.Status429TooManyRequests;
                options.GlobalLimiter = PartitionedRateLimiter.Create<HttpContext, string>(context =>
                {
                    var ip = context.Connection.RemoteIpAddress?.ToString() ?? "unknown";
                    return RateLimitPartition.GetSlidingWindowLimiter(ip, _ => new SlidingWindowRateLimiterOptions
                    {
                        PermitLimit = 100,
                        Window = TimeSpan.FromMinutes(1),
                        SegmentsPerWindow = 6
                    });
                });
            });

            var app = builder.Build();
            app.UseRouting();
            app.UseRateLimiter();
            app.MapGet("/api/data", () => "Hello!");
            app.Run();
        - path: "ProxyBug.csproj"
          content: |
            <Project Sdk="Microsoft.NET.Sdk.Web">
              <PropertyGroup>
                <TargetFramework>net8.0</TargetFramework>
              </PropertyGroup>
            </Project>
    assertions:
      - type: "output_matches"
        pattern: "(ForwardedHeaders|KnownProxies|KnownNetworks|UseForwardedHeaders)"
    rubric:
      - "Identified that behind a reverse proxy, RemoteIpAddress returns the proxy's IP, not the client's"
      - "Explained that all requests appear to come from the same partition key, exhausting the shared limit"
      - "Provided a concrete solution using ForwardedHeadersMiddleware with KnownProxies or KnownNetworks"
      - "Warned about security risks of trusting forwarded headers without restricting to known proxies"
    timeout: 180
