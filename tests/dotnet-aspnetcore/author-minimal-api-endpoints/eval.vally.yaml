name: author-minimal-api-endpoints
description: Evaluates the dotnet-aspnetcore/author-minimal-api-endpoints skill
type: capability
config:
  timeout: 12m
stimuli:
  - name: CRUD endpoints for orders
    prompt: |
      In the StoreApi project, add minimal API endpoints for orders backed by the existing StoreDbContext:
      - list all orders
      - get a single order by id
      - create a new order for a customer
      - update an existing order's status
      - delete an order
      Register the endpoints in the app. Just add the endpoint code to the StoreApi project; you don't need to run it.
    environment:
      files:
        - src: ./fixture/StoreApi
          dest: StoreApi
    graders:
      - type: file-contains
        config:
          path: StoreApi/**/*.cs
          value: MapPost
      - type: file-contains
        config:
          path: StoreApi/**/*.cs
          value: MapDelete
      - type: prompt
      - type: pairwise
    rubric:
      - The create (POST) endpoint returns 201 Created with a Location header pointing at the new order (for example via CreatedAtRoute or TypedResults.Created), not 200 with the entity
      - Get, update, and delete return 404 Not Found when the order id does not exist
      - The delete endpoint returns 204 No Content on success
      - Endpoints declare explicit response types using Results<...> union return types or TypedResults rather than untyped Results/IResult, so each status code is discoverable
      - The order endpoints are grouped under a single route group (for example MapGroup("/orders")) instead of repeating the path prefix on every call
      - Database access is awaited asynchronously (async handlers, ToListAsync/FindAsync/SaveChangesAsync)
  - name: Product listing with filter and pagination
    prompt: |
      Add a minimal API endpoint to the StoreApi project that lists products from the StoreDbContext.
      It should let the caller filter by category id and page through the results with a page number and page size. Return the matching products.
    environment:
      files:
        - src: ./fixture/StoreApi
          dest: StoreApi
    graders:
      - type: file-contains
        config:
          path: StoreApi/**/*.cs
          value: MapGet
      - type: prompt
      - type: pairwise
    rubric:
      - The category id, page number, and page size are bound from the query string
      - Pagination is actually applied to the query (Skip/Take) instead of materializing every product and filtering in memory
      - Invalid paging input (non-positive page or page size, or an excessively large page size) is rejected with a 400 ProblemDetails / ValidationProblem rather than silently accepted
      - The endpoint returns 200 OK and declares its response type via TypedResults or a Results<...> union
      - The query is executed asynchronously (ToListAsync) and uses no-tracking reads for a read-only listing
  - name: Add a line item to an order
    prompt: |
      Add a minimal API endpoint to the StoreApi project that adds a line item (a product and a quantity) to an existing order using the StoreDbContext.
      If the order or the product does not exist, the caller should get a clear error. The quantity must be at least 1.
    environment:
      files:
        - src: ./fixture/StoreApi
          dest: StoreApi
    graders:
      - type: file-contains
        config:
          path: StoreApi/**/*.cs
          value: Map
      - type: prompt
      - type: pairwise
    rubric:
      - Returns 404 Not Found when the order id or the product id does not exist
      - Returns a 400 ProblemDetails / ValidationProblem when the quantity is less than 1, rather than persisting an invalid line item
      - Returns a success status that reflects creation of a sub-resource (201 Created, or 200 with the updated order) on the happy path
      - Uses a Results<...> union or TypedResults that covers the success and both error outcomes so every status code is explicit
      - Validates the input before touching the database rather than trusting the request body
  - name: Manage a customer's single shipping address
    prompt: |
      A customer in the StoreApi project has at most one shipping address (a one-to-one relationship).
      Add minimal API endpoints to get a customer's address and to set it, where setting creates the address if the customer doesn't have one yet or updates it if they do. Use the StoreDbContext.
    environment:
      files:
        - src: ./fixture/StoreApi
          dest: StoreApi
    graders:
      - type: file-contains
        config:
          path: StoreApi/**/*.cs
          value: MapGet
      - type: prompt
      - type: pairwise
    rubric:
      - The address is modeled as a single nested resource (for example /customers/{id}/address), not as a collection
      - The set operation uses PUT semantics so it is idempotent create-or-update, returning 204 No Content (or 200) on success
      - Both endpoints return 404 Not Found when the customer does not exist (and GET returns 404 when no address has been set)
      - Endpoints declare explicit response types via Results<...> unions or TypedResults
      - The create-or-update logic correctly distinguishes the missing-address case from the existing-address case instead of always inserting
