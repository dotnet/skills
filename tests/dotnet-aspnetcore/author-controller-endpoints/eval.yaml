name: author-controller-endpoints
description: Evaluates the dotnet-aspnetcore/author-controller-endpoints skill (endpoint-authoring scope)
type: capability
config:
  timeout: 16m
stimuli:
  - name: A Web API for messaging namespaces
    prompt: |
      Add a Web API to the MessagingApi project for managing messaging namespaces, backed by MessagingDbContext (the project already uses controllers). Clients need to create a namespace, update an existing one, get a namespace by its name, list all namespaces, change a namespace's tags, and delete a namespace.
    environment:
      files:
        - src: ./fixture/MessagingApi
          dest: MessagingApi
    graders:
      - type: file-contains
        config:
          path: MessagingApi/**/*.cs
          value: Controller
      - type: prompt
    rubric:
      - A single controller owns the namespace resource and its operations, rather than the resource being split across unrelated controllers or one controller per database table
      - Creating a namespace returns 201 with a Location header pointing at the new resource, and updating an existing one returns 200 or 204; the namespace is addressed by its name in the route
      - Changing tags is exposed as a focused partial update with its own route, returning the right status code, rather than requiring a full-resource replacement
      - Actions return ActionResult<T> typed results with correct status codes, returning 404 when a namespace is absent and the right success codes otherwise
      - Each additional non-success status an action can produce is declared with ProducesResponseType
  - name: A Web API for the queues in a namespace
    prompt: |
      Add a Web API to the MessagingApi project for the queues that live in a messaging namespace, backed by MessagingDbContext. Clients need to create a queue, update it, get a queue, list the queues in a namespace, and delete a queue.
    environment:
      files:
        - src: ./fixture/MessagingApi
          dest: MessagingApi
    graders:
      - type: file-contains
        config:
          path: MessagingApi/**/*.cs
          value: Controller
      - type: prompt
    rubric:
      - The queue endpoints are reached through their owning namespace, with the namespace as part of the route and the queue identified within it, rather than a flat top-level queues resource
      - A request for a queue under a namespace that does not exist returns 404
      - Actions return typed results with correct status codes, with create returning 201 and a Location header, update returning 200 or 204, and 404 when the queue is absent
  - name: Recovering deleted namespaces
    prompt: |
      Namespaces in the MessagingApi project sometimes get deleted by mistake. Add the ability for clients to see the namespaces that have been deleted, bring a deleted namespace back, and permanently get rid of a deleted namespace they no longer want. Use MessagingDbContext.
    environment:
      files:
        - src: ./fixture/MessagingApi
          dest: MessagingApi
    graders:
      - type: file-contains
        config:
          path: MessagingApi/**/*.cs
          value: Controller
      - type: prompt
    rubric:
      - Listing deleted namespaces is exposed as a distinct endpoint, separate from the normal list endpoint
      - Restore is a distinct operation that returns a success status when it brings a namespace back and 404 when the named namespace is not in a recoverable state
      - Permanently removing a namespace is a distinct operation that returns 204 on success and 404 when it does not apply
      - Restore and permanent-removal are exposed as explicit operations with their own routes, distinct from the ordinary create, update, and delete actions
