name: winforms-expert
description: Evaluates the dotnet-winforms/winforms-expert skill
type: capability
defaults:
  timeout: 10m
  runs: 1
stimuli:
  - name: Add a button with a named event handler
    tags:
      capability: designer-event-wiring
      risk: medium
      journey: implementation
    prompt: |
      In this WinForms customer editor, add a Clear button beside Save. Name the
      control `_clearButton`; clicking it must clear `_customerNameTextBox`.
      Keep the form editable in the Visual Studio WinForms designer, then build
      WinFormsFixture.csproj.
    environment:
      files:
        - src: fixtures/add-control
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario add-control
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Adds the requested Clear button and wires it to a named code-behind event handler that clears the customer name
      - Keeps the control declaration, construction, property assignments, event hookup, and Controls.Add call in the designer file
      - Keeps executable handler logic out of MainForm.Designer.cs so the form remains designer-loadable
      - Builds the Windows-targeted project successfully after the change

  - name: Replace absolute positioning with a responsive layout container
    tags:
      capability: responsive-layout
      risk: high
      journey: implementation
    prompt: |
      This WinForms MainForm's labels and editors drift apart when the window is widened and
      overlap when display scaling changes. Replace the brittle positioning with
      a designer-serializable layout that keeps captions content-sized and lets
      editors consume the remaining width. Keep the controls and Save behavior,
      preserve Visual Studio designer support, and build the project.
    environment:
      files:
        - src: fixtures/layout-container
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario layout-container
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Replaces direct form positioning with the requested two-column TableLayoutPanel and moves every existing control into it
      - Uses AutoSize for captions and percentage sizing for the editor column so the fields respond to form resizing
      - Represents the container as a designer field and uses straightforward serialization-style setup in InitializeComponent
      - Preserves the existing event behavior and does not claim a Visual Studio Designer round trip on the non-Windows runner

  - name: Rename a designer control and its event handler
    tags:
      capability: designer-safe-rename
      risk: medium
      journey: refactor
    prompt: |
      The Commit button is still named `_saveButton`, and its handler is still
      `SaveButton_Click`. Rename them to `_commitButton` and
      `CommitButton_Click` everywhere without changing the displayed text or
      behavior. Make the rename safe for the WinForms designer and build the
      project.
    environment:
      files:
        - src: fixtures/rename-control
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario rename-control
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Propagates the control-field rename through construction, properties, Controls.Add, and code-behind references
      - Renames the handler and keeps a named method subscription rather than replacing it with inline logic
      - Removes all stale `_saveButton` and `SaveButton_Click` references while preserving the Commit text and behavior
      - Leaves a designer-loadable form that builds successfully

  - name: Add designer-compatible object binding
    tags:
      capability: data-binding
      risk: high
      journey: implementation
    prompt: |
      In this WinForms form, the customer name TextBox initially shows the model value, but typing does
      not update the existing CustomerViewModel as the text changes. Repair the
      form without replacing the view model or making the form unavailable in
      the Visual Studio Designer, then build WinFormsFixture.csproj.
    environment:
      files:
        - src: fixtures/data-binding
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario data-binding
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          stdout_matches: runtime-binding-ok
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Creates a BindingSource owned by the designer components container and types it to CustomerViewModel for design-time support
      - Binds the Text property to Name with formatting and source updates on property changes
      - Assigns the existing view-model instance in ordinary code after InitializeComponent rather than embedding runtime state in designer serialization
      - Preserves change notification and produces a successful build

  - name: Add safe serialization metadata to a custom control
    tags:
      capability: custom-control-serialization
      risk: high
      journey: implementation
    prompt: |
      StatusBadge needs a yellow HighlightColor, a RuntimeMessages list that is
      never persisted by the Designer, and an optional CustomFont. At present
      the control has no stable property-grid reset/default behavior and runtime
      state risks leaking into generated code. Implement the properties with
      coherent WinForms serialization behavior without putting that behavior in
      MainForm.Designer.cs, then build the project.
    environment:
      files:
        - src: fixtures/custom-control
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario custom-control
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Gives HighlightColor one stable yellow default that agrees with its DefaultValue metadata
      - Marks RuntimeMessages hidden from designer serialization while keeping it usable at runtime
      - Implements matching ShouldSerializeCustomFont and ResetCustomFont methods for the optional font
      - Keeps custom-control behavior and serialization rules in StatusBadge.cs, leaves the form designer declarative, and builds successfully

  - name: Localize form and button text through resources
    tags:
      capability: designer-localization
      risk: medium
      journey: implementation
    prompt: |
      Prepare MainForm for translated form titles and Save button captions
      without requiring per-culture edits to generated code. Use the normal
      WinForms Designer localization mechanism, preserve the click handler and
      designer usability, then build the project.
    environment:
      files:
        - src: fixtures/localization
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario localization
          expected_exit_code: 0
          timeout: 1m
      - type: file-exists
        config:
          path: MainForm.resx
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Creates valid WinForms resources for the form title and Save button caption using the expected component resource names
      - Replaces hard-coded UI strings with the designer-compatible ComponentResourceManager ApplyResources pattern
      - Preserves the named click-handler subscription and keeps non-serialization logic out of MainForm.Designer.cs
      - Produces a successful build with the embedded form resource

  - name: Leave an already designer-safe form unchanged
    tags:
      capability: designer-safety
      risk: low
      journey: review
    prompt: |
      Review this small WinForms project for constructs that would stop
      MainForm from opening in the Visual Studio designer. Fix source files only
      if such a problem actually exists, and verify the project builds.
    environment:
      files:
        - src: fixtures/no-op
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario no-op -PreservationManifestBase64 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Correctly recognizes that InitializeComponent already uses named fields, simple assignments, and a named event handler
      - Leaves the tracked project and source files byte-for-byte unchanged instead of performing an unnecessary designer rewrite
      - Still verifies the existing Windows-targeted project builds successfully

  - name: Repair clipping through nested layout containers
    tags:
      capability: dpi-layout
      risk: high
      journey: repair
    prompt: |
      The WinForms shipping-address fields are clipped when Windows display scaling is
      increased. A previous repair enabled AutoSize on the nested containers, but
      the clipping remains. Diagnose the complete designer-managed layout and fix
      the actual growth bottleneck; do not hide it by increasing fixed width/height
      constants or moving fields out of their existing groups. Preserve Save
      behavior and build the project.
    environment:
      files:
        - src: fixtures/nested-layout-clipping
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario nested-layout-clipping
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          stdout_matches: nested-save-layout-ok
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Finds and removes every fixed growth cap, including maximum-size constraints, so the form and each named container can derive size from content
      - Keeps all shipping-address controls inside the existing nested layout rather than bypassing a container or hiding the clipping with larger constants
      - Places the Save button in the growing outer layout or docks it outside the expanding content so address growth cannot overlap it
      - Keeps the layout declarations and control hierarchy in straightforward designer-generated form
      - Preserves the Save behavior and produces a successful build

  - name: Await background refresh and restore UI state
    tags:
      capability: async-ui
      risk: high
      journey: repair
    prompt: |
      Clicking Refresh in this WinForms form disables the button and starts an update, but callers
      cannot observe completion and the button can remain disabled. Repair the
      event path so the status update completes on the UI thread and control
      state is restored. Keep executable logic out of MainForm.Designer.cs and
      build the project.
    environment:
      files:
        - src: fixtures/async-ui-refresh
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario async-ui-refresh
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Awaits background completion and performs the status update on the WinForms UI context, either through the captured event-handler context or an awaited marshal
      - Restores the Refresh button state after the awaited work completes
      - Keeps event and UI-thread marshaling logic in code-behind and produces a successful build

  - name: Add VB application event handling without a new entry point
    tags:
      capability: vb-application-events
      risk: high
      journey: implementation
    prompt: |
      This Visual Basic WinForms app is already configured as single-instance,
      but a second launch does not restore its minimized MainForm. It also needs
      last-chance logging of otherwise-unhandled UI exceptions to
      `application-errors.log` before exit. Implement both through the existing
      startup model without changing generated startup code or adding another
      entry point, then build the project.
    environment:
      files:
        - src: fixtures/vb-application-events
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario vb-application-events -PreservationManifestBase64 
          expected_exit_code: 0
          timeout: 1m
      - type: file-exists
        config:
          path: My Project/ApplicationEvents.vb
      - type: file-not-exists
        config:
          path: Program.vb
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.vbproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Uses the existing application lifecycle hooks to restore and activate the main window on a repeated launch
      - Records otherwise-unhandled UI exceptions in the requested file, disambiguates Application Framework event types when necessary, and explicitly chooses and reports the post-error exit behavior
      - Preserves the configured Application Framework startup path and does not introduce Program.vb or another entry point
      - Introduces no unrelated startup files and leaves generated startup and designer files unchanged

  - name: Restore designer ownership of a form timer
    tags:
      capability: component-lifetime
      risk: high
      journey: repair
    prompt: |
      Closing and reopening this WinForms MainForm repeatedly leaves timer callbacks alive, and
      the timer does not appear in the Designer component tray. Repair the
      lifetime problem while preserving the existing Tick behavior and keeping
      the form editable in the Designer. Build the project.
    environment:
      files:
        - src: fixtures/component-ownership
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario component-ownership
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Restores designer component-container ownership so closing the form disposes the Timer with the form
      - Preserves the named Tick handler and keeps component construction and wiring designer-serializable
      - Avoids an ad hoc runtime disposal workaround or an unowned Timer
      - Produces a successful build

  - name: Make bound list additions visible immediately
    tags:
      capability: list-binding
      risk: medium
      journey: repair
    prompt: |
      In this WinForms form, the Add button appends a Customer to `_customers`, but the bound ListBox
      does not show the new item until the form is reopened. Fix the cause
      without manually refreshing or rebinding the ListBox. Keep the existing
      Customer type and button behavior, then build the project.
    environment:
      files:
        - src: fixtures/live-list-binding
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario live-list-binding
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Uses a list source that raises the notifications WinForms data binding consumes when items are added
      - Keeps the existing DataSource and Add-button flow rather than manually refreshing or rebinding the control
      - Does not treat ObservableCollection as a drop-in WinForms list source
      - Produces a successful build

  - name: Preserve runtime injection while restoring designer construction
    tags:
      capability: designer-construction
      risk: high
      journey: repair
    prompt: |
      This WinForms MainForm runs correctly because Program supplies ICustomerService, but the
      Visual Studio Designer reports that it cannot create the form. Repair the
      design-time failure without moving service creation into MainForm,
      changing Program's runtime composition, or allowing the Designer to call
      the production service. Build the project.
    environment:
      files:
        - src: fixtures/designer-constructor
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario designer-constructor
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Adds a designer-usable parameterless construction path that reaches InitializeComponent without resolving production services
      - Preserves the service-accepting runtime constructor and Program's composition-root behavior
      - Defers or guards service-dependent work so the Designer path cannot dereference an unavailable dependency
      - Produces a successful build without null-forgiving suppression

  - name: Balance designer initialization for a grid
    tags:
      capability: designer-initialization
      risk: high
      journey: repair
    prompt: |
      The WinForms orders DataGridView works when the application runs, but after a
      Designer save/reopen its serialized state is unreliable. A previous manual
      edit changed MainForm.Designer.cs. Repair the smallest defect in the
      generated setup without moving initialization into MainForm.cs or
      rebuilding the grid at runtime. Build the project.
    environment:
      files:
        - src: fixtures/initialization-balance
          dest: .
        - src: validate-winforms.ps1
          dest: validate-winforms.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-winforms.ps1 -Scenario initialization-balance
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build WinFormsFixture.csproj --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Restores the matching EndInit call for the DataGridView in the generated initialization sequence
      - Keeps BeginInit/EndInit and SuspendLayout/ResumeLayout balanced in designer code
      - Does not hide the serialization defect with runtime reconstruction or code-behind initialization
      - Produces a successful build

  - name: Audit and repair SQL injection risks across a WinForms solution
    tags:
      capability: sql-injection-repair
      risk: high
      journey: repair
    prompt: |
      # Prompt: SQL Injection Vulnerability Audit and Patch

      This is a WinForms solution.

      ## Task

      Perform a **full SQL injection vulnerability audit** across the entire solution and patch-up, where necessary.

      1. **Scan all source files in all projects** (both C# `.cs` and VB.NET `.vb`) for SQL built from non-literal values via concatenation/interpolation/`String.Format`.
      2. For each finding, report:
         - **File path and line number**
         - The **vulnerable code snippet**
         - The **injection vector** (which variable or input is untrusted)
      3. Prioritize findings by **risk level**: direct user input is highest risk; internal runtime values (e.g., employee IDs passed between forms) are medium risk
      4. Choose the best practize you see fit, to patch all the vulnerabilities.

      ## Expected Output

      A structured report, grouped by file, with findings and recommended fixes.
      All the project-vulnerabilities patched up - best practices for approach and result as you see fit.
    environment:
      files:
        - src: fixtures/TimeTracking
          dest: .
        - src: validate-sql-injection.ps1
          dest: validate-sql-injection.ps1
    graders:
      - type: run-command
        config:
          command: pwsh -NoProfile -EncodedCommand 
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: pwsh -NoProfile -ExecutionPolicy Bypass -File validate-sql-injection.ps1
          expected_exit_code: 0
          timeout: 1m
      - type: run-command
        config:
          command: dotnet build TimeTracking.slnx --nologo
          expected_exit_code: 0
          timeout: 5m
      - type: exit-success
      - type: prompt
    rubric:
      - Audits both projects and identifies the direct search-text injection as higher risk than the employee-ID injection
      - Reports each vulnerable file and location, shows the unsafe SQL construction, and names the untrusted value entering the query
      - Replaces every dynamic SQL value with command parameters while preserving both query paths and their intended filtering behavior
      - Keeps runtime logic out of designer-generated files and produces a successful full-solution build

  - name: Stay dormant for a WPF command binding request
    tags:
      capability: routing-boundary
      risk: low
      journey: dormancy
    prompt: |
      In my WPF MainWindow.xaml, bind Ctrl+S to the existing SaveCommand through
      the window's input bindings. Keep the current DataContext and button command,
      and show the updated XAML.
    expect_activation: false
    graders:
      - type: output-matches
        config:
          pattern: (?is)<Window\.InputBindings>.*<KeyBinding\b
      - type: output-matches
        config:
          pattern: (?i)(Gesture\s*=\s*["']Ctrl\+S["']|Key\s*=\s*["']S["'])
      - type: output-not-matches
        config:
          pattern: (?i)(TableLayoutPanel|System\.Windows\.Forms|Keys\.Control|ProcessCmdKey)
      - type: exit-success
      - type: prompt
    rubric:
      - Adds a WPF KeyBinding under Window.InputBindings for the existing SaveCommand
      - Preserves the existing DataContext and button command
      - Uses WPF XAML input-binding syntax rather than Windows Forms keyboard handling
      - Did not apply the WinForms-specific skill to the neighboring WPF framework request
