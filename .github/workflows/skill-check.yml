name: skill-check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history so eval-review can diff against the PR base ref.
          fetch-depth: 0
          persist-credentials: false

      - name: Cache validator archive
        id: cache-validator
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: skill-validator-dist.tar.gz
          key: skill-validator-${{ runner.os }}-${{ hashFiles('eng/skill-validator/src/**', 'eng/skill-validator/Directory.Build.props', 'global.json') }}

      - name: Setup .NET SDK
        if: steps.cache-validator.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Build skill-validator
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: dotnet publish eng/skill-validator/src/SkillValidator.csproj

      - name: Create validator archive
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: tar -czf skill-validator-dist.tar.gz -C artifacts/publish/SkillValidator/release .

      - name: Extract validator
        if: steps.cache-validator.outputs.cache-hit == 'true'
        run: |
          mkdir -p artifacts/publish/SkillValidator/release
          tar -xzf skill-validator-dist.tar.gz -C artifacts/publish/SkillValidator/release

      - name: Run skill-validator check
        run: |
          plugin_args=$(for d in plugins/*/; do echo "--plugin $d"; done)
          artifacts/publish/SkillValidator/release/skill-validator check \
            $plugin_args \
            --allowed-external-deps eng/allowed-external-deps.txt \
            --known-domains eng/known-domains.txt

      # -----------------------------------------------------------------------
      # eval-review: free, no-model quality gate for skill+eval units, run as
      # steps in this same job (no separate workflow).
      #
      # Enforcement runs via the standalone runner (eng/vally-graders/review.mjs),
      # NOT via Vally: `vally lint --grader-plugin` does not execute custom static
      # graders against skills, and `vally experiment run` (this repo's eval path)
      # can't load grader plugins. See eng/vally-graders/README.md.
      #
      # Static-only and free: the paid, opt-in LLM grader (review.mjs --llm) is
      # deliberately NOT run here. assertion-hardening and meta-commentary block;
      # the noisier eval-deleading / negative-scenario dimensions are report-only
      # (dimension ratchet — tighten by dropping --report-only as the backlog is
      # burned down). Only PR-touched units are evaluated (changed-files default);
      # set EVAL_REVIEW_ALL=1 to scan every unit (manual/nightly run-all path).
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install eval-review dependencies
        working-directory: eng/vally-graders
        run: npm ci --omit=optional

      - name: Unit-test the graders
        working-directory: eng/vally-graders
        run: npm test

      - name: Run eval-review gate
        run: |
          if [ "${EVAL_REVIEW_ALL:-}" = "1" ]; then
            scope="--all"
          else
            scope="--base origin/${{ github.base_ref }}"
          fi
          node eng/vally-graders/review.mjs \
            $scope \
            --report-only eval-deleading \
            --report-only negative-scenario

