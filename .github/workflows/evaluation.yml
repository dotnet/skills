# Unified evaluation workflow for same-repository PRs and scheduled runs.
# Fork PRs receive secretless status/discovery only; PAT-backed evaluation is
# disabled until a maintainer promotes the change to a trusted repository branch.
#
# IMPORTANT: The /evaluate command runs the workflow YAML from the default
# branch (main), NOT from the PR branch, for every trigger below (issue_comment,
# pull_request_review, pull_request_target, workflow_dispatch). Changes to this
# file in a PR will not take effect until merged. The Vally harness runs the
# skills content checked out from the gate-bound commit, so skill/test/eval.yaml
# changes are evaluated before merge.
#
# For same-repository PRs:
#   - On PR open/sync, the `pr-status` job posts an initial commit status:
#     - "success" if no skills changed (required check passes immediately)
#     - "pending" if skills changed (maintainer must trigger /evaluate)
#   - A maintainer triggers evaluation one of two ways; both bind the run to a
#     SPECIFIC reviewed commit:
#     1. Recommended: submit a PR review ("Files changed" -> "Review changes")
#        whose body contains /evaluate. The run is bound to review.commit_id --
#        the exact commit reviewed -- with no SHA to copy.
#     2. Comment "/evaluate <sha>" in the PR conversation. The conversation
#        comment payload carries no commit id, so an explicit SHA is REQUIRED;
#        a bare /evaluate only posts guidance. The SHA must belong to the PR.
#   - The `gate` job validates permissions AND resolves/validates the bound
#     commit; no downstream job re-reads the live branch head.
#
# For scheduled runs:
#   - Runs daily, evaluates all plugins with skills and tests.
#
# Model for fork PRs:
#   - Workflow YAML: always from the default branch (enforced by the
#     issue_comment / pull_request_review / pull_request_target triggers)
#   - Skill/test content: inspected only by secretless status/discovery jobs
#   - PAT-backed evaluation is skipped because eval setup commands and agent
#     tools are controlled by the PR content
#   - A maintainer must review and promote the change to a trusted repository
#     branch before running the full evaluation
name: evaluation

# For a triage/manual single-PR dispatch, surface the PR + head in the run name.
# This run name also doubles as the idempotency key the PR-triage worker matches
# on (eval_run_exists_for_head in pr-triage-act.sh): a workflow_dispatch run's
# head_sha is the default branch — not the PR head — so the run name is how the
# worker recognises that an evaluation has already been dispatched for this head.
# For all other events the expression yields '' and GitHub uses the default name.
run-name: "${{ inputs.pr_number != '' && format('Evaluate PR #{0} @ {1}', inputs.pr_number, inputs.head_sha) || '' }}"

on:
  # Manual trigger for one-off deploys (e.g., AGENTVIZ SPA update) and
  # targeted re-runs of a single plugin without committing to main.
  # The pr_number/head_sha inputs are also the PR-triage worker's entry point:
  # the worker dispatches this workflow directly (workflow_dispatch is exempt
  # from GitHub's GITHUB_TOKEN recursion guard) instead of relying on the
  # `evaluate-now` label, which never fires when applied by the bot.
  workflow_dispatch:
    inputs:
      plugin:
        description: "Specific plugin to evaluate (leave blank for all)"
        type: string
        required: false
      pr_number:
        description: "PR number to evaluate. Routes the dispatch through the gate/PR pipeline instead of a full/plugin run."
        type: string
        required: false
      head_sha:
        description: "Short head SHA of the PR (used for the run name and triage idempotency). The gate resolves this exact commit -- it does NOT re-read the live branch head."
        type: string
        required: false

  # Same-repo PRs: post initial status
  pull_request:

  # Fork PRs: post initial status (runs from base branch for security).
  # Also receives `labeled` events: a human applying the `evaluate-now` label
  # is one entry point into this pipeline (alongside `/evaluate`). The triage
  # worker runs as github-actions[bot] and cannot use the label (label events
  # emitted by GITHUB_TOKEN do not start workflows), so it uses the
  # workflow_dispatch pr_number input above instead.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

  # /evaluate command trigger (PR conversation comment). This payload carries
  # NO commit id, so the gate REQUIRES an explicit `/evaluate <sha>` here and
  # binds the run to that exact commit (never the live branch head).
  issue_comment:
    types: [created]

  # /evaluate submitted inside a PR review ("Files changed" -> "Review changes"
  # -> Submit review). Unlike issue_comment, this payload carries
  # review.commit_id -- the exact commit the review was submitted against -- so
  # the gate binds evaluation to that SHA atomically, with no live re-resolution.
  # This is the recommended human entry point: the SHA is filled in for the
  # reviewer automatically. Runs from the default branch with secrets, like
  # issue_comment/pull_request_target (only the `pull_request` event is
  # secret-restricted on forks).
  pull_request_review:
    types: [submitted]

  # Daily scheduled evaluation
  schedule:
    - cron: '0 0 * * *'  # Once daily at midnight UTC

concurrency:
  # Every /evaluate entry point (comment, review, the `evaluate-now` label, and
  # the triage worker's workflow_dispatch) gets a UNIQUE group -- keyed by
  # github.run_id -- so its `gate` job always starts immediately and can
  # acknowledge the request and post feedback. Duplicate evaluations for the
  # same PR are then reduced by a best-effort single-flight step in the gate
  # (it defers to an in-flight run on the same commit and supersedes an older
  # run on a stale commit); the concurrency primitive cannot express this
  # because it can't compare the bound commit across runs. A separate job-level
  # concurrency on the gate caps cheap gate fan-out per PR. Only the lightweight
  # status-posting runs stay grouped per-PR so a new push cancels a stale run.
  group: ${{ github.workflow }}-${{ (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/evaluate')) && format('eval-{0}-{1}', github.event.issue.number, github.run_id) || (github.event_name == 'pull_request_review' && startsWith(github.event.review.body, '/evaluate')) && format('eval-{0}-{1}', github.event.pull_request.number, github.run_id) || (github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'evaluate-now') && format('eval-{0}-{1}', github.event.pull_request.number, github.run_id) || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '') && format('eval-{0}-{1}', inputs.pr_number, github.run_id) || (github.event_name == 'issue_comment' && format('eval-noop-{0}-{1}', github.event.issue.number, github.event.comment.id)) || (github.event_name == 'pull_request_review' && format('eval-noop-review-{0}-{1}', github.event.pull_request.number, github.event.review.id)) || (github.event_name == 'pull_request' && format('eval-status-{0}', github.event.pull_request.number)) || (github.event_name == 'pull_request_target' && format('eval-fork-status-{0}', github.event.pull_request.number)) || github.run_id }}
  # /evaluate runs use a unique group (above), so this never interrupts an
  # evaluation; it only lets a new push cancel a stale per-PR status run.
  cancel-in-progress: true

env:
  DASHBOARD_RETENTION_DAYS: 14
  MODEL: claude-opus-4.6
  JUDGE_MODEL: claude-opus-4.6

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # ==========================================================================
  # PR STATUS JOBS
  # Post initial commit status so the required check is never stuck as "Expected".
  # Posts success (no skills) or pending (needs /evaluate).
  # ==========================================================================

  # Same-repo PRs: use pull_request trigger (has direct access to PR content)
  pr-status:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover changes requiring evaluation
        id: discover
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $head = "${{ github.event.pull_request.head.sha }}"
          $mergeBase = git merge-base $base $head
          $changedFiles = git diff --name-only --diff-filter=ACMR $mergeBase $head

          $hasSkillChanges = $changedFiles |
            Where-Object { $_ -match '^(plugins/[^/]+/skills|tests/[^/]+)/[^/]+/' } |
            Select-Object -First 1

          # Evaluation pipeline changes need a re-eval. The linter (skill-validator)
          # is a separate workflow, so eng/skill-validator/ changes are NOT infra
          # changes here. Documentation files don't affect evaluation.
          $hasInfraChanges = $changedFiles |
            Where-Object {
              ($_ -match '^eng/vally-adapter/') -or
              ($_ -match '^dotnet-skills\.experiment\.yaml$') -or
              $_ -match '^\.github/workflows/(evaluation|evaluation-run)\.yml$'
            } |
            Select-Object -First 1

          if ($hasSkillChanges -or $hasInfraChanges) {
            echo "needs_eval=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "needs_eval=false" >> $env:GITHUB_OUTPUT
          }

      - name: Post evaluation commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.discover.outputs.needs_eval }}" == "true" ]]; then
            STATE="pending"
            DESC="Submit a review with /evaluate, or comment /evaluate ${{ github.event.pull_request.head.sha }}"
          else
            STATE="success"
            DESC="No skills to evaluate"
          fi

          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$STATE" \
            -f context="evaluation-status" \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Fork PRs: use pull_request_target (runs from base branch, fetches PR metadata safely)
  fork-pr-status:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head for diff
        run: git fetch origin +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Discover changes requiring evaluation
        id: discover
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $head = "FETCH_HEAD"
          $mergeBase = git merge-base $base $head
          $changedFiles = git diff --name-only --diff-filter=ACMR $mergeBase $head

          $hasSkillChanges = $changedFiles |
            Where-Object { $_ -match '^(plugins/[^/]+/skills|tests/[^/]+)/[^/]+/' } |
            Select-Object -First 1

          $hasInfraChanges = $changedFiles |
            Where-Object {
              ($_ -match '^eng/vally-adapter/') -or
              ($_ -match '^dotnet-skills\.experiment\.yaml$') -or
              $_ -match '^\.github/workflows/(evaluation|evaluation-run)\.yml$'
            } |
            Select-Object -First 1

          if ($hasSkillChanges -or $hasInfraChanges) {
            echo "needs_eval=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "needs_eval=false" >> $env:GITHUB_OUTPUT
          }

      - name: Post evaluation commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.discover.outputs.needs_eval }}" == "true" ]]; then
            STATE="failure"
            DESC="Fork PR evaluation requires a trusted branch"
          else
            STATE="success"
            DESC="No skills to evaluate"
          fi

          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$STATE" \
            -f context="evaluation-status" \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ==========================================================================
  # GATE JOB
  # Validate the evaluation trigger AND bind the run to one specific commit
  # (never the live branch head). Four entry points:
  #   1. /evaluate comment (issue_comment) -- original human path. Carries NO
  #      commit id, so it REQUIRES an explicit "/evaluate <sha>" that belongs to
  #      the PR; a bare /evaluate only posts guidance.
  #   2. /evaluate review (pull_request_review submitted) -- recommended human
  #      path. Bound to review.commit_id, the exact commit reviewed.
  #   3. evaluate-now label (pull_request_target labeled) -- a human applying
  #      the label (the bot cannot: GITHUB_TOKEN label events don't start runs).
  #      Bound to the head SHA in the label event payload.
  #   4. workflow_dispatch with pr_number -- the pr-triage worker's path. It runs
  #      as github-actions[bot] and dispatches this workflow directly, since
  #      workflow_dispatch is exempt from the GITHUB_TOKEN recursion guard. Bound
  #      to the worker's observed head SHA (resolved from short to full).
  # All must come from a trusted actor (write+ on the repo, or the workflow's
  # own github-actions[bot] identity for paths 3 and 4).
  # ==========================================================================
  gate:
    if: >-
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/evaluate'))
      ||
      (github.event_name == 'pull_request_review' &&
       github.event.action == 'submitted' &&
       startsWith(github.event.review.body, '/evaluate'))
      ||
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'evaluate-now')
      ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.pr_number != '')
    runs-on: ubuntu-latest
    # Cap concurrent gate jobs per PR: a burst of /evaluate comments cannot fan
    # out into unbounded runners. The gate is cheap (permission check + bind);
    # the expensive discover/evaluate jobs are NOT in this group and are
    # single-flighted separately, so this never interrupts a running evaluation
    # -- it only coalesces a flood of cheap gate jobs down to one per PR.
    # Trade-off: GitHub keeps a single pending job per group, so a third
    # /evaluate arriving while one gate runs and one is pending cancels the
    # pending one. The queue only ever holds cheap gates (seconds), never a
    # running evaluation, so the window is small; and the surviving gate still
    # evaluates the newest commit, so no request is lost -- only the middle
    # request of a same-PR burst misses its own acknowledgement.
    concurrency:
      group: "${{ github.workflow }}-gate-${{ (github.event_name == 'issue_comment') && github.event.issue.number || (github.event_name == 'pull_request_review' || github.event_name == 'pull_request_target') && github.event.pull_request.number || (github.event_name == 'workflow_dispatch') && inputs.pr_number || github.run_id }}"
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      issues: write
      # gh run cancel (single-flight: supersede a stale in-flight run)
      actions: write
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      is_fork: ${{ steps.pr.outputs.is_fork }}
      # 'true' only when a specific commit was bound and validated. A bare
      # /evaluate (comment path, no SHA) sets this 'false' so downstream jobs
      # skip and the gate only posts guidance.
      should_eval: ${{ steps.pr.outputs.should_eval }}
    steps:
      - name: Check actor permissions
        id: perms
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          REVIEW_ACTOR: ${{ github.event.review.user.login }}
          SENDER_ACTOR: ${{ github.event.sender.login }}
        run: |
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            ACTOR="$COMMENT_ACTOR"
          elif [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            ACTOR="$REVIEW_ACTOR"
          else
            ACTOR="$SENDER_ACTOR"
          fi
          # The triage worker dispatches this workflow as github-actions[bot]
          # (workflow_dispatch). A human may instead apply the evaluate-now label,
          # which arrives under that human's identity. The bot identity has no
          # entry in /collaborators/* but is implicitly trusted because only this
          # repository's own GITHUB_TOKEN can act under it.
          if [[ "$ACTOR" == "github-actions[bot]" ]]; then
            echo "Actor is github-actions[bot] — trusted by construction"
            exit 0
          fi
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" --jq '.permission')
          echo "Actor ${ACTOR} has permission: $PERMISSION"
          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "write" && "$PERMISSION" != "maintain" ]]; then
            echo "::error::Actor does not have write access"
            exit 1
          fi

      - name: Acknowledge the request
        # Fires immediately after the permission check passes, so an authorized
        # /evaluate always gets visible feedback (👀) up front -- before the
        # longer resolve/bind work -- regardless of whether it ends up running,
        # posting guidance, or deferring to an in-flight run. Only the comment
        # path has a comment to react to. Paired with the cleanup step below:
        # any path that stops inside the gate clears the reaction again, since
        # only a real evaluation reaches `report-status`, which normally does.
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -X POST -f content='eyes' || true

      - name: Resolve and bind the evaluated commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # Every trigger-supplied value is read via env (never interpolated into
          # the script body) so validation runs before the value reaches any gh
          # api call -- a crafted comment/input cannot inject shell or traversal.
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          DISPATCH_SHA_INPUT: ${{ inputs.head_sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
          LABEL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ISSUE_PR_NUMBER: ${{ github.event.issue.number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'

          # ----- 1) Resolve the PR number -------------------------------------
          case "$EVENT_NAME" in
            issue_comment)       PR_NUMBER="$ISSUE_PR_NUMBER" ;;
            pull_request_review) PR_NUMBER="$EVENT_PR_NUMBER" ;;
            workflow_dispatch)
              PR_NUMBER="$PR_NUMBER_INPUT"
              if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
                echo "::error::workflow_dispatch input pr_number='$PR_NUMBER' must be a positive integer"
                exit 1
              fi ;;
            *)                   PR_NUMBER="$EVENT_PR_NUMBER" ;;
          esac
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          # ----- 2) Determine the commit this trigger BINDS to ----------------
          # Each trigger names one specific commit at the moment it fired.
          # Downstream jobs use that commit and never re-read the live branch
          # head, so evaluation always runs the reviewed commit.
          REQUESTED=""
          case "$EVENT_NAME" in
            pull_request_review) REQUESTED="$REVIEW_SHA" ;;         # commit the review was submitted against
            pull_request_target) REQUESTED="$LABEL_HEAD_SHA" ;;     # head at label time (from the event payload)
            workflow_dispatch)   REQUESTED="$DISPATCH_SHA_INPUT" ;; # triage worker's observed head (short ok)
            issue_comment)
              # Require an explicit SHA: "/evaluate <7-40 hex>". The issue_comment
              # payload carries no commit id, so a bare /evaluate cannot be bound.
              # Parse with a bash regex (portable; avoids sed word-boundary quirks).
              FIRST_LINE="${COMMENT_BODY%%$'\n'*}"      # first line only
              FIRST_LINE="${FIRST_LINE//$'\r'/}"        # strip trailing CR
              if [[ "$FIRST_LINE" =~ ^[[:space:]]*/evaluate[[:space:]]+([0-9a-fA-F]{7,40})([^0-9a-fA-F]|$) ]]; then
                REQUESTED="${BASH_REMATCH[1]}"
              fi
              ;;
          esac

          # ----- 3) Bare /evaluate (comment path, no SHA): guide, do not run --
          if [[ -z "$REQUESTED" && "$EVENT_NAME" == "issue_comment" ]]; then
            echo "should_eval=false" >> "$GITHUB_OUTPUT"
            # Look up the current head so we can hand back a copy-paste-ready
            # command instead of a placeholder. This is only a *suggestion*: when
            # the user posts it, the gate re-reads and validates whatever SHA they
            # typed, so surfacing the live head here introduces no trust gap.
            HEAD_NOW="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null || true)"
            if [[ -n "$HEAD_NOW" ]]; then
              READY="/evaluate ${HEAD_NOW}"
            else
              READY="/evaluate <full-head-sha>"
            fi
            # $'...' is ANSI-C quoting (real newlines, literal backticks) but does
            # NOT expand variables, so splice $READY in via string concatenation.
            BODY=$'👋 `/evaluate` needs the **exact commit** to evaluate.\n\n**Two ways to run it:**\n\n1. **Review flow (recommended — no SHA to copy):** open **Files changed → Review changes**, type `/evaluate` in the review box, and **Submit review**. GitHub binds the run to the exact commit you reviewed.\n2. **Comment flow:** copy-paste this command for the current head:\n\n```\n'"$READY"$'\n```'
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY" || true
            echo "Bare /evaluate with no SHA — posted guidance (head=${HEAD_NOW:-unknown}), not evaluating."
            exit 0
          fi

          # ----- 4) Validate shape --------------------------------------------
          if [[ -z "$REQUESTED" ]]; then
            echo "::error::No commit SHA is bound to this ${EVENT_NAME} trigger; refusing to evaluate the live branch head."
            exit 1
          fi
          if [[ ! "$REQUESTED" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::Requested commit '$REQUESTED' is not a valid 7-40 char hex SHA."
            exit 1
          fi

          # ----- 5) Resolve to the FULL 40-char SHA of THAT SPECIFIC commit ---
          # `commits/<sha>` resolves the named object; it does NOT follow the
          # branch, so a short SHA maps to exactly the commit the trigger meant.
          FULL_SHA="$(gh api "repos/${REPO}/commits/${REQUESTED}" --jq '.sha' 2>/dev/null || true)"
          # A missing commit makes `gh api` emit an error body that can land on
          # stdout, so only accept a real 40-char hex object id; anything else
          # (empty or an error payload) counts as "not found".
          if [[ ! "$FULL_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Commit ${REQUESTED} was not found in ${REPO}."
            if [[ "$EVENT_NAME" == "issue_comment" ]]; then
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "❌ \`/evaluate ${REQUESTED}\` — I could not find that commit in this repository. **Preferred:** open **Files changed → Review changes**, type \`/evaluate\`, and **Submit review** — GitHub binds the exact commit automatically, no SHA to copy. Or comment \`/evaluate <full-head-sha>\` using this PR's current head." || true
            fi
            exit 1
          fi

          # ----- 6) PR metadata + fork detection (NOT used as the eval target) -
          PR_DATA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          PR_HEAD="$(echo "$PR_DATA" | jq -r '.head.sha')"
          BASE_SHA="$(echo "$PR_DATA" | jq -r '.base.sha')"
          HEAD_REPO="$(echo "$PR_DATA" | jq -r '.head.repo.full_name')"
          BASE_REPO="$(echo "$PR_DATA" | jq -r '.base.repo.full_name')"
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then IS_FORK=true; else IS_FORK=false; fi

          # ----- 7) Reachability for the user-typed comment path --------------
          # A maintainer typing "/evaluate <sha>" names the commit by hand, so
          # confirm it belongs to this PR (its head or one of its own commits)
          # before evaluating. Uses the fork-aware pulls/N/commits list (its
          # commits live in the base repo via refs/pull/N/*). The review/label/
          # dispatch paths name a PR-bound commit by construction and skip this
          # check; if that commit is no longer present, discover fails closed.
          if [[ "$EVENT_NAME" == "issue_comment" && "$FULL_SHA" != "$PR_HEAD" ]]; then
            REACHABLE=false
            # Primary check: membership in the PR's own commits. Fork-aware
            # (their commits live in the base repo via refs/pull/N/*) and
            # restricts to commits actually introduced by the PR. Capture the
            # list first, then match via a here-string: piping gh into `grep -q`
            # would let grep close the pipe on first match and, under
            # `set -o pipefail`, surface gh's SIGPIPE as the pipeline status --
            # falsely rejecting a valid commit.
            PR_COMMITS="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" --jq '.[].sha' 2>/dev/null || true)"
            if grep -qxF "$FULL_SHA" <<< "$PR_COMMITS"; then
              REACHABLE=true
            else
              # Fallback for PRs with >250 commits: the pulls/N/commits API is
              # hard-capped at 250 regardless of pagination, so a valid older
              # commit can be missing from the list. Confirm ancestry instead --
              # the bound commit must be an ancestor of (or equal to) the current
              # PR head. The compare API is not subject to the 250 cap. "ahead"
              # means PR_HEAD is ahead of FULL_SHA (i.e. FULL_SHA is an ancestor);
              # "identical" means they are the same commit. Any other status, or
              # any error, leaves REACHABLE=false (fail closed).
              CMP_STATUS="$(gh api "repos/${REPO}/compare/${FULL_SHA}...${PR_HEAD}" --jq '.status' 2>/dev/null || true)"
              if [[ "$CMP_STATUS" == "ahead" || "$CMP_STATUS" == "identical" ]]; then
                REACHABLE=true
              fi
            fi
            if [[ "$REACHABLE" != "true" ]]; then
              echo "::error::Commit ${FULL_SHA} is not part of PR #${PR_NUMBER}."
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "❌ Commit \`${FULL_SHA}\` is not part of this PR. **Preferred:** submit a review with \`/evaluate\` (**Files changed → Review changes → Submit review**) — GitHub binds the current head automatically. Or comment \`/evaluate <current-head-sha>\` using this PR's current head." || true
              exit 1
            fi
          fi

          # ----- 7b) Warn (log + PR comment) when NOT evaluating the current tip
          # Any trigger can bind a non-head commit: a comment naming an earlier
          # SHA, or a push that landed after the review/label/dispatch was bound.
          # Surface it visibly so a reviewer notices the evaluated code is not the
          # current head -- without blocking, since binding to that commit is the
          # whole point.
          if [[ "$FULL_SHA" != "$PR_HEAD" ]]; then
            echo "::warning::Evaluating ${FULL_SHA}, which is NOT the current head of PR #${PR_NUMBER} (${PR_HEAD}); bound via ${EVENT_NAME}."
            SHORT_EVAL="${FULL_SHA:0:7}"
            SHORT_HEAD="${PR_HEAD:0:7}"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "⚠️ Evaluating commit \`${SHORT_EVAL}\`, which is **not** the current head of this PR (\`${SHORT_HEAD}\`). This run is bound to \`${SHORT_EVAL}\` (via ${EVENT_NAME}); any newer commits are **not** included. To evaluate the latest, **preferred:** submit a review with \`/evaluate\` (**Files changed → Review changes → Submit review**), or comment \`/evaluate ${PR_HEAD}\`." || true
          fi

          # ----- 7c) Single-flight: reduce duplicate evaluations (best-effort) -
          # The workflow concurrency group is unique per run, so every gate
          # starts and can post feedback. This step then reduces duplicate
          # evaluations for the same PR. It is best-effort by design and never a
          # security control: each run is independently bound to its own
          # validated commit, and the expensive discover/evaluate jobs are only
          # ever reached AFTER the write-access check above -- so a missed match
          # can only cost a duplicate run, never run a wrong commit or let an
          # unauthorized actor evaluate anything.
          # We list other in-flight/queued evaluation runs and key sibling
          # identity on (head repository, head branch) taken from PR_DATA (the
          # real PR): that pair uniquely identifies a PR's source -- including
          # forks, where two forks that share a branch name (e.g. `main`) still
          # differ by repository, so we can never cancel or defer to a run from
          # an unrelated repository. Because the key comes from PR_DATA, a run of
          # ANY trigger type can discover the review/label sibling runs (those
          # report the PR head repo/branch); comment/dispatch runs report the
          # default branch, so two of those on the same commit may not see each
          # other -- an authorized-only, cost-only gap.
          # (head repo, head branch) alone is not a PR identity, so two further
          # filters narrow the candidates before anything is cancelled:
          #   * `event` must be one of this workflow's evaluation entry points.
          #     That drops `schedule`/`push` runs (which report the default
          #     branch, and would collide with a PR whose head branch is also the
          #     default branch) and the `pull_request` status-only runs, whose
          #     jobs are still undecided in the first moments of a run and would
          #     otherwise look like a real evaluation.
          #   * when the run payload lists associated pull requests, this PR's
          #     number must be among them -- so the same head branch feeding two
          #     PRs with different bases can never cross-cancel. The list is
          #     empty for fork runs, which fall back to the repo/branch key.
          # Then:
          #   * a run already evaluating the SAME commit -> defer (link, no dup);
          #   * an OLDER run for this PR on a DIFFERENT commit -> supersede.
          # Numeric run-id ordering breaks the symmetric race: of two runs that
          # see each other, only the newer cancels, so exactly one wins. That
          # ordering is overridden in exactly one direction: a run deliberately
          # bound to an OLDER commit (`/evaluate <old-sha>`) never cancels, and
          # is never cancelled by, a run covering the PR's current head --
          # otherwise an archaeological re-run would kill head coverage and leave
          # the head's required check pending with nothing left to resolve it.
          SELF_ID="${GITHUB_RUN_ID}"
          PR_BRANCH="$(echo "$PR_DATA" | jq -r '.head.ref')"
          ACTIVE="$(
            { gh api --paginate "repos/${REPO}/actions/workflows/evaluation.yml/runs?status=in_progress&per_page=100" --jq '.workflow_runs[]' 2>/dev/null || true
              gh api --paginate "repos/${REPO}/actions/workflows/evaluation.yml/runs?status=queued&per_page=100"      --jq '.workflow_runs[]' 2>/dev/null || true
            } | jq -c --arg repo "$HEAD_REPO" --arg br "$PR_BRANCH" --argjson self "$SELF_ID" --argjson pr "$PR_NUMBER" \
                'select(
                   (.event == "issue_comment" or .event == "pull_request_review"
                    or .event == "pull_request_target" or .event == "workflow_dispatch")
                   and (.head_repository.full_name // "") == $repo
                   and .head_branch == $br
                   and .id != $self
                   and (((.pull_requests // []) | length) == 0
                        or (((.pull_requests // []) | map(.number)) | index($pr)) != null)
                 )' || true
          )"
          while IFS= read -r RUN; do
            [[ -z "$RUN" ]] && continue
            RID="$(jq -r '.id' <<< "$RUN")"
            RSHA="$(jq -r '.head_sha' <<< "$RUN")"
            RURL="$(jq -r '.html_url' <<< "$RUN")"
            [[ "$RID" =~ ^[0-9]+$ ]] || continue
            # Ignore placeholder status-only runs (fork-pr-status): a real
            # evaluation has a non-skipped gate or discover job. A transient
            # jobs-API error must never abort the gate, so fail open (|| true)
            # and treat an unreadable run as "not a real eval".
            REAL="$( { gh api --paginate "repos/${REPO}/actions/runs/${RID}/jobs" --jq '[.jobs[] | select((.name == "gate" or .name == "discover") and .conclusion != "skipped")] | length' 2>/dev/null || true; } | awk '{s+=$1} END{print s+0}')"
            [[ "${REAL:-0}" -gt 0 ]] || continue
            if [[ "$RSHA" == "$FULL_SHA" ]]; then
              # Same commit already under evaluation for this PR source.
              if [[ "$RID" -lt "$SELF_ID" ]]; then
                echo "should_eval=false" >> "$GITHUB_OUTPUT"
                echo "Deferring to in-flight run ${RID} for ${FULL_SHA}."
                gh pr comment "$PR_NUMBER" --repo "$REPO" --body "⏳ Commit \`${FULL_SHA:0:7}\` is already being evaluated — follow it here: ${RURL}. Not starting a duplicate run." || true
                exit 0
              fi
              # Otherwise the sibling is newer; it will defer to us -- keep going.
            elif [[ "$RID" -lt "$SELF_ID" ]]; then
              # We are the newer run for a DIFFERENT commit. Supersede the older
              # one unless we are the archaeological case: bound to a commit that
              # is not the PR head while the older run covers the head.
              if [[ "$FULL_SHA" == "$PR_HEAD" || "$RSHA" != "$PR_HEAD" ]]; then
                echo "Superseding older run ${RID} (${RSHA:0:7}) with ${FULL_SHA:0:7}."
                gh run cancel "$RID" --repo "$REPO" || true
              else
                echo "Older run ${RID} covers the current head (${RSHA:0:7}); leaving it to finish."
              fi
            else
              # The sibling is newer. Yield to it -- unless it is bound to a
              # non-head commit while we cover the head, in which case both are
              # legitimate and only the newer one ever cancels, so nothing can
              # cancel us. Exactly one run survives in every symmetric case.
              if [[ "$RSHA" == "$PR_HEAD" || "$FULL_SHA" != "$PR_HEAD" ]]; then
                echo "should_eval=false" >> "$GITHUB_OUTPUT"
                echo "Superseded by newer run ${RID} (${RSHA:0:7}); yielding."
                exit 0
              fi
              echo "Newer run ${RID} is bound to ${RSHA:0:7}, not the current head; continuing."
            fi
          done <<< "$ACTIVE"

          # ----- 8) Emit the bound, validated target --------------------------
          echo "PR #${PR_NUMBER}: bound=${FULL_SHA} head=${PR_HEAD} base=${BASE_SHA} fork=${IS_FORK} (trigger: ${EVENT_NAME})"
          echo "is_fork=${IS_FORK}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "should_eval=true" >> "$GITHUB_OUTPUT"

      - name: Clear the acknowledgement when this run will not evaluate
        # The 👀 added above means "this request is being worked on"; the
        # `report-status` job removes it when the evaluation finishes. But that
        # job only runs when should_eval == 'true', so every path that ends
        # inside the gate -- bare /evaluate guidance, an unresolvable or
        # out-of-PR commit (gate failure), and deferring/yielding to a sibling
        # run -- would leave the comment marked in-progress forever. Clear it
        # here instead. `always()` so it also covers the failure paths.
        if: always() && github.event_name == 'issue_comment' && steps.pr.outputs.should_eval != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REACTION_ID=$(gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --jq '.[] | select(.content == "eyes" and .user.login == "github-actions[bot]") | .id' | head -1 || echo "")
          if [[ -n "$REACTION_ID" && "$REACTION_ID" != "null" ]]; then
            gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions/${REACTION_ID}" \
              -X DELETE || true
          fi

      - name: Remove evaluate-now label
        if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For the label entry point, removing the label consumes the trigger so
          # re-applying re-fires. For the workflow_dispatch entry point there is no
          # label to consume, but we still strip any stale human-applied
          # evaluate-now label so it doesn't linger. Removal uses the workflow's
          # own GITHUB_TOKEN; per GitHub's recursion rules, label events emitted by
          # GITHUB_TOKEN do not start new workflow runs.
          gh pr edit "${{ steps.pr.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "evaluate-now" || true

      - name: Set pending commit status
        if: steps.pr.outputs.should_eval == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.head_sha }}" \
            -f state=pending \
            -f context="evaluation-status" \
            -f description="Evaluation in progress..." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ==========================================================================
  # DISCOVER JOB
  # Find skills to evaluate based on changed files.
  # ==========================================================================
  discover:
    needs: gate
    if: >-
      always() &&
      (((needs.gate.result == 'success' && needs.gate.outputs.should_eval == 'true')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')) &&
      (github.event_name != 'schedule' || github.repository == 'dotnet/skills')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      entries: ${{ steps.find.outputs.entries }}
      has_entries: ${{ steps.find.outputs.has_entries }}
      is_infra: ${{ steps.find.outputs.is_infra }}
      plugins: ${{ steps.find.outputs.plugins }}
      has_plugins: ${{ steps.find.outputs.has_plugins }}
    steps:
      - name: Check for new commits since last evaluation
        if: github.event_name == 'schedule'
        id: check-changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bypass the skip guard on manual reruns so "Re-run jobs" always executes.
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Manual rerun (attempt ${GITHUB_RUN_ATTEMPT}) — bypassing skip guard"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine whether a new evaluation is needed by inspecting the most
          # recent completed scheduled run.
          LATEST=$(gh api "repos/${{ github.repository }}/actions/workflows/evaluation.yml/runs?event=schedule&status=completed&per_page=1" \
            --jq '(.workflow_runs[0] // empty) | "\(.head_sha) \(.conclusion)"' 2>/dev/null) || LATEST=""

          if [ -z "$LATEST" ]; then
            echo "No previous completed scheduled run found — proceeding"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_SHA="${LATEST%% *}"
          LAST_CONCLUSION="${LATEST##* }"
          CURRENT_SHA="${{ github.sha }}"

          if [ "$LAST_SHA" = "$CURRENT_SHA" ] && [ "$LAST_CONCLUSION" = "success" ]; then
            echo "Last scheduled evaluation at $LAST_SHA succeeded — skipping"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            if [ "$LAST_SHA" != "$CURRENT_SHA" ]; then
              COUNT=$(gh api "repos/${{ github.repository }}/compare/${LAST_SHA}...${CURRENT_SHA}" --jq '.total_commits' 2>/dev/null) || COUNT="unknown"
              echo "$COUNT new commit(s) since last evaluation ($LAST_SHA)"
            else
              echo "Last scheduled evaluation at $LAST_SHA concluded with '$LAST_CONCLUSION' — retrying"
            fi
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: github.event_name != 'schedule' || steps.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head
        if: needs.gate.outputs.pr_number != ''
        # Fetch the PR ref to bring its objects (incl. the gate-bound commit,
        # which is the head or an ancestor of it) into the local repo. We do NOT
        # use the ref tip as the eval target -- that would re-resolve the live
        # head; the gate-bound SHA is used below instead.
        run: git fetch origin +refs/pull/${{ needs.gate.outputs.pr_number }}/head:refs/remotes/origin/pr-head

      - name: Find skills to evaluate
        if: github.event_name != 'schedule' || steps.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: find
        env:
          INPUT_PLUGIN: ${{ inputs.plugin }}
        run: |
          $entries = @()
          $plugins = @()

          # Build matrix entries for a full-plugin evaluation, sharding the
          # plugin's skills by the optional `executionShard:` top-level tag
          # in tests/<plugin>/<skill>/eval.yaml. Untagged skills fall into a
          # synthetic "default" bucket. Plugins with all skills in one bucket
          # produce a single entry (unchanged behavior); plugins with multiple
          # buckets fan out into one matrix entry per shard so each shard
          # runs on a fresh GitHub-hosted runner. This is the mitigation for
          # MCP-heavy plugins like dotnet-msbuild, where cumulative runner
          # resource usage across ~90 min of continuous MCP traffic
          # consistently triggered host-level termination.
          function Get-PluginShardEntries {
            param(
              [string]$plugin,
              [string]$contentRoot = ".",
              [string[]]$selectedSkills = @()
            )
            $skillsDir = "plugins/$plugin/skills"
            $skillsRoot = Join-Path $contentRoot $skillsDir
            $singleEntry = @{ name = $plugin; plugin = $plugin; skills_path = $skillsDir }
            if (-not (Test-Path $skillsRoot)) {
              if ($selectedSkills.Count -gt 0) { return @() }
              return @($singleEntry)
            }
            $skillDirs = @(Get-ChildItem -Path $skillsRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name | Select-Object -ExpandProperty Name)
            if ($selectedSkills.Count -gt 0) {
              $selected = @{}
              foreach ($skill in $selectedSkills) { $selected[$skill] = $true }
              $skillDirs = @($skillDirs | Where-Object { $selected.ContainsKey($_) })
            }
            if ($skillDirs.Count -eq 0) {
              if ($selectedSkills.Count -gt 0) { return @() }
              return @($singleEntry)
            }
            $shardGroups = @{}
            foreach ($skill in $skillDirs) {
              $evalPath = Join-Path $contentRoot "tests" $plugin $skill "eval.yaml"
              $shard = "default"
              if (Test-Path $evalPath) {
                # Allow optional leading whitespace so an accidentally indented
                # executionShard: key still groups correctly (rather than silently
                # collapsing back to the default bucket).
                $m = Select-String -Path $evalPath -Pattern '^\s*executionShard:\s*[\x27"]?([\w.\-]+)' -List
                if ($m) { $shard = $m.Matches[0].Groups[1].Value }
              }
              if (-not $shardGroups.ContainsKey($shard)) { $shardGroups[$shard] = @() }
              $shardGroups[$shard] += $skill
            }
            if ($shardGroups.Count -le 1) {
              if ($selectedSkills.Count -gt 0) {
                $paths = ($skillDirs | ForEach-Object { "$skillsDir/$_" }) -join ' '
                $name = if ($skillDirs.Count -eq 1) { "$plugin--$($skillDirs[0])" } else { $plugin }
                return @(@{ name = $name; plugin = $plugin; skills_path = $paths })
              }
              return @($singleEntry)
            }
            return @($shardGroups.Keys | Sort-Object | ForEach-Object {
              $shardName = $_
              $paths = ($shardGroups[$shardName] | ForEach-Object { "$skillsDir/$_" }) -join ' '
              @{ name = "$plugin--shard-$shardName"; plugin = $plugin; skills_path = $paths }
            })
          }

          if ("${{ needs.gate.outputs.pr_number }}" -ne "") {
            # Single-PR run (/evaluate comment, /evaluate review, or the
            # evaluate-now label): detect individual changed skills against the
            # exact commit the gate bound this run to. Never re-resolve the live
            # branch head here; always use the gate-bound SHA.
            $base = "${{ needs.gate.outputs.base_sha }}"
            $head = "${{ needs.gate.outputs.head_sha }}"

            # Use a worktree so Test-Path checks are against the bound commit's
            # content (present in the local repo via the refs/pull fetch above).
            # Fail closed: if the bound commit cannot be checked out (e.g. it is
            # no longer present in the repo), stop here rather than continue and
            # report success for a commit we did not actually evaluate.
            git worktree add /tmp/pr-content "${{ needs.gate.outputs.head_sha }}"
            if ($LASTEXITCODE -ne 0) {
              throw "Bound commit ${{ needs.gate.outputs.head_sha }} could not be checked out (it may no longer be present). Failing closed."
            }
            $contentRoot = "/tmp/pr-content"

            $mergeBase = git merge-base $base $head
            $changedFiles = git diff --name-only --diff-filter=ACMR $mergeBase $head

            # Check if any changed files are in infrastructure paths. The linter
            # (skill-validator) is a separate workflow, so eng/skill-validator/
            # changes are NOT infra changes here.
            $hasInfraChanges = $changedFiles |
              Where-Object {
                ($_ -match '^eng/vally-adapter/') -or
                ($_ -match '^dotnet-skills\.experiment\.yaml$') -or
                $_ -match '^\.github/workflows/(evaluation|evaluation-run)\.yml$'
              } |
              Select-Object -First 1

            # Also check for skill/test changes so we don't lose them
            $hasSkillChanges = $changedFiles |
              Where-Object { $_ -match '^(?:plugins/([^/]+)/skills|tests/([^/]+))/([^/]+)/' } |
              Select-Object -First 1

            if ($hasInfraChanges -and -not $hasSkillChanges) {
              echo "is_infra=true" >> $env:GITHUB_OUTPUT
              # Infra-only: evaluate a small random subset of plugins to keep
              # the smoke-test fast while still catching regressions.
              $allPlugins = @(Get-ChildItem -Path (Join-Path $contentRoot "plugins") -Directory -ErrorAction SilentlyContinue |
                Where-Object {
                  (Test-Path (Join-Path $_.FullName "skills")) -and
                  (Test-Path (Join-Path $contentRoot "tests" $_.Name))
                } |
                Select-Object -ExpandProperty Name)
              $plugins = @($allPlugins | Get-Random -Count ([Math]::Min(2, $allPlugins.Count)))
              Write-Host "Infrastructure changes detected, evaluating random subset: $($plugins -join ', ')"
              $entries = @($plugins | ForEach-Object { Get-PluginShardEntries -plugin $_ -contentRoot $contentRoot })
            } else {
              # Extract unique plugin/skill pairs from changed files
              $changedPairs = @($changedFiles |
                Where-Object { $_ -match '^(?:plugins/([^/]+)/skills|tests/([^/]+))/([^/]+)/' } |
                ForEach-Object {
                  $p = if ($Matches[1]) { $Matches[1] } else { $Matches[2] }
                  "$p/$($Matches[3])"
                } |
                Sort-Object -Unique)

              # Filter to skills that have a SKILL.md and a tests directory,
              # then group the changed skills by plugin and apply the same
              # executionShard bucketing used by schedule/full-plugin runs.
              $changedSkillsByPlugin = @{}
              $changedPairs | ForEach-Object {
                $parts = $_ -split '/'
                $plugin = $parts[0]
                $skill = $parts[1]
                $skillMd = Join-Path $contentRoot "plugins" $plugin "skills" $skill "SKILL.md"
                $testsDir = Join-Path $contentRoot "tests" $plugin
                if ((Test-Path $skillMd) -and (Test-Path $testsDir)) {
                  if (-not $changedSkillsByPlugin.ContainsKey($plugin)) { $changedSkillsByPlugin[$plugin] = @() }
                  $changedSkillsByPlugin[$plugin] += $skill
                }
              }
              $entries = @($changedSkillsByPlugin.Keys | Sort-Object | ForEach-Object {
                $plugin = $_
                Get-PluginShardEntries -plugin $plugin -contentRoot $contentRoot -selectedSkills ($changedSkillsByPlugin[$plugin] | Sort-Object -Unique)
              })

              $plugins = @($entries | ForEach-Object { $_.plugin } | Sort-Object -Unique)
            }

            git worktree remove /tmp/pr-content --force 2>$null
          } else {
            # Schedule and workflow_dispatch: evaluate full plugins.
            # Schedule covers everything; workflow_dispatch can optionally
            # narrow to a single plugin via the `plugin` input for ad-hoc
            # smoke tests without committing to main.
            # Exclude experimental plugins from scheduled runs — they are
            # evaluated only on-demand via /evaluate on PRs.
            $excludeFromSchedule = @('dotnet-experimental')
            $dispatchPlugin = "$env:INPUT_PLUGIN"
            if ("${{ github.event_name }}" -eq "workflow_dispatch" -and $dispatchPlugin) {
              # Restrict to a simple directory-name shape before any path
              # construction, so values like '../foo' or 'foo/bar' cannot
              # traverse outside plugins/ or tests/.
              if ($dispatchPlugin -notmatch '^[a-zA-Z0-9._-]+$') {
                throw "workflow_dispatch input plugin='$dispatchPlugin' must match ^[a-zA-Z0-9._-]+$ (single directory name, no path separators)"
              }
              if (-not (Test-Path (Join-Path "plugins" $dispatchPlugin "skills")) -or
                  -not (Test-Path (Join-Path "tests" $dispatchPlugin))) {
                throw "workflow_dispatch input plugin='$dispatchPlugin' is not a valid plugin (must have plugins/<name>/skills and tests/<name>)"
              }
              $plugins = @($dispatchPlugin)
              Write-Host "workflow_dispatch: evaluating only $dispatchPlugin"
            } else {
              $plugins = @(Get-ChildItem -Path "plugins" -Directory |
                Where-Object { (Test-Path (Join-Path $_.FullName "skills")) -and (Test-Path (Join-Path "tests" $_.Name)) -and ($_.Name -notin $excludeFromSchedule) } |
                Select-Object -ExpandProperty Name)
            }
            $entries = @($plugins | ForEach-Object { Get-PluginShardEntries -plugin $_ })
          }

          # Validate every entry against a strict allowlist before it enters
          # the matrix consumed by the vally evaluation. A lone-dot
          # component ('.') matches the charset and holds no '..', but it is a
          # path-normalization token, so reject it for names and path segments.
          $namePattern = '\A[A-Za-z0-9._-]+\z'
          $pathPattern = '\Aplugins/[A-Za-z0-9._-]+/skills(/[A-Za-z0-9._-]+)?\z'
          foreach ($e in $entries) {
            if ("$($e.plugin)" -notmatch $namePattern -or "$($e.plugin)" -match '\.\.' -or "$($e.plugin)" -eq '.') {
              throw "Refusing unsafe matrix entry: plugin '$($e.plugin)' must match $namePattern, not be '.', and not contain '..'"
            }
            if ("$($e.name)" -notmatch $namePattern -or "$($e.name)" -match '\.\.' -or "$($e.name)" -eq '.') {
              throw "Refusing unsafe matrix entry: name '$($e.name)' must match $namePattern, not be '.', and not contain '..'"
            }
            # skills_path is a space-separated list of one or more path segments.
            # An empty or whitespace-only value must hard-fail: it is later used
            # to build CLI arguments, so a blank entry is a configuration error,
            # not a no-op. Filter on the trimmed value so whitespace-only
            # segments count as empty (matching the bash validation step).
            $spSegments = @("$($e.skills_path)" -split ' ' | Where-Object { $_.Trim() })
            if ($spSegments.Count -eq 0) {
              throw "Refusing unsafe matrix entry: skills_path for entry '$($e.name)' is empty"
            }
            # Each segment must also belong to THIS entry's plugin: $pathPattern
            # only checks the generic shape, so bind the prefix to $e.plugin via
            # ordinal string comparison. This blocks a mismatched entry such as
            # plugin=foo + skills_path=plugins/bar/skills, which downstream steps
            # assume shares the entry's plugin prefix.
            $skillsPrefix = "plugins/$($e.plugin)/skills"
            foreach ($sp in $spSegments) {
              if ($sp -notmatch $pathPattern -or $sp -match '\.\.') {
                throw "Refusing unsafe matrix entry: skills_path segment '$sp' must match $pathPattern and not contain '..'"
              }
              # Reject a lone-dot path component ('plugins/./skills' or '.../skills/.').
              if ($sp -match '/\./' -or $sp -match '/\.$') {
                throw "Refusing unsafe matrix entry: skills_path segment '$sp' contains a '.' path component"
              }
              if ($sp -cne $skillsPrefix -and -not $sp.StartsWith("$skillsPrefix/", [System.StringComparison]::Ordinal)) {
                throw "Refusing unsafe matrix entry: skills_path segment '$sp' does not belong to plugin '$($e.plugin)'"
              }
            }
          }

          # Output entries for evaluate matrix
          if (-not $entries -or $entries.Count -eq 0) {
            Write-Host "No entries to evaluate"
            echo "entries=[]" >> $env:GITHUB_OUTPUT
            echo "has_entries=false" >> $env:GITHUB_OUTPUT
          } else {
            $json = $entries | ConvertTo-Json -Compress -AsArray
            Write-Host "Entries to evaluate: $json"
            echo "entries=$json" >> $env:GITHUB_OUTPUT
            echo "has_entries=true" >> $env:GITHUB_OUTPUT
          }

          # Output plugins for publish jobs
          if (-not $plugins -or $plugins.Count -eq 0) {
            echo "plugins=[]" >> $env:GITHUB_OUTPUT
            echo "has_plugins=false" >> $env:GITHUB_OUTPUT
          } else {
            $cjson = $plugins | ConvertTo-Json -Compress -AsArray
            echo "plugins=$cjson" >> $env:GITHUB_OUTPUT
            echo "has_plugins=true" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

  # ==========================================================================
  # EVALUATE
  # Run the eval harness across changed skills via the reusable
  # evaluation-run.yml workflow. This is the sole LLM eval engine — it
  # produces the vally-results-* artifacts every downstream job consumes.
  # (The static-analysis linter is a separate workflow, skill-check.yml.)
  # ==========================================================================
  evaluate:
    needs: [gate, discover]
    if: >-
      always() &&
      needs.discover.outputs.has_entries == 'true' &&
      needs.discover.result == 'success' &&
      needs.gate.outputs.is_fork != 'true' &&
      (needs.gate.result == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/evaluation-run.yml
    with:
      entries: ${{ needs.discover.outputs.entries }}
      head_sha: ${{ needs.gate.outputs.head_sha }}
    # Forward ONLY the Copilot PAT pool across the workflow_call boundary. A
    # reusable workflow does not inherit the caller's org/repo secrets, so the
    # pool would read empty on this path unless it is passed explicitly. We map
    # the 10 named tokens rather than using `secrets: inherit` — inherit would
    # forward every repo/org secret into the reusable workflow and reverse the
    # blast-radius reduction from #868; named mapping crosses only these tokens.
    # This job is a top-level caller, so `secrets.COPILOT_PAT_*` resolves from the
    # existing ORG secrets — the same pool the scheduled validate-pat-pool workflow
    # reads — so no `copilot-pat-pool` environment-secret configuration is needed.
    secrets:
      COPILOT_PAT_0: ${{ secrets.COPILOT_PAT_0 }}
      COPILOT_PAT_1: ${{ secrets.COPILOT_PAT_1 }}
      COPILOT_PAT_2: ${{ secrets.COPILOT_PAT_2 }}
      COPILOT_PAT_3: ${{ secrets.COPILOT_PAT_3 }}
      COPILOT_PAT_4: ${{ secrets.COPILOT_PAT_4 }}
      COPILOT_PAT_5: ${{ secrets.COPILOT_PAT_5 }}
      COPILOT_PAT_6: ${{ secrets.COPILOT_PAT_6 }}
      COPILOT_PAT_7: ${{ secrets.COPILOT_PAT_7 }}
      COPILOT_PAT_8: ${{ secrets.COPILOT_PAT_8 }}
      COPILOT_PAT_9: ${{ secrets.COPILOT_PAT_9 }}

  # ==========================================================================
  # COMMENT ON PR
  # Post consolidated evaluation results as a PR comment.
  # ==========================================================================
  comment-on-pr:
    needs: [gate, discover, evaluate, publish-session-data]
    if: >-
      always() &&
      needs.evaluate.result != 'cancelled' &&
      needs.gate.outputs.is_fork != 'true' &&
      needs.gate.outputs.pr_number != '' &&
      needs.discover.outputs.has_entries == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout adapter tooling
        if: needs.evaluate.result != 'skipped'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            eng/vally-adapter

      - name: Download all result artifacts
        if: needs.evaluate.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vally-results-*
          path: all-results/
          merge-multiple: false
        continue-on-error: ${{ needs.evaluate.result != 'success' }}

      - name: Consolidate and post results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ needs.gate.outputs.pr_number }}
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # If results exist, consolidate them into a summary comment
          JSON_FILES=$(find all-results/ -name results.json 2>/dev/null || true)
          if [ -n "$JSON_FILES" ]; then
            # Full table (all columns incl. Quality (Plugin)) for the step summary,
            # simplified table (Quality (Plugin) dropped) for the PR comment.
            node eng/vally-adapter/consolidate.mjs --format full --root all-results/ --output summary-body.md
            node eng/vally-adapter/consolidate.mjs --format simple --root all-results/ --output simplified-body.md

            INVESTIGATE_PROMPT=""
            # If any skill genuinely lost to its baseline, build a copy-paste
            # prompt for AI-assisted investigation. Underpowered and inconclusive
            # verdicts also carry `passed: false`, but neither is evidence that
            # the skill regressed — attaching the prompt to those would fire on
            # nearly every run and contradict the ⚠️ semantics of the comment
            # body. The `!= false` / `!= true` form keeps results.json files that
            # predate those fields classifying exactly as they did before.
            if jq -se '[.[].verdicts[] | select(.passed == false and .conclusive != false and .underpowered != true)] | length > 0' $JSON_FILES > /dev/null 2>&1; then
              RUN_ID="${{ github.run_id }}"
              INVESTIGATE_PROMPT=$(printf '\n> **To investigate failures**, paste this to your AI coding agent:\n>\n> _For PR %s in %s, download eval artifacts with `gh run download %s --repo %s --pattern "vally-results-*" --dir ./eval-results`, then fetch https://raw.githubusercontent.com/%s/%s/eng/vally-adapter/InvestigatingResults.md and follow it to analyze the results.json files. Diagnose each failure, suggest fixes to the eval.yaml and skill content, and tell me what to fix first._' \
                "${PR_NUMBER}" "${{ github.repository }}" "${RUN_ID}" "${{ github.repository }}" "${{ github.repository }}" "${{ needs.gate.outputs.head_sha }}")
            fi

            # PR comment: simplified table + "Full results" link + investigation prompt
            {
              cat simplified-body.md
              echo ""
              echo "[🔍 Full Results - additional metrics and failure investigation steps]($RUN_URL)"
              if [ -n "$INVESTIGATE_PROMPT" ]; then
                echo "$INVESTIGATE_PROMPT"
              fi
            } > consolidated-comment.md

            # Append AGENTVIZ replay link if session data was published
            if [[ "${{ needs.publish-session-data.result }}" == "success" ]]; then
              # Session data lives in the standalone dotnet/skills-data repo.
              MANIFEST_URL="https://raw.githubusercontent.com/dotnet/skills-data/dashboard-session-data/data/manifest.json"
              # Derive the Pages base URL from the repository (org.github.io/repo)
              ORG=$(echo "${{ github.repository }}" | cut -d/ -f1)
              REPO=$(echo "${{ github.repository }}" | cut -d/ -f2)
              REPLAY_URL="https://${ORG}.github.io/${REPO}/replay/index.html"
              MANIFEST_ENCODED=$(printf '%s' "$MANIFEST_URL" | jq -sRr @uri)
              FULL_URL="${REPLAY_URL}?manifest=${MANIFEST_ENCODED}&tag=pr-${PR_NUMBER}"
              echo "" >> consolidated-comment.md
              echo "**[▶ Sessions Visualisation](${FULL_URL})** -- interactive replay of all evaluation sessions" >> consolidated-comment.md
              ANALYTICS_BASE_URL="https://server.mangowater-996ff7b2.swedencentral.azurecontainerapps.io/"
              FACET_ENCODED=$(printf '%s' "label:pr-${PR_NUMBER}" | jq -sRr @uri)
              ANALYTICS_URL="${ANALYTICS_BASE_URL}?facet=${FACET_ENCODED}"
              echo "**[📊 Session Analytics (preview)](${ANALYTICS_URL})** -- aggregated metrics across evaluation sessions" >> consolidated-comment.md
            fi

            # Action summary: full table (all columns) + investigation prompt
            {
              cat summary-body.md
              if [ -n "$INVESTIGATE_PROMPT" ]; then
                echo "$INVESTIGATE_PROMPT"
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -X POST -F "body=@consolidated-comment.md"
          else
            # No results.json anywhere. Three distinct causes:
            if [[ "${{ needs.evaluate.result }}" == "skipped" ]]; then
              # The evaluate job never ran (an upstream job failed or was skipped).
              BODY="❌ Evaluation did not complete (an upstream job failed or was skipped, so evaluation never ran). [View workflow run](${RUN_URL})"
            elif [[ "${{ needs.evaluate.result }}" != "success" ]]; then
              # The evaluate job failed or was cancelled — it did not complete successfully.
              BODY=$(printf '❌ Evaluation did not complete successfully (the evaluate job reported `%s`). Check the [workflow run](%s) logs, then re-post `/evaluate` to try again.' "${{ needs.evaluate.result }}" "${RUN_URL}")
            else
              # The evaluate job completed but produced zero verdicts — most often a
              # transient LLM-session auth failure ("Session was not created with
              # authentication info or custom provider") rather than a skill regression.
              BODY=$(printf '❌ Evaluation ran but produced no results.\n\nThe evaluate job completed but no `results.json` verdicts were generated. This is usually a **transient infrastructure failure** — commonly an LLM-session auth error (`Session was not created with authentication info or custom provider`) — not a problem with your skill. Check the [workflow run](%s) logs, then re-post `/evaluate` to try again.' "${RUN_URL}")
            fi

            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -X POST -f body="$BODY"
          fi

  # ==========================================================================
  # REPORT STATUS
  # Post final evaluation status via commit status API.
  # ==========================================================================
  report-status:
    needs: [gate, discover, evaluate]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.should_eval == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
      issues: write
    steps:
      - name: Remove eyes reaction from trigger comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REACTION_ID=$(gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --jq '.[] | select(.content == "eyes" and .user.login == "github-actions[bot]") | .id' | head -1 || echo "")
          if [[ -n "$REACTION_ID" && "$REACTION_ID" != "null" ]]; then
            gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions/${REACTION_ID}" \
              -X DELETE || true
          fi

      - name: Set final commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ needs.evaluate.result }}" == "skipped" && "${{ needs.discover.result }}" == "success" && "${{ needs.discover.outputs.has_entries }}" != "true" ]]; then
            STATE="success"
            DESC="No skills to evaluate"
          elif [[ "${{ needs.gate.outputs.is_fork }}" == "true" ]]; then
            STATE="failure"
            DESC="Fork PR evaluation requires a trusted branch"
          elif [[ "${{ needs.evaluate.result }}" == "success" ]]; then
            STATE="success"
            DESC="Evaluation passed"
          elif [[ "${{ needs.evaluate.result }}" == "failure" ]]; then
            STATE="failure"
            DESC="Evaluation failed"
          else
            STATE="error"
            DESC="Evaluation did not complete (evaluate: ${{ needs.evaluate.result }}, discover: ${{ needs.discover.result }})"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ needs.gate.outputs.head_sha }}" \
            -f state="$STATE" \
            -f context="evaluation-status" \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post completion comment for skipped evaluation
        if: needs.evaluate.result == 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ needs.gate.outputs.pr_number }}
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${{ needs.discover.result }}" == "success" && "${{ needs.discover.outputs.has_entries }}" != "true" ]]; then
            BODY="⏭️ No skills to evaluate — no changed skills with tests were found in this PR. [View workflow run](${RUN_URL})"
          elif [[ "${{ needs.gate.outputs.is_fork }}" == "true" ]]; then
            BODY="🔒 Secret-backed evaluation is disabled for fork PRs. A maintainer must review and promote the change to a trusted repository branch before running \`/evaluate\`. [View workflow run](${RUN_URL})"
          else
            BODY="❌ Evaluation did not complete (upstream job failed or was skipped). [View workflow run](${RUN_URL})"
          fi
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -X POST -f body="$BODY"

  # ==========================================================================
  # PUBLISH TOKEN DATA
  # Both scheduled and PR runs: generate token-usage data → dashboard-token-data
  # ==========================================================================
  publish-token-data:
    needs: [gate, discover, evaluate]
    if: >-
      always() &&
      !cancelled() &&
      needs.discover.result == 'success' &&
      needs.discover.outputs.has_plugins == 'true' &&
      needs.gate.outputs.is_fork != 'true' &&
      (
        github.ref == 'refs/heads/main' ||
        needs.gate.result == 'success'
      )
    concurrency:
      group: publish-token-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Download evaluation artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vally-results-*
          path: all-results/
          merge-multiple: false
        continue-on-error: ${{ needs.evaluate.result != 'success' }}

      - name: Fetch existing token data from dashboard-token-data
        run: |
          git fetch origin dashboard-token-data:dashboard-token-data 2>/dev/null || true
          mkdir -p /tmp/token-data/data
          git checkout dashboard-token-data -- data/token-usage.json 2>/dev/null && \
            cp data/token-usage.json /tmp/token-data/data/ && \
            git checkout HEAD -- . || true

      - name: Get PR title
        if: needs.gate.outputs.pr_number != ''
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_TITLE=$(gh api "repos/${{ github.repository }}/pulls/${{ needs.gate.outputs.pr_number }}" --jq '.title' 2>/dev/null) || PR_TITLE=""
          echo "pr_title=${PR_TITLE}" >> $GITHUB_OUTPUT

      - name: Generate token usage data
        env:
          PR_TITLE: ${{ steps.pr-info.outputs.pr_title }}
        run: |
          $source = if ("${{ needs.gate.outputs.pr_number }}" -ne "") { "pr" } else { "scheduled" }
          $plugins = '${{ needs.discover.outputs.plugins }}' | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path "/tmp/combined" | Out-Null
          foreach ($plugin in $plugins) {
            # Vally artifacts are named vally-results-$plugin (scheduled/infra) or
            # vally-results-${plugin}--${skill} (individual skill-change PRs). The
            # adapter writes one results.json per skill at <plugin>/<skill>/results.json
            # inside each artifact, so gather every results.json for this plugin and
            # merge their verdicts into a single file (generate-benchmark-data.ps1
            # expects one file whose verdicts cover the whole plugin).
            $artifactDirs = @(Get-ChildItem -Path "all-results" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq "vally-results-$plugin" -or $_.Name -like "vally-results-$plugin--*" })
            if ($artifactDirs.Count -eq 0) {
              Write-Warning "No artifacts found for $plugin, skipping"
              continue
            }
            $resultFiles = @($artifactDirs | ForEach-Object {
              Get-ChildItem -Path $_.FullName -Recurse -Filter "results.json" -File -ErrorAction SilentlyContinue
            })
            if ($resultFiles.Count -eq 0) {
              Write-Warning "No results.json found for $plugin, skipping"
              continue
            }

            $parsed = @($resultFiles | ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json })
            $verdicts = @($parsed | ForEach-Object { $_.verdicts })
            if ($verdicts.Count -eq 0) {
              Write-Warning "No verdicts found for $plugin, skipping"
              continue
            }
            $combined = [ordered]@{
              model      = $parsed[0].model
              judgeModel = $parsed[0].judgeModel
              timestamp  = $parsed[0].timestamp
              verdicts   = $verdicts
            }
            $combinedFile = "/tmp/combined/$plugin.results.json"
            $combined | ConvertTo-Json -Depth 30 | Out-File -FilePath $combinedFile -Encoding utf8

            Write-Host "`n=== Collecting token usage for: $plugin (from $($resultFiles.Count) results.json across $($artifactDirs.Count) artifact(s)) ==="
            $params = @{
              ResultsFile   = $combinedFile
              PluginName    = $plugin
              OutputDir     = "/tmp/token-data/data"
              Source        = $source
              RetentionDays = $env:DASHBOARD_RETENTION_DAYS
            }
            if ($source -eq "pr") {
              $params.PRNumber = ${{ needs.gate.outputs.pr_number }}
              $params.PRTitle = $env:PR_TITLE
            }
            $params.SkipBenchmarkData = $true
            & ./eng/dashboard/generate-benchmark-data.ps1 @params
          }
        shell: pwsh

      - name: Push to dashboard-token-data branch
        run: |
          cd /tmp
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" dashboard-token-data > /dev/null 2>&1; then
            git clone --branch dashboard-token-data --single-branch "$REPO_URL" token-deploy
          else
            mkdir token-deploy && cd token-deploy && git init && git checkout -b dashboard-token-data
            git remote add origin "$REPO_URL"
            cd /tmp
          fi

          cd /tmp/token-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove any stale files so this branch stays token-only
          git rm -rf data/ --ignore-unmatch --quiet 2>/dev/null || true
          mkdir -p data
          # Ensure token-usage.json exists; create an empty fallback if missing
          if [ ! -f /tmp/token-data/data/token-usage.json ]; then
            mkdir -p /tmp/token-data/data
            printf '{ "entries": [] }\n' > /tmp/token-data/data/token-usage.json
          fi
          cp /tmp/token-data/data/token-usage.json data/

          git add data/token-usage.json
          git diff --cached --quiet && echo "No changes to deploy" && exit 0

          if [[ -n "${{ needs.gate.outputs.pr_number }}" ]]; then
            git commit -m "Update PR token usage data (PR #${{ needs.gate.outputs.pr_number }})"
          else
            git commit -m "Update scheduled token usage data"
          fi
          git push origin dashboard-token-data

  # ==========================================================================
  # PUBLISH SESSION DATA
  # Both scheduled and PR runs: flatten JSONL sessions → dashboard-session-data
  # branch on dotnet/skills-data (separate repo to keep this one small).
  # ==========================================================================
  publish-session-data:
    needs: [gate, discover, evaluate]
    if: >-
      always() && !cancelled() &&
      needs.discover.result == 'success' &&
      needs.discover.outputs.has_plugins == 'true' &&
      needs.gate.outputs.is_fork != 'true' &&
      (
        github.ref == 'refs/heads/main' ||
        needs.gate.result == 'success'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: publish-session-data
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Download evaluation artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vally-results-*
          path: all-results/
          merge-multiple: false
        continue-on-error: ${{ needs.evaluate.result != 'success' }}

      - name: Inspect downloaded artifacts
        if: always()
        run: |
          echo "=== all-results/ directory listing (3 levels) ==="
          if [ -d all-results ]; then
            find all-results -maxdepth 3 -ls 2>/dev/null | head -80
            echo "---"
            echo "executor-session-logs dirs:"
            find all-results -type d -name 'executor-session-logs' 2>/dev/null
            echo "session metadata.json files:"
            find all-results -path '*executor-session-logs*' -name 'metadata.json' 2>/dev/null | head -20
            echo "events.jsonl files:"
            find all-results -path '*executor-session-logs*' -name 'events.jsonl' 2>/dev/null | head -20
          else
            echo "all-results/ directory does not exist!"
          fi

      - name: Determine source metadata
        id: meta
        run: |
          if [ -n "${{ needs.gate.outputs.pr_number }}" ]; then
            echo "source=pr" >> "$GITHUB_OUTPUT"
            echo "pr_number=${{ needs.gate.outputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "subdir=pr/${{ needs.gate.outputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "source=scheduled" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "subdir=scheduled/$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build session manifest
        shell: pwsh
        run: |
          ./eng/dashboard/build-replay-sessions.ps1 `
            -ResultsDir all-results `
            -OutputDir staging `
            -Source ${{ steps.meta.outputs.source }} `
            -PrNumber "${{ steps.meta.outputs.pr_number }}"

      - name: Clone existing session data branch
        env:
          # Cross-repo PAT with contents:write on dotnet/skills-data.
          # GITHUB_TOKEN cannot push to a different repo, so a fine-grained PAT is required.
          SKILLS_DATA_TOKEN: ${{ secrets.SKILLS_DATA_TOKEN }}
        run: |
          cd /tmp
          REPO_URL="https://x-access-token:${SKILLS_DATA_TOKEN}@github.com/dotnet/skills-data.git"

          if git ls-remote --exit-code --heads "$REPO_URL" dashboard-session-data > /dev/null 2>&1; then
            git clone --branch dashboard-session-data --single-branch --depth 1 "$REPO_URL" session-deploy
          else
            mkdir session-deploy && cd session-deploy && git init && git checkout -b dashboard-session-data
            git remote add origin "$REPO_URL"
            cd /tmp
          fi

          cd /tmp/session-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge and purge old sessions
        shell: pwsh
        run: |
          ./eng/dashboard/purge-replay-sessions.ps1 `
            -ExistingDir /tmp/session-deploy/data `
            -NewDir staging `
            -OutputDir /tmp/session-deploy/data `
            -RetentionDays 7

      - name: Push to dashboard-session-data branch (dotnet/skills-data)
        run: |
          cd /tmp/session-deploy
          git add data/
          git diff --cached --quiet && echo "No changes to deploy" && exit 0

          if [[ -n "${{ needs.gate.outputs.pr_number }}" ]]; then
            git commit -m "Update session data (PR #${{ needs.gate.outputs.pr_number }})"
          else
            git commit -m "Update scheduled session data"
          fi
          git push origin dashboard-session-data

  # ==========================================================================
  # PUBLISH EVAL DATA
  # Scheduled runs only: generate benchmark data → dashboard-eval-data
  # ==========================================================================
  publish-eval-data:
    needs: [gate, discover, evaluate]
    if: >-
      always() &&
      !cancelled() &&
      needs.discover.result == 'success' &&
      needs.discover.outputs.has_plugins == 'true' &&
      github.event_name == 'schedule'
    concurrency:
      group: publish-eval-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Download evaluation artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vally-results-*
          path: all-results/
          merge-multiple: false
        continue-on-error: ${{ needs.evaluate.result != 'success' }}

      - name: Fetch existing eval data from dashboard-eval-data
        run: |
          git fetch origin dashboard-eval-data:dashboard-eval-data 2>/dev/null || true
          mkdir -p /tmp/eval-data/data
          git checkout dashboard-eval-data -- data/ 2>/dev/null && \
            cp -r data/* /tmp/eval-data/data/ && \
            git checkout HEAD -- . || true

      - name: Generate benchmark data
        run: |
          $sha = "${{ github.sha }}"
          $commitMsg = git log -1 --format='%s' $sha
          $commitTimestamp = git log -1 --format='%aI' $sha
          $commitAuthor = git log -1 --format='%an' $sha

          $commitJson = @{
            id        = $sha
            message   = $commitMsg
            timestamp = $commitTimestamp
            url       = "https://github.com/${{ github.repository }}/commit/$sha"
            author    = @{ name = $commitAuthor; username = "${{ github.actor }}" }
          } | ConvertTo-Json -Compress

          $plugins = '${{ needs.discover.outputs.plugins }}' | ConvertFrom-Json
          foreach ($plugin in $plugins) {
            # A plugin may have been fanned out into multiple shards by the
            # discover job (artifact names "vally-results-<plugin>--shard-<tag>"),
            # or it may be a single artifact ("vally-results-<plugin>"). The
            # adapter writes one results.json per skill at <plugin>/<skill>/results.json
            # inside each artifact, so gather every results.json across all matching
            # artifacts and merge their verdicts into a single results.json — the
            # dashboard records ONE datapoint per plugin per scheduled run.
            $artifactDirs = @(Get-ChildItem -Path "all-results" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq "vally-results-$plugin" -or $_.Name -like "vally-results-$plugin--*" })

            if ($artifactDirs.Count -eq 0) {
              Write-Warning "No run results found for $plugin, skipping"
              continue
            }

            $resultsFiles = @($artifactDirs | ForEach-Object {
              Get-ChildItem -Path $_.FullName -Recurse -Filter "results.json" -File -ErrorAction SilentlyContinue |
                ForEach-Object { $_.FullName }
            })

            if ($resultsFiles.Count -eq 0) {
              Write-Warning "No results.json found in any artifact for $plugin, skipping"
              continue
            }

            if ($resultsFiles.Count -eq 1) {
              $resultsFile = $resultsFiles[0]
            } else {
              # Merge per-skill/per-shard verdicts into a single synthetic
              # results.json. Schema: { model, verdicts[], ... }. We concat the
              # verdicts arrays and keep top-level scalars from the first file.
              Write-Host "Merging $($resultsFiles.Count) results.json files for $plugin"
              $merged = $null
              $allVerdicts = [System.Collections.Generic.List[object]]::new()
              foreach ($rf in ($resultsFiles | Sort-Object)) {
                $r = Get-Content $rf -Raw | ConvertFrom-Json
                if ($null -eq $merged) { $merged = $r }
                if ($r.verdicts) { foreach ($v in $r.verdicts) { $allVerdicts.Add($v) } }
              }
              $merged.verdicts = $allVerdicts.ToArray()
              $mergedDir = "all-results/_merged"
              New-Item -ItemType Directory -Force -Path $mergedDir | Out-Null
              $resultsFile = Join-Path $mergedDir "$plugin.results.json"
              $merged | ConvertTo-Json -Depth 100 | Out-File -FilePath $resultsFile -Encoding utf8
              Write-Host "  Merged verdict count: $($allVerdicts.Count) -> $resultsFile"
            }

            Write-Host "`n=== Generating benchmark data for: $plugin ==="
            $existingFile = "/tmp/eval-data/data/$plugin.json"
            $params = @{
              ResultsFile    = $resultsFile
              PluginName     = $plugin
              OutputDir      = "/tmp/eval-data/data"
              CommitJson     = $commitJson
              RetentionDays  = $env:DASHBOARD_RETENTION_DAYS
              Source         = 'scheduled'
              SkipTokenUsage = $true
            }
            if ((Test-Path $existingFile) -and (Get-Content $existingFile -Raw -ErrorAction SilentlyContinue)) {
              $params.ExistingDataFile = $existingFile
            }
            & ./eng/dashboard/generate-benchmark-data.ps1 @params
          }

          # Purge entries older than retention window
          & ./eng/dashboard/generate-benchmark-data.ps1 -PurgeStaleFiles -DataDir "/tmp/eval-data/data" -RetentionDays $env:DASHBOARD_RETENTION_DAYS

          # Generate components.json manifest (exclude token-usage.json if present)
          $plugins = Get-ChildItem -Path "/tmp/eval-data/data" -Filter "*.json" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notin @("components.json", "token-usage.json") } |
            ForEach-Object { $_.BaseName }
          @($plugins) | ConvertTo-Json -AsArray | Out-File -FilePath "/tmp/eval-data/data/components.json" -Encoding utf8
        shell: pwsh

      - name: Push to dashboard-eval-data branch
        run: |
          cd /tmp
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" dashboard-eval-data > /dev/null 2>&1; then
            git clone --branch dashboard-eval-data --single-branch "$REPO_URL" eval-deploy
          else
            mkdir eval-deploy && cd eval-deploy && git init && git checkout -b dashboard-eval-data
            git remote add origin "$REPO_URL"
            cd /tmp
          fi

          cd /tmp/eval-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove stale files so this branch only contains current eval data
          git rm -rf data/ --ignore-unmatch --quiet 2>/dev/null || true
          mkdir -p data
          # Copy only eval data files (not token-usage.json)
          cp /tmp/eval-data/data/components.json data/
          for f in /tmp/eval-data/data/*.json; do
            fname=$(basename "$f")
            [ "$fname" = "token-usage.json" ] && continue
            cp "$f" "data/$fname"
          done

          git add data/
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Update benchmark data"
          git push origin dashboard-eval-data

  # ==========================================================================
  # DEPLOY DASHBOARD
  # Scheduled runs + manual dispatch on main: assemble data from both
  # branches + UI → gh-pages. No data generation — pure copy and deploy.
  # ==========================================================================
  deploy-dashboard:
    needs: [discover, publish-token-data, publish-eval-data, publish-session-data]
    if: >-
      always() &&
      !cancelled() &&
      (
        (needs.discover.result == 'success' && needs.discover.outputs.has_plugins == 'true' && github.event_name == 'schedule') ||
        (github.event_name == 'workflow_dispatch' && inputs.pr_number == '' && github.ref == 'refs/heads/main')
      )
    concurrency:
      group: deploy-dashboard
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for dashboard UI files)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Fetch eval data from dashboard-eval-data branch
        run: |
          mkdir -p /tmp/gh-pages/data
          git fetch origin dashboard-eval-data:dashboard-eval-data 2>/dev/null || true
          git checkout dashboard-eval-data -- data/ 2>/dev/null && \
            cp -r data/* /tmp/gh-pages/data/ && \
            git checkout HEAD -- . || true

      - name: Fetch token data from dashboard-token-data branch
        run: |
          git fetch origin dashboard-token-data:dashboard-token-data 2>/dev/null || true
          git show dashboard-token-data:data/token-usage.json > /tmp/gh-pages/data/token-usage.json 2>/dev/null || \
            echo '{"entries":[]}' > /tmp/gh-pages/data/token-usage.json

      - name: Check if AGENTVIZ SPA needs update
        id: check-replay
        run: |
          AGENTVIZ_REPO="https://github.com/jayparikh/agentviz.git"
          AGENTVIZ_BRANCH="main"

          # Resolve the latest commit on the AGENTVIZ branch (no clone needed)
          TARGET_SHA=$(git ls-remote "$AGENTVIZ_REPO" "refs/heads/$AGENTVIZ_BRANCH" | cut -f1)
          if [ -z "$TARGET_SHA" ]; then
            echo "::error::Could not resolve AGENTVIZ branch $AGENTVIZ_BRANCH"
            exit 1
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "AGENTVIZ target commit: $TARGET_SHA"

          # Read the currently deployed commit SHA from gh-pages (no clone needed)
          DEPLOYED_SHA=""
          DEPLOYED_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/replay/.agentviz-commit" \
            2>/dev/null) || true
          echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"

          if [ "$TARGET_SHA" = "$DEPLOYED_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "AGENTVIZ SPA is up-to-date (commit $TARGET_SHA), skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "AGENTVIZ SPA needs update: deployed=$DEPLOYED_SHA target=$TARGET_SHA"
          fi

      - name: Build AGENTVIZ SPA
        if: steps.check-replay.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        id: agentviz-cache
        with:
          path: /tmp/agentviz-dist
          key: agentviz-dist-${{ steps.check-replay.outputs.target_sha }}

      - name: Build AGENTVIZ SPA (on cache miss)
        if: steps.check-replay.outputs.skip != 'true' && steps.agentviz-cache.outputs.cache-hit != 'true'
        run: |
          TARGET_SHA="${{ steps.check-replay.outputs.target_sha }}"

          git clone https://github.com/jayparikh/agentviz.git /tmp/agentviz-src
          cd /tmp/agentviz-src

          # Check out the exact resolved commit for deterministic builds
          if ! git checkout "$TARGET_SHA"; then
            echo "::error::Failed to check out AGENTVIZ commit $TARGET_SHA"
            exit 1
          fi

          npm ci
          npm run build
          mkdir -p /tmp/agentviz-dist
          cp -r dist/* /tmp/agentviz-dist/

      - name: Deploy to GitHub Pages
        run: |
          cd /tmp
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages > /dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$REPO_URL" deploy
          else
            mkdir deploy && cd deploy && git init && git checkout -b gh-pages
            git remote add origin "$REPO_URL"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            cd /tmp
          fi

          cd /tmp/deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy data from both branches
          mkdir -p data
          cp /tmp/gh-pages/data/*.json data/

          # Copy dashboard UI from source tree
          cp ${{ github.workspace }}/eng/dashboard/dashboard.html index.html
          cp ${{ github.workspace }}/eng/dashboard/dashboard.js dashboard.js
          cp ${{ github.workspace }}/eng/dashboard/token-usage.js token-usage.js

          # Deploy AGENTVIZ SPA (skip if already present and unchanged)
          if [ "${{ steps.check-replay.outputs.skip }}" != "true" ]; then
            rm -rf replay
            mkdir -p replay
            if [ -d /tmp/agentviz-dist ]; then
              cp -r /tmp/agentviz-dist/* replay/
            else
              echo "::error::No AGENTVIZ build artifacts found"
              exit 1
            fi
            echo "${{ steps.check-replay.outputs.target_sha }}" > replay/.agentviz-commit
          fi

          git add .
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Update dashboard"
          git push origin gh-pages