name: eval-quality

# Structural quality gate for evaluation specs and their fixtures.
#
# Each failing check corresponds to a defect that has already cost a real
# evaluation result on this repo — see eng/eval-quality/README.md. All of them
# are structural (file existence, git state, declared counts, YAML keys), so the
# gate cannot fire spuriously on well-written prose. Judgement calls such as
# orphaned fixtures and grandfathered underpowered evals are reported but never
# fail the build.

on:
  pull_request:
    paths:
      - "tests/**"
      - "plugins/**"
      - "eng/eval-quality/**"
      # check_floor_agreement() reads MIN_CREDIBLE_STIMULI out of the adapter, so
      # the one diff that can break the floor's two-language agreement is a diff
      # to the adapter. Without this the guard would never run on it.
      - "eng/vally-adapter/**"
      - ".github/workflows/eval-quality.yml"
      - ".gitignore"
  push:
    branches: [main]
    # Kept in sync with the pull_request paths above. The gate reads plugins/*
    # (skills with no eval), .gitignore (fixtures excluded from the index), and
    # eng/vally-adapter (the stimulus floor it must agree with), so omitting any of
    # them here would let a direct push or a squash-merge that touches only
    # those land on main without the gate ever running.
    paths:
      - "tests/**"
      - "plugins/**"
      - "eng/eval-quality/**"
      - "eng/vally-adapter/**"
      - ".github/workflows/eval-quality.yml"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # The underpowered allowlist is shrink-only, which needs the base
          # revision to compare against. Shallow history has no merge base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      # The gate is only trustworthy if it has been shown to fire. This injects
      # each defect into a scratch tree and asserts the gate rejects it.
      - name: Self-test the gate
        run: python eng/eval-quality/selftest_eval_quality.py

      - name: Check eval quality
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          COMPARISON_REF=""
          # On a pull request, additionally reject new entries in the
          # underpowered allowlist relative to the base branch — otherwise a PR
          # could add a below-floor eval and exempt it in the same change.
          if [ -n "$BASE_REF" ]; then
            COMPARISON_REF="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "push" ] &&
               [ -n "$PUSH_BEFORE" ] &&
               [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$PUSH_BEFORE^{commit}"; then
            # A push can contain multiple commits. Compare with the event's
            # pre-push tip so suites changed by any commit are checked.
            COMPARISON_REF="$PUSH_BEFORE"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual runs validate the selected ref against main. The repository
            # still has grandfathered migration debt, so repository-wide audits
            # remain an explicit local operation.
            COMPARISON_REF="origin/main"
          fi

          if [ -n "$COMPARISON_REF" ]; then
            # Checker, adapter, and workflow changes own the repository-wide
            # contract. Run both the base and current checker over every spec
            # in the current tree and reject any drop in detected errors. This
            # exercises all specs without making pre-existing migration debt a
            # blocker for unrelated PRs.
            if git diff --name-only "$COMPARISON_REF"...HEAD |
              grep -Eq '^(\.github/workflows/eval-quality\.yml|eng/eval-quality/(check_eval_quality|selftest_eval_quality)\.py|eng/vally-adapter/adapt\.mjs)$'; then
              BASE_CHECKER="$(mktemp --suffix=.py)"
              BASE_LOG="$(mktemp)"
              CURRENT_LOG="$(mktemp)"
              git show "$COMPARISON_REF:eng/eval-quality/check_eval_quality.py" > "$BASE_CHECKER"
              # The base checker predates the explicit --all switch and audits
              # every spec by default.
              python "$BASE_CHECKER" > "$BASE_LOG" 2>&1 || true
              python eng/eval-quality/check_eval_quality.py --all > "$CURRENT_LOG" 2>&1 || true
              python - "$BASE_LOG" "$CURRENT_LOG" <<'PY'
          import pathlib
          import re
          import sys

          def error_count(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              match = re.search(r"(\d+) error\(s\)\.", text)
              if match:
                  return int(match.group(1))
              if "No errors." in text:
                  return 0
              raise SystemExit(f"Could not read eval-quality result from {path}")

          base_count = error_count(sys.argv[1])
          current_count = error_count(sys.argv[2])
          current_text = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          if "checked all " not in current_text:
              raise SystemExit("Current checker did not audit every eval spec")
          print(f"Repository-wide contract audit: base={base_count}, current={current_count}")
          if current_count < base_count:
              raise SystemExit(
                  "The current checker detects fewer repository-wide defects than the base checker")
          PY
            fi
            python eng/eval-quality/check_eval_quality.py --base-ref "$COMPARISON_REF"
          else
            # Unusual push events have no safe comparison base. A full audit is
            # safer than silently checking only HEAD^.
            python eng/eval-quality/check_eval_quality.py --all
          fi
