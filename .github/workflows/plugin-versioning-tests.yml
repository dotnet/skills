name: plugin-versioning-tests

on:
  pull_request:
    paths:
      - "eng/version/**"
      - "plugins/*/plugin.json"
      - "plugins/*/.claude-plugin/plugin.json"
      - ".github/workflows/plugin-versioning-tests.yml"
      - ".github/workflows/version-bump-command.yml"
      - ".github/workflows/weekly-version-sync.yml"
      - "CONTRIBUTING.md"
  push:
    branches: [main]
    paths:
      - "eng/version/**"
      - "plugins/*/plugin.json"
      - "plugins/*/.claude-plugin/plugin.json"
      - ".github/workflows/plugin-versioning-tests.yml"
      - ".github/workflows/version-bump-command.yml"
      - ".github/workflows/weekly-version-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run plugin versioning regression tests
        shell: pwsh
        run: ./eng/version/Test-Sync-PluginVersions.ps1
