name: evaluation-workflow-tests

on:
  pull_request:
    paths:
      - ".github/workflows/evaluation.yml"
      - ".github/workflows/evaluation-run.yml"
      - ".github/workflows/evaluation-workflow-tests.yml"
      - ".github/workflows/pr-triage.yml"
      - ".github/aw/actions-lock.json"
      - ".github/aw/shared/devops-health.lock.md"
      - ".github/aw/shared/devops-investigate.lock.md"
      - ".github/workflows/agentics-maintenance.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/devops-health-check.md"
      - ".github/workflows/devops-health-groom.md"
      - ".github/workflows/devops-health-investigate.md"
      - ".github/workflows/issue-triage.md"
      - ".github/workflows/*.lock.yml"
      - ".github/scripts/**"
      - "eng/evaluation-tools/**"
      - "eng/run-skill-evals.sh"
      - "eng/evaluation/test_token_failover.py"
      - "eng/evaluation/test_pr_triage_retry.py"
      - "eng/evaluation/find-targets.ps1"
      - "eng/evaluation/path-safety.ps1"
      - "eng/evaluation/workflow-targets.ps1"
      - "eng/evaluation/test_workflow_targets.py"
      - "eng/dashboard/**"
      - "eng/vally-adapter/**"
      - "eng/skill-validator/src/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluation.yml"
      - ".github/workflows/evaluation-run.yml"
      - ".github/workflows/evaluation-workflow-tests.yml"
      - ".github/workflows/pr-triage.yml"
      - ".github/aw/actions-lock.json"
      - ".github/aw/shared/devops-health.lock.md"
      - ".github/aw/shared/devops-investigate.lock.md"
      - ".github/workflows/agentics-maintenance.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/devops-health-check.md"
      - ".github/workflows/devops-health-groom.md"
      - ".github/workflows/devops-health-investigate.md"
      - ".github/workflows/issue-triage.md"
      - ".github/workflows/*.lock.yml"
      - ".github/scripts/**"
      - "eng/evaluation-tools/**"
      - "eng/run-skill-evals.sh"
      - "eng/evaluation/test_token_failover.py"
      - "eng/evaluation/test_pr_triage_retry.py"
      - "eng/evaluation/find-targets.ps1"
      - "eng/evaluation/path-safety.ps1"
      - "eng/evaluation/workflow-targets.ps1"
      - "eng/evaluation/test_workflow_targets.py"
      - "eng/dashboard/**"
      - "eng/vally-adapter/**"
      - "eng/skill-validator/src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vally-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run adapter fault-injection and report tests
        run: node --test eng/vally-adapter/*.test.mjs eng/dashboard/*.test.js

  evaluation-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Go for rooted workspace filesystem
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false

      - name: Install evaluation tools
        run: |
          printf '' > "$RUNNER_TEMP/evaluation.npmrc"
          npm ci \
            --prefix eng/evaluation-tools \
            --userconfig "$RUNNER_TEMP/evaluation.npmrc" \
            --registry https://registry.npmjs.org/

      - name: Smoke test evaluation tools
        working-directory: eng/evaluation-tools
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform, process.env.EXPECTED_PLATFORM); assert.equal(process.arch, process.env.EXPECTED_ARCH)"
          node_modules/.bin/vally --version
          node vally.mjs --version
          node_modules/.bin/copilot --version
          node --input-type=module -e "import.meta.resolve('@github/copilot-' + process.platform + '-' + process.arch + '/sdk')"

      - name: Test SDK startup ordering without model calls
        # This native build is traversal-resistant; do not replace it with
        # GOOS=js/WASI or a pathname-canonicalization implementation.
        run: |
          cd eng/evaluation-tools/workspace-root
          GOTOOLCHAIN=go1.27.1 go test ./...
          GOTOOLCHAIN=go1.27.1 go build -o ../workspace-root-helper .
          cd ../../..
          node --test eng/evaluation-tools/*.test.mjs

  token-failover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Test evaluation workflow behavior
        run: |
          python eng/evaluation/test_token_failover.py
          python eng/evaluation/test_workflow_targets.py
          python eng/evaluation/test_pr_triage_retry.py
