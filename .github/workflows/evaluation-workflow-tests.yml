name: evaluation-workflow-tests

on:
  pull_request:
    paths:
      - ".github/workflows/evaluation.yml"
      - ".github/workflows/evaluation-run.yml"
      - ".github/workflows/evaluation-workflow-tests.yml"
      - ".github/aw/actions-lock.json"
      - ".github/aw/shared/devops-health.lock.md"
      - ".github/aw/shared/devops-investigate.lock.md"
      - ".github/workflows/agentics-maintenance.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/devops-health-check.md"
      - ".github/workflows/devops-health-copilot-pin.yml"
      - ".github/workflows/devops-health-groom.md"
      - ".github/workflows/devops-health-investigate.md"
      - "eng/devops-health/**"
      - ".github/workflows/issue-triage.md"
      - ".github/workflows/*.lock.yml"
      - "eng/evaluation-tools/**"
      - "eng/evaluation/test_token_failover.py"
      - "eng/evaluation/find-targets.ps1"
      - "eng/evaluation/path-safety.ps1"
      - "eng/dashboard/**"
      - "eng/vally-adapter/**"
      - "eng/skill-validator/src/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluation.yml"
      - ".github/workflows/evaluation-run.yml"
      - ".github/workflows/evaluation-workflow-tests.yml"
      - ".github/aw/actions-lock.json"
      - ".github/aw/shared/devops-health.lock.md"
      - ".github/aw/shared/devops-investigate.lock.md"
      - ".github/workflows/agentics-maintenance.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/devops-health-check.md"
      - ".github/workflows/devops-health-copilot-pin.yml"
      - ".github/workflows/devops-health-groom.md"
      - ".github/workflows/devops-health-investigate.md"
      - "eng/devops-health/**"
      - ".github/workflows/issue-triage.md"
      - ".github/workflows/*.lock.yml"
      - "eng/evaluation-tools/**"
      - "eng/evaluation/test_token_failover.py"
      - "eng/evaluation/find-targets.ps1"
      - "eng/evaluation/path-safety.ps1"
      - "eng/dashboard/**"
      - "eng/vally-adapter/**"
      - "eng/skill-validator/src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vally-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run adapter fault-injection and report tests
        run: node --test eng/vally-adapter/*.test.mjs eng/dashboard/*.test.js

  evaluation-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install evaluation tools
        run: |
          printf '' > "$RUNNER_TEMP/evaluation.npmrc"
          npm ci \
            --prefix eng/evaluation-tools \
            --userconfig "$RUNNER_TEMP/evaluation.npmrc" \
            --registry https://registry.npmjs.org/

      - name: Smoke test evaluation tools
        working-directory: eng/evaluation-tools
        run: |
          node_modules/.bin/vally --version
          node vally.mjs --version
          node_modules/.bin/copilot --version
          node --input-type=module -e "import.meta.resolve('@github/copilot-linux-x64/sdk')"

      - name: Test SDK startup ordering without model calls
        run: node --test eng/evaluation-tools/*.test.mjs

  devops-health-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Test Copilot pin maintenance
        run: |
          python -m unittest eng/devops-health/test_copilot_pin.py
          node --test eng/devops-health/test_mcp_canary_server.mjs

  devops-health-mcp-live-canary:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'dotnet/skills' &&
      github.actor == 'AbhitejJohn' &&
      github.ref == 'refs/heads/abhitejjohn-devops-health-follow-up'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: copilot-pat-pool
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Resolve owned candidate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          compiler=$(
            python -c '
          import json
          from pathlib import Path
          line = Path(".github/workflows/devops-health-check.lock.yml").read_text().splitlines()[0]
          print(json.loads(line.removeprefix("# gh-aw-metadata: "))["compiler_version"])
          '
          )
          object=$(
            gh api "repos/github/gh-aw/git/ref/tags/${compiler}" \
              --jq '.object | [.type, .sha] | @tsv'
          )
          read -r object_type object_sha <<< "$object"
          if [[ "$object_type" == "tag" ]]; then
            object_sha=$(
              gh api "repos/github/gh-aw/git/tags/${object_sha}" --jq '.object.sha'
            )
          elif [[ "$object_type" != "commit" ]]; then
            echo "::error::Unexpected gh-aw tag object type: $object_type"
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/compat.json" \
            "https://raw.githubusercontent.com/github/gh-aw/${object_sha}/.github/aw/compat.json"
          python eng/devops-health/copilot_pin.py plan \
            --compat "$RUNNER_TEMP/compat.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup selected gh-aw scripts
        uses: github/gh-aw-actions/setup@5e508589e03a7757a7e05b26e834292f5445bfb6 # v0.88.7
        with:
          destination: ${{ runner.temp }}/gh-aw/actions

      - name: Install owned candidate Copilot CLI
        env:
          CANDIDATE: ${{ steps.plan.outputs.candidate }}
          GH_HOST: github.com
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/gh-aw/actions/install_copilot_cli.sh" "$CANDIDATE"
          test "$(copilot --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)" = "$CANDIDATE"

      - name: Run exact end-to-end MCP compatibility canary
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT_0 || secrets.COPILOT_PAT_1 || secrets.COPILOT_PAT_2 || secrets.COPILOT_PAT_3 || secrets.COPILOT_PAT_4 || secrets.COPILOT_PAT_5 || secrets.COPILOT_PAT_6 || secrets.COPILOT_PAT_7 || secrets.COPILOT_PAT_8 || secrets.COPILOT_PAT_9 }}
          GATEWAY_IMAGE: ${{ steps.plan.outputs.gateway_image }}
        run: bash eng/devops-health/run_mcp_canary.sh

  token-failover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Test evaluation workflow behavior
        run: python eng/evaluation/test_token_failover.py
