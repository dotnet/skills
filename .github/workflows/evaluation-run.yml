# Cross-family skill evaluation with vally.
#
# Runs every runnable skill through a matrix of executor models
# {opus, gpt, sonnet46, haiku, mai, gpt53codex}, judged head-to-head (skilled vs
# baseline) by `vally compare`. The judge is NEVER the same family as the executor:
#   - default judge = claude-opus-4.8
#   - when Opus is the executor, judge switches to gpt-5.5
# gpt53codex (gpt-5.3-codex) is a GPT-family executor, so it keeps the default
# claude-opus-4.8 judge (the judge-comparison study's recommended anchor judge).
#
# Each matrix cell = {executor} x {plugin} (x {shard}): it runs a slice of the
# plugin's evals under one executor model, then adapts them into per-skill
# verdicts. With shards>1 a plugin's skills are round-robined across that many
# parallel cells (whole skills per cell, full n) to keep large plugins under the
# per-cell job timeout. Results are uploaded per cell and assembled into a
# cross-family pass matrix by the summary job. This workflow is informational
# only — it never gates PRs.
#
# Dispatch:  gh workflow run evaluation-run.yml --ref <branch> \
#              -f plugins="dotnet-msbuild,dotnet-test" \
#              -f executors="opus,gpt,sonnet46,haiku,mai" \
#              -f runs=3 -f workers=5 -f shards=1 -f timeout_minutes=300
# Leave `plugins` empty to auto-discover every plugin that has non-agent evals.
# To scope to specific skill(s), pass `skills` (comma-separated skill directory
# names); it works with or without `plugins`, e.g. one skill across all plugins:
#              gh workflow run evaluation-run.yml --ref <branch> \
#                -f skills="msbuild-server" -f executors="opus,gpt"
# `runs` is the trial count (n) per eval; default 3. `workers` parallelizes the
# experiment phase within a cell (default 5). `shards` splits each plugin's
# skills across N parallel cells (default 1). `timeout_minutes` is the per-cell
# job timeout (default 300; GitHub-hosted hard cap 360).
#
# WHY THIS LIVES UNDER evaluation-run.yml:
# workflow_dispatch is only selectable for workflow files that exist on the
# DEFAULT branch (main). `evaluation-run.yml` already exists on main (the
# reusable Vally eval harness, called by evaluation.yml and manually
# dispatchable), so it is already registered as dispatchable. By carrying this
# cross-family matrix under the same filename on a feature branch, anyone can:
#     git fetch origin && git cherry-pick <this branch's commit>   # or merge it
#     git push
#     gh workflow run evaluation-run.yml --ref <their-branch> -f ...
# and GitHub runs THIS (the ref's) version + inputs against their branch's code,
# WITHOUT waiting for a merge to main. A brand-new filename could not do this.
#
# NOT FOR MERGE TO MAIN: this file REPLACES main's reusable evaluation-run.yml
# (which has a `workflow_call` trigger consumed by evaluation.yml's discover /
# vally-evaluate job). This cross-family variant has no `workflow_call` trigger,
# so on any branch that carries it the PR-eval path via evaluation.yml will not
# run. That is fine on a throwaway cherry-pick/dispatch branch, but it must NOT
# be merged to main. Keep it as a cherry-pick / dispatch source only.
#
# Eval-spec filename is auto-derived from `dotnet-skills.experiment.yaml`'s
# `evals:` glob (eval.vally.yaml or eval.yaml) so discovery and --eval-filter
# always match what `vally experiment run` enumerates. This keeps the workflow
# working whether the repo globs eval.vally.yaml (current main) or eval.yaml
# (e.g. after #877 lands), with no edit needed.
name: cross-family-evaluation

on:
  # Reusable-call signature preserved verbatim from main's evaluation-run.yml so
  # evaluation.yml's `uses: ./.github/workflows/evaluation-run.yml` reference
  # stays valid — actionlint validates reusable-workflow references (inputs +
  # secrets) statically across the whole repo, and a missing workflow_call
  # trigger fails the actionlint gate. This cross-family variant does NOT
  # implement the reusable path: the jobs below are guarded to run only on
  # workflow_dispatch. On a cherry-pick branch `discover` finds no changed
  # skills, so evaluation.yml never actually invokes this call path at runtime.
  workflow_call:
    inputs:
      entries:
        description: 'JSON array of matrix entries from discover job (unused by the cross-family variant)'
        required: true
        type: string
      head_sha:
        description: 'PR head SHA to checkout (unused by the cross-family variant)'
        required: false
        type: string
        default: ''
    secrets:
      COPILOT_PAT_0: { required: false }
      COPILOT_PAT_1: { required: false }
      COPILOT_PAT_2: { required: false }
      COPILOT_PAT_3: { required: false }
      COPILOT_PAT_4: { required: false }
      COPILOT_PAT_5: { required: false }
      COPILOT_PAT_6: { required: false }
      COPILOT_PAT_7: { required: false }
      COPILOT_PAT_8: { required: false }
      COPILOT_PAT_9: { required: false }
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Comma-separated plugin names (empty = all discovered plugins with evals)'
        required: false
        type: string
        default: ''
      skills:
        description: 'Comma-separated skill names to restrict to (empty = every skill in the selected plugins). Matched by the skill directory name, e.g. msbuild-server. Works with or without `plugins`.'
        required: false
        type: string
        default: ''
      executors:
        description: 'Comma-separated executor keys (subset of: opus,gpt,sonnet46,haiku,mai,gpt53codex). Default is the 5-family published matrix; gpt53codex is opt-in.'
        required: false
        type: string
        default: 'opus,gpt,sonnet46,haiku,mai'
      runs:
        description: 'Trials per eval (n): positive integer, sets experiment overrides.runs. Use >=3 for statistically meaningful comparisons.'
        required: false
        type: string
        default: '3'
      workers:
        description: 'Parallel vally experiment workers per cell (positive integer). Only speeds the experiment phase; judging is serial per skill.'
        required: false
        type: string
        default: '5'
      shards:
        description: 'Split each plugin''s skills across this many parallel cells (positive integer). Use to keep large plugins under the job timeout at high n.'
        required: false
        type: string
        default: '1'
      timeout_minutes:
        description: 'Per-cell job timeout in minutes (positive integer, GitHub-hosted hard cap 360).'
        required: false
        type: string
        default: '300'

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Build the executor x plugin matrix, applying the judge != executor rule.
  # --------------------------------------------------------------------------
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.build.outputs.entries }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - id: build
        shell: bash
        env:
          IN_PLUGINS: ${{ inputs.plugins }}
          IN_SKILLS: ${{ inputs.skills }}
          IN_EXECUTORS: ${{ inputs.executors }}
          IN_SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          name_re='^[A-Za-z0-9._-]+$'

          # Derive the eval-spec filename (eval.vally.yaml or eval.yaml) from the
          # experiment's `evals:` glob so discovery and --eval-filter always match
          # exactly what `vally experiment run` enumerates. main globs
          # eval.vally.yaml; other branches (e.g. #877) may glob eval.yaml.
          EVAL_SPEC="$(grep -v '^[[:space:]]*#' dotnet-skills.experiment.yaml | grep -oE 'tests/[^[:space:]]*eval\.(vally\.)?yaml' | head -n1 | sed 's#.*/##' || true)"
          [ -z "$EVAL_SPEC" ] && EVAL_SPEC="eval.vally.yaml"
          echo "Eval spec: $EVAL_SPEC"

          # Resolve the executor list (validated against the fixed allowlist).
          declare -A EXEC_MODEL=(
            [opus]=claude-opus-4.8
            [gpt]=gpt-5.5
            [sonnet46]=claude-sonnet-4.6
            [haiku]=claude-haiku-4.5
            [mai]=mai-code-1-flash-picker
            [gpt53codex]=gpt-5.3-codex
          )
          # Judge rule: Opus executor -> gpt-5.5; everyone else -> claude-opus-4.8.
          judge_for() { if [ "$1" = "opus" ]; then echo "gpt-5.5"; else echo "claude-opus-4.8"; fi; }

          EXECS_RAW="${IN_EXECUTORS:-opus,gpt,sonnet46,haiku,mai}"
          EXECS=()
          IFS=',' read -ra _e <<< "$EXECS_RAW"
          for e in "${_e[@]}"; do
            e="$(echo "$e" | tr -d '[:space:]')"
            [ -z "$e" ] && continue
            if [ -z "${EXEC_MODEL[$e]:-}" ]; then
              echo "::error::Unknown executor '$e' (allowed: ${!EXEC_MODEL[*]})"; exit 1
            fi
            EXECS+=("$e")
          done
          [ ${#EXECS[@]} -eq 0 ] && { echo "::error::No valid executors"; exit 1; }

          # Resolve the plugin list: explicit input, else discover from tests/.
          PLUGINS=()
          if [ -n "${IN_PLUGINS:-}" ]; then
            IFS=',' read -ra _p <<< "$IN_PLUGINS"
            for p in "${_p[@]}"; do
              p="$(echo "$p" | tr -d '[:space:]')"
              [ -z "$p" ] && continue
              if ! [[ "$p" =~ $name_re ]] || [[ "$p" == "." ]] || [[ "$p" == *".."* ]]; then
                echo "::error::Invalid plugin '$p'"; exit 1
              fi
              if [ ! -d "tests/$p" ]; then echo "::error::No tests dir for plugin '$p'"; exit 1; fi
              PLUGINS+=("$p")
            done
          else
            # Every plugin under tests/ that has at least one non-agent eval spec.
            while IFS= read -r d; do
              p="$(basename "$d")"
              if find "tests/$p" -name "$EVAL_SPEC" -type f -not -path '*/agent.*/*' | grep -q .; then
                PLUGINS+=("$p")
              fi
            done < <(find tests -mindepth 1 -maxdepth 1 -type d | sort)
          fi
          [ ${#PLUGINS[@]} -eq 0 ] && { echo "::error::No plugins with evals found"; exit 1; }

          # Optional skill filter: restrict to specific skill(s) by their eval
          # directory name (e.g. msbuild-server). Empty = every skill. This works
          # with or without an explicit plugin list; unknown skills are rejected.
          declare -A WANT_SKILLS=()
          declare -A MATCHED_SKILLS=()
          if [ -n "${IN_SKILLS:-}" ]; then
            IFS=',' read -ra _s <<< "$IN_SKILLS"
            for s in "${_s[@]}"; do
              s="$(echo "$s" | tr -d '[:space:]')"
              [ -z "$s" ] && continue
              if ! [[ "$s" =~ $name_re ]] || [[ "$s" == "." ]] || [[ "$s" == *".."* ]]; then
                echo "::error::Invalid skill '$s'"; exit 1
              fi
              WANT_SKILLS["$s"]=1
            done
          fi

          # Number of skill-shards per plugin (1 = whole plugin in one cell).
          SHARDS="${IN_SHARDS:-1}"
          if ! [[ "$SHARDS" =~ ^[0-9]+$ ]] || [ "$SHARDS" -lt 1 ]; then
            echo "::error::invalid shards '$SHARDS'"; exit 1
          fi

          # Emit the executor x plugin (x shard) matrix as compact JSON.
          # Each entry carries eval_filters: a JSON array of --eval-filter globs.
          ENTRIES="["
          FIRST=1
          COUNT=0
          add_entry() {
            local e="$1" m="$2" j="$3" p="$4" nm="$5" filters="$6" obj
            obj=$(jq -cn \
              --arg executor "$e" --arg model "$m" --arg judge "$j" \
              --arg plugin "$p" --arg name "$nm" --arg skills_path "plugins/$p/skills" \
              --argjson eval_filters "$filters" \
              '{executor:$executor,model:$model,judge:$judge,plugin:$plugin,name:$name,skills_path:$skills_path,eval_filters:$eval_filters}')
            [ $FIRST -eq 0 ] && ENTRIES="$ENTRIES,"
            FIRST=0
            ENTRIES="$ENTRIES$obj"
            COUNT=$((COUNT + 1))
          }
          for e in "${EXECS[@]}"; do
            m="${EXEC_MODEL[$e]}"; j="$(judge_for "$e")"
            for p in "${PLUGINS[@]}"; do
              # Enumerate this plugin's non-agent evals (agent.* excluded, matching
              # the discovery filter) and round-robin them into SHARDS groups so each
              # cell judges whole skills at full n. SHARDS=1 => one cell, all evals.
              mapfile -t EVALS < <(find "tests/$p" -name "$EVAL_SPEC" -type f -not -path '*/agent.*/*' | sort)
              # Apply the optional skill filter (keep only requested skill dirs).
              if [ ${#WANT_SKILLS[@]} -gt 0 ] && [ ${#EVALS[@]} -gt 0 ]; then
                FILTERED=()
                for f in "${EVALS[@]}"; do
                  sk="$(basename "$(dirname "$f")")"
                  if [ -n "${WANT_SKILLS[$sk]:-}" ]; then
                    FILTERED+=("$f"); MATCHED_SKILLS["$sk"]=1
                  fi
                done
                EVALS=("${FILTERED[@]+"${FILTERED[@]}"}")
              fi
              if [ ${#EVALS[@]} -eq 0 ]; then continue; fi
              for ((k=0; k<SHARDS; k++)); do
                shard=()
                for ((i=k; i<${#EVALS[@]}; i+=SHARDS)); do shard+=("${EVALS[$i]}"); done
                [ ${#shard[@]} -eq 0 ] && continue
                if [ "$SHARDS" -eq 1 ]; then nm="$e--$p"; else nm="$e--$p-s$((k + 1))"; fi
                filters=$(printf '%s\n' "${shard[@]}" | jq -R . | jq -cs .)
                add_entry "$e" "$m" "$j" "$p" "$nm" "$filters"
              done
            done
          done
          ENTRIES="$ENTRIES]"
          # Fail fast on a mistyped skill name (requested but matched no eval).
          if [ ${#WANT_SKILLS[@]} -gt 0 ]; then
            MISSING=()
            for s in "${!WANT_SKILLS[@]}"; do
              [ -z "${MATCHED_SKILLS[$s]:-}" ] && MISSING+=("$s")
            done
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "::error::Requested skill(s) not found in the selected plugin(s): ${MISSING[*]}"; exit 1
            fi
          fi
          echo "Built $COUNT matrix cells (${#EXECS[@]} executors x ${#PLUGINS[@]} plugins x up to $SHARDS shard(s))"
          echo "entries=$ENTRIES" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Run one executor over one plugin, then adapt into per-skill verdicts.
  # --------------------------------------------------------------------------
  evaluate:
    needs: [prepare]
    if: ${{ needs.prepare.outputs.count != '0' }}
    runs-on: ubuntu-latest
    environment: copilot-pat-pool
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    continue-on-error: true
    name: ${{ matrix.entry.name }}
    strategy:
      fail-fast: false
      # Concurrent Copilot sessions = max-parallel * --workers. Tokens come from
      # the copilot-pat-pool (COPILOT_PAT_0..9); keep the product under the pool's
      # sustainable rate. The original full grid ran 6 * 5 = 30 across up to 10
      # tokens. A focused re-run of a few cells can safely raise `workers` since
      # far fewer cells contend for the pool.
      max-parallel: 6
      matrix:
        entry: ${{ fromJson(needs.prepare.outputs.entries) }}
    steps:
      - name: Validate matrix entry
        env:
          ENTRY_EXECUTOR: ${{ matrix.entry.executor }}
          ENTRY_MODEL: ${{ matrix.entry.model }}
          ENTRY_JUDGE: ${{ matrix.entry.judge }}
          ENTRY_PLUGIN: ${{ matrix.entry.plugin }}
          ENTRY_NAME: ${{ matrix.entry.name }}
        run: |
          set -euf -o pipefail
          export LC_ALL=C
          name_re='^[A-Za-z0-9._-]+$'
          # Fixed allowlists — models/judges must be exactly one of these.
          case "$ENTRY_EXECUTOR" in opus|gpt|sonnet46|haiku|mai|gpt53codex) ;; *) echo "::error::bad executor '$ENTRY_EXECUTOR'"; exit 1 ;; esac
          case "$ENTRY_MODEL" in claude-opus-4.8|gpt-5.5|claude-sonnet-4.6|claude-haiku-4.5|mai-code-1-flash-picker|gpt-5.3-codex) ;; *) echo "::error::bad model '$ENTRY_MODEL'"; exit 1 ;; esac
          case "$ENTRY_JUDGE" in claude-opus-4.8|gpt-5.5) ;; *) echo "::error::bad judge '$ENTRY_JUDGE'"; exit 1 ;; esac
          for val in "$ENTRY_PLUGIN" "$ENTRY_NAME"; do
            if ! [[ "$val" =~ $name_re ]] || [[ "$val" == "." ]] || [[ "$val" == *".."* ]]; then
              echo "::error::invalid matrix value '$val'"; exit 1
            fi
          done
          # Enforce the judge != executor family invariant.
          if [ "$ENTRY_EXECUTOR" = "opus" ] && [ "$ENTRY_JUDGE" != "gpt-5.5" ]; then echo "::error::Opus executor must not be Opus-judged"; exit 1; fi
          if [ "$ENTRY_EXECUTOR" != "opus" ] && [ "$ENTRY_JUDGE" = "$ENTRY_MODEL" ]; then echo "::error::judge equals executor model"; exit 1; fi

      - name: Checkout skills content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install vally
        run: npm install -g @microsoft/vally-cli

      - name: Select Copilot token from pool
        id: select-token
        env:
          COPILOT_PAT_0: ${{ secrets.COPILOT_PAT_0 }}
          COPILOT_PAT_1: ${{ secrets.COPILOT_PAT_1 }}
          COPILOT_PAT_2: ${{ secrets.COPILOT_PAT_2 }}
          COPILOT_PAT_3: ${{ secrets.COPILOT_PAT_3 }}
          COPILOT_PAT_4: ${{ secrets.COPILOT_PAT_4 }}
          COPILOT_PAT_5: ${{ secrets.COPILOT_PAT_5 }}
          COPILOT_PAT_6: ${{ secrets.COPILOT_PAT_6 }}
          COPILOT_PAT_7: ${{ secrets.COPILOT_PAT_7 }}
          COPILOT_PAT_8: ${{ secrets.COPILOT_PAT_8 }}
          COPILOT_PAT_9: ${{ secrets.COPILOT_PAT_9 }}
        run: |
          TOKENS=()
          for i in $(seq 0 9); do
            var="COPILOT_PAT_$i"; val="${!var}"
            if [ -n "$val" ]; then TOKENS+=("$val"); fi
          done
          if [ ${#TOKENS[@]} -eq 0 ]; then echo "::error::No copilot-pat-pool entries configured"; exit 1; fi
          IDX=$(( RANDOM % ${#TOKENS[@]} ))
          echo "::add-mask::${TOKENS[$IDX]}"
          echo "token=${TOKENS[$IDX]}" >> "$GITHUB_OUTPUT"

      - name: Check plugin has evals
        id: find-evals
        env:
          PLUGIN: ${{ matrix.entry.plugin }}
        run: |
          # Match the same eval-spec filename the experiment enumerates (see prepare).
          EVAL_SPEC="$(grep -v '^[[:space:]]*#' dotnet-skills.experiment.yaml | grep -oE 'tests/[^[:space:]]*eval\.(vally\.)?yaml' | head -n1 | sed 's#.*/##' || true)"
          [ -z "$EVAL_SPEC" ] && EVAL_SPEC="eval.vally.yaml"
          if find "tests/$PLUGIN" -name "$EVAL_SPEC" -type f -not -path '*/agent.*/*' | grep -q .; then
            echo "has_evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "No non-agent $EVAL_SPEC under tests/$PLUGIN"
            echo "has_evals=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run vally evaluation
        if: steps.find-evals.outputs.has_evals == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
          RESULTS_DIR: artifacts/TestResults/vally-crossfamily/${{ matrix.entry.name }}
          PLUGIN: ${{ matrix.entry.plugin }}
          MODEL: ${{ matrix.entry.model }}
          JUDGE: ${{ matrix.entry.judge }}
          RUNS: ${{ inputs.runs }}
          WORKERS: ${{ inputs.workers }}
          EVAL_FILTERS_JSON: ${{ toJSON(matrix.entry.eval_filters) }}
        run: |
          set -euf -o pipefail
          export LC_ALL=C
          # Point the experiment's executor model at this cell's model. The
          # experiment run only generates trajectories with `model:`; judging is
          # done later by adapt.mjs via --judge-model, so only `model:` is rewritten.
          # MODEL is allowlist-validated upstream, so this sed is injection-safe.
          sed -i "s/^  model:.*/  model: $MODEL/" dotnet-skills.experiment.yaml
          # Trials per eval (n). Validate as a positive integer so this sed is injection-safe.
          RUNS="${RUNS:-1}"
          if ! [[ "$RUNS" =~ ^[0-9]+$ ]] || [ "$RUNS" -lt 1 ]; then echo "::error::invalid runs '$RUNS'"; exit 1; fi
          sed -i "s/^  runs:.*/  runs: $RUNS/" dotnet-skills.experiment.yaml
          # Parallel experiment workers (positive int). Only the experiment phase
          # is parallelized; adapt.mjs judges serially per skill.
          WORKERS="${WORKERS:-5}"
          if ! [[ "$WORKERS" =~ ^[0-9]+$ ]] || [ "$WORKERS" -lt 1 ]; then echo "::error::invalid workers '$WORKERS'"; exit 1; fi
          # Build the --eval-filter args from this cell's eval_filters array.
          mapfile -t FILTERS < <(printf '%s' "$EVAL_FILTERS_JSON" | jq -r '.[]')
          if [ ${#FILTERS[@]} -eq 0 ]; then echo "::warning::no eval filters for $PLUGIN"; exit 0; fi
          FILTER_ARGS=()
          for f in "${FILTERS[@]}"; do FILTER_ARGS+=(--eval-filter "$f"); done
          echo "Executor model: $MODEL   Judge model: $JUDGE   Plugin: $PLUGIN   Runs (n): $RUNS   Workers: $WORKERS   Evals: ${#FILTERS[@]}"

          EXPERIMENT_OUT="$RESULTS_DIR/_experiment"
          mkdir -p "$EXPERIMENT_OUT"
          vally experiment run dotnet-skills.experiment.yaml \
            "${FILTER_ARGS[@]}" \
            --output-dir "$EXPERIMENT_OUT" \
            --workers "$WORKERS" \
            2>&1 || echo "::warning::vally experiment run reported failures for $PLUGIN ($MODEL)"

          RUN_DIR=$(find "$EXPERIMENT_OUT" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          if [ -z "$RUN_DIR" ]; then echo "::warning::No experiment output for $PLUGIN ($MODEL)"; exit 0; fi

          node eng/vally-adapter/adapt.mjs \
            --experiment-dir "$RUN_DIR" \
            --output-root "$RESULTS_DIR" \
            --vally "vally" \
            --model "$MODEL" \
            --judge-model "$JUDGE"

          PRODUCED=$(find "$RESULTS_DIR" -name results.json -not -path "$EXPERIMENT_OUT/*" | wc -l | tr -d ' ')
          echo "Produced $PRODUCED skill verdict(s) for $PLUGIN ($MODEL, judge $JUDGE)"

      - name: Upload results
        if: always() && steps.find-evals.outputs.has_evals == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vally-crossfamily-${{ matrix.entry.name }}
          path: artifacts/TestResults/vally-crossfamily/${{ matrix.entry.name }}/
          include-hidden-files: true
          retention-days: 14

  # --------------------------------------------------------------------------
  # Assemble a cross-family pass matrix from all cell artifacts.
  # --------------------------------------------------------------------------
  summary:
    needs: [evaluate]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Download all cell artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: crossfamily-artifacts
          pattern: vally-crossfamily-*

      - name: Build cross-family pass matrix
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const root = "crossfamily-artifacts";
            const rows = {};            // skill -> { executor -> passed }
            const execTotals = {};      // executor -> { pass, total }
            if (fs.existsSync(root)) {
              for (const cell of fs.readdirSync(root)) {
                // cell dir name: vally-crossfamily-<executor>--<plugin>
                const m = cell.match(/^vally-crossfamily-([^-]+)--(.+)$/);
                if (!m) continue;
                const executor = m[1];
                const stack = [path.join(root, cell)];
                while (stack.length) {
                  const d = stack.pop();
                  for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                    const fp = path.join(d, e.name);
                    if (e.isDirectory()) { stack.push(fp); continue; }
                    if (e.name !== "results.json") continue;
                    try {
                      const r = JSON.parse(fs.readFileSync(fp, "utf-8"));
                      const v = r.verdicts && r.verdicts[0];
                      if (!v) continue;
                      const skill = path.basename(path.dirname(fp));
                      rows[skill] = rows[skill] || {};
                      rows[skill][executor] = !!v.passed;
                      execTotals[executor] = execTotals[executor] || { pass: 0, total: 0 };
                      execTotals[executor].total++;
                      if (v.passed) execTotals[executor].pass++;
                    } catch {}
                  }
                }
              }
            }
            const execs = Object.keys(execTotals).sort();
            let out = "## Cross-family pass matrix\n\n";
            if (!execs.length) {
              out += "_No verdicts produced._\n";
            } else {
              out += "| Executor | Passed | Total | Rate |\n|---|---|---|---|\n";
              for (const e of execs) { const t = execTotals[e]; out += `| ${e} | ${t.pass} | ${t.total} | ${t.total ? (100*t.pass/t.total).toFixed(1) : "0"}% |\n`; }
              out += "\n<details><summary>Per-skill x executor</summary>\n\n";
              out += "| Skill | " + execs.join(" | ") + " |\n|---" + execs.map(() => "|---").join("") + "|\n";
              for (const skill of Object.keys(rows).sort()) {
                out += `| ${skill} | ` + execs.map(e => rows[skill][e] === undefined ? "·" : (rows[skill][e] ? "✅" : "❌")).join(" | ") + " |\n";
              }
              out += "\n</details>\n";
            }
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, out, { flag: "a" });
            fs.mkdirSync("crossfamily-summary", { recursive: true });
            fs.writeFileSync("crossfamily-summary/pass-matrix.json", JSON.stringify({ execTotals, rows }, null, 2));
          '

      - name: Upload combined summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vally-crossfamily-summary
          path: crossfamily-summary/
          retention-days: 14
