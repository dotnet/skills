# Shadow evaluation with vally — runs alongside skill-validator for comparison.
#
# This workflow reuses the gate and discover jobs from evaluation.yml via
# workflow_call, or can be triggered manually. Results are informational
# only — they never gate PRs.
#
# NOTE: This is a transitional workflow for the replat. It will be removed
# once vally fully replaces skill-validator.
name: vally-evaluation

on:
  # Triggered by the main evaluation workflow after discover completes
  workflow_call:
    inputs:
      entries:
        description: 'JSON array of matrix entries from discover job'
        required: true
        type: string
      head_sha:
        description: 'PR head SHA to checkout'
        required: false
        type: string
        default: ''
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to evaluate (e.g., dotnet-maui)'
        required: true
        type: string
      skill:
        description: 'Skill to evaluate (optional, evaluates whole plugin if empty)'
        required: false
        type: string

env:
  MODEL: claude-opus-4.6
  JUDGE_MODEL: claude-opus-4.6

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # For workflow_dispatch: build a single-entry matrix
  # --------------------------------------------------------------------------
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.build.outputs.entries }}
    steps:
      - id: build
        run: |
          PLUGIN="${{ inputs.plugin }}"
          SKILL="${{ inputs.skill }}"
          if [ -n "$SKILL" ]; then
            echo "entries=[{\"name\":\"${PLUGIN}--${SKILL}\",\"plugin\":\"${PLUGIN}\",\"skills_path\":\"plugins/${PLUGIN}/skills/${SKILL}\"}]" >> $GITHUB_OUTPUT
          else
            echo "entries=[{\"name\":\"${PLUGIN}\",\"plugin\":\"${PLUGIN}\",\"skills_path\":\"plugins/${PLUGIN}/skills\"}]" >> $GITHUB_OUTPUT
          fi

  # --------------------------------------------------------------------------
  # Run vally evaluation (shadow mode)
  # --------------------------------------------------------------------------
  vally-evaluate:
    needs: [prepare]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    name: vally (${{ matrix.entry.name }})
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(inputs.entries || needs.prepare.outputs.entries || '[]') }}

    steps:
      - name: Checkout skills content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || '' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install vally
        run: npm install -g @microsoft/vally-cli

      - name: Select Copilot token
        id: select-token
        env:
          TOKEN_1: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TOKEN_2: ${{ secrets.COPILOT_GITHUB_TOKEN_2 }}
        run: |
          TOKENS=()
          for i in 1 2; do
            var="TOKEN_$i"
            val="${!var}"
            if [ -n "$val" ]; then TOKENS+=("$val"); fi
          done
          if [ ${#TOKENS[@]} -eq 0 ]; then
            echo "::error::No COPILOT_GITHUB_TOKEN secrets are configured"
            exit 1
          fi
          IDX=$(( ${RANDOM} % ${#TOKENS[@]} ))
          echo "::add-mask::${TOKENS[$IDX]}"
          echo "token=${TOKENS[$IDX]}" >> $GITHUB_OUTPUT

      - name: Find eval specs
        id: find-evals
        env:
          DISPATCH_SKILL: ${{ inputs.skill }}
        run: |
          # For workflow_dispatch targeting a specific skill, only run that one
          # eval. Otherwise run every eval discovered under the plugin's tests
          # directory.
          if [ -n "$DISPATCH_SKILL" ]; then
            CANDIDATE="tests/${{ matrix.entry.plugin }}/${DISPATCH_SKILL}/eval.vally.yaml"
            if [ ! -f "$CANDIDATE" ]; then
              echo "::error::workflow_dispatch requested skill '${DISPATCH_SKILL}' in plugin '${{ matrix.entry.plugin }}' but no eval spec exists at '${CANDIDATE}'. Check the skill name (case-sensitive) and that the eval file is present."
              exit 1
            fi
            EVALS="$CANDIDATE"
          else
            EVALS=$(find tests/${{ matrix.entry.plugin }} -name "eval.vally.yaml" -type f | sort)
          fi
          if [ -z "$EVALS" ]; then
            echo "No eval.vally.yaml files found for ${{ matrix.entry.plugin }}"
            echo "has_evals=false" >> $GITHUB_OUTPUT
          else
            echo "has_evals=true" >> $GITHUB_OUTPUT
            echo "$EVALS" > /tmp/eval-specs.txt
            echo "Found $(wc -l < /tmp/eval-specs.txt) eval specs"
          fi

      - name: Run vally evaluations
        if: steps.find-evals.outputs.has_evals == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
          RESULTS_DIR: artifacts/TestResults/vally/${{ matrix.entry.name }}
        run: |
          PLUGIN="${{ matrix.entry.plugin }}"

          # Build the explicit eval set for this plugin. Each eval targets a
          # single skill named after the eval folder. Evals that do not map 1:1
          # to a skill (e.g. `agent.*` evals that exercise multi-skill
          # orchestrator agents and declare their own `environment.skills`) are
          # skipped — they are out of scope for the skill-vs-baseline pipeline.
          EVAL_ARGS=()
          while IFS= read -r EVAL_SPEC; do
            EVAL_NAME=$(basename "$(dirname "$EVAL_SPEC")")
            case "$EVAL_NAME" in
              agent.*)
                echo "::warning::Skipping $EVAL_NAME — agent eval (not supported by the skill-isolation pipeline)"
                continue
                ;;
            esac
            # The skilled variant loads plugins/<plugin>/skills/<skill>; vally
            # fails fast if that directory is missing.
            if [ ! -d "plugins/$PLUGIN/skills/$EVAL_NAME" ]; then
              echo "::warning::Skipping $EVAL_NAME — no skill dir at plugins/$PLUGIN/skills/$EVAL_NAME"
              continue
            fi
            EVAL_ARGS+=("$EVAL_SPEC")
          done < /tmp/eval-specs.txt

          if [ ${#EVAL_ARGS[@]} -eq 0 ]; then
            echo "::warning::No skill-backed evals to run for $PLUGIN"
            exit 0
          fi

          # Scope the canonical experiment to this plugin's evals and pin the
          # model/judge. The scoped file lives at the repo root because vally
          # resolves eval and skill paths relative to the experiment file's dir.
          SCOPED_EXPERIMENT=".vally-experiment-scoped.yaml"
          node eng/vally-adapter/scope-experiment.mjs \
            --base dotnet-skills.experiment.yaml \
            --out "$SCOPED_EXPERIMENT" \
            --model "${{ env.MODEL }}" \
            --judge-model "${{ env.JUDGE_MODEL }}" \
            --runs 1 \
            "${EVAL_ARGS[@]}"

          # Run baseline (no skills) + skilled (the one skill) in a single
          # experiment pass. The baseline is a true skill-free control because
          # vally 0.6.0 does no ambient skill discovery — skills load only from
          # environment.skills.
          EXPERIMENT_OUT="$RESULTS_DIR/_experiment"
          mkdir -p "$EXPERIMENT_OUT"
          vally experiment run "$SCOPED_EXPERIMENT" \
            --output-dir "$EXPERIMENT_OUT" \
            --workers 5 \
            2>&1 || echo "::warning::vally experiment run reported failures for $PLUGIN"
          rm -f "$SCOPED_EXPERIMENT"

          RUN_DIR=$(find "$EXPERIMENT_OUT" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          if [ -z "$RUN_DIR" ]; then
            echo "::warning::No experiment output produced for $PLUGIN"
            exit 0
          fi

          # Split the per-variant experiment output into the per-skill
          # results.json the shadow summary (and skill-validator) consume.
          node eng/vally-adapter/adapt.mjs \
            --experiment-dir "$RUN_DIR" \
            --output-root "$RESULTS_DIR" \
            --model "${{ env.MODEL }}" \
            --judge-model "${{ env.JUDGE_MODEL }}"

          # vally adapts whatever it produced, so surface any shortfall between
          # the verdicts written and the evals we asked for. This is the
          # informational shadow job, so a gap is an annotation, not a failure.
          PRODUCED=$(find "$RESULTS_DIR" -name results.json -not -path "$EXPERIMENT_OUT/*" | wc -l | tr -d ' ')
          EXPECTED=${#EVAL_ARGS[@]}
          echo "Produced $PRODUCED of $EXPECTED expected skill verdict(s) for $PLUGIN"
          if [ "$PRODUCED" -lt "$EXPECTED" ]; then
            echo "::warning::vally produced $PRODUCED of $EXPECTED expected skill verdicts for $PLUGIN — some evals failed to run or validate (see logs above)"
          fi

      - name: Upload results
        if: always() && steps.find-evals.outputs.has_evals == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vally-results-${{ matrix.entry.name }}
          path: artifacts/TestResults/vally/${{ matrix.entry.name }}/
          include-hidden-files: true
          retention-days: 14

      - name: Write summary
        if: always() && steps.find-evals.outputs.has_evals == 'true'
        run: |
          echo "## 🔬 Vally Shadow Results: ${{ matrix.entry.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="artifacts/TestResults/vally/${{ matrix.entry.name }}"
          while IFS= read -r RESULTS_JSON; do
            if [ ! -f "$RESULTS_JSON" ]; then continue; fi
            EVAL_NAME=$(basename $(dirname "$RESULTS_JSON"))

            # Extract verdict from JSON
            PASSED=$(node -e "const r=JSON.parse(require('fs').readFileSync('$RESULTS_JSON','utf-8')); console.log(r.verdicts[0].passed)")
            REASON=$(node -e "const r=JSON.parse(require('fs').readFileSync('$RESULTS_JSON','utf-8')); console.log(r.verdicts[0].reason)")
            ICON=$([ "$PASSED" = "true" ] && echo "✅" || echo "❌")

            echo "### $ICON $EVAL_NAME" >> $GITHUB_STEP_SUMMARY
            echo "$REASON" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Per-scenario table
            echo "| Scenario | Assertions | Improvement |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------------|-------------|" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = JSON.parse(require('fs').readFileSync('$RESULTS_JSON', 'utf-8'));
              for (const s of r.verdicts[0].scenarios) {
                const allPass = s.withSkill.metrics.assertionResults.every(a => a.passed);
                const icon = allPass ? '✔' : '✘';
                const pct = (s.improvementScore * 100).toFixed(1);
                console.log('| ' + icon + ' ' + s.scenarioName + ' | ' + s.withSkill.metrics.assertionResults.length + ' passed | ' + pct + '% |');
              }
            " >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done < <(find "$RESULTS_DIR" -name results.json | sort)
