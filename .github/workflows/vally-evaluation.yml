# Shadow evaluation with vally — runs alongside skill-validator for comparison.
#
# This workflow reuses the gate and discover jobs from evaluation.yml via
# workflow_call, or can be triggered manually. Results are informational
# only — they never gate PRs.
#
# NOTE: This is a transitional workflow for the replat. It will be removed
# once vally fully replaces skill-validator.
name: vally-evaluation

on:
  # Triggered by the main evaluation workflow after discover completes
  workflow_call:
    inputs:
      entries:
        description: 'JSON array of matrix entries from discover job'
        required: true
        type: string
      head_sha:
        description: 'PR head SHA to checkout'
        required: false
        type: string
        default: ''
      treatment_only:
        description: 'Run only the skilled variant without baseline or pairwise comparison'
        required: false
        type: boolean
        default: false
    secrets:
      # Passed by the caller via an explicit named mapping (see the vally-evaluate
      # job in evaluation.yml). A reusable workflow does not inherit the caller's
      # org/repo secrets, so the pool is forwarded explicitly — only these 10
      # tokens cross the boundary, never `secrets: inherit` (which would forward
      # every secret and reverse the blast-radius reduction from #868). Each name
      # must be enumerated (no wildcard exists), matching shared/pat_pool.md, and
      # the block is also what lets actionlint type the `secrets.COPILOT_PAT_*`
      # references. The `environment: copilot-pat-pool` on the job below can still
      # override individual entries via environment secrets if ever configured.
      # Names with no backing secret resolve empty and are skipped by the selector.
      COPILOT_PAT_0: { required: false }
      COPILOT_PAT_1: { required: false }
      COPILOT_PAT_2: { required: false }
      COPILOT_PAT_3: { required: false }
      COPILOT_PAT_4: { required: false }
      COPILOT_PAT_5: { required: false }
      COPILOT_PAT_6: { required: false }
      COPILOT_PAT_7: { required: false }
      COPILOT_PAT_8: { required: false }
      COPILOT_PAT_9: { required: false }
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to evaluate (e.g., dotnet-maui)'
        required: true
        type: string
      skill:
        description: 'Skill to evaluate (optional, evaluates whole plugin if empty)'
        required: false
        type: string
      executors:
        description: 'Comma-separated smoke executor families'
        required: false
        type: string
        default: 'opus,haiku,mai'
      runs:
        description: 'Trial count per eval'
        required: false
        type: string
        default: '1'
      baseline_skill_ref:
        description: 'Pinned commit containing the baseline version of the dispatched skill'
        required: false
        type: string
        default: ''
      treatment_only:
        description: 'Run only the skilled variant without baseline or pairwise comparison'
        required: false
        type: boolean
        default: true
      stimuli:
        description: 'Comma-separated exact smoke stimulus names'
        required: false
        type: string
        default: 'Catches LINQ on hot-path string processing and All(char.IsUpper),Detects compiled regex startup budget and regex chain allocations,Finds branched Replace chain in format string manipulation,Identifies unsealed leaf classes and locale hierarchy patterns'

env:
  # Fallback model/judge used only if the experiment file's `overrides:` block
  # can't be parsed. The experiment file is the source of truth (see below).
  FALLBACK_MODEL: claude-opus-4.6
  FALLBACK_JUDGE_MODEL: claude-opus-4.6
  BASELINE_SKILL_SOURCE_REF: 'ab72985132b79adcc4818d1fc5c41d9543f12498'
  TREATMENT_SKILL_SOURCE_REF: '7731dd09aac22104f3bdf6deec10c3a919641ff6'
  EVAL_SOURCE_REF: '0b7ae60bec7c7fa37b98ae6c3fb4f286d70f426a'
  BASELINE_SKILL_SHA256: '9980c08c82a1f0a961892472ea773d6b5342b080e46d92e9db3c109814e1afad'
  TREATMENT_SKILL_SHA256: 'a106af372a57beac0463da3d17d71a64d6e6adb97cdbb3c155c99dee7d29a4e5'
  CANONICAL_EVAL_SHA256: 'fd2a1083b80df9c7feb289f4bafafdcd3c964ea0349d4faf80f731ded6181da2'
  VALLY_EVAL_SHA256: '6477a9909ab6b7098077798a7c2f714bc99310b49a71b6b544710a19f47f02dc'

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # For workflow_dispatch: build a single-entry matrix
  # --------------------------------------------------------------------------
  prepare:
    # Only build the single-entry matrix for a *direct* manual dispatch. The
    # workflow_dispatch event name propagates into workflow_call, so guarding on
    # the event alone would (wrongly) run this during the reusable call, where
    # the plugin/skill dispatch inputs are empty and validation throws. When the
    # caller supplies `entries`, skip prepare entirely.
    if: github.event_name == 'workflow_dispatch' && !inputs.entries
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.build.outputs.entries }}
    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - id: build
        shell: bash
        env:
          PLUGIN: ${{ inputs.plugin }}
          SKILL: ${{ inputs.skill }}
          EXECUTORS: ${{ inputs.executors }}
          STIMULI: ${{ inputs.stimuli }}
        run: |
          entries="$(node eng/vally-adapter/build-smoke-matrix.mjs \
            --plugin "$PLUGIN" \
            --skill "$SKILL" \
            --executors "$EXECUTORS" \
            --stimuli "$STIMULI")"
          echo "entries=$entries" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Run vally evaluation (shadow mode)
  # --------------------------------------------------------------------------
  vally-evaluate:
    needs: [prepare]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment: copilot-pat-pool
    timeout-minutes: 45
    continue-on-error: true
    name: vally (${{ matrix.entry.name }})
    strategy:
      fail-fast: false
      # Cap concurrent Copilot sessions: max-parallel jobs * --workers per job.
      # Tokens come from the copilot-pat-pool (COPILOT_PAT_0..9), but keep this
      # well below skill-validator's fan-out to stay under rate limits.
      max-parallel: 4
      matrix:
        entry: ${{ fromJson(inputs.entries || needs.prepare.outputs.entries || '[]') }}

    steps:
      - name: Validate matrix entry
        # Validate matrix values against a strict allowlist before use.
        env:
          ENTRY_PLUGIN: ${{ matrix.entry.plugin }}
          ENTRY_NAME: ${{ matrix.entry.name }}
          ENTRY_SKILLS_PATH: ${{ matrix.entry.skills_path }}
          ENTRY_EXECUTOR: ${{ matrix.entry.executor }}
          ENTRY_MODEL: ${{ matrix.entry.model }}
          ENTRY_JUDGE: ${{ matrix.entry.judge }}
          ENTRY_SCENARIO_ID: ${{ matrix.entry.scenario_id }}
          ENTRY_STIMULUS: ${{ matrix.entry.stimulus }}
          BASELINE_SKILL_REF: ${{ inputs.baseline_skill_ref }}
          TREATMENT_ONLY: ${{ inputs.treatment_only }}
        run: |
          set -f
          # LC_ALL=C avoids locale-dependent collation quirks in [A-Za-z] ranges.
          # bash's [[ =~ ]] (POSIX ERE, no REG_NEWLINE) anchors ^/$ to the true
          # start/end of the string, unlike .NET's $ which matches before a
          # trailing newline — so ^...$ is sufficient here without \A/\z.
          export LC_ALL=C
          name_re='^[A-Za-z0-9._-]+$'
          path_re='^plugins/[A-Za-z0-9._-]+/skills(/[A-Za-z0-9._-]+)?$'
          # A lone-dot component ('.') matches the charset and holds no '..', but
          # it is a path-normalization token, so reject it for names and for any
          # path component ('.../skills/.' or 'plugins/./skills').
          for val in "$ENTRY_PLUGIN" "$ENTRY_NAME"; do
            if ! [[ "$val" =~ $name_re ]] || [[ "$val" == "." ]] || [[ "$val" == *".."* ]]; then
              echo "::error::Invalid matrix value '$val' (must match $name_re, not be '.', and not contain '..')"; exit 1
            fi
          done
          if [ -n "$ENTRY_EXECUTOR" ]; then
            case "$ENTRY_EXECUTOR" in opus|haiku|mai) ;; *) echo "::error::Invalid executor '$ENTRY_EXECUTOR'"; exit 1 ;; esac
            case "$ENTRY_MODEL" in claude-opus-4.8|claude-haiku-4.5|mai-code-1-flash-picker) ;; *) echo "::error::Invalid executor model '$ENTRY_MODEL'"; exit 1 ;; esac
            case "$ENTRY_JUDGE" in claude-opus-4.8|gpt-5.5) ;; *) echo "::error::Invalid judge model '$ENTRY_JUDGE'"; exit 1 ;; esac
            if [ "$ENTRY_EXECUTOR" = "opus" ] && [ "$ENTRY_JUDGE" != "gpt-5.5" ]; then
              echo "::error::Opus executor must use the GPT judge"; exit 1
            fi
            if [ "$ENTRY_EXECUTOR" != "opus" ] && [ "$ENTRY_JUDGE" != "claude-opus-4.8" ]; then
              echo "::error::Non-Opus executors must use the Opus judge"; exit 1
            fi
            case "$ENTRY_SCENARIO_ID:$ENTRY_STIMULUS" in
              "linq-hot-path:Catches LINQ on hot-path string processing and All(char.IsUpper)"|\
              "compiled-regex:Detects compiled regex startup budget and regex chain allocations"|\
              "replace-chain:Finds branched Replace chain in format string manipulation"|\
              "unsealed-leaves:Identifies unsealed leaf classes and locale hierarchy patterns") ;;
              *) echo "::error::Invalid scenario mapping '$ENTRY_SCENARIO_ID:$ENTRY_STIMULUS'"; exit 1 ;;
            esac
          elif [ -n "$ENTRY_MODEL" ] || [ -n "$ENTRY_JUDGE" ]; then
            echo "::error::Model and judge overrides require an executor family"; exit 1
          fi
          if [ "$TREATMENT_ONLY" = "true" ] && [ -n "$BASELINE_SKILL_REF" ]; then
            echo "::error::treatment-only dispatch must not provide baseline_skill_ref"; exit 1
          fi
          if [ -n "$BASELINE_SKILL_REF" ] && ! [[ "$BASELINE_SKILL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::baseline_skill_ref must be a full lowercase commit SHA"; exit 1
          fi
          if [ "$TREATMENT_ONLY" != "true" ] && [ "$BASELINE_SKILL_REF" != "$BASELINE_SKILL_SOURCE_REF" ]; then
            echo "::error::baseline_skill_ref must equal the frozen smoke baseline"; exit 1
          fi
          # Collect path segments via word-splitting (set -f prevents globbing).
          # A whitespace-only value word-splits to zero segments and must
          # hard-fail exactly like a truly empty one — a bare `-z` test would let
          # e.g. a single space slip past and then skip the per-segment loop,
          # leaving an effectively-empty skills_path to reach CLI-arg building.
          segs=()
          for seg in $ENTRY_SKILLS_PATH; do segs+=("$seg"); done
          if [ ${#segs[@]} -eq 0 ]; then
            echo "::error::Empty or whitespace-only skills_path in matrix entry"; exit 1
          fi
          # Each segment must additionally belong to THIS entry's plugin: the
          # generic path_re only checks the shape, so bind the prefix to
          # ENTRY_PLUGIN via literal comparison (ENTRY_PLUGIN is already
          # allowlist-validated above). This blocks a mismatched entry like
          # plugin=foo + skills_path=plugins/bar/skills, which the eval-filter
          # builder would otherwise turn into nonsense paths under tests/foo.
          skills_prefix="plugins/$ENTRY_PLUGIN/skills"
          for seg in "${segs[@]}"; do
            if ! [[ "$seg" =~ $path_re ]] || [[ "$seg" == *".."* ]]; then
              echo "::error::Invalid skills_path segment '$seg' (must match $path_re and not contain '..')"; exit 1
            fi
            # Reject a lone-dot path component ('plugins/./skills' or '.../skills/.').
            if [[ "$seg" == *"/./"* || "$seg" == */. ]]; then
              echo "::error::skills_path segment '$seg' contains a '.' path component"; exit 1
            fi
            if [[ "$seg" != "$skills_prefix" && "$seg" != "$skills_prefix"/* ]]; then
              echo "::error::skills_path segment '$seg' does not belong to plugin '$ENTRY_PLUGIN'"; exit 1
            fi
          done

      - name: Checkout skills content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || '' }}
          persist-credentials: false

      - name: Checkout baseline skill content
        if: inputs.baseline_skill_ref != '' && !inputs.treatment_only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.baseline_skill_ref }}
          path: .vally-baseline
          persist-credentials: false

      - name: Checkout frozen evaluator content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.EVAL_SOURCE_REF }}
          path: .vally-evaluator
          persist-credentials: false

      - name: Stage frozen evaluator bytes
        env:
          DISPATCH_SKILL: ${{ inputs.skill }}
          PLUGIN: ${{ matrix.entry.plugin }}
        run: |
          evaluator_dir="tests/$PLUGIN/$DISPATCH_SKILL"
          frozen_dir=".vally-evaluator/$evaluator_dir"
          mkdir -p "$evaluator_dir"
          cp "$frozen_dir/eval.yaml" "$evaluator_dir/eval.yaml"
          cp "$frozen_dir/eval.vally.yaml" "$evaluator_dir/eval.vally.yaml"
          echo "$CANONICAL_EVAL_SHA256  $evaluator_dir/eval.yaml" | sha256sum -c -
          echo "$VALLY_EVAL_SHA256  $evaluator_dir/eval.vally.yaml" | sha256sum -c -

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install vally
        run: npm install -g @microsoft/vally-cli

      - name: Select Copilot token from pool
        id: select-token
        env:
          COPILOT_PAT_0: ${{ secrets.COPILOT_PAT_0 }}
          COPILOT_PAT_1: ${{ secrets.COPILOT_PAT_1 }}
          COPILOT_PAT_2: ${{ secrets.COPILOT_PAT_2 }}
          COPILOT_PAT_3: ${{ secrets.COPILOT_PAT_3 }}
          COPILOT_PAT_4: ${{ secrets.COPILOT_PAT_4 }}
          COPILOT_PAT_5: ${{ secrets.COPILOT_PAT_5 }}
          COPILOT_PAT_6: ${{ secrets.COPILOT_PAT_6 }}
          COPILOT_PAT_7: ${{ secrets.COPILOT_PAT_7 }}
          COPILOT_PAT_8: ${{ secrets.COPILOT_PAT_8 }}
          COPILOT_PAT_9: ${{ secrets.COPILOT_PAT_9 }}
        run: |
          # Select from the copilot-pat-pool secrets (COPILOT_PAT_0..9). There is
          # no fallback secret to plumb through and track usage of — an empty
          # pool is a hard configuration failure.
          TOKENS=()
          for i in $(seq 0 9); do
            var="COPILOT_PAT_$i"
            val="${!var}"
            if [ -n "$val" ]; then TOKENS+=("$val"); fi
          done
          if [ ${#TOKENS[@]} -eq 0 ]; then
            echo "::error::No copilot-pat-pool entries (COPILOT_PAT_0..9) are configured"
            exit 1
          fi
          IDX=$(( ${RANDOM} % ${#TOKENS[@]} ))
          echo "::add-mask::${TOKENS[$IDX]}"
          echo "token=${TOKENS[$IDX]}" >> $GITHUB_OUTPUT

      - name: Find eval specs
        id: find-evals
        env:
          DISPATCH_SKILL: ${{ inputs.skill }}
          PLUGIN: ${{ matrix.entry.plugin }}
          SKILLS_PATH: ${{ matrix.entry.skills_path }}
        run: |
          set -f
          # For workflow_dispatch targeting a specific skill, only run that one
          # eval. Otherwise derive the specs from this entry's skills_path so a
          # subset leg (per-skill PR entry or shard) reports has_evals accurately
          # instead of proceeding through token selection/install only to exit
          # empty. A whole-plugin entry (skills_path is exactly
          # plugins/<plugin>/skills) keeps the recursive find. Matrix values
          # arrive via env (validated upstream), and set -f keeps the
          # skills_path word-split glob-safe.
          if [ -n "$DISPATCH_SKILL" ]; then
            CANDIDATE="tests/$PLUGIN/${DISPATCH_SKILL}/eval.vally.yaml"
            if [ ! -f "$CANDIDATE" ]; then
              echo "::error::workflow_dispatch requested skill '${DISPATCH_SKILL}' in plugin '${PLUGIN}' but no eval spec exists at '${CANDIDATE}'. Check the skill name (case-sensitive) and that the eval file is present."
              exit 1
            fi
            EVALS="$CANDIDATE"
          else
            EVALS=""
            for token in $SKILLS_PATH; do
              rel="${token#plugins/}"       # <plugin>/skills[/<skill>]
              tp="${rel%%/skills*}"         # <plugin>
              skill="${rel#*/skills}"       # "" or "/<skill>"
              skill="${skill#/}"            # "" or "<skill>"
              if [ -n "$skill" ]; then
                # Sharded/PR entry: only this skill's spec, if one exists.
                # agent.* skills are excluded from the vally experiment.
                case "$skill" in
                  agent.*) continue ;;
                esac
                CANDIDATE="tests/$tp/$skill/eval.vally.yaml"
                [ -f "$CANDIDATE" ] && EVALS="${EVALS}${CANDIDATE}"$'\n'
              else
                # Whole-plugin entry: every eval spec under the plugin, except
                # agent.* skills, which the vally experiment glob excludes (so
                # counting them would report has_evals=true for zero effective
                # evals).
                FOUND=$(find "tests/$tp" -name "eval.vally.yaml" -type f -not -path "*/agent.*/*")
                [ -n "$FOUND" ] && EVALS="${EVALS}${FOUND}"$'\n'
              fi
            done
            EVALS=$(printf '%s' "$EVALS" | sed '/^$/d' | sort -u)
          fi
          if [ -z "$EVALS" ]; then
            echo "No eval.vally.yaml files found for ${PLUGIN}"
            echo "has_evals=false" >> $GITHUB_OUTPUT
          else
            echo "has_evals=true" >> $GITHUB_OUTPUT
            echo "Found $(printf '%s\n' "$EVALS" | wc -l | tr -d ' ') eval specs"
          fi

      - name: Run vally evaluations
        if: steps.find-evals.outputs.has_evals == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
          RESULTS_DIR: artifacts/TestResults/vally/${{ matrix.entry.name }}
          PLUGIN: ${{ matrix.entry.plugin }}
          SKILLS_PATH: ${{ matrix.entry.skills_path }}
          DISPATCH_SKILL: ${{ inputs.skill }}
          ENTRY_MODEL: ${{ matrix.entry.model }}
          ENTRY_JUDGE: ${{ matrix.entry.judge }}
          ENTRY_EXECUTOR: ${{ matrix.entry.executor }}
          ENTRY_SCENARIO_ID: ${{ matrix.entry.scenario_id }}
          DISPATCH_RUNS: ${{ inputs.runs }}
          BASELINE_SKILL_REF: ${{ inputs.baseline_skill_ref }}
          TARGET_STIMULI: ${{ matrix.entry.stimulus }}
          TREATMENT_ONLY: ${{ inputs.treatment_only }}
        run: |
          set -f
          # PLUGIN/SKILLS_PATH/DISPATCH_SKILL arrive via env (validated upstream)
          # rather than inline GitHub-expression interpolation, to avoid
          # injection; set -f keeps the SKILLS_PATH word-split glob-safe.
          #
          # Scope the canonical experiment with --eval-filter (repeatable),
          # which intersects each pattern with the experiment's `evals:` glob.
          # `agent.*` evals are excluded by that glob, so they drop out
          # automatically; a missing plugins/<plugin>/skills/<skill> dir surfaces
          # as a skilled-variant failure that adapt.mjs warns on.
          #
          # Honor the matrix entry's skills_path so per-skill PR entries and
          # sharded entries run only their targeted skills, not the whole plugin:
          #   plugins/<plugin>/skills            -> tests/<plugin>/**   (whole plugin)
          #   plugins/<plugin>/skills/<skill>    -> tests/<plugin>/<skill>
          # A workflow_dispatch skill input overrides to that single skill.
          FILTER_ARGS=()
          if [ -n "$DISPATCH_SKILL" ]; then
            FILTER_ARGS=(--eval-filter "tests/$PLUGIN/$DISPATCH_SKILL/eval.vally.yaml")
          else
            for token in $SKILLS_PATH; do
              rel="${token#plugins/}"       # <plugin>/skills[/<skill>]
              tp="${rel%%/skills*}"         # <plugin>
              skill="${rel#*/skills}"       # "" or "/<skill>"
              skill="${skill#/}"            # "" or "<skill>"
              if [ -n "$skill" ]; then
                # agent.* evals are excluded from the experiment's `evals:` glob,
                # and a skill without an eval.vally.yaml has nothing to run — skip
                # both so we never pass a filter that matches zero evals.
                if [[ "$skill" == agent.* ]]; then
                  echo "Skipping $tp/$skill (agent.* evals are excluded from the vally experiment)"
                  continue
                fi
                candidate="tests/$tp/$skill/eval.vally.yaml"
                if [ ! -f "$candidate" ]; then
                  echo "Skipping $tp/$skill (no eval.vally.yaml)"
                  continue
                fi
                FILTER_ARGS+=(--eval-filter "$candidate")
              else
                FILTER_ARGS+=(--eval-filter "tests/$tp/**/eval.vally.yaml")
              fi
            done
          fi
          if [ ${#FILTER_ARGS[@]} -eq 0 ]; then
            # Every targeted skill was skipped above (agent.* or eval-less), so
            # there is nothing to evaluate for this entry.
            echo "No matching vally eval filters for $PLUGIN"
            exit 0
          fi

          # Manual experiment-time selector. Keep the source PR eval untouched in
          # git, extract whole stimulus blocks byte-for-byte, then replace only the
          # runner workspace copy consumed by vally.
          if [ -n "$TARGET_STIMULI" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "::error::The stimulus selector is manual-dispatch only"; exit 1
            fi
            if [ -z "$DISPATCH_SKILL" ]; then
              echo "::error::The stimulus selector requires a single dispatched skill"; exit 1
            fi
            IFS=',' read -ra REQUESTED_STIMULI <<< "$TARGET_STIMULI"
            for stimulus in "${REQUESTED_STIMULI[@]}"; do
              stimulus="${stimulus#"${stimulus%%[![:space:]]*}"}"
              stimulus="${stimulus%"${stimulus##*[![:space:]]}"}"
              case "$stimulus" in
                "Catches LINQ on hot-path string processing and All(char.IsUpper)"|\
                "Detects compiled regex startup budget and regex chain allocations"|\
                "Finds branched Replace chain in format string manipulation"|\
                "Identifies unsealed leaf classes and locale hierarchy patterns") ;;
                *) echo "::error::Stimulus is not in the targeted gate allowlist: '$stimulus'"; exit 1 ;;
              esac
            done
            EVAL_PATH="tests/$PLUGIN/$DISPATCH_SKILL/eval.vally.yaml"
            SELECTED_EVAL="$RUNNER_TEMP/$PLUGIN--$DISPATCH_SKILL--selected.eval.vally.yaml"
            mkdir -p "$RESULTS_DIR"
            node eng/vally-adapter/select-stimuli.mjs \
              --source "$EVAL_PATH" \
              --output "$SELECTED_EVAL" \
              --names "$TARGET_STIMULI" \
              --metadata "$RESULTS_DIR/selected-eval.json"
            SOURCE_VALLY_EVAL_SHA256="$(sha256sum "$EVAL_PATH" | awk '{print $1}')"
            SELECTED_EVAL_SHA256="$(sha256sum "$SELECTED_EVAL" | awk '{print $1}')"
            SELECTED_STIMULI_JSON="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(JSON.stringify(m.selectedStimuli))" "$RESULTS_DIR/selected-eval.json")"
            cp "$SELECTED_EVAL" "$EVAL_PATH"
            export SOURCE_VALLY_EVAL_SHA256 SELECTED_EVAL_SHA256 SELECTED_STIMULI_JSON
          else
            SOURCE_VALLY_EVAL_SHA256=""
            SELECTED_EVAL_SHA256=""
            SELECTED_STIMULI_JSON="[]"
            export SOURCE_VALLY_EVAL_SHA256 SELECTED_EVAL_SHA256 SELECTED_STIMULI_JSON
          fi

          # Reusable shadow runs use the experiment file's overrides as the source
          # of truth. Manual cross-family runs replace only the executor model and
          # trial count; their comparison judge comes from the validated matrix.
          if [ -n "$ENTRY_MODEL" ]; then
            sed -i.bak "s/^  model:.*/  model: $ENTRY_MODEL/" dotnet-skills.experiment.yaml
            rm dotnet-skills.experiment.yaml.bak
          fi
          if [ -n "$DISPATCH_RUNS" ]; then
            if ! [[ "$DISPATCH_RUNS" =~ ^[0-9]+$ ]] || [ "$DISPATCH_RUNS" -lt 1 ]; then
              echo "::error::Invalid trial count '$DISPATCH_RUNS'"; exit 1
            fi
            sed -i.bak "s/^  runs:.*/  runs: $DISPATCH_RUNS/" dotnet-skills.experiment.yaml
            rm dotnet-skills.experiment.yaml.bak
          fi
          read_override() {
            awk -v k="$1" '
              /^overrides:/ { f = 1; next }
              /^[^[:space:]]/ { f = 0 }
              f && $1 == k":" { print $2; exit }
            ' dotnet-skills.experiment.yaml
          }
          MODEL="$(read_override model)"; MODEL="${MODEL:-${{ env.FALLBACK_MODEL }}}"
          JUDGE_MODEL="${ENTRY_JUDGE:-$(read_override judge_model)}"; JUDGE_MODEL="${JUDGE_MODEL:-${{ env.FALLBACK_JUDGE_MODEL }}}"
          echo "Executor model: $MODEL   Judge model: $JUDGE_MODEL   Runs: ${DISPATCH_RUNS:-experiment default}"

          EXPERIMENT_FILE=dotnet-skills.experiment.yaml
          if [ "$TREATMENT_ONLY" = "true" ]; then
            if [ -z "$DISPATCH_SKILL" ]; then
              echo "::error::treatment-only dispatch requires a single skill"; exit 1
            fi
            TREATMENT_SKILL_PATH="plugins/$PLUGIN/skills/$DISPATCH_SKILL"
            if [ ! -f "$TREATMENT_SKILL_PATH/SKILL.md" ]; then
              echo "::error::Missing treatment skill at '$TREATMENT_SKILL_PATH/SKILL.md'"; exit 1
            fi
            export TREATMENT_SKILL_PATH RESULTS_DIR ENTRY_EXECUTOR ENTRY_MODEL ENTRY_JUDGE ENTRY_SCENARIO_ID DISPATCH_RUNS
            node -e "
              const fs = require('fs');
              const crypto = require('crypto');
              const hash = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
              fs.mkdirSync(process.env.RESULTS_DIR, { recursive: true });
              const manifest = {
                mode: 'treatment-only',
                treatmentIntegrationRef: process.env.GITHUB_SHA,
                treatmentSkillSourceRef: process.env.TREATMENT_SKILL_SOURCE_REF,
                evalSourceRef: process.env.EVAL_SOURCE_REF,
                evaluatorCanonicalSourcePath: '.vally-evaluator/tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.yaml',
                evaluatorVallySourcePath: '.vally-evaluator/tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.vally.yaml',
                resolvedCanonicalEvalPath: 'tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.yaml',
                resolvedVallyEvalPath: 'tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.vally.yaml',
                executorFamily: process.env.ENTRY_EXECUTOR,
                executorModel: process.env.ENTRY_MODEL,
                judgeModel: process.env.ENTRY_JUDGE,
                scenarioId: process.env.ENTRY_SCENARIO_ID,
                stimulusName: JSON.parse(process.env.SELECTED_STIMULI_JSON || '[]')[0] || null,
                runsPerVariant: Number(process.env.DISPATCH_RUNS),
                variants: ['skilled'],
                expectedItems: Array.from(
                  { length: Number(process.env.DISPATCH_RUNS) },
                  (_, trial) => ({ trial: trial + 1, variant: 'skilled' }),
                ),
                treatmentSkillPath: process.env.TREATMENT_SKILL_PATH,
                treatmentSkillSha256: hash(process.env.TREATMENT_SKILL_PATH + '/SKILL.md'),
                canonicalEvalSha256: hash('tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.yaml'),
                vallyEvalSha256: process.env.SOURCE_VALLY_EVAL_SHA256 || hash('tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.vally.yaml'),
                selectedStimuli: JSON.parse(process.env.SELECTED_STIMULI_JSON || '[]'),
                selectedEvalSha256: process.env.SELECTED_EVAL_SHA256 || null
              };
              const expected = {
                treatmentSkillSha256: process.env.TREATMENT_SKILL_SHA256,
                canonicalEvalSha256: process.env.CANONICAL_EVAL_SHA256,
                vallyEvalSha256: process.env.VALLY_EVAL_SHA256,
              };
              for (const [key, value] of Object.entries(expected)) {
                if (manifest[key] !== value) throw new Error(key + ' mismatch: ' + manifest[key] + ' != ' + value);
              }
              fs.writeFileSync(process.env.RESULTS_DIR + '/treatment-inputs.json', JSON.stringify(manifest, null, 2) + '\n');
            "
          elif [ -n "$BASELINE_SKILL_REF" ]; then
            if [ -z "$DISPATCH_SKILL" ]; then
              echo "::error::baseline_skill_ref requires a single dispatched skill"; exit 1
            fi
            BASELINE_SKILL_PATH=".vally-baseline/plugins/$PLUGIN/skills/$DISPATCH_SKILL"
            TREATMENT_SKILL_PATH="plugins/$PLUGIN/skills/$DISPATCH_SKILL"
            for skill_path in "$BASELINE_SKILL_PATH" "$TREATMENT_SKILL_PATH"; do
              if [ ! -f "$skill_path/SKILL.md" ]; then
                echo "::error::Missing comparison skill at '$skill_path/SKILL.md'"; exit 1
              fi
            done
            cat > dotnet-skills-old-new.experiment.yaml <<EOF
          name: dotnet-skills-old-new
          evals:
            - tests/*/!(agent.*)/eval.vally.yaml
          overrides:
            model: $MODEL
            judge_model: $JUDGE_MODEL
            runs: ${DISPATCH_RUNS:-1}
          vary:
            - /environment/skills
          baseline: baseline
          variants:
            baseline:
              environment:
                skills:
                  - $BASELINE_SKILL_PATH
            skilled:
              environment:
                skills:
                  - $TREATMENT_SKILL_PATH
          EOF
            EXPERIMENT_FILE=dotnet-skills-old-new.experiment.yaml

            export BASELINE_SKILL_PATH TREATMENT_SKILL_PATH RESULTS_DIR ENTRY_EXECUTOR ENTRY_MODEL ENTRY_JUDGE ENTRY_SCENARIO_ID DISPATCH_RUNS
            node -e "
              const fs = require('fs');
              const crypto = require('crypto');
              const hash = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
              fs.mkdirSync(process.env.RESULTS_DIR, { recursive: true });
              const manifest = {
                baselineRef: process.env.BASELINE_SKILL_REF,
                treatmentIntegrationRef: process.env.GITHUB_SHA,
                treatmentSkillSourceRef: process.env.TREATMENT_SKILL_SOURCE_REF,
                evalSourceRef: process.env.EVAL_SOURCE_REF,
                evaluatorCanonicalSourcePath: '.vally-evaluator/tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.yaml',
                evaluatorVallySourcePath: '.vally-evaluator/tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.vally.yaml',
                resolvedCanonicalEvalPath: 'tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.yaml',
                resolvedVallyEvalPath: 'tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.vally.yaml',
                executorFamily: process.env.ENTRY_EXECUTOR,
                executorModel: process.env.ENTRY_MODEL,
                judgeModel: process.env.ENTRY_JUDGE,
                scenarioId: process.env.ENTRY_SCENARIO_ID,
                runsPerVariant: Number(process.env.DISPATCH_RUNS),
                variants: ['baseline', 'skilled'],
                expectedItems: Array.from(
                  { length: Number(process.env.DISPATCH_RUNS) },
                  (_, trial) => ['baseline', 'skilled'].map((variant) => ({ trial: trial + 1, variant })),
                ).flat(),
                baselineSkillPath: process.env.BASELINE_SKILL_PATH,
                treatmentSkillPath: process.env.TREATMENT_SKILL_PATH,
                baselineSkillSha256: hash(process.env.BASELINE_SKILL_PATH + '/SKILL.md'),
                treatmentSkillSha256: hash(process.env.TREATMENT_SKILL_PATH + '/SKILL.md'),
                canonicalEvalSha256: hash('tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.yaml'),
                vallyEvalSha256: process.env.SOURCE_VALLY_EVAL_SHA256 || hash('tests/' + process.env.PLUGIN + '/' + process.env.DISPATCH_SKILL + '/eval.vally.yaml'),
                selectedStimuli: JSON.parse(process.env.SELECTED_STIMULI_JSON || '[]'),
                selectedEvalSha256: process.env.SELECTED_EVAL_SHA256 || null
              };
              const expected = {
                baselineSkillSha256: process.env.BASELINE_SKILL_SHA256,
                treatmentSkillSha256: process.env.TREATMENT_SKILL_SHA256,
                canonicalEvalSha256: process.env.CANONICAL_EVAL_SHA256,
                vallyEvalSha256: process.env.VALLY_EVAL_SHA256,
              };
              for (const [key, value] of Object.entries(expected)) {
                if (manifest[key] !== value) throw new Error(key + ' mismatch: ' + manifest[key] + ' != ' + value);
              }
              fs.writeFileSync(process.env.RESULTS_DIR + '/comparison-inputs.json', JSON.stringify(manifest, null, 2) + '\n');
            "
          fi

          # Run both variants in a single experiment pass. With
          # baseline_skill_ref, baseline loads that checkout's skill and skilled
          # loads the current checkout's treatment skill. Otherwise the canonical
          # experiment retains its skill-free baseline.
          EXPERIMENT_OUT="$RESULTS_DIR/_experiment"
          mkdir -p "$EXPERIMENT_OUT"
          VARIANT_ARGS=()
          if [ "$TREATMENT_ONLY" = "true" ]; then
            VARIANT_ARGS=(--variant skilled)
          fi
          vally experiment run "$EXPERIMENT_FILE" \
            "${FILTER_ARGS[@]}" \
            "${VARIANT_ARGS[@]}" \
            --output-dir "$EXPERIMENT_OUT" \
            --workers 1 \
            2>&1 || echo "::warning::vally experiment run reported failures for $PLUGIN"

          RUN_DIR=$(find "$EXPERIMENT_OUT" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          if [ "$TREATMENT_ONLY" = "true" ]; then
            node eng/vally-adapter/inventory-treatment.mjs \
              --root "$EXPERIMENT_OUT" \
              --manifest "$RESULTS_DIR/treatment-inputs.json" \
              --output "$RESULTS_DIR/treatment-results-inventory.json"
          fi
          if [ -z "$RUN_DIR" ]; then
            echo "::warning::No experiment output produced for $PLUGIN"
            exit 0
          fi

          # Split the per-variant experiment output by eval and run `vally
          # compare` per skill (in the adapter) to produce the per-skill
          # results.json the shadow summary consumes. `vally` is on PATH here.
          if [ "$TREATMENT_ONLY" != "true" ]; then
            node eng/vally-adapter/adapt.mjs \
              --experiment-dir "$RUN_DIR" \
              --output-root "$RESULTS_DIR" \
              --vally "vally" \
              --model "$MODEL" \
              --judge-model "$JUDGE_MODEL" \
              --keep-comparison-evidence
          fi

          if [ "$TREATMENT_ONLY" != "true" ]; then
            # Informational shadow job: surface how many verdicts were produced.
            PRODUCED=$(find "$RESULTS_DIR" -name results.json -not -path "$EXPERIMENT_OUT/*" | wc -l | tr -d ' ')
            echo "Produced $PRODUCED skill verdict(s) for $PLUGIN"
            if [ "$PRODUCED" -eq 0 ]; then
              echo "::warning::vally produced no skill verdicts for $PLUGIN — evals failed to run or validate (see logs above)"
            fi
          fi

      - name: Upload results
        if: always() && steps.find-evals.outputs.has_evals == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vally-results-${{ matrix.entry.name }}
          path: artifacts/TestResults/vally/${{ matrix.entry.name }}/
          include-hidden-files: true
          retention-days: 14

      - name: Write summary
        if: always() && steps.find-evals.outputs.has_evals == 'true'
        env:
          ENTRY_NAME: ${{ matrix.entry.name }}
          TREATMENT_ONLY: ${{ inputs.treatment_only }}
        run: |
          echo "## 🔬 Vally Shadow Results: $ENTRY_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$TREATMENT_ONLY" = "true" ]; then
            RESULTS_DIR="artifacts/TestResults/vally/$ENTRY_NAME"
            echo "Treatment-only compliance trajectory; no baseline or pairwise comparison was executed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ -f "$RESULTS_DIR/treatment-results-inventory.json" ]; then
              node -e "
                const r=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
                console.log('- Completed treatment trajectories: ' + r.actualCount + '/' + r.expectedCount);
                console.log('- Baseline executed: ' + r.baselineExecuted);
                console.log('- Comparison evidence present: ' + r.comparisonEvidencePresent);
              " "$RESULTS_DIR/treatment-results-inventory.json" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Missing treatment result inventory" >> $GITHUB_STEP_SUMMARY
            fi
            exit 0
          fi
          echo "Skilled vs baseline, judged head-to-head by \`vally compare\`. A skill passes only on a complete comparison with a credible improvement (mean preference > 0 with its 95% CI above 0)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="artifacts/TestResults/vally/$ENTRY_NAME"
          while IFS= read -r RESULTS_JSON; do
            if [ ! -f "$RESULTS_JSON" ]; then continue; fi
            EVAL_NAME=$(basename "$(dirname "$RESULTS_JSON")")

            CONCLUSIVE=$(node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf-8')); console.log(r.verdicts[0].conclusive)" "$RESULTS_JSON")
            PASSED=$(node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf-8')); console.log(r.verdicts[0].passed)" "$RESULTS_JSON")
            REASON=$(node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf-8')); console.log(r.verdicts[0].reason)" "$RESULTS_JSON")
            if [ "$CONCLUSIVE" != "true" ]; then
              ICON="⚠️"
            elif [ "$PASSED" = "true" ]; then
              ICON="✅"
            else
              ICON="❌"
            fi

            echo "### $ICON $EVAL_NAME" >> $GITHUB_STEP_SUMMARY
            echo "$REASON" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Per-scenario table: mean preference score and win/tie/loss.
            echo "| Scenario | Mean preference | Trials (W/T/L) |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-----------------|----------------|" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf-8'));
              for (const s of r.verdicts[0].scenarios) {
                const icon = s.meanScore > 0 ? '▲' : s.meanScore < 0 ? '▼' : '=';
                const pct = (s.meanScore >= 0 ? '+' : '') + (s.meanScore * 100).toFixed(1) + '%';
                let w=0,t=0,l=0;
                for (const tr of (s.trials||[])) { if (tr.score>0) w++; else if (tr.score<0) l++; else t++; }
                console.log('| ' + icon + ' ' + s.scenarioName + ' | ' + pct + ' | ' + w + '/' + t + '/' + l + ' |');
              }
            " "$RESULTS_JSON" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done < <(find "$RESULTS_DIR" -name results.json | sort)

  consolidate:
    needs: [prepare, vally-evaluate]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download all completed shards
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vally-results-*
          path: consolidated
          merge-multiple: false

      - name: Record shard inventory
        env:
          EXPECTED_ENTRIES: ${{ needs.prepare.outputs.entries }}
        run: |
          mkdir -p consolidated
          printf '%s\n' "$EXPECTED_ENTRIES" > expected-entries.json
          node eng/vally-adapter/consolidate-smoke.mjs \
            --root consolidated \
            --expected "$EXPECTED_ENTRIES" \
            --output smoke-inventory.json

      - name: Upload consolidated smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vally-smoke-consolidated
          path: |
            consolidated/
            expected-entries.json
            smoke-inventory.json
          include-hidden-files: true
          retention-days: 14
