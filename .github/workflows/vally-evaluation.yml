# Shadow evaluation with vally — runs alongside skill-validator for comparison.
#
# This workflow reuses the gate and discover jobs from evaluation.yml via
# workflow_call, or can be triggered manually. Results are informational
# only — they never gate PRs.
#
# NOTE: This is a transitional workflow for the replat. It will be removed
# once vally fully replaces skill-validator.
name: vally-evaluation

on:
  # Triggered by the main evaluation workflow after discover completes
  workflow_call:
    inputs:
      entries:
        description: 'JSON array of matrix entries from discover job'
        required: true
        type: string
      head_sha:
        description: 'PR head SHA to checkout'
        required: false
        type: string
        default: ''
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to evaluate (e.g., dotnet-maui)'
        required: true
        type: string
      skill:
        description: 'Skill to evaluate (optional, evaluates whole plugin if empty)'
        required: false
        type: string

env:
  # Fallback model/judge used only if the experiment file's `overrides:` block
  # can't be parsed. The experiment file is the source of truth (see below).
  FALLBACK_MODEL: claude-opus-4.6
  FALLBACK_JUDGE_MODEL: claude-opus-4.6

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Group the matrix entries by plugin so we don't storm the Copilot backend.
  #
  # On a PR, discover emits one entry per changed (plugin, skill) — 85+ on a
  # large PR. Matrixing a CI job over each, every job running `vally experiment
  # run --workers 5` from only two Copilot tokens, trips rate limits. The vally
  # run step already accepts a whitespace-separated skills_path and adapt.mjs
  # already splits a multi-skill experiment back into per-skill verdicts, so we
  # can coalesce those per-skill entries into ONE entry per plugin (a single
  # experiment run) without changing anything downstream.
  #
  # Entries that already cover a whole plugin or an executionShard group (a
  # bare plugins/<p>/skills dir, or a whitespace-joined skills_path) are passed
  # through untouched — that's how scheduled runs arrive, and it preserves the
  # executionShard sharding discover applies there. For workflow_dispatch we
  # synthesize the single entry the inputs describe.
  # --------------------------------------------------------------------------
  group:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.build.outputs.entries }}
      has_entries: ${{ steps.build.outputs.has_entries }}
    steps:
      - name: Checkout skills content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || '' }}
          persist-credentials: false

      - id: build
        shell: pwsh
        env:
          ENTRIES_JSON: ${{ inputs.entries }}
          DISPATCH_PLUGIN: ${{ inputs.plugin }}
          DISPATCH_SKILL: ${{ inputs.skill }}
        run: |
          # Raw entries: synthesized for workflow_dispatch, otherwise straight
          # from discover.
          $raw = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $p = $env:DISPATCH_PLUGIN
            $s = $env:DISPATCH_SKILL
            if ($s) {
              $raw = @([pscustomobject]@{ name = "$p--$s"; plugin = $p; skills_path = "plugins/$p/skills/$s" })
            } else {
              $raw = @([pscustomobject]@{ name = $p; plugin = $p; skills_path = "plugins/$p/skills" })
            }
          } elseif ($env:ENTRIES_JSON) {
            $raw = @(ConvertFrom-Json $env:ENTRIES_JSON)
          }

          # Split into single-skill entries (to coalesce by plugin) and
          # everything else (passed through unchanged).
          $perSkill = @()
          $passthrough = @()
          foreach ($e in $raw) {
            # Never coalesce an executionShard bucket that discover already
            # produced (named "<plugin>--shard-<bucket>"), even if it holds a
            # single skill — that would undo the shard split.
            if ($e.name -match '--shard-') { $passthrough += $e; continue }
            $tokens = @([string]$e.skills_path -split '\s+' | Where-Object { $_ })
            if ($tokens.Count -eq 1 -and $tokens[0] -match '^plugins/([^/]+)/skills/(.+)$') {
              $plugin = $Matches[1]; $skill = $Matches[2]
              # agent.* skills are excluded from the experiment's evals: glob, and
              # a skill without a vally eval would make --eval-filter match
              # nothing and fail the whole plugin run — drop both here.
              if ($skill -like 'agent.*') { continue }
              if (-not (Test-Path "tests/$plugin/$skill/eval.vally.yaml")) {
                Write-Host "Skipping $plugin/$skill — no tests/$plugin/$skill/eval.vally.yaml"
                continue
              }
              $perSkill += [pscustomobject]@{ plugin = $plugin; skills_path = $tokens[0] }
            } else {
              $passthrough += $e
            }
          }

          $grouped = @($perSkill | Group-Object -Property plugin | ForEach-Object {
            [pscustomobject]@{
              name        = $_.Name
              plugin      = $_.Name
              skills_path = (($_.Group | ForEach-Object { $_.skills_path }) -join ' ')
            }
          })

          $entries = @($grouped) + @($passthrough)
          if (-not $entries -or $entries.Count -eq 0) {
            Write-Host "No vally entries to evaluate"
            "entries=[]" >> $env:GITHUB_OUTPUT
            "has_entries=false" >> $env:GITHUB_OUTPUT
          } else {
            $json = $entries | ConvertTo-Json -Compress -AsArray
            Write-Host "Grouped $($raw.Count) discover entr(y/ies) into $($entries.Count) vally job(s):"
            Write-Host $json
            "entries=$json" >> $env:GITHUB_OUTPUT
            "has_entries=true" >> $env:GITHUB_OUTPUT
          }

  # --------------------------------------------------------------------------
  # Run vally evaluation (shadow mode)
  # --------------------------------------------------------------------------
  vally-evaluate:
    needs: [group]
    if: always() && !cancelled() && needs.group.outputs.has_entries == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    name: vally (${{ matrix.entry.name }})
    strategy:
      fail-fast: false
      # Cap concurrent Copilot sessions: max-parallel jobs * --workers per job.
      # vally has only two tokens, so keep this well below skill-validator's fan-out.
      max-parallel: 4
      matrix:
        entry: ${{ fromJson(needs.group.outputs.entries) }}

    steps:
      - name: Checkout skills content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || '' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install vally
        run: npm install -g @microsoft/vally-cli

      - name: Select Copilot token
        id: select-token
        env:
          TOKEN_1: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TOKEN_2: ${{ secrets.COPILOT_GITHUB_TOKEN_2 }}
        run: |
          TOKENS=()
          for i in 1 2; do
            var="TOKEN_$i"
            val="${!var}"
            if [ -n "$val" ]; then TOKENS+=("$val"); fi
          done
          if [ ${#TOKENS[@]} -eq 0 ]; then
            echo "::error::No COPILOT_GITHUB_TOKEN secrets are configured"
            exit 1
          fi
          IDX=$(( ${RANDOM} % ${#TOKENS[@]} ))
          echo "::add-mask::${TOKENS[$IDX]}"
          echo "token=${TOKENS[$IDX]}" >> $GITHUB_OUTPUT

      - name: Find eval specs
        id: find-evals
        env:
          DISPATCH_SKILL: ${{ inputs.skill }}
        run: |
          # For workflow_dispatch targeting a specific skill, only run that one
          # eval. Otherwise run every eval discovered under the plugin's tests
          # directory.
          if [ -n "$DISPATCH_SKILL" ]; then
            CANDIDATE="tests/${{ matrix.entry.plugin }}/${DISPATCH_SKILL}/eval.vally.yaml"
            if [ ! -f "$CANDIDATE" ]; then
              echo "::error::workflow_dispatch requested skill '${DISPATCH_SKILL}' in plugin '${{ matrix.entry.plugin }}' but no eval spec exists at '${CANDIDATE}'. Check the skill name (case-sensitive) and that the eval file is present."
              exit 1
            fi
            EVALS="$CANDIDATE"
          else
            EVALS=$(find tests/${{ matrix.entry.plugin }} -name "eval.vally.yaml" -type f | sort)
          fi
          if [ -z "$EVALS" ]; then
            echo "No eval.vally.yaml files found for ${{ matrix.entry.plugin }}"
            echo "has_evals=false" >> $GITHUB_OUTPUT
          else
            echo "has_evals=true" >> $GITHUB_OUTPUT
            echo "Found $(echo "$EVALS" | wc -l | tr -d ' ') eval specs"
          fi

      - name: Run vally evaluations
        if: steps.find-evals.outputs.has_evals == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
          RESULTS_DIR: artifacts/TestResults/vally/${{ matrix.entry.name }}
        run: |
          PLUGIN="${{ matrix.entry.plugin }}"
          SKILLS_PATH="${{ matrix.entry.skills_path }}"

          # Scope the canonical experiment with --eval-filter (repeatable),
          # which intersects each pattern with the experiment's `evals:` glob.
          # `agent.*` evals are excluded by that glob, so they drop out
          # automatically; a missing plugins/<plugin>/skills/<skill> dir surfaces
          # as a skilled-variant failure that adapt.mjs warns on.
          #
          # Honor the matrix entry's skills_path so per-skill PR entries and
          # sharded entries run only their targeted skills, not the whole plugin:
          #   plugins/<plugin>/skills            -> tests/<plugin>/**   (whole plugin)
          #   plugins/<plugin>/skills/<skill>    -> tests/<plugin>/<skill>
          # A workflow_dispatch skill input overrides to that single skill.
          FILTER_ARGS=()
          if [ -n "${{ inputs.skill }}" ]; then
            FILTER_ARGS=(--eval-filter "tests/$PLUGIN/${{ inputs.skill }}/eval.vally.yaml")
          else
            for token in $SKILLS_PATH; do
              rel="${token#plugins/}"       # <plugin>/skills[/<skill>]
              tp="${rel%%/skills*}"         # <plugin>
              skill="${rel#*/skills}"       # "" or "/<skill>"
              skill="${skill#/}"            # "" or "<skill>"
              if [ -n "$skill" ]; then
                FILTER_ARGS+=(--eval-filter "tests/$tp/$skill/eval.vally.yaml")
              else
                FILTER_ARGS+=(--eval-filter "tests/$tp/**/eval.vally.yaml")
              fi
            done
          fi
          if [ ${#FILTER_ARGS[@]} -eq 0 ]; then
            FILTER_ARGS=(--eval-filter "tests/$PLUGIN/**/eval.vally.yaml")
          fi

          # Model + comparison-judge model come from the experiment file's
          # `overrides:` block (single source of truth), matching run-vally-evals.sh.
          read_override() {
            awk -v k="$1" '
              /^overrides:/ { f = 1; next }
              /^[^[:space:]]/ { f = 0 }
              f && $1 == k":" { print $2; exit }
            ' dotnet-skills.experiment.yaml
          }
          MODEL="$(read_override model)"; MODEL="${MODEL:-${{ env.FALLBACK_MODEL }}}"
          JUDGE_MODEL="$(read_override judge_model)"; JUDGE_MODEL="${JUDGE_MODEL:-${{ env.FALLBACK_JUDGE_MODEL }}}"

          # Run baseline (no skills) + skilled (the one skill) in a single
          # experiment pass. The baseline is a true skill-free control because
          # vally does no ambient skill discovery — skills load only from
          # environment.skills.
          EXPERIMENT_OUT="$RESULTS_DIR/_experiment"
          mkdir -p "$EXPERIMENT_OUT"
          vally experiment run dotnet-skills.experiment.yaml \
            "${FILTER_ARGS[@]}" \
            --output-dir "$EXPERIMENT_OUT" \
            --workers 5 \
            2>&1 || echo "::warning::vally experiment run reported failures for $PLUGIN"

          RUN_DIR=$(find "$EXPERIMENT_OUT" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          if [ -z "$RUN_DIR" ]; then
            echo "::warning::No experiment output produced for $PLUGIN"
            exit 0
          fi

          # Split the per-variant experiment output by eval and run `vally
          # compare` per skill (in the adapter) to produce the per-skill
          # results.json the shadow summary consumes. `vally` is on PATH here.
          node eng/vally-adapter/adapt.mjs \
            --experiment-dir "$RUN_DIR" \
            --output-root "$RESULTS_DIR" \
            --vally "vally" \
            --model "$MODEL" \
            --judge-model "$JUDGE_MODEL"

          # Informational shadow job: surface how many verdicts were produced.
          PRODUCED=$(find "$RESULTS_DIR" -name results.json -not -path "$EXPERIMENT_OUT/*" | wc -l | tr -d ' ')
          echo "Produced $PRODUCED skill verdict(s) for $PLUGIN"
          if [ "$PRODUCED" -eq 0 ]; then
            echo "::warning::vally produced no skill verdicts for $PLUGIN — evals failed to run or validate (see logs above)"
          fi

      - name: Upload results
        if: always() && steps.find-evals.outputs.has_evals == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vally-results-${{ matrix.entry.name }}
          path: artifacts/TestResults/vally/${{ matrix.entry.name }}/
          include-hidden-files: true
          retention-days: 14

      - name: Write summary
        if: always() && steps.find-evals.outputs.has_evals == 'true'
        run: |
          echo "## 🔬 Vally Shadow Results: ${{ matrix.entry.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Skilled vs baseline, judged head-to-head by \`vally compare\`. A skill passes only on a credible improvement (mean preference > 0 with its 95% CI above 0)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="artifacts/TestResults/vally/${{ matrix.entry.name }}"
          while IFS= read -r RESULTS_JSON; do
            if [ ! -f "$RESULTS_JSON" ]; then continue; fi
            EVAL_NAME=$(basename $(dirname "$RESULTS_JSON"))

            PASSED=$(node -e "const r=JSON.parse(require('fs').readFileSync('$RESULTS_JSON','utf-8')); console.log(r.verdicts[0].passed)")
            REASON=$(node -e "const r=JSON.parse(require('fs').readFileSync('$RESULTS_JSON','utf-8')); console.log(r.verdicts[0].reason)")
            ICON=$([ "$PASSED" = "true" ] && echo "✅" || echo "❌")

            echo "### $ICON $EVAL_NAME" >> $GITHUB_STEP_SUMMARY
            echo "$REASON" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Per-scenario table: mean preference score and win/tie/loss.
            echo "| Scenario | Mean preference | Trials (W/T/L) |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-----------------|----------------|" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = JSON.parse(require('fs').readFileSync('$RESULTS_JSON', 'utf-8'));
              for (const s of r.verdicts[0].scenarios) {
                const icon = s.meanScore > 0 ? '▲' : s.meanScore < 0 ? '▼' : '=';
                const pct = (s.meanScore >= 0 ? '+' : '') + (s.meanScore * 100).toFixed(1) + '%';
                let w=0,t=0,l=0;
                for (const tr of (s.trials||[])) { if (tr.score>0) w++; else if (tr.score<0) l++; else t++; }
                console.log('| ' + icon + ' ' + s.scenarioName + ' | ' + pct + ' | ' + w + '/' + t + '/' + l + ' |');
              }
            " >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done < <(find "$RESULTS_DIR" -name results.json | sort)
